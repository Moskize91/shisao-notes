an-zhuxi"]},{"id":"seg-024:1-4:曷又极止","segmentId":"seg-024","segmentOrder":24,"surfaceText":"曷又极止","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-8"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-024:3-3:极","segmentId":"seg-024","segmentOrder":24,"surfaceText":"极","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-9"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？","sourceLabel":"第 212-214 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。","fullText":"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId": \"]},{\"id\":\"seg-022:1-4:匪媒不得\",\"segmentId\":\"seg-022\",\"segmentOrder\":22,\"surfaceText\":\"匪媒不得\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-023:1-4:既曰得止\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"既曰得止\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:曷又极止\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"曷又极止\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:3-3:极\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"极\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？\",\"sourceLabel\":\"第 212-214 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。\",\"fullText\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？\",\"sourceLabel\":\"第 212-214 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？\",\"fullText\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:南山崔崔\",\"seg-002:1-4:雄狐绥绥\",\"seg-003:1-4:鲁道有荡\",\"seg-004:1-4:齐子由归\",\"seg-005:1-4:既曰归止\",\"seg-006:1-4:曷又怀止\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\"],\"segmentIds\":[\"s ",\"anchor-8-5\",\"anchor-8-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？\",\"sourceLabel\":\"第 212-214 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"fullText\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"notes\":null,\"partOrder\":9,\"anchorIds\":[\"seg-019:1-2:析薪\",\"seg-020:4-4:克\",\"seg-024:3-3:极\"],\"glossAnchorIds\":[\"anchor-9-1\",\"anchor-9-2\",\"anchor-9-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺襄公淫其妹而魯不能禁也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺襄公淫其妹而魯不能禁也。\",\"fullText\":\"刺襄公淫其妹而魯不能禁也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《南山》四章，章六句。此詩直刺文姜，事甚顯。而解者猶紛紛不一，豈不怪哉？《小序》謂「刺襄公」，只籠統言之。《集傳》分「前二章刺齊襄，後二章刺魯桓」，姚氏以爲「未免割裂，辭意不貫」。季明德則謂「通篇刺文姜」，而「雄狐」句又無着。何玄子謂「首章首二句刺齊襄，首章『懷』字刺文姜，二章刺魯桓，下二章又追原其夫婦成昏之始」，則尤穿鑿不自然。惟嚴氏粲謂「通篇刺魯桓」，蓋謂齊人不當以「雄狐」目其君也。其曰「雄狐綏綏然求匹，喻魯桓求昏于齊也」，又曰「齊人不敢斥言其君之惡，而歸咎于魯之辭也。辭雖歸咎于魯，所以刺襄公者深矣」。姚氏取之，以爲「如此則辭旨歸一，而意亦周匝」。愚意殊不謂然。試問此事豈一人咎哉？魯桓、文姜、齊襄三人者，皆千古無恥人也。使其有一知恥，則其淫斷斷不至於此極。故此詩不可謂專刺一人也。首章言襄公縱淫，不當自淫其妹。妹既歸人而有夫矣，則亦可以已矣，而又曷懷之有乎？次章言文姜即淫，亦不當順從其兄。今既歸魯而成耦矣，則亦可以已矣，而又曷返齊而從兄乎？後二章言魯桓以父母命，憑媒妁言而成此昏配，非苟合者比，豈不有聞其兄妹事乎？既取而得之，則當禮以閑之，俾勿歸齊，則亦可以已矣，而又曷從其入齊，至令得窮所欲而無止極，自取殺身禍乎？故欲言襄公之淫，則以雄狐起興；欲言文姜成耦，則以冠履之雙者爲興；欲言魯桓被禍，則先以「蓺麻」興告父母以臨之，「析薪」興媒妁以鼓之，而無如魯桓之懦而無志也。何哉？詩人之大不平也。故不覺發而爲詩，亦將使千秋萬世後，知有此無恥三人而已。又何暇爲之掩飾其辭而歸咎於一哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《南山》四章，章六句。此詩直刺文姜，事甚顯。而解者猶紛紛不一，豈不怪哉？《小序》謂「刺襄公」，只籠統言之。《集傳》分「前二章刺齊襄，後二章刺魯桓」，姚氏以爲「未免割裂，辭意不貫」。季明德則謂「通篇刺文姜」，而「雄狐」句又無着。何玄子謂「首章首二句刺齊襄，首章『懷』字刺文姜，二章刺魯桓，下二章又追原其夫婦成昏之始」，則尤穿鑿不自然。惟嚴氏粲謂「通篇刺魯桓」，蓋謂齊人不當以「雄狐」目其君也。其曰「雄狐綏綏然求匹，喻魯桓求昏于齊也」，又曰「齊人不敢斥言其君之惡，而歸咎于魯之辭也。辭雖歸咎于魯，所以刺襄公者深矣」。姚氏取之，以爲「如此則辭旨歸一，而意亦周匝」。愚意殊不謂然。試問此事豈一人咎哉？魯桓、文姜、齊襄三人者，皆千古無恥人也。使其有一知恥，則其淫斷斷不至於此極。故此詩不可謂專刺一人也。首章言襄公縱淫，不當自淫其妹。妹既歸人而有夫矣，則亦可以已矣，而又曷懷之有乎？次章言文姜即淫，亦不當順從其兄。今既歸魯而成耦矣，則亦可以已矣，而又曷返齊而從兄乎？後二章言魯桓以父母命，憑媒妁言而成此昏配，非苟合者比，豈不有聞其兄妹事乎？既取而得之，則當禮以閑之，俾勿歸齊，則亦可以已矣，而又曷從其入齊，至令得窮所欲而無止極，自取殺身禍乎？故欲言襄公之淫，則以雄狐起興；欲言文姜成耦，則以冠履之雙者爲興；欲言魯桓被禍，則先以「蓺麻」興告父母以臨之，「析薪」興媒妁以鼓之，而無如魯桓之懦而無志也。何哉？詩人之大不平也。故不覺發而爲詩，亦將使千秋萬世後，知有此無恥三人而已。又何暇爲之掩飾其辭而歸咎於一哉？\",\"fullText\":\"右《南山》四章，章六句。此詩直刺文姜，事甚顯。而解者猶紛紛不一，豈不怪哉？《小序》謂「刺襄公」，只籠統言之。《集傳》分「前二章刺齊襄，後二章刺魯桓」，姚氏以爲「未免割裂，辭意不貫」。季明德則謂「通篇刺文姜」，而「雄狐」句又無着。何玄子謂「首章首二句刺齊襄，首章『懷』字刺文姜，二章刺魯桓，下二章又追原其夫婦成昏之始」，則尤穿鑿不自然。惟嚴氏粲謂「通篇刺魯桓」，蓋謂齊人不當以「雄狐」目其君也。其曰「雄狐綏綏然求匹，喻魯桓求昏于齊也」，又曰「齊人不敢斥言其君之惡，而歸咎于魯之辭也。辭雖歸咎于魯，所以刺襄公者深矣」。姚氏取之，以爲「如此則辭旨歸一，而意亦周匝」。愚意殊不謂然。試問此事豈一人咎哉？魯桓、文姜、齊襄三人者，皆千古無恥人也。使其有一知恥，則其淫斷斷不至於此極。故此詩不可謂專刺一人也。首章言襄公縱淫，不當自淫其妹。妹既歸人而有夫矣，則亦可以已矣，而又曷懷之有乎？次章言文姜即淫，亦不當順從其兄。今既歸魯而成耦矣，則亦可以已矣，而又曷返齊而從兄乎？後二章言魯桓以父母命，憑媒妁言而成此昏配，非苟合者比，豈不有聞其兄妹事乎？既取而得之，則當禮以閑之，俾勿歸齊，則亦可以已矣，而又曷從其入齊，至令得窮所欲而無止極，自取殺身禍乎？故欲言襄公之淫，則以雄狐起興；欲言文姜成耦，則以冠履之雙者爲興；欲言魯桓被禍，則先以「蓺麻」興告父母以臨之，「析薪」興媒妁以鼓之，而無如魯桓之懦而無志也。何哉？詩人之大不平也。故不覺發而爲詩，亦將使千秋萬世後，知有此無恥三人而已。又何暇爲之掩飾其辭而歸咎於一哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"雄狐狐，邪媚之獸，故以比襄公。〔孔氏穎達曰〕對文則飛曰雌雄，走曰牝牡。散則可以相通。《左傳》曰「獲其雄狐」，亦謂牡爲雄也。綏綏求匹之貌。魯道適魯之道也。〔馮氏京曰〕《水經注》：「汶水南逕鉅平縣故城東西南流，城東有魯道。《詩》所謂『魯道有蕩』。今汶水上夾水有文姜臺。」齊子指文姜也。兩二屨也。〔孔氏穎達曰〕屨必兩隻相配，故以一兩爲一物。〔曹氏粹中曰〕《屨人》「辨外内命夫命婦之命屨、功屨、散屨」注云：「有纁屨、黄屨、白屨、黑屨、散屨，所謂五兩也。」〔姚氏際恒云〕五伍通，參伍之伍。葛屨相伍必兩，冠緌必雙。下句不用「伍」字，即承上意，而以「止」字足之。亦通。緌冠上飾也。〔許氏謙曰〕禮書，二組屬於笄，順頤而下結之謂之纓，纓之垂者謂之緌。庸用也。蓺樹也。衡從〔陸氏德明曰〕衡，亦作横。《韓詩》云「東西耕曰横」。從，《韓詩》作「由」，云「南北耕曰由」。〔曹氏粹中曰〕《齊民要術》云：「種麻欲得良田，耕不厭熟。縱横七遍以上，則麻生無葉。衡從其畝，蓋古法也。」鞠窮也。克能也。極亦窮也。又至也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"雄狐狐，邪媚之獸，故以比襄公。〔孔氏穎達曰〕對文則飛曰雌雄，走曰牝牡。散則可以相通。《左傳》曰「獲其雄狐」，亦謂牡爲雄也。\",\"fullText\":\"雄狐狐，邪媚之獸，故以比襄公。〔孔氏穎達曰〕對文則飛曰雌雄，走曰 ":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-023:1-4:既曰得止\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"既曰得止\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:曷又极止\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"曷又极止\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:3-3:极\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"极\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？\",\"sourceLabel\":\"第 212-214 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。\",\"fullText\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？\",\"sourceLabel\":\"第 212-214 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？\",\"fullText\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:南山崔崔\",\"seg-002:1-4:雄狐绥绥\",\"seg-003:1-4:鲁道有荡\",\"seg-004:1-4:齐子由归\",\"seg-005:1-4:既曰归止\",\"seg-006:1-4:曷又怀止\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\" ",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？\",\"sourceLabel\":\"第 212-214 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"fullText\":\"这是一首讽刺齐襄公淫乱无耻的诗。左传桓公十八年记齐襄公与文姜私通之事，这桩丑闻在齐国传开，引起人民憎恶，便产生了这首诗。由于这是讽刺斥责本国的君主，所以诗写得比较隐蔽。首章以南山、雄狐起兴，二章以葛履、冠緌起兴，三章以艺麻起兴，四章以析薪起兴，每章末句均用设问式加强讽刺力量。南山崔崔，雄狐绥绥。鲁道有荡，齐子由归。既曰归止，曷又怀止？崔崔，高大貌。雄狐，古人以雄狐为淫兽。绥绥，追逐匹偶貌。鲁道，指从齐国到鲁国的大道。有荡，即荡荡，平坦。齐子，指文姜。由归，出嫁。怀，想念。葛屦五两，冠緌双止。鲁道有荡，齐子庸止。既曰庸止，曷又从止？葛屦，麻布鞋。五两，指麻鞋成双并排。冠緌，古代贵族冠带下垂部分。庸，用。从，跟从。艺麻如之何？衡从其亩。取妻如之何？必告父母。既曰告止，曷又鞠止？艺，种植。衡从，即横纵。鞠，穷。析薪如之何？匪斧不克。取妻如之何？匪媒不得。既曰得止，曷又极止？析薪，古代常以析薪指婚姻。克，能，成功。极，与上章“鞠”同义。\",\"notes\":null,\"partOrder\":9,\"anchorIds\":[\"seg-019:1-2:析薪\",\"seg-020:4-4:克\",\"seg-024:3-3:极\"],\"glossAnchorIds\":[\"anchor-9-1\",\"anchor-9-2\",\"anchor-9-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺襄公淫其妹而魯不能禁也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺襄公淫其妹而魯不能禁也。\",\"fullText\":\"刺襄公淫其妹而魯不能禁也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《南山》四章，章六句。此詩直刺文姜，事甚顯。而解者猶紛紛不一，豈不怪哉？《小序》謂「刺襄公」，只籠統言之。《集傳》分「前二章刺齊襄，後二章刺魯桓」，姚氏以爲「未免割裂，辭意不貫」。季明德則謂「通篇刺文姜」，而「雄狐」句又無着。何玄子謂「首章首二句刺齊襄，首章『懷』字刺文姜，二章刺魯桓，下二章又追原其夫婦成昏之始」，則尤穿鑿不自然。惟嚴氏粲謂「通篇刺魯桓」，蓋謂齊人不當以「雄狐」目其君也。其曰「雄狐綏綏然求匹，喻魯桓求昏于齊也」，又曰「齊人不敢斥言其君之惡，而歸咎于魯之辭也。辭雖歸咎于魯，所以刺襄公者深矣」。姚氏取之，以爲「如此則辭旨歸一，而意亦周匝」。愚意殊不謂然。試問此事豈一人咎哉？魯桓、文姜、齊襄三人者，皆千古無恥人也。使其有一知恥，則其淫斷斷不至於此極。故此詩不可謂專刺一人也。首章言襄公縱淫，不當自淫其妹。妹既歸人而有夫矣，則亦可以已矣，而又曷懷之有乎？次章言文姜即淫，亦不當順從其兄。今既歸魯而成耦矣，則亦可以已矣，而又曷返齊而從兄乎？後二章言魯桓以父母命，憑媒妁言而成此昏配，非苟合者比，豈不有聞其兄妹事乎？既取而得之，則當禮以閑之，俾勿歸齊，則亦可以已矣，而又曷從其入齊，至令得窮所欲而無止極，自取殺身禍乎？故欲言襄公之淫，則以雄狐起興；欲言文姜成耦，則以冠履之雙者爲興；欲言魯桓被禍，則先以「蓺麻」興告父母以臨之，「析薪」興媒妁以鼓之，而無如魯桓之懦而無志也。何哉？詩人之大不平也。故不覺發而爲詩，亦將使千秋萬世後，知有此無恥三人而已。又何暇爲之掩飾其辭而歸咎於一哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《南山》四章，章六句。此詩直刺文姜，事甚顯。而解者猶紛紛不一，豈不怪哉？《小序》謂「刺襄公」，只籠統言之。《集傳》分「前二章刺齊襄，後二章刺魯桓」，姚氏以爲「未免割裂，辭意不貫」。季明德則謂「通篇刺文姜」，而「雄狐」句又無着。何玄子謂「首章首二句刺齊襄，首章『懷』字刺文姜，二章刺魯桓，下二章又追原其夫婦成昏之始」，則尤穿鑿不自然。惟嚴氏粲謂「通篇刺魯桓」，蓋謂齊人不當以「雄狐」目其君也。其曰「雄狐綏綏然求匹，喻魯桓求昏于齊也」，又曰「齊人不敢斥言其君之惡，而歸咎于魯之辭也。辭雖歸咎于魯，所以刺襄公者深矣」。姚氏取之，以爲「如此則辭旨歸一，而意亦周匝」。愚意殊不謂然。試問此事豈一人咎哉？魯桓、文姜、齊襄三人者，皆千古無恥人也。使其有一知恥，則其淫斷斷不至於此極。故此詩不可謂專刺一人也。首章言襄公縱淫，不當自淫其妹。妹既歸人而有夫矣，則亦可以已矣，而又曷懷之有乎？次章言文姜即淫，亦不當順從其兄。今既歸魯而成耦矣，則亦可以已矣，而又曷返齊而從兄乎？後二章言魯桓以父母命，憑媒妁言而成此昏配，非苟合者比，豈不有聞其兄妹事乎？既取而得之，則當禮以閑之，俾勿歸齊，則亦可以已矣，而又曷從其入齊，至令得窮所欲而無止極，自取殺身禍乎？故欲言襄公之淫，則以雄狐起興；欲言文姜成耦，則以冠履之雙者爲興；欲言魯桓被禍，則先以「蓺麻」興告父母以臨之，「析薪」興媒妁以鼓之，而無如魯桓之懦而無志也。何哉？詩人之大不平也。故不覺發而爲詩，亦將使千秋萬世後，知有此無恥三人而已。又何暇爲之掩飾其辭而歸咎於一哉？\",\"fullText\":\"右《南山》四章，章六句。此詩直刺文姜，事甚顯。而解者猶紛紛不一，豈不怪哉？《小序》謂「刺襄公」，只籠統言之。《集傳》分「前二章刺齊襄，後二章刺魯桓」，姚氏以爲「未免割裂，辭意不貫」。季明德則謂「通篇刺文姜」，而「雄狐」句又無着。何玄子謂「首章首二句刺齊襄，首章『懷』字刺文姜，二章刺魯桓，下二章又追原其夫婦成昏之始」，則尤穿鑿不自然。惟嚴氏粲謂「通篇刺魯桓」，蓋謂齊人不當以「雄狐」目其君也。其曰「雄狐綏綏然求匹，喻魯桓求昏于齊也」，又曰「齊人不敢斥言其君之惡，而歸咎于魯之辭也。辭雖歸咎于魯，所以刺襄公者深矣」。姚氏取之，以爲「如此則辭旨歸一，而意亦周匝」。愚意殊不謂然。試問此事豈一人咎哉？魯桓、文姜、齊襄三人者，皆千古無恥人也。使其有一知恥，則其淫斷斷不至於此極。故此詩不可謂專刺一人也。首章言襄公縱淫，不當自淫其妹。妹既歸人而有夫矣，則亦可以已矣，而又曷懷之有乎？次章言文姜即淫，亦不當順從其兄。今既歸魯而成耦矣，則亦可以已矣，而又曷返齊而從兄乎？後二章言魯桓以父母命，憑媒妁言而成此昏配，非苟合者比，豈不有聞其兄妹事乎？既取而得之，則當禮以閑之，俾勿歸齊，則亦可以已矣，而又曷從其入齊，至令得窮所欲而無止極，自取殺身禍乎？故欲言襄公之淫，則以雄狐起興；欲言文姜成耦，則以冠履之雙者爲興；欲言魯桓被禍，則先以「蓺麻」興告父母以臨之，「析薪」興媒妁以鼓之，而無如魯桓之懦而無志也。何哉？詩人之大不平也。故不覺發而爲詩，亦將使千秋萬世後，知有此無恥三人而已。又何暇爲之掩飾其辭而歸咎於一哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/101-nan-shan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"雄狐狐，邪媚之獸，故以比襄公。〔孔氏穎達曰〕對文則飛曰雌雄，走曰牝牡。散則可以相通。《左傳》曰「獲其雄狐」，亦謂牡爲雄也。綏綏求匹之貌。魯道適魯之道也。〔馮氏京曰〕《水經注》：「汶水南逕鉅平縣故城東西南流，城東有魯道。《詩》所謂『魯道有蕩』。今汶水上夾水有文姜臺。」齊子指文姜也。兩二屨也。〔孔氏穎達曰〕屨必兩隻相配，故以一兩爲一物。〔曹氏粹中曰〕《屨人》「辨外内命夫命婦之命屨、功屨、散屨」注云：「有纁屨、黄屨、白屨、黑屨、散屨，所謂五兩也。」〔姚氏際恒云〕五伍通，參伍之伍。葛屨相伍必兩，冠緌必雙。下句不用「伍」字，即承上意，而以「止」字足之。亦通。緌冠上飾也。〔許氏謙曰〕禮書，二組屬於笄，順頤而下結之謂之纓，纓之垂者謂之緌。庸用也。蓺樹也。衡從〔陸氏德明曰〕衡，亦作横。《韓詩》云「東西耕曰横」。從，《韓詩》作「由」，云「南北耕曰由」。〔曹氏粹中曰〕《齊民要術》云：「種麻欲得良田，耕不厭熟。縱横七遍以上，則麻生無葉。衡從其畝，蓋古法也。」鞠窮也。克能也。極亦窮也。又至也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"雄狐狐，邪媚之獸，故以比襄公。〔孔氏穎達曰〕對文則飛曰雌雄，走曰牝牡。散則可以相通。《左傳》曰「獲其雄狐」，亦謂牡爲雄也。\",\"fullText\":\"雄狐狐，邪媚之獸，故以比襄公。〔孔氏穎達曰〕對文則飛曰雌雄，走曰牝牡。散則可以相通。《左傳》曰「獲其雄狐」，亦謂牡爲雄也。綏綏求匹之貌。魯道適魯之道也。〔馮氏京曰〕《水經注》：「汶水南逕鉅平縣故城東西南流，城東有魯道。《詩》所謂『魯道有蕩』。今汶水上夾水有文姜臺。」齊子指文姜也。兩二屨也。〔孔氏穎達曰〕屨必兩隻相配，故以一兩
