{"id":"seg-012:1-4:勞心慘兮","segmentId":"seg-012","segmentOrder":12,"surfaceText":"勞心慘兮","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-8","fangyurun-yuanshi:0007-1:part-2"],"materialIds":["chengjunying-jiangjianyuan-zhuxi","fangyurun-yuanshi"]},{"id":"seg-012:3-3:慘","segmentId":"seg-012","segmentOrder":12,"surfaceText":"慘","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-10","chengjunying-jiangjianyuan-zhuxi:0001-1:part-9"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。","sourceLabel":"第 318-320 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。","fullText":"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史记》与《洛神赋》语，谓其状若游动婉蜒，可比“矫若游龙”之态。勞心，也就是忧心。悄，深忧貌。陈奂《传疏》：“《柏舟》《出车》篇皆云‘忧心悄悄’，重言曰悄悄，单言之则曰悄也。”韵读：幽、宵部通韵一一皎、僚、糾、悄。月出皓兮，佼人懰兮，舒懮受兮，勞心慅兮。皓，本义是形容日光，此处借以形容月光的明亮。说文：“皓，日出貌。”懰，妖媚。按懰是嬼的假借字。《埤苍》：“嬼，妖也。”《广韵》：“嬼，美好。”马瑞辰《通释》：“妖亦好也。”懮受，叠韵，形容女子行步舒徐娴娜。《玉篇》：“懮受，舒迟之貌。”慅，忧愁不安貌。段玉裁注以为《月出》“勞心慅兮”之慅与骚义近。韵读：幽部一一皓、懰、受、慅。月出照兮，佼人燎兮，舒夭紹兮，勞心慘兮。照，这里当形容词用，光明貌。燎，漂亮貌。朱熹《诗集传》：“燎，明也。”夭紹，叠韵，也是形容女子体态轻盈。胡承珙《毛诗后笺》引《西京赋》《南都赋》“要绍”之语，以为“夭绍”同义。慘，据戴震《毛郑诗考正》，慘字是悚字之讹，今字作躁。忧愁而烦躁不安貌。说文：“悚，愁不安也。”按此诗三章，每章都是前三句描绘月下美人的妩媚，最后一句抒发作者个人的心情，句法奇妙。韵读：宵部一一照、燎、紹、慘。","notes":"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。","sourceLabel":"第 318-320 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。","fullText":"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史记》与《洛神赋》语，谓其状若游动婉蜒，可比“矫若游龙”之态。勞心，也就是忧心。悄，深 i:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:3-3:慘\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"慘\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。\",\"fullText\":\"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史记》与《洛神赋》语，谓其状若游动婉蜒，可比“矫若游龙”之态。勞心，也就是忧心。悄，深忧貌。陈奂《传疏》：“《柏舟》《出车》篇皆云‘忧心悄悄’，重言曰悄悄，单言之则曰悄也。”韵读：幽、宵部通韵一一皎、僚、糾、悄。月出皓兮，佼人懰兮，舒懮受兮，勞心慅兮。皓，本义是形容日光，此处借以形容月光的明亮。说文：“皓，日出貌。”懰，妖媚。按懰是嬼的假借字。《埤苍》：“嬼，妖也。”《广韵》：“嬼，美好。”马瑞辰《通释》：“妖亦好也。”懮受，叠韵，形容女子行步舒徐娴娜。《玉篇》：“懮受，舒迟之貌。”慅，忧愁不安貌。段玉裁注以为《月出》“勞心慅兮”之慅与骚义近。韵读：幽部一一皓、懰、受、慅。月出照兮，佼人燎兮，舒夭紹兮，勞心慘兮。照，这里当形容词用，光明貌。燎，漂亮貌。朱熹《诗集传》：“燎，明也。”夭紹，叠韵，也是形容女子体态轻盈。胡承珙《毛诗后笺》引《西京赋》《南都赋》“要绍”之语，以为“夭绍”同义。慘，据戴震《毛郑诗考正》，慘字是悚字之讹，今字作躁。忧愁而烦躁不安貌。说文：“悚，愁不安也。”按此诗三章，每章都是前三句描绘月下美人的妩媚，最后一句抒发作者个人的心情，句法奇妙。韵读：宵部一一照、燎、紹、慘。\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。\",\"fullText\":\"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史 “燎，明也。”夭紹，叠韵，也是形容女子体态轻盈。胡承珙《毛诗后笺》引《西京赋》《南都赋》“要绍”之语，以为“夭绍”同义。慘，据戴震《毛郑诗考正》，慘字是悚字之讹，今字作躁。忧愁而烦躁不安貌。说文：“悚，愁不安也。”按此诗三章，每章都是前三句描绘月下美人的妩媚，最后一句抒发作者个人的心情，句法奇妙。韵读：宵部一一照、燎、紹、慘。\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":10,\"anchorIds\":[\"seg-009:3-3:照\",\"seg-010:3-3:燎\",\"seg-011:3-3:紹\",\"seg-012:3-3:慘\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\",\"anchor-10-3\",\"anchor-10-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"月出㊟有所思也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"月出㊟有所思也。\",\"fullText\":\"月出㊟有所思也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《月出》三章，章四句。此詩雖男女詞，而一種幽思牢愁之意，固結莫解。情念雖深，心非淫蕩。且從男意虚想，活現出一月下美人，並非實有所遇，蓋巫山洛水之濫觴也。不料諸儒認以爲真，豈不爲詩人所哂？使充是心於君親朋友之間，則忠臣、孝子、義弟、良朋，必有情難自已之處。此風詩之旨深微幽遠，託興無端，含毫有意，固非迂儒俗士所能窺也。至其用字聱牙，句句用韻，已開晉、唐幽峭一派。東萊不識，以爲方言，豈非少見多怪歟？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《月出》三章，章四句。此詩雖男女詞，而一種幽思牢愁之意，固結莫解。情念雖深，心非淫蕩。且從男意虚想，活現出一月下美人，並非實有所遇，蓋巫山洛水之濫觴也。不料諸儒認以爲真，豈不爲詩人所哂？使充是心於君親朋友之間，則忠臣、孝子、義弟、良朋，必有情難自已之處。此風詩之旨深微幽遠，託興無端，含毫有意，固非迂儒俗士所能窺也。至其用字聱牙，句句用韻，已開晉、唐幽峭一 条注脚的《月出》阅读页。\",\"text\":\"月出皎兮\\n佼人僚兮\\n舒窈糾兮\\n勞心悄兮\\n月出皓兮\\n佼人懰兮\\n舒懮受兮\\n勞心慅兮\\n月出照兮\\n佼人燎兮\\n舒夭紹兮\\n勞心慘兮\",\"inLanguage\":\"zh-Hans\",\"genre\":\"诗歌\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"诗经\"},{\"@type\":\"Thing\",\"name\":\"風\"},{\"@type\":\"Thing\",\"name\":\"陳風\"}]},{\"@type\":\"WebPage\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/143-yue-chu/#webpage\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/143-yue-chu/\",\"name\":\"月出 · 逐字注脚阅读\",\"description\":\"風 · 陳風 · 汇聚 2 种资料、8 条注脚的《月出》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/143-yue-chu/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/143-yue-chu/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tcd2,"])</script><script>self.__next_f.push([1,"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史记》与《洛神赋》语，谓其状若游动婉蜒，可比“矫若游龙”之态。勞心，也就是忧心。悄，深忧貌。陈奂《传疏》：“《柏舟》《出车》篇皆云‘忧心悄悄’，重言曰悄悄，单言之则曰悄也。”韵读：幽、宵部通韵一一皎、僚、糾、悄。月出皓兮，佼人懰兮，舒懮受兮，勞心慅兮。皓，本义是形容日光，此处借以形容月光的明亮。说文：“皓，日出貌。”懰，妖媚。按懰是嬼的假借字。《埤苍》：“嬼，妖也。”《广韵》：“嬼，美好。”马瑞辰《通释》：“妖亦好也。”懮受，叠韵，形容女子行步舒徐娴娜。《玉篇》：“懮受，舒迟之貌。”慅，忧愁不安貌。段玉裁注以为《月出》“勞心慅兮”之慅与骚义近。韵读：幽部一一皓、懰、受、慅。月出照兮，佼人燎兮，舒夭紹兮，勞心慘兮。照，这里当形容词用，光明貌。燎，漂亮貌。朱熹《诗集传》：“燎，明也。”夭紹，叠韵，也是形容女子体态轻盈。胡承珙《毛诗后笺》引《西京赋》《南都赋》“要绍”之语，以为“夭绍”同义。慘，据戴震《毛郑诗考正》，慘字是悚字之讹，今字作躁。忧愁而烦躁不安貌。说文：“悚，愁不安也。”按此诗三章，每章都是前三句描绘月下美人的妩媚，最后一句抒发作者个人的心情，句法奇妙。韵读：宵部一一照、燎、紹、慘。"])</script><script>self.__next_f.push([1,"23:Tcd2,"])</script><script>self.__next_f.push([1,"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史记》与《洛神赋》语，谓其状若游动婉蜒，可比“矫若游龙”之态。勞心，也就是忧心。悄，深忧貌。陈奂《传疏》：“《柏舟》《出车》篇皆云‘忧心悄悄’，重言曰悄悄，单言之则曰悄也。”韵读：幽、宵部通韵一一皎、僚、糾、悄。月出皓兮，佼人懰兮，舒懮受兮，勞心慅兮。皓，本义是形容日光，此处借以形容月光的明亮。说文：“皓，日出貌。”懰，妖媚。按懰是嬼的假借字。《埤苍》：“嬼，妖也。”《广韵》：“嬼，美好。”马瑞辰《通释》：“妖亦好也。”懮受，叠韵，形容女子行步舒徐娴娜。《玉篇》：“懮受，舒迟之貌。”慅，忧愁不安貌。段玉裁注以为《月出》“勞心慅兮”之慅与骚义近。韵读：幽部一一皓、懰、受、慅。月出照兮，佼人燎兮，舒夭紹兮，勞心慘兮。照，这里当形容词用，光明貌。燎，漂亮貌。朱熹《诗集传》：“燎，明也。”夭紹，叠韵，也是形容女子体态轻盈。胡承珙《毛诗后笺》引《西京赋》《南都赋》“要绍”之语，以为“夭绍”同义。慘，据戴震《毛郑诗考正》，慘字是悚字之讹，今字作躁。忧愁而烦躁不安貌。说文：“悚，愁不安也。”按此诗三章，每章都是前三句描绘月下美人的妩媚，最后一句抒发作者个人的心情，句法奇妙。韵读：宵部一一照、燎、紹、慘。"])</script><script>self.__next_f.push([1,"24:Tcd2,"])</script><script>self.__next_f.push([1,"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代 "]},{\"id\":\"seg-012:3-3:慘\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"慘\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首月下怀人的诗。毛序：“月出刺好色也。在位不好德，而说美色焉。”这首诗“好色”的意味当然是明显的，但说是讥刺就很勉强了。朱熹《诗集传》：“此亦男女相悦而相念之辞。”他的分析就比较平实。这首诗在句法、用词和韵律三方面都颇有特点。句法上每章四句，前后三句都是上二字双，下一字单；第三句上一字单，下二字双，错综变化，节奏抑扬，脱尽板滞之感。用词上除了“月”“人”“心”三个名词、“出”一个动词和“兮”一个语气词之外，其馀都是形容词，而且这些形容词在《诗经》中多不经见，可能是较多地保留了陈国方言的痕迹。通过这些词的应用活脱地描绘出一个月下美人的形象，风神摇曳，绰约多姿；而且抒发了诗人幽思牢愁，固结莫解的情怀。韵律上是通篇句句押韵，而且一韵到底（幽、宵部通韵），加上叠韵词汇的运用，委婉概括的丽词美和繁音促节的韵律美相得益彰，读起来真有赏心悦目的感受，难怪被后人推为三百篇中情诗的杰构。\",\"fullText\":\"$22\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"月出皎兮，佼人僚兮，舒窈糾兮，勞心悄兮。\",\"fullText\":\"$23\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:月出皎兮\",\"seg-002:1-4:佼人僚兮\",\"seg-003:1-4:舒窈糾兮\",\"seg-004:1-4:勞心悄兮\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"皎，形容月光洁白明亮。说文：“皎，月之白也。”佼，又作姣，佼是姣的假借字。美好。佼人，美人。段玉裁《说文解字注》：“姣谓容体壮大之好也。”僚，燎的假借字。美丽。古代方言叫“佻”，现代汉语称“俏”，都是异字同义。舒，舒缓、迟慢。形容女子举止娴雅娴娜。毛传：“舒，迟也。”马瑞辰《通释》解释舒为发声字，亦通。窈糾，叠韵，形容女子体态的苗条。胡承珙《毛诗后笺》引《史记》与《洛神赋》语，谓其状若游动婉蜒，可比“矫若游龙”之态。勞心，也就是忧心。悄，深忧貌。陈奂《传疏》：“《柏舟》《出车》篇皆云‘忧心悄悄’，重言曰悄悄，单言之则曰悄也。”\",\"fullText\":\"$24\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":3,\"anchorIds\":[\"seg-001:3-3:皎\",\"seg-002:1-1:佼\",\"seg-002:1-2:佼人\",\"seg-002:3-3:僚\",\"seg-003:1-1:舒\",\"seg-003:2-3:窈糾\",\"seg-004:1-2:勞心\",\"seg-004:3-3:悄\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\",\"anchor-3-7\",\"anchor-3-8\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-00 \",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"皓，本义是形容日光，此处借以形容月光的明亮。说文：“皓，日出貌。”懰，妖媚。按懰是嬼的假借字。《埤苍》：“嬼，妖也。”《广韵》：“嬼，美好。”马瑞辰《通释》：“妖亦好也。”懮受，叠韵，形容女子行步舒徐娴娜。《玉篇》：“懮受，舒迟之貌。”慅，忧愁不安貌。段玉裁注以为《月出》“勞心慅兮”之慅与骚义近。\",\"fullText\":\"$27\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":6,\"anchorIds\":[\"seg-005:3-3:皓\",\"seg-006:3-3:懰\",\"seg-007:2-3:懮受\",\"seg-008:3-3:慅\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\",\"anchor-6-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"月出皎兮，佼人僚兮。舒窈糾兮，勞心悄兮。月出皓兮，佼人懰兮。舒懮受兮，勞心慅兮。月出照兮，佼人燎兮。舒夭紹兮，勞心慘兮。\",\"sourceLabel\":\"第 318-320 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：幽部一一皓、懰、受、慅。\",\"fullText\":\"$28\",\"notes\":\"据 PDF 318-320 页文字层与页图互校整理；胡承珙引《史记》《洛神赋》及“夭紹”引文处字样不够稳定，相关句子作保守转述。\",\"partOrder\":7,\"anchorIds\":[\"seg-005:3-3:皓\", excerpt\":\"月出㊟有所思也。\",\"fullText\":\"月出㊟有所思也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《月出》三章，章四句。此詩雖男女詞，而一種幽思牢愁之意，固結莫解。情念雖深，心非淫蕩。且從男意虚想，活現出一月下美人，並非實有所遇，蓋巫山洛水之濫觴也。不料諸儒認以爲真，豈不爲詩人所哂？使充是心於君親朋友之間，則忠臣、孝子、義弟、良朋，必有情難自已之處。此風詩之旨深微幽遠，託興無端，含毫有意，固非迂儒俗士所能窺也。至其用字聱牙，句句用韻，已開晉、唐幽峭一派。東萊不識，以爲方言，豈非少見多怪歟？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《月出》三章，章四句。此詩雖男女詞，而一種幽思牢愁之意，固結莫解。情念雖深，心非淫蕩。且從男意虚想，活現出一月下美人，並非實有所遇，蓋巫山洛水之濫觴也。不料諸儒認以爲真，豈不爲詩人所哂？使充是心於君親朋友之間，則忠臣、孝子、義弟、良朋，必有情難自已之處。此風詩之旨深微幽遠，託興無端，含毫有意，固非迂儒俗士所能窺也。至其用字聱牙，句句用韻，已開晉、唐幽峭一派。東萊不識，以爲方言，豈非少見多怪歟？\",\"fullText\":\"右《月出》三章，章四句。此詩雖男女詞，而一種幽思牢愁之意，固結莫解。情念雖深，心非淫蕩。且從男意虚想，活現出一月下美人，並非實有所遇，蓋巫山洛水之濫觴也。不料諸儒認以爲真，豈不爲詩人所哂？使充是心於君親朋友之間，則忠臣、孝子、義弟、良朋，必有情難自已之處。此風詩之旨深微幽遠，託興無端，含毫有意，固非迂儒俗士所能窺也。至其用字聱牙，句句用韻，已開晉、唐幽峭一派。東萊不識，以爲方言，豈非少見多怪歟？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/143-yue-chu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋皎㊟月光也。佼人㊟佼與姣同，美人也。僚㊟好貌。窈㊟幽遠也。糾㊟愁結也。悄㊟憂也。〔王氏安石曰〕悄，言不説而静默。懰㊟好貌。懮受㊟俱憂思也。慅㊟猶悄也。燎㊟明也。夭紹㊟糾緊之意。慘㊟憂也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋皎㊟月光也。佼人㊟佼與姣同，美人也。僚㊟好貌。窈㊟幽遠也。糾㊟愁結也。悄㊟憂也。〔王氏安石曰〕悄，言不説而静默。懰㊟好貌。懮受㊟俱憂思也。慅㊟猶悄也。燎㊟明也。夭紹㊟糾緊之意。慘㊟憂也。\",\"fullText\":\"集釋皎㊟月光也。佼人㊟佼與姣同，美人也。僚㊟好貌。窈㊟幽遠也。糾㊟愁結也。悄㊟憂也。〔王氏安石曰〕悄，言不説而静默
