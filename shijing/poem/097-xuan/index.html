xi"]},{"id":"seg-009:1-4:子之昌兮","segmentId":"seg-009","segmentOrder":9,"surfaceText":"子之昌兮","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-009:3-3:昌","segmentId":"seg-009","segmentOrder":9,"surfaceText":"昌","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-010:1-7:遭我乎峱之阳兮","segmentId":"seg-010","segmentOrder":10,"surfaceText":"遭我乎峱之阳兮","charStart":1,"charEnd":7,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-010:6-6:阳","segmentId":"seg-010","segmentOrder":10,"surfaceText":"阳","charStart":6,"charEnd":6,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-011:1-6:并驱从两狼兮","segmentId":"seg-011","segmentOrder":11,"surfaceText":"并驱从两狼兮","charStart":1,"charEnd":6,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-011:5-5:狼","segmentId":"seg-011","segmentOrder":11,"surfaceText":"狼","charStart":5,"charEnd":5,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:1-6:揖我谓我臧兮","segmentId":"seg-012","segmentOrder":12,"surfaceText":"揖我谓我臧兮","charStart":1,"charEnd":6,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:5-5:臧","segmentId":"seg-012","segmentOrder":12,"surfaceText":"臧","charStart":5,"charEnd":5,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5","chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/097-xuan/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。","sourceLabel":"第 206-207 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。","fullText":"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。还，通“旋”，敏捷貌。毛传：“还，便捷之貌。”齐诗作营，营是儇的假借字，美好貌。与毛诗训异。遭，遇见。乎，通于，在。峱，齐国山名，在今山东临淄南。并驱，两个猎手一起驱马。从，追逐。王念孙《广雅疏证》：“从，随行也。”肩，鲁诗作貌，貌是后出字。说文引此句诗作豜。王念孙《广雅疏证》：“豜，与肩通。”毛传：“兽三岁曰肩。”按三岁之兽是指大兽。揖我谓我儇兮。儇，好身手轻捷。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。茂，本义为草木盛，引申为美，夸奖猎手技艺完美。陈奂《传疏》：“美者，谓习于田猎也。”牡，雄兽。好，指技术好。下章“臧”同义。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。昌，英俊。郑笺：“昌，佼好貌。”阳，山的南面。按古人称山南曰阳，山北曰阴，山东曰朝阳，山西曰夕阳。两狼，胡承珙《毛诗后笺》云：“首章举其大者言之。秦风‘奉时辰牡’，则田猎贵牡，故次章举所贵者言之。陆疏云狼猛捷，自是难获之兽。此所以互相夸誉，以为戏乐。”臧，善。","notes":null,"partOrder":1,"anchorIds":["seg-001:1-4:子之还兮","seg-004:5-5:儇","seg-003:1-2:并驱"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/097-xu \"id\":\"seg-012:5-5:臧\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"臧\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/097-xuan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。\",\"sourceLabel\":\"第 206-207 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。\",\"fullText\":\"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。还，通“旋”，敏捷貌。毛传：“还，便捷之貌。”齐诗作营，营是儇的假借字，美好貌。与毛诗训异。遭，遇见。乎，通于，在。峱，齐国山名，在今山东临淄南。并驱，两个猎手一起驱马。从，追逐。王念孙《广雅疏证》：“从，随行也。”肩，鲁诗作貌，貌是后出字。说文引此句诗作豜。王念孙《广雅疏证》：“豜，与肩通。”毛传：“兽三岁曰肩。”按三岁之兽是指大兽。揖我谓我儇兮。儇，好身手轻捷。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。茂，本义为草木盛，引申为美，夸奖猎手技艺完美。陈奂《传疏》：“美者，谓习于田猎也。”牡，雄兽。好，指技术好。下章“臧”同义。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。昌，英俊。郑笺：“昌，佼好貌。”阳，山的南面。按古人称山南曰阳，山北曰阴，山东曰朝阳，山西曰夕阳。两狼，胡承珙《毛诗后笺》云：“首章举其大者言之。秦风‘奉时辰牡’，则田猎贵牡，故次章举所贵者言之。陆疏云狼猛捷，自是难获之兽。此所以互相夸誉，以为戏乐。”臧，善。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:子之还兮\",\"seg-004:5-5:儇\",\"seg-003:1-2:并驱\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/097-xuan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。\",\"sourceLabel\":\"第 206-207 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。\",\"fullText\":\"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。还，通“旋”，敏捷貌。毛传：“还，便捷之貌。”齐诗作营，营是儇的假借字，美好貌。与毛诗训异。遭，遇见。乎，通于，在。峱，齐国山名，在今山东临淄南。并驱，两个猎手一起驱马。从，追逐。王念孙《广雅疏证》：“从，随行也。”肩，鲁诗作貌，貌是后出字。说文引此句诗作豜。王念孙《广雅疏证》：“豜，与肩通。”毛传：“兽三岁曰肩。”按三岁之兽是指大兽。揖我谓我儇兮。儇，好身手轻捷。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。茂，本义为草木盛，引申为美，夸奖猎手技艺完美。陈奂《传疏》：“美者，谓习于田猎也。”牡，雄兽。好，指技术好。下章“臧”同义。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。昌，英俊。郑笺：“昌，佼好貌。”阳，山的南面。按古人称山南曰阳，山北曰阴，山东曰朝阳，山西曰夕阳。两狼，胡承珙《毛诗后笺》云：“首章举其大者言之。秦风‘奉时辰牡’，则田猎贵牡，故次章举所贵者言之。陆疏云狼猛捷，自是难获之兽。此所以互相夸誉，以为戏乐。”臧，善。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:子之还兮\",\"seg-002:1-7:遭我乎峱之间兮\",\"seg-003:1-6:并驱从两肩兮\",\"seg-004:1-6:揖 ine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺齊俗以弋獵相矜尚也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺齊俗以弋獵相矜尚也。\",\"fullText\":\"刺齊俗以弋獵相矜尚也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/097-xuan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《還》三章，章四句。《序》謂「刺哀公」。然詩無「君」、「公」字，胡以知其然耶？此不過獵者互相稱譽，詩人從旁微哂，因直述其詞，不加一語，自成篇章，而齊俗急功利、喜夸詐之風，自在言外，亦不刺之刺也。至其用筆之妙，則章氏潢云：「子之還兮」，己譽人也；「謂我儇兮」，人譽己也；「並驅」，則人己皆與有能也。寥寥數語，自具分合變化之妙。獵固便捷，詩亦輕利。神乎技矣！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《還》三章，章四句。《序》謂「刺哀公」。然詩無「君」、「公」字，胡以知其然耶？此不過獵者互相稱譽，詩人從旁微哂，因直述其詞，不加一語，自成篇章，而齊俗急功利、喜夸詐之風，自在言外，亦不刺之刺也。至其用筆之妙，則章氏潢云：「子之還兮」，己譽人也；「謂我儇兮」，人譽己也；「並驅」，則人己皆與有能也。寥寥數語，自具分合變化之妙。獵固便捷，詩亦輕利。神乎技矣！\",\"fullText\":\"右《還》三章，章四句。《序》謂「刺哀公」。然詩無「君」、「公」字，胡以知其然耶？此不過獵者互相稱譽，詩人從旁微哂，因直述其詞，不加一語，自成篇章，而齊俗急功利、喜夸詐之風，自在言外，亦不刺之刺也。至其用筆之妙，則章氏潢云：「子之還兮」，己譽人也；「謂我儇兮」，人譽己也；「並驅」，則人己皆與有能也。寥寥數語，自具分合變化之妙。獵固便捷，詩亦輕利。神乎技矣！\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/097-xuan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"還便捷之貌。峱山名。〔許氏慎曰〕峱山，在齊地。從逐也。肩〔陸氏德明曰〕肩，《説文》云：「三歲豕，肩相及者。」本亦作豜，音同。〔孔氏穎達曰〕《大司馬》云「大獸公之」，《七月》云「獻豜于公」，則肩是大獸。儇利也。茂美也。昌盛也。狼獸名，似犬。〔孔氏穎達曰〕舍人曰：「狼，牡名貛，牝名狼。」臧善也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋 ceLabel\":\"第 206-207 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。\",\"fullText\":\"这是猎人互相赞美的诗。齐地多山，狩猎为人民谋生的一种手段，故对于身子矫健的猎手颇为赞美。毛序：“还，刺荒也。哀公好田猎，从禽兽而无厌。国人化之，遂成风俗，习于田猎谓之贤，闲于驰逐谓之好焉。”但是诗中唯见推许之词，未闻讥刺之意。崔述《读风偶识》云：“疑作序者之意但以录此诗为刺之，非以作此诗为刺之，不必附会而为之说也。”他的分析是很通达的。方玉润《诗经原始》引章潢曰：“子之还兮，己誉人也。谓我儇兮，人誉己也。并驱，则人、己皆与有能也。”寥寥数语，自具分合变化之妙。猎固便捷，诗亦轻利，神乎技矣！这首诗的好处便在于轻利。第一句四言，第二句七言，后两句六言，长短错杂，短以取劲，长以取切，一种不受束缚的豪爽之气脱口而出。尤其是每章后两句，并肩驰马，拱手相许，写出一个英武潇洒的猎人形象。与风诗中缠绵悱恻的情歌相比，又别具一种气度。子之还兮，遭我乎峱之间兮。并驱从两肩兮，揖我谓我儇兮。还，通“旋”，敏捷貌。毛传：“还，便捷之貌。”齐诗作营，营是儇的假借字，美好貌。与毛诗训异。遭，遇见。乎，通于，在。峱，齐国山名，在今山东临淄南。并驱，两个猎手一起驱马。从，追逐。王念孙《广雅疏证》：“从，随行也。”肩，鲁诗作貌，貌是后出字。说文引此句诗作豜。王念孙《广雅疏证》：“豜，与肩通。”毛传：“兽三岁曰肩。”按三岁之兽是指大兽。揖我谓我儇兮。儇，好身手轻捷。子之茂兮，遭我乎峱之道兮。并驱从两牡兮，揖我谓我好兮。茂，本义为草木盛，引申为美，夸奖猎手技艺完美。陈奂《传疏》：“美者，谓习于田猎也。”牡，雄兽。好，指技术好。下章“臧”同义。子之昌兮，遭我乎峱之阳兮。并驱从两狼兮，揖我谓我臧兮。昌，英俊。郑笺：“昌，佼好貌。”阳，山的南面。按古人称山南曰阳，山北曰阴，山东曰朝阳，山西曰夕阳。两狼，胡承珙《毛诗后笺》云：“首章举其大者言之。秦风‘奉时辰牡’，则田猎贵牡，故次章举所贵者言之。陆疏云狼猛捷，自是难获之兽。此所以互相夸誉，以为戏乐。”臧，善。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:子之还兮\",\"seg-004:5-5:儇\",\"seg-003:1-2:并驱\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/097-xuan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\ 。至其用筆之妙，則章氏潢云：「子之還兮」，己譽人也；「謂我儇兮」，人譽己也；「並驅」，則人己皆與有能也。寥寥數語，自具分合變化之妙。獵固便捷，詩亦輕利。神乎技矣！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《還》三章，章四句。《序》謂「刺哀公」。然詩無「君」、「公」字，胡以知其然耶？此不過獵者互相稱譽，詩人從旁微哂，因直述其詞，不加一語，自成篇章，而齊俗急功利、喜夸詐之風，自在言外，亦不刺之刺也。至其用筆之妙，則章氏潢云：「子之還兮」，己譽人也；「謂我儇兮」，人譽己也；「並驅」，則人己皆與有能也。寥寥數語，自具分合變化之妙。獵固便捷，詩亦輕利。神乎技矣！\",\"fullText\":\"右《還》三章，章四句。《序》謂「刺哀公」。然詩無「君」、「公」字，胡以知其然耶？此不過獵者互相稱譽，詩人從旁微哂，因直述其詞，不加一語，自成篇章，而齊俗急功利、喜夸詐之風，自在言外，亦不刺之刺也。至其用筆之妙，則章氏潢云：「子之還兮」，己譽人也；「謂我儇兮」，人譽己也；「並驅」，則人己皆與有能也。寥寥數語，自具分合變化之妙。獵固便捷，詩亦輕利。神乎技矣！\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/097-xuan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"還便捷之貌。峱山名。〔許氏慎曰〕峱山，在齊地。從逐也。肩〔陸氏德明曰〕肩，《説文》云：「三歲豕，肩相及者。」本亦作豜，音同。〔孔氏穎達曰〕《大司馬》云「大獸公之」，《七月》云「獻豜于公」，則肩是大獸。儇利也。茂美也。昌盛也。狼獸名，似犬。〔孔氏穎達曰〕舍人曰：「狼，牡名貛，牝名狼。」臧善也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"還便捷之貌。\",\"fullText\":\"還便捷之貌。峱山名。〔許氏慎曰〕峱山，在齊地。從逐也。肩〔陸氏德明曰〕肩，《説文》云：「三歲豕，肩相及者。」本亦作豜，音同。〔孔氏穎達曰〕《大司馬》云「大獸公之」，《七月》云「獻豜于公」，則肩是大獸。儇利也。茂美也。昌盛也。狼獸名，似犬。〔孔氏穎達曰〕舍人曰：「狼，牡名貛，牝名狼。」臧善也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/097-xuan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"還便捷之貌。峱山名。〔許氏慎曰〕峱山，在齊地。從逐也。肩〔陸氏德明曰〕肩，《説文》云：「三歲豕，肩相及者。」本亦作豜，音同。〔孔氏穎達曰〕《大司馬》云「大獸公之」，《七月》云「獻豜于公」，則肩是大獸。儇利也。茂美也。昌盛也。狼獸名，似犬。〔孔氏穎達曰〕舍人曰：「狼，牡名貛，牝名狼。」臧善也。\",\"sourceLabe
