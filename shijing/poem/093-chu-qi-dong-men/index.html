characters":[{"index":1,"text":"匪","anchorIds":[]},{"index":2,"text":"我","anchorIds":[]},{"index":3,"text":"思","anchorIds":[]},{"index":4,"text":"且","anchorIds":[]}]},{"id":"seg-011","order":11,"text":"缟衣如藘","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1"],"characters":[{"index":1,"text":"缟","anchorIds":[]},{"index":2,"text":"衣","anchorIds":[]},{"index":3,"text":"如","anchorIds":[]},{"index":4,"text":"藘","anchorIds":[]}]},{"id":"seg-012","order":12,"text":"聊可与娱","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1"],"characters":[{"index":1,"text":"聊","anchorIds":[]},{"index":2,"text":"可","anchorIds":[]},{"index":3,"text":"与","anchorIds":[]},{"index":4,"text":"娱","anchorIds":[]}]}]},"materials":[{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":2,"glossCount":5,"anchoredPartCount":0,"overviewPartCount":4},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","fangyurun-yuanshi:0003-1:part-1","fangyurun-yuanshi:0004-1:part-1"]},"focusAnchors":[],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/093-chu-qi-dong-men/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。","sourceLabel":"第 198-199 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一位男子表示对妻子忠贞不二的诗。毛序：“出其东门，闵乱也。公子五争，兵革不息。男女相弃，民人思保其室家焉。”方玉润说：“诗方细咏太平游览，绝无干戈扰攘、男奔女窜气象，序言无当于经，固已！”他依据诗文而不泥古，能切中毛序胶固的弊病。齐说：“郑男女亟聚会，声色生焉，故其俗淫。”鲁说曰：“郑国淫辟，男女私会于溱、洧之上。”这些都说明郑国当时在恋爱婚姻问题上，风俗比较纷乱。在这种环境中，居然有《出其东门》所描写的男子不为如云如荼的女子而动心，忠贞不二地爱着生活俭朴、安于贫贱的妻子，确是难能可贵。这和《谷风》《氓》中的男子是不可同日而语的了。有人认为这是男人思念女子的情诗，说亦可通。诗人以“缟衣綦巾”“缟衣如藘”来称呼他的妻子，这是一种借代的修辞手法。白衣绿裙红围腰，这些素俭的服饰在诗人眼中是多么美丽，远远胜过那些如花如云的美女，因为那身衣服恰恰标志着妻子纯朴娴静的品格，而这正是他倾心相恋之处。借标记来代人，借得恰到好处，而且揉进了自己的感情，所以给读者留下更深刻的印象。出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。东门，东门是郑国游人云集处。王先谦集疏：“盖城西南门为溱洧二水所经，故以东门为游人所集。”如云，以喻女子众多。匪，非、不是。存，在。思存，思念之所在。这句意为，这些如云的游女都不是我思念的人。缟，白色。綦（qí），草绿色。巾，佩巾，亦称大巾，似今之围裙。按缟衣綦巾是当时妇女较俭朴的服饰。郑笺：“缟衣綦巾，己所为，作者之妻服也。”这里用来代指俭朴的妻子。聊，姑且。员，友、亲爱。马瑞辰《通释》：“员当读如‘婚姻孔云’之云。彼笺云：‘云犹友也。’有与友同。诗言不相亲者，云‘亦莫我有’，则言其相亲有者，宜曰‘聊乐我员’矣。”出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。闉，曲城。闍，城台。荼，白茅之花。且，语助词。如藘，藘草色，指草绿色衣饰。娱，乐也。","fullText":"这是一位男子表示对妻子忠贞不二的诗。毛序：“出其东门，闵乱也。公子五争，兵革不息。男女相弃，民人思保其室家焉。”方玉润说：“诗方细咏太平游览，绝无干戈扰攘、男奔女窜气象，序言无当于经，固已！”他依据诗文而不泥古，能切中毛序胶固的弊病。齐说：“郑男女亟聚会，声色生焉，故其俗淫。”鲁说曰：“郑国淫辟，男女私会于溱、洧之上。”这些都说明郑国当时在恋爱婚姻问题上，风俗比较纷乱。在这种环境中，居然有《出其东门》所描写的男子不为如云如荼的女子而动心，忠贞不二地爱着生活俭朴、安于贫贱的妻子，确是难能可贵。这和《谷风》《氓》中的男子是不可同日而语的了。有人认为这是男人思念女子的情诗，说亦可通。诗人以“缟衣綦巾”“缟衣如藘”来称呼他的妻子，这是一种借代的修辞手法。白衣绿裙红围腰，这些素俭的服饰在诗人眼中是多么美丽，远远胜过那些如花如云的美女，因为那身衣服恰恰标志着妻子纯朴娴静的品格，而这正是他倾心相恋之处。借标记来代人，借得恰到好处，而且揉进了自己的感情，所以给读者留下更深刻的印象。出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。东门，东门是郑国游人云集处。王先谦集疏：“盖城西南门为溱洧二水所经，故以东门为游人所集。”如云，以喻女子众多。匪，非、不是。存，在。思存，思念之所在。这句意为，这些如云的游女都不是我思念的人。缟，白色。綦（qí），草绿色。巾，佩巾，亦称大巾，似今之围裙。按缟衣綦巾是当时妇女较俭朴的服饰。郑笺：“缟衣綦巾，己所为，作者之妻服也。”这里用来代指俭朴的妻子。聊，姑且。员，友、亲爱。马瑞辰《通释》：“员当读如‘婚姻孔云’之云。彼笺云：‘云犹友也。’有与友同。诗言不相亲者，云‘亦莫我有’，则言其相亲有者，宜曰‘聊乐我员’矣。”出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。闉，曲城。闍，城台。荼，白茅之花。且，语助词。如藘，藘草色，指草绿色衣饰。娱，乐也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"不慕非禮色也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"不慕非禮色也。","fullText":"不慕非禮色也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！","fullText":"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《 orIds\":[]},{\"index\":4,\"text\":\"藘\",\"anchorIds\":[]}]},{\"id\":\"seg-012\",\"order\":12,\"text\":\"聊可与娱\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"聊\",\"anchorIds\":[]},{\"index\":2,\"text\":\"可\",\"anchorIds\":[]},{\"index\":3,\"text\":\"与\",\"anchorIds\":[]},{\"index\":4,\"text\":\"娱\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":2,\"glossCount\":5,\"anchoredPartCount\":0,\"overviewPartCount\":4},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"fangyurun-yuanshi:0004-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。\",\"sourceLabel\":\"第 198-199 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位男子表示对妻子忠贞不二的诗。毛序：“出其东门，闵乱也。公子五争，兵革不息。男女相弃，民人思保其室家焉。”方玉润说：“诗方细咏太平游览，绝无干戈扰攘、男奔女窜气象，序言无当于经，固已！”他依据诗文而不泥古，能切中毛序胶固的弊病。齐说：“郑男女亟聚会，声色生焉，故其俗淫。”鲁说曰：“郑国淫辟，男女私会于溱、洧之上。”这些都说明郑国当时在恋爱婚姻问题上，风俗比较纷乱。在这种环境中，居然有《出其东门》所描写的男子不为如云如荼的女子而动心，忠贞不二地爱着生活俭朴、安于贫贱的妻子，确是难能可贵。这和《谷风》《氓》中的男子是不可同日而语的了。有人认为这是男人思念女子的情诗，说亦可通。诗人以“缟衣綦巾”“缟衣如藘”来称呼他的妻子，这是一种借代的修辞手法。白衣绿裙红围腰，这些素俭的服饰在诗人眼中是多么美丽，远远胜过那些如花如云的美女，因为那身衣服恰恰标志着妻子纯朴娴静的品格，而这正是他倾心相恋之处。借标记来代人，借得恰到好处，而且揉进了自己的感情，所以给读者留下更深刻的印象。出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。东门，东门是郑国游人云集处。王先谦集疏：“盖城西南门为溱洧二水所经，故以东门为游人所集。”如云，以喻女子众多。匪，非、不是。存，在。思存，思念之所在。这句意为，这些如云的游女都不是我思念的人。缟，白色。綦（qí），草绿色。巾，佩巾，亦称大巾，似今之围裙。按缟衣綦巾是当时妇女较俭朴的服饰。郑笺：“缟衣綦巾，己所为，作者之妻服也。”这里用来代指俭朴的妻子。聊，姑且。员，友、亲爱。马瑞辰《通释》：“员当读如‘婚姻孔云’之云。彼笺云：‘云犹友也。’有与友同。诗言不相亲者，云‘亦莫我有’，则言其相亲有者，宜曰‘聊乐我员’矣。”出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。闉，曲城。闍，城台。荼，白茅之花。且，语助词。如藘，藘草色，指草绿色衣饰。娱，乐也。\",\"fullText\":\"这是一位男子表示对妻子忠贞不二的诗。毛序：“出其东门，闵乱也。公子五争，兵革不息。男女相弃，民人思保其室家焉。”方玉润说：“诗方细咏太平游览，绝无干戈扰攘、男奔女窜气象，序言无当于经，固已！”他依据诗文而不泥古，能切中毛序胶固的弊病。齐说：“郑男女亟聚会，声色生焉，故其俗淫。”鲁说曰：“郑国淫辟，男女私会于溱、洧之上。”这些都说明郑国当时在恋爱婚姻问题上，风俗比较纷乱。在这种环境中，居然有《出其东门》所描写的男子不为如云如荼的女子而动心，忠贞不二地爱着生活俭朴、安于贫贱的妻子，确是难能可贵。这和《谷风》《氓》中的男子是不可同日而语的了。有人认为这是男人思念女子的情诗，说亦可通。诗人以“缟衣綦巾”“缟衣如藘”来称呼他的妻子，这是一种借代的修辞手法。白衣绿裙红围腰，这些素俭的服饰在诗人眼中是多么美丽，远远胜过那些如花如云的美女，因为那身衣服恰恰标志着妻子纯朴娴静的品格，而这正是他倾心相恋之处。借标记来代人，借得恰到好处，而且揉进了自己的感情，所以给读者留下更深刻的印象。出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。东门，东门是郑国游人云集处。王先谦集疏：“盖城西南门为溱洧二水所经，故以东门为游人所集。”如云，以喻女子众多。匪，非、不是。存，在。思存，思念之所在。这句意为，这些如云的游女都不是我思念的人。缟，白色。綦（qí），草绿色。巾，佩巾，亦称大巾，似今之围裙。按缟衣綦巾是当时妇女较俭朴的服饰。郑笺：“缟衣綦巾，己所为，作者之妻服也。”这里用来代指俭朴的妻子。聊，姑且。员，友、亲爱。马瑞辰《通释》：“员当读如‘婚姻孔云’之云。彼笺云：‘云犹友也。’有与友同。诗言不相亲者，云‘亦莫我有’，则言其相亲有者，宜曰‘聊乐我员’矣。”出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。闉，曲城。闍，城台。荼，白茅之花。且，语助词。如藘，藘草色，指草绿色衣饰。娱，乐也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"不慕非禮色也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"不慕非禮色也。\",\"fullText\":\"不慕非禮色也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！\",\"fullText\":\"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《吴語》：「黄池之會，白常、白旗、素甲、白羽之矰，望之如荼。」〔李氏樗曰〕《漢·禮樂志》曰：「顔如荼。」應劭曰：「荼，野菅，白華也。」顔師古曰：「菅，茅也，言美色如芳荼之柔也。」\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《吴語》：「黄池之會，白常、白旗、素甲、白羽之矰，望之如荼。」〔李氏樗曰〕《漢·禮樂志》曰：「顔如荼。」應劭曰：「荼，野菅，白華也。」顔師古曰：「菅，茅也，言美色如芳荼之柔也。」\",\"fullText\":\"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《吴語》：「黄池之會，白常、白旗、素甲、白羽之矰，望之如荼。」〔李氏樗曰〕《漢·禮樂志》曰：「顔如荼。」應劭曰：「荼，野菅，白華也。」顔師古曰：「菅，茅也，言美色如芳荼之柔也。」\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻門十二文。雲同。存十三元。巾十一真。員文。通韻。闍七虞。荼同。且六魚。藘同。娱七虞。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻門十二文。雲同。存十三元。巾十一真。員文。通韻。闍七虞。荼同。且六魚。藘同。娱七虞。通韻。\",\"fullText\":\"標韻門十二文。雲同。存十三元。巾十一真。員文。通韻。闍七虞。荼同。且六魚。藘同。娱七虞。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}}"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"script\",null,{\"id\":\"__SHIJING_PAGE_DATA__\",\"type\":\"application/json\",\"data-page-kind\":\"poem-detail\",\"data-page-href\":\"/shijing/poem/093-chu-qi-dong-men\",\"data-page-data-href\":\"/__data/shijing/poem/093-chu-qi-dong-men/data.json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1d\"}}],\"$L1e\",\"$L1f\"]\n"])</script><script ]}]},{\"id\":\"seg-011\",\"order\":11,\"text\":\"缟衣如藘\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"缟\",\"anchorIds\":[]},{\"index\":2,\"text\":\"衣\",\"anchorIds\":[]},{\"index\":3,\"text\":\"如\",\"anchorIds\":[]},{\"index\":4,\"text\":\"藘\",\"anchorIds\":[]}]},{\"id\":\"seg-012\",\"order\":12,\"text\":\"聊可与娱\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"聊\",\"anchorIds\":[]},{\"index\":2,\"text\":\"可\",\"anchorIds\":[]},{\"index\":3,\"text\":\"与\",\"anchorIds\":[]},{\"index\":4,\"text\":\"娱\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":2,\"glossCount\":5,\"anchoredPartCount\":0,\"overviewPartCount\":4},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"fangyurun-yuanshi:0004-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。\",\"sourceLabel\":\"第 198-199 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位男子表示对妻子忠贞不二的诗。毛序：“出其东门，闵乱也。公子五争，兵革不息。男女相弃，民人思保其室家焉。”方玉润说：“诗方细咏太平游览，绝无干戈扰攘、男奔女窜气象，序言无当于经，固已！”他依据诗文而不泥古，能切中毛序胶固的弊病。齐说：“郑男女亟聚会，声色生焉，故其俗淫。”鲁说曰：“郑国淫辟，男女私会于溱、洧之上。”这些都说明郑国当时在恋爱婚姻问题上，风俗比较纷乱。在这种环境中，居然有《出其东门》所描写的男子不为如云如荼的女子而动心，忠贞不二地爱着生活俭朴、安于贫贱的妻子，确是难能可贵。这和《谷风》《氓》中的男子是不可同日而语的了。有人认为这是男人思念女子的情诗，说亦可通。诗人以“缟衣綦巾”“缟衣如藘”来称呼他的妻子，这是一种借代的修辞手法。白衣绿裙红围腰，这些素俭的服饰在诗人眼中是多么美丽，远远胜过那些如花如云的美女，因为那身衣服恰恰标志着妻子纯朴娴静的品格，而这正是他倾心相恋之处。借标记来代人，借得恰到好处，而且揉进了自己的感情，所以给读者留下更深刻的印象。出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。东门，东门是郑国游人云集处。王先谦集疏：“盖城西南门为溱洧二水所经，故以东门为游人所集。”如云，以喻女子众多。匪，非、不是。存，在。思存，思念之所在。这句意为，这些如云的游女都不是我思念的人。缟，白色。綦（qí），草绿色。巾，佩巾，亦称大巾，似今之围裙。按缟衣綦巾是当时妇女较俭朴的服饰。郑笺：“缟衣綦巾，己所为，作者之妻服也。”这里用来代指俭朴的妻子。聊，姑且。员，友、亲爱。马瑞辰《通释》：“员当读如‘婚姻孔云’之云。彼笺云：‘云犹友也。’有与友同。诗言不相亲者，云‘亦莫我有’，则言其相亲有者，宜曰‘聊乐我员’矣。”出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。闉，曲城。闍，城台。荼，白茅之花。且，语助词。如藘，藘草色，指草绿色衣饰。娱，乐也。\",\"fullText\":\"这是一位男子表示对妻子忠贞不二的诗。毛序：“出其东门，闵乱也。公子五争，兵革不息。男女相弃，民人思保其室家焉。”方玉润说：“诗方细咏太平游览，绝无干戈扰攘、男奔女窜气象，序言无当于经，固已！”他依据诗文而不泥古，能切中毛序胶固的弊病。齐说：“郑男女亟聚会，声色生焉，故其俗淫。”鲁说曰：“郑国淫辟，男女私会于溱、洧之上。”这些都说明郑国当时在恋爱婚姻问题上，风俗比较纷乱。在这种环境中，居然有《出其东门》所描写的男子不为如云如荼的女子而动心，忠贞不二地爱着生活俭朴、安于贫贱的妻子，确是难能可贵。这和《谷风》《氓》中的男子是不可同日而语的了。有人认为这是男人思念女子的情诗，说亦可通。诗人以“缟衣綦巾”“缟衣如藘”来称呼他的妻子，这是一种借代的修辞手法。白衣绿裙红围腰，这些素俭的服饰在诗人眼中是多么美丽，远远胜过那些如花如云的美女，因为那身衣服恰恰标志着妻子纯朴娴静的品格，而这正是他倾心相恋之处。借标记来代人，借得恰到好处，而且揉进了自己的感情，所以给读者留下更深刻的印象。出其东门，有女如云。虽则如云，匪我思存。缟衣綦巾，聊乐我员。东门，东门是郑国游人云集处。王先谦集疏：“盖城西南门为溱洧二水所经，故以东门为游人所集。”如云，以喻女子众多。匪，非、不是。存，在。思存，思念之所在。这句意为，这些如云的游女都不是我思念的人。缟，白色。綦（qí），草绿色。巾，佩巾，亦称大巾，似今之围裙。按缟衣綦巾是当时妇女较俭朴的服饰。郑笺：“缟衣綦巾，己所为，作者之妻服也。”这里用来代指俭朴的妻子。聊，姑且。员，友、亲爱。马瑞辰《通释》：“员当读如‘婚姻孔云’之云。彼笺云：‘云犹友也。’有与友同。诗言不相亲者，云‘亦莫我有’，则言其相亲有者，宜曰‘聊乐我员’矣。”出其闉闍，有女如荼。虽则如荼，匪我思且。缟衣如藘，聊可与娱。闉，曲城。闍，城台。荼，白茅之花。且，语助词。如藘，藘草色，指草绿色衣饰。娱，乐也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"不慕非禮色也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"不慕非禮色也。\",\"fullText\":\"不慕非禮色也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！\",\"fullText\":\"右《出其東門》二章，章六句。《序》謂「閔亂也。公子互争，兵革不息，男女相棄，民人思保其室家焉」。然詩方細咏太平遊覽，絶無干戈擾攘、男奔女竄氣象。《序》言無當於經固已。《集傳》云「人見淫奔之女而作此詩」，是以「如雲」、「如荼」之女，盡屬淫奔，亦豈可哉？晦翁釋詩，隨口而道，並未暇思，於此可見。此詩亦貧士風流自賞，不屑屑與人尋芳逐豔。一旦出遊睹此繁華，不覺有慨於心，以爲人生自有伉儷，雖荆釵布裙自足爲樂，何必妖嬈豔冶，徒亂人心乎？故東門一遊，女則如雲而又如荼，終無一人繫我心懷，豈矯情乎？色不可以非禮動耳。心爲色動，且出非禮，則將無所止。詩固知足亦善自防哉！\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《吴語》：「黄池之會，白常、白旗、素甲、白羽之矰，望之如荼。」〔李氏樗曰〕《漢·禮樂志》曰：「顔如荼。」應劭曰：「荼，野菅，白華也。」顔師古曰：「菅，茅也，言美色如芳荼之柔也。」\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《吴語》：「黄池之會，白常、白旗、素甲、白羽之矰，望之如荼。」〔李氏樗曰〕《漢·禮樂志》曰：「顔如荼。」應劭曰：「荼，野菅，白華也。」顔師古曰：「菅，茅也，言美色如芳荼之柔也。」\",\"fullText\":\"集釋縞白繒也。〔孔氏穎達曰〕《廣雅》云：「縞，細繒也。」《戰國策》云：「强弩之餘，不能穿魯縞。」然則縞是薄繒，不染，故色白也。綦者，青色之小别。青而微白，爲艾草之色。巾〔馮氏復京曰〕案《禮記》「左佩粉帨」，粉帨即巾也。此巾宜爲佩巾，或以爲婦人裹頭之巾。員與云同，語辭也。闉曲城也。〔陳氏飛鵬曰〕門之外有副城，回曲以障門者，謂之闉。闍城臺也。荼〔毛氏萇曰〕荼，英荼也。〔孔氏穎達曰〕荼是茅草秀出之穗。言英荼者，英是白貌。《吴語》：「黄池之會，白常、白旗、素甲、白羽之矰，望之如荼。」〔李氏樗曰〕《漢·禮樂志》曰：「顔如荼。」應劭曰：「荼，野菅，白華也。」顔師古曰：「菅，茅也，言美色如芳荼之柔也。」\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/093-chu-qi-dong-men/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻門十二文。雲同。存十三元。巾十一真。員文。通韻。闍七虞。荼同。且六魚。藘同。娱七虞。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻門十二文。雲同。存十三元。巾十一真。員文。通韻。闍七虞。荼同。且六魚。藘同。娱七虞。通韻。\",\"fullText\":\"標韻門十二文。雲同。存十三元。巾十一真。員文。通韻。闍七虞。荼同。且六魚。藘同。娱七虞。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"v
