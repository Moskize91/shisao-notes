yundu"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/070-tu-yuan/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"有兔爰爰，雉离于罗，我生之初，尚无为，我生之后，逢此百罹，尚寐无吪，有兔爰爰，雉离于罦，我生之初，尚无造，我生之后，逢此百忧，尚寐无觉，有兔爰爰，雉离于罿，我生之初，尚无庸，我生之后，逢此百凶，尚寐无聪。","sourceLabel":"第 159-161 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一个没落贵族因厌世而作的诗。他留恋西周宣王时代的“盛世”，那时虽有天灾，但无人祸，贵族的地位和利益尚未动摇。东迁以后，有些贵族失去了土地和人民，地位起了变化，甚至还要服役。这就是他感叹的“逢此百罹”的社会背景。他抚今忆昔，不觉产生了厌世思想，写了这么一首诗。毛序：“兔爰，闵周也。桓王失信，诸侯背叛，构怨连祸，王师伤败，君子不乐其生焉。”他将诗定为桓王时的作品，那是错误的。崔述《读风偶识》：“其人当生于宣王之末年，王室未骚，是以谓之‘无为’。既而幽王昏暴，戎狄侵陵，平王播迁，家室飘荡，是以谓之‘逢此百罹’。”崔氏确定的时代比较正确。\n此诗首二句是含有比义的兴，顾起元说：“三章各首二句比君子得祸，小人独免。下皆是叹其所遭而安于死也。”（《诗说汇纂》）顾氏指出了全诗结构的特点。方玉润《诗经原始》说：“词意凄怆，声情激越，阮步兵专学此种。”他指出此诗的风格及其继承关系。可是以阮籍诗当之，则大谬不然。阮嗣宗身当魏晋多事之秋，常恐罹谤遇祸，不预世事，以沉醉获免。论其行迹，倒也算得上“尚寐无觉”。他虽栖迟区外，实并未浑然忘世。咏怀诸诗，俱悯乱之作，多感慨之词，虽文多隐避，而托体高妙。足见其胸襟高朗，意气宏放，不同凡响。与此诗作者之斤斤于个人浮沉，乏忧世之意，心胸狭隘，竟不乐生，相去实不能以道里计。刘勰《文心雕龙·体性》评阮诗“响逸而调远”，而《兔爰》响抑而调促，在风格上亦不相同。方氏但视其表，故有此失。\n有兔爰爰，雉离于罗。我生之初，尚无为。我生之后，逢此百罹，尚寐无吪！\n爰爰，缓纵貌。马瑞辰通释：“韩诗：‘爰，缓纵之貌。’胡承珙曰：‘纵当作从。缓从，谓解脱之，即郑笺纵之义。’其说是也。”\n离，遭。\n罗，捕鸟兽网。朱熹《诗集传》：“言张罗本以取兔，今兔狡得脱，而雉以耿介反离于罗。以比小人致乱，而以巧计幸免，君子无辜，而以忠直受祸也。”\n尚，犹、还。\n为，事，指军役之事。郑笺：“言我幼稚之时，庶几于无所为，谓军役之事也。”\n百，是虚数，许多的意思。\n罹（lí），忧。陈奂传疏：“说文无罹字，疑古毛诗作离。释文：‘罹，本又作离’；文选卢湛赠刘琨诗注引毛诗作‘逢此百离’……离为忧，则逢此百离，犹下章‘逢此百忧’耳。”\n尚，庶几，带有希望之意。此章二“尚”字意义不同。\n吪，说文：“动也。”尔雅作讹，是吪的或体。无吪（é），不想动嘴。此句意为，希望睡去不再说话。方玉润《诗经原始》：“无吪、无觉、无聪者，亦不过不欲言、不欲见、不欲闻已耳。”\n韵读：歌部——罗、为（音讹）、罹（音罗）、吪。\n有兔爰爰，雉离于罦。我生之初，尚无造。我生之后，逢此百忧，尚寐无觉！\n罦（fú），又名覆车，是一种带有机关的捕鸟兽网。尔雅释器郭注：“罦，今之翻车也，有两辕，中施罔以捕鸟。”\n造，与上章“为”字同义。尔雅释言：“作、造，为也。”\n觉，清醒。朱熹《诗集传》：“觉，寤也。”无觉即不想看见之意。\n韵读：幽部——罦、造（组瘦反）、忧、觉（左瘦反）。\n有兔爰爰，雉离于罿。我生之初，尚无庸。我生之后，逢此百凶，尚寐无聪！\n罿（tóng），捕鸟兽网。韩诗以为是张设在车上的网。说见释文。\n庸，用，指兵役。陈奂传疏：“无庸者，谓无用师之苦。”\n聪，毛传：“聪，闻也。”无聪，不想听见。皇侃：“无所闻，则亦死耳。”\n韵读：东部——罿、庸、凶、聪。","fullText":"这是一个没落贵族因厌世而作的诗。他留恋西周宣王时代的“盛世”，那时虽有天灾，但无人祸，贵族的地位和利益尚未动摇。东迁以后，有些贵族失去了土地和人民，地位起了变化，甚至还要服役。这就是他感叹的“逢此百罹”的社会背景。他抚今忆昔，不觉产生了厌世思想，写了这么一首诗。毛序：“兔爰，闵周也。桓王失信，诸侯背叛，构怨连祸，王师伤败，君子不乐其生焉。”他将诗定为桓王时的作品，那是错误的。崔述《读风偶识》：“其人当生于宣王之末年，王室未骚，是以谓之‘无为’。既而幽王昏暴，戎狄侵陵，平王播迁，家室飘荡，是以谓之‘逢此百罹’。”崔氏确定的时代比较正确。\n此诗首二句是含有比义的兴，顾起元说：“三章各首二句比君子得祸，小人独免。下皆是叹其所遭而安于死也。”（《诗说汇纂》）顾氏指出了全诗结构的特点。方玉润《诗经原始》说：“词意凄怆，声情激越，阮步兵专学此种。”他指出此诗的风格及其继承关系。可是以阮籍诗当之，则大谬不然。阮嗣宗身当魏晋多事之秋，常恐罹谤遇祸，不预世事，以沉醉获免。论其行迹，倒也算得上“尚寐无觉”。他虽栖迟区外，实并未浑然忘世。咏怀诸诗，俱悯乱之作，多感慨之词，虽文多隐避，而托体高妙。足见其胸襟高朗，意气宏放，不同凡响。与此诗作者之斤斤于个人浮沉，乏忧世之意，心胸狭隘，竟不乐生，相去实不能以道里计。刘勰《文心雕龙·体性》评阮诗“响逸而调远”，而《兔爰》响抑而调促，在风格上亦不相同。方氏但视其表，故有此失。\n有兔爰爰，雉离于罗。我生之初，尚无为。我生之后，逢此百罹，尚寐无吪！\n爰爰，缓纵貌。马瑞辰通释：“韩诗：‘爰，缓纵之貌。’胡承珙曰：‘纵当作从。缓从，谓解脱之，即郑笺纵之义。’其说是也。”\n离，遭。\n罗，捕鸟兽网。朱熹《诗集传》：“言张罗本以取兔，今兔狡得脱，而雉以耿介反离于罗。以比小人致乱，而以巧计幸免，君子无辜，而以忠直受祸也。”\n尚，犹、还。\n为，事，指军役之事。郑笺：“言我幼稚之时，庶几于无所为，谓军役之事也。”\n百，是虚数，许多的意思。\n罹（lí），忧。陈奂传疏：“说文无罹字，疑古毛诗作离。释文：‘罹，本又作离’；文选卢湛赠刘琨诗注引毛诗作‘逢此百离’……离为忧，则逢此百离，犹下章‘逢此百忧’耳。”\n尚，庶几，带有希望之意。此章二“尚”字意义不同。\n吪，说文：“动也。”尔雅作讹，是吪的或体。无吪（é），不想动嘴。此句意为，希望睡去不再说话。方玉润《诗经原始》：“无吪、无觉、无聪者，亦不过不欲言、不欲见、不欲闻已耳。”\n韵读：歌部——罗、为（音讹）、罹（音罗）、吪。\n有兔爰爰，雉离于罦。我生之初，尚无造。我生之后，逢此百忧，尚寐无觉！\n罦（fú），又名覆车，是一种带有机关的捕鸟兽网。尔雅释器郭注：“罦，今之翻车也，有两辕，中施罔以捕鸟。”\n造，与上章“为”字同义。尔雅释言：“作、造，为也。”\n觉，清醒。朱熹《诗集传》：“觉，寤也。”无觉即不想看见之意。\n韵读：幽部——罦、造（组瘦反）、忧、觉（左瘦反）。\n有兔爰爰，雉离于罿。我生之初，尚无庸。我生之后，逢此百凶，尚寐无聪！\n罿（tóng），捕鸟兽网。韩诗以为是张设在车上的网。说见释文。\n庸，用，指兵役。陈奂传疏：“无庸者，谓无用师之苦。”\n聪，毛传：“聪，闻也。”无聪，不想听见。皇侃：“无所闻，则亦死耳。”\n韵读：东部——罿、庸、凶、聪。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/070-tu-yuan/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。","sourceLabel":"第 88-89 页","attributionLabel":"陈奂","sectionLabel":"经文","excerpt":"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。","fullText":"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"兔爰㊟傷亂始也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"兔爰㊟傷亂始也。","fullText":"兔爰㊟傷亂始也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《兔爰》三章，章七句。 i-yundu\"]},{\"id\":\"seg-013:3-4:百忧\",\"segmentId\":\"seg-013\",\"segmentOrder\":13,\"surfaceText\":\"百忧\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0001-1:part-3\"],\"materialIds\":[\"wangli-yundu\"]},{\"id\":\"seg-013:3-4:百憂\",\"segmentId\":\"seg-013\",\"segmentOrder\":13,\"surfaceText\":\"百憂\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0001-1:part-2\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-013:4-4:忧\",\"segmentId\":\"seg-013\",\"segmentOrder\":13,\"surfaceText\":\"忧\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]},{\"id\":\"seg-014:3-4:無覺\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"無覺\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0001-1:part-2\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-014:4-4:觉\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"觉\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]},{\"id\":\"seg-016:4-4:罿\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"罿\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]},{\"id\":\"seg-020:3-4:百凶\",\"segmentId\":\"seg-020\",\"segmentOrder\":20,\"surfaceText\":\"百凶\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0001-1:part-2\",\"wangli-yundu:0001-1:part-3\"],\"materialIds\":[\"quwanli-quanshi\",\"wangli-yundu\"]},{\"id\":\"seg-020:4-4:凶\",\"segmentId\":\"seg-020\",\"segmentOrder\":20,\"surfaceText\":\"凶\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]},{\"id\":\"seg-021:3-4:無聰\",\"segmentId\":\"seg-021\",\"segmentOrder\":21,\"surfaceText\":\"無聰\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\",\"quwanli-quanshi:0001-1:part-2\"],\"materialIds\":[\"maruichen-tongshi\",\"quwanli-quanshi\"]},{\"id\":\"seg-021:4-4:聪\",\"segmentId\":\"seg-021\",\"segmentOrder\":21,\"surfaceText\":\"聪\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉离于罗，我生之初，尚无为，我生之后，逢此百罹，尚寐无吪，有兔爰爰，雉离于罦，我生之初，尚无造，我生之后，逢此百忧，尚寐无觉，有兔爰爰，雉离于罿，我生之初，尚无庸，我生之后，逢此百凶，尚寐无聪。\",\"sourceLabel\":\"第 159-161 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一个没落贵族因厌世而作的诗。他留恋西周宣王时代的“盛世”，那时虽有天灾，但无人祸，贵族的地位和利益尚未动摇。东迁以后，有些贵族失去了土地和人民，地位起了变化，甚至还要服役。这就是他感叹的“逢此百罹”的社会背景。他抚今忆昔，不觉产生了厌世思想，写了这么一首诗。毛序：“兔爰，闵周也。桓王失信，诸侯背叛，构怨连祸，王师伤败，君子不乐其生焉。”他将诗定为桓王时的作品，那是错误的。崔述《读风偶识》：“其人当生于宣王之末年，王室未骚，是以谓之‘无为’。既而幽王昏暴，戎狄侵陵，平王播迁，家室飘荡，是以谓之‘逢此百罹’。”崔氏确定的时代比较正确。\\n此诗首二句是含有比义的兴，顾起元说：“三章各首二句比君子得祸，小人独免。下皆是叹其所遭而安于死也。”（《诗说汇纂》）顾氏指出了全诗结构的特点。方玉润《诗经原始》说：“词意凄怆，声情激越，阮步兵专学此种。”他指出此诗的风格及其继承关系。可是以阮籍诗当之，则大谬不然。阮嗣宗身当魏晋多事之秋，常恐罹谤遇祸，不预世事，以沉醉获免。论其行迹，倒也算得上“尚寐无觉”。他虽栖迟区外，实并未浑然忘世。咏怀诸诗，俱悯乱之作，多感慨之词，虽文多隐避，而托体高妙。足见其胸襟高朗，意气宏放，不同凡响。与此诗作者之斤斤于个人浮沉，乏忧世之意，心胸狭隘，竟不乐生，相去实不能以道里计。刘勰《文心雕龙·体性》评阮诗“响逸而调远”，而《兔爰》响抑而调促，在风格上亦不相同。方氏但视其表，故有此失。\\n有兔爰爰，雉离于罗。我生之初，尚无为。我生之后，逢此百罹，尚寐无吪！\\n爰爰，缓纵貌。马瑞辰通释：“韩诗：‘爰，缓纵之貌。’胡承珙曰：‘纵当作从。缓从，谓解脱之，即郑笺纵之义。’其说是也。”\\n离，遭。\\n罗，捕鸟兽网。朱熹《诗集传》：“言张罗本以取兔，今兔狡得脱，而雉以耿介反离于罗。以比小人致乱，而以巧计幸免，君子无辜，而以忠直受祸也。”\\n尚，犹、还。\\n为，事，指军役之事。郑笺：“言我幼稚之时，庶几于无所为，谓军役之事也。”\\n百，是虚数，许多的意思。\\n罹（lí），忧。陈奂传疏：“说文无罹字，疑古毛诗作离。释文：‘罹，本又作离’；文选卢湛赠刘琨诗注引毛诗作‘逢此百离’……离为忧，则逢此百离，犹下章‘逢此百忧’耳。”\\n尚，庶几，带有希望之意。此章二“尚”字意义不同。\\n吪，说文：“动也。”尔雅作讹，是吪的或体。无吪（é），不想动嘴。此句意为，希望睡去不再说话。方玉润《诗经原始》：“无吪、无觉、无聪者，亦不过不欲言、不欲见、不欲闻已耳。”\\n韵读：歌部——罗、为（音讹）、罹（音罗）、吪。\\n有兔爰爰，雉离于罦。我生之初，尚无造。我生之后，逢此百忧，尚寐无觉！\\n罦（fú），又名覆车，是一种带有机关的捕鸟兽网。尔雅释器郭注：“罦，今之翻车也，有两辕，中施罔以捕鸟。”\\n造，与上章“为”字同义。尔雅释言：“作、造，为也。”\\n觉，清醒。朱熹《诗集传》：“觉，寤也。”无觉即不想看见之意。\\n韵读：幽部——罦、造（组瘦反）、忧、觉（左瘦反）。\\n有兔爰爰，雉离于罿。我生之初，尚无庸。我生之后，逢此百凶，尚寐无聪！\\n罿（tóng），捕鸟兽网。韩诗以为是张设在车上的网。说见释文。\\n庸，用，指兵役。陈奂传疏：“无庸者，谓无用师之苦。”\\n聪，毛传：“聪，闻也。”无聪，不想听见。皇侃：“无所闻，则亦死耳。”\\n韵读：东部——罿、庸、凶、聪。\",\"fullText\":\"这是一个没落贵族因厌世而作的诗。他留恋西周宣王时代的“盛世”，那时虽有天灾，但无人祸，贵族的地位和利益尚未动摇。东迁以后，有些贵族失去了土地和人民，地位起了变化，甚至还要服役。这就是他感叹的“逢此百罹”的社会背景。他抚今忆昔，不觉产生了厌世思想，写了这么一首诗。毛序：“兔爰，闵周也。桓王失信，诸侯背叛，构怨连祸，王师伤败，君子不乐其生焉。”他将诗定为桓王时的作品，那是错误的。崔述《读风偶识》：“其人当生于宣王之末年，王室未骚，是以谓之‘无为’。既而幽王昏暴，戎狄侵陵，平王播迁，家室飘荡，是以谓之‘逢此百罹’。”崔氏确定的时代比较正确。\\n此诗首二句是含有比义的兴，顾起元说：“三章各首二句比君子得祸，小人独免。下皆是叹其所遭而安于死也。”（《诗说汇纂》）顾氏指出了全诗结构的特点。方玉润《诗经原始》说：“词意凄怆，声情激越，阮步兵专学此种。”他指出此诗的风格及其继承关系。可是以阮籍诗当之，则大谬不然。阮嗣宗身当魏晋多事之秋，常恐罹谤遇祸，不预世事，以沉醉获免。论其行迹，倒也算得上“尚寐无觉”。他虽栖迟区外，实并未浑然忘世。咏怀诸诗，俱悯乱之作，多感慨之词，虽文多隐避，而托体高妙。足见其胸襟高朗，意气宏放，不同凡响。与此诗作者之斤斤于个人浮沉，乏忧世之意，心胸狭隘，竟不乐生，相去实不能以道里计。刘勰《文心雕龙·体性》评阮诗“响逸而调远”，而《兔爰》响抑而调促，在风格上亦不相同。方氏但视其表，故有此失。\\n有兔爰爰，雉离于罗。我生之初，尚无为。我生之后，逢此百罹，尚寐无吪！\\n爰爰，缓纵貌。马瑞辰通释：“韩诗：‘爰，缓纵之貌。’胡承珙曰：‘纵当作从。缓从，谓解脱之，即郑笺纵之义。’其说是也。”\\n离，遭。\\n罗，捕鸟兽网。朱熹《诗集传》：“言张罗本以取兔，今兔狡得脱，而雉以耿介反离于罗。以比小人致乱，而以巧计幸免，君子无辜，而以忠直受祸也。”\\n尚，犹、还。\\n为，事，指军役之事。郑笺：“言我幼稚之时，庶几于无所为，谓军役之事也。”\\n百，是虚数，许多的意思。\\n罹（lí），忧。陈奂传疏：“说文无罹字，疑古毛诗作离。释文：‘罹，本又作离’；文选卢湛赠刘琨诗注引毛诗作‘逢此百离’……离为忧，则逢此百离，犹下章‘逢此百忧’耳。”\\n尚，庶几，带有希望之意。此章二“尚”字意义不同。\\n吪，说文：“动也。”尔雅作讹，是吪的或体。无吪（é），不想动嘴。此句意为，希望睡去不再说话。方玉润《诗经原始》：“无吪、无觉、无聪者，亦不过不欲言、不欲见、不欲闻已耳。”\\n韵读：歌部——罗、为（音讹）、罹（音罗）、吪。\\n有兔爰爰，雉离于罦。我生之初，尚无造。我生之后，逢此百忧，尚寐无觉！\\n罦（fú），又名覆车，是一种带有机关的捕鸟兽网。尔雅释器郭注：“罦，今之翻车也，有两辕，中施罔以捕鸟。”\\n造，与上章“为”字同义。尔雅释言：“作、造，为也。”\\n觉，清醒。朱熹《诗集传》：“觉，寤也。”无觉即不想看见之意。\\n韵读：幽部——罦、造（组瘦反）、忧、觉（左瘦反）。\\n有兔爰爰，雉离于罿。我生之初，尚无庸。我生之后，逢此百凶，尚寐无聪！\\n罿（tóng），捕鸟兽网。韩诗以为是张设在车上的网。说见释文。\\n庸，用，指兵役。陈奂传疏：“无庸者，谓无用师之苦。”\\n聪，毛传：“聪，闻也。”无聪，不想听见。皇侃：“无所闻，则亦死耳。”\\n韵读：东部——罿、庸、凶、聪。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"sourceLabel\":\"第 88-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"fullText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"兔爰㊟傷亂始也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"兔爰㊟傷亂始也。\",\"fullText\":\"兔爰㊟傷亂始也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？\",\"fullText\":\"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評詞意悽愴，聲情激越，阮步兵專學此種。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評詞意悽愴，聲情激越，阮步兵專學此種。\",\"fullText\":\"眉評詞意悽愴，聲情激越，阮步兵專學此種。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋爰爰〔《集傳》曰〕兔性陰狡。爰爰，緩意。〔孔氏穎達曰〕無所拘制，爰爰然而緩。雉〔《集傳》〕雉性耿介。離麗也。羅網也。罹憂也。吪〔黄氏震曰〕古注：吪，動也。蓋動則憂，寐則不知。故欲無吪。〔姚氏際恒曰〕吪字從口，從言之訛亦同。《小雅》「或寢或訛」即此。吪，方寤動而有聲也。無吪，不言之意。後説較通。罦〔孔氏穎達曰〕《釋器》云：「繴謂之罿。罿，罬也。罬謂之罦，罦，覆車也。」孫炎曰：「覆車，網可以掩兔者也。」造亦爲也。覺寤也。庸用也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋爰爰〔《集傳》曰〕兔性陰狡。爰爰，緩意。〔孔氏穎達曰〕無所拘制，爰爰然而緩。雉〔《集傳》〕雉性耿介。離麗也。羅網也。罹憂也。吪〔黄氏震曰〕古注：吪，動也。蓋動則憂，寐則不知。故欲無吪。〔姚氏際恒曰〕吪字從口，從言之訛亦同。《小雅》「或寢或訛」即此。吪，方寤動而有聲也。無吪，不言之意。後説較通。罦〔孔氏穎達曰〕《釋器》云：「繴謂之罿。罿，罬也。罬謂之罦，罦，覆車也。」孫炎曰：「覆車，網可以掩兔者也。」造亦爲也。覺寤也。庸用也。\",\"fullText\":\"集釋爰爰〔《集傳》曰〕兔性陰狡。爰爰，緩意。〔孔氏穎達曰〕無所拘制，爰爰然而緩。雉〔《集傳》〕雉性耿介。離麗也。羅網也。罹憂也。吪〔黄氏震曰〕古注：吪，動也。蓋動則憂，寐則不知。故欲無吪。〔姚氏際恒曰〕吪字從口，從言之訛亦同。《小雅》「或寢或訛」即此。吪，方寤動而有聲也。無吪，不言之意。後説較通。罦〔孔氏穎達曰〕《釋器》云：「繴謂之罿。罿，罬也。罬謂之罦，罦，覆車也。」孫炎曰：「覆車，網可以掩兔者也。」造亦爲也。覺寤也。庸用也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻羅五歌。爲四支，叶吾禾反。罹同上，叶良何反。吪五歌。叶韻。罦十一尤，叶步廟反。造二十號。憂十一尤，叶一笑反。覺十九效。叶韻。罿一東。庸二冬。凶同。聰一東。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻羅五歌。爲四支，叶吾禾反。罹同上，叶良何反。吪五歌。叶韻。罦十一尤，叶步廟反。造二十號。憂十一尤，叶一笑反。覺十九效。叶韻。罿一東。庸二冬。凶同。聰一東。通韻。\",\"fullText\":\"標韻羅五歌。爲四支，叶吾禾反。罹同上，叶良何反。吪五歌。叶韻。罦十一尤，叶步廟反。造二十號。憂十一尤，叶一笑反。覺十九效。叶韻。罿一東。庸二冬。凶同。聰一東。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"尚寐無聰\",\"sourceLabel\":\"第 359 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"無聰\",\"fullText\":\"無聰\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-021:3-4:無聰\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-021\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"sourceLabel\":\"第 86-87 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释《兔爰》，直指为妇人被夫遗弃之诗：以兔雉陷网起兴，\",\"fullText\":\"屈万里释《兔爰》，直指为妇人被夫遗弃之诗：以兔雉陷网起兴，三章分写“百罹”“百憂”“百凶”，而“無吪”“無覺”“無聰”层层加深其不愿言、不愿醒、不愿闻之苦。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:2-2:兔\",\"seg-002:1-1:雉\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"sourceLabel\":\"第 86-87 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"三章分写“百罹”“百憂”“百凶”，而“無吪”“無覺”“無聰”层层加深其不愿言、不愿醒、不愿闻之苦。\",\"fullText\":\"屈万里释《兔爰》，直指为妇人被夫遗弃之诗：以兔雉陷网起兴，三章分写“百罹”“百憂”“百凶”，而“無吪”“無覺”“無聰”层层加深其不愿言、不愿醒、不愿闻之苦。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-006:3-4:百罹\",\"seg-013:3-4:百憂\",\"seg-020:3-4:百凶\",\"seg-007:3-4:無吪\",\"seg-014:3-4:無覺\",\"seg-021:3-4:無聰\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"wangli-yundu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉离于罗，我生之初，尚无为，我生之后，逢此百罹，尚寐无吪，有兔爰爰，雉离于罦，我生之初，尚无造，我生之后，逢此百忧，尚寐无觉，有兔爰爰，雉离于罿，我生之初，尚无庸，我生之后，逢此百凶，尚寐无聪。\",\"sourceLabel\":\"第 179-180 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"王力在《韵读》中录《兔爰》三章，并依韵部转注其声读：首章“罗、为、罹、吪”归歌部，\",\"fullText\":\"王力在《韵读》中录《兔爰》三章，并依韵部转注其声读：首章“罗、为、罹、吪”归歌部，次章“罦、忧”入幽部而“觉”转入幽觉通韵，末章“罿、凶、聪”归东部。全诗仍以兔雉陷网起兴，层层写乱世百罹、百忧、百凶之感。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:4-4:罗\",\"seg-004:3-3:为\",\"seg-006:4-4:罹\",\"seg-007:4-4:吪\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor- ion\":3,\"name\":\"王風\",\"item\":\"https://shisao.taozeyu.com/shijing/#wangfeng\"},{\"@type\":\"ListItem\",\"position\":4,\"name\":\"兔爰\",\"item\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/\"}]},{\"@type\":\"CreativeWork\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/#poem\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/\",\"name\":\"兔爰\",\"description\":\"風 · 王風 · 汇聚 6 种资料、10 条注脚的《兔爰》阅读页。\",\"text\":\"有兔爰爰\\n雉離于羅\\n我生之初\\n尚無爲\\n我生之後\\n逢此百罹\\n尚寐無吪\\n有兔爰爰\\n雉離于罦\\n我生之初\\n尚無造\\n我生之後\\n逢此百憂\\n尚寐無覺\\n有兔爰爰\\n雉離于罿\\n我生之初\\n尚無庸\\n我生之後\\n逢此百凶\\n尚寐無聰\",\"inLanguage\":\"zh-Hans\",\"genre\":\"诗歌\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"诗经\"},{\"@type\":\"Thing\",\"name\":\"風\"},{\"@type\":\"Thing\",\"name\":\"王風\"}]},{\"@type\":\"WebPage\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/#webpage\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/\",\"name\":\"兔爰 · 逐字注脚阅读\",\"description\":\"風 · 王風 · 汇聚 6 种资料、10 条注脚的《兔爰》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/070-tu-yuan/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tfca,"])</script><script>self.__next_f.push([1,"这是一个没落贵族因厌世而作的诗。他留恋西周宣王时代的“盛世”，那时虽有天灾，但无人祸，贵族的地位和利益尚未动摇。东迁以后，有些贵族失去了土地和人民，地位起了变化，甚至还要服役。这就是他感叹的“逢此百罹”的社会背景。他抚今忆昔，不觉产生了厌世思想，写了这么一首诗。毛序：“兔爰，闵周也。桓王失信，诸侯背叛，构怨连祸，王师伤败，君子不乐其生焉。”他将诗定为桓王时的作品，那是错误的。崔述《读风偶识》：“其人当生于宣王之末年，王室未骚，是以谓之‘无为’。既而幽王昏暴，戎狄侵陵，平王播迁，家室飘荡，是以谓之‘逢此百罹’。”崔氏确定的时代比较正确。\n此诗首二句是含有比义的兴，顾起元说：“三章各首二句比君子得祸，小人独免。下皆是叹其所遭而安于死也。”（《诗说汇纂》）顾氏指出了全诗结构的特点。方玉润《诗经原始》说：“词意凄怆，声情激越，阮步兵专学此种。”他指出此诗的风格及其继承关系。可是以阮籍诗当之，则大谬不然。阮嗣宗身当魏晋多事之秋，常恐罹谤遇祸，不预世事，以沉醉获免。论其行迹，倒也算得上“尚寐无觉”。他虽栖迟区外，实并未浑然忘世。咏怀诸诗，俱悯乱之作，多感慨之词，虽文多隐避，而托体高妙。足见其胸襟高朗，意气宏放，不同凡响。与此诗作者之斤斤于个人浮沉，乏忧世之意，心胸狭隘，竟不乐生，相去实不能以道里计。刘勰《文心雕龙·体性》评阮诗“响逸而调远”，而《兔爰》响抑而调促，在风格上亦不相同。方氏但视其表，故有此失。\n有兔爰爰，雉离于罗。我生之初，尚无为。我生之后，逢此百罹，尚寐无吪！\n爰爰，缓纵貌。马瑞辰通释：“韩诗：‘爰，缓纵之貌。’胡承珙曰：‘纵当作从。缓从，谓解脱之，即郑笺纵之义。’其说是也。”\n离，遭。\n罗，捕鸟兽网。朱熹《诗集传》：“言张罗本以取兔，今兔狡得脱，而雉以耿介反离于罗。以比小人致乱，而以巧计幸免，君子无辜，而以忠直受祸也。”\n尚，犹、还。\n为，事，指军役之事。郑笺：“言我幼稚之时，庶几于无所为，谓军役之事也。”\n百，是虚数，许多的意思。\n罹（lí），忧。陈奂传疏：“说文无罹字，疑古毛诗作离。释文：‘罹，本又作离’；文选卢湛赠刘琨诗注引毛诗作‘逢此百离’……离为忧，则逢此百离，犹下章‘逢此百忧’耳。”\n尚，庶几，带有希望之意。此章二“尚”字意义不同。\n吪，说文：“动也。”尔雅作讹，是吪的或体。无吪（é），不想动嘴。此句意为，希望睡去不再说话。方玉润《诗经原始》：“无吪、无觉、无聪者，亦不过不欲言、不欲见、不欲闻已耳。”\n韵读：歌部——罗、为（音讹）、罹（音罗）、吪。\n有兔爰爰，雉离于罦。我生之初，尚无造。我生之后，逢此百忧，尚寐无觉！\n罦（fú），又名覆车，是一种带有机关的捕鸟兽网。尔雅释器郭注：“罦，今之翻车也，有两辕，中施罔以捕鸟。”\n造，与上章“为”字同义。尔雅释言：“作、造，为也。”\n觉，清醒。朱熹《诗集传》：“觉，寤也。”无觉即不想看见之意。\n韵读：幽部——罦、造（组瘦反）、忧、觉（左瘦反）。\n有兔爰爰，雉离于罿。我生之初，尚无庸。我生之后，逢此百凶，尚寐无聪！\n罿（tóng），捕鸟兽网。韩诗以为是张设在车上的网。说见释文。\n庸，用，指兵役。陈奂传疏：“无庸者，谓无用师之苦。”\n聪，毛传：“聪，闻也。”无聪，不想听见。皇侃：“无所闻，则亦死耳。”\n韵读：东部——罿、庸、凶、聪。"])</script><script>self.__next_f.push([1,"23:Tfca,"])</script><script>self.__next_f.push([1,"这是一个没落贵族因厌世而作的诗。他留恋西周宣王时代的“盛世”，那时虽有天灾，但无人祸，贵族的地位和利益尚未动摇。东迁以后，有些贵族失去了土地和人民，地位起了变化，甚至还要服役。这就是他感叹的“逢此百罹”的社会背景。他抚今忆昔，不觉产生了厌世思想，写了这么一首诗。毛序：“兔爰，闵周也。桓王失信，诸侯背叛，构怨连祸，王师伤败，君子不乐其生焉。”他将诗定为桓王时的作品，那是错误的。崔述《读风偶识》：“其人当生于宣王之末年，王室未骚，是以谓之‘无为’。既而幽王昏暴，戎狄侵陵，平王播迁，家室飘荡，是以谓之‘逢此百罹’。”崔氏确定的时代比较正确。\n此诗首二句是含有比义的兴，顾起元说：“三章各首二句比君子得祸，小人独免。下皆是叹其所遭而安于死也。”（《诗说汇纂》）顾氏指出了全诗结构的特点。方玉润《诗经原始》说：“词意凄怆，声情激越，阮步兵专学此种。”他指出此诗的风格及其继承关系。可是以阮籍诗当之，则大谬不然。阮嗣宗身当魏晋多事之秋，常恐罹谤遇祸，不预世事，以沉醉获免。论其行迹，倒也算得上“尚寐无觉”。他虽栖迟区外，实并未浑然忘世。咏怀诸诗，俱悯乱之作，多感慨之词，虽文多隐避，而托体高妙。足见其胸襟高朗，意气宏放，不同凡响。与此诗作者之斤斤于个人浮沉，乏忧世之意，心胸狭隘，竟不乐生，相去实不能以道里计。刘勰《文心雕龙·体性》评阮诗“响逸而调远”，而《兔爰》响抑而调促，在风格上亦不相同。方氏但视其表，故有此失。\n有兔爰爰，雉离于罗。我生之初，尚无为。我生之后，逢此百罹，尚寐无吪！\n爰爰，缓纵貌。马瑞辰通释：“韩诗：‘爰，缓纵之貌。’胡承珙曰：‘纵当作从。缓从，谓解脱之，即郑笺纵之义。’其说是也。”\n离，遭。\n罗，捕鸟兽网。朱熹《诗集传》：“言张罗本以取兔，今兔狡得脱，而雉以耿介反离于罗。以比小人致乱，而以巧计幸免，君子无辜，而以忠直受祸也。”\n尚，犹、还。\n为，事，指军役之事。郑笺：“言我幼稚之时，庶几于无所为，谓军役之事也。”\n百，是虚数，许多的意思。\n罹（lí），忧。陈奂传疏：“说文无罹字，疑古毛诗作离。释文：‘罹，本又作离’；文选卢湛赠刘琨诗注引毛诗作‘逢此百离’……离为忧，则逢此百离 null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"sourceLabel\":\"第 88-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"fullText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"兔爰㊟傷亂始也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"兔爰㊟傷亂始也。\",\"fullText\":\"兔爰㊟傷亂始也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？\",\"fullText\":\"右《兔爰》三章，章七句。《序》謂「桓王失信，諸侯背叛，搆怨連禍，王師傷敗，君子不樂其生」。《集傳》遂謂「庶幾寐而不動以死耳」。夫逢時多難，縱欲無生，何至求死？所謂「無吪」、「無覺」、「無聰」者，亦不過不欲言、不欲見、不欲聞已耳。天下洶洶，時事日非，上則諸侯背叛，射王中肩，君臣之義滅矣；下則室家相棄，有女仳離，夫婦之情乖矣；中則謂他人昆亦莫我聞，兄弟之親又遠矣。其始蓋由於申、甫是戍，忘讐黨惡，君無父子之恩，民亦鮮倫常之義，以致賢者退處下位，不欲居高以聽政；小人幸逃法網，反得肆志而横行。於是狡者脱而介者烹，奸者生而良者死。所謂百凶並見、百憂俱集時也。詩人不幸遭此亂離，不能不回憶生初猶及見西京盛世，法制雖衰，紀綱未壞，其時尚幸無事也。迨東都既遷，而後桓、文繼起，霸業頻興，而王綱愈墜，天下乃從此多故。彼蒼夢夢，有如聾聵，人又何言？不惟無言，且並不欲耳聞而目見之，故不如長睡不醒之爲愈耳。迨至長睡不醒，一無聞見，而思愈苦。古之傷心人能無爲我同聲一痛哭哉？此詩意也。何至如《集傳》云但求死耶？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評詞意悽愴，聲情激越，阮步兵專學此種。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評詞意悽愴，聲情激越，阮步兵專學此種。\",\"fullText\":\"眉評詞意悽愴，聲情激越，阮步兵專學此種。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋爰爰〔《集傳》曰〕兔性陰狡。爰爰，緩意。〔孔氏穎達曰〕無所拘制，爰爰然而緩。雉〔《集傳》〕雉性耿介。離麗也。羅網也。罹憂也。吪〔黄氏震曰〕古注：吪，動也。蓋動則憂，寐則不知。故欲無吪。〔姚氏際恒曰〕吪字從口，從言之訛亦同。《小雅》「或寢或訛」即此。吪，方寤動而有聲也。無吪，不言之意。後説較通。罦〔孔氏穎達曰〕《釋器》云：「繴謂之罿。罿，罬也。罬謂之罦，罦，覆車也。」孫炎曰：「覆車，網可以掩兔者也。」造亦爲也。覺寤也。庸用也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋爰爰〔《集傳》曰〕兔性陰狡。爰爰，緩意。〔孔氏穎達曰〕無所拘制，爰爰然而緩。雉〔《集傳》〕雉性耿介。離麗也。羅網也。罹憂也。吪〔黄氏震曰〕古注：吪，動也。蓋動則憂，寐則不知。故欲無吪。〔姚氏際恒曰〕吪字從口，從言之訛亦同。《小雅》「或寢或訛」即此。吪，方寤動而有聲也。無吪，不言之意。後説較通。罦〔孔氏穎達曰〕《釋器》云：「繴謂之罿。罿，罬也。罬謂之罦，罦，覆車也。」孫炎曰：「覆車，網可以掩兔者也。」造亦爲也。覺寤也。庸用也。\",\"fullText\":\"集釋爰爰〔《集傳》曰〕兔性陰狡。爰爰，緩意。〔孔氏穎達曰〕無所拘制，爰爰然而緩。雉〔《集傳》〕雉性耿介。離麗也。羅網也。罹憂也。吪〔黄氏震曰〕古注：吪，動也。蓋動則憂，寐則不知。故欲無吪。〔姚氏際恒曰〕吪字從口，從言之訛亦同。《小雅》「或寢或訛」即此。吪，方寤動而有聲也。無吪，不言之意。後説較通。罦〔孔氏穎達曰〕《釋器》云：「繴謂之罿。罿，罬也。罬謂之罦，罦，覆車也。」孫炎曰：「覆車，網可以掩兔者也。」造亦爲也。覺寤也。庸用也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻羅五歌。爲四支，叶吾禾反。罹同上，叶良何反。吪五歌。叶韻。罦十一尤，叶步廟反。造二十號。憂十一尤，叶一笑反。覺十九效。叶韻。罿一東。庸二冬。凶同。聰一東。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻羅五歌。爲四支，叶吾禾反。罹同上，叶良何反。吪五歌。叶韻。罦十一尤，叶步廟反。造二十號。憂十一尤，叶一笑反。覺十九效。叶韻。罿一東。庸二冬。凶同。聰一東。通韻。\",\"fullText\":\"標韻羅五歌。爲四支，叶吾禾反。罹同上，叶良何反。吪五歌。叶韻。罦十一尤，叶步廟反。造二十號。憂十一尤，叶一笑反。覺十九效。叶韻。罿一東。庸二冬。凶同。聰一東。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"尚寐無聰\",\"sourceLabel\":\"第 359 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"無聰\",\"fullText\":\"無聰\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-021:3-4:無聰\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-021\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"sourceLabel\":\"第 86-87 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释《兔爰》，直指为妇人被夫遗弃之诗：以兔雉陷网起兴，\",\"fullText\":\"屈万里释《兔爰》，直指为妇人被夫遗弃之诗：以兔雉陷网起兴，三章分写“百罹”“百憂”“百凶”，而“無吪”“無覺”“無聰”层层加深其不愿言、不愿醒、不愿闻之苦。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:2-2:兔\",\"seg-002:1-1:雉\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉離于羅，我生之初，尚無爲，我生之後，逢此百罹，尚寐無吪，有兔爰爰，雉離于罦，我生之初，尚無造，我生之後，逢此百憂，尚寐無覺，有兔爰爰，雉離于罿，我生之初，尚無庸，我生之後，逢此百凶，尚寐無聰。\",\"sourceLabel\":\"第 86-87 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"三章分写“百罹”“百憂”“百凶”，而“無吪”“無覺”“無聰”层层加深其不愿言、不愿醒、不愿闻之苦。\",\"fullText\":\"屈万里释《兔爰》，直指为妇人被夫遗弃之诗：以兔雉陷网起兴，三章分写“百罹”“百憂”“百凶”，而“無吪”“無覺”“無聰”层层加深其不愿言、不愿醒、不愿闻之苦。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-006:3-4:百罹\",\"seg-013:3-4:百憂\",\"seg-020:3-4:百凶\",\"seg-007:3-4:無吪\",\"seg-014:3-4:無覺\",\"seg-021:3-4:無聰\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"wangli-yundu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/070-tu-yuan/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有兔爰爰，雉离于罗，我生之初，尚无为，我生之后，逢此百罹，尚寐无吪，有兔爰爰，雉离于罦，我生之初，尚无造，我生之后，逢此百忧，尚寐无觉，有兔爰爰，雉离于罿，我生之初，尚无庸，我生之后，逢此百凶，尚寐无聪。\",\"sourceLabel\":\"第 179-180 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"王力在《韵读》中录《兔爰》三章，并依韵部转注其声读：首章“罗、为、罹、吪”归
