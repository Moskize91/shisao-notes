i:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:3-3:予","segmentId":"seg-012","segmentOrder":12,"surfaceText":"予","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:4-4:子","segmentId":"seg-012","segmentOrder":12,"surfaceText":"子","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:5-5:憎","segmentId":"seg-012","segmentOrder":12,"surfaceText":"憎","charStart":5,"charEnd":5,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。","sourceLabel":"第 204-205 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。","fullText":"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章上二句是夫对妻的话，他希望多睡一会儿。下二句是妻的回答，她说：“朝会都快散了，快起来吧，别让人家讨厌你。”","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。","sourceLabel":"第 204-205 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。","fullText":"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的 聽，實情。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"行间评","excerpt":"審聽，實情。","fullText":"審聽，實情。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-003","seg-004"]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"東方明矣，朝既昌矣。匪東方則明，月出之光。上章聽，此章視，視聽莫不關心。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"行间评","excerpt":"上章聽，此章視，視聽莫不關心。","fullText":"上章聽，此章視，視聽莫不關心。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-005","seg-006","seg-007","seg-008"]},{"id":"fangyurun-yuanshi:0005-1:part-1","annotationId":"0005","glossId":"0005-1","glossHref":"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0005-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"蟲飛薨薨，甘與子同夢。此乃實景，進一層法。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"行间评","excerpt":"此乃實景，進一層法。","fullText":"此乃實景，進一層法。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-009","seg-010"]},{"id":"fangyurun-yuanshi:0006-1:part-1","annotationId":"0006","glossId":"0006-1","glossHref":"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0006-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"會且歸矣，無庶予子憎。倒字句。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"行间评","excerpt":"倒字句。","fullText":"倒字句。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0007-1:part-1","annotationId":"0007","glossId":"0007-1","glossHref":"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0007-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。","fullText":"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0008-1:part-1","annotationId":"0008","glossId":"0008-1","glossHref":"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0008-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"會且歸矣。會朝也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集釋","excerpt":"會朝也。","fullText":"會朝也。","notes":null," 01-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。\",\"sourceLabel\":\"第 204-205 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。\",\"fullText\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章上二句是夫对妻的话，他希望多睡一会儿。下二句是妻的回答，她说：“朝会都快散了，快起来吧，别让人家讨厌你。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。\",\"sourceLabel\":\"第 204-205 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。\",\"fullText\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章上二句是夫对妻的话，他希望多睡一会儿。下二句是妻的回答，她说：“朝会都快散了，快起来吧，别让人家讨厌你。”\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:鸡既鸣矣\",\"s 作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章上二句是夫对妻的话，他希望多睡一会儿。下二句是妻的回答，她说：“朝会都快散了，快起来吧，别让人家讨厌你。”\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-005:1-4:东方明矣\",\"seg-006:1-4:朝既昌矣\",\"seg-007:1-5:匪东方则明\",\"seg-008:1-4:月出之光\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\",\"anchor-4-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。\",\"sourceLabel\":\"第 204-205 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。\",\"fullText\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎 nId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪鷄則鳴，蒼蠅之聲。審聽，實情。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"審聽，實情。\",\"fullText\":\"審聽，實情。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-003\",\"seg-004\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"東方明矣，朝既昌矣。匪東方則明，月出之光。上章聽，此章視，視聽莫不關心。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"上章聽，此章視，視聽莫不關心。\",\"fullText\":\"上章聽，此章視，視聽莫不關心。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蟲飛薨薨，甘與子同夢。此乃實景，進一層法。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"此乃實景，進一層法。\",\"fullText\":\"此乃實景，進一層法。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\"]},{\"id\":\"fangyurun-yuanshi:0006-1:part-1\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0006-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"會且歸矣，無庶予子憎。倒字句。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"倒字句。\",\"fullText\":\"倒字句。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0007-1:part-1\",\"annotationId\":\"0007\",\"glossId\":\"0007-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0007-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。\",\"fullText\":\"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間， \",\"segmentOrder\":12,\"surfaceText\":\"憎\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。\",\"sourceLabel\":\"第 204-205 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。\",\"fullText\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章上二句是夫对妻的话，他希望多睡一会儿。下二句是妻的回答，她说：“朝会都快散了，快起来吧，别让人家讨厌你。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。\",\"sourceLabel\":\"第 204-205 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。\",\"fullText\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章 。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。甘，乐意、喜欢。同梦，同睡。会，朝会。且，即将。归，指散朝归去。庶，庶几，带有希望之意。“无庶”即“庶无”的倒文。予，同“与”，给。子，你，指丈夫。憎，憎恶、讨厌。马瑞辰《通释》：“庶，幸也。无庶，即庶无之倒文。……予、与古今字。予子憎，《尔雅》引定本作‘与子憎’。与，犹遗也。遗，犹贻也。无庶与子憎，即庶无贻子憎。犹诗言‘无父母贻罹’，左传‘无贻寡君羞’也。”按这章上二句是夫对妻的话，他希望多睡一会儿。下二句是妻的回答，她说：“朝会都快散了，快起来吧，别让人家讨厌你。”\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-002:1-1:朝\",\"seg-002:3-3:盈\",\"seg-003:3-3:则\",\"seg-004:1-4:苍蝇之声\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。东方明矣，朝既昌矣。匪东方则明，月出之光。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。\",\"sourceLabel\":\"第 204-205 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"东方明矣，朝既昌矣。匪东方则明，月出之光。\",\"fullText\":\"这是一首妻催夫早起的诗。毛序：“鸡鸣，思贤妃也。哀公荒淫怠慢，故陈贤妃贞女夙夜警戒相成之道焉。”这是引申开去的讽喻之意，并非诗的本义。诗中的妻和夫，说是君和妃固然切题，说是大夫和妻妾亦未尝不可。李商隐《为有》所云：“无端嫁得金龟婿，辜负香衾事早朝。”盖此诗之遗意。诗为问答联句体，但哪几句是谁说的，大家意见不一致。我们认为这位夫人催她丈夫早起的原因，是怕他误了上朝的时间，引起别人的批评，所以提到朝会的都是她说的话，而赖着不肯起床的都是丈夫的话。诗贵创意，诗经因为处在文学的最早成熟期，故独多创意之作。即如此篇，男子淹恋枕席，而不愿闻鸡之鸣，与郑风《女曰鸡鸣》情景略似。六朝乐府《乌夜啼》：“可怜乌臼鸟，强言知天曙。无故三更啼，欢子冒暗去。”李廓《鸡鸣曲》：“长恨鸡鸣别时苦，不遣鸡栖近窗户。”《云溪友议》载崔涯杂嘲：“寒鸡鼓翼纱窗外，已觉恩情逐晓风。”盖男女欢会，亦无端牵率鸡犬也。诸诗之意，尽从此篇翻出，此三百篇之所以可贵也。鸡既鸣矣，朝既盈矣。匪鸡则鸣，苍蝇之声。朝，朝廷。盈，满，指上朝的人都到齐了。古代国君于清晨上朝接见群臣。书大传云：“鸡鸣……然后应门击柝，告辟也。然后少师奏质明于阶下。”郑注：“应门，朝门也。辟，启也。”按以上二句是妻子说的话，下二句是丈夫回答的话。则，之、而。杨树达词诠：“则，陪从连词，与‘之’同。”下章“匪东方则明”的“则”义同。苍蝇之声，这句是男子留恋床第，所以对妻子鸡鸣应起的催促，用苍蝇之声来加以推托。毛传曰：“苍蝇之声，有似远鸡之鸣。”后世学者又群起争论鸡鸣、蝇飞何者为先，实在是胶柱鼓瑟，将饶有情致的诗意破坏殆尽。东方明矣，朝既昌矣。匪东方则明，月出之光。昌，盛多貌。按这章也是上二句为妻子的催促，下二句为丈夫的对话。虫飞薨薨，甘与子同梦。会且归矣，无庶予子憎。薨薨，虫子群飞声，象声词。 s\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\"]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪鷄則鳴，蒼蠅之聲。審聽，實情。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"審聽，實情。\",\"fullText\":\"審聽，實情。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-003\",\"seg-004\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"東方明矣，朝既昌矣。匪東方則明，月出之光。上章聽，此章視，視聽莫不關心。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"上章聽，此章視，視聽莫不關心。\",\"fullText\":\"上章聽，此章視，視聽莫不關心。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蟲飛薨薨，甘與子同夢。此乃實景，進一層法。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"此乃實景，進一層法。\",\"fullText\":\"此乃實景，進一層法。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\"]},{\"id\":\"fangyurun-yuanshi:0006-1:part-1\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0006-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"會且歸矣，無庶予子憎。倒字句。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"行间评\",\"excerpt\":\"倒字句。\",\"fullText\":\"倒字句。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0007-1:part-1\",\"annotationId\":\"0007\",\"glossId\":\"0007-1\",\"glossHref\":\"/shijing/gloss/096-ji-ming/fangyurun-yuanshi/0007-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，有夜漏以警心，有太師以奏誡，豈煩乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明哉？此正士夫之家鷄鳴待旦，賢婦關心，常恐早朝遲誤，有累慎德，不惟人憎夫子，且及其婦。故尤爲關心，時存警畏，不敢留於逸欲也。至謂鷄聲與蠅聲，大小不類，此又詩人之詞多在可解不可解之間，不必以辭害意也。若必巧爲之辯，則興會索然矣。「會且歸矣」，亦心切早朝之意。前二章摹寫其以早爲遲，其實時尚早也。此章則真恐其遲，故進一層言，非不欲與子同夢，特恐朝會人歸致召人咎耳。全詩純用虚寫，極回環摩盪之致，古今絶作也。\",\"fullText\":\"右《鷄鳴》三章，章四句。《序》謂「思賢妃，刺哀公」，朱鬱儀謂「美乙公之王姬」，僞説謂「衛姬勸桓公」。衆説不一，皆無確據。故《集傳》但以爲古賢妃告戒於君之詞，姚氏際恒又謂爲賢妃作也可，即大夫妻作也亦無不可。總之，警其夫欲令早起，故終夜關心，乍寐乍覺，誤以蠅聲爲鷄聲，以月光爲東方明。真情實景，寫來活現。可謂善於説詩矣。然愚謂賢妃進御於君，
