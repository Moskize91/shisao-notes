ianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。","sourceLabel":"第 225-227 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。","fullText":"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。汾，水名，在今山西中部。沮洳，水旁低湿处。言，语首助词。莫，野菜名。陆玑诗草木鸟兽虫鱼疏：“莫，茎大如箸，赤节，节一叶，似柳叶，厚而长，有毛刺。……始生可以为羹，又可生食。五方通谓之酸迷。”彼、之，都是第三人称代名词，为了加重语气，所以重复地说，这里指采菜的人。王先谦集疏：“之子，指采菜之贤者。”其，句中助词，无义。度，尺寸。陆德明经典释文：“度，丈尺也。”无度，犹不可衡量。郑笺：“是子之德，美无有度，言不可尺寸。”“美无度”句下重复“美无度”，即顶真的修辞格。殊，同“异”。乎，同于。公路，与下章的公行、公族都是当时的官名。公路是管理魏君路车的官员，公行是管理兵车的，公族是管理宗族事务的。这些官员都以贵族子弟充任，其职位、傣禄均世袭，即所谓“无材世禄”者。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。方，同旁。一方，指在汾水旁边一个地方。英，花朵。俞樾群经平议：“英，读如‘颜如舜英’之英。”彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。曲，水流弯曲处。藚，药名，又称泽泻，可入药，亦可作菜。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/108-fen-ju-ru/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zh gjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-5:殊异乎公族\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"殊异乎公族\",\"charStart\":1,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:4-5:公族\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"公族\",\"charStart\":4,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。\",\"sourceLabel\":\"第 225-227 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。\",\"fullText\":\"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。汾，水名，在今山西中部。沮洳，水旁低湿处。言，语首助词。莫，野菜名。陆玑诗草木鸟兽虫鱼疏：“莫，茎大如箸，赤节，节一叶，似柳叶，厚而长，有毛刺。……始生可以为羹，又可生食。五方通谓之酸迷。”彼、之，都是第三人称代名词，为了加重语气，所以重复地说，这里指采菜的人。王先谦集疏：“之子，指采菜之贤者。”其，句中助词，无义。度，尺寸。陆德明经典释文：“度，丈尺也。”无度，犹不可衡量。郑笺：“是子之德，美无有度，言不可尺寸。”“美无度”句下重复“美无度”，即顶真的修辞格。殊，同“异”。乎，同于。公路，与下章的公行、公族都是当时的官名。公路是管理魏君路车的官员，公行是管理兵车的，公族是管理宗族事务的。这些官员都以贵族子弟充任，其职位、傣禄均世袭，即所谓“无材世禄”者。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。方，同旁。一方，指在汾水旁边一个地方。英，花朵。俞樾群经平议：“英，读如‘颜如舜英’之英。”彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。曲，水流弯曲处。藚，药名，又称泽泻，可入药，亦可作菜。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。\",\"sourceLabel\":\"第 225-227 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。\",\"fullText\":\"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。汾，水名，在今山西中部。沮洳，水旁低湿处。言，语首助词。莫，野菜名。陆玑诗草木鸟兽虫鱼疏：“莫，茎大如箸，赤节，节一叶，似柳叶，厚而长，有毛刺。……始生可以为羹，又可生食。五方通谓之酸迷。”彼、之，都是第三人称代名词，为了加重语气，所以重复地说，这里指采菜的人。王先谦集疏：“之子，指采菜之贤者。”其，句中助词，无义。度，尺寸。陆德明经典释文：“度，丈尺也。”无度，犹不可衡量。郑笺：“是子之德，美无有度，言不可尺寸。”“美无度”句下重复“美无度”，即顶真的修辞格。殊，同“异”。乎，同于。公路，与下章的公行、公族都是当时的官名。公路是管理魏君路 ,\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"美儉德也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"美儉德也。\",\"fullText\":\"美儉德也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《汾沮洳》三章，章六句。前篇刺褊，此篇美儉。二詩互證，義旨乃明。蓋儉無可議，褊乃足刺。故既刺其褊，復美能儉也。《小序》不知，乃以爲刺，《大序》更謂「其君儉以能勤，刺不得禮」，豈不謬哉？且詩言「公路」、「公行」、「公族」，明是爲卿大夫發，《序》何以刺及其君？魏君縱勤與儉、斷不至親手采莫，以失其度。即卿大夫，亦不過於汾水彎環間，課農樹桑，爲子孫計，已足見其爲勤儉也。此必公族子姓，各有賜莊，躬親樹畜，詩人於采莫、采桑、采藚之際，得睹勤勞而歎美之。以爲「彼其之子」，身居貴冑，德復粹然，而又能勤與儉，毫無驕奢習氣，殊異乎公族輩也。蓋世禄之家，鮮克由禮，而此獨超出流品，則其德詎可量耶？若毛、鄭及《集傳》諸解，以爲「此人美則美矣，然其儉嗇褊急之態，殊不似貴人」。既儉嗇褊急矣，又何云美？方美而忽刺，上下語氣必不相貫。即姚氏所云，詩人託言采物以美公族之人，其所美者何在？亦甚忽突。故不足以服群議也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《汾沮洳》三章，章六句。前篇刺褊，此篇美儉。二詩互證，義旨乃明。蓋儉無可議，褊乃足刺。故既刺其褊，復美能儉也。《小序》不知，乃以爲刺，《大序》更謂「其君儉以能勤，刺不得禮」，豈不謬哉？且詩言「公路」、「公行」、「公族」，明是爲卿大夫發，《序》何以刺及其君？魏君縱勤與儉、斷不至親手采莫，以失其度。即卿大夫，亦不過於汾水彎環間，課農樹桑，爲子孫計，已足見其爲勤儉也。此必公族子姓，各有賜莊，躬親樹畜，詩人於采莫、采桑、采藚之際，得睹勤勞而歎美之。以爲「彼其之子」，身居貴冑，德復粹然，而又能勤與儉，毫無驕奢習氣，殊異乎公族輩也。蓋世禄之家，鮮克由禮，而此獨超出流品，則其德詎可量耶？若毛、鄭及《集傳》諸解，以爲「此人美則美矣，然其儉嗇褊急之態，殊不似貴人」。既儉嗇褊急矣，又何云美？方美而忽刺，上下語氣必不相貫。即姚氏所云，詩人託言采物以美公族之人，其所美者何在？亦甚忽突。故不足以服群議也。\",\"fullText\":\"右《汾沮洳》三章，章六句。前篇刺褊，此篇美儉。二詩互證，義旨乃明。蓋儉無可議，褊乃足刺。故既刺其褊，復美能儉也。《小序》不知，乃以爲刺，《大序》更謂「其君儉以能勤，刺不得禮」，豈不謬哉？且詩言「公路」、「公行」、「公族」，明是爲卿大夫發，《序》何以刺及其君？魏君縱勤與儉、斷不至親手采莫，以失其度。即卿大夫，亦不過於汾水彎環間，課農樹桑，爲子孫計，已足見其爲勤儉也。此必公族子姓，各有賜莊，躬親樹畜，詩人於采莫、采桑、采藚之際，得睹勤勞而歎美之。以爲「彼其之子」，身居貴冑，德復粹然，而又能勤與儉，毫無驕奢習氣，殊異乎公族輩也。蓋世禄之家，鮮克由禮，而此獨超出流品，則其德詎可量耶？若毛、鄭及《集傳》諸解，以爲「此人美則美矣，然其儉嗇褊急之態，殊不似貴人」。既儉嗇褊急矣，又何云美？方美而忽刺，上下語氣必不相貫。即姚氏所云，詩人託言采物以美公族之人，其所美者何在？亦甚忽突。故不足以服群議也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"「殊異」是美詞，非刺詞，上下文語意方貫。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉評\",\"excerpt\":\"「殊異」是美詞，非刺詞，上下文語意方貫。\",\"fullText\":\"「殊異」是美詞，非刺詞，上下文語意方貫。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"汾水名，出太原晉陽山，西南入河。〔王氏應麟曰〕《水經》：「汾水西至汾陰縣北，西入于河。入河之處即魏之舊國。」沮洳水浸處下濕之地。莫菜也。〔陸氏璣曰〕莫，莖大如箸，赤節，節一葉。今人繅以取繭緒，其味酢而滑。五方通謂之酸迷，河、汾之間謂之莫。無度〔《集傳》〕無度，言不可以尺寸量也。度，限也。公路〔《集傳》〕公路者，掌公之路車。晉以卿大夫之庶子爲之。公行〔《集傳》〕公行，即公路也。以其主兵車之行列，故謂之公行也。〔孔氏穎達曰〕公路與公行一也。宣二年《左傳》云：「晉成公立，乃宦卿之適，以爲公族，其庶子爲公行。趙質請以括爲公族，「趙質」，《左傳》及《毛詩正義》均作「趙盾」。下二處同。公許之。冬趙質爲軞車之族。」是其事也。趙質自以爲庶子，讓公族而爲公行。服虔云：「軞車，戎車之倅。」杜預云「公行之官」是也。藚水舄也，葉如車前草。〔孔氏穎達曰〕郭璞云：「水蕮，如續斷，寸寸有節，拔之可復。」陸璣《疏》云：「今澤蕮也。」公族〔《集傳》〕公族，掌公之宗族。晉以卿大夫之適子爲之。〔孔氏穎達曰〕成十八年《左傳》曰：「晉荀會、欒黶、韓無忌爲公族大夫，使訓卿之子弟。」是公族，王君之同姓也。此公族、公行，諸侯之官，故魏、晉有之。《周禮》六官，皆無公族、公行之官。是天子諸侯異禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel ":4,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-013:1-4:彼汾一曲\",\"segmentId\":\"seg-013\",\"segmentOrder\":13,\"surfaceText\":\"彼汾一曲\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-013:4-4:曲\",\"segmentId\":\"seg-013\",\"segmentOrder\":13,\"surfaceText\":\"曲\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-014:1-4:言采其藚\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"言采其藚\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-014:4-4:藚\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"藚\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-015:1-4:彼其之子\",\"segmentId\":\"seg-015\",\"segmentOrder\":15,\"surfaceText\":\"彼其之子\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:1-3:美如玉\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"美如玉\",\"charStart\":1,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-017:1-3:美如玉\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"美如玉\",\"charStart\":1,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-5:殊异乎公族\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"殊异乎公族\",\"charStart\":1,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:4-5:公族\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"公族\",\"charStart\":4,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。\",\"sourceLabel\":\"第 225-227 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。\",\"fullText\":\"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。汾，水名，在今山西中部。沮洳，水旁低湿处。言，语首助词。莫，野菜名。陆玑诗草木鸟兽虫鱼疏：“莫，茎大如箸，赤节，节一叶，似柳叶，厚而长，有毛刺。……始生可以为羹，又可生食。五方通谓之酸迷。”彼、之，都是第三人称代名词，为了加重语气，所以重复地说，这里指采菜的人。王先谦集疏：“之子，指采菜之贤者。”其，句中助词，无义。度，尺寸。陆德明经典释文：“度，丈尺也。”无度，犹不可衡量。郑笺：“是子之德，美无有度，言不可尺寸。”“美无度”句下重复“美无度”，即顶真的修辞格。殊，同“异”。乎，同于。公路，与下章的公行、公族都是当时的官名。公路是管理魏君路车的官员，公行是管理兵车的，公族是管理宗族事务的。这些官员都以贵族子弟充任，其职位、傣禄均世袭，即所谓“无材世禄”者。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。方，同旁。一方，指在汾水旁边一个地方。英，花朵。俞樾群经平议：“英，读如‘颜如舜英’之英。”彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。曲，水流弯曲处。藚，药名，又称泽泻，可入药，亦可作菜。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。\",\"sourceLabel\":\"第 225-227 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。\",\"fullText\":\"这是一首赞美劳动者才德的诗。春秋时代劳动人民地位极低，有的仍然是农奴。诗人将这位从事采菜的“贱者”与“公路”等达官贵族相比，而且褒前者而抑后者，这是颇不寻常的。只有劳动人民的口头歌唱，才会有这样热爱同类的诗句。毛序：“汾沮洲，刺俭也。其君子俭以能勤，刺不得礼也。”认为这是贵族躬自采菜，俭而过度。韩诗外传：“君子盛德而卑，虚己以受人，旁行不流，应物而不穷，虽在下位，民愿戴之，虽欲无尊得乎哉！”魏源诗古微：“据外传之言，盖叹沮泽之间有贤者隐居在下，采蔬自给。然其才德实出乎在位公行、公路之上。……盖春秋时晋官皆贵游子弟，无材世禄，贤者不得用，用者不必贤也。”二说相比较，韩诗显然比毛诗来得切近诗意。这首诗同葛履、硕鼠、伐檀一样，都富有斗争性，不但在魏风中，便是在整部诗经中也算得上杰出的诗篇。彼汾沮洳，言采其莫。彼其之子，美无度。美无度，殊异乎公路。汾，水名，在今山西中部。沮洳，水旁低湿处。言，语首助词。莫，野菜名。陆玑诗草木鸟兽虫鱼疏：“莫，茎大如箸，赤节，节一叶，似柳叶，厚而长，有毛刺。……始生可以为羹，又可生食。五方通谓之酸迷。”彼、之，都是第三人称代名词，为了加重语气，所以重复地说，这里指采菜的人。王先谦集疏：“之子，指采菜之贤者。”其，句中助词，无义。度，尺寸。陆德明经典释文：“度，丈尺也。”无度，犹不可衡量。郑笺：“是子之德，美无有度，言不可尺寸。”“美无度”句下重复“美无度”，即顶真的修辞格。殊，同“异”。乎，同于。公路，与下章的公行、公族都是当时的官名。公路是管理魏君路车的官员，公行是管理兵车的，公族是管理宗族事务的。这些官员都以贵族子弟充任，其职位、傣禄均世袭，即所谓“无材世禄”者。彼汾一方，言采其桑。彼其之子，美如英。美如英，殊异乎公行。方，同旁。一方，指在汾水旁边一个地方。英，花朵。俞樾群经平议：“英，读如‘颜如舜英’之英。”彼汾一曲，言采其藚。彼其之子，美如玉。美如玉，殊异乎公族。曲，水流弯曲处。藚，药名，又称泽泻，可入药，亦可作菜。\",\"notes\":null,\"pa ref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"美儉德也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"美儉德也。\",\"fullText\":\"美儉德也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《汾沮洳》三章，章六句。前篇刺褊，此篇美儉。二詩互證，義旨乃明。蓋儉無可議，褊乃足刺。故既刺其褊，復美能儉也。《小序》不知，乃以爲刺，《大序》更謂「其君儉以能勤，刺不得禮」，豈不謬哉？且詩言「公路」、「公行」、「公族」，明是爲卿大夫發，《序》何以刺及其君？魏君縱勤與儉、斷不至親手采莫，以失其度。即卿大夫，亦不過於汾水彎環間，課農樹桑，爲子孫計，已足見其爲勤儉也。此必公族子姓，各有賜莊，躬親樹畜，詩人於采莫、采桑、采藚之際，得睹勤勞而歎美之。以爲「彼其之子」，身居貴冑，德復粹然，而又能勤與儉，毫無驕奢習氣，殊異乎公族輩也。蓋世禄之家，鮮克由禮，而此獨超出流品，則其德詎可量耶？若毛、鄭及《集傳》諸解，以爲「此人美則美矣，然其儉嗇褊急之態，殊不似貴人」。既儉嗇褊急矣，又何云美？方美而忽刺，上下語氣必不相貫。即姚氏所云，詩人託言采物以美公族之人，其所美者何在？亦甚忽突。故不足以服群議也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《汾沮洳》三章，章六句。前篇刺褊，此篇美儉。二詩互證，義旨乃明。蓋儉無可議，褊乃足刺。故既刺其褊，復美能儉也。《小序》不知，乃以爲刺，《大序》更謂「其君儉以能勤，刺不得禮」，豈不謬哉？且詩言「公路」、「公行」、「公族」，明是爲卿大夫發，《序》何以刺及其君？魏君縱勤與儉、斷不至親手采莫，以失其度。即卿大夫，亦不過於汾水彎環間，課農樹桑，爲子孫計，已足見其爲勤儉也。此必公族子姓，各有賜莊，躬親樹畜，詩人於采莫、采桑、采藚之際，得睹勤勞而歎美之。以爲「彼其之子」，身居貴冑，德復粹然，而又能勤與儉，毫無驕奢習氣，殊異乎公族輩也。蓋世禄之家，鮮克由禮，而此獨超出流品，則其德詎可量耶？若毛、鄭及《集傳》諸解，以爲「此人美則美矣，然其儉嗇褊急之態，殊不似貴人」。既儉嗇褊急矣，又何云美？方美而忽刺，上下語氣必不相貫。即姚氏所云，詩人託言采物以美公族之人，其所美者何在？亦甚忽突。故不足以服群議也。\",\"fullText\":\"右《汾沮洳》三章，章六句。前篇刺褊，此篇美儉。二詩互證，義旨乃明。蓋儉無可議，褊乃足刺。故既刺其褊，復美能儉也。《小序》不知，乃以爲刺，《大序》更謂「其君儉以能勤，刺不得禮」，豈不謬哉？且詩言「公路」、「公行」、「公族」，明是爲卿大夫發，《序》何以刺及其君？魏君縱勤與儉、斷不至親手采莫，以失其度。即卿大夫，亦不過於汾水彎環間，課農樹桑，爲子孫計，已足見其爲勤儉也。此必公族子姓，各有賜莊，躬親樹畜，詩人於采莫、采桑、采藚之際，得睹勤勞而歎美之。以爲「彼其之子」，身居貴冑，德復粹然，而又能勤與儉，毫無驕奢習氣，殊異乎公族輩也。蓋世禄之家，鮮克由禮，而此獨超出流品，則其德詎可量耶？若毛、鄭及《集傳》諸解，以爲「此人美則美矣，然其儉嗇褊急之態，殊不似貴人」。既儉嗇褊急矣，又何云美？方美而忽刺，上下語氣必不相貫。即姚氏所云，詩人託言采物以美公族之人，其所美者何在？亦甚忽突。故不足以服群議也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"「殊異」是美詞，非刺詞，上下文語意方貫。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉評\",\"excerpt\":\"「殊異」是美詞，非刺詞，上下文語意方貫。\",\"fullText\":\"「殊異」是美詞，非刺詞，上下文語意方貫。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/108-fen-ju-ru/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"汾水名，出太原晉陽山，西南入河。〔王氏應麟曰〕《水經》：「汾水西至汾陰縣北，西入于河。入河之處即魏之舊國。」沮洳水浸處下濕之地。莫菜也。〔陸氏璣曰〕莫，莖大如箸，赤節，節一葉。今人繅以取繭緒，其味酢而滑。五方通謂之酸迷，河、汾之間謂之莫。無度〔《集傳》〕無度，言不可以尺寸量也。度，限也。公路〔《集傳》〕公路者，掌公之路車。晉以卿大夫之庶子爲之。公行〔《集傳》〕公行，即公路也。以其主兵車之行列，故謂之公行也。〔孔氏穎達曰〕公路與公行一也。宣二年《左傳》云：「晉成公立，乃宦卿之適，以爲公族，其庶子爲公行。趙質請以括爲公族，「趙質」，《左傳》及《毛詩正義》均作「趙盾」。下二處同。公許之。冬趙質爲軞車之族。」是其事也。趙質自以爲庶子，讓公族而爲公行。服虔云：「軞車，戎車之倅。」杜預云「公行之官」是也。藚水舄也，葉如車前草。〔孔氏穎達曰〕郭璞云：「水蕮，如續斷，寸寸有節，拔之可復。」陸璣《疏》云：「今澤蕮也。」公族〔《集傳》〕公族，掌公之宗族。晉以卿大夫之適子爲之。〔孔氏穎達曰〕成十八年《左傳》曰：「晉荀會、欒黶、韓無忌爲公族大夫，使訓卿之子弟。」是公族，王君之同姓也。此公族、公行，諸侯之官，故魏、晉有之。《周禮》六官，皆無公族、公行之官。是天子諸侯異禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"汾水名，出太原晉陽山，西南入河。〔王氏應麟曰〕《水經》：「汾水西至汾陰縣北，西入于河。入河之處即魏之舊國。」\",\"fullText\":\"汾水名，出太原晉陽山，西南入河。〔王氏應麟曰〕《水經》：「汾水西至汾陰縣北，西入于河。入河之處即魏之舊國。」沮洳水浸處下濕之地。莫菜也。〔陸氏璣曰〕莫，莖大如箸，赤節，節一葉。今人繅以取繭緒，其味酢而滑。五方通謂之酸迷，河、汾之間謂
