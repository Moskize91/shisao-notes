":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"总评","excerpt":"右《駟驖》三章，章四句。此诗附以序言，述嘉襄公命田狩之事，虽不能确考始命，但可视为君臣共乐之俗。","fullText":"右《駟驖》三章，章四句。此诗附以序言，述嘉襄公命田狩之事，虽不能确考始命，但可视为君臣共乐之俗。","notes":"将眉评合入总评段。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋駟驖〔陸氏佃曰〕《説文》曰：「馬深黑色驪，馬赤黑色驖。」非特有取於色，蓋亦取其堅壯如鐵也。孔甚也。阜肥大也。六轡〔孔氏穎達曰〕每馬有二轡，四馬當八轡矣。言六轡者，以驂馬内轡納之於觖，故在手者惟六轡耳。媚子〔朱氏道行曰〕媚子，指左右便嬖。時是也。辰時也。牡〔曹氏粹中曰〕祭祀之牲不用牝，皆以牡爲貴。辰牡〔《集傳》〕冬獻狼，夏獻麋，春秋獻鹿豕之類。奉〔孔氏穎達曰〕「奉是時牡」，謂虞人也。獸人獻時節之獸以供膳，故虞人亦驅時節之獸以待射耳。碩肥大也。左之〔何氏士信曰〕御者從右以逐之，君從左以射之。《公羊傳》解第一殺、第二殺、第三殺，皆自左膘射之達於右，則左當人君之左，指禽獸之左膘而言。〔案〕射必左出，故左之乃易中耳。拔矢括也。閑調習也。輶輕也。鸞鈴也。鑣馬銜也。獫歇驕〔《集傳》〕獫、歇、驕，皆田犬名。長喙曰獫，短喙曰歇、驕。以車載犬，蓋以休其足力也。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"集释","excerpt":"释文与诸家注说解释各句名词词义。","fullText":"释文与诸家注说解释各句名词词义。","notes":"集释原文。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0004 -1-5\",\"anchor-1-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"驷驖孔阜六辔在手公之媚子从公于狩奉时辰牡辰牡孔硕公曰左之舍拔则获游于北园四马既闲𬨎车鸾镳载猃歇骄\",\"sourceLabel\":\"第 285-287 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章注\",\"excerpt\":\"其余章中以奉时辰牡、辰牡孔硕、公曰左之、舍拔则获等句延续田猎场景。\",\"fullText\":\"一章章四句。章释详述公之候命田狩，热闹场面由驷驖孔阜、六辔在手到游于北园、四马既闲，强调公之媚子从公于狩的仪式。其余章中以奉时辰牡、辰牡孔硕、公曰左之、舍拔则获等句延续田猎场景。𬨎车鸾镳、载猃歇骄描写狩猎所用车马犬具与仪仗。\",\"notes\":\"按《章注》段落整理而成。\",\"partOrder\":2,\"anchorIds\":[\"seg-005:1-4:奉时辰牡\",\"seg-006:1-4:辰牡孔硕\",\"seg-007:1-4:公曰左之\",\"seg-008:1-4:舍拔则获\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"驷驖孔阜六辔在手公之媚子从公于狩奉时辰牡辰牡孔硕公曰左之舍拔则获游于北园四马既闲𬨎车鸾镳载猃歇骄\",\"sourceLabel\":\"第 285-287 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章注\",\"excerpt\":\"𬨎车鸾镳、载猃歇骄描写狩猎所用车马犬具与仪仗。\",\"fullText\":\"一章章四句。章释详述公之候命田狩，热闹场面由驷驖孔阜、六辔在手到游于北园、四马既闲，强调公之媚子从公于狩的仪式。其余章中以奉时辰牡、辰牡孔硕、公曰左之、舍拔则获等句延续田猎场景。𬨎车鸾镳、载猃歇骄描写狩猎所用车马犬具与仪仗。\",\"notes\":\"按《章注》段落整理而成。\",\"partOrder\":3,\"anchorIds\":[\"seg-011:1-4:𬨎车鸾镳\",\"seg-012:1-4:载猃歇骄\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"駟驖孔阜，六轡在手。公之媚子，從公于狩。奉時辰牡，辰牡孔碩。公曰左之，舍拔則獲。遊于北園，四馬既閑。輶車鸞鑣，載獫歇驕。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。\",\"fullText\":\"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《駟驖》三章，章四句。此诗附以序言，述嘉襄公命田狩之事，虽不能确考始命，但可视为君臣共乐之俗。\",\"fullText\":\"右《駟驖》三章，章四句。此诗附以序言，述嘉襄公命田狩之事，虽不能确考始命，但可视为君臣共乐之俗。\",\"notes\":\"将眉评合入总评段。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋駟驖〔陸氏佃曰〕《説文》曰：「馬深黑色驪，馬赤黑色驖。」非特有取於色，蓋亦取其堅壯如鐵也。孔甚也。阜肥大也。六轡〔孔氏穎達曰〕每馬有二轡，四馬當八轡矣。言六轡者，以驂馬内轡納之於觖，故在手者惟六轡耳。媚子〔朱氏道行曰〕媚子，指左右便嬖。時是也。辰時也。牡〔曹氏粹中曰〕祭祀之牲不用牝，皆以牡爲貴。辰牡〔《集傳》〕冬獻狼，夏獻麋，春秋獻鹿豕之類。奉〔孔氏穎達曰〕「奉是時牡」，謂虞人也。獸人獻時節之獸以供膳，故虞人亦驅時節之獸以待射耳。碩肥大也。左之〔何氏士信曰〕御者從右以逐之，君從左以射之。《公羊傳》解第一殺、第二殺、第三殺，皆自左膘射之達於右，則左當人君之左，指禽獸之左膘而言。〔案〕射必左出，故左之乃易中耳。拔矢括也。閑調習也。輶輕也。鸞鈴也。鑣馬銜也。獫歇驕〔《集傳》〕獫、歇、驕，皆田犬名。長喙曰獫，短喙曰歇、驕。以車載犬，蓋以休其足力也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"释文与诸家注说解释各句名词词义。\",\"fullText\":\"释文与诸家注说解释各句名词词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻阜二十五有。手同。狩二十六宥。叶韻。牡二十五有。碩十一陌。獲同。叶韻。園十三元。閑十五删。通韻。鑣二蕭。驕同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录各关键字的韵部与声调。\", orIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"駟驖孔阜，六轡在手。公之媚子，從公于狩。奉時辰牡，辰牡孔碩。公曰左之，舍拔則獲。遊于北園，四馬既閑。輶車鸞鑣，載獫歇驕。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。\",\"fullText\":\"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《駟驖》三章，章四句。此詩《序》謂「美襄公，始命，有田狩之事，園囿之樂」。然時代無可考，詩詞亦不露始命意。惟既曰公，則必襄公以後詩也。田獵亦時君恒有事，奚足異？孟子不云乎：「今王田獵於此，百姓聞王車馬之音，見羽毛之美，「毛」，《孟子》作「旄」。舉欣欣然有喜色而相告曰：『吾王庶幾無疾病與？何以能田獵也？』此無他，與民同樂也。」今秦始有田狩事，其與民同樂可知也。即民之欣欣然有喜色而相告者，亦可知也。惟初膺侯命，舉行大典，其相率以從于狩者，不聞腹心干城之寄，而乃曰「公之媚子」，則嗜好爲何如耶？君子讀詩至此，不禁有懷《兔罝》野人，知周之所以王而久，秦之所以帝而促者，其由來蓋有素已。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《駟驖》三章，章四句。此诗附以序言，述嘉襄公命田狩之事，虽不能确考始命，但可视为君臣共乐之俗。\",\"fullText\":\"右《駟驖》三章，章四句。此诗附以序言，述嘉襄公命田狩之事，虽不能确考始命，但可视为君臣共乐之俗。\",\"notes\":\"将眉评合入总评段。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋駟驖〔陸氏佃曰〕《説文》曰：「馬深黑色驪，馬赤黑色驖。」非特有取於色，蓋亦取其堅壯如鐵也。孔甚也。阜肥大也。六轡〔孔氏穎達曰〕每馬有二轡，四馬當八轡矣。言六轡者，以驂馬内轡納之於觖，故在手者惟六轡耳。媚子〔朱氏道行曰〕媚子，指左右便嬖。時是也。辰時也。牡〔曹氏粹中曰〕祭祀之牲不用牝，皆以牡爲貴。辰牡〔《集傳》〕冬獻狼，夏獻麋，春秋獻鹿豕之類。奉〔孔氏穎達曰〕「奉是時牡」，謂虞人也。獸人獻時節之獸以供膳，故虞人亦驅時節之獸以待射耳。碩肥大也。左之〔何氏士信曰〕御者從右以逐之，君從左以射之。《公羊傳》解第一殺、第二殺、第三殺，皆自左膘射之達於右，則左當人君之左，指禽獸之左膘而言。〔案〕射必左出，故左之乃易中耳。拔矢括也。閑調習也。輶輕也。鸞鈴也。鑣馬銜也。獫歇驕〔《集傳》〕獫、歇、驕，皆田犬名。長喙曰獫，短喙曰歇、驕。以車載犬，蓋以休其足力也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"释文与诸家注说解释各句名词词义。\",\"fullText\":\"释文与诸家注说解释各句名词词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/127-si-tie/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻阜二十五有。手同。狩二十六宥。叶韻。牡二十五有。碩十一陌。獲同。叶韻。園十三元。閑十五删。通韻。鑣二蕭。驕同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录各关键字的韵部与声调。\",\"fullText\":\"标韵记录各关键字的韵部与声调。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchor
