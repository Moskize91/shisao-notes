一点同情和救济，但人们给他的却只有白眼。诗深刻地反映了当时炎凉无情的世态。\n此诗首二句“绵绵葛藟，在河之浒”，毛传曰：“兴也。”但是左传文公七年：“宋昭公将去群公子，乐豫曰：‘公族，公室之枝叶也。若去之，则本根无所庇荫矣。葛藟犹能庇其本根，故君子以为比，况国君乎？’”对这种不同的解释，陈奂传疏分析说：“此诗因葛藟而兴，又以葛藟为比；故毛传以为兴，左传则以为比。凡全诗通例，关雎若螽斯之有别，旄丘如葛之曼延相连，葛生喻妇人外成于他家，卷阿犹飘风之入曲阿。曰若、曰如、曰喻、曰犹，皆比也，传则皆曰兴。比者，比方于物；兴者，托事于物。作诗者之意，先以托事于物，继乃比方于物，盖言兴而比已寓焉矣。”这种含有比义的兴的艺术手法，在诗经中虽然常见，但并非唯一的形式。其他还有兼赋而不含比义的兴，如“采采卷耳，不盈顷筐”；有的和下文只有音节上联系的兴，如“扬之水”。但到后来，比兴在文人诗中大大发展了，不但含赋义的兴不认其为兴，连以民间习语开个头的兴也不被采用；只有兼比义的兴才被认为比兴，比兴成为一个词了。\n绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。\n绵绵，连绵不断貌。孔疏：“绵绵然枝叶长而不绝者。”\n葛藟，野葡萄，蔓生植物，攀援于丛树上。\n浒（hǔ），水边。这两句是兴，诗人见葛藟尚能蔓生于河边树上，联想自己附托于他人。\n终，既。陈奂传疏：“传云，‘兄弟之道已相远矣’者，以‘已’释‘终’，为全诗‘终’字通训。既醉传又以‘终’字释‘既’字，终、既、已三字同义。”\n远（yuàn），离弃。兄弟，指家人。\n谓，称呼。指行乞时喊别人做爸爸。\n顾，理睬。有人解作“眷顾”或“照顾”，亦通。\n韵读：鱼部——浒、父、父、顾。脂部——藟、弟。\n绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。\n涘（sì），水边。说文：“涘，水厓也。”按厓俗作涯。\n有，同“友”，亲近、亲爱之意。左传昭公二十年：“是不有寡君也。”杜注：“有，相亲有也。”\n韵读：之部——涘、母、母、有。脂部——藟、弟。\n绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\n漘（chún），深水边。尔雅释丘：“夷上洒下不漘。”郭注：“厓上平坦而下水深者为漘。不，发声。”\n昆，毛传：“昆，兄也。”按昆为晜之借字。说文作晜，本字；尔雅释亲作昆，为讹化字。\n闻，同“问”，救助慰问之意。王引之经义述闻：“家大人（王念孙）曰：问，犹恤也，谓相恤问也。古字闻与问通。”\n韵读：文部——漘、昆、闻。脂部——藟、弟。","fullText":"这是流亡他乡者求助不得的怨诗，同《丘中有麻》描写的情况相似。朱熹《诗集传》：“世衰民散，有去其乡里家族而流离失所者，作此诗以自叹。”春秋时代，战争频仍，民不聊生，纷纷逃亡。这首诗的作者可能是从洛阳附近的邻国逃亡到王都的。他到处乞求，甚至称别人为父母兄弟，希望得到一点同情和救济，但人们给他的却只有白眼。诗深刻地反映了当时炎凉无情的世态。\n此诗首二句“绵绵葛藟，在河之浒”，毛传曰：“兴也。”但是左传文公七年：“宋昭公将去群公子，乐豫曰：‘公族，公室之枝叶也。若去之，则本根无所庇荫矣。葛藟犹能庇其本根，故君子以为比，况国君乎？’”对这种不同的解释，陈奂传疏分析说：“此诗因葛藟而兴，又以葛藟为比；故毛传以为兴，左传则以为比。凡全诗通例，关雎若螽斯之有别，旄丘如葛之曼延相连，葛生喻妇人外成于他家，卷阿犹飘风之入曲阿。曰若、曰如、曰喻、曰犹，皆比也，传则皆曰兴。比者，比方于物；兴者，托事于物。作诗者之意，先以托事于物，继乃比方于物，盖言兴而比已寓焉矣。”这种含有比义的兴的艺术手法，在诗经中虽然常见，但并非唯一的形式。其他还有兼赋而不含比义的兴，如“采采卷耳，不盈顷筐”；有的和下文只有音节上联系的兴，如“扬之水”。但到后来，比兴在文人诗中大大发展了，不但含赋义的兴不认其为兴，连以民间习语开个头的兴也不被采用；只有兼比义的兴才被认为比兴，比兴成为一个词了。\n绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。\n绵绵，连绵不断貌。孔疏：“绵绵然枝叶长而不绝者。”\n葛藟，野葡萄，蔓生植物，攀援于丛树上。\n浒（hǔ），水边。这两句是兴，诗人见葛藟尚能蔓生于河边树上，联想自己附托于他人。\n终，既。陈奂传疏：“传云，‘兄弟之道已相远矣’者，以‘已’释‘终’，为全诗‘终’字通训。既醉传又以‘终’字释‘既’字，终、既、已三字同义。”\n远（yuàn），离弃。兄弟，指家人。\n谓，称呼。指行乞时喊别人做爸爸。\n顾，理睬。有人解作“眷顾”或“照顾”，亦通。\n韵读：鱼部——浒、父、父、顾。脂部——藟、弟。\n绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。\n涘（sì），水边。说文：“涘，水厓也。”按厓俗作涯。\n 002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。","fullText":"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"眉評沉痛語，不忍卒讀。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"眉评","excerpt":"眉評沉痛語，不忍卒讀。","fullText":"眉評沉痛語，不忍卒讀。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0004-1","materialId":"fangyur horIds\":[]},{\"index\":2,\"text\":\"他\",\"anchorIds\":[]},{\"index\":3,\"text\":\"人\",\"anchorIds\":[]},{\"index\":4,\"text\":\"昆\",\"anchorIds\":[]}]},{\"id\":\"seg-018\",\"order\":18,\"text\":\"亦莫我闻\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"maruichen-tongshi:0001-1:part-1\",\"quwanli-quanshi:0010-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"亦\",\"anchorIds\":[]},{\"index\":2,\"text\":\"莫\",\"anchorIds\":[\"seg-018:2-4:莫我聞\"]},{\"index\":3,\"text\":\"我\",\"anchorIds\":[\"seg-018:2-4:莫我聞\"]},{\"index\":4,\"text\":\"闻\",\"anchorIds\":[\"seg-018:2-4:莫我聞\"]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":10,\"partCount\":10},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":5,\"partCount\":5},{\"id\":\"maruichen-tongshi\",\"title\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":21,\"anchoredPartCount\":1,\"overviewPartCount\":4},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-018:2-4:莫我聞\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"莫我聞\",\"charStart\":2,\"charEnd\":4,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\",\"sourceLabel\":\"第 162-163 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是流亡他乡者求助不得的怨诗，同《丘中有麻》描写的情况相似。朱熹《诗集传》：“世衰民散，有去其乡里家族而流离失所者，作此诗以自叹。”春秋时代，战争频仍，民不聊生，纷纷逃亡。这首诗的作者可能是从洛阳附近的邻国逃亡到王都的。他到处乞求，甚至称别人为父母兄弟，希望得到一点同情和救济，但人们给他的却只有白眼。诗深刻地反映了当时炎凉无情的世态。\\n此诗首二句“绵绵葛藟，在河之浒”，毛传曰：“兴也。”但是左传文公七年：“宋昭公将去群公子，乐豫曰：‘公族，公室之枝叶也。若去之，则本根无所庇荫矣。葛藟犹能庇其本根，故君子以为比，况国君乎？’”对这种不同的解释，陈奂传疏分析说：“此诗因葛藟而兴，又以葛藟为比；故毛传以为兴，左传则以为比。凡全诗通例，关雎若螽斯之有别，旄丘如葛之曼延相连，葛生喻妇人外成于他家，卷阿犹飘风之入曲阿。曰若、曰如、曰喻、曰犹，皆比也，传则皆曰兴。比者，比方于物；兴者，托事于物。作诗者之意，先以托事于物，继乃比方于物，盖言兴而比已寓焉矣。”这种含有比义的兴的艺术手法，在诗经中虽然常见，但并非唯一的形式。其他还有兼赋而不含比义的兴，如“采采卷耳，不盈顷筐”；有的和下文只有音节上联系的兴，如“扬之水”。但到后来，比兴在文人诗中大大发展了，不但含赋义的兴不认其为兴，连以民间习语开个头的兴也不被采用；只有兼比义的兴才被认为比兴，比兴成为一个词了。\\n绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。\\n绵绵，连绵不断貌。孔疏：“绵绵然枝叶长而不绝者。”\\n葛藟，野葡萄，蔓生植物，攀援于丛树上。\\n浒（hǔ），水边。这两句是兴，诗人见葛藟尚能蔓生于河边树上，联想自己附托于他人。\\n终，既。陈奂传疏：“传云，‘兄弟之道已相远矣’者，以‘已’释‘终’，为全诗‘终’字通训。既醉传又以‘终’字释‘既’字，终、既、已三字同义。”\\n远（yuàn），离弃。兄弟，指家人。\\n谓，称呼。指行乞时喊别人做爸爸。\\n顾，理睬。有人解作“眷顾”或“照顾”，亦通。\\n韵读：鱼部——浒、父、父、顾。脂部——藟、弟。\\n绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。\\n涘（sì），水边。说文：“涘，水厓也。”按厓俗作涯。\\n有，同“友”，亲近、亲爱之意。左传昭公二十年：“是不有寡君也。”杜注：“有，相亲有也。”\\n韵读：之部——涘、母、母、有。脂部——藟、弟。\\n绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\\n漘（chún），深水边。尔雅释丘：“夷上洒下不漘。”郭注：“厓上平坦而下水深者为漘。不，发声。”\\n昆，毛传：“昆，兄也。”按昆为晜之借字。说文作晜，本字；尔雅释亲作昆，为讹化字。\\n闻，同“问”，救助慰问之意。王引之经义述闻：“家大人（王念孙）曰：问，犹恤也，谓相恤问也。古字闻与问通。”\\n韵读：文部——漘、昆、闻。脂部——藟、弟。\",\"fullText\":\"这是流亡他乡者求助不得的怨诗，同《丘中有麻》描写的情况相似。朱熹《诗集传》：“世衰民散，有去其乡里家族而流离失所者，作此诗以自叹。”春秋时代，战争频仍，民不聊生，纷纷逃亡。这首诗的作者可能是从洛阳附近的邻国逃亡到王都的。他到处乞求，甚至称别人为父母兄弟，希望得到一点同情和救济，但人们给他的却只有白眼。诗深刻地反映了当时炎凉无情的世态。\\n此诗首二句“绵绵葛藟，在河之浒”，毛传曰：“兴也。”但是左传文公七年：“宋昭公将去群公子，乐豫曰：‘公族，公室之枝叶也。若去之，则本根无所庇荫矣。葛藟犹能庇其本根，故君子以为比，况国君乎？’”对这种不同的解释，陈奂传疏分析说：“此诗因葛藟而兴，又以葛藟为比；故毛传以为兴，左传则以为比。凡全诗通例，关雎若螽斯之有别，旄丘如葛之曼延相连，葛生喻妇人外成于他家，卷阿犹飘风之入曲阿。曰若、曰如、曰喻、曰犹，皆比也，传则皆曰兴。比者，比方于物；兴者，托事于物。作诗者之意，先以托事于物，继乃比方于物，盖言兴而比已寓焉矣。”这种含有比义的兴的艺术手法，在诗经中虽然常见，但并非唯一的形式。其他还有兼赋而不含比义的兴，如“采采卷耳，不盈顷筐”；有的和下文只有音节上联系的兴，如“扬之水”。但到后来，比兴在文人诗中大大发展了，不但含赋义的兴不认其为兴，连以民间习语开个头的兴也不被采用；只有兼比义的兴才被认为比兴，比兴成为一个词了。\\n绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。\\n绵绵，连绵不断貌。孔疏：“绵绵然枝叶长而不绝者。”\\n葛藟，野葡萄，蔓生植物，攀援于丛树上。\\n浒（hǔ），水边。这两句是兴，诗人见葛藟尚能蔓生于河边树上，联想自己附托于他人。\\n终，既。陈奂传疏：“传云，‘兄弟之道已相远矣’者，以‘已’释‘终’，为全诗‘终’字通训。既醉传又以‘终’字释‘既’字，终、既、已三字同义。”\\n远（yuàn），离弃。兄弟，指家人。\\n谓，称呼。指行乞时喊别人做爸爸。\\n顾，理睬。有人解作“眷顾”或“照顾”，亦通。\\n韵读：鱼部——浒、父、父、顾。脂部——藟、弟。\\n绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。\\n涘（sì），水边。说文：“涘，水厓也。”按厓俗作涯。\\n有，同“友”，亲近、亲爱之意。左传昭公二十年：“是不有寡君也。”杜注：“有，相亲有也。”\\n韵读：之部——涘、母、母、有。脂部——藟、弟。\\n绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\\n漘（chún），深水边。尔雅释丘：“夷上洒下不漘。”郭注：“厓上平坦而下水深者为漘。不，发声。”\\n昆，毛传：“昆，兄也。”按昆为晜之借字。说文作晜，本字；尔雅释亲作昆，为讹化字。\\n闻，同“问”，救助慰问之意。王引之经义述闻：“家大人（王念孙）曰：问，犹恤也，谓相恤问也。古字闻与问通。”\\n韵读：文部——漘、昆、闻。脂部——藟、弟。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\",\"sourceLabel\":\"第 81-82 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\",\"fullText\":\"绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"葛藟㊟民窮無所依也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"葛藟㊟民窮無所依也。\",\"fullText\":\"葛藟㊟民窮無所依也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。\",\"fullText\":\"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評沉痛語，不忍卒讀。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評沉痛語，不忍卒讀。\",\"fullText\":\"眉評沉痛語，不忍卒讀。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋滸〔毛氏萇曰〕水厓曰滸。涘〔孔氏穎達曰〕《釋丘》云：「涘爲厓。」漘〔許氏謙曰〕岸上面平夷，而下爲水，洗蕩齧入若脣也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋滸〔毛氏萇曰〕水厓曰滸。涘〔孔氏穎達曰〕《釋丘》云：「涘爲厓。」漘〔許氏謙曰〕岸上面平夷，而下爲水，洗蕩齧入若脣也。\",\"fullText\":\"集釋滸〔毛氏萇曰〕水厓曰滸。涘〔孔氏穎達曰〕《釋丘》云：「涘爲厓。」漘〔許氏謙曰〕岸上面平夷，而下爲水，洗蕩齧入若脣也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻滸七麌。父同。顧七遇，叶果五反。叶韻。涘四紙。母二十五有。有同。叶韻。漘十一真。昆十三元。聞十二文。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻滸七麌。父同。顧七遇，叶果五反。叶韻。涘四紙。母二十五有。有同。叶韻。漘十一真。昆十三元。聞十二文。通韻。\",\"fullText\":\"標韻滸七麌。父同。顧七遇，叶果五反。叶韻。涘四紙。母二十五有。有同。叶韻。漘十一真。昆十三元。聞十二文。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"亦莫我聞\",\"sourceLabel\":\"第 273 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"莫我聞\",\"fullText\":\"莫我聞\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-018:2-4:莫我聞\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-018\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"此流落異鄉者感傷之詩。\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"此流落異鄉者感傷之詩。\",\"fullText\":\"此流落異鄉者感傷之詩。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLa /shijing/poem/071-ge-lei/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Td8b,"])</script><script>self.__next_f.push([1,"这是流亡他乡者求助不得的怨诗，同《丘中有麻》描写的情况相似。朱熹《诗集传》：“世衰民散，有去其乡里家族而流离失所者，作此诗以自叹。”春秋时代，战争频仍，民不聊生，纷纷逃亡。这首诗的作者可能是从洛阳附近的邻国逃亡到王都的。他到处乞求，甚至称别人为父母兄弟，希望得到一点同情和救济，但人们给他的却只有白眼。诗深刻地反映了当时炎凉无情的世态。\n此诗首二句“绵绵葛藟，在河之浒”，毛传曰：“兴也。”但是左传文公七年：“宋昭公将去群公子，乐豫曰：‘公族，公室之枝叶也。若去之，则本根无所庇荫矣。葛藟犹能庇其本根，故君子以为比，况国君乎？’”对这种不同的解释，陈奂传疏分析说：“此诗因葛藟而兴，又以葛藟为比；故毛传以为兴，左传则以为比。凡全诗通例，关雎若螽斯之有别，旄丘如葛之曼延相连，葛生喻妇人外成于他家，卷阿犹飘风之入曲阿。曰若、曰如、曰喻、曰犹，皆比也，传则皆曰兴。比者，比方于物；兴者，托事于物。作诗者之意，先以托事于物，继乃比方于物，盖言兴而比已寓焉矣。”这种含有比义的兴的艺术手法，在诗经中虽然常见，但并非唯一的形式。其他还有兼赋而不含比义的兴，如“采采卷耳，不盈顷筐”；有的和下文只有音节上联系的兴，如“扬之水”。但到后来，比兴在文人诗中大大发展了，不但含赋义的兴不认其为兴，连以民间习语开个头的兴也不被采用；只有兼比义的兴才被认为比兴，比兴成为一个词了。\n绵绵葛藟，在河之浒。终远兄弟，谓他人父。谓他人父，亦莫我顾。\n绵绵，连绵不断貌。孔疏：“绵绵然枝叶长而不绝者。”\n葛藟，野葡萄，蔓生植物，攀援于丛树上。\n浒（hǔ），水边。这两句是兴，诗人见葛藟尚能蔓生于河边树上，联想自己附托于他人。\n终，既。陈奂传疏：“传云，‘兄弟之道已相远矣’者，以‘已’释‘终’，为全诗‘终’字通训。既醉传又以‘终’字释‘既’字，终、既、已三字同义。”\n远（yuàn），离弃。兄弟，指家人。\n谓，称呼。指行乞时喊别人做爸爸。\n顾，理睬。有人解作“眷顾”或“照顾”，亦通。\n韵读：鱼部——浒、父、父、顾。脂部——藟、弟。\n绵绵葛藟，在河之涘。终远兄弟，谓他人母。谓他人母，亦莫我有。\n涘（sì），水边。说文：“涘，水厓也。”按厓俗作涯。\n有，同“友”，亲近、亲爱之意。左传昭公二十年：“是不有寡君也。”杜注：“有，相亲有也。”\n韵读：之部——涘、母、母、有。脂部——藟、弟。\n绵绵葛藟，在河之漘。终远兄弟，谓他人昆。谓他人昆，亦莫我闻。\n漘（chún），深水边。尔雅释丘：“夷上洒下不漘。”郭注：“厓上平坦而下水深者为漘。不，发声。”\n昆，毛传：“昆，兄也。”按昆为晜之借字。说文作晜，本字；尔雅释亲作昆，为讹化字。\n闻，同“问”，救助慰问之意。王引之经义述闻：“家大人（王念孙）曰：问，犹恤也，谓相恤问也。古字闻与问通。”\n韵读：文部——漘、昆、闻。脂部——藟、弟。"])</script><script>self.__next_f.push([1,"23:Td8b,"])</script><script>self.__next_f.push([1,"这是流亡他乡者求助不得的怨诗，同《丘中有麻》描写的情况相似。朱熹《诗集传》：“世衰民散，有去其乡里家族而流离失所者，作此诗以自叹。”春秋时代，战争频仍，民不聊生，纷纷逃亡。这首诗的作者可能是从洛阳附近的邻国逃亡到王都的。他到处乞求，甚至称别人为父母兄弟，希望得到一点同情和救济，但人们给他的却只有白眼。诗深刻地反映了当时炎凉无情的世态。\n此诗首二句“绵绵葛藟，在河之浒”，毛传曰：“兴也。”但是左传文公七年：“宋昭公将去群公子，乐豫曰：‘公族，公室之枝叶也。若去之，则本根无所庇荫矣。葛藟犹能庇其本根，故君子以为比，况国君乎？’”对这种不同的解释，陈奂传疏分析说：“此诗因葛藟而兴，又以葛藟为比；故毛传以为兴，左传则以为比。凡全诗通例，关雎若螽斯之有别，旄丘如葛之曼延相连，葛生喻妇人外成于他家，卷阿犹飘风之入曲阿。曰若、曰如、曰喻、曰犹，皆比也，传则皆曰兴。比者，比方于物；兴者，托事于物。作诗者之意，先以托事于物，继乃比方于物，盖言兴而比已寓焉矣 ",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"葛藟㊟民窮無所依也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"葛藟㊟民窮無所依也。\",\"fullText\":\"葛藟㊟民窮無所依也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/071-ge-lei/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。誰則使之然哉？當必有任其咎者。即謂平王之棄其九族，而民因無九族之親者，亦奚不可。\",\"fullText\":\"右《葛藟》三章，章六句。此詩不必深解，但依《集傳》謂「世衰民散，有去其鄉里家族，而流離失所之作」，斯得之矣。若必謂「刺平王棄其九族」，則不惟「亦」字語氣不協，即詩意亦甚索然，反無謂也。葛藟本蔓生，必有所依而後附。今乃在河之滸與涘與漘，無喬木高枝以引其條葉，雖足自庇本根，而本根已失，奈之何哉？故人一去鄉里，遠其兄弟，則舉目無親，誰可因依？雖欲謂他人之父以爲父，而其父反愕然而不之顧。即欲謂他人之母以爲母，而其母亦恝然而不我親。父母且不可以僞託，況昆弟乎？則更澹焉如無聞也。民情如此，世道可知。
