-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。","sourceLabel":"第 296-298 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是秦国人民哀悼三良殉葬的诗。题解据《左传》《史记》说明其背景，指出诗中不仅哀挽奄息、仲行、针虎，也控诉秦国人殉制度的残酷。","fullText":"这是秦国人民哀悼三良殉葬的诗。题解据《左传》《史记》说明其背景，指出诗中不仅哀挽奄息、仲行、针虎，也控诉秦国人殉制度的残酷。交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交，鸟鸣声。黄鸟，黄雀。止，栖止。棘，酸枣树，也可兼有双关。特，匹敌。穴，墓穴。惴惴其栗，恐惧战栗貌。良人，好人。人百其身，言愿以一身百死赎之。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。仲行，奄息之弟。防，读如方，比得上一百人。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。针虎，亦三良之一。御，当，言可当百夫。韵读：之部棘、息、息、特；脂部穴、栗；真部天、人、身；阳部桑、行、防；鱼部楚、虎、御。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024","seg-025","seg-026","seg-027","seg-028","seg-029","seg-030","seg-031","seg-032","seg-033","seg-034","seg-035","seg-036"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/131-huang-niao/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。","sourceLabel":"第 296-298 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特 sHref":"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"交交黃鳥，止于棘。誰從穆公？子車奄息。維此奄息，百夫之特。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。交交黃鳥，止于桑。誰從穆公？子車仲行。維此仲行，百夫之防。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。交交黃鳥，止于楚。誰從穆公？子車鍼虎。維此鍼虎，百夫之御。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"题注","excerpt":"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。","fullText":"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。","notes":"题注段落原文。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"总评","excerpt":"总评指出此诗专为哀悼三良从死而作，并借黄鸟兴三良不得其所。","fullText":"总评指出此诗专为哀悼三良从死而作，并借黄鸟兴三良不得其所。","notes":"总评段落整理。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋交交聲也。黃鳥黃雀也。止棲也。從從死也。特匹也。惴惴恐懼貌。慄戰也。防比方之方也。鍼虎人名。御當也。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"集释","excerpt":"集释说明黄鸟、从死、特、防、御等词义。","fullText":"集释说 ":\"seg-034\",\"segmentOrder\":34,\"surfaceText\":\"歼我良人\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-035:1-4:如可赎兮\",\"segmentId\":\"seg-035\",\"segmentOrder\":35,\"surfaceText\":\"如可赎兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-036:1-4:人百其身\",\"segmentId\":\"seg-036\",\"segmentOrder\":36,\"surfaceText\":\"人百其身\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。\",\"sourceLabel\":\"第 296-298 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是秦国人民哀悼三良殉葬的诗。题解据《左传》《史记》说明其背景，指出诗中不仅哀挽奄息、仲行、针虎，也控诉秦国人殉制度的残酷。\",\"fullText\":\"这是秦国人民哀悼三良殉葬的诗。题解据《左传》《史记》说明其背景，指出诗中不仅哀挽奄息、仲行、针虎，也控诉秦国人殉制度的残酷。交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交，鸟鸣声。黄鸟，黄雀。止，栖止。棘，酸枣树，也可兼有双关。特，匹敌。穴，墓穴。惴惴其栗，恐惧战栗貌。良人，好人。人百其身，言愿以一身百死赎之。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。仲行，奄息之弟。防，读如方，比得上一百人。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。针虎，亦三良之一。御，当，言可当百夫。韵读：之部棘、息、息、特；脂部穴、栗；真部天、人、身；阳部桑、行、防；鱼部楚、虎、御。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003 ,\"seg-031\",\"seg-032\",\"seg-033\",\"seg-034\",\"seg-035\",\"seg-036\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。\",\"sourceLabel\":\"第 296-298 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：之部棘、息、息、特；脂部穴、栗；真部天、人、身；阳部桑、行、防；鱼部楚、虎、御。\",\"fullText\":\"这是秦国人民哀悼三良殉葬的诗。题解据《左传》《史记》说明其背景，指出诗中不仅哀挽奄息、仲行、针虎，也控诉秦国人殉制度的残酷。交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交，鸟鸣声。黄鸟，黄雀。止，栖止。棘，酸枣树，也可兼有双关。特，匹敌。穴，墓穴。惴惴其栗，恐惧战栗貌。良人，好人。人百其身，言愿以一身百死赎之。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。仲行，奄息之弟。防，读如方，比得上一百人。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。针虎，亦三良之一。御，当，言可当百夫。韵读：之部棘、息、息、特；脂部穴、栗；真部天、人、身；阳部桑、行、防；鱼部楚、虎、御。\",\"notes\":null,\"partOrder\":8,\"anchorIds\":[\"seg-002:3-3:棘\",\"seg-004:4-4:息\",\"seg-005:4-4:息\",\"seg-006:4-4:特\",\"seg-007:3-3:穴\",\"seg-008:4-4:栗\",\"seg-009:4-4:天\",\"seg-010:4-4:人\",\"seg-012:4-4:身\",\"seg-014:3-3:桑\",\"seg-016:4-4:行\",\"seg-018:4-4:防\",\"seg-026:3-3:楚\",\"seg-028:4-4:虎\",\"seg-030:4-4:御\"],\"glossAnchorIds\":[\"anchor-8-1\",\"anchor-8-2\",\"anchor-8-3\",\"anchor-8-4\",\"anchor-8-5\",\"anchor-8-6\",\"anchor-8-7\",\"anchor-8-8\",\"anchor-8-9\",\"anchor-8-10\",\"anchor-8-11\",\"anchor-8-12\",\"anchor-8-13\",\"anchor-8-14\",\"anchor-8-15\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\",\"seg-029\",\"seg-030\",\"seg-031\",\"seg-032\",\"seg-033\",\"seg-034\",\"seg-035\",\"seg-036\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"交交黃鳥，止于棘。誰從穆公？子車奄息。維此奄息，百夫之特。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。交交黃鳥，止于桑。誰從穆公？子車仲行。維此仲行，百夫之防。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。交交黃鳥，止于楚。誰從穆公？子車鍼虎。維此鍼虎，百夫之御。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。\",\"fullText\":\"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"总评指出此诗专为哀悼三良从死而作，并借黄鸟兴三良不得其所。\",\"fullText\":\"总评指出此诗专为哀悼三良从死而作，并借黄鸟兴三良不得其所。\",\"notes\":\"总评段落整理。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋交交聲也。黃鳥黃雀也。止棲也。從從死也。特匹也。惴惴恐懼貌。慄戰也。防比方之方也。鍼虎人名。御當也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"集释说明黄鸟、从死、特、防、御等词义。\",\"fullText\":\"集释说明黄鸟、从死、特、防、御等词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻棘、息、特入職部。穴、慄入質部。天、人、身真部。桑、行、防陽部。楚、虎、御魚部。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录三章押韵字及其韵部。\",\"fullText\":\"标韵记录三章押韵字及其韵部。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}}"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"script\",null,{\"id\":\"__SHIJING_PAGE_DATA__\",\"type\":\"application/json\",\"data-page-kind\":\"poem-detail\",\"data-page-href\":\"/shijing/poem/131-huang-niao\",\"data-page-data-href\":\"/__data/shijing/poem/131-huang-niao/data.json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1d\"}}],\"$L1e\",\"$L1f\"]\n"])</script><script>self.__next_f.push([1,"21:I[631,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"356\",\"static/chunks/356-1cbf59d25a49fb83.js\",\"909\",\"static/chunks/909-9eb9e001d16de97f.js\",\"600\",\"static/chunks/app/shijing/poem/%5BpoemId%5D/page-aed9ab3190ba59dd.js\"],\"PoemReader\"]\n20:T8d5,"])</script><script>self.__next_f.push([1,"{\ 惧战栗貌。良人，好人。人百其身，言愿以一身百死赎之。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。仲行，奄息之弟。防，读如方，比得上一百人。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。针虎，亦三良之一。御，当，言可当百夫。韵读：之部棘、息、息、特；脂部穴、栗；真部天、人、身；阳部桑、行、防；鱼部楚、虎、御。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\",\"seg-029\",\"seg-030\",\"seg-031\",\"seg-032\",\"seg-033\",\"seg-034\",\"seg-035\",\"seg-036\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。\",\"sourceLabel\":\"第 296-298 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。\",\"fullText\":\"这是秦国人民哀悼三良殉葬的诗。题解据《左传》《史记》说明其背景，指出诗中不仅哀挽奄息、仲行、针虎，也控诉秦国人殉制度的残酷。交交黄鸟，止于棘。谁从穆公？子车奄息。维此奄息，百夫之特。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。交交，鸟鸣声。黄鸟，黄雀。止，栖止。棘，酸枣树，也可兼有双关。特，匹敌。穴，墓穴。惴惴其栗，恐惧战栗貌。良人，好人。人百其身，言愿以一身百死赎之。交交黄鸟，止于桑。谁从穆公？子车仲行。维此仲行，百夫之防。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。仲行，奄息之弟。防，读如方，比得上一百人。交交黄鸟，止于楚。谁从穆公？子车针虎。维此针虎，百夫之御。临其穴，惴惴其栗。彼苍者天，歼我良人。如可赎兮，人百其身。针虎，亦三良之一。御，当，言可当百夫。韵读：之部棘、息、息、特；脂部穴、栗；真部天、人、身；阳部桑、行、防；鱼部楚、虎、御。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:交交黄鸟\",\"seg-002:1-3:止于棘\",\"seg-003:1-4:谁从穆 nchor-8-8\",\"anchor-8-9\",\"anchor-8-10\",\"anchor-8-11\",\"anchor-8-12\",\"anchor-8-13\",\"anchor-8-14\",\"anchor-8-15\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\",\"seg-029\",\"seg-030\",\"seg-031\",\"seg-032\",\"seg-033\",\"seg-034\",\"seg-035\",\"seg-036\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"交交黃鳥，止于棘。誰從穆公？子車奄息。維此奄息，百夫之特。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。交交黃鳥，止于桑。誰從穆公？子車仲行。維此仲行，百夫之防。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。交交黃鳥，止于楚。誰從穆公？子車鍼虎。維此鍼虎，百夫之御。臨其穴，惴惴其慄。彼蒼者天，殲我良人。如可贖兮，人百其身。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。\",\"fullText\":\"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《黃鳥》三章，章十二句。秦以人從死，昉於武公，而縱於穆公。時奄息、仲行、鍼虎以良從死，國人哀之，賦此詩。起句借黃鳥止於棘、桑、楚，興三良不得其死。篇中再三言「如可贖兮，人百其身」，深極悲痛。此詩專哀三良從死之酷，亦寓傷秦俗之惡。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"总评指出此诗专为哀悼三良从死而作，并借黄鸟兴三良不得其所。\",\"fullText\":\"总评指出此诗专为哀悼三良从死而作，并借黄鸟兴三良不得其所。\",\"notes\":\"总评段落整理。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋交交聲也。黃鳥黃雀也。止棲也。從從死也。特匹也。惴惴恐懼貌。慄戰也。防比方之方也。鍼虎人名。御當也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"集释说明黄鸟、从死、特、防、御等词义。\",\"fullText\":\"集释说明黄鸟、从死、特、防、御等词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/131-huang-niao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻棘、息、特入職部。穴、慄入質部。天、人、身真部。桑、行、防陽部。楚、虎、御魚部。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录三章押韵字及其韵部。\",\"fullText\":\"标韵记录三章押韵字及其韵部。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":
