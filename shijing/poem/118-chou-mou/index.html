者。子兮子兮，如此粲者何？","sourceLabel":"第 245-246 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。","fullText":"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？绸缪，缠绵，紧密缠缚之意。按绸缪为叠韵，是一个词。说文段注：“今人绸缪字不分用。”束薪，一捆捆的柴草。“束薪”“束鱼”“束楚”都用以象征结婚。见《汉广》注。三星，三是虚数，不是实指。毛传：“三星，参也。”认为是指参星，亦通。在天，指星星出现的黄昏，这正是新人结婚、贺客闹房的时候。古代结婚，婿在黄昏时到女家亲迎。《礼记·经解》疏曰：“婿则昏时以迎，妇则因而随之。故云婿曰昏，妻曰因。”后人将“昏因”二字都添上“女”旁，失其原意。今夕何夕，贺客闹新房时故意戏问新人“今夜是什么夜晚呀？”良人，古代妇女称夫为良人。仪礼注：“妇人称夫曰良。”子兮，贺客闹新房时呼新人之词，犹今之“你啊”。一说“子”为叹词，亦可通。如……何，把……怎么样。按这章是戏谑新娘喜见新郎之词。韵读：真部一一薪、天（铁因反）、人、人。绸缪束鱼，三星在隅。今夕何夕，见此邂逅？子兮子兮，如此邂逅何？鱼，结婚时用来喂亲迎马匹的草料。隅，天空的东南方。朱熹《诗集传》：“昏见之星至此，则夜久矣。”邂逅，本义是会合，引申为“悦”，这里作名词用，指可爱的人。按这章是戏谑新婚夫妇喜悦相见之词。韵读：侯部一一鱼（钗搜反）、隅（俄倨反）、逅、逅。绸缪束楚，三星在户。今夕何夕，见此粲者？子兮子兮，如此粲者何？楚，荆条。户，房门。朱熹《诗集传》：“户必南出，昏见之星至此，则夜分矣。”粲者，美人。粲，粲美之意。按这章是戏谑新郎喜见新娘之词。韵读：鱼部一一楚、户、者、者。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing "第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。\",\"fullText\":\"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？绸缪，缠绵，紧密缠缚之意。按绸缪为叠韵，是一个词。说文段注：“今人绸缪字不分用。”束薪，一捆捆的柴草。“束薪”“束鱼”“束楚”都用以象征结婚。见《汉广》注。三星，三是虚数，不是实指。毛传：“三星，参也。”认为是指参星，亦通。在天，指星星出现的黄昏，这正是新人结婚、贺客闹房的时候。古代结婚，婿在黄昏时到女家亲迎。《礼记·经解》疏曰：“婿则昏时以迎，妇则因而随之。故云婿曰昏，妻曰因。”后人将“昏因”二字都添上“女”旁，失其原意。今夕何夕，贺客闹新房时故意戏问新人“今夜是什么夜晚呀？”良人，古代妇女称夫为良人。仪礼注：“妇人称夫曰良。”子兮，贺客闹新房时呼新人之词，犹今之“你啊”。一说“子”为叹词，亦可通。如……何，把……怎么样。按这章是戏谑新娘喜见新郎之词。韵读：真部一一薪、天（铁因反）、人、人。绸缪束鱼，三星在隅。今夕何夕，见此邂逅？子兮子兮，如此邂逅何？鱼，结婚时用来喂亲迎马匹的草料。隅，天空的东南方。朱熹《诗集传》：“昏见之星至此，则夜久矣。”邂逅，本义是会合，引申为“悦”，这里作名词用，指可爱的人。按这章是戏谑新婚夫妇喜悦相见之词。韵读：侯部一一鱼（钗搜反）、隅（俄倨反）、逅、逅。绸缪束楚，三星在户。今夕何夕，见此粲者？子兮子兮，如此粲者何？楚，荆条。户，房门。朱熹《诗集传》：“户必南出，昏见之星至此，则夜分矣。”粲者，美人。粲，粲美之意。按这章是戏谑新郎喜见新娘之词。韵读：鱼部一一楚、户、者、者。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\ \"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"楚，荆条。户，房门。朱熹《诗集传》：“户必南出，昏见之星至此，则夜分矣。”粲者，美人。粲，粲美之意。按这章是戏谑新郎喜见新娘之词。韵读：鱼部一一楚、户、者、者。\",\"fullText\":\"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？绸缪，缠绵，紧密缠缚之意。按绸缪为叠韵，是一个词。说文段注：“今人绸缪字不分用。”束薪，一捆捆的柴草。“束薪”“束鱼”“束楚”都用以象征结婚。见《汉广》注。三星，三是虚数，不是实指。毛传：“三星，参也。”认为是指参星，亦通。在天，指星星出现的黄昏，这正是新人结婚、贺客闹房的时候。古代结婚，婿在黄昏时到女家亲迎。《礼记·经解》疏曰：“婿则昏时以迎，妇则因而随之。故云婿曰昏，妻曰因。”后人将“昏因”二字都添上“女”旁，失其原意。今夕何夕，贺客闹新房时故意戏问新人“今夜是什么夜晚呀？”良人，古代妇女称夫为良人。仪礼注：“妇人称夫曰良。”子兮，贺客闹新房时呼新人之词，犹今之“你啊”。一说“子”为叹词，亦可通。如……何，把……怎么样。按这章是戏谑新娘喜见新郎之词。韵读：真部一一薪、天（铁因反）、人、人。绸缪束鱼，三星在隅。今夕何夕，见此邂逅？子兮子兮，如此邂逅何？鱼，结婚时用来喂亲迎马匹的草料。隅，天空的东南方。朱熹《诗集传》：“昏见之星至此，则夜久矣。”邂逅，本义是会合，引申为“悦”，这里作名词用，指可爱的人。按这章是戏谑新婚夫妇喜悦相见之词。韵读：侯部一一鱼（钗搜反）、隅（俄倨反）、逅、逅。绸缪束楚，三星在户。今夕何夕，见此粲者？子兮子兮，如此粲者何？楚，荆条。户，房门。朱熹《诗集传》：“户必南出，昏见之星至此，则夜分矣。”粲者，美人。粲，粲美之意。按这章是戏谑新郎喜见新娘之词。韵读：鱼部一一楚、户、者、者。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-013:4-4:楚\",\"seg-014:4-4:户\",\"seg-016:3-4:粲者\",\"seg-018:4-4:者\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"賀新昏也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"賀新昏也。\",\"fullText\":\"賀新昏也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《綢繆》三章，章六句。此賀新昏詩耳。「今夕何夕」等語，男女初昏之夕，自有此惝怳情形景象，不必添出國亂民貧、男女失時之言，始見其爲欣慶詞也。詩咏新昏多矣，皆各有命意所在。唯此詩無甚深義，只描摹男女初遇，神情逼真，自是絶作，不可廢也。若必篇篇有爲而作，恐自然天籟反難索已。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《綢繆》三章，章六句。此賀新昏詩耳。「今夕何夕」等語，男女初昏之夕，自有此惝怳情形景象，不必添出國亂民貧、男女失時之言，始見其爲欣慶詞也。詩咏新昏多矣，皆各有命意所在。唯此詩無甚深義，只描摹男女初遇，神情逼真，自是絶作，不可廢也。若必篇篇有爲而作，恐自然天籟反難索已。\",\"fullText\":\"右《綢繆》三章，章六句。此賀新昏詩耳。「今夕何夕」等語，男女初昏之夕，自有此惝怳情形景象，不必添出國亂民貧、男女失時之言，始見其爲欣慶詞也。詩咏新昏多矣，皆各有命意所在。唯此詩無甚深義，只描摹男女初遇，神情逼真，自是絶作，不可廢也。若必篇篇有爲而作，恐自然天籟反難索已。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。子兮〔姚氏際恒曰〕一章「子兮」指二女，「二女」，姚際恒《詩經通論》無「二」字。二章「子兮」合指，三章「子兮」指男。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。\",\"fullText\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。子兮〔姚氏際恒曰〕一章「子兮」指二女，「二女」，姚際恒《詩經通論》無「二」字。二章「子兮」合指，三章「子兮」指男。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。子兮〔姚氏際恒曰〕一章「子兮」指二女，「二女」，姚際恒《詩經通論》無「二」字。二章「子兮」合指，三章「子兮」指男。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"子兮〔姚氏際恒曰〕一章「子兮」指二女，「二女」，姚際恒《詩經通論》無「二」字。二章「子兮」合指，三章「子兮」指男。\",\"fullText\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。子兮〔姚氏際恒曰〕一章「子兮」指二女，「二女」，姚際恒《詩經通論》無「二」字。二章「子兮」合指，三章「子兮」指男。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"薪十一真。天一先。人十一真。通韻。芻七虞。隅同。逅二十六宥，叶狼口反。叶韻。楚六語。户七麌。者二十一馬，叶章與反。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"薪十一真。天一先。人十一真。通韻。\",\"fullText\":\"薪十一真。天一先。人十一真。通韻。芻七虞。隅同。逅二十六宥，叶狼口反。叶韻。楚六語。户七麌。者二十一馬，叶章與反。叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/glo l,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tc95,"])</script><script>self.__next_f.push([1,"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？绸缪，缠绵，紧密缠缚之意。按绸缪为叠韵，是一个词。说文段注：“今人绸缪字不分用。”束薪，一捆捆的柴草。“束薪”“束鱼”“束楚”都用以象征结婚。见《汉广》注。三星，三是虚数，不是实指。毛传：“三星，参也。”认为是指参星，亦通。在天，指星星出现的黄昏，这正是新人结婚、贺客闹房的时候。古代结婚，婿在黄昏时到女家亲迎。《礼记·经解》疏曰：“婿则昏时以迎，妇则因而随之。故云婿曰昏，妻曰因。”后人将“昏因”二字都添上“女”旁，失其原意。今夕何夕，贺客闹新房时故意戏问新人“今夜是什么夜晚呀？”良人，古代妇女称夫为良人。仪礼注：“妇人称夫曰良。”子兮，贺客闹新房时呼新人之词，犹今之“你啊”。一说“子”为叹词，亦可通。如……何，把……怎么样。按这章是戏谑新娘喜见新郎之词。韵读：真部一一薪、天（铁因反）、人、人。绸缪束鱼，三星在隅。今夕何夕，见此邂逅？子兮子兮，如此邂逅何？鱼，结婚时用来喂亲迎马匹的草料。隅，天空的东南方。朱熹《诗集传》：“昏见之星至此，则夜久矣。”邂逅，本义是会合，引申为“悦”，这里作名词用，指可爱的人。按这章是戏谑新婚夫妇喜悦相见之词。韵读：侯部一一鱼（钗搜反）、隅（俄倨反）、逅、逅。绸缪束楚，三星在户。今夕何夕，见此粲者？子兮子兮，如此粲者何？楚，荆条。户，房门。朱熹《诗集传》：“户必南出，昏见之星至此，则夜分矣。”粲者，美人。粲，粲美之意。按这章是戏谑新郎喜见新娘之词。韵读：鱼部一一楚、户、者、者。"])</script><script>self.__next_f.push([1,"23:Tc95,"])</script><script>self.__next_f.push([1,"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？绸缪，缠绵，紧密缠缚之意。按绸缪为叠韵，是一个词。说文段注：“今人绸缪字不分用。”束薪，一捆捆的柴草。“束薪”“束鱼”“束楚”都用以象征结婚。见《汉广》注。三星，三是虚数，不是实指。毛传：“三星，参也。”认为是指参星，亦通。在天，指星星出现的黄昏，这正是新人结婚、贺客闹房的时候。古代结婚，婿在黄昏时到女家亲迎。《礼记·经解》疏曰：“婿则昏时以迎，妇则因而随之。故云婿曰昏 \"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"粲者\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-017:1-4:子兮子兮\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"子兮子兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-5:如此粲者何\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"如此粲者何\",\"charStart\":1,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:4-4:者\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"者\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首祝贺新婚的诗。毛序：“绸缪刺晋乱也。国乱则昏姻不得其时焉。”生拉硬扯一个“刺”字，实在太牵强。方玉润说：“绸缪，贺新婚也。”庶几近之。不过它和周南《桃夭》等贺新婚诗有些不同，带有戏谑调侃的味道，可能是闹新房一类的歌唱。有人说诗是新郎自作，但细读诗句，语意不类。钱锺书《管锥编》云：“窃谓此诗首章托为女之词，称男‘良人’；次章托为男女和声合赋之词，故曰‘邂逅’，义兼彼此；末章托为男之词，称女‘粲者’。单而双，双复单，乐府古题之‘两头纤纤’，可借以品目。譬之歌曲之‘三章法’：女先独唱，继以男女合唱，终以男独唱。似不必认定全诗出一人之口，而斡旋‘良人’之称也。”钱先生的说法可为定论。全诗充满喜庆欢快的气氛，兴句以象征嫁娶的束薪、三星入景，章末以谐谑新妇新郎的呼告、设问作结，把婚礼上热闹的场面、贺客艳羡的神态描写得如在眼前。尤其是“今夕何夕”四字，虽出自旁人之口，却将一对新人羞怯怯、喜滋滋的仪容、心理刻画得细致入微，后人称赞它“是神来句”，倒也不算虚誉。\",\"fullText\":\"$22\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"绸缪束薪，三星在天。今夕何夕，见此良人？子兮子兮，如此良人何？\",\"fullText\":\"$23\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:绸缪束薪\",\"seg-002:1-4:三星在天\",\"seg-003:1-4:今夕何夕\",\"seg-004:1-4:见此良人\",\"seg-005:1-4:子兮子兮\",\"seg-006:1-5:如此良人何\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"绸缪，缠绵，紧密缠缚之意。按绸缪为叠韵，是一个词。说文段注：“今人绸缪字不分用。”束薪，一捆捆的柴草。“束薪”“束鱼”“束楚”都用以象征结婚。见《汉广》注。三星，三是虚数，不是实指。毛传：“三星，参也。”认为是指参星，亦通。在天，指星星出现的黄昏，这正是新人结婚、贺客闹房的时候。古代结婚，婿在黄昏时到女家亲迎。《礼记·经解》疏曰：“婿则昏时以迎，妇则因而随之。故云婿曰昏，妻曰因。”后人将“昏因”二字都添上“女”旁，失其原意。今夕何夕，贺客闹新房时故意戏问新人“今夜是什么夜晚呀？”良人，古代妇女称夫为良人。仪礼注：“妇人称夫曰良。”子兮，贺客闹新房时呼新人之词，犹今之“你啊”。一说“子”为叹词，亦可通。如……何，把……怎么样。按这章是戏谑新娘喜见新郎之词。韵读：真部一一薪、天（铁因反）、人、人。\",\"fullText\":\"$24\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-2:绸缪\",\"seg-001:3-4:束薪\",\"seg-002:1-2:三星\",\"seg-002:3-4:在天\",\"seg-003:1-4:今夕何夕\",\"seg-004:3-4:良人\",\"seg-005:1-2:子兮\",\"seg-006:3-4:良人\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\",\"anchor-3-7\",\"anchor-3-8\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"绸缪束鱼，三星在隅。今夕何夕，见此邂逅？子兮子兮，如此邂逅何？\",\"fullText\":\"$25\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-007:1-4:绸缪束鱼\",\"seg-008:1-4:三星在隅\",\"seg-009:1-4:今夕何夕\",\"seg-010:1-4:见此邂逅\",\"seg-011:1-4:子兮子兮\",\"seg-012:1-5:如此邂逅何\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\",\"anchor-4-4\",\"anchor-4-5\",\"anchor-4-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"鱼，结婚时用来喂亲迎马匹的草料。隅，天空的东南方。朱熹《诗集传》：“昏见之星至此，则夜久矣。”邂逅，本义是会合，引申为“悦”，这里作名词用，指可爱的人。按这章是戏谑新婚夫妇喜悦相见之词。韵读：侯部一一鱼（钗搜反）、隅（俄倨反）、逅、逅。\",\"fullText\":\"$26\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[\"seg-007:4-4:鱼\",\"seg-008:4-4:隅\",\"seg-010:3-4:邂逅\",\"seg-012:3-4:邂逅\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\",\"anchor-5-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"绸缪束楚，三星在户。今夕何夕，见此粲者？子兮子兮，如此粲者何？\",\"fullText\":\"$27\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-013:1-4:绸缪束楚\",\"seg-014:1-4:三星在户\",\"seg-015:1-4:今夕何夕\",\"seg-016:1-4:见此粲者\",\"seg-017:1-4:子兮子兮\",\"seg-018:1-5:如此粲者何\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\",\"anchor-6-4\",\"anchor-6-5\",\"anchor-6-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"绸缪束薪，三星在天。今夕何夕，见此良人。子兮子兮，如此良人何？绸缪束鱼，三星在隅。今夕何夕，见此邂逅。子兮子兮，如此邂逅何？绸缪束楚，三星在户。今夕何夕，见此粲者。子兮子兮，如此粲者何？\",\"sourceLabel\":\"第 245-246 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"楚，荆条。户，房门。朱熹《诗集传》：“户必南出，昏见之星至此，则夜分矣。”粲者，美人。粲，粲美之意。按这章是戏谑新郎喜见新娘之词。韵读：鱼部一一楚、户、者、者。\",\"fullText\":\"$28\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-013:4-4:楚\",\"seg-014:4-4:户\",\"seg-016:3-4:粲者\",\"seg-018:4-4:者\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"賀新昏也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"賀新昏也。\",\"fullText\":\"賀新昏也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《綢繆》三章，章六句。此賀新昏詩耳。「今夕何夕」等語，男女初昏之夕，自有此惝怳情形景象，不必添出國亂民貧、男女失時之言，始見其爲欣慶詞也。詩咏新昏多矣，皆各有命意所在。唯此詩無甚深義，只描摹男女初遇，神情逼真，自是絶作，不可廢也。若必篇篇有爲而作，恐自然天籟反難索已。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《綢繆》三章，章六句。此賀新昏詩耳。「今夕何夕」等語，男女初昏之夕，自有此惝怳情形景象，不必添出國亂民貧、男女失時之言，始見其爲欣慶詞也。詩咏新昏多矣，皆各有命意所在。唯此詩無甚深義，只描摹男女初遇，神情逼真，自是絶作，不可廢也。若必篇篇有爲而作，恐自然天籟反難索已。\",\"fullText\":\"右《綢繆》三章，章六句。此賀新昏詩耳。「今夕何夕」等語，男女初昏之夕，自有此惝怳情形景象，不必添出國亂民貧、男女失時之言，始見其爲欣慶詞也。詩咏新昏多矣，皆各有命意所在。唯此詩無甚深義，只描摹男女初遇，神情逼真，自是絶作，不可廢也。若必篇篇有爲而作，恐自然天籟反難索已。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/118-chou-mou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。子兮〔姚氏際恒曰〕一章「子兮」指二女，「二女」，姚際恒《詩經通論》無「二」字。二章「子兮」合指，三章「子兮」指男。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案〕參星中三星最明，俗通謂之三星。良人〔馮氏復京曰〕《儀禮》鄭注云：「婦人稱夫曰良。」粲美也。〔張氏彩曰〕粲者，華美之意，意以女之服貌爲言。〔《集傳》〕此爲夫語婦之詞也。\",\"fullText\":\"三星〔姚氏際恒曰〕三，參通。《毛傳》謂「參」，是也。〔案
