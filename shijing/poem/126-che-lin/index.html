。今者不乐，逝者其亡。簧，乐器名。亡，死亡。此二句亦言来日无多，当及时行乐。韵读：阳部——桑、杨、簧、亡。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"有车邻邻，有马白颠。未见君子，寺人之令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。","sourceLabel":"第 283-285 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"有车邻邻，有马白颠。未见君子，寺人之令。","fullText":"这是一首反映秦君生活的诗。“寺人”是当时宫中的侍从。毛序：“车邻，美秦仲也。秦仲始大，有车马礼乐侍御之好焉。”郑笺：“君臣以闲暇燕饮相安乐也。”后儒多据此认为是“君臣相得”之诗。但细味“阪有漆，隰有栗”的兴句，诗人似乎是一位女性，可能是秦君宫中的姆妾。最初因没有寺人的传令，见不到秦君；后来既见君子，秦君又颇为随和，同她并坐鼓瑟鼓簧，并言“今者不乐，逝者其耋（亡）”。方玉润评曰：“未见时如此严肃，既见时如此简易。”有车邻邻，有马白颠。未见君子，寺人之令。邻邻，车行声。白颠，马额正中有白毛。寺人，宫内小臣，掌传令。韵读：真部——邻、颠、令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪，山坡。隰，低洼潮湿之地。鼓瑟，谓并坐弹瑟。逝者，谓将来。耋，老，泛指高年。韵读：脂部——漆、栗、瑟、耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。簧，乐器名。亡，死亡。此二句亦言来日无多，当及时行乐。韵读：阳部——桑、杨、簧、亡。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-4:有车邻邻","seg-002:1-4:有马白颠","seg-003:1-4:未见君子","seg-004:1-4:寺人之令"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"有车邻邻，有马白颠。未见 不乐\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:1-4:逝者其亡\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"逝者其亡\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:4-4:亡\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"亡\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有车邻邻，有马白颠。未见君子，寺人之令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。\",\"sourceLabel\":\"第 283-285 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首反映秦君生活的诗。“寺人”是当时宫中的侍从。毛序：“车邻，美秦仲也。秦仲始大，有车马礼乐侍御之好焉。”郑笺：“君臣以闲暇燕饮相安乐也。”后儒多据此认为是“君臣相得”之诗。但细味“阪有漆，隰有栗”的兴句，诗人似乎是一位女性，可能是秦君宫中的姆妾。最初因没有寺人的传令，见不到秦君；后来既见君子，秦君又颇为随和，同她并坐鼓瑟鼓簧，并言“今者不乐，逝者其耋（亡）”。方玉润评曰：“未见时如此严肃，既见时如此简易。”\",\"fullText\":\"这是一首反映秦君生活的诗。“寺人”是当时宫中的侍从。毛序：“车邻，美秦仲也。秦仲始大，有车马礼乐侍御之好焉。”郑笺：“君臣以闲暇燕饮相安乐也。”后儒多据此认为是“君臣相得”之诗。但细味“阪有漆，隰有栗”的兴句，诗人似乎是一位女性，可能是秦君宫中的姆妾。最初因没有寺人的传令，见不到秦君；后来既见君子，秦君又颇为随和，同她并坐鼓瑟鼓簧，并言“今者不乐，逝者其耋（亡）”。方玉润评曰：“未见时如此严肃，既见时如此简易。”有车邻邻，有马白颠。未见君子，寺人之令。邻邻，车行声。白颠，马额正中有白毛。寺人，宫内小臣，掌传令。韵读：真部——邻、颠、令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪，山坡。隰，低洼潮湿之地。鼓瑟，谓并坐弹瑟。逝者，谓将来。耋，老，泛指高年。韵读：脂部——漆、栗、瑟、耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。簧，乐器名。亡，死亡。此二句亦言来日无多，当及时行乐。韵读：阳部——桑、杨、簧、亡。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有车邻邻，有马白颠。未见君子，寺人之令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。\",\"sourceLabel\":\"第 283-285 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"有车邻邻，有马白颠。未见君子，寺人之令。\",\"fullText\":\"这是一首反映秦君生活的诗。“寺人”是当时宫中的侍从。毛序：“车邻，美秦仲也。秦仲始大，有车马礼乐侍御之好焉。”郑笺：“君臣以闲暇燕饮相安乐也。”后儒多据此认为是“君臣相得”之诗。但细味“阪有漆，隰有栗”的兴句，诗人似乎是一位女性，可能是秦君宫中的姆妾。最初因没有寺人的传令，见不到秦君；后来既见君子，秦君又颇为随和，同她并坐鼓瑟鼓簧，并言“今者不乐，逝者其耋（亡）”。方玉润评曰：“未见时如此严肃，既见时如此简易。”有车邻邻，有马白颠。未见君子，寺人之令。邻邻，车行声。白颠，马额正中有白毛。寺人，宫内小臣，掌传令。韵读：真部——邻、颠、令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪，山坡。隰，低洼潮湿之地。鼓瑟，谓并坐弹瑟。逝者，谓将来。耋，老，泛指高年。韵读：脂部——漆、栗、瑟、耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。簧，乐器名。亡，死亡。此二句亦言来日无多，当及时行乐。韵读：阳部——桑、杨、簧、亡。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:有车邻邻\",\"seg-002:1-4:有马白颠\",\"seg-003:1-4:未见君子\",\"seg-004:1-4:寺人之令\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerL contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？即秦士大夫，雖曰鄙俗，亦斷斷不至如此。唯其君臣相得，不務經綸，日事宴樂。開創若此，後效可知。聖人存之，以見嬴秦始基固若是耳。眉評〔一章〕未見時如此嚴肅。〔二、三章〕既見時如此簡易。不惟盡寬禮數，且能備極宴樂。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？\",\"fullText\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？即秦士大夫，雖曰鄙俗，亦斷斷不至如此。唯其君臣相得，不務經綸，日事宴樂。開創若此，後效可知。聖人存之，以見嬴秦始基固若是耳。眉評〔一章〕未見時如此嚴肅。〔二、三章〕既見時如此簡易。不惟盡寬禮數，且能備極宴樂。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之 詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？即秦士大夫，雖曰鄙俗，亦斷斷不至如此。唯其君臣相得，不務經綸，日事宴樂。開創若此，後效可知。聖人存之，以見嬴秦始基固若是耳。眉評〔一章〕未見時如此嚴肅。〔二、三章〕既見時如此簡易。不惟盡寬禮數，且能備極宴樂。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"鄰鄰衆車聲。白顛〔《集傳》〕白顛，額有白毛，今謂之的顙。寺人内小臣也。〔孔氏穎達曰〕《左傳》：齊有寺人貂，晉有寺人披。是諸侯之官有寺人也。寺人是在内細小之臣。並坐〔黄氏佐曰〕並坐者，同坐，非並肩而坐也。案並坐者，乃鼓瑟者並坐耳，非與君並坐也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"鄰鄰衆車聲。白顛〔《集傳》〕白顛，額有白毛，今謂之的顙。寺人内小臣也。\",\"fullText\":\"鄰鄰衆車聲。白顛〔《集傳》〕白顛，額有白毛，今謂之的顙。寺人内小臣也。〔孔氏穎達曰〕《左傳》：齊有寺人貂，晉有寺人披。是諸侯之官有寺人也。寺人是在内細小之臣。並坐〔黄氏佐曰〕並坐者，同坐，非並肩而坐也。案並坐者，乃鼓瑟者並坐耳，非與君並坐也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"鄰鄰衆車聲。白顛〔《集傳》〕白顛，額有白毛，今謂之的顙。寺人内小臣也。〔孔氏穎達曰〕《左傳》：齊有寺人貂，晉有寺人披。是諸侯之官有寺人也。寺人是在内細小之臣。並坐〔黄氏佐曰〕並坐者，同坐，非並肩而坐也。案並坐者，乃鼓瑟者並坐耳，非與君並坐也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"〔孔氏穎達曰〕《左傳》：齊有寺人貂，晉有寺人披。是諸侯之官有寺人也。寺人是在内細小之臣。\",\"fullText\":\"鄰鄰衆車聲。白顛〔《集傳》〕白顛，額有白毛，今謂之的顙。 \",\"segmentId\":\"seg-011\",\"segmentOrder\":11,\"surfaceText\":\"桑\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:1-3:隰有杨\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"隰有杨\",\"charStart\":1,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:3-3:杨\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"杨\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-013:1-4:既见君子\",\"segmentId\":\"seg-013\",\"segmentOrder\":13,\"surfaceText\":\"既见君子\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-014:1-4:并坐鼓簧\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"并坐鼓簧\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-014:4-4:簧\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"簧\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-015:1-4:今者不乐\",\"segmentId\":\"seg-015\",\"segmentOrder\":15,\"surfaceText\":\"今者不乐\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:1-4:逝者其亡\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"逝者其亡\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:4-4:亡\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"亡\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有车邻邻，有马白颠。未见君子，寺人之令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。\",\"sourceLabel\":\"第 283-285 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首反映秦君生活的诗。“寺人”是当时宫中的侍从。毛序：“车邻，美秦仲也。秦仲始大，有车马礼乐侍御之好焉。”郑笺：“君臣以闲暇燕饮相安乐也。”后儒多据此认为是“君臣相得”之诗。但细味“阪有漆，隰有栗”的兴句，诗人似乎是一位女性，可能是秦君宫中的姆妾。最初因没有寺人的传令，见不到秦君；后来既见君子，秦君又颇为随和，同她并坐鼓瑟鼓簧，并言“今者不乐，逝者其耋（亡）”。方玉润评曰：“未见时如此严肃，既见时如此简易。”\",\"fullText\":\"这是一首反映秦君生活的诗。“寺人”是当时宫中的侍从。毛序：“车邻，美秦仲也。秦仲始大，有车马礼乐侍御之好焉。”郑笺：“君臣以闲暇燕饮相安乐也。”后儒多据此认为是“君臣相得”之诗。但细味“阪有漆，隰有栗”的兴句，诗人似乎是一位女性，可能是秦君宫中的姆妾。最初因没有寺人的传令，见不到秦君；后来既见君子，秦君又颇为随和，同她并坐鼓瑟鼓簧，并言“今者不乐，逝者其耋（亡）”。方玉润评曰：“未见时如此严肃，既见时如此简易。”有车邻邻，有马白颠。未见君子，寺人之令。邻邻，车行声。白颠，马额正中有白毛。寺人，宫内小臣，掌传令。韵读：真部——邻、颠、令。阪有漆，隰有栗。既见君子，并坐鼓瑟。今者不乐，逝者其耋。阪，山坡。隰，低洼潮湿之地。鼓瑟，谓并坐弹瑟。逝者，谓将来。耋，老，泛指高年。韵读：脂部——漆、栗、瑟、耋。阪有桑，隰有杨。既见君子，并坐鼓簧。今者不乐，逝者其亡。簧，乐器名。亡，死亡。此二句亦言来日无多，当及时行乐。韵读：阳部——桑、杨、簧、亡。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitl 所云「子陽乃井底蛙耳」，何以能開創宏業耶？即秦士大夫，雖曰鄙俗，亦斷斷不至如此。唯其君臣相得，不務經綸，日事宴樂。開創若此，後效可知。聖人存之，以見嬴秦始基固若是耳。眉評〔一章〕未見時如此嚴肅。〔二、三章〕既見時如此簡易。不惟盡寬禮數，且能備極宴樂。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？\",\"fullText\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？即秦士大夫，雖曰鄙俗，亦斷斷不至如此。唯其君臣相得，不務經綸，日事宴樂。開創若此，後效可知。聖人存之，以見嬴秦始基固若是耳。眉評〔一章〕未見時如此嚴肅。〔二、三章〕既見時如此簡易。不惟盡寬禮數，且能備極宴樂。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/126-che-lin/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《車鄰》三章，一章四句，二章章六句。此詩《序》謂「美秦仲」。劉公瑾疑爲「美襄公」，以秦仲初爲大夫，寺人等官非所宜有也。總之，秦君開創之始，法制雖備，禮數尚寬。且其人必恢廓大度，不飾邊幅，如光武初見馬援，袒幘而坐迎之，非復公孫述之盛陳陛衛而後見。故臣下樂其簡易而歎美之，以爲真吾主也。曰：秦君富貴而尊嚴，豈勝述哉？車則鄰鄰，馬則白顛，日處深宫，非傳宣不能入，可謂盛矣。及其覿面，乃又不然。君臣相與，歡若平生。鼓瑟者可以並坐而調音，鼓簧者亦可相依而度曲。不甯惟是，君勸臣曰：失今不樂，逝者將耋。而耋者將亡，如此歲月何哉？則是其心之推誠相與，毫無箝制也可知。若如諸儒所云，「是時秦君始有車馬及此寺人之官，國人創見而誇美之」，則何異馬援所云「子陽乃井底蛙耳」，何以能開創宏業耶？即秦士大夫，雖曰鄙俗，亦斷斷不至如此。唯其君臣相得，不務經綸，日事宴樂。開創若此，後效可知。聖人存之，以見嬴秦始基固若是耳。眉評〔一章〕未見時如此嚴肅。〔二、三章〕既見時如此簡易。不惟盡寬禮數，且能備極宴樂。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"即秦士大夫，雖曰鄙俗，亦斷
