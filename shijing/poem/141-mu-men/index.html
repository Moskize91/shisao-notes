ngjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-011:1-4:訊予不顧\",\"segmentId\":\"seg-011\",\"segmentOrder\":11,\"surfaceText\":\"訊予不顧\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"fangyurun-yuanshi:0006-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:1-4:顛倒思予\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"顛倒思予\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"fangyurun-yuanshi:0006-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/141-mu-men/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採錄以當信史。朱晦翁欲疑而闕之，不惟詩人苦心埋沒，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。詩是刺桓公，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以為桓公之智不能及其後，故以《墓門》刺焉。『夫』指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰為此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫。然桓公迷而不悟，乃思良言，夫何益哉？始不知人，次亦拒諫，無所謂不置良師傅意。《序》解經雖得大概，措辭又非，詩旨愈晦，須細審乃知得失。墓門有棘，斧以斯之。夫也不良，國人知之。知而不已，誰昔然矣。墓門有梅，有鴞萃止。夫也不良，歌以訊之。訊予不顧，顛倒思予。斯析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯為析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞〔陸氏璣曰〕鴞，大如班鴿，綠色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可為羹臛，又可為炙。〔濮氏一之曰〕《楚辭》注：「鴟、鴞二物。」又云：「鵩似鴞。」本章云，其實一耳。《莊子》「見彈而求鴞炙」是也。萃集也。訊告也。顛倒狼狽之狀。標韻斯四支。知同。本韻。已四紙。矣同。本韻。萃四寘。訊〔程氏以恬〕《音韻攷》曰：《釋文》云：「本又作誶，徐音息悴反。」《廣韻》、《正韻》：誶字雖遂切。引《詩》曰「歌以誶止」。今案，此及下句「訊」字，皆「誶」之訛，次句「之」字亦「止」字之訛。顧、江諸家皆詳辨之。顧七遇。予六魚。叶韻。\",\"sourceLabel\":\"第 315-316 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採錄以當信史。朱晦翁欲疑而闕之，不惟詩人苦心埋沒，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》陳侯 謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗無良師傅，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以爲桓公之智不能及其後，故以《墓門》刺焉。『夫』，指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰爲此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫早悟桓公。奈公迷而不悟，以至亂作，乃思良言，夫何益哉？二章皆刺桓公。始不知人，次又拒諫，無所謂不置良師傅意。《序》之解經，往往得其大概，而措辭又非，故詩旨反因之而晦，須爲細審乃知其得失也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採録以當信史。朱晦翁必欲疑而闕之，不惟詩人苦心埋没無傳，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》：陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。《序》因以此詩爲刺佗，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗無良師傅，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以爲桓公之智不能及其後，故以《墓門》刺焉。『夫』，指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰爲此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫早悟桓公。奈公迷而不悟，以至亂作，乃思良言，夫何益哉？二章皆刺桓公。始不知人，次又拒諫，無所謂不置良師傅意。《序》之解經，往往得其大概，而措辭又非，故詩旨反因之而晦，須爲細審乃知其得失也。\",\"fullText\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採録以當信史。朱晦翁必欲疑而闕之，不惟詩人苦心埋没無傳，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》：陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。《序》因以此詩爲刺佗，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗無良師傅，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以爲桓公之智不能及其後，故以《墓門》刺焉。『夫』，指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰爲此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫早悟桓公。奈公迷而不悟，以至亂作，乃思良言，夫何益哉？二章皆刺桓公。始不知人，次又拒諫，無所謂不置良師傅意。《序》之解經，往往得其大概，而措辭又非，故詩旨反因之而晦，須爲細審乃知其得失也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/141-mu-men/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋斯㊟析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯爲析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞㊟〔陸氏璣曰〕鴞，大如班鳩，緑色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可爲羮臛，又可爲炙。〔濮氏一之曰〕《楚辭》注：「鴟、鴞二物。」又云：「鵩似鴞。」本章云，其實一耳。《莊子》「見彈而求鴞炙」是也。萃㊟集也。訊㊟告也。顛倒㊟狼狽之狀。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋斯㊟析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯爲析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞㊟〔陸氏璣曰〕鴞，大如班鳩，緑色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可爲羮臛，又可爲炙。 ionId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/141-mu-men/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採錄以當信史。朱晦翁欲疑而闕之，不惟詩人苦心埋沒，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。詩是刺桓公，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以為桓公之智不能及其後，故以《墓門》刺焉。『夫』指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰為此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫。然桓公迷而不悟，乃思良言，夫何益哉？始不知人，次亦拒諫，無所謂不置良師傅意。《序》解經雖得大概，措辭又非，詩旨愈晦，須細審乃知得失。墓門有棘，斧以斯之。夫也不良，國人知之。知而不已，誰昔然矣。墓門有梅，有鴞萃止。夫也不良，歌以訊之。訊予不顧，顛倒思予。斯析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯為析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞〔陸氏璣曰〕鴞，大如班鴿，綠色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可為羹臛，又可為炙。〔濮氏一之曰〕《楚辭》注：「鴟、鴞二物。」又云：「鵩似鴞。」本章云，其實一耳。《莊子》「見彈而求鴞炙」是也。萃集也。訊告也。顛倒狼狽之狀。標韻斯四支。知同。本韻。已四紙。矣同。本韻。萃四寘。訊〔程氏以恬〕《音韻攷》曰：《釋文》云：「本又作誶，徐音息悴反。」《廣韻》、《正韻》：誶字雖遂切。引《詩》曰「歌以誶止」。今案，此及下句「訊」字，皆「誶」之訛，次句「之」字亦「止」字之訛。顧、江諸家皆詳辨之。顧七遇。予六魚。叶韻。\",\"sourceLabel\":\"第 315-316 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採錄以當信史。朱晦翁欲疑而闕之，不惟詩人苦心埋沒，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。詩是刺桓公，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以為桓公之智不能及其後，故以《墓門》刺焉。『夫』指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰為此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫。然桓公迷而不悟，乃思良言，夫何益哉？始不知人，次亦拒諫，無所謂不置良師傅意。《序》解經雖得大概，措辭又非，詩旨愈晦，須細審乃知得失。\",\"fullText\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採錄以當信史。朱晦翁欲疑而闕之，不惟詩人苦心埋沒，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。詩是刺桓公，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以為桓公之智不能及其後，故以《墓門》刺焉。『夫』指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰為此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫。然桓公迷而不悟，乃思良言，夫何益哉？始不知人，次亦拒諫，無所謂不置良師傅意。《序》解經雖得大概，措辭又非，詩旨愈晦，須細審乃知得失。墓門有棘，斧以斯之。夫也不良，國人知之。知而不已，誰昔然矣。墓門有梅，有鴞萃止。夫也不良，歌以訊之。訊予不顧，顛倒思予。斯析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯為析義也。〔濮氏一之曰〕斯，《 知其得失也。\",\"fullText\":\"右《墓門》二章，章六句。此詩史也。陳國小，君臣無事可書，只此數詩歌詠事實，聊備採録以當信史。朱晦翁必欲疑而闕之，不惟詩人苦心埋没無傳，亦將使亂臣賊子得以倖逃公論，其可乎哉？案：《左傳》：陳侯鮑卒，文公子佗殺太子免而代之，於是陳亂。《序》因以此詩爲刺佗，謂其「無良師傅，以至於不義」。雖無實據，而詩與事合，固自可信。然詩非刺佗無良師傅，乃刺桓公不能去佗耳。蘇氏轍曰：「桓公之世，陳人知佗之不臣矣。而桓公不去，以及於亂。是以國人追咎桓公，以爲桓公之智不能及其後，故以《墓門》刺焉。『夫』，指佗也。佗之不良，國人莫不知之者。知而不之去，昔者誰爲此乎？」案：此乃釋首章。次章「歌以訊之」等句，則必有忠言直諫早悟桓公。奈公迷而不悟，以至亂作，乃思良言，夫何益哉？二章皆刺桓公。始不知人，次又拒諫，無所謂不置良師傅意。《序》之解經，往往得其大概，而措辭又非，故詩旨反因之而晦，須爲細審乃知其得失也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/141-mu-men/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋斯㊟析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯爲析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞㊟〔陸氏璣曰〕鴞，大如班鳩，緑色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可爲羮臛，又可爲炙。〔濮氏一之曰〕《楚辭》注：「鴟、鴞二物。」又云：「鵩似鴞。」本章云，其實一耳。《莊子》「見彈而求鴞炙」是也。萃㊟集也。訊㊟告也。顛倒㊟狼狽之狀。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋斯㊟析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯爲析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞㊟〔陸氏璣曰〕鴞，大如班鳩，緑色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可爲羮臛，又可爲炙。〔濮氏一之曰〕《楚辭》注：「鴟、鴞二物。」又云：「鵩似鴞。」本章云，其實一耳。《莊子》「見彈而求鴞炙」是也。萃㊟集也。訊㊟告也。顛倒㊟狼狽之狀。\",\"fullText\":\"集釋斯㊟析也。〔孔氏穎達曰〕《釋言》云：「斯，離也。」〔孫炎曰〕「斯，析之離。」是斯爲析義也。〔濮氏一之曰〕斯，《莊子》：「斯而析之。」鴞㊟〔陸氏璣曰〕鴞，大如班鳩，緑色，入人家凶，賈誼所賦鵩鳥是也。其肉甚美，可爲羮臛，又可爲炙。〔濮氏一之曰〕《楚辭》注：「鴟、鴞二物。」又云：「鵩似鴞。」本章云，其實一耳。《莊子》「見彈而求鴞炙」是也。萃㊟集也。訊㊟告也。顛倒㊟狼狽之狀。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/141-mu-men/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻斯㊟四支。知㊟同。本韻。已㊟四紙。矣㊟同。
