engjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/114-xi-shuai/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。","sourceLabel":"第 237-239 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。","fullText":"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，候虫随着寒暑变化经常移动，所以古人将它当作候虫。聿，同“曰”，语助词，含有“遂（就）”意。莫，即暮。其暮犹言“将尽”。乐，寻欢作乐。日月，指光阴。除，逝去、去旧更新之意。无，通“毋”。已，过度。大，同“泰”。大康，安乐。这句意为，不要过分地追求安乐。职，尚、还要。居，处，指自己担任的职位。这句意为，还要想到自己的职务。好，爱好。荒，荒废。良士，指作者心目中的榜样。瞿瞿，惊顾貌，含有警惕之意。这二句意为，爱好娱乐而不荒废业务，该像良士那样时时警戒自己。韵读：鱼部一一莫、除、居、瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。逝，流逝。迈，与上章“日月其除”的“除”同义。外，职务以外的事。蹶蹶，动作敏捷貌。这句意为，该像良士那样敏捷勤快。韵读：祭部一一逝（时例反，入声）、迈（音蔑）、外（音月，入声）、蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。役车，服役的车辆。其休，将要休息，指行役者将回家，这也是岁暮的事。慆，过。这里也作“逝去”解。忧，可忧的事。休休，希望和平的心情。韵读：幽部一一休、慆（佗侯反）、忧、休。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-0 id\":\"seg-023:1-4:好乐无荒\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"好乐无荒\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:良士休休\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"良士休休\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:3-4:休休\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"休休\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。\",\"sourceLabel\":\"第 237-239 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。\",\"fullText\":\"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，候虫随着寒暑变化经常移动，所以古人将它当作候虫。聿，同“曰”，语助词，含有“遂（就）”意。莫，即暮。其暮犹言“将尽”。乐，寻欢作乐。日月，指光阴。除，逝去、去旧更新之意。无，通“毋”。已，过度。大，同“泰”。大康，安乐。这句意为，不要过分地追求安乐。职，尚、还要。居，处，指自己担任的职位。这句意为，还要想到自己的职务。好，爱好。荒，荒废。良士，指作者心目中的榜样。瞿瞿，惊顾貌，含有警惕之意。这二句意为，爱好娱乐而不荒废业务，该像良士那样时时警戒自己。韵读：鱼部一一莫、除、居、瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。逝，流逝。迈，与上章“日月其除”的“除”同义。外，职务以外的事。蹶蹶，动作敏捷貌。这句意为，该像良士那样敏捷勤快。韵读：祭部一一逝（时例反，入声）、迈（音蔑）、外（音月，入声）、蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。役车，服役的车辆。其休，将要休息，指行役者将回家，这也是岁暮的事。慆，过。这里也作“逝去”解。忧，可忧的事。休休，希望和平的心情。韵读：幽部一一休、慆（佗侯反）、忧、休。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。\",\"sourceLabel\":\"第 237-239 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。\",\"fullText\":\"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，候虫随着寒暑变化经常移动，所以古人将它当作候虫。聿，同“曰”， ,\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"唐人歲暮述懷也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"唐人歲暮述懷也。\",\"fullText\":\"唐人歲暮述懷也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蟋蟀》三章，章八句。此真唐風也。其人素本勤儉，强作曠達，而又不敢過放其懷，恐躭逸樂，致荒本業。故方以日月之舍我而逝不復回者，爲樂不可緩；又更以職業之當修勿忘其本業者，爲志不可荒。無已，則必如彼瞿瞿良士，好樂而無荒焉可也。此亦謹守見道之人所作。聖人取之，冠於《唐風》之首，以爲唐堯舊俗，固如是耳。而《序》以爲「刺晉僖公儉不中禮」，今觀詩意，無所謂「刺」，亦無所謂「儉不中禮」，安見其必爲僖公發哉？《序》好附會而又無理，往往如是，斷不可從。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《蟋蟀》三章，章八句。此真唐風也。其人素本勤儉，强作曠達，而又不敢過放其懷，恐躭逸樂，致荒本業。故方以日月之舍我而逝不復回者，爲樂不可緩；又更以職業之當修勿忘其本業者，爲志不可荒。無已，則必如彼瞿瞿良士，好樂而無荒焉可也。此亦謹守見道之人所作。聖人取之，冠於《唐風》之首，以爲唐堯舊俗，固如是耳。而《序》以爲「刺晉僖公儉不中禮」，今觀詩意，無所謂「刺」，亦無所謂「儉不中禮」，安見其必爲僖公發哉？《序》好附會而又無理，往往如是，斷不可從。\",\"fullText\":\"右《蟋蟀》三章，章八句。此真唐風也。其人素本勤儉，强作曠達，而又不敢過放其懷，恐躭逸樂，致荒本業。故方以日月之舍我而逝不復回者，爲樂不可緩；又更以職業之當修勿忘其本業者，爲志不可荒。無已，則必如彼瞿瞿良士，好樂而無荒焉可也。此亦謹守見道之人所作。聖人取之，冠於《唐風》之首，以爲唐堯舊俗，固如是耳。而《序》以爲「刺晉僖公儉不中禮」，今觀詩意，無所謂「刺」，亦無所謂「儉不中禮」，安見其必爲僖公發哉？《序》好附會而又無理，往往如是，斷不可從。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。\",\"fullText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《 engjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-021:1-4:无已大康\",\"segmentId\":\"seg-021\",\"segmentOrder\":21,\"surfaceText\":\"无已大康\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-022:1-4:职思其忧\",\"segmentId\":\"seg-022\",\"segmentOrder\":22,\"surfaceText\":\"职思其忧\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-022:4-4:忧\",\"segmentId\":\"seg-022\",\"segmentOrder\":22,\"surfaceText\":\"忧\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-023:1-4:好乐无荒\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"好乐无荒\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:良士休休\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"良士休休\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:3-4:休休\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"休休\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。\",\"sourceLabel\":\"第 237-239 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。\",\"fullText\":\"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，候虫随着寒暑变化经常移动，所以古人将它当作候虫。聿，同“曰”，语助词，含有“遂（就）”意。莫，即暮。其暮犹言“将尽”。乐，寻欢作乐。日月，指光阴。除，逝去、去旧更新之意。无，通“毋”。已，过度。大，同“泰”。大康，安乐。这句意为，不要过分地追求安乐。职，尚、还要。居，处，指自己担任的职位。这句意为，还要想到自己的职务。好，爱好。荒，荒废。良士，指作者心目中的榜样。瞿瞿，惊顾貌，含有警惕之意。这二句意为，爱好娱乐而不荒废业务，该像良士那样时时警戒自己。韵读：鱼部一一莫、除、居、瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。逝，流逝。迈，与上章“日月其除”的“除”同义。外，职务以外的事。蹶蹶，动作敏捷貌。这句意为，该像良士那样敏捷勤快。韵读：祭部一一逝（时例反，入声）、迈（音蔑）、外（音月，入声）、蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。役车，服役的车辆。其休，将要休息，指行役者将回家，这也是岁暮的事。慆，过。这里也作“逝去”解。忧，可忧的事。休休，希望和平的心情。韵读：幽部一一休、慆（佗侯反）、忧、休。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。\",\"sourceLabel\":\"第 237-239 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。\",\"fullText\":\"这是一首岁暮述怀的诗。作者可能是一位“士”，他感到光阴易逝，应当及时行乐；但另一方面，他又不愿彻底堕落，还想着自己的职责，觉得享乐毕竟还是适可而止的好。方玉润《诗经原始》：“其人素本勤俭，强作旷达，而又不敢过放其怀，恐耽逸乐，致荒本业。故方以日月之舍我而逝不复回者为乐不可缓，又更以职业之当修、勿忘其本业者为志不可荒。无已，则必如彼瞿瞿良士，好乐而无荒焉可也。”他这段分析，对作者的心情颇能体贴入微。这种矛盾的思想，反映了中国几千年来一部分知识分子典型的心理状态。诗歌的逻辑性很强，如“好乐无荒”承“无已大康”而言，“良士瞿瞿”承“职思其居”而言，秩然有序。但在语言的形象生动方面，则逊于《国风》中一些精彩的民歌。蟋蟀在堂，岁聿其莫。今我不乐，日月其除。无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，候虫随着寒暑变化经常移动，所以古人将它当作候虫。聿，同“曰”，语助词，含有“遂（就）”意。莫，即暮。其暮犹言“将尽”。乐，寻欢作乐。日月，指光阴。除，逝去、去旧更新之意。无，通“毋”。已，过度。大，同“泰”。大康，安乐。这句意为，不要过分地追求安乐。职，尚、还要。居，处，指自己担任的职位。这句意为，还要想到自己的职务。好，爱好。荒，荒废。良士，指作者心目中的榜样。瞿瞿，惊顾貌，含有警惕之意。这二句意为，爱好娱乐而不荒废业务，该像良士那样时时警戒自己。韵读：鱼部一一莫、除、居、瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。逝，流逝。迈，与上章“日月其除”的“除”同义。外，职务以外的事。蹶蹶，动作敏捷貌。这句意为，该像良士那样敏捷勤快。韵读：祭部一一逝（时例反，入声）、迈（音蔑）、外（音月，入声）、蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。役车，服役的车辆。其休，将要休息，指行役者将回家，这也是岁暮的事。慆，过。这里也作“逝去”解。忧，可忧的事。休休，希望和平的心情。韵读：幽部一一休、慆（佗侯反）、忧、休。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:蟋蟀在堂\",\"seg-002:1-4:岁聿其莫\",\"seg-003:1-4:今我不乐\",\"seg-004:1-4:日月其除\",\"seg-005:1-4:无已大康\",\"seg-006:1-4:职思其居\",\"seg-007:1-4:好乐无荒\",\"seg-008:1-4:良士瞿瞿\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\",\"anchor-2-7\",\"anchor-2-8\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"00 无已大康，职思其居。好乐无荒，良士瞿瞿。蟋蟀在堂，候虫随着寒暑变化经常移动，所以古人将它当作候虫。聿，同“曰”，语助词，含有“遂（就）”意。莫，即暮。其暮犹言“将尽”。乐，寻欢作乐。日月，指光阴。除，逝去、去旧更新之意。无，通“毋”。已，过度。大，同“泰”。大康，安乐。这句意为，不要过分地追求安乐。职，尚、还要。居，处，指自己担任的职位。这句意为，还要想到自己的职务。好，爱好。荒，荒废。良士，指作者心目中的榜样。瞿瞿，惊顾貌，含有警惕之意。这二句意为，爱好娱乐而不荒废业务，该像良士那样时时警戒自己。韵读：鱼部一一莫、除、居、瞿。蟋蟀在堂，岁聿其逝。今我不乐，日月其迈。无已大康，职思其外。好乐无荒，良士蹶蹶。逝，流逝。迈，与上章“日月其除”的“除”同义。外，职务以外的事。蹶蹶，动作敏捷貌。这句意为，该像良士那样敏捷勤快。韵读：祭部一一逝（时例反，入声）、迈（音蔑）、外（音月，入声）、蹶。蟋蟀在堂，役车其休。今我不乐，日月其慆。无已大康，职思其忧。好乐无荒，良士休休。役车，服役的车辆。其休，将要休息，指行役者将回家，这也是岁暮的事。慆，过。这里也作“逝去”解。忧，可忧的事。休休，希望和平的心情。韵读：幽部一一休、慆（佗侯反）、忧、休。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-018:1-2:役车\",\"seg-018:4-4:休\",\"seg-020:4-4:慆\",\"seg-022:4-4:忧\",\"seg-024:3-4:休休\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"唐人歲暮述懷也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"唐人歲暮述懷也。\",\"fullText\":\"唐人歲暮述懷也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蟋蟀》三章，章八句。此真唐風也。其人素本勤儉，强作曠達，而又不敢過放其懷，恐躭逸樂，致荒本業。故方以日月之舍我而逝不復回者，爲樂不可緩；又更以職業之當修勿忘其本業者，爲志不可荒。無已，則必如彼瞿瞿良士，好樂而無荒焉可也。此亦謹守見道之人所作。聖人取之，冠於《唐風》之首，以爲唐堯舊俗，固如是耳。而《序》以爲「刺晉僖公儉不中禮」，今觀詩意，無所謂「刺」，亦無所謂「儉不中禮」，安見其必爲僖公發哉？《序》好附會而又無理，往往如是，斷不可從。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《蟋蟀》三章，章八句。此真唐風也。其人素本勤儉，强作曠達，而又不敢過放其懷，恐躭逸樂，致荒本業。故方以日月之舍我而逝不復回者，爲樂不可緩；又更以職業之當修勿忘其本業者，爲志不可荒。無已，則必如彼瞿瞿良士，好樂而無荒焉可也。此亦謹守見道之人所作。聖人取之，冠於《唐風》之首，以爲唐堯舊俗，固如是耳。而《序》以爲「刺晉僖公儉不中禮」，今觀詩意，無所謂「刺」，亦無所謂「儉不中禮」，安見其必爲僖公發哉？《序》好附會而又無理，往往如是，斷不可從。\",\"fullText\":\"右《蟋蟀》三章，章八句。此真唐風也。其人素本勤儉，强作曠達，而又不敢過放其懷，恐躭逸樂，致荒本業。故方以日月之舍我而逝不復回者，爲樂不可緩；又更以職業之當修勿忘其本業者，爲志不可荒。無已，則必如彼瞿瞿良士，好樂而無荒焉可也。此亦謹守見道之人所作。聖人取之，冠於《唐風》之首，以爲唐堯舊俗，固如是耳。而《序》以爲「刺晉僖公儉不中禮」，今觀詩意，無所謂「刺」，亦無所謂「儉不中禮」，安見其必爲僖公發哉？《序》好附會而又無理，往往如是，斷不可從。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。\",\"fullText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"fullText\":\"蟋蟀〔陸氏璣曰〕蟋蟀，一名蛬，一名蜻蛚，幽州人謂之趨織，里語曰「趨織鳴，懶婦驚」是也。聿遂也。莫晚也。〔孔氏穎達曰〕《七月》之篇説蟋蟀云「九月在户」，此言在堂，謂在室户之外，與户相近，時當九月。歲未爲暮，而言「歲聿其莫」者，言其過此月後，則歲遂將暮耳。除去也。大康過於樂也。職主也。瞿瞿卻顧之貌。邁去也。外〔蘇氏轍曰〕既思其職，又思其職之外。蹶蹶《釋詁》：「蹶，動也。」《釋訓》：「蹶蹶，敏也。」役車〔孔氏穎達曰〕《春官·巾車》注云：「役車，方箱，可載任器以供役。」然則收納禾稼亦用此車，故役車休息，是農工畢也。慆過也。休休安閑之貌。〔季氏本曰〕休休，以安爲念，亦懼意也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/114-xi-shuai/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"莫七遇。除六魚。居同。瞿七麌。叶韻。逝八霽。邁十卦。外九泰。蹶八霽。通韻。慆四豪，叶佗侯反。憂十一尤。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"莫七遇。除六魚。居同。瞿七麌。叶韻。\",\"fullText\":\"莫七遇。除六魚。居同。瞿七麌。叶韻。逝八霽。邁十卦。外九泰。蹶八霽。通韻。慆四豪，叶佗侯反。憂十一尤。叶韻。\",\"
