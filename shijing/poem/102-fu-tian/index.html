片段","targetText":"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。","sourceLabel":"第 214-215 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。","fullText":"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。无田甫田，维莠骄骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/102-fu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。","sourceLabel":"第 214-215 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"无田甫田，维莠骄骄。无思远人，劳心忉忉。","fullText":"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。无田甫田，维莠骄骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-4:无田甫田","seg-002:1-4:维莠骄骄","seg-003:1-4:无思远人","seg-004:1-4:劳心忉忉"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-01 g-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。\",\"sourceLabel\":\"第 214-215 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。\",\"fullText\":\"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。无田甫田，维莠骄骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:无田甫田\",\"seg-002:1-4:维莠骄骄\",\"seg-003:1-4:无思远人\",\"seg-004:1-4:劳心忉忉\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。\",\"sourceLabel\":\"第 214-215 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"无田，不要耕种。甫，大。莠 骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-009:1-4:婉兮娈兮\",\"seg-010:1-4:总角丱兮\",\"seg-011:1-4:未几见兮\",\"seg-012:1-4:突而弁兮\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\",\"anchor-6-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。\",\"sourceLabel\":\"第 214-215 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"fullText\":\"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。无田甫田，维莠骄骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-010:1-2:总角\",\"seg-010:3-3:丱\",\"seg-011:1-2:未几\",\"seg-012:1-2:突而\",\"seg-012:3-3:弁\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"未詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"未詳。\",\"fullText\":\"未詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《甫田》三章，章四句。此詩詞義極淺，盡人能識。惟意旨所在，則不可知。《小序》謂「刺襄公」。《大序》謂「無禮義而求大功，不修德而求諸侯」。率皆擬議之詞，非實據也。《集傳》不從，是矣。而順文敷義，又恐非詩人本旨。且前二章與後一章，詞氣全不相類，此中必有所指，與泛言義理者不同。《集傳》勉强串合，終非自然。故何玄子以爲「刺魯莊公」，末章似是，其如上二章何哉？姚氏以爲「未詳」，識過諸儒遠矣，從之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《甫田》三章，章四句。此詩詞義極淺，盡人能識。惟意旨所在，則不可知。《小序》謂「刺襄公」。《大序》謂「無禮義而求大功，不修德而求諸侯」。率皆擬議之詞，非實據也。《集傳》不從，是矣。而順文敷義，又恐非詩人本旨。且前二章與後一章，詞氣全不相類，此中必有所指，與泛言義理者不同。《集傳》勉强串合，終非自然。故何玄子以爲「刺魯莊公」，末章似是，其如上二章何哉？姚氏以爲「未詳」，識過諸儒遠矣，從之。\",\"fullText\":\"右《甫田》三章，章四句。此詩詞義極淺，盡人能識。惟意旨所在，則不可知。《小序》謂「刺襄公」。《大序》謂「無禮義而求大功，不修德而求諸侯」。率皆擬議之詞，非實據也。《集傳》不從，是矣。而順文敷義，又恐非詩人本旨。且前二章與後一章，詞氣全不相類，此中必有所指，與泛言義理者不同。《集傳》勉强串合，終非自然。故何玄子以爲「刺魯莊公」，末章似是，其如上二章何哉？姚氏以爲「未詳」，識過諸儒遠矣，從之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。\",\"fullText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"甫大也。\",\"fullText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"莠害苗之草也。\",\"fullText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-4\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/g jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。\",\"sourceLabel\":\"第 214-215 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。\",\"fullText\":\"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。无田甫田，维莠骄骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。\",\"sourceLabel\":\"第 214-215 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。\",\"fullText\":\"这是一首思念远人的诗。作者可能是一位流亡的农 uan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"无田甫田，维莠骄骄。无思远人，劳心忉忉。无田甫田，维莠桀桀。无思远人，劳心怛怛。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。\",\"sourceLabel\":\"第 214-215 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"fullText\":\"这是一首思念远人的诗。作者可能是一位流亡的农民，曾经种过领主的大田。他想起当初种田除草的辛苦，现在虽然可以离开了，但又添了思念远人的苦恼，所以用大田起兴。第三章说出了这个远人是谁，就是那个幼小美好的孩子。别时他还是扎着羊角辫的娃娃，如果不久能见到的话，该是青年人了吧。他的久别之感与前两章的劳心相应。无田甫田，维莠骄骄。无思远人，劳心忉忉。无田，不要耕种。甫，大。莠，狗尾草一类害苗之草。骄骄，高貌。忉忉，忧伤貌。无田甫田，维莠桀桀。无思远人，劳心怛怛。桀桀，草高举貌。怛怛，忧伤痛心貌。婉兮娈兮，总角丱兮。未几见兮，突而弁兮。婉娈，年少而美好。总角，儿童发饰。丱，形容总角的形状。未几，不久。突而，突然。弁，成年加冠。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-010:1-2:总角\",\"seg-010:3-3:丱\",\"seg-011:1-2:未几\",\"seg-012:1-2:突而\",\"seg-012:3-3:弁\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"未詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"未詳。\",\"fullText\":\"未詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《甫田》三章，章四句。此詩詞義極淺，盡人能識。惟意旨所在，則不可知。《小序》謂「刺襄公」。《大序》謂「無禮義而求大功，不修德而求諸侯」。率皆擬議之詞，非實據也。《集傳》不從，是矣。而順文敷義，又恐非詩人本旨。且前二章與後一章，詞氣全不相類，此中必有所指，與泛言義理者不同。《集傳》勉强串合，終非自然。故何玄子以爲「刺魯莊公」，末章似是，其如上二章何哉？姚氏以爲「未詳」，識過諸儒遠矣，從之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《甫田》三章，章四句。此詩詞義極淺，盡人能識。惟意旨所在，則不可知。《小序》謂「刺襄公」。《大序》謂「無禮義而求大功，不修德而求諸侯」。率皆擬議之詞，非實據也。《集傳》不從，是矣。而順文敷義，又恐非詩人本旨。且前二章與後一章，詞氣全不相類，此中必有所指，與泛言義理者不同。《集傳》勉强串合，終非自然。故何玄子以爲「刺魯莊公」，末章似是，其如上二章何哉？姚氏以爲「未詳」，識過諸儒遠矣，從之。\",\"fullText\":\"右《甫田》三章，章四句。此詩詞義極淺，盡人能識。惟意旨所在，則不可知。《小序》謂「刺襄公」。《大序》謂「無禮義而求大功，不修德而求諸侯」。率皆擬議之詞，非實據也。《集傳》不從，是矣。而順文敷義，又恐非詩人本旨。且前二章與後一章，詞氣全不相類，此中必有所指，與泛言義理者不同。《集傳》勉强串合，終非自然。故何玄子以爲「刺魯莊公」，末章似是，其如上二章何哉？姚氏以爲「未詳」，識過諸儒遠矣，從之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。\",\"fullText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，古之遺語也。甫大也。莠害苗之草也。驕驕張皇之意。忉忉憂勞也。桀桀猶驕驕也。怛怛慘切貌。婉孌少好貌。丱兩角貌。弁冠名。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/102-fu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"田耕治之也。〔孔氏穎達曰〕「田甫田」，猶《多方》「宅爾宅，田爾田」，今人謂佃食，
