:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。\",\"fullText\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。\",\"fullText\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:鶉之奔奔\",\"seg-002:1-4:鵲之彊彊\",\"seg-003:1-4:人之無良\",\"seg-004:1-4:我以爲兄\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；\",\"fullText\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-005:1-4:鵲之彊彊\",\"seg-006:1-4:鶉之奔奔\",\"seg-007:1-4:人之無良\",\"seg-008:1-4:我以爲君\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-4\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"fullText\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"鶉之奔奔㊟代衛公子刺宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注以“代衛公子刺宣公”定篇，\",\"fullText\":\"方玉润题注以“代衛公子刺宣公”定篇，主张此诗为借卫公子之口而刺宣公。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"鶉之奔奔㊟代衛公子刺宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"主张此诗为借卫公子之口而刺宣公。\",\"fullText\":\"方玉润题注以“代衛公子刺宣公”定篇，主张此诗为借卫公子之口而刺宣公。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评先列《序》与《集傳》“刺衛宣姜”说，继而质疑“惠公刺母”之解于人伦难通，认为“兄”“君”指向及“我”之身份皆多疑难。\",\"fullText\":\"方玉润总评先列《序》与《集傳》“刺衛宣姜”说，继而质疑“惠公刺母”之解于人伦难通，认为“兄”“君”指向及“我”之身份皆多疑难。其引姚际恒“人我一体、刺宣公”之说，以为较顺；并谓此诗词意过率，近于直诋，故存其异说而不遽定论。方氏又称，若从姚说，当作“人雖無良，我不敢不以爲兄，不敢不以爲君”之意，方合温柔敦厚之旨。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:p 样句式反复申说，凸显对上位者乱伦失德的不平与谴责。\",\"fullText\":\"次章“鹊之彊彊，鹑之奔奔。人之无良，我以为君”与首章互文反复。程、蒋释“君”为君主，指出本章由“兄”转为“君”，使讽刺语气更为直切。两章重章叠唱，以同样句式反复申说，凸显对上位者乱伦失德的不平与谴责。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"鶉之奔奔刺衛宣姜也衛人以爲宣姜鶉鵲之不若也\",\"sourceLabel\":\"第 7 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《鶉之奔奔》，刺衛宣姜也。\",\"fullText\":\"序：《鶉之奔奔》，刺衛宣姜也。衛人以爲宣姜，鶉鵲之不若也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"鶉之奔奔刺衛宣姜也衛人以爲宣姜鶉鵲之不若也\",\"sourceLabel\":\"第 7 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛人以爲宣姜，鶉鵲之不若也。\",\"fullText\":\"序：《鶉之奔奔》，刺衛宣姜也。衛人以爲宣姜，鶉鵲之不若也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。\",\"fullText\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。\",\"fullText\":\"陈奂疏《鶉之奔奔》时，先据《序》“刺衛宣姜也……鶉鵲之不若也”申明此篇主刺宣姜与公子頑失伦。其释首章“鶉之奔奔，鵲之彊彊。人之無良，我以爲兄”，引传笺以奔奔、彊彊为有常匹、飞则相随之状，反衬宣姜与頑非匹耦而相从；“兄”则就惠公之辞，指其兄頑。次章“鵲之彊彊，鶉之奔奔。人之無良，我以爲君”，则以“君”为小君，指宣姜；两章重言互见，专以禽鸟有耦，深刺人伦之失。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:鶉之奔奔\",\"seg-002:1-4:鵲之彊彊\",\"seg-003:1-4:人之無良\",\"seg-004:1-4:我以爲兄\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鶉之奔奔，鵲之彊彊。人之無良，我以爲兄。鵲之彊彊，鶉之奔奔。人之無良，我以爲君。\",\"sourceLabel\":\"第 7-9 页\",\"attributionLabel\":\"陈奂\",\"sectionLab ”定篇，主张此诗为借卫公子之口而刺宣公。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"鶉之奔奔㊟代衛公子刺宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"主张此诗为借卫公子之口而刺宣公。\",\"fullText\":\"方玉润题注以“代衛公子刺宣公”定篇，主张此诗为借卫公子之口而刺宣公。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评先列《序》与《集傳》“刺衛宣姜”说，继而质疑“惠公刺母”之解于人伦难通，认为“兄”“君”指向及“我”之身份皆多疑难。\",\"fullText\":\"方玉润总评先列《序》与《集傳》“刺衛宣姜”说，继而质疑“惠公刺母”之解于人伦难通，认为“兄”“君”指向及“我”之身份皆多疑难。其引姚际恒“人我一体、刺宣公”之说，以为较顺；并谓此诗词意过率，近于直诋，故存其异说而不遽定论。方氏又称，若从姚说，当作“人雖無良，我不敢不以爲兄，不敢不以爲君”之意，方合温柔敦厚之旨。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其引姚际恒“人我一体、刺宣公”之说，以为较顺；并谓此诗词意过率，近于直诋，故存其异说而不遽定论。\",\"fullText\":\"方玉润总评先列《序》与《集傳》“刺衛宣姜”说，继而质疑“惠公刺母”之解于人伦难通，认为“兄”“君”指向及“我”之身份皆多疑难。其引姚际恒“人我一体、刺宣公”之说，以为较顺；并谓此诗词意过率，近于直诋，故存其异说而不遽定论。方氏又称，若从姚说，当作“人雖無良，我不敢不以爲兄，不敢不以爲君”之意，方合温柔敦厚之旨。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方氏又称，若从姚说，当作“人雖無良，我不敢不以爲兄，不敢不以爲君”之意，方合温柔敦厚之旨。\",\"fullText\":\"方玉润总评先列《序》与《集傳》“刺衛宣姜”说，继而质疑“惠公刺母”之解于人伦难通，认为“兄”“君”指向及“我”之身份皆多疑难。其引姚际恒“人我一体、刺宣公”之说，以为较顺；并谓此诗词意过率，近于直诋，故存其异说而不遽定论。方氏又称，若从姚说，当作“人雖無良，我不敢不以爲兄，不敢不以爲君”之意，方合温柔敦厚之旨。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"鶉之奔奔鵲之彊彊\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释云：鶉，䳺屬，并引寇宗奭谓鶉四时异名。\",\"fullText\":\"方玉润集释云：鶉，䳺屬，并引寇宗奭谓鶉四时异名。奔奔，《左傳》作“賁賁”。彊彊，居有常匹、飛則相隨之貌，并引陸德明《韓詩》“奔奔彊彊，乘匹之貌”说。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:鶉\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\"]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/049-chun-zhi-ben-ben/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materi
