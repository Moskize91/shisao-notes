治者口称礼义而行为无耻，故人民以鼠起兴，直斥其“人不如鼠”，并特别强调此诗与《墉之奔奔》等同属不作温柔曲讽、而是直吐怒骂的“变风”之作，正显示出强烈的反抗精神与感染力。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"相鼠有皮，人而无仪。人而无仪，不死何为？","sourceLabel":"第 111 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。","fullText":"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。","notes":null,"partOrder":1,"anchorIds":["seg-001:1-4:相鼠有皮","seg-002:1-4:人而无仪","seg-003:1-4:人而无仪","seg-004:1-4:不死何为"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3","anchor-1-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"相鼠有皮，人而无仪。人而无仪，不死何为？","sourceLabel":"第 111 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。","fullText":"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-1:相","seg-002:4-4:仪"],"glossAnchorIds":["anchor-2-1","anchor-2-2"],"segmentIds":["seg-001","seg-002","seg-003","seg-004"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-3","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjian 责卫国统治阶级苟且偷安、暗昧无耻的诗。程、蒋肯定毛序“刺无礼”大体不误，但指出周代统治者口称礼义而行为无耻，故人民以鼠起兴，直斥其“人不如鼠”，并特别强调此诗与《墉之奔奔》等同属不作温柔曲讽、而是直吐怒骂的“变风”之作，正显示出强烈的反抗精神与感染力。\",\"fullText\":\"题解认为《相鼠》是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。程、蒋肯定毛序“刺无礼”大体不误，但指出周代统治者口称礼义而行为无耻，故人民以鼠起兴，直斥其“人不如鼠”，并特别强调此诗与《墉之奔奔》等同属不作温柔曲讽、而是直吐怒骂的“变风”之作，正显示出强烈的反抗精神与感染力。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。\",\"fullText\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:相鼠有皮\",\"seg-002:1-4:人而无仪\",\"seg-003:1-4:人而无仪\",\"seg-004:1-4:不死何为\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。\",\"fullText\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-1:相\",\"seg-002:4-4:仪\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"fullText\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-004:3-4:何为\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有齿，人而无止。人而无止，不死何俟？\",\"sourceLabel\":\"第 111-112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“相鼠有齿，人而无止。人而无止，不死何俟”转以“止”申义。\",\"fullText\":\"次章“相鼠有齿，人而无止。人而无止，不死何俟”转以“止”申义。程、蒋释“止”为节止、容止，引《大戴礼》《说文》《礼记》《淮南子》诸说，说明“无止”即无礼节、不能自处自禁；又据音训释“俟”为等待，故此章是说既无礼节，又还等待什么而不死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:1-4:相鼠有齿\",\"seg-006:1-4:人而无止\",\"seg-007:1-4:人而无止\",\"seg-008:1-4:不死何俟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[ \"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。\",\"fullText\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；又释“遄”为速、快，故末句即更直截地催其速死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-4:相鼠有体\",\"seg-010:1-4:人而无礼\",\"seg-011:1-4:人而无礼\",\"seg-012:1-4:胡不遄死\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；\",\"fullText\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；又释“遄”为速、快，故末句即更直截地催其速死。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-009:4-4:体\",\"seg-010:4-4:礼\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又释“遄”为速、快，故末句即更直截地催其速死。\",\"fullText\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；又释“遄”为速、快，故末句即更直截地催其速死。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-012:3-3:遄\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":\"第 14 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《相鼠》，刺無禮也。\",\"fullText\":\"序：《相鼠》，刺無禮也。衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":\"第 14 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"fullText\":\"序：《相鼠》，刺無禮也。衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"sourceLabel\":\"第 14-16 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《相鼠》时，先据《序》申明卫文公能正群臣，而此篇所刺正在位者承先君之化、尚失礼仪。\",\"fullText\":\"陈奂疏《相鼠》时，先据《序》申明卫文公能正群臣，而此篇所刺正在位者承先君之化、尚失礼仪。其释首章“相鼠有皮，人而無儀。人而無儀，不死何爲”，以“相”为视、“儀”为威仪，谓人若居尊位而无威仪，则徒与鼠之苟得同类，不如其死。次章“相鼠有齒，人而無止。人而無止，不死何俟”，以“止”为容止、礼节，并引韩诗“止，节”之义。末章“相鼠有體，人而無禮。人而無禮，胡不遄死”，则以“體”为支体之总，“遄”为速，断言既具人形而无礼，尤当速死。通篇重在借鼠之一体备具，反刺人失威仪、节止与礼。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"sourceLabel\":\"第 14-16 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“相鼠有皮，人而無儀。人而無儀，不死何爲”，以“相”为视、“儀”为威仪，谓人若居尊位而无威仪，则徒与鼠之苟得同类，不如其死。\",\"fullText\":\"陈奂疏《相鼠》时，先据《序》申明卫文公能正群臣，而此篇所刺正在位者承先君之化、尚失礼仪。其释首章“相鼠有皮，人而無儀。人而無儀，不死何爲”，以“相”为视、“儀”为威仪，谓人若居尊位而无威仪，则徒与鼠之苟得同类，不如其死。次章“相鼠有齒，人而無止。人而無止，不死何俟”，以“止”为容止、礼节，并引韩诗“止，节”之义。末章“相鼠有體，人而無禮。人而無禮，胡不遄死”，则以“體”为支体之总，“遄”为速，断言既具人形而无礼，尤当速死。通篇重在借鼠之一体备具，反刺人失威仪、节止与礼。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:相鼠有皮\",\"seg-002:1-4:人而無儀\",\"seg-003:1-4:人而無儀\",\"seg-004:1-4:不死何爲\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0 1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"相鼠㊟刺無禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"与《序》说相同。\",\"fullText\":\"方玉润题注径以“刺無禮”定篇，与《序》说相同。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。\",\"fullText\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。末又存录“卫文公训诰臣民”一说，以备参考。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。\",\"fullText\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。末又存录“卫文公训诰臣民”一说，以备参考。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[ rialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 110-111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"题解认为《相鼠》是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。程、蒋肯定毛序“刺无礼”大体不误，但指出周代统治者口称礼义而行为无耻，故人民以鼠起兴，直斥其“人不如鼠”，并特别强调此诗与《墉之奔奔》等同属不作温柔曲讽、而是直吐怒骂的“变风”之作，正显示出强烈的反抗精神与感染力。\",\"fullText\":\"题解认为《相鼠》是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。程、蒋肯定毛序“刺无礼”大体不误，但指出周代统治者口称礼义而行为无耻，故人民以鼠起兴，直斥其“人不如鼠”，并特别强调此诗与《墉之奔奔》等同属不作温柔曲讽、而是直吐怒骂的“变风”之作，正显示出强烈的反抗精神与感染力。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。\",\"fullText\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:相鼠有皮\",\"seg-002:1-4:人而无仪\",\"seg-003:1-4:人而无仪\",\"seg-004:1-4:不死何为\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。\",\"fullText\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-1:相\",\"seg-002:4-4:仪\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"fullText\":\"首章“相鼠有皮，人而无仪。人而无仪，不死何为”以鼠起兴。程、蒋释“相”为看，指出“仪”是可供人取法的威仪姿态，并引《左传》卫北宫文子论“威仪”说明其社会规范意义。又说明“何为”即“为何”的倒文，实为激烈诅咒无仪者不如快死。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-004:3-4:何为\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有齿，人而无止。人而无止，不死何俟？\",\"sourceLabel\":\"第 111-112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“相鼠有齿，人而无止。人而无止，不死何俟”转以“止”申义。\",\"fullText\":\"次章“相鼠有齿，人而无止。人而无止，不死何俟”转以“止”申义。程、蒋释“止”为节止、容止，引《大戴礼》《说文》《礼记》《淮南子》诸说，说明“无止”即无礼节、不能自处自禁；又据音训释“俟”为等待，故此章是说既无礼节，又还等待什么而不死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:1-4:相鼠有齿\",\"seg-006:1-4:人而无止\",\"seg-007:1-4:人而无止\",\"seg-008:1-4:不死何俟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有齿，人而无止。人而无止，不死何俟？\",\"sourceLabel\":\"第 111-112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“止”为节止、容止，引《大戴礼》《说文》《礼记》《淮南子》诸说，说明“无止”即无礼节、不能自处自禁；\",\"fullText\":\"次章“相鼠有齿，人而无止。人而无止，不死何俟”转以“止”申义。程、蒋释“止”为节止、容止，引《大戴礼》《说文》《礼记》《淮南子》诸说，说明“无止”即无礼节、不能自处自禁；又据音训释“俟”为等待，故此章是说既无礼节，又还等待什么而不死。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-006:4-4:止\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有齿，人而无止。人而无止，不死何俟？\",\"sourceLabel\":\"第 111-112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又据音训释“俟”为等待，故此章是说既无礼节，又还等待什么而不死。\",\"fullText\":\"次章“相鼠有齿，人而无止。人而无止，不死何俟”转以“止”申义。程、蒋释“止”为节止、容止，引《大戴礼》《说文》《礼记》《淮南子》诸说，说明“无止”即无礼节、不能自处自禁；又据音训释“俟”为等待，故此章是说既无礼节，又还等待什么而不死。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-008:4-4:俟\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。\",\"fullText\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；又释“遄”为速、快，故末句即更直截地催其速死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-4:相鼠有体\",\"seg-010:1-4:人而无礼\",\"seg-011:1-4:人而无礼\",\"seg-012:1-4:胡不遄死\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；\",\"fullText\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；又释“遄”为速、快，故末句即更直截地催其速死。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-009:4-4:体\",\"seg-010:4-4:礼\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又释“遄”为速、快，故末句即更直截地催其速死。\",\"fullText\":\"末章“相鼠有体，人而无礼。人而无礼，胡不遄死”总束全篇。程、蒋释“体”为身体，认为首二章言威仪与节止只是礼的一端，此章举全体以该全礼；又释“遄”为速、快，故末句即更直截地催其速死。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-012:3-3:遄\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":\"第 14 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《相鼠》，刺無禮也。\",\"fullText\":\"序：《相鼠》，刺無禮也。衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":\"第 14 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"fullText\":\"序：《相鼠》，刺無禮也。衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"sourceLabel\":\"第 14-16 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《相鼠》时，先据《序》申明卫文公能正群臣，而此篇所刺正在位者承先君之化、尚失礼仪。\",\"fullText\":\"陈奂疏《相鼠》时，先据《序》申明卫文公能正群臣，而此篇所刺正在位者承先君之化、尚失礼仪。其释首章“相鼠有皮，人而無儀。人而無儀，不死何爲”，以“相”为视、“儀”为威仪，谓人若居尊位而无威仪，则徒与鼠之苟得同类，不如其死。次章“相鼠有齒，人而無止。人而無止，不死何俟”，以“止”为容止、礼节，并引韩诗“止，节”之义。末章“相鼠有體，人而無禮。人而無禮，胡不遄死”，则以“體”为支体之总，“遄”为速，断言既具人形而无礼，尤当速死。通篇重在借鼠之一体备具，反刺人失威仪、节止与礼。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"sourceLabel\":\"第 14-16 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“相鼠有皮，人而無儀。人而無儀，不死何爲”，以“相”为视、“儀”为威仪，谓人若居尊位而无威仪，则徒与鼠之苟得同类，不如其死。\",\"fullText\":\"陈奂疏《相鼠》时，先据《序》申明卫文公能正群臣，而此篇所刺正在位者承先君之化、尚失礼仪。其释首章“相鼠有皮，人而無儀。人而無儀，不死何爲”，以“相”为视、“儀”为威仪，谓人若居尊位而无威仪，则徒与鼠之苟得同类，不如其死。次章“相鼠有齒，人而無止。人而無止，不死何俟”，以“止”为容止、礼节，并引韩诗“止，节”之义。末章“相鼠有體，人而無禮。人而無禮，胡不遄死”，则以“體”为支体之总，“遄”为速，断言既具人形而无礼，尤当速死。通篇重在借鼠之一体备具，反刺人失威仪、节止与礼。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:相鼠有皮\",\"seg-002:1-4:人而無儀\",\"seg-003:1-4:人而無儀\",\"seg-004:1-4:不死何爲\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\ abel\":\"题注\",\"excerpt\":\"方玉润题注径以“刺無禮”定篇，\",\"fullText\":\"方玉润题注径以“刺無禮”定篇，与《序》说相同。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"相鼠㊟刺無禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"与《序》说相同。\",\"fullText\":\"方玉润题注径以“刺無禮”定篇，与《序》说相同。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。\",\"fullText\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。末又存录“卫文公训诰臣民”一说，以备参考。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。\",\"fullText\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。末又存录“卫文公训诰臣民”一说，以备参考。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"末又存录“卫文公训诰臣民”一说，以备参考。\",\"fullText\":\"方玉润总评谓：《序》以“刺無禮”解此篇，诸家大抵皆从。其不同意旧说把“鼠尚有皮，人而無儀”解成“人不若鼠”，认为这样反轻了礼仪；应理解为人若去礼义威仪而不自检，则虽具皮齿形体，不过与鼠辈同类，甚且不如禽兽之长，故诗人直斥其“不如速死”。末又存录“卫文公训诰臣民”一说，以备参考。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释称鼠为蟲类中最可贱恶者，又引陆佃“礼鼠”、吕祖谦引韩愈“礼鼠拱而立”等说补充鼠之异闻。\",\"fullText\":\"方玉润集释称鼠为蟲类中最可贱恶者，又引陆佃“礼鼠”、吕祖谦引韩愈“礼鼠拱而立”等说补充鼠之异闻。并释“止”为容止，“遄”为速，以申明三章皆由鼠之一体兴人之失礼。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"gl
