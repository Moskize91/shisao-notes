kr1c0004:0003-1:part-1"],"materialIds":["maoheng-zhushu-kr1c0004"]},{"id":"seg-008:4-4:俟","segmentId":"seg-008","segmentOrder":8,"surfaceText":"俟","charStart":4,"charEnd":4,"entryIds":["maoheng-zhushu-kr1c0004:0003-1:part-2","zhuxi-shijichuan-kr1c0009:0002-1:part-2"],"materialIds":["maoheng-zhushu-kr1c0004","zhuxi-shijichuan-kr1c0009"]},{"id":"seg-009:4-4:體","segmentId":"seg-009","segmentOrder":9,"surfaceText":"體","charStart":4,"charEnd":4,"entryIds":["maoheng-zhushu-kr1c0004:0004-1:part-1","zhuxi-shijichuan-kr1c0009:0003-1:part-1"],"materialIds":["maoheng-zhushu-kr1c0004","zhuxi-shijichuan-kr1c0009"]},{"id":"seg-010:3-4:無禮","segmentId":"seg-010","segmentOrder":10,"surfaceText":"無禮","charStart":3,"charEnd":4,"entryIds":["maoheng-zhushu-kr1c0004:0004-1:part-2"],"materialIds":["maoheng-zhushu-kr1c0004"]},{"id":"seg-012:3-3:遄","segmentId":"seg-012","segmentOrder":12,"surfaceText":"遄","charStart":3,"charEnd":3,"entryIds":["maoheng-zhushu-kr1c0004:0004-1:part-3","quwanli-quanshi:0002-1:part-3","zhuxi-shijichuan-kr1c0009:0003-1:part-2"],"materialIds":["maoheng-zhushu-kr1c0004","quwanli-quanshi","zhuxi-shijichuan-kr1c0009"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"global","layerLabel":"全篇总说","targetText":"题解","sourceLabel":"第 110-111 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。诗人以鼠起兴，讥刺在位者人不如鼠。毛序：“刺无礼也。”这是不错的。在周代，统治阶级定了一套礼，用来欺骗、统治劳动人民，炫耀自己的权威，巩固政权。他们嘴里说礼，实际上的行为是最无耻、最无礼的。人民看透了他们的欺骗性，忍不住满腔怒火，大胆地诅咒他们，诅咒他们为什么不快死。这种大无畏的反抗精神，在那时候是很不容易的，班固《白虎通义》谏诤篇引诗末章四句说：“此妻谏夫之诗也。”这是鲁说，似不足信。\n孔子曰：“关雎乐而不淫，哀而不伤。”（论语八佾）又礼记《经解》：“温柔敦厚，诗教也。”后儒为了突出诗作为“经”的地位，将其中的作品都纳入封建伦理的轨道，不惜穿凿附会，将三百篇尽视作“乐而不淫，哀而不伤”之诗，即使是一些情辞愤激之作，也经百般曲解，偏要誉以“温柔敦厚”之名。诗中固然有不少含蓄蕴藉之作，但也有一些作品，“以述情切事为快，不尽含蓄也。语荒而曰‘周馀黎民，靡有孑遗’，劝乐而曰‘宛其死矣，他人入室’，讥失仪而曰‘人而无礼，胡不遄死’，怨谤而曰‘豺虎不食’，投畀有昊’……”（王世贞《艺苑卮言》）。如此诗及前面的《鹑之奔奔》，后面的小雅《巷伯》、大雅《云汉》，均为直吐怒骂之作。这些被后人称作“变风”、“变雅”的作品，“具忧世之怀”，“多忧生之意”，“读之当兼得其人之志与遇焉”（刘熙载《诗概》），既有强烈的感染作用，又有深刻的教育意义，故因“变”而更显示出不朽的价值。","fullText":"这是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。诗人以鼠起兴，讥刺在位者人不如鼠。毛序：“刺无礼也。”这是不错的。在周代，统治阶级定了一套礼，用来欺骗、统治劳动人民，炫耀自己的权威，巩固政权。他们嘴里说礼，实际上的行为是最无耻、最无礼的。人民看透了他们的欺骗性，忍不住满腔怒火，大胆地诅咒他们，诅咒他们为什么不快死。这种大无畏的反抗精神，在那时候是很不容易的，班固《白虎通义》谏诤篇引诗末章四句说：“此妻谏夫之诗也。”这是鲁说，似不足信。\n孔子曰：“关雎乐而不淫，哀而不伤。”（论语八佾）又礼记《经解》：“温柔敦厚，诗教也。”后儒为了突出诗作为“经”的地位，将其中的作品都纳入封建伦理的轨道，不惜穿凿附会，将三百篇尽视作“乐而不淫，哀而不伤”之诗，即使是一些情辞愤激之作，也经百般曲解，偏要誉以“温柔敦厚”之名。诗中固然有不少含蓄蕴藉之作，但也有一些作品，“以述情切事为快，不尽含蓄也。语荒而曰‘周馀黎民，靡有孑遗’，劝乐而曰‘宛其死矣，他人入室’，讥失仪而曰‘人而无礼，胡不遄死’，怨谤而曰‘豺虎不食’，投畀有昊’……”（王世贞《艺苑卮言》）。如此诗及前面的《鹑之奔奔》，后面的小雅《巷伯》、大雅《云汉》，均为直吐怒骂之作。这些被后人称作“变风”、“变雅”的作品，“具忧世之怀”，“多忧生之意”，“读之当兼得其人之志与遇焉”（刘熙载《诗概》），既有强烈的感染作用，又有深刻的教育意义，故因“变”而更显示出不朽的价值。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"相鼠有皮，人而无仪。人而无仪，不死何为？","sourceLabel":"第 111 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"相，看。毛传：“相，视也。”或说相是地名，相鼠是相地地方的老鼠，恐非诗意。\n仪，威仪，指可供他人取法的端庄严肃的态度、行为。左传襄公三十一年，卫北宫文子曰：“有威而可畏谓之威，有仪而可象谓之仪。君有君之威仪，其臣畏而爱之，则而象之，故能有其国家，令闻长世。臣有臣之威仪，其下畏而爱之，故能守其官职，保族宜家。顺是以下皆如是，是以上下能相亲也。……故君子在位可畏，施舍可爱，进退可度，周旋可则，容止可观，作事可法，德行可象，声气可乐，动作有文，言语有章，以临其下，谓之有威仪也。”这就是当时人对威仪的内容和作用的解释。\n何为，即“为何”的倒文，为什么。按这句应作“为何不死”，倒文协韵。鲁诗何作“胡”。下章同。\n韵读：歌部一一皮（音婆）、仪（音俄）、仪、为（音讹）。","fullText":"相，看。毛传：“相，视也。”或说相是地名，相鼠是相地地方的老鼠，恐非诗意。\n仪，威仪，指可供他人取法的端庄严肃的态度、行为。左传襄公三十一年，卫北宫文子曰：“有威而可畏谓之威，有仪而可象谓之仪。君有君之威仪，其臣畏而爱之，则而象之，故能有其国家，令闻长世。臣有臣之威仪，其下畏而爱之，故能守其官职，保族宜家。顺是以下皆如是，是以上下能相亲也。……故君子在位可畏，施舍可爱，进退可度，周旋可则，容止可观，作事可法，德行可象，声气可乐，动作有文，言语有章，以临其下，谓之有威仪也。”这就是当时人对威仪的内容和作用的解释。\n何为，即“为何”的倒文，为什么。按这句应作“为何不死”，倒文协韵。鲁诗何作“胡”。下章同。\n韵读：歌部一一皮（音婆）、仪（音俄）、仪、为（音讹）。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"相鼠有齿，人而无止。人而无止，不死何俟？","sourceLabel":"第 111-112 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"止，节止，控制嗜欲，使行为合乎礼。吕览《大乐》篇：“必节嗜欲。”高诱注：“节，止也。”王先谦《集疏》：“韩说曰：‘止，节。无礼节也。’说文：‘止，下基也。象草木出有址，故以止为足。’引申之，凡有所自处自禁者皆谓之止。礼《大学》：‘在止于至善。’注：‘止，犹自处也。’淮南《时则训》：‘止狱讼。’注：‘止犹禁也。’是其证。故止训节，而无止为无礼节也。”按止字应作止，诗经中止字古文应分为止、之二字，后世以形近而混。止字甲骨文形近人形之足趾，引申为足，为容止，为留止，为节止，为基止。另一止字应作之，用作指示代词或语末助词。二字意义迥别，不可混淆（参阅于省吾《泽螺居诗经新证》）。\n何，三家诗作“胡”。\n俟，等待。按俟是竢的假借字。说文：“俟，大也。”段注：“此俟之本义也。自经传假为竢字，而俟之本义废矣。立部曰：‘竢，待也。’废竢而用俟，则竢、俟为古今字。”\n韵读：之部一一齿、止、止、俟。","fullText":"止，节止，控制嗜欲，使行为合乎礼。吕览《大乐》篇：“必节嗜欲。”高诱注：“节，止也。”王先谦《集疏》：“韩说曰：‘止，节。无礼节也。’说文：‘止，下基也。象草木出有址，故以止为足。’引申之，凡有所自处自禁者皆谓之止。礼《大学》：‘在止于至善。’注：‘止，犹自处也。’淮南《时则训》：‘止狱讼。’注：‘止犹禁也。’是其证。故止训节，而无止为无礼节也。”按止字应作止，诗经中止字古文应分为止、之二字，后世以形近而混。止字甲骨文形近人形之足趾，引申为足，为容止，为留止，为节止，为基止。另一止字应作之，用作指示代词或语末助词。二字意义迥别，不可混淆（参阅于省吾《泽螺居诗经新证》）。\n何，三家诗作“胡”。\n俟，等待。按俟是竢的假借字。说文：“俟，大也。”段注：“此俟之本义也。自经传假为竢字，而俟之本义废矣。立部曰：‘竢，待也。’废竢而用俟，则竢、俟为古今字。”\n韵读：之部一一齿、止、止、俟。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-005","seg-006","seg-007","seg-008"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"相鼠有体，人而无礼。人而无礼，胡不遄死？","sourceLabel":"第 112 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"体，身体。礼记《礼运》郑注：“言鼠之有身体，如人而无礼者矣。”广雅《释诂》：“体，身也。”毛传训体为“肢体”，似不及郑注“身体”为长。王先谦《集疏》：“首二章皮、齿指一端，此举全体育之。”按首二章威仪、节止都是礼的一个方面，这章总言礼，与以鼠比人的取喻相当。\n胡，三家诗作何。\n遄（chuán），速、快。\n韵读：脂部一一体、礼、礼、死。","fullText":"体，身体。礼记《礼运》郑注：“言鼠之有身体，如人而无礼者矣。”广雅《释诂》：“体，身也。”毛传训体为“肢体”，似不及郑注“身体”为长。王先谦《集疏》：“首二章皮、齿指一端，此举全体育之。”按首二章威仪、节止都是礼的一个方面，这章总言礼，与以鼠比人的取喻相当。\n胡，三家诗作何。\n遄（chuán），速、快。\n韵读：脂部一一体、礼、礼、死。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"preface","layerLabel":"篇序","targetText":"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也","sourceLabel":"第 14 页","attributionLabel":"诗序","sectionLabel":"序","excerpt":"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也","fullText":"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。","sourceLabel":"第 14-15 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。","fullText":"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"相鼠㊟刺無禮也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"相鼠㊟刺無禮也。","fullText":"相鼠㊟刺無禮也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。","fullText":"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集 ng-zhushu-kr1c0004\"]},{\"id\":\"seg-012:3-3:遄\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"遄\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-3\",\"quwanli-quanshi:0002-1:part-3\",\"zhuxi-shijichuan-kr1c0009:0003-1:part-2\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 110-111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。诗人以鼠起兴，讥刺在位者人不如鼠。毛序：“刺无礼也。”这是不错的。在周代，统治阶级定了一套礼，用来欺骗、统治劳动人民，炫耀自己的权威，巩固政权。他们嘴里说礼，实际上的行为是最无耻、最无礼的。人民看透了他们的欺骗性，忍不住满腔怒火，大胆地诅咒他们，诅咒他们为什么不快死。这种大无畏的反抗精神，在那时候是很不容易的，班固《白虎通义》谏诤篇引诗末章四句说：“此妻谏夫之诗也。”这是鲁说，似不足信。\\n孔子曰：“关雎乐而不淫，哀而不伤。”（论语八佾）又礼记《经解》：“温柔敦厚，诗教也。”后儒为了突出诗作为“经”的地位，将其中的作品都纳入封建伦理的轨道，不惜穿凿附会，将三百篇尽视作“乐而不淫，哀而不伤”之诗，即使是一些情辞愤激之作，也经百般曲解，偏要誉以“温柔敦厚”之名。诗中固然有不少含蓄蕴藉之作，但也有一些作品，“以述情切事为快，不尽含蓄也。语荒而曰‘周馀黎民，靡有孑遗’，劝乐而曰‘宛其死矣，他人入室’，讥失仪而曰‘人而无礼，胡不遄死’，怨谤而曰‘豺虎不食’，投畀有昊’……”（王世贞《艺苑卮言》）。如此诗及前面的《鹑之奔奔》，后面的小雅《巷伯》、大雅《云汉》，均为直吐怒骂之作。这些被后人称作“变风”、“变雅”的作品，“具忧世之怀”，“多忧生之意”，“读之当兼得其人之志与遇焉”（刘熙载《诗概》），既有强烈的感染作用，又有深刻的教育意义，故因“变”而更显示出不朽的价值。\",\"fullText\":\"这是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。诗人以鼠起兴，讥刺在位者人不如鼠。毛序：“刺无礼也。”这是不错的。在周代，统治阶级定了一套礼，用来欺骗、统治劳动人民，炫耀自己的权威，巩固政权。他们嘴里说礼，实际上的行为是最无耻、最无礼的。人民看透了他们的欺骗性，忍不住满腔怒火，大胆地诅咒他们，诅咒他们为什么不快死。这种大无畏的反抗精神，在那时候是很不容易的，班固《白虎通义》谏诤篇引诗末章四句说：“此妻谏夫之诗也。”这是鲁说，似不足信。\\n孔子曰：“关雎乐而不淫，哀而不伤。”（论语八佾）又礼记《经解》：“温柔敦厚，诗教也。”后儒为了突出诗作为“经”的地位，将其中的作品都纳入封建伦理的轨道，不惜穿凿附会，将三百篇尽视作“乐而不淫，哀而不伤”之诗，即使是一些情辞愤激之作，也经百般曲解，偏要誉以“温柔敦厚”之名。诗中固然有不少含蓄蕴藉之作，但也有一些作品，“以述情切事为快，不尽含蓄也。语荒而曰‘周馀黎民，靡有孑遗’，劝乐而曰‘宛其死矣，他人入室’，讥失仪而曰‘人而无礼，胡不遄死’，怨谤而曰‘豺虎不食’，投畀有昊’……”（王世贞《艺苑卮言》）。如此诗及前面的《鹑之奔奔》，后面的小雅《巷伯》、大雅《云汉》，均为直吐怒骂之作。这些被后人称作“变风”、“变雅”的作品，“具忧世之怀”，“多忧生之意”，“读之当兼得其人之志与遇焉”（刘熙载《诗概》），既有强烈的感染作用，又有深刻的教育意义，故因“变”而更显示出不朽的价值。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"相，看。毛传：“相，视也。”或说相是地名，相鼠是相地地方的老鼠，恐非诗意。\\n仪，威仪，指可供他人取法的端庄严肃的态度、行为。左传襄公三十一年，卫北宫文子曰：“有威而可畏谓之威，有仪而可象谓之仪。君有君之威仪，其臣畏而爱之，则而象之，故能有其国家，令闻长世。臣有臣之威仪，其下畏而爱之，故能守其官职，保族宜家。顺是以下皆如是，是以上下能相亲也。……故君子在位可畏，施舍可爱，进退可度，周旋可则，容止可观，作事可法，德行可象，声气可乐，动作有文，言语有章，以临其下，谓之有威仪也。”这就是当时人对威仪的内容和作用的解释。\\n何为，即“为何”的倒文，为什么。按这句应作“为何不死”，倒文协韵。鲁诗何作“胡”。下章同。\\n韵读：歌部一一皮（音婆）、仪（音俄）、仪、为（音讹）。\",\"fullText\":\"相，看。毛传：“相，视也。”或说相是地名，相鼠是相地地方的老鼠，恐非诗意。\\n仪，威仪，指可供他人取法的端庄严肃的态度、行为。左传襄公三十一年，卫北宫文子曰：“有威而可畏谓之威，有仪而可象谓之仪。君有君之威仪，其臣畏而爱之，则而象之，故能有其国家，令闻长世。臣有臣之威仪，其下畏而爱之，故能守其官职，保族宜家。顺是以下皆如是，是以上下能相亲也。……故君子在位可畏，施舍可爱，进退可度，周旋可则，容止可观，作事可法，德行可象，声气可乐，动作有文，言语有章，以临其下，谓之有威仪也。”这就是当时人对威仪的内容和作用的解释。\\n何为，即“为何”的倒文，为什么。按这句应作“为何不死”，倒文协韵。鲁诗何作“胡”。下章同。\\n韵读：歌部一一皮（音婆）、仪（音俄）、仪、为（音讹）。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有齿，人而无止。人而无止，不死何俟？\",\"sourceLabel\":\"第 111-112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"止，节止，控制嗜欲，使行为合乎礼。吕览《大乐》篇：“必节嗜欲。”高诱注：“节，止也。”王先谦《集疏》：“韩说曰：‘止，节。无礼节也。’说文：‘止，下基也。象草木出有址，故以止为足。’引申之，凡有所自处自禁者皆谓之止。礼《大学》：‘在止于至善。’注：‘止，犹自处也。’淮南《时则训》：‘止狱讼。’注：‘止犹禁也。’是其证。故止训节，而无止为无礼节也。”按止字应作止，诗经中止字古文应分为止、之二字，后世以形近而混。止字甲骨文形近人形之足趾，引申为足，为容止，为留止，为节止，为基止。另一止字应作之，用作指示代词或语末助词。二字意义迥别，不可混淆（参阅于省吾《泽螺居诗经新证》）。\\n何，三家诗作“胡”。\\n俟，等待。按俟是竢的假借字。说文：“俟，大也。”段注：“此俟之本义也。自经传假为竢字，而俟之本义废矣。立部曰：‘竢，待也。’废竢而用俟，则竢、俟为古今字。”\\n韵读：之部一一齿、止、止、俟。\",\"fullText\":\"止，节止，控制嗜欲，使行为合乎礼。吕览《大乐》篇：“必节嗜欲。”高诱注：“节，止也。”王先谦《集疏》：“韩说曰：‘止，节。无礼节也。’说文：‘止，下基也。象草木出有址，故以止为足。’引申之，凡有所自处自禁者皆谓之止。礼《大学》：‘在止于至善。’注：‘止，犹自处也。’淮南《时则训》：‘止狱讼。’注：‘止犹禁也。’是其证。故止训节，而无止为无礼节也。”按止字应作止，诗经中止字古文应分为止、之二字，后世以形近而混。止字甲骨文形近人形之足趾，引申为足，为容止，为留止，为节止，为基止。另一止字应作之，用作指示代词或语末助词。二字意义迥别，不可混淆（参阅于省吾《泽螺居诗经新证》）。\\n何，三家诗作“胡”。\\n俟，等待。按俟是竢的假借字。说文：“俟，大也。”段注：“此俟之本义也。自经传假为竢字，而俟之本义废矣。立部曰：‘竢，待也。’废竢而用俟，则竢、俟为古今字。”\\n韵读：之部一一齿、止、止、俟。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"体，身体。礼记《礼运》郑注：“言鼠之有身体，如人而无礼者矣。”广雅《释诂》：“体，身也。”毛传训体为“肢体”，似不及郑注“身体”为长。王先谦《集疏》：“首二章皮、齿指一端，此举全体育之。”按首二章威仪、节止都是礼的一个方面，这章总言礼，与以鼠比人的取喻相当。\\n胡，三家诗作何。\\n遄（chuán），速、快。\\n韵读：脂部一一体、礼、礼、死。\",\"fullText\":\"体，身体。礼记《礼运》郑注：“言鼠之有身体，如人而无礼者矣。”广雅《释诂》：“体，身也。”毛传训体为“肢体”，似不及郑注“身体”为长。王先谦《集疏》：“首二章皮、齿指一端，此举全体育之。”按首二章威仪、节止都是礼的一个方面，这章总言礼，与以鼠比人的取喻相当。\\n胡，三家诗作何。\\n遄（chuán），速、快。\\n韵读：脂部一一体、礼、礼、死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":\"第 14 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"fullText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"sourceLabel\":\"第 14-15 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"fullText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"相鼠㊟刺無禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"相鼠㊟刺無禮也。\",\"fullText\":\"相鼠㊟刺無禮也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。\",\"fullText\":\"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。\",\"fullText\":\"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻皮四支。儀、爲並同。本韻。齒四紙。止、俟並同。本韻。體八薺。禮同。死四紙。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻皮四支。儀、爲並同。本韻。齒四紙。止、俟並同。本韻。體八薺。禮同。死四紙。通韻。\",\"fullText\":\"標韻皮四支。儀、爲並同。本韻。齒四紙。止、俟並同。本韻。體八薺。禮同。死四紙。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《相鼠》，刺無禮也。\",\"fullText\":\"序：《相鼠》，刺無禮也。衛文公能正其羣臣，而刺在位承先君之化無禮儀也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"secti eText\":\"何爲\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"zhuxi-shijichuan-kr1c0009:0001-1:part-3\"],\"materialIds\":[\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-006:4-4:止\",\"segmentId\":\"seg-006\",\"segmentOrder\":6,\"surfaceText\":\"止\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"quwanli-quanshi:0002-1:part-2\",\"zhuxi-shijichuan-kr1c0009:0002-1:part-1\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-007:4-4:止\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"止\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0003-1:part-1\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\"]},{\"id\":\"seg-008:4-4:俟\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"俟\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"zhuxi-shijichuan-kr1c0009:0002-1:part-2\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\",\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-009:4-4:體\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"體\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"zhuxi-shijichuan-kr1c0009:0003-1:part-1\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\",\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-010:3-4:無禮\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"無禮\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-2\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\"]},{\"id\":\"seg-012:3-3:遄\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"遄\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-3\",\"quwanli-quanshi:0002-1:part-3\",\"zhuxi-shijichuan-kr1c0009:0003-1:part-2\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 110-111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。诗人以鼠起兴，讥刺在位者人不如鼠。毛序：“刺无礼也。”这是不错的。在周代，统治阶级定了一套礼，用来欺骗、统治劳动人民，炫耀自己的权威，巩固政权。他们嘴里说礼，实际上的行为是最无耻、最无礼的。人民看透了他们的欺骗性，忍不住满腔怒火，大胆地诅咒他们，诅咒他们为什么不快死。这种大无畏的反抗精神，在那时候是很不容易的，班固《白虎通义》谏诤篇引诗末章四句说：“此妻谏夫之诗也。”这是鲁说，似不足信。\\n孔子曰：“关雎乐而不淫，哀而不伤。”（论语八佾）又礼记《经解》：“温柔敦厚，诗教也。”后儒为了突出诗作为“经”的地位，将其中的作品都纳入封建伦理的轨道，不惜穿凿附会，将三百篇尽视作“乐而不淫，哀而不伤”之诗，即使是一些情辞愤激之作，也经百般曲解，偏要誉以“温柔敦厚”之名。诗中固然有不少含蓄蕴藉之作，但也有一些作品，“以述情切事为快，不尽含蓄也。语荒而曰‘周馀黎民，靡有孑遗’，劝乐而曰‘宛其死矣，他人入室’，讥失仪而曰‘人而无礼，胡不遄死’，怨谤而曰‘豺虎不食’，投畀有昊’……”（王世贞《艺苑卮言》）。如此诗及前面的《鹑之奔奔》，后面的小雅《巷伯》、大雅《云汉》，均为直吐怒骂之作。这些被后人称作“变风”、“变雅”的作品，“具忧世之怀”，“多忧生之意”，“读之当兼得其人之志与遇焉”（刘熙载《诗概》），既有强烈的感染作用，又有深刻的教育意义，故因“变”而更显示出不朽的价值。\",\"fullText\":\"这是人民斥责卫国统治阶级苟且偷安、暗昧无耻的诗。诗人以鼠起兴，讥刺在位者人不如鼠。毛序：“刺无礼也。”这是不错的。在周代，统治阶级定了一套礼，用来欺骗、统治劳动人民，炫耀自己的权威，巩固政权。他们嘴里说礼，实际上的行为是最无耻、最无礼的。人民看透了他们的欺骗性，忍不住满腔怒火，大胆地诅咒他们，诅咒他们为什么不快死。这种大无畏的反抗精神，在那时候是很不容易的，班固《白虎通义》谏诤篇引诗末章四句说：“此妻谏夫之诗也。”这是鲁说，似不足信。\\n孔子曰：“关雎乐而不淫，哀而不伤。”（论语八佾）又礼记《经解》：“温柔敦厚，诗教也。”后儒为了突出诗作为“经”的地位，将其中的作品都纳入封建伦理的轨道，不惜穿凿附会，将三百篇尽视作“乐而不淫，哀而不伤”之诗，即使是一些情辞愤激之作，也经百般曲解，偏要誉以“温柔敦厚”之名。诗中固然有不少含蓄蕴藉之作，但也有一些作品，“以述情切事为快，不尽含蓄也。语荒而曰‘周馀黎民，靡有孑遗’，劝乐而曰‘宛其死矣，他人入室’，讥失仪而曰‘人而无礼，胡不遄死’，怨谤而曰‘豺虎不食’，投畀有昊’……”（王世贞《艺苑卮言》）。如此诗及前面的《鹑之奔奔》，后面的小雅《巷伯》、大雅《云汉》，均为直吐怒骂之作。这些被后人称作“变风”、“变雅”的作品，“具忧世之怀”，“多忧生之意”，“读之当兼得其人之志与遇焉”（刘熙载《诗概》），既有强烈的感染作用，又有深刻的教育意义，故因“变”而更显示出不朽的价值。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而无仪。人而无仪，不死何为？\",\"sourceLabel\":\"第 111 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"相，看。毛传：“相，视也。”或说相是地名，相鼠是相地地方的老鼠，恐非诗意。\\n仪，威仪，指可供他人取法的端庄严肃的态度、行为。左传襄公三十一年，卫北宫文子曰：“有威而可畏谓之威，有仪而可象谓之仪。君有君之威仪，其臣畏而爱之，则而象之，故能有其国家，令闻长世。臣有臣之威仪，其下畏而爱之，故能守其官职，保族宜家。顺是以下皆如是，是以上下能相亲也。……故君子在位可畏，施舍可爱，进退可度，周旋可则，容止可观，作事可法，德行可象，声气可乐，动作有文，言语有章，以临其下，谓之有威仪也。”这就是当时人对威仪的内容和作用的解释。\\n何为，即“为何”的倒文，为什么。按这句应作“为何不死”，倒文协韵。鲁诗何作“胡”。下章同。\\n韵读：歌部一一皮（音婆）、仪（音俄）、仪、为（音讹）。\",\"fullText\":\"相，看。毛传：“相，视也。”或说相是地名，相鼠是相地地方的老鼠，恐非诗意。\\n仪，威仪，指可供他人取法的端庄严肃的态度、行为。左传襄公三十一年，卫北宫文子曰：“有威而可畏谓之威，有仪而可象谓之仪。君有君之威仪，其臣畏而爱之，则而象之，故能有其国家，令闻长世。臣有臣之威仪，其下畏而爱之，故能守其官职，保族宜家。顺是以下皆如是，是以上下能相亲也。……故君子在位可畏，施舍可爱，进退可度，周旋可则，容止可观，作事可法，德行可象，声气可乐，动作有文，言语有章，以临其下，谓之有威仪也。”这就是当时人对威仪的内容和作用的解释。\\n何为，即“为何”的倒文，为什么。按这句应作“为何不死”，倒文协韵。鲁诗何作“胡”。下章同。\\n韵读：歌部一一皮（音婆）、仪（音俄）、仪、为（音讹）。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有齿，人而无止。人而无止，不死何俟？\",\"sourceLabel\":\"第 111-112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"止，节止，控制嗜欲，使行为合乎礼。吕览《大乐》篇：“必节嗜欲。”高诱注：“节，止也。”王先谦《集疏》：“韩说曰：‘止，节。无礼节也。’说文：‘止，下基也。象草木出有址，故以止为足。’引申之，凡有所自处自禁者皆谓之止。礼《大学》：‘在止于至善。’注：‘止，犹自处也。’淮南《时则训》：‘止狱讼。’注：‘止犹禁也。’是其证。故止训节，而无止为无礼节也。”按止字应作止，诗经中止字古文应分为止、之二字，后世以形近而混。止字甲骨文形近人形之足趾，引申为足，为容止，为留止，为节止，为基止。另一止字应作之，用作指示代词或语末助词。二字意义迥别，不可混淆（参阅于省吾《泽螺居诗经新证》）。\\n何，三家诗作“胡”。\\n俟，等待。按俟是竢的假借字。说文：“俟，大也。”段注：“此俟之本义也。自经传假为竢字，而俟之本义废矣。立部曰：‘竢，待也。’废竢而用俟，则竢、俟为古今字。”\\n韵读：之部一一齿、止、止、俟。\",\"fullText\":\"止，节止，控制嗜欲，使行为合乎礼。吕览《大乐》篇：“必节嗜欲。”高诱注：“节，止也。”王先谦《集疏》：“韩说曰：‘止，节。无礼节也。’说文：‘止，下基也。象草木出有址，故以止为足。’引申之，凡有所自处自禁者皆谓之止。礼《大学》：‘在止于至善。’注：‘止，犹自处也。’淮南《时则训》：‘止狱讼。’注：‘止犹禁也。’是其证。故止训节，而无止为无礼节也。”按止字应作止，诗经中止字古文应分为止、之二字，后世以形近而混。止字甲骨文形近人形之足趾，引申为足，为容止，为留止，为节止，为基止。另一止字应作之，用作指示代词或语末助词。二字意义迥别，不可混淆（参阅于省吾《泽螺居诗经新证》）。\\n何，三家诗作“胡”。\\n俟，等待。按俟是竢的假借字。说文：“俟，大也。”段注：“此俟之本义也。自经传假为竢字，而俟之本义废矣。立部曰：‘竢，待也。’废竢而用俟，则竢、俟为古今字。”\\n韵读：之部一一齿、止、止、俟。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有体，人而无礼。人而无礼，胡不遄死？\",\"sourceLabel\":\"第 112 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"体，身体。礼记《礼运》郑注：“言鼠之有身体，如人而无礼者矣。”广雅《释诂》：“体，身也。”毛传训体为“肢体”，似不及郑注“身体”为长。王先谦《集疏》：“首二章皮、齿指一端，此举全体育之。”按首二章威仪、节止都是礼的一个方面，这章总言礼，与以鼠比人的取喻相当。\\n胡，三家诗作何。\\n遄（chuán），速、快。\\n韵读：脂部一一体、礼、礼、死。\",\"fullText\":\"体，身体。礼记《礼运》郑注：“言鼠之有身体，如人而无礼者矣。”广雅《释诂》：“体，身也。”毛传训体为“肢体”，似不及郑注“身体”为长。王先谦《集疏》：“首二章皮、齿指一端，此举全体育之。”按首二章威仪、节止都是礼的一个方面，这章总言礼，与以鼠比人的取喻相当。\\n胡，三家诗作何。\\n遄（chuán），速、快。\\n韵读：脂部一一体、礼、礼、死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"sourceLabel\":\"第 14 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"fullText\":\"相鼠刺無禮也衛文公能正其羣臣而刺在位承先君之化無禮儀也\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"sourceLabel\":\"第 14-15 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"fullText\":\"相鼠有皮，人而無儀。人而無儀，不死何爲。相鼠有齒，人而無止。人而無止，不死何俟。相鼠有體，人而無禮。人而無禮，胡不遄死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"相鼠㊟刺無禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"相鼠㊟刺無禮也。\",\"fullText\":\"相鼠㊟刺無禮也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。\",\"fullText\":\"右《相鼠》三章，章四句。《序》以爲「刺無禮」，諸家皆然。唯舊説多云鼠尚有皮，人而無儀，則鼠之不若。以人之儀喻鼠之皮，則未免輕視禮儀，獸皮之不若矣。夫麟鳳尚有威儀，龍馬必多精神。人之所以異於禽獸者，禮義以制心，威儀以飭躬也。倘去此威儀禮義而不之檢，則是卑污賤惡，不過如鼠之徒，有其皮與齒以成其體而已矣。雖欲求爲禽獸之長而不可得，況人也乎？夫人也而禽獸之不若，則何以自立於天地之間？固不如速死之爲愈耳。若此解詩，語意方能圓到。或又謂此衛文公訓誥臣民之辭，亦頗近是，存之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。\",\"fullText\":\"集釋鼠蟲之可賤惡者。〔陸氏佃曰〕今一種鼠，見人則交其前兩足而拱，謂之禮鼠，亦或謂之拱鼠。〔吕氏祖謙曰〕韓愈《聯句》云：「禮鼠拱而立。」止容止也。遄速也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/052-xiang-shu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contr
