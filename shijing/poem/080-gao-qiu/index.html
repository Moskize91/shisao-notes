":[]}]}]},"materials":[{"id":"chenhuan-chuanshu","title":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"glossCount":1,"partCount":1},{"id":"wangli-yundu","title":"詩經韻讀","contributorLine":"现代 · 王力","publicationYear":1980,"glossCount":3,"partCount":3},{"id":"quwanli-quanshi","title":"詩經詮釋","contributorLine":"现代 · 屈萬里","publicationYear":1983,"glossCount":14,"partCount":14},{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"maruichen-tongshi","title":"毛詩傳箋通釋","contributorLine":"清 · 馬瑞辰","publicationYear":1989,"glossCount":1,"partCount":1},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":6,"glossCount":24,"anchoredPartCount":1,"overviewPartCount":1},"overview":{"prefaceEntryIds":[],"globalEntryIds":["quwanli-quanshi:0001-1:part-1"]},"focusAnchors":[{"id":"seg-012:1-3:邦之彥","segmentId":"seg-012","segmentOrder":12,"surfaceText":"邦之彥","charStart":1,"charEnd":3,"entryIds":["maruichen-tongshi:0001-1:part-1"],"materialIds":["maruichen-tongshi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/080-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹饰，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。","sourceLabel":"第 180-181 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是赞美郑国一位官吏的诗。毛序：“刺朝也。言古之君子，以风其朝焉。”但是我们分析诗意，并没有讽刺的味道。如果一定要以“陈古刺今”为理由将其纳入刺诗，那么任何赞颂诗都可以算是“刺诗”了，这显然是站不住脚的。朱熹诗集传说：“盖美其大夫之词，然不知其所指矣。”是很客观的。郑国较小，处于晋楚两个大国之间。子皮、子产相继执政，使郑国数十年对外免除了战争之患；对内由于实行“丘赋”，国家也渐趋富强，所以人民对执政的官员比较满意。左传昭公十六年：“郑六卿饯韩宣子于郊，子产赋郑之羔裘。宣子曰：‘起不堪也。’”可见这首诗在当时已广泛地流行于郑国的朝野。\n这首诗在艺术上没有什么突出的地方，不过诗中“舍命不渝”和“孔武有力”两句一直被人引用，已经成为汉语中的两个成语。可见诗经语言的表达力，无论是捕捉形象的概括集中，还是描绘人物的生动准确，都已经达到相当高的程度。所以几千年之下，它仍然具有生命力。\n羔裘如濡，洵直且侯。彼其之子，舍命不渝。\n羔裘，当时大夫等级官员穿的衣服。\n如，同“而”。\n濡（rú），滋润而有光辉。\n洵，确实。韩诗作侚，是正字。\n直，顺直。\n侯，美。毛传训侯为“君”，左传昭公元年：“楚公子美矣，君哉。”古字训“君”者多有美义。按诗人赞美羔裘光润顺直的美丽，实际上是赞美穿它的人正直德美。\n舍，舍弃。\n渝，变。韩诗渝作愉，渝古音如偷，愉即渝的假借字。此句意为，当国家有危难时，能舍弃生命而不变节。\n韵读：侯部——濡（汝蓝反）、侯、渝（喻蓝反）。\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\n豹饰，用豹作羔裘袖子边缘的装饰。管子按度：“卿大夫豹饰。”\n孔，甚、很。\n孔武有力，诗人借赞美豹子来赞美大夫的威武而有力量。\n司直，官名。掌管劝谏君主过失。马瑞辰通释：“司，主也。直，正也。正其过阙也。……上章云‘洵直且侯’，是君子之处己以直。此章‘邦之司直’，是言君子之能直人也。”\n韵读：之部——饰、力、子、直。\n羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\n晏，本义为天清，引申为柔暖貌。尔雅：“晏晏、温温，柔也。”\n三英，即上章的豹饰。豹皮镶在袖口上，有三排装饰。\n粲，鲜明貌。\n彦，俊杰。毛传：“彦，士之美称。”据闻一多说，彦、宪古通。邦之彦，犹云邦之法则、邦之仪表，即今“模范”的意思。亦通。\n韵读：元部——晏、粲、彦。","fullText":"这是赞美郑国一位官吏的诗。毛序：“刺朝也。言古之君子，以风其朝焉。”但是我们分析诗意，并没有讽刺的味道。如果一定要以“陈古刺今”为理由将其纳入刺诗，那么任何赞颂诗都可以算是“刺诗”了，这显然是站不住脚的。朱熹诗集传说：“盖美其大夫之词，然不知其所指矣。”是很客观的。郑国较小，处于晋楚两个大国之间。子皮、子产相继执政，使郑国数十年对外免除了战争之患；对内由于实行“丘赋”，国家也渐趋富强，所以人民对执政的官员比较满意。左传昭公十六年：“郑六卿饯韩宣子于郊，子产赋郑之羔裘。宣子曰：‘起不堪也。’”可见这首诗在当时已广泛地流行于郑国的朝野。\n这首诗在艺术上没有什么突出的地方，不过诗中“舍命不渝”和“孔武有力”两句一直被人引用，已经成为汉语中的两个成语。可见诗经语言的表达力，无论是捕捉形象的概括集中，还是描绘人物的生动准确，都已经达到相当高的程度。所以几千年之下，它仍然具有生命力。\n羔裘如濡，洵直且侯。彼其之子，舍命不渝。\n羔裘，当时大夫等级官员穿的衣服。\n如，同“而”。\n濡（rú），滋润而有光辉。\n洵，确实。韩诗作侚，是正字。\n直，顺直。\n侯，美。毛传训侯为“君”，左传昭公元年：“楚公子美矣，君哉。”古字训“君”者多有美义。按诗人赞美羔裘光润顺直的美丽，实际上是赞美穿它的人正直德美。\n舍，舍弃。\n渝，变。韩诗渝作愉，渝古音如偷，愉即渝的假借字。此句意为，当国家有危难时，能舍弃生命而不变节。\n韵读：侯部——濡（汝蓝反）、侯、渝（喻蓝反）。\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\n豹饰，用豹作羔裘袖子边缘的装饰。管子按度：“卿大夫豹饰。”\n孔，甚、很。\n孔武有力，诗人借赞美豹子来赞美大夫的威武而有力量。\n司直，官名。掌管劝谏君主过失。马瑞辰通释：“司，主也。直，正也。正其过阙也。……上章云‘洵直且侯’，是君子之处己以直。此章‘邦之司直’，是言君子之能直人也。”\n韵读：之部——饰、力、子、直。\n羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\n晏，本义为天清，引申为柔暖貌。尔雅：“晏晏、温温，柔也。”\n三英，即上章的豹饰。豹皮镶在袖口上，有三排装饰。\n粲，鲜明貌。\n彦，俊杰。毛传：“彦，士之美称。”据闻一多说，彦、宪古通。邦之彦，犹云邦之法则、邦之仪表，即今“模范”的意思。亦通。\n韵读：元部——晏、粲、彦。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/080-gao-qiu/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹飾，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。","sourceLabel":"第 90-92 页","attributionLabel":"陈奂","sectionLabel":"经文","excerpt":"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹飾，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。","fullText":"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹飾，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"美鄭大夫也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"美鄭大夫也。","fullText":"美鄭大夫也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？","fullText":"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。","fullText":"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"濡七虞。侯十一尤，叶洪鈎反。渝七虞。叶韻。飾十三職。力、直並同。本韻。晏十六諫。粲十五翰。彦十七霰。通韻。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"标韵","excerpt":"濡七虞。侯十一尤，叶洪鈎反。渝七虞。叶韻。飾十三職。力、直並同。本韻。晏十六諫。粲十五翰。彦十七霰。通韻。","fullText":"濡七虞。侯十一尤，叶洪鈎反。渝七虞。叶韻。飾十三職。力、直並同。本韻。晏十六諫。粲十五翰。彦十七霰。通韻。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"m i-quanshi:0014-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"邦\",\"anchorIds\":[\"seg-012:1-3:邦之彥\"]},{\"index\":2,\"text\":\"之\",\"anchorIds\":[\"seg-012:1-3:邦之彥\"]},{\"index\":3,\"text\":\"彥\",\"anchorIds\":[\"seg-012:1-3:邦之彥\"]},{\"index\":4,\"text\":\"兮\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":14,\"partCount\":14},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"maruichen-tongshi\",\"title\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":24,\"anchoredPartCount\":1,\"overviewPartCount\":1},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-012:1-3:邦之彥\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"邦之彥\",\"charStart\":1,\"charEnd\":3,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹饰，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\",\"sourceLabel\":\"第 180-181 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是赞美郑国一位官吏的诗。毛序：“刺朝也。言古之君子，以风其朝焉。”但是我们分析诗意，并没有讽刺的味道。如果一定要以“陈古刺今”为理由将其纳入刺诗，那么任何赞颂诗都可以算是“刺诗”了，这显然是站不住脚的。朱熹诗集传说：“盖美其大夫之词，然不知其所指矣。”是很客观的。郑国较小，处于晋楚两个大国之间。子皮、子产相继执政，使郑国数十年对外免除了战争之患；对内由于实行“丘赋”，国家也渐趋富强，所以人民对执政的官员比较满意。左传昭公十六年：“郑六卿饯韩宣子于郊，子产赋郑之羔裘。宣子曰：‘起不堪也。’”可见这首诗在当时已广泛地流行于郑国的朝野。\\n这首诗在艺术上没有什么突出的地方，不过诗中“舍命不渝”和“孔武有力”两句一直被人引用，已经成为汉语中的两个成语。可见诗经语言的表达力，无论是捕捉形象的概括集中，还是描绘人物的生动准确，都已经达到相当高的程度。所以几千年之下，它仍然具有生命力。\\n羔裘如濡，洵直且侯。彼其之子，舍命不渝。\\n羔裘，当时大夫等级官员穿的衣服。\\n如，同“而”。\\n濡（rú），滋润而有光辉。\\n洵，确实。韩诗作侚，是正字。\\n直，顺直。\\n侯，美。毛传训侯为“君”，左传昭公元年：“楚公子美矣，君哉。”古字训“君”者多有美义。按诗人赞美羔裘光润顺直的美丽，实际上是赞美穿它的人正直德美。\\n舍，舍弃。\\n渝，变。韩诗渝作愉，渝古音如偷，愉即渝的假借字。此句意为，当国家有危难时，能舍弃生命而不变节。\\n韵读：侯部——濡（汝蓝反）、侯、渝（喻蓝反）。\\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\\n豹饰，用豹作羔裘袖子边缘的装饰。管子按度：“卿大夫豹饰。”\\n孔，甚、很。\\n孔武有力，诗人借赞美豹子来赞美大夫的威武而有力量。\\n司直，官名。掌管劝谏君主过失。马瑞辰通释：“司，主也。直，正也。正其过阙也。……上章云‘洵直且侯’，是君子之处己以直。此章‘邦之司直’，是言君子之能直人也。”\\n韵读：之部——饰、力、子、直。\\n羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\\n晏，本义为天清，引申为柔暖貌。尔雅：“晏晏、温温，柔也。”\\n三英，即上章的豹饰。豹皮镶在袖口上，有三排装饰。\\n粲，鲜明貌。\\n彦，俊杰。毛传：“彦，士之美称。”据闻一多说，彦、宪古通。邦之彦，犹云邦之法则、邦之仪表，即今“模范”的意思。亦通。\\n韵读：元部——晏、粲、彦。\",\"fullText\":\"这是赞美郑国一位官吏的诗。毛序：“刺朝也。言古之君子，以风其朝焉。”但是我们分析诗意，并没有讽刺的味道。如果一定要以“陈古刺今”为理由将其纳入刺诗，那么任何赞颂诗都可以算是“刺诗”了，这显然是站不住脚的。朱熹诗集传说：“盖美其大夫之词，然不知其所指矣。”是很客观的。郑国较小，处于晋楚两个大国之间。子皮、子产相继执政，使郑国数十年对外免除了战争之患；对内由于实行“丘赋”，国家也渐趋富强，所以人民对执政的官员比较满意。左传昭公十六年：“郑六卿饯韩宣子于郊，子产赋郑之羔裘。宣子曰：‘起不堪也。’”可见这首诗在当时已广泛地流行于郑国的朝野。\\n这首诗在艺术上没有什么突出的地方，不过诗中“舍命不渝”和“孔武有力”两句一直被人引用，已经成为汉语中的两个成语。可见诗经语言的表达力，无论是捕捉形象的概括集中，还是描绘人物的生动准确，都已经达到相当高的程度。所以几千年之下，它仍然具有生命力。\\n羔裘如濡，洵直且侯。彼其之子，舍命不渝。\\n羔裘，当时大夫等级官员穿的衣服。\\n如，同“而”。\\n濡（rú），滋润而有光辉。\\n洵，确实。韩诗作侚，是正字。\\n直，顺直。\\n侯，美。毛传训侯为“君”，左传昭公元年：“楚公子美矣，君哉。”古字训“君”者多有美义。按诗人赞美羔裘光润顺直的美丽，实际上是赞美穿它的人正直德美。\\n舍，舍弃。\\n渝，变。韩诗渝作愉，渝古音如偷，愉即渝的假借字。此句意为，当国家有危难时，能舍弃生命而不变节。\\n韵读：侯部——濡（汝蓝反）、侯、渝（喻蓝反）。\\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\\n豹饰，用豹作羔裘袖子边缘的装饰。管子按度：“卿大夫豹饰。”\\n孔，甚、很。\\n孔武有力，诗人借赞美豹子来赞美大夫的威武而有力量。\\n司直，官名。掌管劝谏君主过失。马瑞辰通释：“司，主也。直，正也 0002-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？\",\"fullText\":\"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》 chorIds\":[]}]},{\"id\":\"seg-012\",\"order\":12,\"text\":\"邦之彥兮\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"maruichen-tongshi:0001-1:part-1\",\"quwanli-quanshi:0014-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"邦\",\"anchorIds\":[\"seg-012:1-3:邦之彥\"]},{\"index\":2,\"text\":\"之\",\"anchorIds\":[\"seg-012:1-3:邦之彥\"]},{\"index\":3,\"text\":\"彥\",\"anchorIds\":[\"seg-012:1-3:邦之彥\"]},{\"index\":4,\"text\":\"兮\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":14,\"partCount\":14},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"maruichen-tongshi\",\"title\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":24,\"anchoredPartCount\":1,\"overviewPartCount\":1},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-012:1-3:邦之彥\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"邦之彥\",\"charStart\":1,\"charEnd\":3,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹饰，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\",\"sourceLabel\":\"第 180-181 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是赞美郑国一位官吏的诗。毛序：“刺朝也。言古之君子，以风其朝焉。”但是我们分析诗意，并没有讽刺的味道。如果一定要以“陈古刺今”为理由将其纳入刺诗，那么任何赞颂诗都可以算是“刺诗”了，这显然是站不住脚的。朱熹诗集传说：“盖美其大夫之词，然不知其所指矣。”是很客观的。郑国较小，处于晋楚两个大国之间。子皮、子产相继执政，使郑国数十年对外免除了战争之患；对内由于实行“丘赋”，国家也渐趋富强，所以人民对执政的官员比较满意。左传昭公十六年：“郑六卿饯韩宣子于郊，子产赋郑之羔裘。宣子曰：‘起不堪也。’”可见这首诗在当时已广泛地流行于郑国的朝野。\\n这首诗在艺术上没有什么突出的地方，不过诗中“舍命不渝”和“孔武有力”两句一直被人引用，已经成为汉语中的两个成语。可见诗经语言的表达力，无论是捕捉形象的概括集中，还是描绘人物的生动准确，都已经达到相当高的程度。所以几千年之下，它仍然具有生命力。\\n羔裘如濡，洵直且侯。彼其之子，舍命不渝。\\n羔裘，当时大夫等级官员穿的衣服。\\n如，同“而”。\\n濡（rú），滋润而有光辉。\\n洵，确实。韩诗作侚，是正字。\\n直，顺直。\\n侯，美。毛传训侯为“君”，左传昭公元年：“楚公子美矣，君哉。”古字训“君”者多有美义。按诗人赞美羔裘光润顺直的美丽，实际上是赞美穿它的人正直德美。\\n舍，舍弃。\\n渝，变。韩诗渝作愉，渝古音如偷，愉即渝的假借字。此句意为，当国家有危难时，能舍弃生命而不变节。\\n韵读：侯部——濡（汝蓝反）、侯、渝（喻蓝反）。\\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\\n豹饰，用豹作羔裘袖子边缘的装饰。管子按度：“卿大夫豹饰。”\\n孔，甚、很。\\n孔武有力，诗人借赞美豹子来赞美大夫的威武而有力量。\\n司直，官名。掌管劝谏君主过失。马瑞辰通释：“司，主也。直，正也。正其过阙也。……上章云‘洵直且侯’，是君子之处己以直。此章‘邦之司直’，是言君子之能直人也。”\\n韵读：之部——饰、力、子、直。\\n羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\\n晏，本义为天清，引申为柔暖貌。尔雅：“晏晏、温温，柔也。”\\n三英，即上章的豹饰。豹皮镶在袖口上，有三排装饰。\\n粲，鲜明貌。\\n彦，俊杰。毛传：“彦，士之美称。”据闻一多说，彦、宪古通。邦之彦，犹云邦之法则、邦之仪表，即今“模范”的意思。亦通。\\n韵读：元部——晏、粲、彦。\",\"fullText\":\"这是赞美郑国一位官吏的诗。毛序：“刺朝也。言古之君子，以风其朝焉。”但是我们分析诗意，并没有讽刺的味道。如果一定要以“陈古刺今”为理由将其纳入刺诗，那么任何赞颂诗都可以算是“刺诗”了，这显然是站不住脚的。朱熹诗集传说：“盖美其大夫之词，然不知其所指矣。”是很客观的。郑国较小，处于晋楚两个大国之间。子皮、子产相继执政，使郑国数十年对外免除了战争之患；对内由于实行“丘赋”，国家也渐趋富强，所以人民对执政的官员比较满意。左传昭公十六年：“郑六卿饯韩宣子于郊，子产赋郑之羔裘。宣子曰：‘起不堪也。’”可见这首诗在当时已广泛地流行于郑国的朝野。\\n这首诗在艺术上没有什么突出的地方，不过诗中“舍命不渝”和“孔武有力”两句一直被人引用，已经成为汉语中的两个成语。可见诗经语言的表达力，无论是捕捉形象的概括集中，还是描绘人物的生动准确，都已经达到相当高的程度。所以几千年之下，它仍然具有生命力。\\n羔裘如濡，洵直且侯。彼其之子，舍命不渝。\\n羔裘，当时大夫等级官员穿的衣服。\\n如，同“而”。\\n濡（rú），滋润而有光辉。\\n洵，确实。韩诗作侚，是正字。\\n直，顺直。\\n侯，美。毛传训侯为“君”，左传昭公元年：“楚公子美矣，君哉。”古字训“君”者多有美义。按诗人赞美羔裘光润顺直的美丽，实际上是赞美穿它的人正直德美。\\n舍，舍弃。\\n渝，变。韩诗渝作愉，渝古音如偷，愉即渝的假借字。此句意为，当国家有危难时，能舍弃生命而不变节。\\n韵读：侯部——濡（汝蓝反）、侯、渝（喻蓝反）。\\n羔裘豹饰，孔武有力。彼其之子，邦之司直。\\n豹饰，用豹作羔裘袖子边缘的装饰。管子按度：“卿大夫豹饰。”\\n孔，甚、很。\\n孔武有力，诗人借赞美豹子来赞美大夫的威武而有力量。\\n司直，官名。掌管劝谏君主过失。马瑞辰通释：“司，主也。直，正也。正其过阙也。……上章云‘洵直且侯’，是君子之处己以直。此章‘邦之司直’，是言君子之能直人也。”\\n韵读：之部——饰、力、子、直。\\n羔裘晏兮，三英粲兮。彼其之子，邦之彦兮。\\n晏，本义为天清，引申为柔暖貌。尔雅：“晏晏、温温，柔也。”\\n三英，即上章的豹饰。豹皮镶在袖口上，有三排装饰。\\n粲，鲜明貌。\\n彦，俊杰。毛传：“彦，士之美称。”据闻一多说，彦、宪古通。邦之彦，犹云邦之法则、邦之仪表，即今“模范”的意思。亦通。\\n韵读：元部——晏、粲、彦。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹飾，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。\",\"sourceLabel\":\"第 90-92 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹飾，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。\",\"fullText\":\"羔裘如濡，洵直且侯。彼其之子，舍命不渝。羔裘豹飾，孔武有力。彼其之子，邦之司直。羔裘晏兮，三英粲兮。彼其之子，邦之彥兮。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"美鄭大夫也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"美鄭大夫也。\",\"fullText\":\"美鄭大夫也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？\",\"fullText\":\"右《羔裘》三章，章四句。《序》以爲「刺朝」，陳古以風今也。《辯説》謂詩意恐未必然，當時鄭之大夫如子皮、子産之徒，豈無可以當此詩者？但今不可考耳。愚謂此詩非專美一人，必當時盈廷碩彦濟美一時，或則順命以持躬，或則忠鯁而事上，或則儒雅以聲稱，皆能正己以正人，不媿朝服以章身。故詩人即其服飾之盛，以想其德誼經濟文章之美，而咏歎之如此。曰「舍命不渝」者，君子安命，雖臨利害而不變也。曰「邦之司直」者，大臣剛毅有力，獨能主持國是而不摇也。曰「邦之彦兮」者，學士文采高標，足以黼黻猷爲而極一時之選也。有此數臣，國勢雖孱，人材實裕，故可以特立晉、楚大國之間而不致敗。此鄭之所以爲鄭也。不然，詩人縱極陳古以風今，亦何與於當時時務之要歟？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。\",\"fullText\":\"羔裘大夫服也。如濡潤澤也。侯美也。〔姚氏際恒曰〕此即諸侯之侯。當時稱諸侯亦取美義也。舍處也。渝變也。飾〔《集傳》〕飾，緣袖也。禮，君用純物，臣下之。故羔裘而以豹皮爲飾也。孔甚也。晏鮮盛也。三英裘飾也。彦士之美稱。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"濡七虞。侯十一尤，叶洪鈎反。渝七虞。叶韻。飾十三職。力、直並同。本韻。晏十六諫。粲十五翰。彦十七霰。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"濡七虞。侯十一尤，叶洪鈎反。渝七虞。叶韻。飾十三職。力、直並同。本韻。晏十六諫。粲十五翰。彦十七霰。通韻。\",\"fullText\":\"濡七虞。侯十一尤，叶洪鈎反。渝七虞。叶韻。飾十三職。力、直並同。本韻。晏十六諫。粲十五翰。彦十七霰。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"邦之彥兮\",\"sourceLabel\":\"第 376 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"邦之彥\",\"fullText\":\"邦之彥\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-012:1-3:邦之彥\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-012\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/080-gao-qiu/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"material
