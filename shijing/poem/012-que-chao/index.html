llText\":\"末章以“盈”“成”收束全篇，方玉润据此强调婚礼既盛且成，既可见媵从充盈、室家辉煌，也可见祝其多男、肯堂肯构的意味。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-010:3-3:盈\",\"seg-012:3-3:成\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"維鵲有巢，維鳩盈之。之子于歸，百兩成之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":null,\"excerpt\":\"方玉润据此强调婚礼既盛且成，\",\"fullText\":\"末章以“盈”“成”收束全篇，方玉润据此强调婚礼既盛且成，既可见媵从充盈、室家辉煌，也可见祝其多男、肯堂肯构的意味。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"維鵲有巢，維鳩盈之。之子于歸，百兩成之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":null,\"excerpt\":\"既可见媵从充盈、室家辉煌，\",\"fullText\":\"末章以“盈”“成”收束全篇，方玉润据此强调婚礼既盛且成，既可见媵从充盈、室家辉煌，也可见祝其多男、肯堂肯构的意味。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-010:3-3:盈\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-4\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"維鵲有巢，維鳩盈之。之子于歸，百兩成之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\" 3-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/maruichen-tongshi/0003-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"維鵲有巢，維鳩方之。之子于歸，百兩將之。\",\"sourceLabel\":\"第 105 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"“百兩將之”则写送嫁车百乘相將，將犹送也。\",\"fullText\":\"瑞辰据传文“荒，有也”与释文“方，方之也”辨“方/荒”皆可训“有”，谓此章“方之”承首章“居之”而义相贯；“百兩將之”则写送嫁车百乘相將，將犹送也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-008:1-4:百兩將之\",\"seg-008:3-3:將\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"maruichen-tongshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/maruichen-tongshi/0004-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"維鵲有巢，維鳩盈之。之子于歸，百兩成之。\",\"sourceLabel\":\"第 105 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"瑞辰以三章递进为旨：首章往迎故曰“御”，二章在途故曰“將”，三章既至故曰“成”；\",\"fullText\":\"瑞辰以三章递进为旨：首章往迎故曰“御”，二章在途故曰“將”，三章既至故曰“成”；并释“盈”谓从嫁之人充盈其巢，“成”谓礼成，故末章以礼备而婚成作收束。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-012:3-3:成\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maruichen-tongshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/maruichen-tongshi/0004-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"維鵲有巢，維鳩盈之。之子于歸，百兩成之。\",\"sourceLabel\":\"第 105 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"并释“盈”谓从嫁之人充盈其巢，“成”谓礼成，\",\"fullText\":\"瑞辰以三章递进为旨：首章往迎故曰“御”，二章在途故曰“將”，三章既至故曰“成”；并释“盈”谓从嫁之人充盈其巢，“成”谓礼成，故末章以礼备而婚成作收束。\",\"notes\":null,\"partOrder\":2,\"anchorIds 09\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"鵲巢，夫人之德也。國君積行累功，以致爵位。夫人起家而居有之。德如鳩，乃可以配焉。\",\"sourceLabel\":\"第 38-39 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"疏承《序》以《鵲巢》为夫人有德足以配君之诗，\",\"fullText\":\"疏承《序》以《鵲巢》为夫人有德足以配君之诗，认为国君积行累功而得其位，夫人亦须有德而后可居其室；鸠居鹊巢之兴，正是以居位得配来明婚配相称。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"鵲巢，夫人之德也。國君積行累功，以致爵位。夫人起家而居有之。德如鳩，乃可以配焉。\",\"sourceLabel\":\"第 38-39 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"认为国君积行累功而得其位，夫人亦须有德而后可居其室；\",\"fullText\":\"疏承《序》以《鵲巢》为夫人有德足以配君之诗，认为国君积行累功而得其位，夫人亦须有德而后可居其室；鸠居鹊巢之兴，正是以居位得配来明婚配相称。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/012-que-chao/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"鵲巢，夫人之德也。國君積行累功，以致爵位。夫人起家而居有之。德如鳩，乃可以配焉。\",\"sourceLabel\":\"第 38-39 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"鸠居鹊巢之兴，正是以居位得配来明婚配相称。\",\"fullText\":\"疏承《序》以《鵲巢》为夫人有德足以配君之诗，认为国君积行累功而得其位，夫人亦须有德而后可居其室；鸠居鹊巢之兴，正是以居位得配来明婚配相称。\",\"notes\":null,\"partOrder\":3,\
