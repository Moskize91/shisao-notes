襄公出猎，亦是赞美而非讥刺。此诗每章只有两句，章与章之间只变换二三字，可能是顺口溜一类的民歌。卢令令，其人美且仁。卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。卢重环，其人美且髦。重环，大环中套一个小环，也称子母环。髦，勇壮。卢重镅，其人美且偲。重镅，大环中套两个小环。偲，多才。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/103-lu-ling-ling/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"卢令令，其人美且仁。卢重环，其人美且髦。卢重镅，其人美且偲。","sourceLabel":"第 216-217 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"卢令令，其人美且仁。","fullText":"这是一首赞美猎人的诗。春秋时代人们爱好田猎，诗中称誉之意甚明，纵使写齐襄公出猎，亦是赞美而非讥刺。此诗每章只有两句，章与章之间只变换二三字，可能是顺口溜一类的民歌。卢令令，其人美且仁。卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。卢重环，其人美且髦。重环，大环中套一个小环，也称子母环。髦，勇壮。卢重镅，其人美且偲。重镅，大环中套两个小环。偲，多才。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-3:卢令令","seg-002:1-5:其人美且仁"],"glossAnchorIds":["anchor-2-1","anchor-2-2"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/103-lu-ling-ling/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"卢令令，其人美且仁。卢重环，其人美且髦。卢重镅，其人美且偲。","sourceLabel":"第 216-217 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。","fullText":"这是一首赞美猎人的诗。春秋时代人们爱好田猎，诗中称誉之意甚明，纵使写齐襄公出猎，亦是赞美而非讥刺。此诗每章只有两句，章与章之间只变换二三字，可能是顺口溜一类的民歌。卢令令，其人美且仁。卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。卢重环，其人美且髦。重环，大环中套一个小环，也称子母环。髦，勇壮。卢重镅，其人美且偲。重镅，大环中套两个小环。偲，多才。","notes":null,"partOrder":3,"anchorIds":["seg-001:1-1:卢","seg-001:2-3:令令","seg-002:1-2:其人","seg-002:5-5:仁"],"g rLabel":"全篇总说","targetText":"刺好田也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"刺好田也。","fullText":"刺好田也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。","fullText":"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"盧田犬也。〔孔氏穎達曰〕犬有田犬、守犬。《戰國策》云：「韓國盧，天下之駿犬。東郭逡，海内之狡兔。韓盧逐東郭，俱爲田父之所獲。」是盧爲田犬也。令令犬頷下環聲。〔董氏逌曰〕《韓詩》作「盧泠泠」。《説文》引《詩》作「獜」。重環子母環也。鬈《説文》：「髮好貌。」鋂〔許氏慎曰〕鋂，大鎖也。偲〔《集傳》〕偲，多鬚之貌。《春秋傳》所謂「于思」，即此字，古通用耳。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集釋","excerpt":"盧田犬也。〔孔氏穎達曰〕犬有田犬、守犬。《戰國策》云：「韓國盧，天下之駿犬。東郭逡，海内之狡兔。韓盧逐東郭，俱爲田父之所獲。」是盧爲田犬也。","fullText":"盧田犬也。〔孔氏穎達曰〕犬有田犬、守犬。《戰國策》云：「韓國盧，天下之駿犬。東郭逡，海内之狡兔。韓盧逐東郭，俱爲田父之所獲。」是盧爲田犬也。令令犬頷下環聲。〔董氏逌曰〕《韓詩》作「盧泠泠」。《説文》引《詩》作「獜」。重環子母環也。鬈《説文》：「髮好貌。」鋂〔許氏慎曰〕鋂，大鎖也 or-7-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺好田也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺好田也。\",\"fullText\":\"刺好田也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。\",\"fullText\":\"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉 令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。卢重环，其人美且髦。重环，大环中套一个小环，也称子母环。髦，勇壮。卢重镅，其人美且偲。重镅，大环中套两个小环。偲，多才。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"卢令令，其人美且仁。卢重环，其人美且髦。卢重镅，其人美且偲。\",\"sourceLabel\":\"第 216-217 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"卢令令，其人美且仁。\",\"fullText\":\"这是一首赞美猎人的诗。春秋时代人们爱好田猎，诗中称誉之意甚明，纵使写齐襄公出猎，亦是赞美而非讥刺。此诗每章只有两句，章与章之间只变换二三字，可能是顺口溜一类的民歌。卢令令，其人美且仁。卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。卢重环，其人美且髦。重环，大环中套一个小环，也称子母环。髦，勇壮。卢重镅，其人美且偲。重镅，大环中套两个小环。偲，多才。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-3:卢令令\",\"seg-002:1-5:其人美且仁\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"卢令令，其人美且仁。卢重环，其人美且髦。卢重镅，其人美且偲。\",\"sourceLabel\":\"第 216-217 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。\",\"fullText\":\"这是一首赞美猎人的诗。春秋时代人们爱好田猎，诗中称誉之意甚明，纵使写齐襄公出猎，亦是赞美而非讥刺。此诗每章只有两句，章与章之间只变换二三字，可能是顺口溜一类的民歌。卢令令，其人美且仁。卢，黑色猎狗。令令，狗颈下套环的响声。其人，指猎人。仁，和蔼友好。卢重环，其人美且髦。重环，大环中套一个小环，也称子母环。髦，勇壮。卢重镅，其人美且偲。重镅，大环中套两个小环。偲，多才。 。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-005:2-3:重镅\",\"seg-006:5-5:偲\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺好田也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺好田也。\",\"fullText\":\"刺好田也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling-ling/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。\",\"fullText\":\"右《盧令令》三章，章二句。《小序》謂「刺荒也」。《大序》曰：「襄公好田獵畢弋而不修民事，百姓苦之，故陳古以風焉。」襄公好田而死於田，事見《春秋傳》，故當刺。然此詩與公無涉，亦無所謂「陳古以風」意。蓋游獵自是齊俗所尚，詩人即所見以咏之。詞若歎美意實諷刺，與《還》略同。當以《集傳》爲是。但彼以馳逐爲能事，此以聲容爲美觀。作法又各不同耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/103-lu-ling
