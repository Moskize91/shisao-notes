":"preface","layerLabel":"篇序","targetText":"题解","sourceLabel":"第 94-95 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一位少女要求婚姻自由，向家庭表示违抗的诗，表现了爱情专一，坚决反抗封建礼教的精神。毛序说:“柏舟，共姜自誓也。卫世子共伯蚤死，其妻守义。父母欲夺而嫁之，誓而弗许，故作是诗以绝之。”这种说法实际是把天真无邪爱情真挚的民间歌唱附会成统治阶级的贞节牌坊，姚际恒在《诗经通论》中驳得好:“序谓共姜自誓，共伯已四十五六岁，共姜为之妻，岂有父母欲其改嫁之理？至于共伯，已为诸侯，乃为武公攻于墓上，共伯入厘侯羡（墓道）自杀，则大序谓共伯为世子及早死之言尤悖矣。故此诗不可以事实之。”他的分析，道破了《毛序》的错误。此诗与邶风《柏舟》所表现的情感、所用的艺术手法，以及语言风格，区别很大。邶《柏舟》作于既遭弃离之后，故诗中充满了痛苦的反思；此诗作于热恋之时，故诗中突出了愤怒的抗争。邶《柏舟》作者，其心已受伤害，其情如百尺潭水那样深沉；此诗作者，其身正遭压迫，其情如冲天之火那样热烈。邶《柏舟》所用的是“回荡的表情法”，“是一种极浓厚的情感蟠结在胸中，像春蚕抽丝一般，把它抽出来”；此诗所用的是“奔迸的表情法”，“是情感突变，一烧烧到白热度”，“用极简单的语句，把极真的感情尽量表出”（梁启超《中国韵文里头所表现的情感》）。邶《柏舟》多用比喻，在意象的表现中寄情；此诗全是直陈，将毫无隐瞒的情感，迸裂到字句之中。故邶《柏舟》风格沉郁，能长久地引起人们同情；此诗表现激烈，能很快激起人们共鸣。邶《柏舟》语言委婉曲折，如山间溪水；此诗语言一泻无馀，如大河奔流。","fullText":"这是一位少女要求婚姻自由，向家庭表示违抗的诗，表现了爱情专一，坚决反抗封建礼教的精神。毛序说:“柏舟，共姜自誓也。卫世子共伯蚤死，其妻守义。父母欲夺而嫁之，誓而弗许，故作是诗以绝之。”这种说法实际是把天真无邪爱情真挚的民间歌唱附会成统治阶级的贞节牌坊，姚际恒在《诗经通论》中驳得好:“序谓共姜自誓，共伯已四十五六岁，共姜为之妻，岂有父母欲其改嫁之理？至于共伯，已为诸侯，乃为武公攻于墓上，共伯入厘侯羡（墓道）自杀，则大序谓共伯为世子及早死之言尤悖矣。故此诗不可以事实之。”他的分析，道破了《毛序》的错误。此诗与邶风《柏舟》所表现的情感、所用的艺术手法，以及语言风格，区别很大。邶《柏舟》作于既遭弃离之后，故诗中充满了痛苦的反思；此诗作于热恋之时，故诗中突出了愤怒的抗争。邶《柏舟》作者，其心已受伤害，其情如百尺潭水那样深沉；此诗作者，其身正遭压迫，其情如冲天之火那样热烈。邶《柏舟》所用的是“回荡的表情法”，“是一种极浓厚的情感蟠结在胸中，像春蚕抽丝一般，把它抽出来”；此诗所用的是“奔迸的表情法”，“是情感突变，一烧烧到白热度”，“用极简单的语句，把极真的感情尽量表出”（梁启超《中国韵文里头所表现的情感》）。邶《柏舟》多用比喻，在意象的表现中寄情；此诗全是直陈，将毫无隐瞒的情感，迸裂到字句之中。故邶《柏舟》风格沉郁，能长久地引起人们同情；此诗表现激烈，能很快激起人们共鸣。邶《柏舟》语言委婉曲折，如山间溪水；此诗语言一泻无馀，如大河奔流。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"泛彼柏舟，在彼中河。髧彼两髦，实维我仪，之死矢靡它。母也天只！不谅人只！","sourceLabel":"第 95 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。","fullText":"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。髧（dàn），发（髮）下垂貌。齐、韩诗髧作覃。《国语·鲁语》“王后亲织玄紞”，韦注:“紞，所以悬瑱当耳者。”马瑞辰《通释》:“悬瑱即垂也。统为悬瑱之貌，因谓髦垂之貌为紞。《玉篇》‘髧，发垂貌’，是也。”髦，三家诗作覂，亦作髳。髦是髳的假借字。《说文》:“髳，发至眉也。”古代未成年的男子前额头发分向两边披着，长齐眉毛；额后则扎成两髻，左右各一，称为两髦。实，寔的假借字。《小星》传:“寔，是也。”维，为。仪，读如俄，与偶字双声，假借为偶，所以毛传说:“仪，匹也。”之，至、到。矢，发誓。《尔雅·释言》:“矢，誓也。”靡，无。它，伦的假借字，他。鲁诗作他，是俗字。靡它，无他心，不嫁别人的意思。王先谦《集疏》:“无它，犹言无二也。”也、只，都是语气词。天，指父。《左传》桓十五年杜注:“妇人在室则天父，出则天夫。”谅，亮察、体谅。《释文》:“本亦作亮。”经传中二字常通用。韵读:歌部一一河、仪（音俄）、它（音拖）。真部一一天（铁因反）、人。","notes":null,"partOrder":1,"anchorIds":["seg-001:1-2:泛彼","seg-002:3-4:中河"],"glossAnchorIds":["anchor-1-1","anchor-1-2"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"泛彼柏舟，在彼中河。髧彼两髦，实维我仪，之死矢靡它。母也天只！不谅人只！","sourceLabel":"第 95 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"髧（dàn），发（髮）下垂貌。齐、韩诗髧作覃。《国语·鲁语》“王后亲织玄紞”，韦注:“紞，所以悬瑱当耳者。”马瑞辰《通释》:“悬瑱即垂也。统为悬瑱之貌，因谓髦垂之貌为紞。《玉篇》‘髧，发垂貌’，是也。”髦，三家诗作覂，亦作髳。髦是髳的假借字。《说文》:“髳，发至眉也。”古代未成年的男子前额头发分向两边披着，长齐眉毛；额后则扎成两髻，左右各一，称为两髦。","fullText":"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。髧（dàn），发（髮）下垂貌。齐、韩诗髧作覃。《国语·鲁语》“王后亲织玄紞”，韦注:“紞，所以悬瑱当耳者。”马瑞辰《通释》:“悬瑱即垂也。统为悬瑱之貌，因谓髦垂之貌为紞。《玉篇》‘髧，发垂貌’，是也。”髦，三家诗作覂，亦作髳。髦是髳的假借字。《说文》:“髳，发至眉也。”古代未成年的男子前额头发分向两边披着，长齐眉毛；额后则扎成两髻，左右各一，称为两髦。实，寔的假借字。《小星》传:“寔，是也。”维，为。仪，读如俄，与偶字双声，假借为偶，所以毛传说:“仪，匹也。”之，至、到。矢，发誓。《尔雅·释言》:“矢，誓也。”靡，无。它，伦的假借字，他。鲁诗作他，是俗字。靡它，无他心，不嫁别人的意思。王先谦《集疏》:“无它，犹言无二也。”也、只，都是语气词。天，指父。《左传》桓十五年杜注:“妇人在室则天父，出则天夫。”谅，亮察、体谅。《释文》:“本亦作亮。”经传中二字常通用。韵读:歌部一一河、仪（音俄）、它（音拖）。真部一一天（铁因反）、人。","notes":null,"partOrder":2,"anchorIds":["seg-003:1-1:髧","seg-003:3-4:两髦"],"glossAnchorIds":["anchor-2-1","anchor-2-2"],"segmentId ","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"特，匹偶。特的本义为牛。《说文》:“特，牛也。”段注:“特本训牡，阳数奇，引申之为凡单独之称。”马瑞辰《通释》:“物无偶曰特。《广雅》:‘特，独也。’皆训特为独。特训独，又训匹者……犹匹为一，又为双为偶，皆以相反为义也。”","fullText":"特，匹偶。特的本义为牛。《说文》:“特，牛也。”段注:“特本训牡，阳数奇，引申之为凡单独之称。”马瑞辰《通释》:“物无偶曰特。《广雅》:‘特，独也。’皆训特为独。特训独，又训匹者……犹匹为一，又为双为偶，皆以相反为义也。”慝，更改。慝是忒（tè）的假借字。《说文》:“忒，更也。”韵读:之部一一侧（音淄，入声）、特（徒力反，入声）、慝（他力反，入声）。真部一一天、人。","notes":null,"partOrder":1,"anchorIds":["seg-011:4-4:特"],"glossAnchorIds":["anchor-1-1"],"segmentIds":["seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0003-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"泛彼柏舟，在彼河侧。髧彼两髦，实维我特；之死矢靡慝。母也天只！不谅人只！","sourceLabel":"第 95-96 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"慝，更改。慝是忒（tè）的假借字。《说文》:“忒，更也。”韵读:之部一一侧（音淄，入声）、特（徒力反，入声）、慝（他力反，入声）。真部一一天、人。","fullText":"特，匹偶。特的本义为牛。《说文》:“特，牛也。”段注:“特本训牡，阳数奇，引申之为凡单独之称。”马瑞辰《通释》:“物无偶曰特。《广雅》:‘特，独也。’皆训特为独。特训独，又训匹者……犹匹为一，又为双为偶，皆以相反为义也。”慝，更改。慝是忒（tè）的假借字。《说文》:“忒，更也。”韵读:之部一一侧（音淄，入声）、特（徒力反，入声）、慝（他力反，入声）。真部一一天、人。","notes":null,"partOrder":2,"anchorIds":["seg-012:5-5:慝"],"glossAnchorIds":["anchor-2-1"],"segmentIds":["seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"柏舟㊟貞婦自誓也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"柏舟㊟貞婦自誓也。","fullText":"柏舟㊟貞婦自誓也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？","fullText":"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"眉评","excerpt":"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？","fullText":"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。","fullText":"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0005-1:part-1","annotationId":"0005","glossId":"0005-1","glossHref":"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0005-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特 :part-1\",\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"quwanli-quanshi:0002-1:part-3\",\"zhuxi-shijichuan-kr1c0009:0002-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-012:5-5:慝\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"慝\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"quwanli-quanshi:0002-1:part-3\",\"zhuxi-shijichuan-kr1c0009:0002-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"题解\",\"sourceLabel\":\"第 94-95 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位少女要求婚姻自由，向家庭表示违抗的诗，表现了爱情专一，坚决反抗封建礼教的精神。毛序说:“柏舟，共姜自誓也。卫世子共伯蚤死，其妻守义。父母欲夺而嫁之，誓而弗许，故作是诗以绝之。”这种说法实际是把天真无邪爱情真挚的民间歌唱附会成统治阶级的贞节牌坊，姚际恒在《诗经通论》中驳得好:“序谓共姜自誓，共伯已四十五六岁，共姜为之妻，岂有父母欲其改嫁之理？至于共伯，已为诸侯，乃为武公攻于墓上，共伯入厘侯羡（墓道）自杀，则大序谓共伯为世子及早死之言尤悖矣。故此诗不可以事实之。”他的分析，道破了《毛序》的错误。此诗与邶风《柏舟》所表现的情感、所用的艺术手法，以及语言风格，区别很大。邶《柏舟》作于既遭弃离之后，故诗中充满了痛苦的反思；此诗作于热恋之时，故诗中突出了愤怒的抗争。邶《柏舟》作者，其心已受伤害，其情如百尺潭水那样深沉；此诗作者，其身正遭压迫，其情如冲天之火那样热烈。邶《柏舟》所用的是“回荡的表情法”，“是一种极浓厚的情感蟠结在胸中，像春蚕抽丝一般，把它抽出来”；此诗所用的是“奔迸的表情法”，“是情感突变，一烧烧到白热度”，“用极简单的语句，把极真的感情尽量表出”（梁启超《中国韵文里头所表现的情感》）。邶《柏舟》多用比喻，在意象的表现中寄情；此诗全是直陈，将毫无隐瞒的情感，迸裂到字句之中。故邶《柏舟》风格沉郁，能长久地引起人们同情；此诗表现激烈，能很快激起人们共鸣。邶《柏舟》语言委婉曲折，如山间溪水；此诗语言一泻无馀，如大河奔流。\",\"fullText\":\"这是一位少女要求婚姻自由，向家庭表示违抗的诗，表现了爱情专一，坚决反抗封建礼教的精神。毛序说:“柏舟，共姜自誓也。卫世子共伯蚤死，其妻守义。父母欲夺而嫁之，誓而弗许，故作是诗以绝之。”这种说法实际是把天真无邪爱情真挚的民间歌唱附会成统治阶级的贞节牌坊，姚际恒在《诗经通论》中驳得好:“序谓共姜自誓，共伯已四十五六岁，共姜为之妻，岂有父母欲其改嫁之理？至于共伯，已为诸侯，乃为武公攻于墓上，共伯入厘侯羡（墓道）自杀，则大序谓共伯为世子及早死之言尤悖矣。故此诗不可以事实之。”他的分析，道破了《毛序》的错误。此诗与邶风《柏舟》所表现的情感、所用的艺术手法，以及语言风格，区别很大。邶《柏舟》作于既遭弃离之后，故诗中充满了痛苦的反思；此诗作于热恋之时，故诗中突出了愤怒的抗争。邶《柏舟》作者，其心已受伤害，其情如百尺潭水那样深沉；此诗作者，其身正遭压迫，其情如冲天之火那样热烈。邶《柏舟》所用的是“回荡的表情法”，“是一种极浓厚的情感蟠结在胸中，像春蚕抽丝一般，把它抽出来”；此诗所用的是“奔迸的表情法”，“是情感突变，一烧烧到白热度”，“用极简单的语句，把极真的感情尽量表出”（梁启超《中国韵文里头所表现的情感》）。邶《柏舟》多用比喻，在意象的表现中寄情；此诗全是直陈，将毫无隐瞒的情感，迸裂到字句之中。故邶《柏舟》风格沉郁，能长久地引起人们同情；此诗表现激烈，能很快激起人们共鸣。邶《柏舟》语言委婉曲折，如山间溪水；此诗语言一泻无馀，如大河奔流。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"泛彼柏舟，在彼中河。髧彼两髦，实维我仪，之死矢靡它。母也天只！不谅人只！\",\"sourceLabel\":\"第 95 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。\",\"fullText\":\"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。髧（dàn），发（髮）下垂貌。齐、韩诗髧作覃。《国语·鲁语》“王后亲织玄紞”，韦注:“紞，所以悬瑱当耳者。”马瑞辰《通释》:“悬瑱即垂也。统为悬瑱之貌，因谓髦垂之貌为紞。《玉篇》‘髧，发垂貌’，是也。”髦，三家诗作覂，亦作髳。髦是髳的假借字。《说文》:“髳，发至眉也。”古代未成年的男子前额头发分向两边披着，长齐眉毛；额后则扎成两髻，左右各一，称为两髦。实，寔的假借字。《小星》传:“寔，是也。”维，为。仪，读如俄，与偶字双声，假借为偶，所以毛传说:“仪，匹也。”之，至、到。矢，发誓。《尔雅·释言》:“矢，誓也。”靡，无。它，伦的假借字，他。鲁诗作他，是俗字。靡它，无他心，不嫁别人的意思。王先谦《集疏》:“无它，犹言无二也。”也、只，都是语气词。天，指父。《左传》桓十五年杜注:“妇人在室则天父，出则天夫。”谅，亮察、体谅。《释文》:“本亦作亮。”经传中二字常通用。韵读:歌部一一河、仪（音俄）、它（音拖）。真部一一天（铁因反）、人。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:泛彼\",\"seg-002:3-4:中河\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"000 章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？\",\"fullText\":\"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？\",\"fullText\":\"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。\",\"fullText\":\"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特、慝並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特、慝並同。本韻。\",\"fullText\":\"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特、慝並同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"柏舟共姜自誓也衛世子共伯蚤死其妻守義父母欲奪而嫁之誓而弗許故作是詩以絶之\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《柏舟》，共姜自誓也。\",\"fullText\":\"序：《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許，故作是詩以絶之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"柏舟共姜自誓也衛世子共伯蚤死其妻守義父母欲奪而嫁之誓而弗許故作是詩以絶之\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許，故作是詩以絶之。\",\"fullText\":\"序：《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許，故作是詩以絶之。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"汎彼柏舟在彼中河髧彼兩髦實維我儀之死矢靡它母也天只不諒人只\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。\",\"fullText\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。矢，誓。靡，無。之，至也。至己之死，信無它心。諒，信也。母也天也，尙不信我。天謂父也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:3-4:中河\",\"seg-001:4-4:舟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"汎彼柏舟在彼中河髧彼兩髦實維我儀之死矢靡它母也天只不諒人只\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。\",\"fullText\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。矢，誓。靡，無。之，至也。至己之死，信無它心。諒，信也。母也天也，尙不信我。天謂父也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-1:髧\",\"seg-003:3-4:兩髦\",\"seg-004:4-4:儀\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"汎彼柏舟在彼中河髧彼兩髦實維我儀之死矢靡它母也天只不諒人只\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。\",\"fullText\": icationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《詩序》：“《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義。父母欲奪而嫁之，誓而弗許，故作是詩以絕之。”〔姚際恒《詩經通論》卷四謂：《詩序》之說不足信。當是真婦有夫蚤死，其母欲嫁之，而誓死不願之作也。〕按：《史記·衛世家》稱：衛釐侯卒，太子共伯餘立。共伯弟和（即衛武公）襲攻共伯於墓上，殺共伯自立云云。其說與《詩序》異。蓋序稱世子，證知共伯未及繼位爲君前已死。\",\"sourceLabel\":\"第 54-55 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"《詩序》：“《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義。父母欲奪而嫁之，誓而弗許，故作是詩以絕之。”〔姚際恒《詩經通論》卷四謂：《詩序》之說不足信。當是真婦有夫蚤死，其母欲嫁之，而誓死不願之作也。〕按：《史記·衛世家》稱：衛釐侯卒，太子共伯餘立。共伯弟和（即衛武公）襲攻共伯於墓上，殺共伯自立云云。其說與《詩序》異。蓋序稱世子，證知共伯未及繼位爲君前已死。\",\"fullText\":\"《詩序》：“《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義。父母欲奪而嫁之，誓而弗許，故作是詩以絕之。”〔姚際恒《詩經通論》卷四謂：《詩序》之說不足信。當是真婦有夫蚤死，其母欲嫁之，而誓死不願之作也。〕按：《史記·衛世家》稱：衛釐侯卒，太子共伯餘立。共伯弟和（即衛武公）襲攻共伯於墓上，殺共伯自立云云。其說與《詩序》異。蓋序稱世子，證知共伯未及繼位爲君前已死。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"汎彼柏舟，在彼中河。髧彼兩髦，實維我儀。之死矢靡它。母也天只！不諒人只！汎彼柏舟，在彼河側。髧彼兩髦，實維我特。之死矢靡慝。母也天只！不諒人只！\",\"sourceLabel\":\"第 55 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“汎”为浮，“中河”为河中；“髧”训髮垂，“兩髦”谓幼小之飾，“儀”为匹配。\",\"fullText\":\"屈万里释“汎”为浮，“中河”为河中；“髧”训髮垂，“兩髦”谓幼小之飾，“儀”为匹配。又释“之”为至，“矢”为誓，“靡它”为无他心意，“諒”作谅解。次章并释“特”为牡畜独称而借作匹，“慝”音忒训邪。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:汎\",\"seg-002:3-4:中河\",\"seg-003:1-1:髧\",\"seg-003:3-4:兩髦\",\"seg-004:4-4:儀\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\" :part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-012:5-5:慝\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"慝\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"quwanli-quanshi:0002-1:part-3\",\"zhuxi-shijichuan-kr1c0009:0002-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"maoheng-zhushu-kr1c0004\",\"quwanli-quanshi\",\"zhuxi-shijichuan-kr1c0009\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"题解\",\"sourceLabel\":\"第 94-95 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位少女要求婚姻自由，向家庭表示违抗的诗，表现了爱情专一，坚决反抗封建礼教的精神。毛序说:“柏舟，共姜自誓也。卫世子共伯蚤死，其妻守义。父母欲夺而嫁之，誓而弗许，故作是诗以绝之。”这种说法实际是把天真无邪爱情真挚的民间歌唱附会成统治阶级的贞节牌坊，姚际恒在《诗经通论》中驳得好:“序谓共姜自誓，共伯已四十五六岁，共姜为之妻，岂有父母欲其改嫁之理？至于共伯，已为诸侯，乃为武公攻于墓上，共伯入厘侯羡（墓道）自杀，则大序谓共伯为世子及早死之言尤悖矣。故此诗不可以事实之。”他的分析，道破了《毛序》的错误。此诗与邶风《柏舟》所表现的情感、所用的艺术手法，以及语言风格，区别很大。邶《柏舟》作于既遭弃离之后，故诗中充满了痛苦的反思；此诗作于热恋之时，故诗中突出了愤怒的抗争。邶《柏舟》作者，其心已受伤害，其情如百尺潭水那样深沉；此诗作者，其身正遭压迫，其情如冲天之火那样热烈。邶《柏舟》所用的是“回荡的表情法”，“是一种极浓厚的情感蟠结在胸中，像春蚕抽丝一般，把它抽出来”；此诗所用的是“奔迸的表情法”，“是情感突变，一烧烧到白热度”，“用极简单的语句，把极真的感情尽量表出”（梁启超《中国韵文里头所表现的情感》）。邶《柏舟》多用比喻，在意象的表现中寄情；此诗全是直陈，将毫无隐瞒的情感，迸裂到字句之中。故邶《柏舟》风格沉郁，能长久地引起人们同情；此诗表现激烈，能很快激起人们共鸣。邶《柏舟》语言委婉曲折，如山间溪水；此诗语言一泻无馀，如大河奔流。\",\"fullText\":\"这是一位少女要求婚姻自由，向家庭表示违抗的诗，表现了爱情专一，坚决反抗封建礼教的精神。毛序说:“柏舟，共姜自誓也。卫世子共伯蚤死，其妻守义。父母欲夺而嫁之，誓而弗许，故作是诗以绝之。”这种说法实际是把天真无邪爱情真挚的民间歌唱附会成统治阶级的贞节牌坊，姚际恒在《诗经通论》中驳得好:“序谓共姜自誓，共伯已四十五六岁，共姜为之妻，岂有父母欲其改嫁之理？至于共伯，已为诸侯，乃为武公攻于墓上，共伯入厘侯羡（墓道）自杀，则大序谓共伯为世子及早死之言尤悖矣。故此诗不可以事实之。”他的分析，道破了《毛序》的错误。此诗与邶风《柏舟》所表现的情感、所用的艺术手法，以及语言风格，区别很大。邶《柏舟》作于既遭弃离之后，故诗中充满了痛苦的反思；此诗作于热恋之时，故诗中突出了愤怒的抗争。邶《柏舟》作者，其心已受伤害，其情如百尺潭水那样深沉；此诗作者，其身正遭压迫，其情如冲天之火那样热烈。邶《柏舟》所用的是“回荡的表情法”，“是一种极浓厚的情感蟠结在胸中，像春蚕抽丝一般，把它抽出来”；此诗所用的是“奔迸的表情法”，“是情感突变，一烧烧到白热度”，“用极简单的语句，把极真的感情尽量表出”（梁启超《中国韵文里头所表现的情感》）。邶《柏舟》多用比喻，在意象的表现中寄情；此诗全是直陈，将毫无隐瞒的情感，迸裂到字句之中。故邶《柏舟》风格沉郁，能长久地引起人们同情；此诗表现激烈，能很快激起人们共鸣。邶《柏舟》语言委婉曲折，如山间溪水；此诗语言一泻无馀，如大河奔流。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"泛彼柏舟，在彼中河。髧彼两髦，实维我仪，之死矢靡它。母也天只！不谅人只！\",\"sourceLabel\":\"第 95 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。\",\"fullText\":\"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。髧（dàn），发（髮）下垂貌。齐、韩诗髧作覃。《国语·鲁语》“王后亲织玄紞”，韦注:“紞，所以悬瑱当耳者。”马瑞辰《通释》:“悬瑱即垂也。统为悬瑱之貌，因谓髦垂之貌为紞。《玉篇》‘髧，发垂貌’，是也。”髦，三家诗作覂，亦作髳。髦是髳的假借字。《说文》:“髳，发至眉也。”古代未成年的男子前额头发分向两边披着，长齐眉毛；额后则扎成两髻，左右各一，称为两髦。实，寔的假借字。《小星》传:“寔，是也。”维，为。仪，读如俄，与偶字双声，假借为偶，所以毛传说:“仪，匹也。”之，至、到。矢，发誓。《尔雅·释言》:“矢，誓也。”靡，无。它，伦的假借字，他。鲁诗作他，是俗字。靡它，无他心，不嫁别人的意思。王先谦《集疏》:“无它，犹言无二也。”也、只，都是语气词。天，指父。《左传》桓十五年杜注:“妇人在室则天父，出则天夫。”谅，亮察、体谅。《释文》:“本亦作亮。”经传中二字常通用。韵读:歌部一一河、仪（音俄）、它（音拖）。真部一一天（铁因反）、人。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:泛彼\",\"seg-002:3-4:中河\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"mater （音俄）、它（音拖）。真部一一天（铁因反）、人。\",\"fullText\":\"泛彼，即泛泛，快速不停地飘浮貌。王先谦《传疏》:“泛，犹泛泛也。”中河，即河中。这二句诗人以柏舟飘荡不定兴自己爱情坚贞和身世飘零。髧（dàn），发（髮）下垂貌。齐、韩诗髧作覃。《国语·鲁语》“王后亲织玄紞”，韦注:“紞，所以悬瑱当耳者。”马瑞辰《通释》:“悬瑱即垂也。统为悬瑱之貌，因谓髦垂之貌为紞。《玉篇》‘髧，发垂貌’，是也。”髦，三家诗作覂，亦作髳。髦是髳的假借字。《说文》:“髳，发至眉也。”古代未成年的男子前额头发分向两边披着，长齐眉毛；额后则扎成两髻，左右各一，称为两髦。实，寔的假借字。《小星》传:“寔，是也。”维，为。仪，读如俄，与偶字双声，假借为偶，所以毛传说:“仪，匹也。”之，至、到。矢，发誓。《尔雅·释言》:“矢，誓也。”靡，无。它，伦的假借字，他。鲁诗作他，是俗字。靡它，无他心，不嫁别人的意思。王先谦《集疏》:“无它，犹言无二也。”也、只，都是语气词。天，指父。《左传》桓十五年杜注:“妇人在室则天父，出则天夫。”谅，亮察、体谅。《释文》:“本亦作亮。”经传中二字常通用。韵读:歌部一一河、仪（音俄）、它（音拖）。真部一一天（铁因反）、人。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-004:4-4:仪\",\"seg-005:3-3:矢\",\"seg-005:5-5:它\",\"seg-006:3-3:天\",\"seg-007:2-2:谅\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"泛彼柏舟，在彼河侧。髧彼两髦，实维我特；之死矢靡慝。母也天只！不谅人只！\",\"sourceLabel\":\"第 95-96 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"特，匹偶。特的本义为牛。《说文》:“特，牛也。”段注:“特本训牡，阳数奇，引申之为凡单独之称。”马瑞辰《通释》:“物无偶曰特。《广雅》:‘特，独也。’皆训特为独。特训独，又训匹者……犹匹为一，又为双为偶，皆以相反为义也。”\",\"fullText\":\"特，匹偶。特的本义为牛。《说文》:“特，牛也。”段注:“特本训牡，阳数奇，引申之为凡单独之称。”马瑞辰《通释》:“物无偶曰特。《广雅》:‘特，独也。’皆训特为独。特训独，又训匹者……犹匹为一，又为双为偶，皆以相反为义也。”慝，更改。慝是忒（tè）的假借字。《说文》:“忒，更也。”韵读:之部一一侧（音淄，入声）、特（徒力反，入声）、慝（他力反，入声）。真部一一天、人。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-011:4-4:特\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"泛彼柏舟，在彼河侧。髧彼两髦，实维我特；之死矢靡慝。母也天只！不谅人只！\",\"sourceLabel\":\"第 95-96 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"慝，更改。慝是忒（tè）的假借字。《说文》:“忒，更也。”韵读:之部一一侧（音淄，入声）、特（徒力反，入声）、慝（他力反，入声）。真部一一天、人。\",\"fullText\":\"特，匹偶。特的本义为牛。《说文》:“特，牛也。”段注:“特本训牡，阳数奇，引申之为凡单独之称。”马瑞辰《通释》:“物无偶曰特。《广雅》:‘特，独也。’皆训特为独。特训独，又训匹者……犹匹为一，又为双为偶，皆以相反为义也。”慝，更改。慝是忒（tè）的假借字。《说文》:“忒，更也。”韵读:之部一一侧（音淄，入声）、特（徒力反，入声）、慝（他力反，入声）。真部一一天、人。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-012:5-5:慝\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"柏舟㊟貞婦自誓也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"柏舟㊟貞婦自誓也。\",\"fullText\":\"柏舟㊟貞婦自誓也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？\",\"fullText\":\"右《柏舟》二章，章七句。《序》謂「衛世子共伯蚤死，其妻共姜守義，父母欲奪而嫁之，故共姜作此以自誓」。《集傳》及諸家悉從之。吕氏祖謙更因《序》疑《史記》謂衛武公襲攻其兄共伯之言，以爲共伯既蚤死矣，武公即位時年已四十餘，焉得而篡弑之？姚氏際恒又因此而更疑《序》之非，以爲《史記》可憑，《詩序》無據。共伯爲武公襲攻，入釐侯羨自殺，時年較武公長，亦四十餘，又烏得而謂之蚤死？且共伯時已爲諸侯，而猶謂之爲世子，則《序》言尤悖。愚謂共伯即使蚤死，共姜爲諸侯世子妃，恐無夫死再醮之理。然則詩將誰屬？姚氏又云：「此詩不可以事實，當是貞婦有夫蚤死，其母欲嫁之而誓死不願之作。」其言較妥。夫婦人貞吉，從一而終，無論貴賤，均可風世。《序》必以共姜事實之，則未免失之鑿與固。邶、鄘二國不幸早亡，事雖無考，而《柏舟》二詩，一爲賢臣憂讒憫亂之作，一爲烈婦守貞不二之詞，皆可以爲後世法，又皆冠於二風之首。嗚乎！二國得此二詩，然後可以不亡，豈漫然哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？\",\"fullText\":\"眉評《邶》之《柏舟》曰「汎汎其流」，則爲中流不繫之舟，以喻國勢之危也。此之《柏舟》曰「在彼中河」，則爲中流自在之舟，以喻人心之定也。然置此詩於《静女》、《新臺》、《牆茨》之間，不可謂之中流砥柱乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。\",\"fullText\":\"集釋髧徒坎切，髮垂貌。兩髦翦髮夾囟也。囟音信。親死然後去之。〔許氏慎曰〕頭會腦蓋也，象形。〔孔氏穎達曰〕夾囟故兩髦也。《内則》「翦髮爲鬌，男角女羈」，注：「夾囟曰角，兩髻也。午達曰羈，三髻也。」《喪大記》「小斂，主人脱髦」，注：「幼時翦髮爲之，年雖成人猶垂於兩邊。若父死脱左髦，母死脱右髦，親没不髦謂此也。」儀匹也。諒信也。只語助辭。特〔陸氏德明曰〕特，《韓詩》作直，云相當值也。〔黄氏佐曰〕特如萬人之特，蓋婦人稱夫之辭。慝邪也，以是爲慝，則絶之甚矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特、慝並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特、慝並同。本韻。\",\"fullText\":\"標韻河五歌。儀四支，叶牛何反。他五歌。叶韻。天一先，叶鐵因反。人十一真。通韻。側十三職。特、慝並同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"柏舟共姜自誓也衛世子共伯蚤死其妻守義父母欲奪而嫁之誓而弗許故作是詩以絶之\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《柏舟》，共姜自誓也。\",\"fullText\":\"序：《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許，故作是詩以絶之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"柏舟共姜自誓也衛世子共伯蚤死其妻守義父母欲奪而嫁之誓而弗許故作是詩以絶之\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許，故作是詩以絶之。\",\"fullText\":\"序：《柏舟》，共姜自誓也。衛世子共伯蚤死，其妻守義，父母欲奪而嫁之，誓而弗許，故作是詩以絶之。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"汎彼柏舟在彼中河髧彼兩髦實維我儀之死矢靡它母也天只不諒人只\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。\",\"fullText\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。矢，誓。靡，無。之，至也。至己之死，信無它心。諒，信也。母也天也，尙不信我。天謂父也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:3-4:中河\",\"seg-001:4-4:舟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"汎彼柏舟在彼中河髧彼兩髦實維我儀之死矢靡它母也天只不諒人只\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。\",\"fullText\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。矢，誓。靡，無。之，至也。至己之死，信無它心。諒，信也。母也天也，尙不信我。天謂父也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-1:髧\",\"seg-003:3-4:兩髦\",\"seg-004:4-4:儀\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/045-bai-zhou/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"汎彼柏舟在彼中河髧彼兩髦實維我儀之死矢靡它母也天只不諒人只\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。\",\"fullText\":\"興也。中河，河中。箋云：舟在河中，猶婦人之在夫家，是其常處。髧，兩髦之貌。髦者，髮至眉，子事父母之飾。儀，匹也。箋云：兩髦之人，謂共伯也，實是我之匹，故我不嫁也。禮，世子昧爽而朝，亦櫛、纚、笄、緫、拂髦、冠、緌、纓。矢，誓。靡，無。之，
