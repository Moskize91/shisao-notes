夜","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-011:3-3:辰","segmentId":"seg-011","segmentOrder":11,"surfaceText":"辰","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:1-4:不夙则莫","segmentId":"seg-012","segmentOrder":12,"surfaceText":"不夙则莫","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:2-2:夙","segmentId":"seg-012","segmentOrder":12,"surfaceText":"夙","charStart":2,"charEnd":2,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-012:4-4:莫","segmentId":"seg-012","segmentOrder":12,"surfaceText":"莫","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/100-dong-fang-wei-ming/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"东方未明，颠倒衣裳。颠之倒之，自公召之。东方未晞，颠倒裳衣。倒之颠之，自公令之。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。","sourceLabel":"第 210-212 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止乎礼义。情之发，因辞以形之；礼义之侣，须事以明之，故有赋焉，所以假象尽辞，敷陈其志。”赋的手法，在曲尽其妙的铺陈描绘中，也表达了作者的感情。 g-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-011:3-3:辰\",\"segmentId\":\"seg-011\",\"segmentOrder\":11,\"surfaceText\":\"辰\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:1-4:不夙则莫\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"不夙则莫\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:2-2:夙\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"夙\",\"charStart\":2,\"charEnd\":2,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:4-4:莫\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"莫\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方未明，颠倒衣裳。颠之倒之，自公召之。东方未晞，颠倒裳衣。倒之颠之，自公令之。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。\",\"sourceLabel\":\"第 210-212 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止乎礼义。情之发，因辞以形之；礼义之侣，须事以明之，故有赋焉，所以假象尽辞，敷陈其志。”赋的手法，在曲尽其妙的铺陈描绘中，也表达了作者的感情。即如此诗，对“狂夫”的行为描写越是生动，妻子那种怨恨不已而又无可奈何的心情不是就越发明显了吗？\",\"fullText\":\"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止乎礼义。情之发，因辞以形之；礼义之侣，须事以明之，故有赋焉，所以假象尽辞，敷陈其志。”赋的手法，在曲尽其妙的铺陈描绘中，也表达了作者的感情。即如此诗，对“狂夫”的行为描写越是生动，妻子那种怨恨不已而又无可奈何的心情不是就越发明显了吗？东方未明，颠倒衣裳。颠之倒之，自公召之。颠倒，双声。颠倒衣裳，意为急于起身，连衣和裳都穿颠倒了。之，指衣裳。公，公所。召，召唤。东方未晞，颠倒裳衣。倒之颠之，自公令之。晞，昕的假借字，且明，日将出也。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。樊，篱笆，这里作动词“围”字用。圃，菜园。狂夫，女子骂她的丈夫。瞿瞿，双眼瞪视貌。辰，与晨通。夙，早。莫，同“暮”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方未明，颠倒衣裳。颠之倒之，自公召之。东方未晞，颠倒裳衣。倒之颠之，自公令之。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。\",\"sourceLabel\":\"第 210-212 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"东方未明，颠倒衣裳。颠之倒之，自公召之。\",\"fullText\":\"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止 雖只言其興之早，已見得他日不免又太晚意，故曰無節。玩末章『不夙則莫』一句可見。」此又就緩之無節者言之。總之，爲政無節，緩急均有所害。蓋奉令莫知所從，則玩心生而怠氣亦乘，政於是乎不可爲矣。不然，未明而起，爲政之常，何刺之有？詩固詳言其急，而緩自見焉耳。惟「折柳」二句，插入不倫，故姚氏以爲難詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《東方未明》三章，章四句。此詩刺無節，亦必有所指。但《序》無據，故不可考。蘇氏轍曰：「爲政必有節，及其節而爲之，則用力少而事舉。苟爲無節，緩急皆所以害政也。夫『東方未明』，起而顛倒其衣裳，可謂急矣。然猶有以爲緩。而『自公召之』者，則政將何以堪之？」此就急之無節者言之也。黄氏佐曰：「此雖只言其興之早，已見得他日不免又太晚意，故曰無節。玩末章『不夙則莫』一句可見。」此又就緩之無節者言之。總之，爲政無節，緩急均有所害。蓋奉令莫知所從，則玩心生而怠氣亦乘，政於是乎不可爲矣。不然，未明而起，爲政之常，何刺之有？詩固詳言其急，而緩自見焉耳。惟「折柳」二句，插入不倫，故姚氏以爲難詳。\",\"fullText\":\"右《東方未明》三章，章四句。此詩刺無節，亦必有所指。但《序》無據，故不可考。蘇氏轍曰：「爲政必有節，及其節而爲之，則用力少而事舉。苟爲無節，緩急皆所以害政也。夫『東方未明』，起而顛倒其衣裳，可謂急矣。然猶有以爲緩。而『自公召之』者，則政將何以堪之？」此就急之無節者言之也。黄氏佐曰：「此雖只言其興之早，已見得他日不免又太晚意，故曰無節。玩末章『不夙則莫』一句可見。」此又就緩之無節者言之。總之，爲政無節，緩急均有所害。蓋奉令莫知所從，則玩心生而怠氣亦乘，政於是乎不可爲矣。不然，未明而起，爲政之常，何刺之有？詩固詳言其急，而緩自見焉耳。惟「折柳」二句，插入不倫，故姚氏以爲難詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"晞明之始升也。〔孔氏穎達曰〕晞是日之光氣。《湛露》云「匪陽不晞」，謂見日之光而始乾，故以晞爲乾。《蒹葭》云「白露未晞」，言露在朝旦，未見日氣，故亦爲乾義。此無取於乾。故言明之始升，謂將旦時日之光氣始升也。柳〔許氏慎曰〕柳，小楊也。樊藩也。圃菜園也。〔郭璞曰〕謂藩籬也。種菜之地謂之圃，其外樊籬謂之園。瞿瞿驚顧之貌。〔程子曰〕柳，柔脆之物，折之以爲藩籬，非堅固也。狂夫亦知其有限，見之則躩然而驚。晝夜之限非不明也，乃不能知，而不早則晏，言無節之甚。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"晞明之始升也。〔孔氏穎達曰〕晞是日之光氣。《湛露》云「匪陽不晞」，謂見日之光而始乾，故以晞爲乾。《蒹葭》云「白露未晞」，言露在朝旦，未見日氣，故亦爲乾義。此無取於乾。故言明之始升，謂將旦時日之光氣始升也。\",\"fullText\":\"晞明之始升也。〔孔氏穎達曰〕晞是日之光氣。《湛露》云「匪陽不晞」，謂見日之光而始乾，故以晞爲乾。《蒹葭》云「白露未晞」，言露在朝旦，未見日氣，故亦爲乾義。此無取於乾。故言明之始升，謂將旦時日之光氣始升也。柳〔許氏慎曰〕柳，小楊也。樊藩也。圃菜園也。〔郭璞曰〕謂藩籬也。種菜之地謂之圃，其外樊籬謂之園。瞿瞿驚顧之貌。〔程子曰〕柳，柔脆之物，折之以爲藩籬，非堅固也。狂夫亦知其有限，見之則躩然而驚。晝夜之限非不明也，乃不能知，而不早則晏，言無節之甚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\" engjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:2-2:夙\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"夙\",\"charStart\":2,\"charEnd\":2,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:4-4:莫\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"莫\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方未明，颠倒衣裳。颠之倒之，自公召之。东方未晞，颠倒裳衣。倒之颠之，自公令之。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。\",\"sourceLabel\":\"第 210-212 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止乎礼义。情之发，因辞以形之；礼义之侣，须事以明之，故有赋焉，所以假象尽辞，敷陈其志。”赋的手法，在曲尽其妙的铺陈描绘中，也表达了作者的感情。即如此诗，对“狂夫”的行为描写越是生动，妻子那种怨恨不已而又无可奈何的心情不是就越发明显了吗？\",\"fullText\":\"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止乎礼义。情之发，因辞以形之；礼义之侣，须事以明之，故有赋焉，所以假象尽辞，敷陈其志。”赋的手法，在曲尽其妙的铺陈描绘中，也表达了作者的感情。即如此诗，对“狂夫”的行为描写越是生动，妻子那种怨恨不已而又无可奈何的心情不是就越发明显了吗？东方未明，颠倒衣裳。颠之倒之，自公召之。颠倒，双声。颠倒衣裳，意为急于起身，连衣和裳都穿颠倒了。之，指衣裳。公，公所。召，召唤。东方未晞，颠倒裳衣。倒之颠之，自公令之。晞，昕的假借字，且明，日将出也。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。樊，篱笆，这里作动词“围”字用。圃，菜园。狂夫，女子骂她的丈夫。瞿瞿，双眼瞪视貌。辰，与晨通。夙，早。莫，同“暮”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方未明，颠倒衣裳。颠之倒之，自公召之。东方未晞，颠倒裳衣。倒之颠之，自公令之。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。\",\"sourceLabel\":\"第 210-212 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"东方未明，颠倒衣裳。颠之倒之，自公召之。\",\"fullText\":\"这是写一位妇女的当小官吏的丈夫忙于公事早夜不得休息的诗。后世注家对这首诗的主题说法不一。毛序和朱传都认为是讽刺“朝廷兴居无节，号令不时”的诗，姚际恒以为“难详”，方玉润认为“‘折柳’二句插入不伦”可见这首诗不易解释。闻一多《风诗类钞》曰：“夫之在家，从不能守夜之正时，非出太早，即归太晚。妇人称夫曰狂夫。”他以为诗以妇女的口吻，写出丈夫为吏的忙碌。这样解释比较通顺。否则第三章无法理解。如果把狂夫说成是监视小官吏者，末二句又联系不上了。还是以闻先生的解释为最优。此诗通篇用赋体，把一个忙忙碌碌而又心胸狭隘的小官吏的神态刻画得很生动。尤其是“颠倒衣裳”一句，以手忙脚乱、穿错衣衫的动作写出人物的辛苦颇为传神。末章“狂夫瞿瞿”的“瞿瞿”二字描摹瞪大眼睛瞧不停的神态以反映丈夫对妻子不放心的心理，也很细致入微。挚虞《文章流别论》说：“古之作诗者，发乎情，止乎礼义。情之发，因辞以形之；礼义之侣，须事以明之，故有赋焉，所以假象尽辞，敷陈其志。”赋的手法，在曲尽其妙的铺陈描绘中，也表达了作者的感情。即如此诗，对“狂夫”的行为描写越是生动，妻子那种怨恨不已而又无可奈何的心情不是就越发明显了吗？东方未明，颠倒衣裳。颠之倒之，自公召之。颠倒，双声。颠倒衣裳，意为急于起身，连衣和裳都穿颠倒了。之，指衣裳。公，公所。召，召唤。东方未晞，颠倒裳衣。倒之颠之，自公令之。晞，昕的假借字，且明，日将出也。折柳樊圃，狂夫瞿瞿。不能辰夜，不夙则莫。樊，篱笆，这里作动词“围”字用。圃，菜园。狂夫，女子骂她的丈夫。瞿瞿，双眼瞪视貌。辰，与晨通。夙，早。莫，同“暮”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:东方未明\",\"seg-002:1-4:颠倒衣裳\",\"seg-003:1-4:颠之倒之\",\"seg-004:1-4 瞿，双眼瞪视貌。辰，与晨通。夙，早。莫，同“暮”。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-009:3-3:樊\",\"seg-009:4-4:圃\",\"seg-010:1-2:狂夫\",\"seg-010:3-4:瞿瞿\",\"seg-011:3-3:辰\",\"seg-012:2-2:夙\",\"seg-012:4-4:莫\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\",\"anchor-7-6\",\"anchor-7-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺無節也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺無節也。\",\"fullText\":\"刺無節也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《東方未明》三章，章四句。此詩刺無節，亦必有所指。但《序》無據，故不可考。蘇氏轍曰：「爲政必有節，及其節而爲之，則用力少而事舉。苟爲無節，緩急皆所以害政也。夫『東方未明』，起而顛倒其衣裳，可謂急矣。然猶有以爲緩。而『自公召之』者，則政將何以堪之？」此就急之無節者言之也。黄氏佐曰：「此雖只言其興之早，已見得他日不免又太晚意，故曰無節。玩末章『不夙則莫』一句可見。」此又就緩之無節者言之。總之，爲政無節，緩急均有所害。蓋奉令莫知所從，則玩心生而怠氣亦乘，政於是乎不可爲矣。不然，未明而起，爲政之常，何刺之有？詩固詳言其急，而緩自見焉耳。惟「折柳」二句，插入不倫，故姚氏以爲難詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《東方未明》三章，章四句。此詩刺無節，亦必有所指。但《序》無據，故不可考。蘇氏轍曰：「爲政必有節，及其節而爲之，則用力少而事舉。苟爲無節，緩急皆所以害政也。夫『東方未明』，起而顛倒其衣裳，可謂急矣。然猶有以爲緩。而『自公召之』者，則政將何以堪之？」此就急之無節者言之也。黄氏佐曰：「此雖只言其興之早，已見得他日不免又太晚意，故曰無節。玩末章『不夙則莫』一句可見。」此又就緩之無節者言之。總之，爲政無節，緩急均有所害。蓋奉令莫知所從，則玩心生而怠氣亦乘，政於是乎不可爲矣。不然，未明而起，爲政之常，何刺之有？詩固詳言其急，而緩自見焉耳。惟「折柳」二句，插入不倫，故姚氏以爲難詳。\",\"fullText\":\"右《東方未明》三章，章四句。此詩刺無節，亦必有所指。但《序》無據，故不可考。蘇氏轍曰：「爲政必有節，及其節而爲之，則用力少而事舉。苟爲無節，緩急皆所以害政也。夫『東方未明』，起而顛倒其衣裳，可謂急矣。然猶有以爲緩。而『自公召之』者，則政將何以堪之？」此就急之無節者言之也。黄氏佐曰：「此雖只言其興之早，已見得他日不免又太晚意，故曰無節。玩末章『不夙則莫』一句可見。」此又就緩之無節者言之。總之，爲政無節，緩急均有所害。蓋奉令莫知所從，則玩心生而怠氣亦乘，政於是乎不可爲矣。不然，未明而起，爲政之常，何刺之有？詩固詳言其急，而緩自見焉耳。惟「折柳」二句，插入不倫，故姚氏以爲難詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"晞明之始升也。〔孔氏穎達曰〕晞是日之光氣。《湛露》云「匪陽不晞」，謂見日之光而始乾，故以晞爲乾。《蒹葭》云「白露未晞」，言露在朝旦，未見日氣，故亦爲乾義。此無取於乾。故言明之始升，謂將旦時日之光氣始升也。柳〔許氏慎曰〕柳，小楊也。樊藩也。圃菜園也。〔郭璞曰〕謂藩籬也。種菜之地謂之圃，其外樊籬謂之園。瞿瞿驚顧之貌。〔程子曰〕柳，柔脆之物，折之以爲藩籬，非堅固也。狂夫亦知其有限，見之則躩然而驚。晝夜之限非不明也，乃不能知，而不早則晏，言無節之甚。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"晞明之始升也。〔孔氏穎達曰〕晞是日之光氣。《湛露》云「匪陽不晞」，謂見日之光而始乾，故以晞爲乾。《蒹葭》云「白露未晞」，言露在朝旦，未見日氣，故亦爲乾義。此無取於乾。故言明之始升，謂將旦時日之光氣始升也。\",\"fullText\":\"晞明之始升也。〔孔氏穎達曰〕晞是日之光氣。《湛露》云「匪陽不晞」，謂見日之光而始乾，故以晞爲乾。《蒹葭》云「白露未晞」，言露在朝旦，未見日氣，故亦爲乾義。此無取於乾。故言明之始升，謂將旦時日之光氣始升也。柳〔許氏慎曰〕柳，小楊也。樊藩也。圃菜園也。〔郭璞曰〕謂藩籬也。種菜之地謂之圃，其外樊籬謂之園。瞿瞿驚顧之貌。〔程子曰〕柳，柔脆之物，折之以爲藩籬，非堅固也。狂夫亦知其有限，見之則躩然而驚。晝夜之限非不明也，乃不能知，而不早則晏，言無節之甚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/100-dong-fang-wei-ming/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"晞明之始升也。〔孔氏穎達曰〕晞是
