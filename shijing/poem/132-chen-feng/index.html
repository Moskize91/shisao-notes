:‘百里莫!五羊皮。忆别离，烹伏雌，炊庚廖 。今富贵，忘我为?'问之，乃其故妻，遂还为夫妇 。\"","fullText":"解】 这是一位妇女疑心丈夫遗弃她的诗 。毛序:\"晨风，刺康公脂部一一穴、栗 也。忘穆公之业，始弃其贤臣焉 。\"毛传:\"先君招贤人，贤人往之，驶疾如晨风之飞入北林 。\"郑笼:\"先君谓壁金 。言望尘始未见贤者之时，思望而忧之 。\"据主、远意，诗每章前四句言望全思贤，后二句言康公弃贤。这样解释，总觉诗意跳跃太远，有割裂之感 。朱裹诗集传:\"此与庚廖 (γðn yí)之歌同意，盖秦俗也 。\"所谓庚廖之歌是这样的:\"百里案为秦相，堂上乐作 。所赁洗妇自言知音 。因援琴抚弦而歌曰:‘百里莫!五羊皮。忆别离，烹伏雌，炊庚廖 。今富贵，忘我为?'问之，乃其故妻，遂还为夫妇 。\"","notes":null,"partOrder":1,"anchorIds":["seg-001:3-4:晨风"],"glossAnchorIds":["anchor-1-1"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-2:part-1","annotationId":"0001","glossId":"0001-2","glossHref":"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-2","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。","sourceLabel":"第 296-300 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"解说","excerpt":"诗 (庚廖即今之门柱)据此，晨风便是妇人思念丈夫以至于怨恨的在诗了 。方玉润说:\"男女情与君臣义原本相通，诗既不露其旨，人固难以意测 。\"他的话也有道理 。不过从诗本身的情调来看，似乎还是朱慕的说法更切近一些。","fullText":"诗 (庚廖即今之门柱)据此，晨风便是妇人思念丈夫以至于怨恨的在诗了 。方玉润说:\"男女情与君臣义原本相通，诗既不露其旨，人固难以意测 。\"他的话也有道理 。不过从诗本身的情调来看，似乎还是朱慕的说法更切近一些。","notes":null,"partOrder":1,"anchorIds":["seg-001:3-4:晨风"],"glossAnchorIds":["anchor-1-1"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-3:part-1","annotationId":"0001","glossId":"0001-3","glossHref":"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-3","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。","sourceLabel":"第 296-300 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"附记","excerpt":"吴阁生诗义会通说:\"旧评:末句酝藉 。\"这是依毛序立论 。其实，末句口吻是相当直露的，怨艾之气溢于言表，体现了这位妇女痛苦而无可奈何的心情。又，夫妻而至于淡然相忘，那这对夫妻也是名存实亡的了 。从这一点来说，“忘我实多”一句包含了多少痛苦的回忆也可以称得上“酝藉”二字了 。","fullText":"吴阁生诗义会通说:\"旧评:末句酝藉 。\"这是依毛序立论 。其实，末句口吻是相当直露的，怨艾之气溢于言表，体现了这位妇女痛苦而无可奈何的心情。又，夫妻而至于淡然相忘，那这对夫妻也是名存实亡的了 。从这一点来说，“忘我实多”一句包含了多少痛苦的回忆也可以称得上“酝藉”二字了 。","notes":null,"partOrder":1,"anchorIds":["seg-018:1-4:忘我实多"],"glossAnchorIds":["anchor-1-1"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"晨風㊟未詳。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"晨風㊟未詳。","fullText":"晨風㊟未詳。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"右《晨风》","excerpt":"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。","fullText":"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。","fullText":"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"标韵","excerpt":"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。","fullText":"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]}]}}}</script><script id="__SHIJING_POEM_STRUCTURED_DATA__" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://shisao.taozeyu.com/shijing/#website","name":"诗骚集注","url":"https://shisao.taozeyu.com/shijing/","inLa i:0001-1:part-1\",\"chengjunying-jiangjianyuan-zhuxi:0001-2:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-4:忘我实多\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"忘我实多\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-3:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。\",\"sourceLabel\":\"第 296-300 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"解\",\"excerpt\":\"解】 这是一位妇女疑心丈夫遗弃她的诗 。毛序:\\\"晨风，刺康公脂部一一穴、栗 也。忘穆公之业，始弃其贤臣焉 。\\\"毛传:\\\"先君招贤人，贤人往之，驶疾如晨风之飞入北林 。\\\"郑笼:\\\"先君谓壁金 。言望尘始未见贤者之时，思望而忧之 。\\\"据主、远意，诗每章前四句言望全思贤，后二句言康公弃贤。这样解释，总觉诗意跳跃太远，有割裂之感 。朱裹诗集传:\\\"此与庚廖 (γðn yí)之歌同意，盖秦俗也 。\\\"所谓庚廖之歌是这样的:\\\"百里案为秦相，堂上乐作 。所赁洗妇自言知音 。因援琴抚弦而歌曰:‘百里莫!五羊皮。忆别离，烹伏雌，炊庚廖 。今富贵，忘我为?'问之，乃其故妻，遂还为夫妇 。\\\"\",\"fullText\":\"解】 这是一位妇女疑心丈夫遗弃她的诗 。毛序:\\\"晨风，刺康公脂部一一穴、栗 也。忘穆公之业，始弃其贤臣焉 。\\\"毛传:\\\"先君招贤人，贤人往之，驶疾如晨风之飞入北林 。\\\"郑笼:\\\"先君谓壁金 。言望尘始未见贤者之时，思望而忧之 。\\\"据主、远意，诗每章前四句言望全思贤，后二句言康公弃贤。这样解释，总觉诗意跳跃太远，有割裂之感 。朱裹诗集传:\\\"此与庚廖 (γðn yí)之歌同意，盖秦俗也 。\\\"所谓庚廖之歌是这样的:\\\"百里案为秦相，堂上乐作 。所赁洗妇自言知音 。因援琴抚弦而歌曰:‘百里莫!五羊皮。忆别离，烹伏雌，炊庚廖 。今富贵，忘我为?'问之，乃其故妻，遂还为夫妇 。\\\"\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-4:晨风\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-2:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-2\",\"glossHref\":\"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-2\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。\",\"sourceLabel\":\"第 296-300 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"解说\",\"excerpt\":\"诗 (庚廖即今之门柱)据此，晨风便是妇人思念丈夫以至于怨恨的在诗了 。方玉润说:\\\"男女情与君臣义原本相通，诗既不露其旨，人固难以意测 。\\\"他的话也有道理 。不过从诗本身的情调来看，似乎还是朱慕的说法更切近一些。\",\"fullText\":\"诗 (庚廖即今之门柱)据此，晨风便是妇人思念丈夫以至于怨恨的在诗了 。方玉润说:\\\"男女情与君臣义原本相通，诗既不露其旨，人固难以意测 。\\\"他的话也有道理 。不过从诗本身的情调来看，似乎还是朱慕的说法更切近一些。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-4:晨风\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-3:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-3\",\"glossHref\":\"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-3\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。\",\"sourceLabel\":\"第 296-300 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"附记\",\"excerpt\":\"吴阁生诗义会通说:\\\"旧评:末句酝藉 。\\\"这是依毛序立论 。其实，末句口吻是相当直露的，怨艾之气溢于言表，体现了这位妇女痛苦而无可奈何的心情。又，夫妻而至于淡然相忘，那这对夫妻也是名存实亡的了 。从这一点来说，“忘我实多”一句包含了多少痛苦的回忆也可以称得上“酝藉”二字了 。\",\"fullText\":\"吴阁生诗义会通说:\\\"旧评:末句酝藉 。\\\"这是依毛序立论 。其实，末句口吻是相当直露的，怨艾之气溢于言表，体现了这位妇女痛苦而无可奈何的心情。又，夫妻而至于淡然相忘，那这对夫妻也是名存实亡的了 。从这一点来说，“忘我实多”一句包含了多少痛苦的回忆也可以称得上“酝藉”二字了 。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-018:1-4:忘我实多\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"晨風㊟未詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"晨風㊟未詳。\",\"fullText\":\"晨風㊟未詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"右《晨风》\",\"excerpt\":\"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。\",\"fullText\":\"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。\",\"fullText\":\"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。\",\"fullText\":\"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}}"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"script\",null,{\"id\":\"__SHIJING_PAGE_DATA__\",\"type\":\"application/json\",\"data-page-kind\":\"poem-detail\",\"data-page-href\":\"/shijing/poem/132-chen-feng\",\"data-page-data-href\":\"/__data/shijing/poem/132-chen-feng/data.json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1d\"}}],\"$L1e\",\"$L1f\"]\n"])</script><script>self.__next_f.push([1, tryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chengjunying-jiangjianyuan-zhuxi:0001-2:part-1\",\"chengjunying-jiangjianyuan-zhuxi:0001-3:part-1\"],\"characters\":[{\"index\":1,\"text\":\"忘\",\"anchorIds\":[\"seg-018:1-4:忘我实多\"]},{\"index\":2,\"text\":\"我\",\"anchorIds\":[\"seg-018:1-4:忘我实多\"]},{\"index\":3,\"text\":\"实\",\"anchorIds\":[\"seg-018:1-4:忘我实多\"]},{\"index\":4,\"text\":\"多\",\"anchorIds\":[\"seg-018:1-4:忘我实多\"]}]}]},\"materials\":[{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":3,\"partCount\":3}],\"stats\":{\"materialCount\":2,\"glossCount\":7,\"anchoredPartCount\":3,\"overviewPartCount\":4},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"fangyurun-yuanshi:0004-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-001:3-4:晨风\",\"segmentId\":\"seg-001\",\"segmentOrder\":1,\"surfaceText\":\"晨风\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chengjunying-jiangjianyuan-zhuxi:0001-2:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-4:忘我实多\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"忘我实多\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-3:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。\",\"sourceLabel\":\"第 296-300 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"解\",\"excerpt\":\"解】 这是一位妇女疑心丈夫遗弃她的诗 。毛序:\\\"晨风，刺康公脂部一一穴、栗 也。忘穆公之业，始弃其贤臣焉 。\\\"毛传:\\\"先君招贤人，贤人往之，驶疾如晨风之飞入北林 。\\\"郑笼:\\\"先君谓壁金 。言望尘始未见贤者之时，思望而忧之 。\\\"据主、远意，诗每章前四句言望全思贤，后二句言康公弃贤。这样解释，总觉诗意跳跃太远，有割裂之感 。朱裹诗集传:\\\"此与庚廖 (γðn yí)之歌同意，盖秦俗也 。\\\"所谓庚廖之歌是这样的:\\\"百里案为秦相，堂上乐作 。所赁洗妇自言知音 。因援琴抚弦而歌曰:‘百里莫!五羊皮。忆别离，烹伏雌，炊庚廖 。今富贵，忘我为?'问之，乃其故妻，遂还为夫妇 。\\\"\",\"fullText\":\"解】 这是一位妇女疑心丈夫遗弃她的诗 。毛序:\\\"晨风，刺康公脂部一一穴、栗 也。忘穆公之业，始弃其贤臣焉 。\\\"毛传:\\\"先君招贤人，贤人往之，驶疾如晨风之飞入北林 。\\\"郑笼:\\\"先君谓壁金 。言望尘始未见贤者之时，思望而忧之 。\\\"据主、远意，诗每章前四句言望全思贤，后二句言康公弃贤。这样解释，总觉诗意跳跃太远，有割裂之感 。朱裹诗集传:\\\"此与庚廖 (γðn yí)之歌同意，盖秦俗也 。\\\"所谓庚廖之歌是这样的:\\\"百里案为秦相，堂上乐作 。所赁洗妇自言知音 。因援琴抚弦而歌曰:‘百里莫!五羊皮。忆别离，烹伏雌，炊庚廖 。今富贵，忘我为?'问之，乃其故妻，遂还为夫妇 。\\\"\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-4:晨风\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-2:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-2\",\"glossHref\":\"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-2\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。\",\"sourceLabel\":\"第 296-300 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"解说\",\"excerpt\":\"诗 (庚廖即今之门柱)据此，晨风便是妇人思念丈夫以至于怨恨的在诗了 。方玉润说:\\\"男女情与君臣义原本相通，诗既不露其旨，人固难以意测 。\\\"他的话也有道理 。不过从诗本身的情调来看，似乎还是朱慕的说法更切近一些。\",\"fullText\":\"诗 (庚廖即今之门柱)据此，晨风便是妇人思念丈夫以至于怨恨的在诗了 。方玉润说:\\\"男女情与君臣义原本相通，诗既不露其旨，人固难以意测 。\\\"他的话也有道理 。不过从诗本身的情调来看，似乎还是朱慕的说法更切近一些。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-4:晨风\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-3:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-3\",\"glossHref\":\"/shijing/gloss/132-chen-feng/chengjunying-jiangjianyuan-zhuxi/0001-3\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"歇彼晨风，郁彼北林。未见君子，忧心钦钦。如何如何？忘我实多。\\n山有苞栋，隐有六驳。未见君子，忧心靡乐。如何如何？忘我实多。\\n山有苞橡，隐有树楼。未见君子，忧心如醉。如何如何？忘我实多。\",\"sourceLabel\":\"第 296-300 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"附记\",\"excerpt\":\"吴阁生诗义会通说:\\\"旧评:末句酝藉 。\\\"这是依毛序立论 。其实，末句口吻是相当直露的，怨艾之气溢于言表，体现了这位妇女痛苦而无可奈何的心情。又，夫妻而至于淡然相忘，那这对夫妻也是名存实亡的了 。从这一点来说，“忘我实多”一句包含了多少痛苦的回忆也可以称得上“酝藉”二字了 。\",\"fullText\":\"吴阁生诗义会通说:\\\"旧评:末句酝藉 。\\\"这是依毛序立论 。其实，末句口吻是相当直露的，怨艾之气溢于言表，体现了这位妇女痛苦而无可奈何的心情。又，夫妻而至于淡然相忘，那这对夫妻也是名存实亡的了 。从这一点来说，“忘我实多”一句包含了多少痛苦的回忆也可以称得上“酝藉”二字了 。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-018:1-4:忘我实多\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"晨風㊟未詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"晨風㊟未詳。\",\"fullText\":\"晨風㊟未詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"右《晨风》\",\"excerpt\":\"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。\",\"fullText\":\"右《晨風》三章，章六句。《序》謂「康公棄其賢臣」，僞傳謂「秦君遇賢，始勤終怠」。二説未甚相遠。惟《集傳》則以爲婦人念其君子之詞，又引《扊扅歌》以證秦俗，與古《序》大相反。今觀詩詞，以爲刺康公者固無據，以爲婦人思夫者亦未足憑。總之，男女情與君臣義，原本相通。詩既不露其旨，人固難以意測。與其妄逞臆説，不如闕疑存參。且其詩無甚精義，置焉可也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。\",\"fullText\":\"集釋鴥疾飛貌。晨風鸇也。鬱茂盛貌。欽欽憂而不忘之貌。駁〔《集傳》〕駁，梓榆也。其色青白如駁。檖〔郭氏璞曰〕今楊檖也。〔《集傳》〕檖，赤羅也。實似梨而小，酢可食。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/132-chen-feng/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。\",\"fullText\":\"標韻風一東，叶孚愔反。林十二侵。欽同。叶韻。何五歌。多同。本韻。櫟十二錫，叶奪名反。駁三覺。樂十藥。叶韻。棣八霽。檖四寘。醉同。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"晨風 · 逐字注脚阅读 | 诗骚集注\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"風 · 秦風 · 汇聚 2 种资料、7 条注脚的《晨風》阅读页。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"3\",{\"name\":\"googlebot\",\"content\":\"index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1\"}],[\"$\",\"link\",\"4\",{\"rel\":\"canonical\",\"href\":\"https://shisao.taozeyu.com/shijing/poem/132-chen-feng/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"晨風 · 逐字注脚阅读\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"風 · 秦風 · 汇聚 2 种资料、7 条注脚的《晨風》阅读页。\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:url\",\"content\":\"https://shisao.taozeyu.com/shijing/poem/132-chen-feng/\"}],[\"$\",\"m
