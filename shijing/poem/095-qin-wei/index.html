-5:赠之以勺药","segmentId":"seg-028","segmentOrder":28,"surfaceText":"赠之以勺药","charStart":1,"charEnd":5,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-4"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-028:5-5:药","segmentId":"seg-028","segmentOrder":28,"surfaceText":"药","charStart":5,"charEnd":5,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/095-qin-wei/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。","sourceLabel":"第 202-203 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。","fullText":"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱、洧，郑国二水名。见褰裳注。涣涣，水流盛大貌。郑笺：“仲春冰释，水则涣涣然。”韩诗作洹，云：“洹，盛貌。谓三月桃花水下之时至盛也。”齐诗作灌，鲁诗作汎。洹是正字，汎为洹之重文，涣、灌均假借字。士与女，同下文的“维士与女”都是泛指春游的男男女女，下句的“女曰”和“士曰”则专指某一女子和男子。方，正。秉，执、拿。有人解作佩戴，亦通。蕳（jiān），亦名兰，是一种著名的香草，古人用来或沐浴，或泽头，或佩身，以拂除不祥。李时珍《本草纲目》：“蕳，即今省头草。”既，已经。且（cú），但的借字，往、去。这二句意为，女的说：“去看看吗？”男的说：“已经去过了。”且，姑且。这句是女要约男的：“姑且再去看看吧。”洵，确实。訏（xū），广大。这里指洧水岸边地方的宽广。按以上三句为女子说的话，鼓动男的陪她去游春。维，语助词，无义。伊，嬉的假借字，嬉笑貌。伊其，即伊伊。相谑，互相调笑。勺药，又名芍药。这里指的是草芍药，不是花如牡丹的木芍药。古时候情人在“将离”时互赠此草，寄托即将离别的情怀。又古代勺与约同声，勺药是双声词，情人借此表爱和结良约的意思。韵读：元部——涣、蕳。鱼部——乎、且、乎。宵部——乐、谑、药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。浏，水清貌。殷，人众多貌。将谑，马瑞辰《通释》：“将谑犹相谑也。”朱熹《诗集传》：“将，当作相，声之误也。”韵读：耕部——清、盈。鱼部——乎、且、乎。宵部——乐、谑、药。","notes":null,"partOrder":1,"anchorIds":["seg-004:2-3:秉蕳"],"glossAnchorIds":["anchor-1-1"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024","seg-025","seg-026","seg-027","seg-028"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/095-qin-wei/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。","sourceLabel":"第 202-203 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。","fullText":"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才 glossId":"0001-1","glossHref":"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"刺淫也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"刺淫也。","fullText":"刺淫也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？","fullText":"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yu anyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。\",\"sourceLabel\":\"第 202-203 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。\",\"fullText\":\"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱、洧，郑国二水名。见褰裳注。涣涣，水流盛大貌。郑笺：“仲春冰释，水则涣涣然。”韩诗作洹，云：“洹，盛貌。谓三月桃花水下之时至盛也。”齐诗作灌，鲁诗作汎。洹是正字，汎为洹之重文，涣、灌均假借字。士与女，同下文的“维士与女”都是泛指春游的男男女女，下句的“女曰”和“士曰”则专指某一女子和男子。方，正。秉，执、拿。有人解作佩戴，亦通。蕳（jiān），亦名兰，是一种著名的香草，古人用来或沐浴，或泽头，或佩身，以拂除不祥。李时珍《本草纲目》：“蕳，即今省头草。”既，已经。且（cú），但的借字，往、去。这二句意为，女的说：“去看看吗？”男的说：“已经去过了。”且，姑且。这句是女要约男的：“姑且再去看看吧。”洵，确实。訏（xū），广大。这里指洧水岸边地方的宽广。按以上三句为女子说的话，鼓动男的陪她去游春。维，语助词，无义。伊，嬉的假借字，嬉笑貌。伊其，即伊伊。相谑，互相调笑。勺药，又名芍药。这里指的是草芍药，不是花如牡丹的木芍药。古时候情人在“将离”时互赠此草，寄托即将离别的情怀。又古代勺与约同声，勺药是双声词，情人借此表爱和结良约的意思。韵读：元部——涣、蕳。鱼部——乎、且、乎。宵部——乐、谑、药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。浏，水清貌。殷，人众多貌。将谑，马瑞辰《通释》：“将谑犹相谑也。”朱熹《诗集传》：“将，当作相，声之误也。”韵读：耕部——清、盈。鱼部——乎、且、乎。宵部——乐、谑、药。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-004:2-3:秉蕳\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。\",\"sourceLabel\":\"第 202-203 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。\",\"fullText\":\"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱、洧，郑国二水名。见褰裳注。涣涣，水流盛大貌。郑笺：“仲春冰释，水则涣涣然。”韩诗作洹，云：“洹，盛貌。谓三月桃花 ,\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。\",\"sourceLabel\":\"第 202-203 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"浏，水清貌。殷，人众多貌。将谑，马瑞辰《通释》：“将谑犹相谑也。”朱熹《诗集传》：“将，当作相，声之误也。”韵读：耕部——清、盈。鱼部——乎、且、乎。宵部——乐、谑、药。\",\"fullText\":\"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱、洧，郑国二水名。见褰裳注。涣涣，水流盛大貌。郑笺：“仲春冰释，水则涣涣然。”韩诗作洹，云：“洹，盛貌。谓三月桃花水下之时至盛也。”齐诗作灌，鲁诗作汎。洹是正字，汎为洹之重文，涣、灌均假借字。士与女，同下文的“维士与女”都是泛指春游的男男女女，下句的“女曰”和“士曰”则专指某一女子和男子。方，正。秉，执、拿。有人解作佩戴，亦通。蕳（jiān），亦名兰，是一种著名的香草，古人用来或沐浴，或泽头，或佩身，以拂除不祥。李时珍《本草纲目》：“蕳，即今省头草。”既，已经。且（cú），但的借字，往、去。这二句意为，女的说：“去看看吗？”男的说：“已经去过了。”且，姑且。这句是女要约男的：“姑且再去看看吧。”洵，确实。訏（xū），广大。这里指洧水岸边地方的宽广。按以上三句为女子说的话，鼓动男的陪她去游春。维，语助词，无义。伊，嬉的假借字，嬉笑貌。伊其，即伊伊。相谑，互相调笑。勺药，又名芍药。这里指的是草芍药，不是花如牡丹的木芍药。古时候情人在“将离”时互赠此草，寄托即将离别的情怀。又古代勺与约同声，勺药是双声词，情人借此表爱和结良约的意思。韵读：元部——涣、蕳。鱼部——乎、且、乎。宵部——乐、谑、药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。浏，水清貌。殷，人众多貌。将谑，马瑞辰《通释》：“将谑犹相谑也。”朱熹《诗集传》：“将，当作相，声之误也。”韵读：耕部——清、盈。鱼部——乎、且、乎。宵部——乐、谑、药。\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[\"seg-016:1-1:浏\",\"seg-018:1-1:殷\",\"seg-027:3-4:将谑\",\"seg-016:3-3:清\",\"seg-018:3-3:盈\",\"seg-025:4-4:乐\",\"seg-027:4-4:谑\",\"seg-028:5-5:药\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\",\"anchor-5-4\",\"anchor-5-5\",\"anchor-5-6\",\"anchor-5-7\",\"anchor-5-8\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺淫也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺淫也。\",\"fullText\":\"刺淫也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？\",\"fullText\":\"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。秉蕳〔陸氏璣曰〕蕳即蘭，香草也。〔姚氏際恒曰〕秉蕳者，《禮·内則》「佩帨、茞蘭」，「男女皆佩容臭」也。秉者，身秉之，不必定是手執也。《集傳》以秉蕳爲采蘭，尤誤。蘭生谷中，豈生水中乎？且手中既秉蕳，又秉勺以贈，亦不合矣。勺藥〔劉氏瑾曰〕《本草》注曰：「勺藥有二種，有草勺藥，有木勺藥。」〔姚氏際恒曰〕《集傳》又謂「勺藥，香草也」，亦謬。勺藥即今牡丹，古名勺藥。自唐玄宗始得木勺藥于宫中，因呼牡丹。其花香，根葉不香，何得混云香草乎？〔案〕後説即所謂木勺藥也。瀏深貌。殷衆也。將相將也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。\",\"fullText\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。秉蕳〔陸氏璣曰〕蕳即蘭，香草也。〔姚氏際恒曰〕秉蕳者，《禮·内則》「佩帨、茞蘭」，「男女皆佩容臭」也。秉者，身秉之，不必定是手執也。《集傳》以秉蕳爲采蘭，尤誤。蘭生谷中，豈生水中乎？且手中既秉蕳，又秉勺以贈，亦不合矣。勺藥〔劉氏瑾曰〕《本草》注曰：「勺藥有二種，有草勺藥，有木勺藥。」〔姚氏際恒曰〕《集傳》又謂「勺藥，香草也」，亦謬。勺藥即今牡丹，古名勺藥。自唐玄宗始得木勺藥于宫中，因呼牡丹。其花香，根葉不香，何得混云香草乎？〔案〕後説即所謂木勺藥也。瀏深貌。殷衆也。將相將也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\" ]},{\"@type\":\"WebPage\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/095-qin-wei/#webpage\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/095-qin-wei/\",\"name\":\"溱洧 · 逐字注脚阅读\",\"description\":\"風 · 鄭風 · 汇聚 2 种资料、5 条注脚的《溱洧》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/095-qin-wei/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/095-qin-wei/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tdb2,"])</script><script>self.__next_f.push([1,"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱、洧，郑国二水名。见褰裳注。涣涣，水流盛大貌。郑笺：“仲春冰释，水则涣涣然。”韩诗作洹，云：“洹，盛貌。谓三月桃花水下之时至盛也。”齐诗作灌，鲁诗作汎。洹是正字，汎为洹之重文，涣、灌均假借字。士与女，同下文的“维士与女”都是泛指春游的男男女女，下句的“女曰”和“士曰”则专指某一女子和男子。方，正。秉，执、拿。有人解作佩戴，亦通。蕳（jiān），亦名兰，是一种著名的香草，古人用来或沐浴，或泽头，或佩身，以拂除不祥。李时珍《本草纲目》：“蕳，即今省头草。”既，已经。且（cú），但的借字，往、去。这二句意为，女的说：“去看看吗？”男的说：“已经去过了。”且，姑且。这句是女要约男的：“姑且再去看看吧。”洵，确实。訏（xū），广大。这里指洧水岸边地方的宽广。按以上三句为女子说的话，鼓动男的陪她去游春。维，语助词，无义。伊，嬉的假借字，嬉笑貌。伊其，即伊伊。相谑，互相调笑。勺药，又名芍药。这里指的是草芍药，不是花如牡丹的木芍药。古时候情人在“将离”时互赠此草，寄托即将离别的情怀。又古代勺与约同声，勺药是双声词，情人借此表爱和结良约的意思。韵读：元部——涣、蕳。鱼部——乎、且、乎。宵部——乐、谑、药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。浏，水清貌。殷，人众多貌。将谑，马瑞辰《通释》：“将谑犹相谑也。”朱熹《诗集传》：“将，当作相，声之误也。”韵读：耕部——清、盈。鱼部——乎、且、乎。宵部——乐、谑、药。"])</script><script>self.__next_f.push([1,"23:Tdb2,"])< 之以勺药。\",\"sourceLabel\":\"第 202-203 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是描写郑国三月上巳节青年男女在溱水、洧水两旁游春的诗。太平御览引韩诗章句：“当此盛流之时，士与女众方执兰，拂除邪恶。”郑国之俗，三月上巳之辰，于此两水之上，招魂续魄，除拂不祥。上巳是指三月上旬的巳日。这一节日亦名“修禊”，后汉书礼仪志注：“三月上巳，官民皆禊于东流水上，曰洗濯拔除去宿垢疢，为大絜。”魏晋以后，改用三月三日为修禊的节日，王羲之《兰亭集序》：“暮春之初，会于会稽山阴之兰亭，修禊事也。”可见这种风俗流传很久。据韩诗所述这首诗就是描写郑国这一节日的盛况，传神地再现了一群青年男女趁此机会相聚相乐、互表衷情的热闹场面。这首诗有叙事，有对话，语言生动，表情真挚，显然是通过切身的感受才写出来的，诗人可能就是秉蕳赠花的少女或少男之一。诗中渗透着浓厚的抒情意味，正如方玉润所说：“每值风日融和，良辰美景，竞相出游；以至兰勺互赠，播为美谈，男女戏谑，恬不知羞。”所谓“恬不知羞”，实际是青年们天然纯朴的感情流露。方氏又以此诗“开后世冶游艳诗之祖”，殊不知发轫之清新与末流之华靡虽渊源有自终不可同日而语也。\",\"fullText\":\"$22\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-004:2-3:秉蕳\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。\",\"sourceLabel\":\"第 202-203 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。\",\"fullText\":\"$23\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-3:溱与洧\",\"seg-002:1-4:方涣涣兮\",\"seg-003:1-3:士与女\",\"seg-004:1-4:方秉蕳兮\",\"seg-005:1-2:女曰\",\"seg-006:1-2:观乎\",\"seg-007:1-2:士曰\",\"seg-008:1-2:既且\",\"seg-009:1-4:且往观乎\",\"seg-010:1-3:洧之外\",\"seg-011:1-4:洵訏且乐\",\"seg-012:1-4:维士与女\",\"seg-013:1-4:伊其相谑\",\"seg-014:1-5:赠之以勺药\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\",\"anchor-2-7\",\"anchor-2-8\",\"anchor-2-9\",\"anchor-2-10\",\"anchor-2-11\",\"anchor-2-12\",\"anchor-2-13\",\"anchor-2-14\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"溱与洧，方涣涣兮。士与女，方秉蕳兮。女曰：“观乎？”士曰：“既且。”“且往观乎！洧之外，洵訏且乐。”维士与女，伊其相谑，赠之以勺药。溱与洧，浏其清矣。士与女，殷其盈矣。女曰：“观乎？”士曰：“既且。”“且往观乎？洧之外，洵訏且乐。”维士与女，伊其将谑，赠之以勺药。\",\"sourceLabel\":\"第 202-203 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"溱、洧，郑国二水名。见褰裳注。涣涣，水流盛大貌。郑笺：“仲春冰释，水则涣涣然。”韩诗作洹，云：“洹，盛貌。谓三月桃花水下之时至盛也。”齐诗作灌，鲁诗作汎。洹是正字，汎为洹之重文，涣、灌均假借字。士与女，同下文的“维士与女”都是泛指春游的男男女女，下句的“女曰”和“士曰”则专指某一女子和男子。方，正。秉，执、拿。有人解作佩戴，亦通。蕳（jiān），亦名兰，是一种著名的香草，古人用来或沐浴，或泽头，或佩身，以拂除不祥。李时珍《本草纲目》：“蕳，即今省头草。”既，已经。且（cú），但的借字，往、去。这二句意为，女的说：“去看看吗？”男的说：“已经去过了。”且，姑且。这句是女要约男的：“姑且再去看看吧。”洵，确实。訏（xū），广大。这里指洧水岸边地方的宽广。按以上三句为女子说的话，鼓动男的陪她去游春。维，语助词，无义。伊，嬉的假借字，嬉笑貌。伊其，即伊伊。相谑，互相调笑。勺药，又名芍药。这里指的是草芍药，不是花如牡丹的木芍药。古时候情人在“将离”时互赠此草，寄托即将离别的情怀。又古代勺与约同声，勺药是双声词，情人借此表爱和结良约的意思。韵读：元部——涣、蕳。鱼部——乎、且、乎。宵部——乐、谑、药。\",\"fullText\":\"$24\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-1:溱\",\"seg-010:1-1:洧\",\"seg-002:2-3:涣涣\",\"seg-003:1-3:士与女\",\"seg-012:1-4:维士与女\",\"seg-005:1- yurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺淫也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺淫也。\",\"fullText\":\"刺淫也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？\",\"fullText\":\"右《溱洧》二章，章十二句。《序》謂「刺亂。兵革不息，男女相棄，淫風大行」。此詩及《出其東門》，正敘鄭俗游覽之盛，何云刺亂？使「兵革不息，男女相棄」，豈尚有采蘭贈勺事耶？故《辯説》以爲「鄭俗淫亂，乃其風聲氣習流傳已久，不爲兵革不怠男女相棄而後然也」，庶幾近之矣。然《集傳》又以爲「淫奔者自敘之詞」，則非。姚氏云：「篇中『士』、『女』字甚多，非士與女所自作明矣。」蓋刺淫，非淫詩也。此詩人自敘其國俗如此，不必言刺而刺自在。想鄭當國全盛時，士女務爲游觀，蒔花地多，耕稼人少。每值風日融和、良辰美景，競相出游，以至蘭勺互贈，播爲美談，男女戲謔，恬不知羞，則其俗流蕩而難返也。在三百篇中别爲一種，開後世冶遊豔詩之祖。聖人存之，一以見淫詞所自始，一以見淫俗有難終，殆將以爲萬世戒。不然，鄭聲淫，爲聖王所必放，而又何存乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。秉蕳〔陸氏璣曰〕蕳即蘭，香草也。〔姚氏際恒曰〕秉蕳者，《禮·内則》「佩帨、茞蘭」，「男女皆佩容臭」也。秉者，身秉之，不必定是手執也。《集傳》以秉蕳爲采蘭，尤誤。蘭生谷中，豈生水中乎？且手中既秉蕳，又秉勺以贈，亦不合矣。勺藥〔劉氏瑾曰〕《本草》注曰：「勺藥有二種，有草勺藥，有木勺藥。」〔姚氏際恒曰〕《集傳》又謂「勺藥，香草也」，亦謬。勺藥即今牡丹，古名勺藥。自唐玄宗始得木勺藥于宫中，因呼牡丹。其花香，根葉不香，何得混云香草乎？〔案〕後説即所謂木勺藥也。瀏深貌。殷衆也。將相將也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。\",\"fullText\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。秉蕳〔陸氏璣曰〕蕳即蘭，香草也。〔姚氏際恒曰〕秉蕳者，《禮·内則》「佩帨、茞蘭」，「男女皆佩容臭」也。秉者，身秉之，不必定是手執也。《集傳》以秉蕳爲采蘭，尤誤。蘭生谷中，豈生水中乎？且手中既秉蕳，又秉勺以贈，亦不合矣。勺藥〔劉氏瑾曰〕《本草》注曰：「勺藥有二種，有草勺藥，有木勺藥。」〔姚氏際恒曰〕《集傳》又謂「勺藥，香草也」，亦謬。勺藥即今牡丹，古名勺藥。自唐玄宗始得木勺藥于宫中，因呼牡丹。其花香，根葉不香，何得混云香草乎？〔案〕後説即所謂木勺藥也。瀏深貌。殷衆也。將相將也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/095-qin-wei/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"涣涣春水盛貌。〔陸氏德明曰〕涣，《韓詩》作「洹」，《説文》作「汎」。〔王氏應麟曰〕三月桃花水下之時。秉蕳〔陸氏璣曰〕蕳即蘭，香草也。〔姚氏際恒曰〕秉蕳者，《禮·内則》「佩帨、茞蘭」，「男女皆佩容臭」也。秉者，身秉之，不必定是手執也。《集傳》以秉蕳爲采蘭，尤誤。蘭生谷中，豈生水中乎？且手中既秉蕳，又秉勺以贈，亦不合矣。勺藥〔劉氏瑾曰〕《本草》注曰：「勺藥有二種，有草勺藥，有木勺藥。」〔姚氏際恒曰〕《集傳》又謂「勺藥，香草也」，亦謬。勺藥即今牡丹，古名勺藥。自唐玄宗始得木勺藥于宫中，因呼牡丹。其花香，根葉不香，何得混云香草乎？〔案〕後説即所謂木勺藥也。瀏深貌。殷衆也。將相將也。\
