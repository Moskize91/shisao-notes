胡不比焉","segmentId":"seg-016","segmentOrder":16,"surfaceText":"胡不比焉","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-4"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-016:3-3:比","segmentId":"seg-016","segmentOrder":16,"surfaceText":"比","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-017:1-4:人无兄弟","segmentId":"seg-017","segmentOrder":17,"surfaceText":"人无兄弟","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-4"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-018:1-4:胡不攸焉","segmentId":"seg-018","segmentOrder":18,"surfaceText":"胡不攸焉","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-4"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-018:3-3:攸","segmentId":"seg-018","segmentOrder":18,"surfaceText":"攸","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/119-di-du/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"有杕之杜，其叶湑湑。独行踽踽，岂无他人。不如我同父。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。有杕之杜，其叶菁菁。独行睘睘，岂无他人。不如我同姓。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。","sourceLabel":"第 247-248 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。","fullText":"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。有杕之杜，其叶湑湑。独行踽踽，岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？杕，孤生独特貌。有杕即杕杖。杜，即召南《甘棠》的甘棠，又名杜梨、棠梨。湑湑，树叶茂盛貌。这二句是反兴。诗人见到孤生独特的甘棠尚且有茂密的树叶保护它，不禁感慨自己的孤独无亲，还不如杕杜。踽踽，孤独貌。毛传：“踽踽，无所亲也。”同父，朱熹《诗集传》：“同父，兄弟也。”行，道路。比，亲密。说文：“比，密也。”段玉裁注：“其本义谓相亲密也。”这二句意为，唉，路上的人为什么不同我亲近呢？人，作者自指。攸，帮助。说文：“攸，行水也。”段玉裁注引唐风“胡不攸焉”，传曰“攸，助也”，笺曰“何不相推次而助之”。这二句意为，我是没有兄弟的孤零之人，为什么你们不肯帮助我呢？韵读：鱼部一一杜、湑、踽、父。脂部一一比、攸。有杕之杜，其叶菁菁。独行睘睘，岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？菁菁，树叶茂盛貌。毛传：“菁菁，叶盛也。”睘睘（qióng），鲁诗作茕茕，茕、蛩都是惸的假借字。说文：“惸，独行也。”毛传：“睘睘，无所依也。”同姓，同胞兄弟。马瑞辰《通释》：“女生日姓。此诗‘同姓’对前章‘同父’而言，又据下文‘人无兄弟’而言，同姓盖谓同母生者。”韵读：耕部一一菁、姓。脂部一一比、攸。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/119-di-du/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"有杕之杜，其叶湑湑。独行踽踽，岂无他人。不如我同父。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。有杕之杜，其叶菁菁。独行睘睘，岂无他人。不如我同姓。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。","sourceLabel":"第 247-248 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"有杕之杜，其叶湑湑。独行踽踽，岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？","fullText":"这是一个孤 n-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-015:1-4:嗟行之人\",\"segmentId\":\"seg-015\",\"segmentOrder\":15,\"surfaceText\":\"嗟行之人\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:1-4:胡不比焉\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"胡不比焉\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:3-3:比\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"比\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-017:1-4:人无兄弟\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"人无兄弟\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-4:胡不攸焉\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"胡不攸焉\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:3-3:攸\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"攸\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/119-di-du/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有杕之杜，其叶湑湑。独行踽踽，岂无他人。不如我同父。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。有杕之杜，其叶菁菁。独行睘睘，岂无他人。不如我同姓。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。\",\"sourceLabel\":\"第 247-248 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。\",\"fullText\":\"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。有杕之杜，其叶湑湑。独行踽踽，岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？杕，孤生独特貌。有杕即杕杖。杜，即召南《甘棠》的甘棠，又名杜梨、棠梨。湑湑，树叶茂盛貌。这二句是反兴。诗人见到孤生独特的甘棠尚且有茂密的树叶保护它，不禁感慨自己的孤独无亲，还不如杕杜。踽踽，孤独貌。毛传：“踽踽，无所亲也。”同父，朱熹《诗集传》：“同父，兄弟也。”行，道路。比，亲密。说文：“比，密也。”段玉裁注：“其本义谓相亲密也。”这二句意为，唉，路上的人为什么不同我亲近呢？人，作者自指。攸，帮助。说文：“攸，行水也。”段玉裁注引唐风“胡不攸焉”，传曰“攸，助也”，笺曰“何不相推次而助之”。这二句意为，我是没有兄弟的孤零之人，为什么你们不肯帮助我呢？韵读：鱼部一一杜、湑、踽、父。脂部一一比、攸。有杕之杜，其叶菁菁。独行睘睘，岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？菁菁，树叶茂盛貌。毛传：“菁菁，叶盛也。”睘睘（qióng），鲁诗作茕茕，茕、蛩都是惸的假借字。说文：“惸，独行也。”毛传：“睘睘，无所依也。”同姓，同胞兄弟。马瑞辰《通释》：“女生日姓。此诗‘同姓’对前章‘同父’而言，又据下文‘人无兄弟’而言，同姓盖谓同母生者。”韵读：耕部一一菁、姓。脂部一一比、攸。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\ 。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。有杕之杜，其叶湑湑。独行踽踽，岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？杕，孤生独特貌。有杕即杕杖。杜，即召南《甘棠》的甘棠，又名杜梨、棠梨。湑湑，树叶茂盛貌。这二句是反兴。诗人见到孤生独特的甘棠尚且有茂密的树叶保护它，不禁感慨自己的孤独无亲，还不如杕杜。踽踽，孤独貌。毛传：“踽踽，无所亲也。”同父，朱熹《诗集传》：“同父，兄弟也。”行，道路。比，亲密。说文：“比，密也。”段玉裁注：“其本义谓相亲密也。”这二句意为，唉，路上的人为什么不同我亲近呢？人，作者自指。攸，帮助。说文：“攸，行水也。”段玉裁注引唐风“胡不攸焉”，传曰“攸，助也”，笺曰“何不相推次而助之”。这二句意为，我是没有兄弟的孤零之人，为什么你们不肯帮助我呢？韵读：鱼部一一杜、湑、踽、父。脂部一一比、攸。有杕之杜，其叶菁菁。独行睘睘，岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？菁菁，树叶茂盛貌。毛传：“菁菁，叶盛也。”睘睘（qióng），鲁诗作茕茕，茕、蛩都是惸的假借字。说文：“惸，独行也。”毛传：“睘睘，无所依也。”同姓，同胞兄弟。马瑞辰《通释》：“女生日姓。此诗‘同姓’对前章‘同父’而言，又据下文‘人无兄弟’而言，同姓盖谓同母生者。”韵读：耕部一一菁、姓。脂部一一比、攸。\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[\"seg-011:3-4:菁菁\",\"seg-012:3-4:睘睘\",\"seg-014:4-5:同姓\",\"seg-016:3-3:比\",\"seg-018:3-3:攸\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\",\"anchor-5-4\",\"anchor-5-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/119-di-du/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"自傷兄弟失好而無助也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"自傷兄弟失好而無助也。\",\"fullText\":\"自傷兄弟失好而無助也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/119-di-du/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《杕杜》二章，章九句。姚氏際恒云：「此似不得於兄弟而終望兄弟比助之辭。言我獨行無偶，豈無他人可共行乎？然終不如我兄弟也。使他人而苟如兄弟也，則嗟彼行道之人胡不親比我，而人無兄弟者胡不佽助我乎？『行之人』即上『他人』，以見他人莫如我兄弟也，即《常棣》『凡今之人，莫如兄弟』之意。」解此詩者，義止於是，不可别生枝節。如《大序》所云「君不能親其宗族，骨肉離散，獨居而無兄弟，將爲沃所并」，徒形附會而無當詩意。《集傳》不用《序》言，是矣。而釋詩語氣，又多不合。如詩言「不如我同父」，明明是有兄弟人語。而《傳》乃曰「自傷孤特」之類，與經乖反，豈能信從？愚故舍彼而録姚説，不復更爲之詞也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《杕杜》二章，章九句。姚氏際恒云：「此似不得於兄弟而終望兄弟比助之辭。言我獨行無偶，豈無他人可共行乎？然終不如我兄弟也。使他人而苟如兄弟也，則嗟彼行道之人胡不親比我，而人無兄弟者胡不佽助我乎？『行之人』即上『他人』，以見他人莫如我兄弟也，即《常棣》『凡今之人，莫如兄弟』之意。」解此詩者，義止於是，不可别生枝節。如《大序》所云「君不能親其宗族，骨肉離散，獨居而無兄弟，將爲沃所并」，徒形附會而無當詩意。《集傳》不用《序》言，是矣。而釋詩語氣，又多不合。如詩言「不如我同父」，明明是有兄弟人語。而《傳》乃曰「自傷孤特」之類，與經乖反，豈能信從？愚故舍彼而録姚説，不復更爲之詞也。\",\"fullText\":\"右《杕杜》二章，章九句。姚氏際恒云：「此似不得於兄弟而終望兄弟比助之辭。言我獨行無偶，豈無他人可共行乎？然終不如我兄弟也。使他人而苟如兄弟也，則嗟彼行道之人胡不親比我，而人無兄弟者胡不佽助我乎？『行之人』即上『他人』，以見他人莫如我兄弟也，即《常棣》『凡今之人，莫如兄弟』之意。」解此詩者，義止於是，不可别生枝節。如《大序》所云「君不能親其宗族，骨肉離散，獨居而無兄弟，將爲沃所并」，徒形附會而無當詩意。《集傳》不用《序》言，是矣。而釋詩語氣，又多不合。如詩言「不如我同父」，明明是有兄弟人語。而《傳》乃曰「自傷孤特」之類，與經乖反，豈能信從？愚故舍彼而録姚説，不復更爲之詞也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/119-di-du/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"杕特也。杜赤棠也。湑湑盛貌。踽踽無所親之貌。比輔也。佽助也。菁菁亦盛貌。睘睘無所依貌。〔曹氏粹中曰〕《説文》云：「睘睘，驚視也。」獨行多懼，故睘睘也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"杕特也。杜赤棠也。湑湑盛貌。踽踽無所親之貌。比輔也。佽助也。菁菁亦盛貌。睘睘無所依貌。\",\"fullText\":\"杕特也。杜赤棠也。湑湑盛貌。踽踽無所親之貌。比輔也。佽助也。菁菁亦盛貌。睘睘無所依貌。〔曹氏粹中曰〕《説文》云：「睘睘，驚視也。」獨行多懼，故睘睘也。\", {\"id\":\"seg-014:4-5:同姓\",\"segmentId\":\"seg-014\",\"segmentOrder\":14,\"surfaceText\":\"同姓\",\"charStart\":4,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-015:1-4:嗟行之人\",\"segmentId\":\"seg-015\",\"segmentOrder\":15,\"surfaceText\":\"嗟行之人\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:1-4:胡不比焉\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"胡不比焉\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:3-3:比\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"比\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-017:1-4:人无兄弟\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"人无兄弟\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-4:胡不攸焉\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"胡不攸焉\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:3-3:攸\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"攸\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/119-di-du/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有杕之杜，其叶湑湑。独行踽踽，岂无他人。不如我同父。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。有杕之杜，其叶菁菁。独行睘睘，岂无他人。不如我同姓。嗟行之人，胡不比焉。人无兄弟，胡不攸焉。\",\"sourceLabel\":\"第 247-248 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。\",\"fullText\":\"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。有杕之杜，其叶湑湑。独行踽踽，岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？杕，孤生独特貌。有杕即杕杖。杜，即召南《甘棠》的甘棠，又名杜梨、棠梨。湑湑，树叶茂盛貌。这二句是反兴。诗人见到孤生独特的甘棠尚且有茂密的树叶保护它，不禁感慨自己的孤独无亲，还不如杕杜。踽踽，孤独貌。毛传：“踽踽，无所亲也。”同父，朱熹《诗集传》：“同父，兄弟也。”行，道路。比，亲密。说文：“比，密也。”段玉裁注：“其本义谓相亲密也。”这二句意为，唉，路上的人为什么不同我亲近呢？人，作者自指。攸，帮助。说文：“攸，行水也。”段玉裁注引唐风“胡不攸焉”，传曰“攸，助也”，笺曰“何不相推次而助之”。这二句意为，我是没有兄弟的孤零之人，为什么你们不肯帮助我呢？韵读：鱼部一一杜、湑、踽、父。脂部一一比、攸。有杕之杜，其叶菁菁。独行睘睘，岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？菁菁，树叶茂盛貌。毛传：“菁菁，叶盛也。”睘睘（qióng），鲁诗作茕茕，茕、蛩都是惸的假借字。说文：“惸，独行也。”毛传：“睘睘，无所依也。”同姓，同胞兄弟。马瑞辰《通释》：“女生日姓。此诗‘同姓’对前章‘同父’而言，又据下文‘人无兄弟’而言，同姓盖谓同母生者。”韵读：耕部一一菁、姓。脂部一一比、攸。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005 ,\"fullText\":\"这是一个孤独的流浪者求助不得的感伤诗。他自伤失去了兄弟，路上虽有不少同行者，却谁也不肯援之以手。毛序：“杕杜，刺时也。君不能亲其宗族，骨肉离散，独居而无兄弟，将为沃所并尔。”朱熹《诗序辨说》驳曰：“此乃人无兄弟而自叹之词，未必如序之说也。况曲沃实晋之同姓，其服属又未远乎？”从诗意来看，朱熹是驳得允当的。《集传》说：“此无兄弟者自伤其孤特，而求助于人之词。”他分析诗的主题比较正确。有人说这是一篇乞食者之歌，亦可通。闻一多《风诗类钞》：“杕杜喻女之未嫁者。说文：‘牡曰棠，牝曰杜。’”按他的说法，这个流浪者竟是一位女子了。诗两章，每章末四句全同，是副歌式的复唱。世态炎凉，人情冷暖，使得诗人抚胸扼腕，仰天悲歌，连用两个激问：为什么没有人亲近？为什么没有人援助？激问是一种在知切情急情况下才使用的特殊修辞。刘勰《文心雕龙·情采》篇说：“昔诗人什篇，为情而造文。……盖风雅之兴，志思蓄愤，而吟咏情性，以讽其上，此为情而造文也。”诗人并没有铺采摛藻、缀章雕句，而只是为了宣泄心中难以抑制的孤凄怨愤之感。唯其如此，他的歌声更能产生震慑人心的魅力。有杕之杜，其叶湑湑。独行踽踽，岂无他人？不如我同父。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？杕，孤生独特貌。有杕即杕杖。杜，即召南《甘棠》的甘棠，又名杜梨、棠梨。湑湑，树叶茂盛貌。这二句是反兴。诗人见到孤生独特的甘棠尚且有茂密的树叶保护它，不禁感慨自己的孤独无亲，还不如杕杜。踽踽，孤独貌。毛传：“踽踽，无所亲也。”同父，朱熹《诗集传》：“同父，兄弟也。”行，道路。比，亲密。说文：“比，密也。”段玉裁注：“其本义谓相亲密也。”这二句意为，唉，路上的人为什么不同我亲近呢？人，作者自指。攸，帮助。说文：“攸，行水也。”段玉裁注引唐风“胡不攸焉”，传曰“攸，助也”，笺曰“何不相推次而助之”。这二句意为，我是没有兄弟的孤零之人，为什么你们不肯帮助我呢？韵读：鱼部一一杜、湑、踽、父。脂部一一比、攸。有杕之杜，其叶菁菁。独行睘睘，岂无他人？不如我同姓。嗟行之人，胡不比焉？人无兄弟，胡不攸焉？菁菁，树叶茂盛貌。毛传：“菁菁，叶盛也。”睘睘（qióng），鲁诗作茕茕，茕、蛩都是惸的假借字。说文：“惸，独行也。”毛传：“睘睘，无所依也。”同姓，同胞兄弟。马瑞辰《通释》：“女生日姓。此诗‘同姓’对前章‘同父’而言，又据下文‘人无兄弟’而言，同姓盖谓同母生者。”韵读：耕部一一菁、姓。脂部一一比、攸。\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[\"seg-011:3-4:菁菁\",\"seg-012:3-4:睘睘\",\"seg-014:4-5:同姓\",\"seg-016:3-3:比\",\"seg-018:3-3:攸\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\",\"anchor-5-4\",\"anchor-5-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/119-di-du/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"自傷兄弟失好而無助也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"自傷兄弟失好而無助也。\",\"fullText\":\"自傷兄弟失好而無助也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/119-di-du/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《杕杜》二章，章九句。姚氏際恒云：「此似不得於兄弟而終望兄弟比助之辭。言我獨行無偶，豈無他人可共行乎？然終不如我兄弟也。使他人而苟如兄弟也，則嗟彼行道之人胡不親比我，而人無兄弟者胡不佽助我乎？『行之人』即上『他人』，以見他人莫如我兄弟也，即《常棣》『凡今之人，莫如兄弟』之意。」解此詩者，義止於是，不可别生枝節。如《大序》所云「君不能親其宗族，骨肉離散，獨居而無兄弟，將爲沃所并」，徒形附會而無當詩意。《集傳》不用《序》言，是矣。而釋詩語氣，又多不合。如詩言「不如我同父」，明明是有兄弟人語。而《傳》乃曰「自傷孤特」之類，與經乖反，豈能信從？愚故舍彼而録姚説，不復更爲之詞也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《杕杜》二章，章九句。姚氏際恒云：「此似不得於兄弟而終望兄弟比助之辭。言我獨行無偶，豈無他人可共行乎？然終不如我兄弟也。使他人而苟如兄弟也，則嗟彼行道之人胡不親比我，而人無兄弟者胡不佽助我乎？『行之人』即上『他人』，以見他人莫如我兄弟也，即《常棣》『凡今之人，莫如兄弟』之意。」解此詩者，義止於是，不可别生枝節。如《大序》所云「君不能親其宗族，骨肉離散，獨居而無兄弟，將爲沃所并」，徒形附會而無當詩意。《集傳》不用《序》言，是矣。而釋詩語氣，又多不合。如詩言「不如我同父」，明明是有兄弟人語。而《傳》乃曰「自傷孤特」之類，與經乖反，豈能信從？愚故舍彼而録姚説，不復更爲之詞也。\",\"fullText\":\"右《杕杜》二章，章九句。姚氏際恒云：「此似不得於兄弟而終望兄弟比助之辭。言我獨行無偶，豈無他人可共行乎？然終不如我兄弟也。使他人而苟如兄弟也，則嗟彼行道之人胡不親比我，而人無兄弟者胡不佽助我乎？『行之人』即上『他人』，以見他人莫如我兄弟也，即《常棣》『凡今之人，莫如兄弟』之意。」解此詩者，義止於是，不可别生枝節。如《大序》所云「君不能親其宗族，骨肉離散，獨居而無兄弟，將爲沃所并」，徒形附會而無當詩意。《集傳》不用《序》言，是矣。而釋詩語氣，又多不合。如詩言「不如我同父」，明明是有兄弟人語。而《傳》乃曰「自傷孤特」之類，與經乖反，豈能信從？愚故舍彼而録姚説，不復更爲之詞也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/119-di-du/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"杕特也。杜赤棠也。湑湑盛貌。踽踽無所親之貌。比輔也。佽助也。菁菁亦盛貌。睘睘無所依貌。〔曹氏粹中曰〕《説文》云：「睘睘，驚視也。」獨行多懼，故睘睘也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionL
