:"比也。朱熹先解“北門”为背阳向阴之地，又释“殷殷”为忧貌、“窶”为贫而无以行礼。由此判定本章所写，是卫国贤者处乱世、事暗君而不得志，因出北门触景自比，既叹贫困无人知其艰难，最终又把遭遇归之于天。","notes":null,"partOrder":3,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007"]},{"id":"zhuxi-shijichuan-kr1c0009:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0002-1","materialId":"zhuxi-shijichuan-kr1c0009","materialTitle":"詩集傳","contributorLine":"宋 · 朱熹","publicationYear":1186,"layer":"span","layerLabel":"诗句片段","targetText":"王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。","sourceLabel":null,"attributionLabel":"朱熹","sectionLabel":null,"excerpt":"賦也。","fullText":"賦也。朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。故本章所见，是王事既归于我，政事又一概加重于我；而我自外奔走归来，家人却还交相责我，写出其困于内外两端已极。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014"]},{"id":"zhuxi-shijichuan-kr1c0009:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0002-1","materialId":"zhuxi-shijichuan-kr1c0009","materialTitle":"詩集傳","contributorLine":"宋 · 朱熹","publicationYear":1186,"layer":"span","layerLabel":"诗句片段","targetText":"王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。","sourceLabel":null,"attributionLabel":"朱熹","sectionLabel":null,"excerpt":"朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。","fullText":"賦也。朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。故本章所见，是王事既归于我，政事又一概加重于我；而我自外奔走归来，家人却还交相责我，写出其困于内外两端已极。","notes":null,"partOrder":2,"anchorIds":["seg-008:1-2:王事","seg-008:3-3:適","seg-009:1-2:政事","seg-009:3-3:一","seg-009:4-4:埤","seg-011:5-5:讁"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4","anchor-2-5","anchor-2-6"],"segmentIds":["seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014"]},{"id":"zhuxi-shijichuan-kr1c0009:0002-1:part-3","annotationId":"0002","glossI tText\":\"题解\",\"sourceLabel\":\"第 85 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"二人又引郭沫若“破产贵族”说，指出诗中贫窭、家人责难与反复叹天，反映的是生活困顿、无可奈何而借叠章长叹排遣的复杂心理。\",\"fullText\":\"程俊英、蒋见元不取《毛序》“忠臣不得其志”之说，认为《北门》更像一位颇受信任却被繁重差事压得内外交困的卫国贵族自叹之作。二人又引郭沫若“破产贵族”说，指出诗中贫窭、家人责难与反复叹天，反映的是生活困顿、无可奈何而借叠章长叹排遣的复杂心理。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 85 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章先写“出自北门，忧心殷殷”的深忧情状。程、蒋反对毛、郑把“北门”硬解为背明向阴以喻暗君，认为这里只是随手写实的出门地点；\",\"fullText\":\"首章先写“出自北门，忧心殷殷”的深忧情状。程、蒋反对毛、郑把“北门”硬解为背明向阴以喻暗君，认为这里只是随手写实的出门地点；而“终窭且贫，莫知我艰”则点出其既贫且窭、无人理解的现实困境，章末连用“已焉哉！天实为之，谓之何哉！”写他除了叹命之外别无办法。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:出自北门\",\"seg-002:1-4:忧心殷殷\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 85 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"而“终窭且贫，莫知我艰”则点出其既贫且窭、无人理解的现实困境，\",\"fullText\":\"首章先写“出自北门，忧心殷殷”的深忧情状。程、蒋反对毛、郑把“北门”硬解为背明向阴以喻暗君，认为这里只是随手写实的出门地点；而“终窭且贫，莫知我艰”则点出其既贫且窭、无人理解的现实困境，章末连用“已焉哉！天实为之，谓之何哉！”写他除了叹命之外别无办法。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-4:终窭且贫\",\"seg-004:1-4:莫知我艰\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 85 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"章末连用“已焉哉！天实为之，谓之何哉！”写他除了叹命之外别无办法。\",\"fullText\":\"首章先写“出自北门，忧心殷殷”的深忧情状。程、蒋反对毛、郑把“北门”硬解为背明向阴以喻暗君，认为这里只是随手写实的出门地点；而“终窭且贫，莫知我艰”则点出其既贫且窭、无人理解的现实困境，章末连用“已焉哉！天实为之，谓之何哉！”写他除了叹命之外别无办法。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-005:1-3:已焉哉\",\"seg-006:1-4:天实为之\",\"seg-007:1-4:谓之何哉\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 86 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"第二章把困境落到事务分配与家庭压力上。“王事适我，政事一埤益我”被解释为王朝差事和国内政事都一股脑加到诗人身上；\",\"fullText\":\"第二章把困境落到事务分配与家庭压力上。“王事适我，政事一埤益我”被解释为王朝差事和国内政事都一股脑加到诗人身上；“我入自外，室人交遍谪我”则写他在外奔走归 ,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"言衛之忠臣不得志於君，而見困窮也。\",\"fullText\":\"序：《北門》，刺仕不得志也。言衛之忠臣不得志於君，而見困窮也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門，憂心殷殷。終窶且貧，莫知我艱。已焉哉，天實爲之。謂之何哉。王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":\"第 70-71 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《北門》时，从《序》定为卫之忠臣仕不得志之诗。其解首章“出自北門，憂心殷殷”“終窶且貧，莫知我艱”，以为写忠臣忧劳困穷而无人知其艰。\",\"fullText\":\"陈奂疏《北門》时，从《序》定为卫之忠臣仕不得志之诗。其解首章“出自北門，憂心殷殷”“終窶且貧，莫知我艱”，以为写忠臣忧劳困穷而无人知其艰。又就“王事適我，政事一埤益我”“王事敦我，政事一埤遺我”申明王事政事层层加重于一身；“我入自外，室人交徧讁我”“室人交徧摧我”则写奔走于外而归家仍遭室人责摧。至三章反覆言“已焉哉，天實爲之，謂之何哉”，则见其不敢怨上，惟归之于天，以见忠厚隐忍。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:出自北門\",\"seg-002:1-4:憂心殷殷\",\"seg-003:1-4:終窶且貧\",\"seg-004:1-4:莫知我艱\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門，憂心殷殷。終窶且貧，莫知我艱。已焉哉，天實爲之。謂之何哉。王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"so \",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我政事一埤益我我入自外室人交徧讁我已焉哉天實為之謂之何哉\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：適，之。埤，厚也。箋云：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。\",\"fullText\":\"傳：適，之。埤，厚也。箋云：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。傳：讁，責也。箋云：我從外而入，在室之人更迭徧來責我，使己去也。言室人亦不知己志。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:3-3:適\",\"seg-009:4-4:埤\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我政事一埤益我我入自外室人交徧讁我已焉哉天實為之謂之何哉\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：讁，責也。箋云：我從外而入，在室之人更迭徧來責我，使己去也。言室人亦不知己志。\",\"fullText\":\"傳：適，之。埤，厚也。箋云：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。傳：讁，責也。箋云：我從外而入，在室之人更迭徧來責我，使己去也。言室人亦不知己志。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-011:5-5:讁\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"material 釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"憂心殷殷終窶且貧謂之何哉王事適我政事一埤益我室人交徧讁我王事敦我政事一埤遺我室人交徧摧我\",\"sourceLabel\":\"第 48-49 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"诸注合观，正写诗人差事繁重、家中又受责抑的困境。\",\"fullText\":\"屈万里释“殷殷”为忧貌，“窶”为居处狭陋而贫；又说“謂”犹“奈”，“王事”即公事，“適”当读为“擿”，有投掷义，“一”犹一古脑儿，“埤”为增。至“室人”则释作家人，“交”为交互，“讁”为责，“敦”为迫，“摧”可通排挤、刺讥之义。诸注合观，正写诗人差事繁重、家中又受责抑的困境。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-002\",\"seg-003\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-011\",\"seg-015\",\"seg-016\",\"seg-018\"]},{\"id\":\"wangli-yundu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《北门》韵读总说\",\"sourceLabel\":\"第 159-160 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"王力把《北门》读作三章而各章都用双层韵脚组织：首章以“门、殷、贫、艰”归文部，继以“为、哉”归歌部；次章先押“适、益、谪”的锡部，再回到“为、哉”的歌部；末章则以“敦、遗、摧”为文微通韵，结尾仍收在歌部。\",\"fullText\":\"王力把《北门》读作三章而各章都用双层韵脚组织：首章以“门、殷、贫、艰”归文部，继以“为、哉”归歌部；次章先押“适、益、谪”的锡部，再回到“为、哉”的歌部；末章则以“敦、遗、摧”为文微通韵，结尾仍收在歌部。全篇三章反复以歌部收束，形成明显的回环。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"wangli-yundu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《北门》韵读总说\",\"sourceLabel\":\"第 159-160 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"全篇三章反复以歌部收束，形成明显的回环。\",\"fullText\":\"王力把《北门》读作三章而各章都用双层韵脚组织：首章以“门、殷、贫、艰”归文部，继以“为、哉”归歌部；次章先押“适、益、谪”的锡部，再回到“为、哉”的歌部；末章则以“敦、遗、摧”为文微通韵，结尾仍收在歌部。全篇三章反复以歌部收束，形成明显的回环。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"wangli-yundu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/wangli-yundu/0002-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 159-160 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"王力在全篇韵读中把《北门》的韵脚分得很细：首章“门、殷、贫、艰”同属文部，随后“为、哉”自成歌部；\",\"fullText\":\"王力在全篇韵读中把《北门》的韵脚分得很细：首章“门、殷、贫、艰”同属文部，随后“为、哉”自成歌部；第二章则以“适、益、谪”入锡部，再用“为、哉”回到歌部；第三章把“敦、遗、摧”记作文微通韵，仍以“为、哉”收结。这样既显出三章各自的声部安排，也凸出了每章末尾同句回环的效果。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:4-4:门\",\"seg-002:3-3:殷\",\"seg-003:4-4:贫\",\"seg-004:4-4:艰\",\"seg-006:3-3:为\",\"seg-007:4-4:哉\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"wangli-yundu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/wangli-yundu/0002-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 159-160 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"第二章则以“适、益、谪”入锡部，再用“为、哉”回到歌部；\",\"fullText\":\"王力在全篇韵读中把《北门》的韵脚分得很细：首 86,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門，憂心殷殷。終窶且貧，莫知我艱。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"朱熹先解“北門”为背阳向阴之地，又释“殷殷”为忧貌、“窶”为贫而无以行礼。\",\"fullText\":\"比也。朱熹先解“北門”为背阳向阴之地，又释“殷殷”为忧貌、“窶”为贫而无以行礼。由此判定本章所写，是卫国贤者处乱世、事暗君而不得志，因出北门触景自比，既叹贫困无人知其艰难，最终又把遭遇归之于天。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:3-4:北門\",\"seg-002:3-4:殷殷\",\"seg-003:2-2:窶\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門，憂心殷殷。終窶且貧，莫知我艱。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"由此判定本章所写，是卫国贤者处乱世、事暗君而不得志，因出北门触景自比，既叹贫困无人知其艰难，最终又把遭遇归之于天。\",\"fullText\":\"比也。朱熹先解“北門”为背阳向阴之地，又释“殷殷”为忧貌、“窶”为贫而无以行礼。由此判定本章所写，是卫国贤者处乱世、事暗君而不得志，因出北门触景自比，既叹贫困无人知其艰难，最终又把遭遇归之于天。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。\",\"fullText\":\"賦也。朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一” :null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。\",\"fullText\":\"賦也。朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。与次章相比，这一章进一步把外在差事之逼迫和室人交相摧折之苦推到更重处；但诗人仍只反覆叹“天实为之”，是不敢怨上而归之于天的写法。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。\",\"fullText\":\"賦也。朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。与次章相比，这一章进一步把外在差事之逼迫和室人交相摧折之苦推到更重处；但诗人仍只反覆叹“天实为之”，是不敢怨上而归之于天的写法。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-015:3-3:敦\",\"seg-016:5-5:遺\",\"seg-018:5-5:摧\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/04 \"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 85 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"二人又引郭沫若“破产贵族”说，指出诗中贫窭、家人责难与反复叹天，反映的是生活困顿、无可奈何而借叠章长叹排遣的复杂心理。\",\"fullText\":\"程俊英、蒋见元不取《毛序》“忠臣不得其志”之说，认为《北门》更像一位颇受信任却被繁重差事压得内外交困的卫国贵族自叹之作。二人又引郭沫若“破产贵族”说，指出诗中贫窭、家人责难与反复叹天，反映的是生活困顿、无可奈何而借叠章长叹排遣的复杂心理。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 85 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章先写“出自北门，忧心殷殷”的深忧情状。程、蒋反对毛、郑把“北门”硬解为背明向阴以喻暗君，认为这里只是随手写实的出门地点；\",\"fullText\":\"首章先写“出自北门，忧心殷殷”的深忧情状。程、蒋反对毛、郑把“北门”硬解为背明向阴以喻暗君，认为这里只是随手写实的出门地点；而“终窭且贫，莫知我艰”则点出其既贫且窭、无人理解的现实困境，章末连用“已焉哉！天实为之，谓之何哉！”写他除了叹命之外别无办法。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:出自北门\",\"seg-002:1-4:忧心殷殷\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\": yerLabel\":\"诗句片段\",\"targetText\":\"王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 86 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"第二章把困境落到事务分配与家庭压力上。“王事适我，政事一埤益我”被解释为王朝差事和国内政事都一股脑加到诗人身上；\",\"fullText\":\"第二章把困境落到事务分配与家庭压力上。“王事适我，政事一埤益我”被解释为王朝差事和国内政事都一股脑加到诗人身上；“我入自外，室人交遍谪我”则写他在外奔走归来，家人还轮番责备。程、蒋借此指出，这一章把内外交迫的处境写得更具体了。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:1-4:王事适我\",\"seg-009:1-6:政事一埤益我\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 86 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"“我入自外，室人交遍谪我”则写他在外奔走归来，家人还轮番责备。\",\"fullText\":\"第二章把困境落到事务分配与家庭压力上。“王事适我，政事一埤益我”被解释为王朝差事和国内政事都一股脑加到诗人身上；“我入自外，室人交遍谪我”则写他在外奔走归来，家人还轮番责备。程、蒋借此指出，这一章把内外交迫的处境写得更具体了。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:1-4:我入自外\",\"seg-011:1-6:室人交遍谪我\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 86 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋借此指出，这一章把内外交迫的处境写得更具体了。\",\"fullText\":\"第二章把困境落到事务分配与家庭压力上。“王事适我，政事一埤益我”被解释为王朝差事和国内政事都一股脑加到诗人身上；“我入自外，室人交遍谪我”则写他在外奔走归来，家人还轮番责备。程、蒋借此指出，这一章把内外交迫的处境写得更具体了。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 86 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章与次章相承而更进一层。程、蒋释“敦”为逼迫，“遗”为加给，“摧”从韩诗义作讥刺责难，因此“王事敦我，政事一埤遗我”是说差役催逼更甚，\",\"fullText\":\"末章与次章相承而更进一层。程、蒋释“敦”为逼迫，“遗”为加给，“摧”从韩诗义作讥刺责难，因此“王事敦我，政事一埤遗我”是说差役催逼更甚，“室人交遍摧我”则是家人不仅责备，且以讥刺相加。结尾再叹“已焉哉！天实为之，谓之何哉！”，把无可奈何的情绪推到最重。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:1-4:王事敦我\",\"seg-016:1-6:政事一埤遗我\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 86 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"“室人交遍摧我”则是家人不仅责备，且以讥刺相加。\",\"fullText\":\"末章与次章相承而更进一层。程、蒋 \"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北門刺仕不得志也言衛之忠臣不得志於君而見困窮也\",\"sourceLabel\":\"第 70 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"言衛之忠臣不得志於君，而見困窮也。\",\"fullText\":\"序：《北門》，刺仕不得志也。言衛之忠臣不得志於君，而見困窮也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門，憂心殷殷。終窶且貧，莫知我艱。已焉哉，天實爲之。謂之何哉。王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":\"第 70-71 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《北門》时，从《序》定为卫之忠臣仕不得志之诗。其解首章“出自北門，憂心殷殷”“終窶且貧，莫知我艱”，以为写忠臣忧劳困穷而无人知其艰。\",\"fullText\":\"陈奂疏《北門》时，从《序》定为卫之忠臣仕不得志之诗。其解首章“出自北門，憂心殷殷”“終窶且貧，莫知我艱”，以为写忠臣忧劳困穷而无人知其艰。又就“王事適我，政事一埤益我”“王事敦我，政事一埤遺我”申明王事政事层层加重于一身；“我入自外，室人交徧讁我”“室人交徧摧我”则写奔走于外而归家仍遭室人责摧。至三章反覆言“已焉哉，天實爲之，謂之何哉”，则见其不敢怨上，惟归之于天，以见忠厚隐忍。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:出自北門\",\"seg-002:1-4:憂心殷殷\",\"seg-003:1-4:終窶且貧\",\"seg-004:1-4:莫知我艱\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-me el\":null,\"excerpt\":\"傳：興也。北門背明鄉陰。箋云：自，從也。興者，喻己仕於闇君，猶行而出北門，心為之憂殷殷然。\",\"fullText\":\"傳：興也。北門背明鄉陰。箋云：自，從也。興者，喻己仕於闇君，猶行而出北門，心為之憂殷殷然。傳：窶者無禮也，貧者困于財。箋云：艱，難也。君於己祿薄，終不足以為禮；又近困於財，無知己以此為難者。言君既然矣，諸臣亦如之。箋云：謂，勤也。詩人事君無二志，故自決歸之於天。我勤身以事君，何哉？忠之至。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-4:北門\",\"seg-002:3-4:殷殷\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門憂心殷殷終窶且貧莫知我艱已焉哉天實為之謂之何哉\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：窶者無禮也，貧者困于財。箋云：艱，難也。君於己祿薄，終不足以為禮；又近困於財，無知己以此為難者。言君既然矣，諸臣亦如之。\",\"fullText\":\"傳：興也。北門背明鄉陰。箋云：自，從也。興者，喻己仕於闇君，猶行而出北門，心為之憂殷殷然。傳：窶者無禮也，貧者困于財。箋云：艱，難也。君於己祿薄，終不足以為禮；又近困於財，無知己以此為難者。言君既然矣，諸臣亦如之。箋云：謂，勤也。詩人事君無二志，故自決歸之於天。我勤身以事君，何哉？忠之至。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:2-2:窶\",\"seg-003:4-4:貧\",\"seg-004:4-4:艱\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北門憂心殷殷終窶且貧莫知我艱已焉哉天實為之謂之何哉\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：謂，勤也。詩人事君無二志，故自決歸之於天。我勤身以事君，何哉？忠之至。\",\"fullText\":\"傳：興也。北門背明鄉陰。箋云：自，從也。興者，喻己仕於闇君，猶行而出北門，心為之憂殷殷然。傳：窶者無禮也，貧者困于財。箋云：艱，難也。君於己祿薄，終不足以為禮；又近困於財，無知己以此為難者。言君既然矣，諸臣亦如之。箋云：謂，勤也。詩人事君無二志，故自決歸之於天。我勤身以事君，何哉？忠之至。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-007:3-4:何哉\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我政事一埤益我我入自外室人交徧讁我已焉哉天實為之謂之何哉\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：適，之。埤，厚也。箋云：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。\",\"fullText\":\"傳：適，之。埤，厚也。箋云：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。傳：讁，責也。箋云：我從外而入，在室之人更迭徧來責我，使己去也。言室人亦不知己志。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:3-3:適\",\"seg-009:4-4:埤\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我政事一埤益我我入自外室人交徧讁我已焉哉天實為之謂之何哉\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：讁，責也。箋云：我從外而入，在室之人更迭徧來責我，使己去也。言室人亦不知己志。\",\"fullText\":\"傳：適，之。埤，厚也。箋云：國有王命役使之事，則不以之彼，必來之我；有賦稅之事，則減彼一而以益我。言君政偏，己兼其苦。傳：讁，責也。箋云：我從外而入，在室之人更迭徧來責我，使己去也。言室人亦不知己志。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-011:5-5:讁\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"s Text\":\"北門\",\"sourceLabel\":\"第 49 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"屈万里于《北門》下注先引《詩序》“刺仕不得志也”，并借诸词注把诗中困境落实为贫窶、王事政事层层加身、家人交相责难而终归于无可奈何的处境。\",\"fullText\":\"屈万里于《北門》下注先引《詩序》“刺仕不得志也”，并借诸词注把诗中困境落实为贫窶、王事政事层层加身、家人交相责难而终归于无可奈何的处境。其页内注释重点不在申说暗君之喻，而在解释这些字词如何共同写出仕途劳瘁与居家受困。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"北門\",\"sourceLabel\":\"第 49 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"其页内注释重点不在申说暗君之喻，而在解释这些字词如何共同写出仕途劳瘁与居家受困。\",\"fullText\":\"屈万里于《北門》下注先引《詩序》“刺仕不得志也”，并借诸词注把诗中困境落实为贫窶、王事政事层层加身、家人交相责难而终归于无可奈何的处境。其页内注释重点不在申说暗君之喻，而在解释这些字词如何共同写出仕途劳瘁与居家受困。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"憂心殷殷終窶且貧謂之何哉王事適我政事一埤益我室人交徧讁我王事敦我政事一埤遺我室人交徧摧我\",\"sourceLabel\":\"第 48-49 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“殷殷”为忧貌，“窶”为居处狭陋而贫；又说“謂”犹“奈”，\",\"fullText\":\"屈万里释“殷殷”为忧貌，“窶”为居处狭陋而贫；又说“謂”犹“奈”，“王事”即公事，“適”当读为“擿”，有投掷义，“一”犹一古脑儿，“埤”为增。至“室人”则释作家人，“交”为交互，“讁”为责，“敦”为迫，“摧”可通排挤、刺讥之义。诸注合观，正写诗人差事繁重、家中又受责抑的困境。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:3-4:殷殷\",\"seg-003:2-2:窶\",\"seg-007:1-1:謂\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-002\",\"seg-003\",\"seg-007\",\"seg-008\",\" onYear\":1980,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《北门》韵读总说\",\"sourceLabel\":\"第 159-160 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"全篇三章反复以歌部收束，形成明显的回环。\",\"fullText\":\"王力把《北门》读作三章而各章都用双层韵脚组织：首章以“门、殷、贫、艰”归文部，继以“为、哉”归歌部；次章先押“适、益、谪”的锡部，再回到“为、哉”的歌部；末章则以“敦、遗、摧”为文微通韵，结尾仍收在歌部。全篇三章反复以歌部收束，形成明显的回环。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"wangli-yundu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/wangli-yundu/0002-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"出自北门，忧心殷殷。终窭且贫，莫知我艰。已焉哉！天实为之，谓之何哉！王事适我，政事一埤益我。我入自外，室人交遍谪我。已焉哉！天实为之，谓之何哉！王事敦我，政事一埤遗我。我入自外，室人交遍摧我。已焉哉！天实为之，谓之何哉！\",\"sourceLabel\":\"第 159-160 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"王力在全篇韵读中把《北门》的韵脚分得很细：首章“门、殷、贫、艰”同属文部，随后“为、哉”自成歌部；\",\"fullText\":\"王力在全篇韵读中把《北门》的韵脚分得很细：首章“门、殷、贫、艰”同属文部，随后“为、哉”自成歌部；第二章则以“适、益、谪”入锡部，再用“为、哉”回到歌部；第三章把“敦、遗、摧”记作文微通韵，仍以“为、哉”收结。这样既显出三章各自的声部安排，也凸出了每章末尾同句回环的效果。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:4-4:门\",\"seg-002:3-3:殷\",\"seg-003:4-4:贫\",\"seg-004:4-4:艰\",\"seg-006:3-3:为\",\"seg-007:4-4:哉\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"wangli-yundu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/wangli-yundu/0002-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\" aterialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。\",\"fullText\":\"賦也。朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。故本章所见，是王事既归于我，政事又一概加重于我；而我自外奔走归来，家人却还交相责我，写出其困于内外两端已极。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。\",\"fullText\":\"賦也。朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。故本章所见，是王事既归于我，政事又一概加重于我；而我自外奔走归来，家人却还交相责我，写出其困于内外两端已极。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-008:1-2:王事\",\"seg-008:3-3:適\",\"seg-009:1-2:政事\",\"seg-009:3-3:一\",\"seg-009:4-4:埤\",\"seg-011:5-5:讁\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事適我，政事一埤益我。我入自外，室人交徧讁我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"故本章所见，是王事既归于我，政事又一概加重于我；而我自外奔走归来，家人却还交相责我，写出其困于内外两端已极。\",\"fullText\":\"賦也。朱熹释“王事”是王命所使之事，“適”即加之于我，“政事”则是本国政务；“一”犹皆，“埤”有加厚增益之意，“讁”是责备。故本章所见，是王事既归于我，政事又一概加重于我；而我自外奔走归来，家人却还交相责我，写出其困于内外两端已极。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。\",\"fullText\":\"賦也。朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。与次章相比，这一章进一步把外在差事之逼迫和室人交相摧折之苦推到更重处；但诗人仍只反覆叹“天实为之”，是不敢怨上而归之于天的写法。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。\",\"fullText\":\"賦也。朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。与次章相比，这一章进一步把外在差事之逼迫和室人交相摧折之苦推到更重处；但诗人仍只反覆叹“天实为之”，是不敢怨上而归之于天的写法。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-015:3-3:敦\",\"seg-016:5-5:遺\",\"seg-018:5-5:摧\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"王事敦我，政事一埤遺我。我入自外，室人交徧摧我。已焉哉，天實爲之。謂之何哉。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"与次章相比，这一章进一步把外在差事之逼迫和室人交相摧折之苦推到更重处；但诗人仍只反覆叹“天实为之”，是不敢怨上而归之于天的写法。\",\"fullText\":\"賦也。朱熹说“敦”有投掷般驱逼之意，“遺”是加于我，“摧”则是沮抑困伤。与次章相比，这一章进一步把外在差事之逼迫和室人交相摧折之苦推到更重处；但诗人仍只反覆叹“天实为之”，是不敢怨上而归之于天的写法。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0004-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"北門三章章七句\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"朱熹记《北門》为三章、章七句，\",\"fullText\":\"朱熹记《北門》为三章、章七句，并转录杨氏之说，指出忠信而受重禄，本应用来劝士；今卫之忠臣反至窶贫而莫知其艰，所以见其仕而不得志。尽管如此，诗中仍无怨怼之辞，只知事无可奈何而归之于天，因此尤见忠臣之意。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/040-bei-men/zhuxi-shijichuan-kr1c0009/0004-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":
