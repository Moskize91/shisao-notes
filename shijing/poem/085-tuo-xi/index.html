","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。","sourceLabel":"第 187-188 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。","fullText":"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也。”段玉裁注：“经传皆用为唱字。”按这里指女子带头唱。和，读去声，以歌声相应和。女，汝，这里指男子。按这句是倒文，即“予倡汝和”。韵读：鱼部一一萚（音兔入声）、落；伯（音补入声）。歌部一一吹（音磋）、和。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。漂，通“飘”，释文：“漂，本亦作飘。”要（yāo），通“邀”。按这句是女子希望男子邀请她相会。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/085-tuo-xi/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。","sourceLabel":"第 187-188 页","attributionLabel":"程俊英、蒋见元","sectionLabel":" 原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。","fullText":"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋蘀〔毛氏萇曰〕蘀，槁也。〔孔氏穎達曰〕《七月》云：「十月隕蘀。」《傳》云：「蘀，落也。」然則落葉謂之蘀。此云蘀槁者，謂枯槁乃落也。要成也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集釋","excerpt":"集釋蘀〔毛氏萇曰〕蘀，槁也。〔孔氏穎達曰〕《七月》云：「十月隕蘀。」《傳 ng-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-006:3-3:漂\",\"segmentId\":\"seg-006\",\"segmentOrder\":6,\"surfaceText\":\"漂\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"quwanli-quanshi:0005-1:part-1\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\",\"wangli-yundu\"]},{\"id\":\"seg-007:1-1:叔\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"叔\",\"charStart\":1,\"charEnd\":1,\"entryIds\":[\"quwanli-quanshi:0003-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-007:1-4:叔兮伯兮\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"叔兮伯兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-007:3-3:伯\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"伯\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"quwanli-quanshi:0003-1:part-1\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\",\"wangli-yundu\"]},{\"id\":\"seg-008:1-4:倡予要女\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"倡予要女\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-008:3-3:要\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"要\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"quwanli-quanshi:0006-1:part-1\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\",\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。\",\"sourceLabel\":\"第 187-188 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。\",\"fullText\":\"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也。”段玉裁注：“经传皆用为唱字。”按这里指女子带头唱。和，读去声，以歌声相应和。女，汝，这里指男子。按这句是倒文，即“予倡汝和”。韵读：鱼部一一萚（音兔入声）、落；伯（音补入声）。歌部一一吹（音磋）、和。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。漂，通“飘”，释文：“漂，本亦作飘。”要（yāo），通“邀”。按这句是女子希望男子邀请她相会。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。\",\"sourceLabel\":\"第 187-188 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也 orIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。\",\"fullText\":\"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\" ,\"wangli-yundu\"]},{\"id\":\"seg-008:1-4:倡予要女\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"倡予要女\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-008:3-3:要\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"要\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"quwanli-quanshi:0006-1:part-1\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\",\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。\",\"sourceLabel\":\"第 187-188 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。\",\"fullText\":\"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也。”段玉裁注：“经传皆用为唱字。”按这里指女子带头唱。和，读去声，以歌声相应和。女，汝，这里指男子。按这句是倒文，即“予倡汝和”。韵读：鱼部一一萚（音兔入声）、落；伯（音补入声）。歌部一一吹（音磋）、和。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。漂，通“飘”，释文：“漂，本亦作飘。”要（yāo），通“邀”。按这句是女子希望男子邀请她相会。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。\",\"sourceLabel\":\"第 187-188 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也。”段玉裁注：“经传皆用为唱字。”按这里指女子带头唱。和，读去声，以歌声相应和。女，汝，这里指男子。按这句是倒文，即“予倡汝和”。韵读：鱼部一一萚（音兔入声）、落；伯（音补入声）。歌部一一吹（音磋）、和。\",\"fullText\":\"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也。”段玉裁注：“经传皆用为唱字。”按这里指女子带头唱。和，读去声，以歌声相应和。女，汝，这里指男子。按这句是倒文，即“予倡汝和”。韵读：鱼部一一萚（音兔入声）、落；伯（音补入声）。歌部一一吹（音磋）、和。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。漂，通“飘”，释文：“漂，本亦作飘。”要（yāo），通“邀”。按这句是女子希望男子邀请她相会。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:萚兮萚兮\",\"seg-002:1-4:风其吹女\",\"seg-003:1-4:叔兮伯兮\",\"seg-004:1-4:倡予和女\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。\",\"sourceLabel\":\"第 187-188 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。漂，通“飘”，释文：“漂，本亦作飘。”要（yāo），通“邀”。按这句是女子希望男子邀请她相会。\",\"fullText\":\"这首诗可能是当仲春“会男女”的集体歌舞曲。称叔称伯，显然是女子带头唱起来，男子跟着应和的。而且不止两个人，而是一群男女的合唱。周礼媒氏：“仲春之月，令会男女。于是时也，奔者不禁。若无故而不用令者，罚之。司男女之无夫家者而会之。”说明了诗的社会背景。左传昭十六年记载郑六卿饯宣子，子柳赋萚兮，宣子认为是“昵燕好”之词，可见萚兮的诗旨，在春秋时早认为是女子希望得到亲热的闺房之乐。毛序认为是“刺忽”，此附会之说。宋、清学者对诗旨众说纷纭，不外乎忧国刺时之类，与毛序也大同小异。惟朱熹诗集传说：“此淫女之词。”虽指为“淫女”是他的局限，但看出其中男女情爱的意味则是他的卓见。诗人以风比男，以萚比女，姑娘们希望男子能像风一样吹到她们身上，互相应和，互相期会。这种心情除了以风吹萚来起兴之外，还使用了呼告的形式来表达。“叔兮伯兮”一句热情而又亲切的呼唤，使人想见一群男女欢乐倡和、清歌曼舞的场面，表现了民歌善于渲染气氛的特色。萚兮萚兮，风其吹女。叔兮伯兮，倡予和女。萚（tuò），枯叶。说文：“草木凡皮叶落地为萚。”女，汝，指萚。倡，即唱字。说文：“倡，乐也。”段玉裁注：“经传皆用为唱字。”按这里指女子带头唱。和，读去声，以歌声相应和。女，汝，这里指男子。按这句是倒文，即“予倡汝和”。韵读：鱼部一一萚（音兔入声）、落；伯（音补入声）。歌部一一吹（音磋）、和。萚兮萚兮，风其漂女。叔兮伯兮，倡予要女。漂，通“飘”，释文：“漂，本亦作飘。”要（yāo），通“邀”。按这句是女子希望男子邀请她相会。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-005:1-4:萚兮萚兮\",\"seg-006:1-4:风其漂女\",\"seg-007:1-4:叔兮伯兮\",\"seg-008:1-4:倡予要女\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蘀兮蘀兮，風其吹女。叔兮伯兮，倡予和女。蘀兮蘀兮，風其漂女。叔兮伯兮，倡予要女。\",\"sourceLabel\":\"第 99 页\",\"attributionLabel\":\"陳奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"蘀兮蘀兮，風其吹女。叔兮伯兮，倡予和女。蘀兮蘀兮，風其漂女。叔兮伯兮，倡予要女。\",\"fullText\":\"蘀兮蘀兮，風其吹女。叔兮伯兮，倡予和女。蘀兮蘀兮，風其漂女。叔兮伯兮，倡予要女。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"諷朝臣共扶危也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"諷朝臣共扶危也。\",\"fullText\":\"諷朝臣共扶危也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。\",\"fullText\":\"右《蘀兮》二章，章四句。《序》謂「刺忽」，未始不可。然必曰「君弱臣强，不倡而和」，則非詩意。詩言「叔兮伯兮」，是以倡予者望諸叔伯大夫矣，而何以謂之爲忽耶？《集傳》則更以爲「淫女之詞」。天下行淫之女，豈有呼叔而又呼伯者？且叔伯何所倡而女又何所和？言之不徒污人齒頰，詎可以之釋經？此詩解者雖多，要以嚴氏粲之言爲近，曰：「此小臣有憂國之心，呼諸大夫而告之。言槁葉風吹不能久矣，豈可坐視，以爲無與於己，而不相與扶持之乎？叔伯諸大夫其亟圖之。患無其倡，不患無和之者。」蓋小臣有憂國之心而無救君之力，大臣有扶危之力而無急難之心。當此國是日非、主憂臣辱之秋，而徒爲袖手旁觀者盈廷皆是，以故義奮忠貞不見諸大臣而激於下位也。忽之世，權臣專擅，國君微弱，苟一煽動，如風吹殘蘀，何能久存？然蘀去而附諸蘀以爲命者亦難自立，故不如早爲之備，先發以制人也。惜乎！小臣有是心而無是力，則不得不呼諸叔伯大夫而告之矣。故以是詩而屬忽世，其亦可矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋蘀〔毛氏萇曰〕蘀，槁也。〔孔氏穎達曰〕《七月》云：「十月隕蘀。」《傳》云：「蘀，落也。」然則落葉謂之蘀。此云蘀槁者，謂枯槁乃落也。要成也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋蘀〔毛氏萇曰〕蘀，槁也。〔孔氏穎達曰〕《七月》云：「十月隕蘀。」《傳》云：「蘀，落也。」然則落葉謂之蘀。此云蘀槁者，謂枯槁乃落也。要成也。\",\"fullText\":\"集釋蘀〔毛氏萇曰〕蘀，槁也。〔孔氏穎達曰〕《七月》云：「十月隕蘀。」《傳》云：「蘀，落也。」然則落葉謂之蘀。此云蘀槁者，謂枯槁乃落也。要成也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/085-tuo-xi/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻吹四支。和二十一箇，叶户圭反。叶韻。漂二蕭。要同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻吹四支。和二十一箇，叶
