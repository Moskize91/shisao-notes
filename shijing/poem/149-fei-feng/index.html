，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。","fullText":"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪，彼、那个。王念孙《广雅疏证》：“匪当为彼。‘匪风发兮，匪车倡兮’，犹言彼风之动发发然，彼车之驱倡倡然。”按匪的本义是一种竹制的盛器，训匪为彼，是音近而假借。發，即发发，风声。偈（jié），即偈偈，《韩诗外传》作揭揭，车马疾驶貌。《韩诗》伯兮传：“倡，疾驱貌。”周道，大路。马瑞辰《通释》：“周之言绸。广雅：‘绸，大也。’周道又为通道，亦大道也。凡诗周道，皆谓大路。”怛（dá），忧伤。这二句意为，望着那条平坦的大路，使我心中十分忧伤。韵读：祭、元部通韵一一發、偈、怛。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。飄，飘风，即旋风。毛传：“回风为飘。”这里用来形容风势迅猛旋转。嘌（piào），快速。说文：“驃，疾也。”弔，悲伤。按弔的本义是“有死丧而问之”，悲伤是引申义。韵读：宵部一一飄、嘌、弔。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。亨，古与“烹”通用。溉，本字应作概，洗涤。说文：“慨，涤也。”釜，锅子。鬵（xún），大锅。这二句意为，谁能烧鱼，我愿意替他洗锅子。这是兴句，以兴起下二句。懷，遗、送。毛传：“怀，归也。”归有馈义，即送的意思。这二句意为，谁将向西回故乡去，我想托他送个平安的好消息给家里。韵读：侵部一一鬵、音。","notes":"据 PDF 329-330 页文字层与页文互校整理；剔除了后续《曹风》内容，并将“匪”“偈”“怛”“弔”“鬵”等字按原诗与释文校正。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/149-fei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。","sourceLabel":"第 329-330 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。","fullText":"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评 bel":"题注","excerpt":"匪風㊟傷周道不能復檜也。","fullText":"匪風㊟傷周道不能復檜也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"正序","excerpt":"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？","fullText":"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集釋","excerpt":"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。","fullText":"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"標韻發六月。偈九屑。怛七曷。通韻。飄二蕭，叶匹妙反。嘌並同。弔十八嘯。叶韻。鬵十二侵。音同。本韻。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"標韻","excerpt":"標韻發六月。偈九屑。怛七曷。通韻。飄二蕭，叶匹妙反。嘌並同。弔十八嘯。叶韻。鬵十二侵。音同。本韻。","fullText":"標韻發六月。偈九屑。怛七曷。通韻。飄二蕭，叶匹妙反。嘌並同。弔十八嘯。叶韻。鬵十二侵。音同。本韻。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0005-1:part-1","annotationId":"0005","glossId":"0005-1","glossHref":"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0005-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"span","layerLabel":"诗句片段","targetText":"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。","sourceLabel" 誰將西歸？\",\"charStart\":1,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:1-1:懷\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"懷\",\"charStart\":1,\"charEnd\":1,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:1-4:懷之好音\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"懷之好音\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:4-4:音\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"音\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。\",\"sourceLabel\":\"第 329-330 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。\",\"fullText\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪，彼、那个。王念孙《广雅疏证》：“匪当为彼。‘匪风发兮，匪车倡兮’，犹言彼风之动发发然，彼车之驱倡倡然。”按匪的本义是一种竹制的盛器，训匪为彼，是音近而假借。發，即发发，风声。偈（jié），即偈偈，《韩诗外传》作揭揭，车马疾驶貌。《韩诗》伯兮传：“倡，疾驱貌。”周道，大路。马瑞辰《通释》：“周之言绸。广雅：‘绸，大也。’周道又为通道，亦大道也。凡诗周道，皆谓大路。”怛（dá），忧伤。这二句意为，望着那条平坦的大路，使我心中十分忧伤。韵读：祭、元部通韵一一發、偈、怛。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。飄，飘风，即旋风。毛传：“回风为飘。”这里用来形容风势迅猛旋转。嘌（piào），快速。说文：“驃，疾也。”弔，悲伤。按弔的本义是“有死丧而问之”，悲伤是引申义。韵读：宵部一一飄、嘌、弔。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。亨，古与“烹”通用。溉，本字应作概，洗涤。说文：“慨，涤也。”釜，锅子。鬵（xún），大锅。这二句意为，谁能烧鱼，我愿意替他洗锅子。这是兴句，以兴起下二句。懷，遗、送。毛传：“怀，归也。”归有馈义，即送的意思。这二句意为，谁将向西回故乡去，我想托他送个平安的好消息给家里。韵读：侵部一一鬵、音。\",\"notes\":\"据 PDF 329-330 页文字层与页文互校整理；剔除了后续《曹风》内容，并将“匪”“偈”“怛”“弔”“鬵”等字按原诗与释文校正。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。\",\"sourceLabel\":\"第 329-330 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。\",\"fullText\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看 有馈义，即送的意思。这二句意为，谁将向西回故乡去，我想托他送个平安的好消息给家里。韵读：侵部一一鬵、音。\",\"notes\":\"据 PDF 329-330 页文字层与页文互校整理；剔除了后续《曹风》内容，并将“匪”“偈”“怛”“弔”“鬵”等字按原诗与释文校正。\",\"partOrder\":10,\"anchorIds\":[\"seg-010:4-4:鬵\",\"seg-012:4-4:音\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"匪風㊟傷周道不能復檜也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"匪風㊟傷周道不能復檜也。\",\"fullText\":\"匪風㊟傷周道不能復檜也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？\",\"fullText\":\"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。\",\"fullText\":\"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAn tionId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。\",\"sourceLabel\":\"第 329-330 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。\",\"fullText\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪，彼、那个。王念孙《广雅疏证》：“匪当为彼。‘匪风发兮，匪车倡兮’，犹言彼风之动发发然，彼车之驱倡倡然。”按匪的本义是一种竹制的盛器，训匪为彼，是音近而假借。發，即发发，风声。偈（jié），即偈偈，《韩诗外传》作揭揭，车马疾驶貌。《韩诗》伯兮传：“倡，疾驱貌。”周道，大路。马瑞辰《通释》：“周之言绸。广雅：‘绸，大也。’周道又为通道，亦大道也。凡诗周道，皆谓大路。”怛（dá），忧伤。这二句意为，望着那条平坦的大路，使我心中十分忧伤。韵读：祭、元部通韵一一發、偈、怛。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。飄，飘风，即旋风。毛传：“回风为飘。”这里用来形容风势迅猛旋转。嘌（piào），快速。说文：“驃，疾也。”弔，悲伤。按弔的本义是“有死丧而问之”，悲伤是引申义。韵读：宵部一一飄、嘌、弔。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。亨，古与“烹”通用。溉，本字应作概，洗涤。说文：“慨，涤也。”釜，锅子。鬵（xún），大锅。这二句意为，谁能烧鱼，我愿意替他洗锅子。这是兴句，以兴起下二句。懷，遗、送。毛传：“怀，归也。”归有馈义，即送的意思。这二句意为，谁将向西回故乡去，我想托他送个平安的好消息给家里。韵读：侵部一一鬵、音。\",\"notes\":\"据 PDF 329-330 页文字层与页文互校整理；剔除了后续《曹风》内容，并将“匪”“偈”“怛”“弔”“鬵”等字按原诗与释文校正。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{ 西歸？懷之好音。\",\"sourceLabel\":\"第 329-330 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。\",\"fullText\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪，彼、那个。王念孙《广雅疏证》：“匪当为彼。‘匪风发兮，匪车倡兮’，犹言彼风之动发发然，彼车之驱倡倡然。”按匪的本义是一种竹制的盛器，训匪为彼，是音近而假借。發，即发发，风声。偈（jié），即偈偈，《韩诗外传》作揭揭，车马疾驶貌。《韩诗》伯兮传：“倡，疾驱貌。”周道，大路。马瑞辰《通释》：“周之言绸。广雅：‘绸，大也。’周道又为通道，亦大道也。凡诗周道，皆谓大路。”怛（dá），忧伤。这二句意为，望着那条平坦的大路，使我心中十分忧伤。韵读：祭、元部通韵一一發、偈、怛。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。飄，飘风，即旋风。毛传：“回风为飘。”这里用来形容风势迅猛旋转。嘌（piào），快速。说文：“驃，疾也。”弔，悲伤。按弔的本义是“有死丧而问之”，悲伤是引申义。韵读：宵部一一飄、嘌、弔。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。亨，古与“烹”通用。溉，本字应作概，洗涤。说文：“慨，涤也。”釜，锅子。鬵（xún），大锅。这二句意为，谁能烧鱼，我愿意替他洗锅子。这是兴句，以兴起下二句。懷，遗、送。毛传：“怀，归也。”归有馈义，即送的意思。这二句意为，谁将向西回故乡去，我想托他送个平安的好消息给家里。韵读：侵部一一鬵、音。\",\"notes\":\"据 PDF 329-330 页文字层与页文互校整理；剔除了后续《曹风》内容，并将“匪”“偈”“怛”“弔”“鬵”等字按原诗与释文校正。\",\"partOrder\":8,\"anchorIds\":[\"seg-009:1-5:誰能亨魚？\",\"seg-010:1-4:溉之釜鬵\",\"seg-011:1-5:誰將西歸？\",\"seg-012:1-4:懷之好音\"],\"glossAnchorIds\":[\"anchor-8-1\",\"anchor-8-2\",\"anchor-8-3\",\"anchor-8-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。\",\"sourceLabel\":\"第 329-330 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\" onLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：侵部一一鬵、音。\",\"fullText\":\"这是一位游子思乡的诗。有人说，作者是从西方流落到东方桧国的人；有人说，作者是离开桧国到东方去的人。现在无从考证，只得存疑。毛序：“匪风，思周道也。国小政乱，忧及祸难，而思周道焉。”序说周道为周之政令，但从“顾瞻周道”一句来看，序说未免牵强。朱熹《诗集传》：“周道，适周之路也。”比毛序来得通。前人评此诗，都赞它“起得飘忽”“起势超忽”，这是说前两章赋体突兀而起，渲染出一幅画图：风起尘扬，车马疾驶，飘零异乡，难抑归思。而末章反用兴法，将思归之情衬托得淋漓透彻，风致极胜。岑参《逢入京使》“故园东望路漫漫，双袖龙钟泪不干。马上相逢无纸笔，凭君传语报平安”，其情其景，真有与《匪风》如出一辙者。由此可以看出，《诗经》在创造诗的意境方面确有发轫开源的作用。匪風發兮，匪車偈兮。顧瞻周道，中心怛兮。匪，彼、那个。王念孙《广雅疏证》：“匪当为彼。‘匪风发兮，匪车倡兮’，犹言彼风之动发发然，彼车之驱倡倡然。”按匪的本义是一种竹制的盛器，训匪为彼，是音近而假借。發，即发发，风声。偈（jié），即偈偈，《韩诗外传》作揭揭，车马疾驶貌。《韩诗》伯兮传：“倡，疾驱貌。”周道，大路。马瑞辰《通释》：“周之言绸。广雅：‘绸，大也。’周道又为通道，亦大道也。凡诗周道，皆谓大路。”怛（dá），忧伤。这二句意为，望着那条平坦的大路，使我心中十分忧伤。韵读：祭、元部通韵一一發、偈、怛。匪風飄兮，匪車嘌兮。顧瞻周道，中心弔兮。飄，飘风，即旋风。毛传：“回风为飘。”这里用来形容风势迅猛旋转。嘌（piào），快速。说文：“驃，疾也。”弔，悲伤。按弔的本义是“有死丧而问之”，悲伤是引申义。韵读：宵部一一飄、嘌、弔。誰能亨魚？溉之釜鬵。誰將西歸？懷之好音。亨，古与“烹”通用。溉，本字应作概，洗涤。说文：“慨，涤也。”釜，锅子。鬵（xún），大锅。这二句意为，谁能烧鱼，我愿意替他洗锅子。这是兴句，以兴起下二句。懷，遗、送。毛传：“怀，归也。”归有馈义，即送的意思。这二句意为，谁将向西回故乡去，我想托他送个平安的好消息给家里。韵读：侵部一一鬵、音。\",\"notes\":\"据 PDF 329-330 页文字层与页文互校整理；剔除了后续《曹风》内容，并将“匪”“偈”“怛”“弔”“鬵”等字按原诗与释文校正。\",\"partOrder\":10,\"anchorIds\":[\"seg-010:4-4:鬵\",\"seg-012:4-4:音\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"匪風㊟傷周道不能復檜也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"匪風㊟傷周道不能復檜也。\",\"fullText\":\"匪風㊟傷周道不能復檜也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？\",\"fullText\":\"右《匪風》三章，章四句。此詩諸儒皆泛作「思周之作」，未嘗即檜時勢而一論之。則是詩可以作可以不作，采風者亦可以存可以不存。何也？以其言中無物，則所存亦不久耳。檜當國破家亡，人民離散，轉徙無常，欲住無家，欲逃何往，所謂中心慘怛，妻孥相弔時也。凡物不能自發，因風而發，行不能遽偈，因車而偈。今也匪風而物自發矣，匪車而行自偈矣。而且物之發也，旋轉不定。行之偈也，漂摇難安。此何如景況乎？果誰爲之咎也？非周轍之東不至此。奚以見其然耶？曰：鄭桓公之謀伐虢與檜也久矣，然未幾而旋亡。使周轍不東，檜亦未必受迫於鄭。其或王綱再振，鄭必不敢加兵於檜。而今已矣，悔無及矣，不能不顧瞻周道而自傷也。雖然，文、武、成、康之靈，昭然在天。周之興也，豈能無望哉？蓋周興，則我小國亦與之俱興矣。搔首茫茫，其誰能亨魚乎？有，則我願爲之溉其釜鬵也。其誰將西歸乎？有，則我願慰之以好音也。特恐思之殷然，遇之漠然，不能無慨於其際，則真末如之何也已矣。此檜臣自傷周道之不能興復其國也。不料諸儒但以爲思周道之陵遲，則豈詩人意旨哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。\",\"fullText\":\"集釋發飄揚貌。偈疾驅貌。周道説見篇中。〔《集傳》〕作適周之路，亦通。怛傷也。飄。回風曰飄。嘌漂摇不安之貌。溉滌也。鬵釡屬。〔陸氏德明曰〕《説文》云：「大釡也。一曰鼎大上小下若甑曰鬵。」〔孔氏穎達曰〕《釋器》云：「䰝謂之鬵。」孫炎曰：「關東謂甑曰鬵。」然則鬵是甑，亨魚用釜不用甑，雙舉者，以其俱是食器，故連言耳。案：鬵非釜非甑，腹形若鼎，上有鐶，别架三足於下，可烹可蒸，俗名釣鍋之説爲近。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻發六月。偈九屑。怛七曷。通韻。飄二蕭，叶匹妙反。嘌並同。弔十八嘯。叶韻。鬵十二侵。音同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻發六月。偈九屑。怛七曷。通韻。飄二蕭，叶匹妙反。嘌並同。弔十八嘯。叶韻。鬵十二侵。音同。本韻。\",\"fullText\":\"標韻發六月。偈九屑。怛七曷。通韻。飄二蕭，叶匹妙反。嘌並同。弔十八嘯。叶韻。鬵十二侵。音同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/149-fei-feng/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"匪風發兮，匪車偈兮。顧瞻周道
