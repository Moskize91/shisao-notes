nyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-022:4-4:日","segmentId":"seg-022","segmentOrder":22,"surfaceText":"日","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-023:1-4:宛其死矣","segmentId":"seg-023","segmentOrder":23,"surfaceText":"宛其死矣","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-024:1-4:他人入室","segmentId":"seg-024","segmentOrder":24,"surfaceText":"他人入室","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-024:4-4:室","segmentId":"seg-024","segmentOrder":24,"surfaceText":"室","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/115-shan-you-shu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。","sourceLabel":"第 239-241 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。","fullText":"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。枢，鲁诗作踵，都是同音假借字，今名刺榆。隰，低洼的地。榆，落叶乔木，白色者谓之白枌。按这二句是兴句，诗人以山隰有木材不能自用，只供他人用，兴守财奴有财宝不知享用，等他死了却供别人享受。曳，拖。娄，搂的假借。曳、搂都是穿衣的动作，这里泛指穿衣。驰、驱，按古代驰、驱二字有区别，走马谓之驰，策马谓之驱；但这里浑言不别，俱指乘车。宛，苑的假借字，枯萎。其，句中助词。愉，快乐、享乐。这二句意为，你要是老病死了，这些东西还不都归别人享用？韵读：侯部一一枢、榆、娄、驱、愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。栲，又名山樗，落叶小乔木，今名臭椿。杻，又名檍，梓属，高大乔木，木材可作弓弩杆。廷，通“庭”，院子。内，指堂室。鼓，敲打。考，攷的假借字。保，占有。韵读：幽部一一栲、杻、扫、考、保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。漆，漆树。且，姑且。以，用，指上二句饮食作乐。永，长，这里作动词用，是延长之意。朱熹《诗集传》：“人多忧，则觉日短，饮食作乐，可以永长此日也。”韵读：质部一一漆、栗、瑟、日、室。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/115-shan-you-shu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。","sourceLabel":"第 239-241 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。","fullText":"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人 rialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。","fullText":"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集釋","excerpt":"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。","fullText":"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也 ing-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-020:5-5:瑟\",\"segmentId\":\"seg-020\",\"segmentOrder\":20,\"surfaceText\":\"瑟\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-021:1-4:且以喜乐\",\"segmentId\":\"seg-021\",\"segmentOrder\":21,\"surfaceText\":\"且以喜乐\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-022:1-4:且以永日\",\"segmentId\":\"seg-022\",\"segmentOrder\":22,\"surfaceText\":\"且以永日\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-022:4-4:日\",\"segmentId\":\"seg-022\",\"segmentOrder\":22,\"surfaceText\":\"日\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-023:1-4:宛其死矣\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"宛其死矣\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:他人入室\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"他人入室\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:4-4:室\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"室\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。\",\"sourceLabel\":\"第 239-241 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。\",\"fullText\":\"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。枢，鲁诗作踵，都是同音假借字，今名刺榆。隰，低洼的地。榆，落叶乔木，白色者谓之白枌。按这二句是兴句，诗人以山隰有木材不能自用，只供他人用，兴守财奴有财宝不知享用，等他死了却供别人享受。曳，拖。娄，搂的假借。曳、搂都是穿衣的动作，这里泛指穿衣。驰、驱，按古代驰、驱二字有区别，走马谓之驰，策马谓之驱；但这里浑言不别，俱指乘车。宛，苑的假借字，枯萎。其，句中助词。愉，快乐、享乐。这二句意为，你要是老病死了，这些东西还不都归别人享用？韵读：侯部一一枢、榆、娄、驱、愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。栲，又名山樗，落叶小乔木，今名臭椿。杻，又名檍，梓属，高大乔木，木材可作弓弩杆。廷，通“庭”，院子。内，指堂室。鼓，敲打。考，攷的假借字。保，占有。韵读：幽部一一栲、杻、扫、考、保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。漆，漆树。且，姑且。以，用，指上二句饮食作乐。永，长，这里作动词用，是延长之意。朱熹《诗集传》：“人多忧，则觉日短，饮食作乐，可以永长此日也。”韵读：质部一一漆、栗、瑟、日、室。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhu 》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。枢，鲁诗作踵，都是同音假借字，今名刺榆。隰，低洼的地。榆，落叶乔木，白色者谓之白枌。按这二句是兴句，诗人以山隰有木材不能自用，只供他人用，兴守财奴有财宝不知享用，等他死了却供别人享受。曳，拖。娄，搂的假借。曳、搂都是穿衣的动作，这里泛指穿衣。驰、驱，按古代驰、驱二字有区别，走马谓之驰，策马谓之驱；但这里浑言不别，俱指乘车。宛，苑的假借字，枯萎。其，句中助词。愉，快乐、享乐。这二句意为，你要是老病死了，这些东西还不都归别人享用？韵读：侯部一一枢、榆、娄、驱、愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。栲，又名山樗，落叶小乔木，今名臭椿。杻，又名檍，梓属，高大乔木，木材可作弓弩杆。廷，通“庭”，院子。内，指堂室。鼓，敲打。考，攷的假借字。保，占有。韵读：幽部一一栲、杻、扫、考、保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。漆，漆树。且，姑且。以，用，指上二句饮食作乐。永，长，这里作动词用，是延长之意。朱熹《诗集传》：“人多忧，则觉日短，饮食作乐，可以永长此日也。”韵读：质部一一漆、栗、瑟、日、室。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-017:3-3:漆\",\"seg-018:3-3:栗\",\"seg-020:5-5:瑟\",\"seg-022:4-4:日\",\"seg-024:4-4:室\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺唐人儉不中禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺唐人儉不中禮也。\",\"fullText\":\"刺唐人儉不中禮也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。\",\"fullText\":\"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。\",\"fullText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"fullText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"樞七虞。榆、婁、驅、愉並同。本韻。栲十九皓。杻二十五有，叶女九反。考、保並同。叶韻。漆四質。栗、瑟、日、室並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"樞七虞。榆、婁、驅、愉並同。本韻。\",\"fullText\":\"樞七虞。榆、婁、驅、愉並同。本韻。栲十九皓。杻二十五有，叶女九反。考、保並同。叶韻。漆四質。栗、瑟、日、室並同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\" gmentOrder\":22,\"surfaceText\":\"日\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-023:1-4:宛其死矣\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"宛其死矣\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:他人入室\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"他人入室\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:4-4:室\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"室\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。\",\"sourceLabel\":\"第 239-241 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。\",\"fullText\":\"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节，便可当一部挽歌。”确是评出了这首诗的特点。此诗所反映的颓唐心理与前篇《蟋蟀》的节制心理颇不同，细细对读，便能体会词气抑扬之间，意旨迥别。方玉润谓《蟋蟀》为“谨守见道之人所作”，《山有枢》为“庄子委蜕、释氏本空一流人语”，很有见地。山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。枢，鲁诗作踵，都是同音假借字，今名刺榆。隰，低洼的地。榆，落叶乔木，白色者谓之白枌。按这二句是兴句，诗人以山隰有木材不能自用，只供他人用，兴守财奴有财宝不知享用，等他死了却供别人享受。曳，拖。娄，搂的假借。曳、搂都是穿衣的动作，这里泛指穿衣。驰、驱，按古代驰、驱二字有区别，走马谓之驰，策马谓之驱；但这里浑言不别，俱指乘车。宛，苑的假借字，枯萎。其，句中助词。愉，快乐、享乐。这二句意为，你要是老病死了，这些东西还不都归别人享用？韵读：侯部一一枢、榆、娄、驱、愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。栲，又名山樗，落叶小乔木，今名臭椿。杻，又名檍，梓属，高大乔木，木材可作弓弩杆。廷，通“庭”，院子。内，指堂室。鼓，敲打。考，攷的假借字。保，占有。韵读：幽部一一栲、杻、扫、考、保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。漆，漆树。且，姑且。以，用，指上二句饮食作乐。永，长，这里作动词用，是延长之意。朱熹《诗集传》：“人多忧，则觉日短，饮食作乐，可以永长此日也。”韵读：质部一一漆、栗、瑟、日、室。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。山有栲，隰有杻。子有廷内，弗洒弗扫。子有钟鼓，弗鼓弗考。宛其死矣，他人是保。山有漆，隰有栗。子有酒食，何不日鼓瑟？且以喜乐，且以永日。宛其死矣，他人入室。\",\"sourceLabel\":\"第 239-241 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"山有枢，隰有榆。子有衣裳，弗曳弗娄。子有车马，弗驰弗驱。宛其死矣，他人是愉。\",\"fullText\":\"这是一首讽刺守财奴、宣扬及时行乐的诗。毛序认为讽刺晋昭公“有财不能用，有钟鼓不能以自乐，有朝廷不能洒扫”；三家诗认为“当周公、召公共和之时，成侯曾孙倍侯甚啬爱物，俭不中礼，国人闵之，唐之变风始作。”从诗的内容来看，确也是厌恶吝啬成性，提倡放荡恣纵的歌唱。但是在放浪形骸的外壳里，却蕴藏着很深的怅惘和空虚的心声。钟惺评点《诗经》云：“行乐之词，乃以斥苦之音出之，开后来诗人许多忧生惜日之感。末语促节 eg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺唐人儉不中禮也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺唐人儉不中禮也。\",\"fullText\":\"刺唐人儉不中禮也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。\",\"fullText\":\"右《山有樞》三章，章八句。此諷唐人富者徒儉而不中禮之詩，與前篇針鋒相對。蓋前作唐人自以爲憂深思遠樂得當矣，而豈知其適成唐人面目而已。故詩人作此，以誚之曰：子以好樂無荒爲戒者，不過爲子孫長保此富貴計耳。豈知富貴無常，子孫易敗，轉眴之間，徒爲人有。則何如及時行樂之爲善乎？此類《莊子》委蜕、釋氏本空一流人語，原不足以爲世訓。然以破唐人吝嗇不堪之見，則誠對症良藥。故二詩可以並存也。序説紛紛，或以爲「刺昭公」，《小序》。或以爲「答前篇之意而解其憂」，《集傳》。又或以爲「刺時君之敗亡者」，姚氏所主。何異夢中説夢？時君將亡，必望其急早修政以收拾人心爲主，豈有勸其及時行樂，自速死亡乎？至前詩之憂，亦無煩待人解者。詞氣抑揚之間，意旨迥别。在人善會之而已。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。\",\"fullText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/115-shan-you-shu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"樞荎也。陸璣《疏》云：樞，其針刺如柘，其葉如榆，爲茹，美滑於白榆也。榆之類有十種，葉皆相似，皮及理異耳。榆白榆也。《爾雅》疏曰：「榆之皮色白者名枌。」婁亦曳也。宛坐見貌。愉樂也。栲山樗也。郭璞曰：栲，似樗，生山中，亦類漆樹。俗語曰：「櫄、樗、栲、漆，相似如一。」杻檍也。〔陸氏璣曰〕杻，枝葉茂好，二月中葉疏，華如楝而細，蘂正白。今官園種之，正名曰萬歲。考擊也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLa
