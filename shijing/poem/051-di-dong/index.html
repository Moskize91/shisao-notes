ionYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"乃如之人也，怀昏姻也。大无信也，不知命也。","sourceLabel":"第 110 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"章旨在斥其纵欲坏礼、失信违命。","fullText":"末章“乃如之人也，怀昏姻也。大无信也，不知命也”转入直斥。程、蒋综述诸说，谓“乃如之人”多指私奔女子，亦备录王先谦指男子之说。又引训诂说明“怀”可通“坏”，有败坏婚姻正道之意（亦可训“思”）；“信”重在贞信，“命”以父母之命为当。章旨在斥其纵欲坏礼、失信违命。","notes":null,"partOrder":4,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"preface","layerLabel":"篇序","targetText":"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也","sourceLabel":"第 13 页","attributionLabel":"诗序","sectionLabel":"序","excerpt":"序：《蝃蝀》，止奔也。","fullText":"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"preface","layerLabel":"篇序","targetText":"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也","sourceLabel":"第 13 页","attributionLabel":"诗序","sectionLabel":"序","excerpt":"衛文公能以道化其民，淫奔之恥，國人不齒也。","fullText":"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。","notes":null,"partOrder":2,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。","sourceLabel":"第 13-14 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。","fullText":"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。次章“朝隮于西，崇朝其雨。女子有行，遠兄弟父母”，以“隮”为虹气上升，言气象感应可验，则男女之分、嫁娶之礼亦有常则，不可违其伦序。末章“乃如之人也，懷婚姻也。大無信也，不知命也”，直斥淫奔者惟务私欲，失其贞信，不知婚姻当待父母之命，故篇意归于深恶而严戒之。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。","sourceLabel":"第 13-14 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。","fullText":"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。次章“朝隮于西，崇朝其雨。女子有行，遠兄弟父母”，以“隮”为虹气上升，言气象感应可验，则男女之分、嫁娶之礼亦有常则，不可违其伦序。末章“乃如之人也，懷婚姻也。大無信也，不知命也”，直斥淫奔者惟务私欲，失其贞信，不知婚姻当待父母之命，故篇意归于深恶而严戒之。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-4:蝃蝀在東","seg-002:1-4:莫之敢指","seg-003:1-4:女子有行","seg-004:1-5:遠父母兄弟"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0002-1:part-3","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。","so \":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在东，莫之敢指。女子有行，远父母兄弟。\",\"sourceLabel\":\"第 109 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“蝃蝀”为虹，古人认为阴阳不和、婚姻错乱则虹气盛，故以此象征淫邪风气；“莫之敢指”写人见此象而有所忌讳。\",\"fullText\":\"首章“蝃蝀在东，莫之敢指。女子有行，远父母兄弟”以虹起兴。程、蒋释“蝃蝀”为虹，古人认为阴阳不和、婚姻错乱则虹气盛，故以此象征淫邪风气；“莫之敢指”写人见此象而有所忌讳。又释“女子有行”本指女子出嫁，却在此语境中带讽刺意味，强调女子本应依礼而行，不当越礼私奔。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-002:1-4:莫之敢指\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在东，莫之敢指。女子有行，远父母兄弟。\",\"sourceLabel\":\"第 109 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又释“女子有行”本指女子出嫁，却在此语境中带讽刺意味，强调女子本应依礼而行，不当越礼私奔。\",\"fullText\":\"首章“蝃蝀在东，莫之敢指。女子有行，远父母兄弟”以虹起兴。程、蒋释“蝃蝀”为虹，古人认为阴阳不和、婚姻错乱则虹气盛，故以此象征淫邪风气；“莫之敢指”写人见此象而有所忌讳。又释“女子有行”本指女子出嫁，却在此语境中带讽刺意味，强调女子本应依礼而行，不当越礼私奔。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-003:1-4:女子有行\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西，崇朝其雨。女子有行，远兄弟父母。\",\"sourceLabel\":\"第 109-110 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“朝隮于西，崇朝其雨。女子有行，远兄弟父母”承上章复唱。\",\"fullText\":\"次章“朝隮于西，崇朝其雨。女子有行，远兄弟父母”承上章复唱。程、蒋释“隮”为虹，“朝隮”即晨虹，并引旧说“暮虹截雨，朝虹行雨”说明其与天象变化相关；“崇”通“终”，“崇朝”指整个早晨（自日初出至朝食前后）。后半仍复“女子有行”之句，重申婚嫁当循常道，反衬诗中所刺之失序。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:1-4:朝隮于西\",\"seg-006:1-4:崇朝其雨\",\"seg-007:1-4:女子有行\",\"seg-008:1-5:远兄弟父母\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西，崇朝其雨。女子有行，远兄弟父母。\",\"sourceLabel\":\"第 109-110 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“隮”为虹，“朝隮”即晨虹，并引旧说“暮虹截雨，朝虹行雨”说明其与天象变化相关；“崇”通“终”，“崇朝”指整个早晨（自日初出至朝食前后）。\",\"fullText\":\"次章“朝隮于西，崇朝其雨。女子有行，远兄弟父母”承上章复唱。程、蒋释“隮”为虹，“朝隮”即晨虹，并引旧说“暮虹截雨，朝虹行雨”说明其与天象变化相关；“崇”通“终”，“崇朝”指整个早晨（自日初出至朝食前后）。后半仍复“女子有行”之句，重申婚嫁当循常道，反衬诗中所刺之失序。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:2-2:隮\",\"seg-005:1-1:朝\",\"seg-006:1-1:崇\",\"seg-006:2-2:朝\",\"seg-006:4-4:雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jian :\"末章“乃如之人也，怀昏姻也。大无信也，不知命也”转入直斥。程、蒋综述诸说，谓“乃如之人”多指私奔女子，亦备录王先谦指男子之说。又引训诂说明“怀”可通“坏”，有败坏婚姻正道之意（亦可训“思”）；“信”重在贞信，“命”以父母之命为当。章旨在斥其纵欲坏礼、失信违命。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也\",\"sourceLabel\":\"第 13 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《蝃蝀》，止奔也。\",\"fullText\":\"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也\",\"sourceLabel\":\"第 13 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"fullText\":\"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 13-14 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。\",\"fullText\":\"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。次章“朝隮于西，崇朝其雨。女子有行，遠兄弟父母”，以“隮”为虹气上升，言气象感应可验，则男女之分、嫁娶之礼亦有常则，不可违其伦序。末章“乃如之人也，懷婚姻也。大無信也，不知命也”，直斥淫奔者惟务私欲，失其贞信，不知婚姻当待父母之命，故篇意归于深恶而严戒之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 13-14 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。\",\"fullText\":\"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。次章“朝隮于西，崇朝其雨。女子有行，遠兄弟父母”，以“隮”为虹气上升，言气象感应可验，则男女之分、嫁娶之礼亦有常则，不可违其伦序。末章“乃如之人也，懷婚姻也。大無信也，不知命也”，直斥淫奔者惟务私欲，失其贞信，不知婚姻当待父母之命，故篇意归于深恶而严戒之。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:蝃蝀在東\",\"seg-002:1-4:莫之敢指\",\"seg-003:1-4:女子有行\",\"seg-004:1-5:遠父母兄弟\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuansh lossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\",\"anchor-4-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀㊟代衛宣姜答《新臺》也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注以“代衛宣姜答《新臺》”定篇，\",\"fullText\":\"方玉润题注以“代衛宣姜答《新臺》”定篇，谓此诗为设宣姜口吻对《新臺》作答。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀㊟代衛宣姜答《新臺》也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"谓此诗为设宣姜口吻对《新臺》作答。\",\"fullText\":\"方玉润题注以“代衛宣姜答《新臺》”定篇，谓此诗为设宣姜口吻对《新臺》作答。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评先辨《小序》《大序》“止奔”“美文公”两说皆未得其要，谓若专作刺淫则“遠父母兄弟”“大無信”“不知命”难通。\",\"fullText\":\"方玉润总评先辨《小序》《大序》“止奔”“美文公”两说皆未得其要，谓若专作刺淫则“遠父母兄弟”“大無信”“不知命”难通。其又议何楷“刺宣公夺伋妇”说虽近似，然《邶風》既有《新臺》，不当重出；遂据姚际恒说，转定此篇为与《新臺》相唱答的代言讽刺：设宣姜自述远嫁无依、遭卫宣无信夺妇，虽知其非而无从控告，正如蝃蝀淫邪之气朝西暮东、忽晴忽雨。末言此解可使全诗豁然，但因无实证，故仍存疑而不遽定。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其又议何楷“刺宣公夺伋妇”说虽近似，然《邶風》既有《新臺》，不当重出；遂据姚际恒说，转定此篇为与《新臺》相唱答的代言讽刺：设宣姜自述远嫁无依、遭卫宣无信夺妇，虽知其非而无从控告，正如蝃蝀淫邪之气朝西暮东、忽晴忽雨。\",\"fullText\":\"方玉润总评先辨《小序》《大序》“止奔”“美文公”两说皆未得其要，谓若专作刺淫则“遠父母兄弟”“大無信”“不知命”难通。其又议何楷“刺宣公夺伋妇”说虽近似，然《邶風》既有《新臺》，不当重出；遂据姚际恒说，转定此篇为与《新臺》相唱答的代言讽刺：设宣姜自述远嫁无依、遭卫宣无信夺妇，虽知其非而无从控告，正如蝃蝀淫邪之气朝西暮东、忽晴忽雨。末言此解可使全诗豁然，但因无实证，故仍存疑而不遽定。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"末言此解可使全诗豁然，但因无实证，故仍存疑而不遽定。\",\"fullText\":\"方玉润总评先辨《小序》《大序》“止奔”“美文公”两说皆未得其要，谓若专作刺淫则“遠父母兄弟”“大無信”“不知命”难通。其又议何楷“刺宣公夺伋妇”说虽近似，然《邶風》既有《新臺》，不当重出；遂据姚际恒说，转定此篇为与《新臺》相唱答的代言讽刺：设宣姜自述远嫁无依、遭卫宣无信夺妇，虽知其非而无从控告，正如蝃蝀淫邪之气朝西暮东、忽晴忽雨。末言此解可使全诗豁然，但因无实证，故仍存疑而不遽定。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"方玉润眉评谓：以蝃蝀忽雨忽晴、东西无定之象，\",\"fullText\":\"方玉润眉评谓：以蝃蝀忽雨忽晴、东西无定之象，比卫宣失德，譬喻巧切。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"比卫宣失德，譬喻巧切。\",\"fullText\":\"方玉润眉评谓：以蝃蝀忽雨忽晴、东西无定之象，比卫宣失德，譬喻巧切。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東朝隮于西崇朝其雨\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释引《集傳》谓蝃蝀为虹，是阴阳不当交之“淫气”，随日影而“朝西暮东”，故“在東”指暮虹。\",\"fullText\":\"方玉润集释引《集傳》谓蝃蝀为虹，是阴阳不当交之“淫气”，随日影而“朝西暮东”，故“在東”指暮虹。又据《周禮》十煇注与姚际恒说，释“朝隮”为朝虹，如自下升；“崇”训终，“崇朝其雨”即终朝有雨，并称今人误认虹惟止雨，多因朝虹不易见。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-001:3-4:在東\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東朝隮于西崇朝其雨\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"又据《周禮》十煇注与姚际恒说，释“朝隮”为朝虹，如自下升；“崇”训终，“崇朝其雨”即终朝有雨，并称今人误认虹惟止雨，多因朝虹不易见。\",\"fullText\":\"方玉润集释引《集傳》谓蝃蝀为虹，是阴阳不当交之“淫气”，随日影而“朝西暮东”，故“在東”指暮虹。又据《周禮》十煇注与姚际恒说，释“朝隮”为朝虹，如自下升；“崇”训终，“崇朝其雨”即终朝有雨，并称今人误认虹惟止雨，多因朝虹不易见。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:1-2:朝隮\",\"seg-006:1-1:崇\",\"seg-006:1-4:崇朝其雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"标韵\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"方玉润标韵云：首章“指”四紙与“弟”八薺通韵；\",\"fullText\":\"方玉润标韵云：首章“指”四紙与“弟”八薺通韵；次章“雨”七麌与“母”二十五有叶韵；末章“人、姻”为十一真本韵，“信”十二震与“命”二十四敬通韵。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-2\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"标韵\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"次章“雨”七麌与“母”二十五有叶韵；\",\"fullText\":\"方玉润标韵云：首章“指”四紙与“弟 tes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。\",\"fullText\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？箋云：行，道也。婦人生而有適人之道，何憂於不嫁，而為淫奔之過乎？惡之甚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-002:1-4:莫之敢指\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？\",\"fullText\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？箋云：行，道也。婦人生而有適人之道，何憂於不嫁，而為淫奔之過乎？惡之甚。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-002:3-4:敢指\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\ ,\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"乃如之人也懷婚姻也大無信也不知命也\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"乃如是淫奔之人也。\",\"fullText\":\"乃如是淫奔之人也。箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-2:乃如\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"乃如之人也懷婚姻也大無信也不知命也\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。\",\"fullText\":\"乃如是淫奔之人也。箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:2-3:婚姻\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"乃如之人也懷婚姻也大無信也不知命也\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"fullText\":\"乃如是淫奔之人也。箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-010:2-3:婚姻\",\"seg-011:1-2:大無\",\"seg-012:3-3:命\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"屈万里谓《蝃蝀》\",\"fullText\":\"屈万里谓《蝃蝀》“此盖既嫁之女而拒其他求婚者之诗”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"“此盖既嫁之女而拒其他求婚者之诗”。\",\"fullText\":\"屈万里谓《蝃蝀》“此盖既嫁之女而拒其他求婚者之诗”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷昏姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“蝃蝀”为虹，音帝东，并记北方旧俗戒小儿指虹，故“莫之敢指”未必专牵附淫奔。\",\"fullText\":\"屈万里释“蝃蝀”为虹，音帝东，并记北方旧俗戒小儿指虹，故“莫之敢指”未必专牵附淫奔。又释“有行”为出嫁，“隮”为虹，并引“东虹晴，西虹雨”以释“崇朝其雨”。末章释“乃如”为转语词，“之”为是，“大”读为“太”，据“大無信也”疑其人昔曾约婚而未践言；并释“命”为命运。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-002:1-4:莫之敢指\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷昏姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"又释“有行”为出嫁，“隮”为虹，并引“东虹晴，西虹雨”以释“崇朝其雨”。\",\"fullText\":\"屈万里释“蝃蝀”为虹，音帝东，并记北方旧俗戒小儿指虹，故“莫之敢指”未必专牵附淫奔。又释“有行”为出嫁，“隮”为虹，并引“东虹晴，西虹雨”以释“崇朝其雨”。末章释“乃如”为转语词，“之”为是，“大”读为“太”，据“大無信也”疑其人昔曾约婚而未践言；并释“命”为命运。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:3-4:有行\",\"seg-007:3-4:有行\",\"seg-005:2-2:隮\",\"seg-006:1-4:崇朝其雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"lay alId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"比也。蝃蝀、虹也。日與雨交、倐然成質。似有血氣之類。乃陰陽之氣、不當交而交者。蓋天地之淫氣也。在東者、莫虹也。虹隨日所映。故朝西而莫東也。\",\"fullText\":\"比也。蝃蝀、虹也。日與雨交、倐然成質。似有血氣之類。乃陰陽之氣、不當交而交者。蓋天地之淫氣也。在東者、莫虹也。虹隨日所映。故朝西而莫東也。○此刺淫奔之詩。言蝃蝀在東、而人不敢指、以比淫奔之惡。人不可道。況女子有行、當遠其父母兄弟。豈可不顧此而冒行乎。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-001:4-4:東\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○此刺淫奔之詩。言蝃蝀在東、而人不敢指、以比淫奔之惡。人不可道。況女子有行、當遠其父母兄弟。豈可不顧此而冒行乎。\",\"fullText\":\"比也。蝃蝀、虹也。日與雨交、倐然成質。似有血氣之類。乃陰陽之氣、不當交而交者。蓋天地之淫氣也。在東者、莫虹也。虹隨日所映。故朝西而莫東也。○此刺淫奔之詩。言蝃蝀在東、而人不敢指、以比淫奔之惡。人不可道。況女子有行、當遠其父母兄弟。豈可不顧此而冒行乎。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-001:4-4:東\",\"seg-002:3-4:敢指\",\"seg-003:1-4:女子有行\",\"seg-004:2-5:父母兄弟\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西崇朝其雨女子有行遠兄弟父母\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○比也。隮、升也。周禮十惲、九曰隮。注以爲虹。蓋忽然而見、如自下而升也。\",\"fullText\":\"○比也。隮、升也。周禮十惲、九曰隮。注以爲虹。蓋忽然而見、如自下而升也。崇、終也。從旦至食時爲終朝。言方雨而虹見、則其雨終朝而止矣。蓋淫慝之氣、有害於陰陽之和也。今俗謂虹能蔵雨。信然。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:2-2:隮\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西崇朝其雨女子有行遠兄弟父母\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"崇、終也。從旦至食時爲終朝。\",\"fullText\":\"○比也。隮、升也。周禮十惲、九曰隮。注以爲虹。蓋忽然而見、如自下而升也。崇、終也。從旦至食時爲終朝。言方雨而虹見、則其雨終朝而止矣。蓋淫慝之氣、有害於陰陽之和也。今俗謂虹能蔵雨。信然。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-006:1-1:崇\",\"seg-006:2-2:朝\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西崇朝其雨女子有行遠兄弟父母\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"言方雨而虹見、則其雨終朝而止矣。蓋淫慝之氣、有害於陰陽之和也。今俗謂虹能蔵雨。信然。\",\"fullText\":\"○比也。隮、升也。周禮十惲、九曰隮。注以爲虹。蓋忽然而見、如自下而升也。崇、終也。從旦至食時爲終朝。言方雨而虹見、則其雨終朝而止矣。蓋淫慝之氣、有害於陰陽之和也。今俗謂虹能蔵雨。信然。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-006:4-4:雨\",\"seg-006:2-2:朝\"],\"glossAnchorIds\":[\"anch \"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“朝隮于西，崇朝其雨。女子有行，远兄弟父母”承上章复唱。\",\"fullText\":\"次章“朝隮于西，崇朝其雨。女子有行，远兄弟父母”承上章复唱。程、蒋释“隮”为虹，“朝隮”即晨虹，并引旧说“暮虹截雨，朝虹行雨”说明其与天象变化相关；“崇”通“终”，“崇朝”指整个早晨（自日初出至朝食前后）。后半仍复“女子有行”之句，重申婚嫁当循常道，反衬诗中所刺之失序。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:1-4:朝隮于西\",\"seg-006:1-4:崇朝其雨\",\"seg-007:1-4:女子有行\",\"seg-008:1-5:远兄弟父母\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西，崇朝其雨。女子有行，远兄弟父母。\",\"sourceLabel\":\"第 109-110 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“隮”为虹，“朝隮”即晨虹，并引旧说“暮虹截雨，朝虹行雨”说明其与天象变化相关；“崇”通“终”，“崇朝”指整个早晨（自日初出至朝食前后）。\",\"fullText\":\"次章“朝隮于西，崇朝其雨。女子有行，远兄弟父母”承上章复唱。程、蒋释“隮”为虹，“朝隮”即晨虹，并引旧说“暮虹截雨，朝虹行雨”说明其与天象变化相关；“崇”通“终”，“崇朝”指整个早晨（自日初出至朝食前后）。后半仍复“女子有行”之句，重申婚嫁当循常道，反衬诗中所刺之失序。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:2-2:隮\",\"seg-005:1-1:朝\",\"seg-006:1-1:崇\",\"seg-006:2-2:朝\",\"seg-006:4-4:雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西，崇朝其雨。女子有行，远兄弟父母。\",\"sourceLabel\":\" egmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也\",\"sourceLabel\":\"第 13 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《蝃蝀》，止奔也。\",\"fullText\":\"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也\",\"sourceLabel\":\"第 13 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"fullText\":\"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 13-14 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。\",\"fullText\":\"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。次章“朝隮于西，崇朝其雨。女子有行，遠兄弟父母”，以“隮”为虹气上升，言气象感应可验，则男女之分、嫁娶之礼亦有常则，不可违其伦序。末章“乃如之人也，懷婚姻也。大無信也，不知命也”，直斥淫奔者惟务私欲，失其贞信，不知婚姻当待父母之命，故篇意归于深恶而严戒之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 13-14 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。\",\"fullText\":\"陈奂疏《蝃蝀》时，先据《序》“止奔也……國人不齒也”申明此篇主旨在刺淫奔、正风俗。其释首章“蝃蝀在東，莫之敢指。女子有行，遠父母兄弟”，以蝃蝀为阴阳失和之戒，言虹见尚不敢指，况淫奔之行尤为国人所恶；并申女子有常道，当远其父母兄弟而适人，不当越礼自媒。次章“朝隮于西，崇朝其雨。女子有行，遠兄弟父母”，以“隮”为虹气上升，言气象感应可验，则男女之分、嫁娶之礼亦有常则，不可违其伦序。末章“乃如之人也，懷婚姻也。大無信也，不知命也”，直斥淫奔者惟务私欲，失其贞信，不知婚姻当待父母之命，故篇意归于深恶而严戒之。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:蝃蝀在東\",\"seg-002:1-4:莫之敢指\",\"seg-003:1-4:女子有行\",\"seg-004:1-5:遠父母兄弟\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷婚姻也。大無信也，不知命 10\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀㊟代衛宣姜答《新臺》也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注以“代衛宣姜答《新臺》”定篇，\",\"fullText\":\"方玉润题注以“代衛宣姜答《新臺》”定篇，谓此诗为设宣姜口吻对《新臺》作答。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀㊟代衛宣姜答《新臺》也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"谓此诗为设宣姜口吻对《新臺》作答。\",\"fullText\":\"方玉润题注以“代衛宣姜答《新臺》”定篇，谓此诗为设宣姜口吻对《新臺》作答。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评先辨《小序》《大序》“止奔”“美文公”两说皆未得其要，谓若专作刺淫则“遠父母兄弟”“大無信”“不知命”难通。\",\"fullText\":\"方玉润总评先辨《小序》《大序》“止奔”“美文公”两说皆未得其要，谓若专作刺淫则“遠父母兄弟”“大無信”“不知命”难通。其又议何楷“刺宣公夺伋妇”说虽近似，然《邶風》既有《新臺》，不当重出；遂据姚际恒说，转定此篇为与《新臺》相唱答的代言讽刺：设宣姜自述远嫁无依、遭卫宣无信夺妇，虽知其非而无从控告，正如蝃蝀淫邪之气朝西暮东、忽晴忽雨。末言此解可使全诗豁然，但因无实证，故仍存疑而不遽定。\",\ ear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"方玉润眉评谓：以蝃蝀忽雨忽晴、东西无定之象，\",\"fullText\":\"方玉润眉评谓：以蝃蝀忽雨忽晴、东西无定之象，比卫宣失德，譬喻巧切。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"比卫宣失德，譬喻巧切。\",\"fullText\":\"方玉润眉评谓：以蝃蝀忽雨忽晴、东西无定之象，比卫宣失德，譬喻巧切。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東朝隮于西崇朝其雨\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释引《集傳》谓蝃蝀为虹，是阴阳不当交之“淫气”，随日影而“朝西暮东”，故“在東”指暮虹。\",\"fullText\":\"方玉润集释引《集傳》谓蝃蝀为虹，是阴阳不当交之“淫气”，随日影而“朝西暮东”，故“在東”指暮虹。又据《周禮》十煇注与姚际恒说，释“朝隮”为朝虹，如自下升；“崇”训终，“崇朝其雨”即终朝有雨，并称今人误认虹惟止雨，多因朝虹不易见。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-001:3-4:在東\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東朝隮于西崇朝其雨\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"又据《周禮》十煇注与姚际恒说，释“朝隮”为朝虹，如自下升；“崇”训终，“崇朝其雨”即终朝有雨，并称今人误认虹惟止雨，多因朝虹不易见。\",\"fullText\":\"方玉润集释引《集傳》谓蝃蝀为虹，是阴阳不当交之“淫气”，随日影而“朝西暮东”，故“在東”指暮虹。又据《周禮》十煇注与姚际恒说，释“朝隮”为朝虹，如自下升；“崇”训终，“崇朝其雨”即终朝有雨，并称今人误认虹惟止雨，多因朝虹不易见。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:1-2:朝隮\",\"seg-006:1-1:崇\",\"seg-006:1-4:崇朝其雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"标韵\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"方玉润标韵云：首章“指”四紙与“弟”八薺通韵；\",\"fullText\":\"方玉润标韵云：首章“指”四紙与“弟”八薺通韵；次章“雨”七麌与“母”二十五有叶韵；末章“人、姻”为十一真本韵，“信”十二震与“命”二十四敬通韵。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-2\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"标韵\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"次章“雨”七麌与“母”二十五有叶韵；\",\"fullText\":\"方玉润标韵云：首章“指”四紙与“弟”八薺通韵；次章“雨”七麌与“母”二十五有叶韵；末章“人、姻”为十一真本韵，“信”十二震与“命”二十四敬通韵。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-3\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"标韵\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"末章“人、姻”为十一真本韵，“信”十二震与“命”二十四敬通韵。\",\"fullText\":\"方玉润标韵云：首章“指”四紙与“弟”八薺通韵；次章“雨”七麌与“母”二十五有叶韵；末章“人、姻”为十一真本韵，“信”十二震与“命”二十四敬通韵。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《蝃蝀》，止奔也。\",\"fullText\":\"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"蝃蝀止奔也衛文公能以道化其民淫奔之恥國人不齒也\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"fullText\":\"序：《蝃蝀》，止奔也。衛文公能以道化其民，淫奔之恥，國人不齒也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。\",\"fullText\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？箋云：行，道也。婦人生而有適人之道，何憂於不嫁，而為淫奔之過乎？惡之甚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-002:1-4:莫之敢指\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？\",\"fullText\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？箋云：行，道也。婦人生而有適人之道，何憂於不嫁，而為淫奔之過乎？惡之甚。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-002:3-4:敢指\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：行，道也。婦人生而有適人之道，何憂於不嫁，而為淫奔之過乎？惡之甚。\",\"fullText\":\"傳：蝃蝀，虹也。夫婦過禮則虹氣盛，君子見戒而懼諱之，莫之敢指。箋云：虹，天氣之戒，尙無敢指者，況淫奔之女，誰敢視之？箋云：行，道也。婦人生而有適人之道，何憂於不嫁，而為淫奔之過乎？惡之甚。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-003:4-4:行\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西崇朝其雨女子有行遠兄弟父母\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：隮，升。崇，終也。從旦至食時為終朝。\",\"fullText\":\"傳：隮，升。崇，終也。從旦至食時為終朝。箋云：朝有升氣於西方，終其朝則雨，氣應自然。以言婦人生而有適人之道，亦性自然。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:2-2:隮\",\"seg-006:1-1:崇\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西崇朝其雨女子有行遠兄弟父母\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：朝有升氣於西方，終其朝則雨，氣應自然。以言婦人生而有適人之道，亦性自然。\",\"fullText\":\"傳：隮，升。崇，終也。從旦至食時為終朝。箋云：朝有升氣於西方，終其朝則雨，氣應自然。以言婦人生而有適人之道，亦性自然。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:1-1:朝\",\"seg-005:4-4:西\",\"seg-006:2-2:朝\",\"seg-006:4-4:雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"乃如之人也懷婚姻也大無信也不知命也\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"乃如是淫奔之人也。\",\"fullText\":\"乃如是淫奔之人也。箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-2:乃如\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"乃如之人也懷婚姻也大無信也不知命也\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。\",\"fullText\":\"乃如是淫奔之人也。箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:2-3:婚姻\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"乃如之人也懷婚姻也大無信也不知命也\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"fullText\":\"乃如是淫奔之人也。箋云：懷，思也。乃如是之人，思婚姻之事乎？言其淫奔之過惡之大。不待命也。箋云：淫奔之女，大無貞潔之信，又不知婚姻當待父母之命，惡之也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-010:2-3:婚姻\",\"seg-011:1-2:大無\",\"seg-012:3-3:命\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"屈万里谓《蝃蝀》\",\"fullText\":\"屈万里谓《蝃蝀》“此盖既嫁之女而拒其他求婚者之诗”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蝃蝀\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"“此盖既嫁之女而拒其他求婚者之诗”。\",\"fullText\":\"屈万里谓《蝃蝀》“此盖既嫁之女而拒其他求婚者之诗”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷昏姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“蝃蝀”为虹，音帝东，并记北方旧俗戒小儿指虹，故“莫之敢指”未必专牵附淫奔。\",\"fullText\":\"屈万里释“蝃蝀”为虹，音帝东，并记北方旧俗戒小儿指虹，故“莫之敢指”未必专牵附淫奔。又释“有行”为出嫁，“隮”为虹，并引“东虹晴，西虹雨”以释“崇朝其雨”。末章释“乃如”为转语词，“之”为是，“大”读为“太”，据“大無信也”疑其人昔曾约婚而未践言；并释“命”为命运。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-002:1-4:莫之敢指\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷昏姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"又释“有行”为出嫁，“隮”为虹，并引“东虹晴，西虹雨”以释“崇朝其雨”。\",\"fullText\":\"屈万里释“蝃蝀”为虹，音帝东，并记北方旧俗戒小儿指虹，故“莫之敢指”未必专牵附淫奔。又释“有行”为出嫁，“隮”为虹，并引“东虹晴，西虹雨”以释“崇朝其雨”。末章释“乃如”为转语词，“之”为是，“大”读为“太”，据“大無信也”疑其人昔曾约婚而未践言；并释“命”为命运。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:3-4:有行\",\"seg-007:3-4:有行\",\"seg-005:2-2:隮\",\"seg-006:1-4:崇朝其雨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蝃蝀在東，莫之敢指。女子有行，遠父母兄弟。朝隮于西，崇朝其雨。女子有行，遠兄弟父母。乃如之人也，懷昏姻也。大無信也，不知命也。\",\"sourceLabel\":\"第 62 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"末章释“乃如”为转语词，“之 bel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"比也。蝃蝀、虹也。日與雨交、倐然成質。似有血氣之類。乃陰陽之氣、不當交而交者。蓋天地之淫氣也。在東者、莫虹也。虹隨日所映。故朝西而莫東也。\",\"fullText\":\"比也。蝃蝀、虹也。日與雨交、倐然成質。似有血氣之類。乃陰陽之氣、不當交而交者。蓋天地之淫氣也。在東者、莫虹也。虹隨日所映。故朝西而莫東也。○此刺淫奔之詩。言蝃蝀在東、而人不敢指、以比淫奔之惡。人不可道。況女子有行、當遠其父母兄弟。豈可不顧此而冒行乎。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-001:4-4:東\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蝃蝀在東莫之敢指女子有行遠父母兄弟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○此刺淫奔之詩。言蝃蝀在東、而人不敢指、以比淫奔之惡。人不可道。況女子有行、當遠其父母兄弟。豈可不顧此而冒行乎。\",\"fullText\":\"比也。蝃蝀、虹也。日與雨交、倐然成質。似有血氣之類。乃陰陽之氣、不當交而交者。蓋天地之淫氣也。在東者、莫虹也。虹隨日所映。故朝西而莫東也。○此刺淫奔之詩。言蝃蝀在東、而人不敢指、以比淫奔之惡。人不可道。況女子有行、當遠其父母兄弟。豈可不顧此而冒行乎。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-2:蝃蝀\",\"seg-001:4-4:東\",\"seg-002:3-4:敢指\",\"seg-003:1-4:女子有行\",\"seg-004:2-5:父母兄弟\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/051-di-dong/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"朝隮于西崇朝其雨女子有行遠兄弟父母\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○比也。隮、升也。周禮十惲、九曰隮。注以爲虹。蓋忽然而見、如自下而升也。\",\"fullText\":\"○比也。
