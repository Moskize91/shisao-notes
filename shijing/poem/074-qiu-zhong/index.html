ount":3},{"id":"quwanli-quanshi","title":"詩經詮釋","contributorLine":"现代 · 屈萬里","publicationYear":1983,"glossCount":7,"partCount":7},{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":5,"glossCount":16,"anchoredPartCount":0,"overviewPartCount":3},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","quwanli-quanshi:0001-1:part-1"]},"focusAnchors":[],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/074-qiu-zhong/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"丘中有麻，彼留子嗟。彼留子嗟，将其来施施。丘中有麦，彼留子国。彼留子国，将其来食。丘中有李，彼留之子。彼留之子，贻我佩玖。","sourceLabel":"第 168-169 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"此诗各章中间二句为复叠句，均重复一个男子的名字，虽一字不易，其含意却大不相同。前一句说“彼留子嗟”，只是客观地介绍一个在丘中的男子，但紧接着重复一句，便将这个男子和作者联系起来，成了作者的意中人，使这个普通的名字，添上浓厚的感情色彩。通过这句简单的重复，不仅突出了那男子的地位，也表白了作者自身的感情。只有能够体味其间细微的区别，方能了解这种复叠的妙用。\n复叠的修辞是诗经艺术手法最突出的一个特征，包括叠字、叠词、叠句和叠章，它们除了将感情色彩烘托得更强烈之外，还有配合乐调的关系。天鹰古代歌谣的艺术特征说：“章句的重叠往复这种表现手法和古代劳动歌曲有密切的关系，是旋律的作用更甚于语言的意义的。”类似丘中有麻“彼留子嗟”的叠句，王风中还有中谷有蓷的“慨其叹矣”等三句，葛藟的“谓他人父”等三句。十五国风中，这类叠句在王风中出现最多，由此我们可以推测，当时王都的地方乐调恐怕很适宜于这类叠句的演唱。\n丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\n留，古与“刘”通用。马瑞辰通释：“留、刘古通用，薛尚功钟鼎款识有刘公簋，积古斋钟鼎款识作留公簋。”陈奂传疏：“隐十一年左传：‘王取邬、刘、蒍、邘之田于郑。’杜注云：‘河南缑氏县西北有刘亭。’刘与留通。王，桓王也。”按留是姓，子是对男子的美称，所以在“嗟”上加“子”字，作为那位男子的名字。他可能是周桓王取郑国刘姓田里的一位农民。\n将，请。见氓注。\n施施，此句衍一“施”字，应作“将其来施”。颜之推家训书证篇：“诗云：‘将其来施施’……河北毛诗皆云‘施施’，江南旧本悉单为‘施’。”据臧琳经义杂记考证，单为“施”者是。施，帮助。马瑞辰通释：“施亦为也、助也。”毛传训施为“难进之貌”，按施的本义为旗貌，引申为设施。史记韩世家：“施三川而归”，正义：“施，犹设也。”诗此句施字与下句食字对文，都是动词。如果把施作副词，用形容子嗟来时难进之貌，与下句食字不类，恐非诗义。今从马说。\n韵读：歌部——麻（音摩）、嗟（子何反）、嗟、施（音姿）。\n丘中有麦，彼留子国。彼留子国，将其来食。\n子国，毛传：“子国，子嗟父。”\n韵读：之部——麦（明逼反，入声）、国（古逼反，入声）、国、食。\n丘中有李，彼留之子。彼留之子，贻我佩玖。\n之子，是子，指子嗟。\n贻，赠送。陈奂传疏：“贻，当依释诂怡，诒，遗也。”玖，似玉的浅黑色石，可以制成佩带的饰物。说文：“玖，石之次玉黑色者。”古代风俗，男女相悦，多以身上所佩的饰物相赠，或以瓜果花草表爱。\n韵读：之部——李、子、子、玖（音己）。","fullText":"此诗各章中间二句为复叠句，均重复一个男子的名字，虽一字不易，其含意却大不相同。前一句说“彼留子嗟”，只是客观地介绍一个在丘中的男子，但紧接着重复一句，便将这个男子和作者联系起来，成了作者的意中人，使这个普通的名字，添上浓厚的感情色彩。通过这句简单的重复，不仅突出了那男子的地位，也表白了作者自身的感情。只有能够体味其间细微的区别，方能了解这种复叠的妙用。\n复叠的修辞是诗经艺术手法最突出的一个特征，包括叠字、叠词、叠句和叠章，它们除了将感情色彩烘托得更强烈之外，还有配合乐调的关系。天鹰古代歌谣的艺术特征说：“章句的重叠往复这种表现手法和古代劳动歌曲有密切的关系，是旋律的作用更甚于语言的意义的。”类似丘中有麻“彼留子嗟”的叠句，王风中还有中谷有蓷的“慨其叹矣”等三句，葛藟的“谓他人父”等三句。十五国风中，这类叠句在王风中出现最多，由此我们可以推测，当时王都的地方乐调恐怕很适宜于这类叠句的演唱。\n丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\n留，古与“刘”通用。马瑞辰通释：“留、刘古通用，薛尚功钟鼎款识有刘公簋，积古斋钟鼎款识作留公簋。”陈奂传疏：“隐十一年左传：‘王取邬、刘、蒍、邘之田于郑。’杜注云：‘河南缑氏县西北有刘亭。’刘与留通。王，桓王也。”按留是姓，子是对男子的美称，所以在“嗟”上加“子”字，作为那位男子的名字。他可能是周桓王取郑国刘姓田里的一位农民。\n将，请。见氓注。\n施施，此句衍一“施”字，应作“将其来施”。颜之推家训书证篇：“诗云：‘将其来施施’……河北毛诗皆云‘施施’，江南旧本悉单为‘施’。”据臧琳经义杂记考证，单为“施”者是。施，帮助。马瑞辰通释：“施亦为也、助也。”毛传训施为“难进之貌”，按施的本义为旗貌，引申为设施。史记韩世家：“施三川而归”，正义：“施，犹设也。”诗此句施字与下句食字对文，都是动词。如果把施作副词，用形容子嗟来时难进之貌，与下句食字不类，恐非诗义。今从马说。\n韵读：歌部——麻（音摩）、嗟（子何反）、嗟、施（音姿）。\n丘中有麦，彼留子国。彼留子国，将其来食。\n子国，毛传：“子国，子嗟父。”\n韵读：之部——麦（明逼反，入声）、国（古逼反，入声）、国、食。\n丘中有李，彼留之子。彼留之子，贻我佩玖。\n之子，是子，指子嗟。\n贻，赠送。陈奂传疏：“贻，当依释诂怡，诒，遗也。”玖，似玉的浅黑色石，可以制成佩带的饰物。说文：“玖，石之次玉黑色者。”古代风俗，男女相悦，多以身上所佩的饰物相赠，或以瓜果花草表爱。\n韵读：之部——李、子、子、玖（音己）。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/074-qiu-zhong/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"丘中有麻，彼留子嗟。彼留子嗟，將其來施施。丘中有麥，彼留子國。彼留子國，將其來食。丘中有李，彼留之子。彼留之子，貽我佩玖。","sourceLabel":"第 76-77 页","attributionLabel":"陈奂","sectionLabel":"经文","excerpt":"丘中有麻，彼留子嗟。彼留子嗟，將其來施施。丘中有麥，彼留子國。彼留子國，將其來食。丘中有李，彼留之子。彼留之子，貽我佩玖。","fullText":"丘中有麻，彼留子嗟。彼留子嗟，將其來施施。丘中有麥，彼留子國。彼留子國，將其來食。丘中有李，彼留之子。彼留之子，貽我佩玖。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"招賢偕隱也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"招賢偕隱也。","fullText":"招賢偕隱也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮耶？似此訓釋，又非思賢，乃招賢以共隱耳。周衰，賢人放廢，或越在他邦，或尚留本國。故互相招集，退處丘園以自樂，所謂桃花源尚在人間者是也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮 "chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"丘\",\"anchorIds\":[]},{\"index\":2,\"text\":\"中\",\"anchorIds\":[]},{\"index\":3,\"text\":\"有\",\"anchorIds\":[]},{\"index\":4,\"text\":\"李\",\"anchorIds\":[]}]},{\"id\":\"seg-010\",\"order\":10,\"text\":\"彼留之子\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"quwanli-quanshi:0006-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"彼\",\"anchorIds\":[]},{\"index\":2,\"text\":\"留\",\"anchorIds\":[]},{\"index\":3,\"text\":\"之\",\"anchorIds\":[]},{\"index\":4,\"text\":\"子\",\"anchorIds\":[]}]},{\"id\":\"seg-011\",\"order\":11,\"text\":\"彼留之子\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"quwanli-quanshi:0006-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"彼\",\"anchorIds\":[]},{\"index\":2,\"text\":\"留\",\"anchorIds\":[]},{\"index\":3,\"text\":\"之\",\"anchorIds\":[]},{\"index\":4,\"text\":\"子\",\"anchorIds\":[]}]},{\"id\":\"seg-012\",\"order\":12,\"text\":\"貽我佩玖\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"quwanli-quanshi:0007-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"貽\",\"anchorIds\":[]},{\"index\":2,\"text\":\"我\",\"anchorIds\":[]},{\"index\":3,\"text\":\"佩\",\"anchorIds\":[]},{\"index\":4,\"text\":\"玖\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":7,\"partCount\":7},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":5,\"glossCount\":16,\"anchoredPartCount\":0,\"overviewPartCount\":3},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"丘中有麻，彼留子嗟。彼留子嗟，将其来施施。丘中有麦，彼留子国。彼留子国，将其来食。丘中有李，彼留之子。彼留之子，贻我佩玖。\",\"sourceLabel\":\"第 168-169 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"此诗各章中间二句为复叠句，均重复一个男子的名字，虽一字不易，其含意却大不相同。前一句说“彼留子嗟”，只是客观地介绍一个在丘中的男子，但紧接着重复一句，便将这个男子和作者联系起来，成了作者的意中人，使这个普通的名字，添上浓厚的感情色彩。通过这句简单的重复，不仅突出了那男子的地位，也表白了作者自身的感情。只有能够体味其间细微的区别，方能了解这种复叠的妙用。\\n复叠的修辞是诗经艺术手法最突出的一个特征，包括叠字、叠词、叠句和叠章，它们除了将感情色彩烘托得更强烈之外，还有配合乐调的关系。天鹰古代歌谣的艺术特征说：“章句的重叠往复这种表现手法和古代劳动歌曲有密切的关系，是旋律的作用更甚于语言的意义的。”类似丘中有麻“彼留子嗟”的叠句，王风中还有中谷有蓷的“慨其叹矣”等三句，葛藟的“谓他人父”等三句。十五国风中，这类叠句在王风中出现最多，由此我们可以推测，当时王都的地方乐调恐怕很适宜于这类叠句的演唱。\\n丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\\n留，古与“刘”通用。马瑞辰通释：“留、刘古通用，薛尚功钟鼎款识有刘公簋，积古斋钟鼎款识作留公簋。”陈奂传疏：“隐十一年左传：‘王取邬、刘、蒍、邘之田于郑。’杜注云：‘河南缑氏县西北有刘亭。’刘与留通。王，桓王也。”按留是姓，子是对男子的美称，所以在“嗟”上加“子”字，作为那位男子的名字。他可能是周桓王取郑国刘姓田里的一位农民。\\n将，请。见氓注。\\n施施，此句衍一“施”字，应作“将其来施”。颜之推家训书证篇：“诗云：‘将其来施施’……河北毛诗皆云‘施施’，江南旧本悉单为‘施’。”据臧琳经义杂记考证，单为“施”者是。施，帮助。马瑞辰通释：“施亦为也、助也。”毛传训施为“难进之貌”，按施的本义为旗貌，引申为设施。史记韩世家：“施三川而归”，正义：“施，犹设也。”诗此句施字与下句食字对文，都是动词。如果把施作副词，用形容子嗟来时难进之貌，与下句食字不类，恐非诗义。今从马说。\\n韵读：歌部——麻（音摩）、嗟（子何反）、嗟、施（音姿）。\\n丘中有麦，彼留子国。彼留子国，将其来食。\\n子国，毛传：“子国，子嗟父。”\\n韵读：之部——麦（明逼反，入声）、国（古逼反，入声）、国、食。\\n丘中有李，彼留之子。彼留之子，贻我佩玖。\\n之子，是子，指子嗟。\\n贻，赠送。陈奂传疏：“贻，当依释诂怡，诒，遗也。”玖，似玉的浅黑色石，可以制成佩带的饰物。说文：“玖，石之次玉黑色者。”古代风俗，男女相悦，多以身上所佩的饰物相赠，或以瓜果花草表爱。\\n韵读：之部——李、子、子、玖（音己）。\",\"fullText\":\"此诗各章中间二句为复叠句，均重复一个男子的名字，虽一字不易，其含意却大不相同。前一句说“彼留子嗟”，只是客观地介绍一个在丘中的男子，但紧接着重复一句，便将这个男子和作者联系起来，成了作者的意中人，使这个普通的名字，添上浓厚的感情色彩。通过这句简单的重复，不仅突出了那男子的地位，也表白了作者自身的感情。只有能够体味其间细微的区别，方能了解这种复叠的妙用。\\n复叠的修辞是诗经艺术手法最突出的一个特征，包括叠字、叠词、叠句和叠章，它们除了将感情色彩烘托得更强烈之外，还有配合乐调的关系。天鹰古代歌谣的艺术特征说：“章句的重叠往复这种表现手法和古代劳动歌曲有密切的关系，是旋律的作用更甚于语言的意义的。”类似丘中有麻“彼留子嗟”的叠句，王风中还有中谷有蓷的“慨其叹矣”等三句，葛藟的“谓他人父”等三句。十五国风中，这类叠句在王风中出现最多，由此我们可以推测，当时王都的地方乐调恐怕很适宜于这类叠句的演唱。\\n丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\\n留，古与“刘”通用。马瑞辰通释：“留、刘古通用，薛尚功钟鼎款识有刘公簋，积古斋钟鼎款识作留公簋。”陈奂传疏：“隐十一年左传：‘王取邬、刘、蒍、邘之田于郑。’杜注云：‘河南缑氏县西北有刘亭。’刘与留通。王，桓王也。”按留是姓，子是对男子的美称，所以在“嗟”上加“子”字，作为那位男子的名字。他可能是周桓王取郑国刘姓田里的一位农民。\\n将，请。见氓注。\\n施施，此句衍一“施”字，应作“将其来施”。颜之推家训书证篇：“诗云：‘将其来施施’……河北毛诗皆云‘施施’，江南旧本悉单为‘施’。”据臧琳经义杂记考证，单为“施”者是。施，帮助。马瑞辰通释：“施亦为也、助也。”毛传训施为“难进之貌”，按施的本义为旗貌，引申为设施。史记韩世家：“施三川而归”，正义：“施，犹设也。”诗此句施字与下句食字对文，都是动词。如果把施作副词，用形容子嗟来时难进之貌，与下句食字不类，恐非诗义。今从马说。\\n韵读：歌部——麻（音摩）、嗟（子何反）、嗟、施（音姿）。\\n丘中有麦，彼留子国。彼留子国，将其来食。\\n子国，毛传：“子国，子嗟父。”\\n韵读：之部——麦（明逼反，入声）、国（古逼反，入声）、国、食。\\n丘中有李，彼留之子。彼留之子，贻我佩玖。\\n之子，是子，指子嗟。\\n贻，赠送。陈奂传疏：“贻，当依释诂怡，诒，遗也。”玖，似玉的浅黑色石，可以制成佩带的饰物。说文：“玖，石之次玉黑色者。”古代风俗，男女相悦，多以身上所佩的饰物相赠，或以瓜果花草表爱。\\n韵读：之部——李、子、子、玖（音己）。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"丘中有麻，彼留子嗟。彼留子嗟，將其來施施。丘中有麥，彼留子國。彼留子國，將其來食。丘中有李，彼留之子。彼留之子，貽我佩玖。\",\"sourceLabel\":\"第 76-77 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"丘中有麻，彼留子嗟。彼留子嗟，將其來施施。丘中有麥，彼留子國。彼留子國，將其來食。丘中有李，彼留之子。彼留之子，貽我佩玖。\",\"fullText\":\"丘中有麻，彼留子嗟。彼留子嗟，將其來施施。丘中有麥，彼留子國。彼留子國，將其來食。丘中有李，彼留之子。彼留之子，貽我佩玖。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"招賢偕隱也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"招賢偕隱也。\",\"fullText\":\"招賢偕隱也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮耶？似此訓釋，又非思賢，乃招賢以共隱耳。周衰，賢人放廢，或越在他邦，或尚留本國。故互相招集，退處丘園以自樂，所謂桃花源尚在人間者是也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮耶？似此訓釋，又非思賢，乃招賢以共隱耳。周衰，賢人放廢，或越在他邦，或尚留本國。故互相招集，退處丘園以自樂，所謂桃花源尚在人間者是也。\",\"fullText\":\"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮耶？似此訓釋，又非思賢，乃招賢以共隱耳。周衰，賢人放廢，或越在他邦，或尚留本國。故互相招集，退處丘園以自樂，所謂桃花源尚在人間者是也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"麻〔《集傳》〕麻，穀名。子可食，皮可績爲布者。施施喜悦之意。〔吕氏祖謙曰〕孟子曰：「施施從外來。」\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"麻〔《集傳》〕麻，穀名。子可食，皮可績爲布者。施施喜悦之意。〔吕氏祖謙曰〕孟子曰：「施施從外來。」\",\"fullText\":\"麻〔《集傳》〕麻，穀名。子可食，皮可績爲布者。施施喜悦之意。〔吕氏祖謙曰〕孟子曰：「施施從外來。」\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"麻六麻。嗟同。施四支，叶時遮反。叶韻。麥十一陌。國十三質。食同。通韻。李四紙。子同。玖二十五有，叶舉里 yu.com/shijing/#wangfeng\"},{\"@type\":\"ListItem\",\"position\":4,\"name\":\"丘中\",\"item\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/\"}]},{\"@type\":\"CreativeWork\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/#poem\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/\",\"name\":\"丘中\",\"description\":\"風 · 王風 · 汇聚 5 种资料、16 条注脚的《丘中》阅读页。\",\"text\":\"丘中有麻\\n彼留子嗟\\n彼留子嗟\\n將其來施施\\n丘中有麥\\n彼留子國\\n彼留子國\\n將其來食\\n丘中有李\\n彼留之子\\n彼留之子\\n貽我佩玖\",\"inLanguage\":\"zh-Hans\",\"genre\":\"诗歌\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"诗经\"},{\"@type\":\"Thing\",\"name\":\"風\"},{\"@type\":\"Thing\",\"name\":\"王風\"}]},{\"@type\":\"WebPage\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/#webpage\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/\",\"name\":\"丘中 · 逐字注脚阅读\",\"description\":\"風 · 王風 · 汇聚 5 种资料、16 条注脚的《丘中》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/074-qiu-zhong/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tc37,"])</script><script>self.__next_f.push([1,"此诗各章中间二句为复叠句，均重复一个男子的名字，虽一字不易，其含意却大不相同。前一句说“彼留子嗟”，只是客观地介绍一个在丘中的男子，但紧接着重复一句，便将这个男子和作者联系起来，成了作者的意中人，使这个普通的名字，添上浓厚的感情色彩。通过这句简单的重复，不仅突出了那男子的地位，也表白了作者自身的感情。只有能够体味其间细微的区别，方能了解这种复叠的妙用。\n复叠的修辞是诗经艺术手法最突出的一个特征，包括叠字、叠词、叠句和叠章，它们除了将感情色彩烘托得更强烈之外，还有配合乐调的关系。天鹰古代歌谣的艺术特征说：“章句的重叠往复这种表现手法和古代劳动歌曲有密切的关系，是旋律的作用更甚于语言的意义的。”类似丘中有麻“彼留子嗟”的叠句，王风中还有中谷有蓷的“慨其叹矣”等三句，葛藟的“谓他人父”等三句。十五国风中，这类叠句在王风中出现最多，由此我们可以推测，当时王都的地方乐调恐怕很适宜于这类叠句的演唱。\n丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\n留，古与“刘”通用。马瑞辰通释：“留、刘古通用，薛尚功钟鼎款识有刘公簋，积古斋钟鼎款识作留公簋。”陈奂传疏：“隐十一年左传：‘王取邬、刘、蒍、邘之田于郑。’杜注云：‘河南缑氏县西北有刘亭。’刘与留通。王，桓王也。”按留是姓，子是对男子的美称，所以在“嗟”上加“子”字，作为那位男子的名字。他可能是周桓王取郑国刘姓田里的一位农民。\n将，请。见氓注。\n施施，此句衍一“施”字，应作“将其来施”。颜之推家训书证篇：“诗云：‘将其来施施’……河北毛诗皆云‘施施’，江南旧本悉单为‘施’。”据臧琳经义杂记考证，单为“施”者是。施，帮助。马瑞辰通释：“施亦为也、助也。”毛传训施为“难进之貌”，按施的本义为旗貌，引申为设施。史记韩世家：“施三川而归”，正义：“施，犹设也。”诗此句施字与下句食字对文，都是动词。如果把施作副词，用形容子嗟来时难进之貌，与下句食字不类，恐非诗义。今从马说。\n韵读：歌部——麻（音摩）、嗟（子何反）、嗟、施（音姿）。\n丘中有麦，彼留子国。彼留子国，将其来食。\n子国，毛传：“子国，子嗟父。”\n韵读：之部——麦（明逼反，入声）、国（古逼反，入声）、国、食。\n丘中有李，彼留之子。彼留之子，贻我佩玖。\n之子，是子，指子嗟。\n贻，赠送。陈奂传疏：“贻，当依释诂怡，诒，遗也。”玖，似玉的浅黑色石，可以制成佩带的饰物。说文：“玖，石之次玉黑色者。”古代风俗，男女相悦，多以身上所佩的饰物相赠，或以瓜果花草表爱。\n韵读：之部——李、子、子、玖（音己）。"])</script><script>self.__next_f.push([1,"23:Tc37,"])</script><script>self.__next_f.push([1,"此诗各章中间二句为复叠句，均重复一个男子的名字，虽一字不易，其含意却大不相同。前一句说“彼留子嗟”，只是客观地介绍一个在丘中的男子，但紧接着重复一句，便将这个男子和作者联系起来，成了作者的意中人，使这个普通的名字，添上浓厚的感情色彩。通过这句简单的重复，不仅突出了那男子的地位，也表白了作者自身的感情。只有能够体味其间细微的区别，方能了解这种复叠的妙用。\n复叠的修辞是诗经艺术手法最突出的一个特征，包括叠字、叠词、叠句和叠章，它们除了将感情色彩烘托得更强烈之外，还有配合乐调的关系。天鹰古代歌谣的艺术特征说：“章句的重叠往复这种表现手法和古代劳动歌曲有密切的关系，是旋律的作用更甚于语言的意义的。”类似丘中有麻“彼留子嗟”的叠句，王风中还有中谷有蓷的“慨其叹矣”等三句，葛藟的“谓他人父”等三句。十五国风中，这类叠句在王风中出现最多，由此我们可以推测，当时王都的地方乐调恐怕很适宜于这类叠句的演唱。\n丘中有麻，彼留子嗟。彼留子嗟，将其来施施。\n留，古与“刘”通用。马瑞辰通释：“留、刘古通用，薛尚功钟鼎款识有刘公簋，积古斋钟鼎款识作留公簋。”陈奂传疏：“隐十一年左传：‘王取邬、刘、蒍、邘之田于郑。’杜注云：‘河南缑氏县西北有刘亭。’刘与留通。王，桓王也。”按留是姓，子是对男子的美称，所以在“嗟”上加“子”字，作为那位男子的名字。他可能是周桓王取郑国刘姓田里的一位农民。\n将，请。见氓注。\n施施，此句衍一“施”字，应作“将其来施”。颜之推家训书证篇：“诗云：‘将其来施施’……河北毛诗皆云‘施施’，江南旧本悉单为‘施’。”据臧琳经义杂记考证，单为“施”者是。施，帮助。马瑞辰通释：“施亦为也、助也。”毛传训施为“难进之貌”，按施的本义为旗貌，引申为设施。史记韩世家：“施三川而归”，正义：“施，犹设也。”诗此句施字与下句食字对文，都是动词。如果把施作副词，用形容子嗟来时难进之貌，与下句食字不类，恐非诗义。今从马说。\n韵读：歌部——麻（音摩）、嗟（子何反）、嗟、施（音姿）。\n丘中有麦，彼留子国。彼留子国，将其来食。\n子国，毛传：“子国，子嗟父。”\n韵读：之部——麦（明逼反，入声）、国（古逼反，入声）、国、食。\n丘中有李，彼留之子。彼留之子，贻我佩玖。\n之子，是子，指子嗟。\n贻，赠送。陈奂传疏：“贻，当依释诂怡，诒，遗也。”玖，似玉的浅黑色石，可以制成佩带的饰物。说文：“玖，石之次玉黑色者。”古代风俗，男女相悦，多以身上所佩的饰物相赠，或以瓜果花草表爱。\n韵读：之部——李、子、子、玖（音己）。"])</script><script>self.__next_f.push([1,"1f:[\"$\",\"$L21\",null,{\"detail\":{\"route\":{\"poemId\":\"074-qiu-zhong\"},\"href\":\"/shijing/poem/074-qiu-zhong\",\"poem\":{\"id\":\"074-qiu-zhong\",\"title\":\"丘中\",\"categoryId\":\"feng\",\"subcategoryId\":\"wangfeng\",\"p e\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"招賢偕隱也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"招賢偕隱也。\",\"fullText\":\"招賢偕隱也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/074-qiu-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮耶？似此訓釋，又非思賢，乃招賢以共隱耳。周衰，賢人放廢，或越在他邦，或尚留本國。故互相招集，退處丘園以自樂，所謂桃花源尚在人間者是也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。何不就我？丘中有麻可以績而衣，有麥可以種而食，並有李可以相餽遺，其樂孰甚焉？爾亦將有意其來以就食而互相爲禮耶？似此訓釋，又非思賢，乃招賢以共隱耳。周衰，賢人放廢，或越在他邦，或尚留本國。故互相招集，退處丘園以自樂，所謂桃花源尚在人間者是也。\",\"fullText\":\"右《丘中》三章，章四句。《小序》謂「思賢」，毛、鄭因之，且以「子嗟」、「子國」爲父子二人。惟《集傳》反其所言，以爲「婦人望其所與私者」之詞，殊覺可異。「子嗟」、「子國」既爲父子，《集傳》且從其名矣，則一婦人何以私其父子二人耶？此真逆理悖言，不圖先賢亦爲是論，能無慨然？惟是《序》、《傳》亦有所疑，「子嗟」、「子國」既爲人名，則「之子」又何所指？故姚氏以爲「嗟、國皆助辭」。「嗟」爲助辭可也，「國」亦可爲助辭乎？且有麻即望其來施施，有麥即望其來食，有李即望其遺我以佩玖。上下文自相呼應，猶韓子云盤之土可稼而食之意。中間「彼留」、「彼留」云者，乃虚擬之辭耳。「嗟」固助辭，「國」即彼國之國，猶言彼留子於其國耶？其國不可以久留也。
