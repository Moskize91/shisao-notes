tributionLabel\":\"程俊英\",\"sectionLabel\":\"题解\",\"excerpt\":\"程俊英释《大车》为女子热恋情人而又有所畏惧、不敢私奔的诗，\",\"fullText\":\"程俊英释《大车》为女子热恋情人而又有所畏惧、不敢私奔的诗，末章以“死则同穴”“有如皦日”明誓，既大胆炽热，又不失矜持。她又依次训“槛槛”为车行声，“毳衣”为用兽毛织成并加彩绣的衣裳，“菼”为初生荻色，“尔”“子”都指所恋男子，“啍啍”为车行缓重貌，“璊”为赤玉色假借，“奔”为私奔，“榖”为活着，“穴”为墓穴，“皦”为光明，并指出三章韵脚分别是“槛、菼、敢”“啍、璊、奔”“室、穴、日”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"大车槛槛，毳衣如菼。岂不尔思？畏子不敢。大车啍啍，毳衣如璊。岂不尔思？畏子不奔。榖则异室，死则同穴。谓予不信，有如皦日。\",\"sourceLabel\":\"第 165-167 页\",\"attributionLabel\":\"程俊英\",\"sectionLabel\":\"题解\",\"excerpt\":\"末章以“死则同穴”“有如皦日”明誓，既大胆炽热，又不失矜持。\",\"fullText\":\"程俊英释《大车》为女子热恋情人而又有所畏惧、不敢私奔的诗，末章以“死则同穴”“有如皦日”明誓，既大胆炽热，又不失矜持。她又依次训“槛槛”为车行声，“毳衣”为用兽毛织成并加彩绣的衣裳，“菼”为初生荻色，“尔”“子”都指所恋男子，“啍啍”为车行缓重貌，“璊”为赤玉色假借，“奔”为私奔，“榖”为活着，“穴”为墓穴，“皦”为光明，并指出三章韵脚分别是“槛、菼、敢”“啍、璊、奔”“室、穴、日”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:1-4:死则同穴\",\"seg-012:1-4:有如皦日\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layer ”为大夫之服，并据疏文申明诗中所思者即大夫，而“彼大夫之车不来东也”所以见其不来迎。故前二章以“豈不爾思”“畏子不敢”“畏子不奔”写女子虽思而有所畏，末章则以“穀則異室，死則同穴”见情意之决绝。\",\"notes\":\"依据 PDF 页图 /tmp/072-chenhuan/p85.png 保守摘录。\",\"partOrder\":1,\"anchorIds\":[\"seg-004:2-2:子\",\"seg-002:1-2:毳衣\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"大車檻檻，毳衣如菼。豈不爾思？畏子不敢。大車啍啍，毳衣如璊。豈不爾思？畏子不奔。穀則異室，死則同穴。謂予不信，有如皦日。\",\"sourceLabel\":\"第 75 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"并据疏文申明诗中所思者即大夫，而“彼大夫之车不来东也”所以见其不来迎。\",\"fullText\":\"陈奂疏《大車》，以“子”为大夫，“毳衣”为大夫之服，并据疏文申明诗中所思者即大夫，而“彼大夫之车不来东也”所以见其不来迎。故前二章以“豈不爾思”“畏子不敢”“畏子不奔”写女子虽思而有所畏，末章则以“穀則異室，死則同穴”见情意之决绝。\",\"notes\":\"依据 PDF 页图 /tmp/072-chenhuan/p85.png 保守摘录。\",\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"大車檻檻，毳衣如菼。豈不爾思？畏子不敢。大車啍啍，毳衣如璊。豈不爾思？畏子不奔。穀則異室，死則同穴。謂予不信，有如皦日。\",\"sourceLabel\":\"第 75 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"故前二章以“豈不爾思”“畏子不敢”“畏子不奔”写女子虽思而有所畏，\",\"fullText\":\"陈奂疏《大車》，以“子”为大夫，“毳衣”为大夫之服，并据疏文申明诗中所思者即大夫，而“彼大夫之车不来东也”所以见其不来迎。故前二章以“豈不爾 始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"大車檻檻毳衣如菼豈不爾思畏子不敢大車啍啍毳衣如璊穀則異室死則同穴有如皦日\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释依次训“大車”为牛车，“毳衣”为毛布衣，“菼”为初生芦苇；\",\"fullText\":\"方玉润集释依次训“大車”为牛车，“毳衣”为毛布衣，“菼”为初生芦苇；又说明“爾”指室家、“子”指主之者，“啍啍”为车行重迟之貌，“璊”为赤玉色，“穀”为生、“穴”为圹、“皦”为白。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:大車\",\"seg-002:1-2:毳衣\",\"seg-002:4-4:菼\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-009\",\"seg-010\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"大車檻檻毳衣如菼豈不爾思畏子不敢大車啍啍毳衣如璊穀則異室死則同穴有如皦日\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"又说明“爾”指室家、“子”指主之者，\",\"fullText\":\"方玉润集释依次训“大車”为牛车，“毳衣”为毛布衣，“菼”为初生芦苇；又说明“爾”指室家、“子”指主之者，“啍啍”为车行重迟之貌，“璊”为赤玉色，“穀”为生、“穴”为圹、“皦”为白。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:3-3:爾\",\"seg-004:2-2:子\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-009\",\"seg-010\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"大車檻檻毳衣如菼豈不爾思畏子不敢大車啍啍毳衣如璊穀則異室死則同穴有如皦日\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",
