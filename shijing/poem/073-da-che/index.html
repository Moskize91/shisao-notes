t":1,"partCount":1},{"id":"wangli-yundu","title":"詩經韻讀","contributorLine":"现代 · 王力","publicationYear":1980,"glossCount":3,"partCount":3},{"id":"quwanli-quanshi","title":"詩經詮釋","contributorLine":"现代 · 屈萬里","publicationYear":1983,"glossCount":11,"partCount":11},{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"maruichen-tongshi","title":"毛詩傳箋通釋","contributorLine":"清 · 馬瑞辰","publicationYear":1989,"glossCount":1,"partCount":1},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":6,"glossCount":21,"anchoredPartCount":1,"overviewPartCount":3},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","quwanli-quanshi:0001-1:part-1"]},"focusAnchors":[{"id":"seg-010:3-4:同穴","segmentId":"seg-010","segmentOrder":10,"surfaceText":"同穴","charStart":3,"charEnd":4,"entryIds":["maruichen-tongshi:0001-1:part-1"],"materialIds":["maruichen-tongshi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/073-da-che/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"大车槛槛，毳衣如菼。岂不尔思？畏子不敢。大车啍啍，毳衣如璊。岂不尔思？畏子不奔。榖则异室，死则同穴。谓予不信，有如皦日。","sourceLabel":"第 165-167 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首女子热恋情人的诗。她很想和情人同居，但不知对方心里究竟如何，所以还有些畏惧而不敢找他私奔。最后，她对情人明誓，表白她矢志不渝的爱情。这首诗同国风中其他较为含蓄委婉的恋歌相比，显得很大胆热烈，但又不失矜持。\n刘向列女传贞顺篇说诗是息夫人所作。息国被楚所灭，息君和夫人都做了俘虏。楚王纳息夫人为妻，她见到息君，写这首诗表明心迹，二人同日自杀。但左传记载与此不同。鲁庄公十四年：“楚子……遂灭息。以息妫归，生堵敖及成王焉。未言。楚子问之，对曰：‘以一妇人而事二夫，纵弗能死，其又奚言？’”左传并不言及息妫自杀事。后人对此聚讼纷纭，有疑左传者，有驳列女传者，有调和二传，以息妫与息夫人为二人者，莫衷一是。我们认为一定要坐实诗的本事，于这首诗的理解并无裨益。既然古说歧异，还是阙疑为好。\n此诗末章结以誓词，别开生面。曹雪芹言历来才子佳人之书，满纸子建、文君，千部共出一套，虚张其词，令人生厌。在这类作品中，又必然插入一段海誓山盟，几乎成为表白爱情的公式。此诗末章，可说是这类誓词的滥觞，但它绝无后来作品中轻浮、夸诞之弊，而坚定、炽热之情，尽在誓中，令人读之不觉动容。汉乐府上邪和杜甫新婚别中自明心迹之语，虽风格迥殊，但情深意长，则与大车同一境界。\n大车槛槛，毳衣如菼。岂不尔思？畏子不敢。\n大车，大夫坐的车子。毛传：“大车，大夫之车。”\n槛槛（kǎn），车行声。\n毳（cuì）衣，用兽毛织成，上面绣着五彩花纹的衣裳。说文：“毳，兽细毛也。”\n菼（tǎn），初生的芦荻，青白色。毛传：“毳衣，大夫之服。”诗人用菼形容毳衣的嫩绿色。\n尔，指坐在大车上身穿毳衣的男子，与下句的“子”是同一人，都指她所恋的男子。\n不敢，朱熹诗集传：“不敢，不敢奔也。”\n韵读：谈部——槛、菼、敢。\n大车啍啍，毳衣如璊。岂不尔思？畏子不奔。\n啍啍（tūn），车行缓重貌。毛传：“啍啍，重迟貌。”孔疏：“啍啍，行之貌，故为重迟。上言行之声，此言行之貌。”\n璊（mén），本义为红玉。鲁、齐诗作穈。璊是穈的假借字。说文：“穈，以毳为罽，色如璊，故谓之穈。穈，禾之赤苗也。”诗曰：“毳衣如璊。”陈奂传疏：“玉色如穈曰璊。衣色如穈曰璊，犹上章之以菼色作喻也。毳为兽，故璊字从毛会意。毳衣有赤色，故璊声读如赤苗之穈。”\n奔，私奔。\n韵读：文、元部通韵——啍、璊、奔。\n榖则异室，死则同穴。谓予不信，有如皦日。\n榖，活着。毛传：“榖，生也。”陈奂传疏：“凡榖皆训善，唯此榖字与下句死字作对文，故又训生也。”\n穴，墓穴，也叫圹。郑笺：“穴，谓冢圹中也。”\n如，此、这（从裴学海古书虚字集释）。皦，同“皎”，释文：“皦，本或作皎。”皦和皎皆“晓”字之同音假借。光明。按此章四句是作者对情人的誓言。闻一多说：“指日为誓，言有此皦日以为证也。”\n韵读：脂部——室、穴、日。","fullText":"这是一首女子热恋情人的诗。她很想和情人同居，但不知对方心里究竟如何，所以还有些畏惧而不敢找他私奔。最后，她对情人明誓，表白她矢志不渝的爱情。这首诗同国风中其他较为含蓄委婉的恋歌相比，显得很大胆热烈，但又不失矜持。\n刘向列女传贞顺篇说诗是息夫人所作。息国被楚所灭，息君和夫人都做了俘虏。楚王纳息夫人为妻，她见到息君，写这首诗表明心迹，二人同日自杀。但左传记载与此不同。鲁庄公十四年：“楚子……遂灭息。以息妫归，生堵敖及成王焉。未言。楚子问之，对曰：‘以一妇人而事二夫，纵弗能死，其又奚言？’”左传并不言及息妫自杀事。后人对此聚讼纷纭，有疑左传者，有驳列女传者，有调和二传，以息妫与息夫人为二人者，莫衷一是。我们认为一定要坐实诗的本事，于这首诗的理解并无裨益。既然古说歧异，还是阙疑为好。\n此诗末章结以誓词，别开生面。曹雪芹言历来才子佳人之书，满纸子建、文君，千部共出一套，虚张其词，令人生厌。在这类作品中，又必然插入一段海誓山盟，几乎成为表白爱情的公式。此诗末章，可说是这类誓词的滥觞，但它绝无后来作品中轻浮、夸诞之弊，而坚定、炽热之情，尽在誓中，令人读之不觉动容。汉乐府上邪和杜甫新婚别中自明心迹之语，虽风格迥殊，但情深意长，则与大车同一境界。\n大车槛槛，毳衣如菼。岂不尔思？畏子不敢。\n大车，大夫坐的车子。毛传：“大车，大夫之车。”\n槛槛（kǎn），车行声。\n毳（cuì）衣，用兽毛织成，上面绣着五彩花纹的衣裳。说文：“毳，兽细毛也。”\n菼（tǎn），初生的芦荻，青白色。毛传：“毳衣，大夫之服。”诗人用菼形容毳衣的嫩绿色。\n尔，指坐在大车上身穿毳衣的男子，与下句的“子”是同一人，都指她所恋的男子。\n不敢，朱熹诗集传：“不敢，不敢奔也。”\n韵读：谈部——槛、菼、敢。\n大车啍啍，毳衣如璊。岂不尔思？畏子不奔。\n啍啍（tūn），车行缓重貌。毛传：“啍啍，重迟貌。”孔疏：“啍啍，行之貌，故为重迟。上言行之声，此言行之貌。”\n璊（mén），本义为红玉。鲁、齐诗作穈。璊是穈的假借字。说文：“穈，以毳为罽，色如璊，故谓之穈。穈，禾之赤苗也。”诗曰：“毳衣如璊。”陈奂传疏：“玉色如穈曰璊。衣色如穈曰璊，犹上章之以菼色作喻也。毳为兽，故璊字从毛会意。毳衣有赤色，故璊声读如赤苗之穈。”\n奔，私奔。\n韵读：文、元部通韵——啍、璊、奔。\n榖则异室，死则同穴。谓予不信，有如皦日。\n榖，活着。毛传：“榖，生也。”陈奂传疏：“凡榖皆训善，唯此榖字与下句死字作对文，故又训生也。”\n穴，墓穴，也叫圹。郑笺：“穴，谓冢圹中也。”\n如，此、这（从裴学海古书虚字集释）。皦，同“皎”，释文：“皦，本或作皎。”皦和皎皆“晓”字之同音假借。光明。按此章四句是作者对情人的誓言。闻一多说：“指日为誓，言有此皦日以为证也。”\n韵读：脂部——室、穴、日。", 訣絶如此。然其情亦可慘矣。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。","fullText":"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/073-da-che/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。","fullText":"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/073-da-che/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"標韻檻二十九豏。菼二十七感。敢同。通韻。啍十三元。璊、奔並同。本韻。室四質。穴九屑。日四質。通韻。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"标韵","excerpt":"標韻檻二十九豏。菼二十七感。敢同。通韻。啍十三元。璊 ,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"大车槛槛，毳衣如菼。岂不尔思？畏子不敢。大车啍啍，毳衣如璊。岂不尔思？畏子不奔。榖则异室，死则同穴。谓予不信，有如皦日。\",\"sourceLabel\":\"第 165-167 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首女子热恋情人的诗。她很想和情人同居，但不知对方心里究竟如何，所以还有些畏惧而不敢找他私奔。最后，她对情人明誓，表白她矢志不渝的爱情。这首诗同国风中其他较为含蓄委婉的恋歌相比，显得很大胆热烈，但又不失矜持。\\n刘向列女传贞顺篇说诗是息夫人所作。息国被楚所灭，息君和夫人都做了俘虏。楚王纳息夫人为妻，她见到息君，写这首诗表明心迹，二人同日自杀。但左传记载与此不同。鲁庄公十四年：“楚子……遂灭息。以息妫归，生堵敖及成王焉。未言。楚子问之，对曰：‘以一妇人而事二夫，纵弗能死，其又奚言？’”左传并不言及息妫自杀事。后人对此聚讼纷纭，有疑左传者，有驳列女传者，有调和二传，以息妫与息夫人为二人者，莫衷一是。我们认为一定要坐实诗的本事，于这首诗的理解并无裨益。既然古说歧异，还是阙疑为好。\\n此诗末章结以誓词，别开生面。曹雪芹言历来才子佳人之书，满纸子建、文君，千部共出一套，虚张其词，令人生厌。在这类作品中，又必然插入一段海誓山盟，几乎成为表白爱情的公式。此诗末章，可说是这类誓词的滥觞，但它绝无后来作品中轻浮、夸诞之弊，而坚定、炽热之情，尽在誓中，令人读之不觉动容。汉乐府上邪和杜甫新婚别中自明心迹之语，虽风格迥殊，但情深意长，则与大车同一境界。\\n大车槛槛，毳衣如菼。岂不尔思？畏子不敢。\\n大车，大夫坐的车子。毛传：“大车，大夫之车。”\\n槛槛（kǎn），车行声。\\n毳（cuì）衣，用兽毛织成，上面绣着五彩花纹的衣裳。说文：“毳，兽细毛也。”\\n菼（tǎn），初生的芦荻，青白色。毛传：“毳衣，大夫之服。”诗人用菼形容毳衣的嫩绿色。\\n尔，指坐在大车上身穿毳衣的男子，与下句的“子”是同一人，都指她所恋的男子。\\n不敢，朱熹诗集传：“不敢，不敢奔也。”\\n韵读：谈部——槛、菼、敢。\\n大车啍啍，毳衣如璊。岂不尔思？畏子不奔。\\n啍啍（tūn），车行缓重貌。毛传：“啍啍，重迟貌。”孔疏：“啍啍，行之貌，故为重迟。上言行之声，此言行之貌。”\\n璊（mén），本义为红玉。鲁、齐诗作穈。璊是穈的假借字。说文：“穈，以毳为罽，色如璊，故谓之穈。穈，禾之赤苗也。”诗曰：“毳衣如璊。”陈奂传疏：“玉色如穈曰璊。衣色如穈曰璊，犹上章之以菼色作喻也。毳为兽，故璊字从毛会意。毳衣有赤色，故璊声读如赤苗之穈。”\\n奔，私奔。\\n韵读：文、元部通韵——啍、璊、奔。\\n榖则异室，死则同穴。谓予不信，有如皦日。\\n榖，活着。毛传：“榖，生也。”陈奂传疏：“凡榖皆训善，唯此榖字与下句死字作对文，故又训生也。”\\n穴，墓穴，也叫圹。郑笺：“穴，谓冢圹中也。”\\n如，此、这（从裴学海古书虚字集释）。皦，同“皎”，释文：“皦，本或作皎。”皦和皎皆“晓”字之同音假借。光明。按此章四句是作者对情人的誓言。闻一多说：“指日为誓，言有此皦日以为证也。”\\n韵读：脂部——室、穴、日。\",\"fullText\":\"这是一首女子热恋情人的诗。她很想和情人同居，但不知对方心里究竟如何，所以还有些畏惧而不敢找他私奔。最后，她对情人明誓，表白她矢志不渝的爱情。这首诗同国风中其他较为含蓄委婉的恋歌相比，显得很大胆热烈，但又不失矜持。\\n刘向列女传 orIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"大車㊟征夫歎也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"大車㊟征夫歎也。\",\"fullText\":\"大車㊟征夫歎也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。\",\"fullText\":\"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。\",\"fullText\":\"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻檻二十九豏。菼二十七感。敢同。通韻。啍十三元。璊、奔並同。本韻。室四質。穴九屑。日四質。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻檻二十九豏。菼二十七感。敢同。通韻。啍十三元。璊、奔並同。本韻。室四質。穴九屑。日四質。通韻。\",\"fullText\":\"標韻檻二十九豏。菼二十七感。敢同。通韻。啍十三元。璊、奔並同。本韻。室四質。穴九屑。日四質。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/073-da-che/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"ta crumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"诗经\",\"item\":\"https://shisao.taozeyu.com/shijing/\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"風\",\"item\":\"https://shisao.taozeyu.com/shijing/#feng\"},{\"@type\":\"ListItem\",\"position\":3,\"name\":\"王風\",\"item\":\"https://shisao.taozeyu.com/shijing/#wangfeng\"},{\"@type\":\"ListItem\",\"position\":4,\"name\":\"大車\",\"item\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/\"}]},{\"@type\":\"CreativeWork\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/#poem\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/\",\"name\":\"大車\",\"description\":\"風 · 王風 · 汇聚 6 种资料、21 条注脚的《大車》阅读页。\",\"text\":\"大車檻檻\\n毳衣如菼\\n豈不爾思\\n畏子不敢\\n大車啍啍\\n毳衣如璊\\n豈不爾思\\n畏子不奔\\n穀則異室\\n死則同穴\\n謂予不信\\n有如皦日\",\"inLanguage\":\"zh-Hans\",\"genre\":\"诗歌\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"about\":[{\"@type\":\"Thing\",\"name\":\"诗经\"},{\"@type\":\"Thing\",\"name\":\"風\"},{\"@type\":\"Thing\",\"name\":\"王風\"}]},{\"@type\":\"WebPage\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/#webpage\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/\",\"name\":\"大車 · 逐字注脚阅读\",\"description\":\"風 · 王風 · 汇聚 6 种资料、21 条注脚的《大車》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/073-da-che/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Td5d,"])</script><script>self.__next_f.push([1,"这是一首女子热恋情人的诗。她很想和情人同居，但不知对方心里究竟如何，所以还有些畏惧而不敢找他私奔。最后，她对情人明誓，表白她矢志不渝的爱情。这首诗同国风中其他较为含蓄委婉的恋歌相比，显得很大胆热烈，但又不失矜持。\n刘向列女传贞顺篇说诗是息夫人所作。息国被楚所灭，息君和夫人都做了俘虏。楚王纳息夫人为妻，她见到息君，写这首诗表明心迹，二人同日自杀。但左传记载与此不同。鲁庄公十四年：“楚子……遂灭息。以息妫归，生堵敖及成王焉。未言。楚子问之，对曰：‘以一妇人而事二夫，纵弗能死，其又奚言？’”左传并不言及息妫自杀事。后人对此聚讼纷纭，有疑左传者，有驳列女传者，有调和二传，以息妫与息夫人为二人者，莫衷一是。我们认为一定要坐实诗的本事，于这首诗的理解并无裨益。既然古说歧异，还是阙疑为好。\n此诗末章结以誓词，别开生面。曹雪芹言历来才子佳人之书，满纸子建、文君，千部共出一套，虚张其词，令人生厌。在这类作品中，又必然插入一段海誓山盟，几乎成为表白爱情的公式。此诗末章，可说是这类誓词的滥觞，但它绝无后来作品中轻浮、夸诞之弊，而坚定、炽热之情，尽在誓中，令人读之不觉动容。汉乐府上邪和杜甫新婚别中自明心迹之语，虽风格迥殊，但情深意长，则与大车同一境界。\n大车槛槛，毳衣如菼。岂不尔思？畏子不敢。\n大车，大夫坐的车子。毛传：“大车，大夫之车。”\n槛槛（kǎn），车行声。\n毳（cuì）衣，用兽毛织成，上面绣着五彩花纹的衣裳。说文：“毳，兽细毛也。”\n菼（tǎn），初生的芦荻，青白色。毛传：“毳衣，大夫之服。”诗人用菼形容毳衣的嫩绿色。\n尔，指坐在大车上身穿毳衣的男子，与下句的“子”是同一人，都指她所恋的男子。\n不敢，朱熹诗集传：“不敢，不敢奔也。”\n韵读：谈部——槛、菼、敢。\n大车啍啍，毳衣如璊。岂不尔思？畏子不奔。\n啍啍（tūn），车行缓重貌。毛传：“啍啍，重迟貌。”孔疏：“啍啍，行之貌，故为重迟。上言行之声，此言行之貌。”\n璊（mén），本义为红玉。鲁、齐诗作穈。璊是穈的假借字。说文：“穈，以毳为罽，色如璊，故谓之穈。穈，禾之赤苗也。”诗曰：“毳衣如璊。”陈奂传疏：“玉色如穈曰璊。衣色如穈曰璊，犹上章之以菼色作喻也。毳为兽，故璊字从毛会意。毳衣有赤色，故璊声读如赤苗之穈。”\n奔，私奔。\n韵读：文、元部通韵——啍、璊、奔。\n榖则异室，死则同穴。谓予不信，有如皦日。\n榖，活着。毛传：“榖，生也。”陈奂传疏：“凡榖皆训善，唯此榖字与下句死字作对文，故又训生也。”\n穴，墓穴，也叫圹。郑笺：“穴，谓冢圹中也。”\n如，此、这（从裴学海古书虚字集释）。皦，同“皎”，释文：“皦，本或作皎。”皦和皎皆“晓”字之同音假借。光明。按此章四句是作者对情人的誓言。闻一多说：“指日为誓，言有此皦日以为证也。”\n韵读：脂部——室、穴、日。"])</script><script>self.__next_f.push([1,"23:Td5d,"])</script><script>self.__next_f.push([1,"这是一首女子热恋情人的诗。她很想和情人同居，但不知对方心里究竟如何，所以还有些畏惧而不敢找他私奔。最后，她对情人明誓，表白她矢志不渝的爱情。这首诗同国风中其他较为含蓄委婉的恋歌相比，显得很大胆热烈，但又不失矜持。\n刘向列女传贞顺篇说诗是息夫人所作。息国被楚所灭，息君和夫人都做了俘虏。楚王纳息夫人为妻，她见到息君，写这首诗表明心迹，二人同日自杀。但左传记载与此不同。鲁庄公十四年：“楚子……遂灭息。以息妫归，生堵敖及成王焉。未言。楚子问之，对曰：‘以一妇人而事二夫，纵弗能死，其又奚言？’”左传并不言及息妫自杀事。后人对此聚讼纷纭，有疑左传者，有驳列女传者，有调和二传，以息妫与息夫人为二人者，莫衷一是。我们认为一定要坐实诗的本事，于这首诗的理解并无裨益。既然古说歧异，还是阙疑为好。\n此诗末章结以誓词，别开生面。曹雪芹言历来才子佳人之书，满纸子建、文君，千部共出一套，虚张其词，令人生厌。在这类作品中，又必然插入一段海誓山盟，几乎成为表白爱情的公式。此诗末章，可说是这类誓词的滥觞，但它绝无后来作品中轻浮、夸诞之弊，而坚定、炽热之情，尽在誓中，令人读之不觉动容。汉乐府上邪和杜甫新婚别中自明心迹之语，虽风格迥殊，但情深意长，则与大车同一境界。\n大车槛槛，毳衣如菼。岂不尔思？畏子不敢。\n大车，大夫坐的车子。毛传：“大车，大夫之车。”\n槛槛（kǎn），车行声。\n毳（cuì）衣，用兽毛织成，上面绣着五彩花纹的衣裳。说文：“毳，兽细毛也。”\n菼（tǎn），初生的芦荻，青白色。毛传：“毳衣，大夫之服。”诗人用菼形容毳衣的嫩绿色。\n尔，指坐在大车上身穿毳衣的男子，与下句的“子”是同一人，都指她所恋的男子。\n不敢，朱熹诗集传：“不敢，不敢奔也。”\n韵读：谈部——槛、菼、敢。\n大车啍啍，毳衣如璊。岂不尔思？畏子不奔。\n啍啍（tūn），车行缓重貌。毛传：“啍啍，重迟貌。”孔疏：“啍啍，行之貌，故为重迟。上言行之声，此言行之貌。”\n璊（mén），本义为红玉。鲁、齐诗作穈。璊是穈的假借字。说文：“穈，以毳为罽，色如璊，故谓之穈。穈，禾之赤苗也。”诗曰：“毳衣如璊。”陈奂传疏：“玉色如穈曰璊。衣色如穈曰 ,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。\",\"fullText\":\"右《大車》三章，章四句。此詩若從《序》言，以爲「陳古以刺今」，則無以處「穀則異室」之言。蓋夫婦雖有别，亦何至異室而分居？如從《集傳》，以爲「淫奔有所畏」，則無以釋「死則同穴」之語。蓋男女縱有情，誰爲收屍而合葬？此皆難以理論也。惟姚氏際恒云：「僞傳、説皆以爲周人從軍，訊其室家之詩，似可通。」此雖出於僞説，而詩意真切，詎得以其僞而少之歟？周衰世亂，征伐不一，周人從軍，迄無甯歲。恐此生永無團聚之期，故念其室家而與之訣絶如此。然其情亦可慘矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。\",\"fullText\":\"集釋大車〔姚氏際恒曰〕大車，牛車。毳衣〔姚氏際恒曰〕毳衣，毛布衣。菼〔《集傳》曰〕菼，蘆始生也。爾指室家。子指主之者。啍啍重遲之貌。〔孔氏穎達曰〕啍啍，行之貌，故爲重遲。上言行之聲，此言行之貌，互相見也。璊音門。〔孔氏穎達曰〕璊，玉頳色也。禾之赤苗謂之璊，玉色如之。穀生也。穴壙也。皦白也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/073-da-che/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻檻二十九豏。菼二十七感。敢同。通韻。啍十三元。璊、奔並同。本韻。室四質。穴九屑。日四質。通韻
