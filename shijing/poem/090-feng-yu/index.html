"index":3,"text":"不","anchorIds":[]},{"index":4,"text":"已","anchorIds":[]}]},{"id":"seg-011","order":11,"text":"既见君子","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1"],"characters":[{"index":1,"text":"既","anchorIds":[]},{"index":2,"text":"见","anchorIds":[]},{"index":3,"text":"君","anchorIds":[]},{"index":4,"text":"子","anchorIds":[]}]},{"id":"seg-012","order":12,"text":"云胡不喜","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1"],"characters":[{"index":1,"text":"云","anchorIds":[]},{"index":2,"text":"胡","anchorIds":[]},{"index":3,"text":"不","anchorIds":[]},{"index":4,"text":"喜","anchorIds":[]}]}]},"materials":[{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":2,"glossCount":5,"anchoredPartCount":0,"overviewPartCount":4},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","fangyurun-yuanshi:0003-1:part-1","fangyurun-yuanshi:0004-1:part-1"]},"focusAnchors":[],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/090-feng-yu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？风雨如晦，鸡鸣不已。既见君子，云胡不喜？","sourceLabel":"第 194-195 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首写妻子和丈夫久别重逢的诗歌。它和其他民歌一样，都因在民间广泛歌唱流传而得以保存。但作诗序的人往往加以主观臆测，改变了诗的原意。毛序：“风雨，思君子也。乱世则思君子不改其度焉。”郑笺：“兴者，喻君子虽居乱世，不变改其节度。……鸡不为如晦而止不鸣。”这样一来“风雨”就变成象征乱世，“鸡鸣”就变成象征君子不改其度；由妻称夫的君子，变成品德高尚的君子。这一说法对后世影响极大，很多士人虽处“风雨如晦”之境，犹以“鸡鸣不已”自励。记得在抗战期间，阿英（钱杏邨）发表的作品，笔名“魏如晦”，也是寄托风雨诗意，表明他处乱世的气节。毛序对诗旨多附会歪曲，其说不过这篇诗序却起过一定的积极作用。诗三章，每章皆以风雨、鸡鸣起兴，这些兼有赋景作用的兴句，渲染出一幅寒凉阴暗、鸡声四起的背景。这种时候最容易勾起离情别绪；而诗中的女子竟在此刻重逢了久别的丈夫，其欣喜之情，可以想见，而凄风苦雨则置诸脑后了。这种反衬的速写法，其艺术效果正如王夫之所说的，“以乐景写哀，以哀景写乐，一倍增其哀乐”。风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？喈喈，鸡鸣声。君子，指丈夫。云，语首助词。胡，为什么。夷，平。指心境由忧思而平静。韵读：脂部一一凄、喈、夷。风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？潇潇，风雨猛急貌。毛传：“潇潇，暴疾也。”胶胶，鸡鸣声。瘳（chōu），病愈。韵读：幽部一一潇、胶、瘳。风雨如晦，鸡鸣不已。既见君子，云胡不喜？如，而。陈奂传疏：“如犹而也。”晦，昏暗。","fullText":"这是一首写妻子和丈夫久别重逢的诗歌。它和其他民歌一样，都因在民间广泛歌唱流传而得以保存。但作诗序的人往往加以主观臆测，改变了诗的原意。毛序：“风雨，思君子也。乱世则思君子不改其度焉。”郑笺：“兴者，喻君子虽居乱世，不变改其节度。……鸡不为如晦而止不鸣。”这样一来“风雨”就变成象征乱世，“鸡鸣”就变成象征君子不改其度；由妻称夫的君子，变成品德高尚的君子。这一说法对后世影响极大，很多士人虽处“风雨如晦”之境，犹以“鸡鸣不已”自励。记得在抗战期间，阿英（钱杏邨）发表的作品，笔名“魏如晦”，也是寄托风雨诗意，表明他处乱世的气节。毛序对诗旨多附会歪曲，其说不过这篇诗序却起过一定的积极作用。诗三章，每章皆以风雨、鸡鸣起兴，这些兼有赋景作用的兴句，渲染出一幅寒凉阴暗、鸡声四起的背景。这种时候最容易勾起离情别绪；而诗中的女子竟在此刻重逢了久别的丈夫，其欣喜之情，可以想见，而凄风苦雨则置诸脑后了。这种反衬的速写法，其艺术效果正如王夫之所说的，“以乐景写哀，以哀景写乐，一倍增其哀乐”。风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？喈喈，鸡鸣声。君子，指丈夫。云，语首助词。胡，为什么。夷，平。指心境由忧思而平静。韵读：脂部一一凄、喈、夷。风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？潇潇，风雨猛急貌。毛传：“潇潇，暴疾也。”胶胶，鸡鸣声。瘳（chōu），病愈。韵读：幽部一一潇、胶、瘳。风雨如晦，鸡鸣不已。既见君子，云胡不喜？如，而。陈奂传疏：“如犹而也。”晦，昏暗。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"懷友也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"懷友也。","fullText":"懷友也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。","fullText":"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集釋","excerpt":"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。","fullText":"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏 ":4},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"fangyurun-yuanshi:0004-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？风雨如晦，鸡鸣不已。既见君子，云胡不喜？\",\"sourceLabel\":\"第 194-195 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首写妻子和丈夫久别重逢的诗歌。它和其他民歌一样，都因在民间广泛歌唱流传而得以保存。但作诗序的人往往加以主观臆测，改变了诗的原意。毛序：“风雨，思君子也。乱世则思君子不改其度焉。”郑笺：“兴者，喻君子虽居乱世，不变改其节度。……鸡不为如晦而止不鸣。”这样一来“风雨”就变成象征乱世，“鸡鸣”就变成象征君子不改其度；由妻称夫的君子，变成品德高尚的君子。这一说法对后世影响极大，很多士人虽处“风雨如晦”之境，犹以“鸡鸣不已”自励。记得在抗战期间，阿英（钱杏邨）发表的作品，笔名“魏如晦”，也是寄托风雨诗意，表明他处乱世的气节。毛序对诗旨多附会歪曲，其说不过这篇诗序却起过一定的积极作用。诗三章，每章皆以风雨、鸡鸣起兴，这些兼有赋景作用的兴句，渲染出一幅寒凉阴暗、鸡声四起的背景。这种时候最容易勾起离情别绪；而诗中的女子竟在此刻重逢了久别的丈夫，其欣喜之情，可以想见，而凄风苦雨则置诸脑后了。这种反衬的速写法，其艺术效果正如王夫之所说的，“以乐景写哀，以哀景写乐，一倍增其哀乐”。风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？喈喈，鸡鸣声。君子，指丈夫。云，语首助词。胡，为什么。夷，平。指心境由忧思而平静。韵读：脂部一一凄、喈、夷。风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？潇潇，风雨猛急貌。毛传：“潇潇，暴疾也。”胶胶，鸡鸣声。瘳（chōu），病愈。韵读：幽部一一潇、胶、瘳。风雨如晦，鸡鸣不已。既见君子，云胡不喜？如，而。陈奂传疏：“如犹而也。”晦，昏暗。\",\"fullText\":\"这是一首写妻子和丈夫久别重逢的诗歌。它和其他民歌一样，都因在民间广泛歌唱流传而得以保存。但作诗序的人往往加以主观臆测，改变了诗的原意。毛序：“风雨，思君子也。乱世则思君子不改其度焉。”郑笺：“兴者，喻君子虽居乱世，不变改其节度。……鸡不为如晦而止不鸣。”这样一来“风雨”就变成象征乱世，“鸡鸣”就变成象征君子不改其度；由妻称夫的君子，变成品德高尚的君子。这一说法对后世影响极大，很多士人虽处“风雨如晦”之境，犹以“鸡鸣不已”自励。记得在抗战期间，阿英（钱杏邨）发表的作品，笔名“魏如晦”，也是寄托风雨诗意，表明他处乱世的气节。毛序对诗旨多附会歪曲，其说不过这篇诗序却起过一定的积极作用。诗三章，每章皆以风雨、鸡鸣起兴，这些兼有赋景作用的兴句，渲染出一幅寒凉阴暗、鸡声四起的背景。这种时候最容易勾起离情别绪；而诗中的女子竟在此刻重逢了久别的丈夫，其欣喜之情，可以想见，而凄风苦雨则置诸脑后了。这种反衬的速写法，其艺术效果正如王夫之所说的，“以乐景写哀，以哀景写乐，一倍增其哀乐”。风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？喈喈，鸡鸣声。君子，指丈夫。云，语首助词。胡，为什么。夷，平。指心境由忧思而平静。韵读：脂部一一凄、喈、夷。风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？潇潇，风雨猛急貌。毛传：“潇潇，暴疾也。”胶胶，鸡鸣声。瘳（chōu），病愈。韵读：幽部一一潇、胶、瘳。风雨如晦，鸡鸣不已。既见君子，云胡不喜？如，而。陈奂传疏：“如犹而也。”晦，昏暗。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"懷友也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"懷友也。\",\"fullText\":\"懷友也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。\",\"fullText\":\"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。\",\"fullText\":\"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻淒八齊。喈九佳。夷四支。通韻。瀟二蕭。膠三肴。瘳十一尤，叶憐蕭反。叶韻。晦十一隊，叶呼洧反。已四紙。喜同。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻淒八齊。喈九佳。夷四支。通韻。瀟二蕭。膠三肴。瘳十一尤，叶憐蕭反。叶韻。晦十一隊，叶呼洧反。已四紙。喜同。叶韻。\",\"fullText\":\"標韻淒八齊。喈九佳。夷四支。通韻。瀟二蕭。膠三肴。瘳十一尤，叶憐蕭反。叶韻。晦十一隊，叶呼洧反。已四紙。喜同。叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}}"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"script\",null,{\"id\":\"__SHIJING_PAGE_DATA__\",\"type\":\"application/json\",\"data-page-kind\":\"poem-detail\",\"data-page-href\":\"/shijing/poem/090-feng-yu\",\"data-page-data-href\":\"/__data/shijing/poem/090-feng-yu/data.json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1d\"}}],\"$L1e\",\"$L1f\"]\n"])</script><script>self.__next_f.push([1,"21:I[631,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"356\",\"static/chunks/356-1cbf59d25a49fb83.js\",\"909\",\"static/chunks/909-9eb9e001d16de97f.js\",\"600\",\"static/chunks/app/shijing/poem/%5BpoemId%5D/page-aed9ab3190ba59dd.js\"],\"PoemReader\"]\n20:T781,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"WebSite\",\"@id\":\"https://shisao.taozeyu.com/shijing/#website\",\"name\":\"诗骚集注\",\"url\":\"https://shisao.taozeyu.com/shijing/\",\"inLanguage\":\"zh-Hans\"},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/090-feng-yu/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"诗经\",\"item\":\"https://shisao.taozeyu.com/shijing/\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"風\",\"item\":\"https://shisao.taozeyu.com/shijing/#feng\"},{\"@type\":\"ListItem\",\"position\":3,\"name\":\"鄭風\",\"item\":\"https://shisao.taozeyu.com/shijing/#zhengfeng\"},{\"@type\":\"ListItem\",\"position\":4,\"name\":\"風雨\",\"item\":\"https://shisao.taozeyu.com/shijing/poem/090-feng-yu/\"}]},{\"@type\":\"CreativeWork\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/090-feng-yu/#poem\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/090-feng-yu/\",\"name\":\"風雨\",\"description\":\"風 · 鄭風 /090-feng-yu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？风雨如晦，鸡鸣不已。既见君子，云胡不喜？\",\"sourceLabel\":\"第 194-195 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首写妻子和丈夫久别重逢的诗歌。它和其他民歌一样，都因在民间广泛歌唱流传而得以保存。但作诗序的人往往加以主观臆测，改变了诗的原意。毛序：“风雨，思君子也。乱世则思君子不改其度焉。”郑笺：“兴者，喻君子虽居乱世，不变改其节度。……鸡不为如晦而止不鸣。”这样一来“风雨”就变成象征乱世，“鸡鸣”就变成象征君子不改其度；由妻称夫的君子，变成品德高尚的君子。这一说法对后世影响极大，很多士人虽处“风雨如晦”之境，犹以“鸡鸣不已”自励。记得在抗战期间，阿英（钱杏邨）发表的作品，笔名“魏如晦”，也是寄托风雨诗意，表明他处乱世的气节。毛序对诗旨多附会歪曲，其说不过这篇诗序却起过一定的积极作用。诗三章，每章皆以风雨、鸡鸣起兴，这些兼有赋景作用的兴句，渲染出一幅寒凉阴暗、鸡声四起的背景。这种时候最容易勾起离情别绪；而诗中的女子竟在此刻重逢了久别的丈夫，其欣喜之情，可以想见，而凄风苦雨则置诸脑后了。这种反衬的速写法，其艺术效果正如王夫之所说的，“以乐景写哀，以哀景写乐，一倍增其哀乐”。风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？喈喈，鸡鸣声。君子，指丈夫。云，语首助词。胡，为什么。夷，平。指心境由忧思而平静。韵读：脂部一一凄、喈、夷。风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？潇潇，风雨猛急貌。毛传：“潇潇，暴疾也。”胶胶，鸡鸣声。瘳（chōu），病愈。韵读：幽部一一潇、胶、瘳。风雨如晦，鸡鸣不已。既见君子，云胡不喜？如，而。陈奂传疏：“如犹而也。”晦，昏暗。\",\"fullText\":\"这是一首写妻子和丈夫久别重逢的诗歌。它和其他民歌一样，都因在民间广泛歌唱流传而得以保存。但作诗序的人往往加以主观臆测，改变了诗的原意。毛序：“风雨，思君子也。乱世则思君子不改其度焉。”郑笺：“兴者，喻君子虽居乱世，不变改其节度。……鸡不为如晦而止不鸣。”这样一来“风雨”就变成象征乱世，“鸡鸣”就变成象征君子不改其度；由妻称夫的君子，变成品德高尚的君子。这一说法对后世影响极大，很多士人虽处“风雨如晦”之境，犹以“鸡鸣不已”自励。记得在抗战期间，阿英（钱杏邨）发表的作品，笔名“魏如晦”，也是寄托风雨诗意，表明他处乱世的气节。毛序对诗旨多附会歪曲，其说不过这篇诗序却起过一定的积极作用。诗三章，每章皆以风雨、鸡鸣起兴，这些兼有赋景作用的兴句，渲染出一幅寒凉阴暗、鸡声四起的背景。这种时候最容易勾起离情别绪；而诗中的女子竟在此刻重逢了久别的丈夫，其欣喜之情，可以想见，而凄风苦雨则置诸脑后了。这种反衬的速写法，其艺术效果正如王夫之所说的，“以乐景写哀，以哀景写乐，一倍增其哀乐”。风雨凄凄，鸡鸣喈喈。既见君子，云胡不夷？喈喈，鸡鸣声。君子，指丈夫。云，语首助词。胡，为什么。夷，平。指心境由忧思而平静。韵读：脂部一一凄、喈、夷。风雨潇潇，鸡鸣胶胶。既见君子，云胡不瘳？潇潇，风雨猛急貌。毛传：“潇潇，暴疾也。”胶胶，鸡鸣声。瘳（chōu），病愈。韵读：幽部一一潇、胶、瘳。风雨如晦，鸡鸣不已。既见君子，云胡不喜？如，而。陈奂传疏：“如犹而也。”晦，昏暗。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"懷友也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"懷友也。\",\"fullText\":\"懷友也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。\",\"fullText\":\"右《風雨》三章，章四句。此詩自《序》、《傳》諸家，及凡有志學詩者，亦莫不以爲「思君子」也，獨《集傳》指爲「淫詩」，則無良甚矣，又何辯耶？且鄭本國賢士大夫互相傳習燕享之會，至賦以言志。使真其淫，似不必待晦翁而始知其爲淫矣。獨《序》以爲風雨喻亂世，遂使詩味索然，不可以不辯。夫風雨晦冥，獨處無聊，此時最易懷人。況故友良朋，一朝聚會，則尤可以促膝談心。雖有無限愁懷，鬱結莫解，亦皆化盡。如險初夷，如病初瘳，何樂如之！此詩人善於言情，又善於即景以抒懷，故爲千秋絶調也。若必以風雨喻亂世，則必待亂世而始思君子，不遇亂世則不足以見君子，義旨非不正大，意趣反覺索然。故此詩不必定指爲忽、突世作，凡屬懷友，皆可以咏，則意味無窮矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。\",\"fullText\":\"集釋喈喈〔姚氏際恒曰〕喈爲衆聲和，初鳴聲尚微，但覺其衆和耳。夷平也。〔嚴氏粲曰〕《毛傳》以夷爲悦，心悦則夷平，憂則鬱結也。膠膠〔姚氏際恒曰〕膠膠，同聲高大也。〔嚴氏粲曰〕膠膠，擾擾，是雜之意，謂群鷄之聲也。瘳〔《集傳》〕瘳，病愈也。言積思之病，至此而愈也。如晦〔姚氏際恒曰〕如晦，正寫其明也，故曰如晦。惟其爲如晦，則淒淒、瀟瀟時尚晦可知。詩意如此，無人領會，可與心賞者如何如何？已止也。〔姚氏際恒曰〕鷄三鳴後，天將曉，相續不已也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/090-feng-yu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻淒八齊。喈九佳。夷四支。通韻。瀟二蕭。膠三肴。瘳十一尤，叶憐蕭反。叶韻。晦十一隊，叶呼洧反。已四紙。喜同。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻淒八齊。喈九佳。夷四支。通韻。瀟二蕭。膠三肴。瘳十一尤，叶憐蕭反。叶韻。晦十一隊，叶呼洧反。已四紙。喜同。叶韻。\",\"fullText\":\"標韻淒八齊。喈九佳。夷四支。通韻。瀟二蕭。膠三肴。瘳十一尤，叶憐蕭反。叶韻。晦十一隊，叶呼洧反。已四紙。喜同。叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\
