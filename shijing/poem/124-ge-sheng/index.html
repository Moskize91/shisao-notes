,"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-018:3-3:日","segmentId":"seg-018","segmentOrder":18,"surfaceText":"日","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-11"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-019:1-4:百岁之后","segmentId":"seg-019","segmentOrder":19,"surfaceText":"百岁之后","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-10"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-020:1-4:归于其室","segmentId":"seg-020","segmentOrder":20,"surfaceText":"归于其室","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-10"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-020:4-4:室","segmentId":"seg-020","segmentOrder":20,"surfaceText":"室","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-11"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！","sourceLabel":"第 254-256 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。","fullText":"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！域，墓地。毛传：“域，茔域也。”说文：“茔，墓地也。”息，寝息。韵读：之部——棘、域、息。角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。夏之日，冬之夜。百岁之后，归于其居！百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。冬之夜，夏之日。百岁之后，归于其室！室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！","sourceLabel":"第 254-256 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！","fullText":"这是一位妇女悼念丈夫的诗 何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！","fullText":"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！","fullText":"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇 "materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。\",\"fullText\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！域，墓地。毛传：“域，茔域也。”说文：“茔，墓地也。”息，寝息。韵读：之部——棘、域、息。角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。夏之日，冬之夜。百岁之后，归于其居！百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。冬之夜，夏之日。百岁之后，归于其室！室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！\",\"fullText\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！域，墓地。毛传：“域，茔域也。”说文：“茔，墓地也。”息，寝息。韵读：之部——棘、域、息。角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。夏之日，冬之夜。百岁之后，归于其居！百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。冬之夜，夏之日。百岁之后，归于其室！室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:葛生蒙楚\",\"seg-002:1-4:蔹蔓于野\",\"seg-003:1-4:予美亡此\",\"seg-004:1-4:谁与独处\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。\",\"fullText\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含 -012:3-4:独旦\",\"seg-012:4-4:旦\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\",\"anchor-7-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"夏之日，冬之夜。百岁之后，归于其居！\",\"fullText\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！域，墓地。毛传：“域，茔域也。”说文：“茔，墓地也。”息，寝息。韵读：之部——棘、域、息。角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。夏之日，冬之夜。百岁之后，归于其居！百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。冬之夜，夏之日。百岁之后，归于其室！室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。\",\"notes\":null,\"partOrder\":8,\"anchorIds\":[\"seg-013:1-3:夏之日\",\"seg-014:1-3:冬之夜\",\"seg-015:1-4:百岁之后\",\"seg-016:1-4:归于其居\"],\"glossAnchorIds\":[\"anchor-8-1\",\"anchor-8-2\",\"anchor-8-3\",\"anchor-8-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。\",\"fullText\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！域，墓地。毛传：“域，茔域也。”说文：“茔，墓地也。”息，寝息。韵读：之部——棘、域、息。角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。夏之日，冬之夜。百岁之后，归于其居！百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。冬之夜，夏之日。百岁之后，归于其室！室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。\",\"notes\":null,\"partOrder\":9,\"anchorIds\":[\"seg-015:1-4:百岁之后\",\"seg-014:3-3:夜\",\"seg-016:4-4:居\"],\"glossAnchorIds\":[\"anchor-9-1\",\"anchor-9-2\",\"anchor-9-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"冬之夜，夏之日。百岁之后，归于其室！\",\"fullText\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛 ，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛，葛藤。蒙，覆盖。楚，荆树。蔹（liǎn），草名。同葛藤一样都是蔓生植物，必须攀缘依附在其他树上才能生存。蔓，蔓延。马瑞辰《通释》：“葛与蔹皆蔓草，延于松柏则得其所，犹妇人随夫荣贵。今诗言‘蒙楚’、‘蒙棘’、‘蔓野’、‘蔓域’，盖以喻妇人失其所依。”马氏是解释这二句的兴义。有人说这二句描写了郊外墓景，是即景起兴，说亦可通。予美，犹今言“我的爱人”。陈奂《传疏》：“妇人称夫谓美，犹称夫谓良。”亡，郑笺：“亡，无也。言我所美之人无于此。”马瑞辰《通释》：“亡此犹云去此，又如俗云不在此耳。”谁与，谁和我同居？独处，孤独地呆在家里。有人将这句译为“谁伴他孤独地长眠地下呢”，可备一说。韵读：鱼部——楚、野（音暑）、处。葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！域，墓地。毛传：“域，茔域也。”说文：“茔，墓地也。”息，寝息。韵读：之部——棘、域、息。角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。夏之日，冬之夜。百岁之后，归于其居！百岁之后，指死后。按“百岁”是借代的修辞。居，郑笺：“居，坟墓也。”韵读：鱼部——夜（音豫）、居。冬之夜，夏之日。百岁之后，归于其室！室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。\",\"notes\":null,\"partOrder\":11,\"anchorIds\":[\"seg-018:3-3:日\",\"seg-020:4-4:室\"],\"glossAnchorIds\":[\"anchor-11-1\",\"anchor-11-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"征婦怨也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"征婦怨也。\",\"fullText\":\"征婦怨也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！\",\"fullText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"fullText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蘝〔《集傳》〕蘝，草名，似栝樓，葉盛而細。蔓延也。予美婦人指其夫也。域塋域也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"蘝〔《集傳》〕蘝，草名，似栝樓，葉盛而細。蔓延也。\",\"fullText\":\"蘝〔《集傳》〕蘝，草名，似栝樓，葉盛而細。蔓延也。予美婦人指其夫也。域塋域也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蘝〔《集傳》〕蘝，草名，似栝樓，葉盛而細。蔓延也。予美婦人指其夫也。域塋域也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"予美婦人指其夫也。域塋域也。\",\"fullText\":\"蘝〔《集傳》〕蘝，草名，似栝樓，葉盛而細。蔓延也。予美婦人指其夫也。域塋域也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"000 t\":\"归于其室\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-020:4-4:室\",\"segmentId\":\"seg-020\",\"segmentOrder\":20,\"surfaceText\":\"室\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-11\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位妇女悼念丈夫的诗。毛序：“葛生，刺晋献公也。好攻战，则国人多丧矣。”郑笺：“夫从征役，弃亡不反，则其妻居家而怨思。”春秋时代，战争频繁，人民死于兵役是很可能的事。但从诗的内容看，却察不出有从征不归的痕迹。还是闻一多仅以“悼亡”二字释诗旨，反显得谨慎而切实。这首诗也可为悼亡诗之祖。陈继儒《读诗日录》云：“此诗甚悲，读之使人泪下。”的确，全诗恻恻伤痛的情调，感人至深。前三章抒写良人已逝、形单影只的悲哀，一唱三叹，无法排解。潘岳悼亡诗中“展转向枕席，长簟竟床空”的意境，庶几近之。后二章忽然写到愿意死后共归一处。生前已茫然，相见在黄泉，这是诗人思念到极点的感情的延伸，也是哀痛到极点的心理的变态。我国古典文学作品中，多少有情人难成眷属、只能相逢于身后的浪漫主义描写，谁能说不是滥觞于此？此外，“夏之日”、“冬之夜”两句，不着一个情字，但我们倘若将元稹悼亡诗中“惟将终夜长开眼，报答平生未展眉”来作注脚，则会感到这六个字中包蕴的哀思悲情真不是千言万语所能道尽。张戒《岁寒堂诗话》引刘艇之云：“情在词外曰隐。”欧阳修《六一诗话》引梅尧臣说：“含不尽之意，见于言外。”都是就这种修辞而言。\",\"fullText\":\"$22\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shiji \",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"角枕，兽骨做装饰的枕头。粲，同“灿”，鲜丽华美貌。锦衾，锦制的被子，用于敛尸。同角枕一样，都是丧具。烂，灿烂，叠韵。与第一句的“粲”是互文。独旦，严粲《诗缉》：“独旦，独宿至旦也。”韵读：元部——粲、烂、旦。\",\"fullText\":\"$28\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-009:1-2:角枕\",\"seg-009:3-3:粲\",\"seg-010:1-2:锦衾\",\"seg-010:3-3:烂\",\"seg-012:3-4:独旦\",\"seg-012:4-4:旦\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\",\"anchor-7-5\",\"anchor-7-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"夏之日，冬之夜。百岁之后，归于其居！\",\"fullText\":\"$29\",\"notes\":null,\"partOrder\":8,\"anchorIds\":[\"seg-013:1-3:夏之日\",\"seg-014:1-3:冬之夜\",\"seg-015:1-4:百岁之后\",\"seg-016:1-4:归于其居\"],\"glossAnchorIds\":[\"anchor-8-1\",\"anchor-8-2\",\"anchor-8-3 Text\":\"$2b\",\"notes\":null,\"partOrder\":10,\"anchorIds\":[\"seg-017:1-3:冬之夜\",\"seg-018:1-3:夏之日\",\"seg-019:1-4:百岁之后\",\"seg-020:1-4:归于其室\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\",\"anchor-10-3\",\"anchor-10-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-11\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"葛生蒙楚，蔹蔓于野。予美亡此，谁与独处！葛生蒙棘，蔹蔓于域。予美亡此，谁与独息！角枕粲兮，锦衾烂兮。予美亡此，谁与独旦！夏之日，冬之夜。百岁之后，归于其居！冬之夜，夏之日。百岁之后，归于其室！\",\"sourceLabel\":\"第 254-256 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"室，郑笺：“室犹家也。”也指坟墓。韵读：脂部——日、室。\",\"fullText\":\"$2c\",\"notes\":null,\"partOrder\":11,\"anchorIds\":[\"seg-018:3-3:日\",\"seg-020:4-4:室\"],\"glossAnchorIds\":[\"anchor-11-1\",\"anchor-11-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"征婦怨也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"征婦怨也。\",\"fullText\":\"征婦怨也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！\",\"fullText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻公好攻戰，則國人多喪」。朱子謂「未見此詩之果作於其時」，然亦安知此詩之非必不出其時耶？然此等處無關詩旨緊要，可置而弗辯，但以爲征婦怨可也。征婦思夫久役于外，或存或亡，均不可知，其歸與否，更不能必。於是日夜悲思，冬夏難已。暇則展其衾枕，物猶粲爛，人是孤棲，不禁傷心，發爲浩歎。以爲此生無復見理，惟有百歲後返其遺骸，或與吾同歸一穴而已，他何望耶？唐人詩云：「可憐無定河邊骨，猶是深閨夢裏人。」可以想見此詩景況。説《詩》諸老不察其情，或以爲思存，或以爲悼亡，已極可歎。又或謂枕衾粲爛，其嫁未久，更覺腐論難堪。三百篇多少好詩，純被此種迂儒説壞。能不令人扼腕！眉評〔四、五章〕二章句法只一互换，覺時光流轉，眴息百年，人生幾何，能不傷心！\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/124-ge-sheng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《葛生》五章，章四句。《序》以爲「刺晉獻
