使我不能息兮","charStart":1,"charEnd":6,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-3"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-008:5-5:息","segmentId":"seg-008","segmentOrder":8,"surfaceText":"息","charStart":5,"charEnd":5,"entryIds":["maruichen-tongshi:0001-1:part-1","quwanli-quanshi:0003-1:part-1","wangli-yundu:0002-1:part-1"],"materialIds":["maruichen-tongshi","quwanli-quanshi","wangli-yundu"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/086-jiao-tong/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。","sourceLabel":"第 189-190 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。","fullText":"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。","notes":null,"partOrder":1,"anchorI iao-tong/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"憂君爲群小所弄也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"憂君爲群小所弄也。","fullText":"憂君爲群小所弄也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。","fullText":"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/ art\":4,\"charEnd\":4,\"entryIds\":[\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"wangli-yundu\"]},{\"id\":\"seg-007:1-4:维子之故\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"维子之故\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"wangli-yundu\"]},{\"id\":\"seg-008:1-6:使我不能息兮\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"使我不能息兮\",\"charStart\":1,\"charEnd\":6,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-008:5-5:息\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"息\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\",\"quwanli-quanshi:0003-1:part-1\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\",\"quwanli-quanshi\",\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。\",\"sourceLabel\":\"第 189-190 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。\",\"fullText\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。\",\"sourceLabel\":\"第 189-190 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。\",\"fullText\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:彼狡童兮\",\"seg-002:1-5:不与我言兮\",\"seg-003:1-4:维子之故\",\"seg-004:1-6:使我不能餐兮\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。\",\"sourceLabel\":\"第 189-190 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"fullText\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-005:1-4:彼狡童兮\",\"seg-006:1-5:不与我食兮\",\"seg-007:1-4:维子之故\",\"seg-008:1-6:使我不能息兮\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不與我言兮。維子之故，使我不能餐兮。彼狡童兮，不與我食兮。維子之故，使我不能息兮。\",\"sourceLabel\":\"第 100 页\",\"attributionLabel\":\"陳奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"彼狡童兮，不與我言兮。維子之故，使我不能餐兮。彼狡童兮，不與我食兮。維子之故，使我不能息兮。\",\"fullText\":\"彼狡童兮，不與我言兮。維子之故，使我不能餐兮。彼狡童兮，不與我食兮。維子之故，使我不能息兮。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"憂君爲群小所弄也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"憂君爲群小所弄也。\",\"fullText\":\"憂君爲群小所弄也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。\",\"fullText\":\"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋息安也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋息安也。\",\"fullText\":\"集釋息安也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻言十三元。餐十四寒。通韻。食十三職。息同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻言十三元。餐十四寒。通韻。食十三職。息同。 Year\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。\",\"sourceLabel\":\"第 189-190 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。\",\"fullText\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。\",\"sourceLabel\":\"第 189-190 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。\",\"fullText\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完善。此诗缠绵悱恻，依依之情，溢于言表；而失恋之意，见于言外。钱锺书管锥编曰：“若夫始不与语，继不与食，则余衾剩枕、冰床雪被之况，虽言诠未涉，亦如匣剑帷灯。……习处而生嫌，迹密转使心疏，常近则渐欲远，故同牢而有异志，如此诗是。其意初未明言，而寓于字里行间，即含蓄也。”这一段很透彻的剖析，可为读者欣赏此诗指迷。彼狡童兮，不与我言兮。维子之故，使我不能餐兮。狡童，见山有扶苏注。孔颖达疏释狡童为“狡好之幼童”，即以狡为佼之假借字，亦通。维，与惟通，与“以”字用同。介词。王引之释词：“惟犹以也。诗狡童曰：‘维子之故。’”韵读：元部一一言、餐。彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:彼狡童兮\",\"seg-002:1-5:不与我言兮\",\"seg-003:1-4:维子之故\",\"seg-004:1-6:使我不能餐兮\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼狡童兮，不与我言兮。维子之故，使我不能餐兮。彼狡童兮，不与我食兮。维子之故，使我不能息兮。\",\"sourceLabel\":\"第 189-190 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"彼狡童兮，不与我食兮。维子之故，使我不能息兮。息，气息通畅。马瑞辰通释：“息对餐言，谓喘息也。人之气息曰喘，舒曰息。浑言之，则喘亦为息。……不能息，即言气息不利耳。”按此句意为因狡童的变心而难过得气都透不过来。韵读：之部一一食、息。\",\"fullText\":\"这是一首女子失恋的诗歌。毛序：“狡童，刺忽也。不能与贤人图事，权臣擅命也。”朱子语类驳曰：“经书都被人说坏了，前后相仍不觉。且如狡童诗，是序之妄。安得当时人民敢指其君为狡童？况忽之所为，可谓之愚，何狡之有？当是男女相怨之诗。”朱熹的批评是很得当的。宋、清学者反对狡童及其他情歌为“淫诗”者，总因为有“思无邪”三字梗在胸中，认定圣洁的经典中决不可能有淫佚之词。存此成见，便再不可能客观地就诗论诗了。闻一多风诗类钞将狡童归入“女词”，解曰：“恨不见答也。”对诗旨的分析比朱熹更为完 notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。\",\"fullText\":\"右《狡童》二章，章四句。《序》謂「刺忽」。呼君爲狡童者無禮，固屬非是。即或謂指祭仲，則祭仲在當時年已老，亦殊不類。昔人已辨之。《集傳》又謂「淫女見絶而戲其人之詞。曰悦己者衆，子雖見絶，未至於使我不能餐與息也。」則不惟「未至」之義，詩無其文，即悦己之衆，詩亦並無其意。不知何以見爲淫女反言以戲其人也。大抵狡童者，僉壬宵小之謂。《扶蘇》章之狡童、狂且，即此章之狡童也。國君所用非人，恃寵而驕，目無朝臣也久矣。言不屑與，況同食哉？大臣憂之而無如何，乃私相憤恨，曰彼狡童之不與我言且食也無足爲怪，特所慮者君耳。吾爲君故，至不能餐，又不能息，是寢食俱廢矣。向非維君之爲而誰爲哉？詩意甚明，何至疑忽又疑仲，而竟至疑爲淫女所私之人耶？特是作於何朝何代，則不可考。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/086-jiao-tong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋息安也。\",\"sourceLabel\":nul
