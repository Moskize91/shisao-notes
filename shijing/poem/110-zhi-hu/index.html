,{"id":"seg-018:1-8:上慎旃哉犹来无死","segmentId":"seg-018","segmentOrder":18,"surfaceText":"上慎旃哉犹来无死","charStart":1,"charEnd":8,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-11"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”","sourceLabel":"第 229-230 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。","fullText":"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿台》：“两处春光同日尽，居人思客客思家。”韦庄《浣溪沙》：“夜夜相思更漏残，伤心明月凭阑干，想君思我锦衾寒。”龚自珍《己亥杂诗》：“一灯古店斋心坐，不是思亲梦里人。”遣词造境都越出越精，然其机抒则同《陟岵》无异，这就是风诗几乎篇篇有创意的可贵之处。陟彼岵兮，瞻望父兮。父曰：“嗟！予子！行役夙夜无已。上慎旃哉，犹来无止！”陟，登上。见卷耳注。岵（hù），无草木的山。毛传：“山无草木曰岵。”唐语林施士丐曰：“山无草木曰岵。所以言‘陟彼岵兮’，言元可恃也。以岵之无草木，故以譬之。”父曰，这句以下均是诗人想象他父亲在家中说的话。下章“母曰”、“兄曰”等语皆同。已，停止。这句意为，服役日日夜夜没有休息的时间。按鲁诗无已作“毋已”，义与毛诗异。上，鲁诗作“尚”之意。旃（zhān），之、焉的合音，指示代名词。这句意为，希望保重你自己啊。犹来，还是归来。止，停留、滞留。朱熹《诗集传》：“犹可以来归，无止于彼而不来也。”陟彼屺兮，瞻望母兮。母曰：“嗟！予季！行役夙夜无寐，上慎旃哉，犹来无弃！”屺（qǐ），有草木的山。毛传：“山有草木曰屺。”季，小儿子。侯人传：“季，人之少子也。”无寐，没有睡觉的时间。弃，抛弃。毛传：“母尚恩也。”陈奂《传疏》：“母尚恩以释经之无弃，言不弃母也。”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟！行役夙夜必偕，上慎旃哉，犹来无死！”偕，一起。王肃：“偕，俱也。”朱熹《诗集传》：“言与其侪同作同止，不得自如也。”" ntOrder\":18,\"surfaceText\":\"上慎旃哉犹来无死\",\"charStart\":1,\"charEnd\":8,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-11\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。\",\"fullText\":\"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿台》：“两处春光同日尽，居人思客客思家。”韦庄《浣溪沙》：“夜夜相思更漏残，伤心明月凭阑干，想君思我锦衾寒。”龚自珍《己亥杂诗》：“一灯古店斋心坐，不是思亲梦里人。”遣词造境都越出越精，然其机抒则同《陟岵》无异，这就是风诗几乎篇篇有创意的可贵之处。陟彼岵兮，瞻望父兮。父曰：“嗟！予子！行役夙夜无已。上慎旃哉，犹来无止！”陟，登上。见卷耳注。岵（hù），无草木的山。毛传：“山无草木曰岵。”唐语林施士丐曰：“山无草木曰岵。所以言‘陟彼岵兮’，言元可恃也。以岵之无草木，故以譬之。”父曰，这句以下均是诗人想象他父亲在家中说的话。下章“母曰”、“兄曰”等语皆同。已，停止。这句意为，服役日日夜夜没有休息的时间。按鲁诗无已作“毋已”，义与毛诗异。上，鲁诗作“尚”之意。旃（zhān），之、焉的合音，指示代名词。这句意为，希望保重你自己啊。犹来，还是归来。止，停留、滞留。朱熹《诗集传》：“犹可以来归，无止于彼而不来也。”陟彼屺兮，瞻望母兮。母曰：“嗟！予季！行役夙夜无寐，上慎旃哉，犹来无弃！”屺（qǐ），有草木的山。毛传：“山有草木曰屺。”季，小儿子。侯人传：“季，人之少子也。”无寐，没有睡觉的时间。弃，抛弃。毛传：“母尚恩也。”陈奂《传疏》：“母尚恩以释经之无弃，言不弃母也。”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟！行役夙夜必偕，上慎旃哉，犹来无死！”偕，一起。王肃：“偕，俱也。”朱熹《诗集传》：“言与其侪同作同止，不得自如也。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿台》：“两处春光同日尽，居人思客客思家。”韦庄《浣溪沙》：“夜夜相思更漏残，伤心明月凭阑干，想君思我锦衾寒。”龚自珍《己亥杂诗》：“一灯古店斋心坐，不是思亲梦里人。”遣词造境都越出越精，然其机抒则同《陟岵》无异，这就是风诗几乎篇篇有创意的可贵之处。\",\"fullText\":\"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿台》：“两处春光同日尽，居人思客客思家。”韦庄《浣溪沙》：“夜夜相思更漏残，伤心明月凭阑干，想君思我锦衾寒。”龚自珍《己亥杂诗》：“一灯古店斋心坐，不是思亲梦里人。”遣词造境都越出越精，然其机抒则同《陟岵》无异，这就是风诗几乎篇篇有创意的可贵之处。陟彼岵兮，瞻望父兮。父曰：“嗟！予子！行役夙夜无已。上慎旃哉，犹来无止！”陟，登上。见卷耳注。岵（hù），无草木的山。毛传：“山无草木曰岵。”唐语林施士丐曰：“山无草木曰岵 005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"孝子行役而思親也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"孝子行役而思親也。\",\"fullText\":\"孝子行役而思親也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《陟岵》三章，章六句。人子行役，登高念親，人情之常。若從正面直寫己之所以念親，縱千言萬語，豈能道得意盡？詩妙從對面設想，思親所以念己之心，與臨行勗己之言，則筆以曲而愈達，情以婉而愈深。千載下讀之，猶足令羇旅人望白雲而起思親之念，況當日遠離父母者乎？其用意尤重在「上慎旃哉」一語。親以是祝之子，子以是體夫親。其能以親心爲己心者，又不僅在思親之貌與親之情而已。而可不謂之爲賢乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《陟岵》三章，章六句。人子行役，登高念親，人情之常。若從正面直寫己之所以念親，縱千言萬語，豈能道得意盡？詩妙從對面設想，思親所以念己之心，與臨行勗己之言，則筆以曲而愈達，情以婉而愈深。千載下讀之，猶足令羇旅人望白雲而起思親之念，況當日遠離父母者乎？其用意尤重在「上慎旃哉」一語。親以是祝之子，子以是體夫親。其能以親心爲己心者，又不僅在思親之貌與親之情而已。而可不謂之爲賢乎？\",\"fullText\":\"右《陟岵》三章，章六句。人子行役，登高念親，人情之常。若從正面直寫己之所以念親，縱千言萬語，豈能道得意盡？詩妙從對面設想，思親所以念己之心，與臨行勗己之言，則筆以曲而愈達，情以婉而愈深。千載下讀之，猶足令羇旅人望白雲而起思親之念，況當日遠離父母者乎？其用意尤重在「上慎旃哉」一語。親以是祝之子，子以是體夫親。其能以親心爲己心者，又不僅在思親之貌與親之情而已。而可不謂之爲賢乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」\",\"fullText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"上猶尚也。\",\"fullText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"無止謂無止于彼而不來也。\",\"fullText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來 site\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/110-zhi-hu/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/110-zhi-hu/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tc29,"])</script><script>self.__next_f.push([1,"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿台》：“两处春光同日尽，居人思客客思家。”韦庄《浣溪沙》：“夜夜相思更漏残，伤心明月凭阑干，想君思我锦衾寒。”龚自珍《己亥杂诗》：“一灯古店斋心坐，不是思亲梦里人。”遣词造境都越出越精，然其机抒则同《陟岵》无异，这就是风诗几乎篇篇有创意的可贵之处。陟彼岵兮，瞻望父兮。父曰：“嗟！予子！行役夙夜无已。上慎旃哉，犹来无止！”陟，登上。见卷耳注。岵（hù），无草木的山。毛传：“山无草木曰岵。”唐语林施士丐曰：“山无草木曰岵。所以言‘陟彼岵兮’，言元可恃也。以岵之无草木，故以譬之。”父曰，这句以下均是诗人想象他父亲在家中说的话。下章“母曰”、“兄曰”等语皆同。已，停止。这句意为，服役日日夜夜没有休息的时间。按鲁诗无已作“毋已”，义与毛诗异。上，鲁诗作“尚”之意。旃（zhān），之、焉的合音，指示代名词。这句意为，希望保重你自己啊。犹来，还是归来。止，停留、滞留。朱熹《诗集传》：“犹可以来归，无止于彼而不来也。”陟彼屺兮，瞻望母兮。母曰：“嗟！予季！行役夙夜无寐，上慎旃哉，犹来无弃！”屺（qǐ），有草木的山。毛传：“山有草木曰屺。”季，小儿子。侯人传：“季，人之少子也。”无寐，没有睡觉的时间。弃，抛弃。毛传：“母尚恩也。”陈奂《传疏》：“母尚恩以释经之无弃，言不弃母也。”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟！行役夙夜必偕，上慎旃哉，犹来无死！”偕，一起。王肃：“偕，俱也。”朱熹《诗集传》：“言与其侪同作同止，不得自如也。”"])</script><script>self.__next_f.push([1,"23:Tc29,"])</script><script>self.__next_f.push([1,"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿 无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首征人思家的诗。毛序：“陟岵，孝子行役，思念父母也。国迫而数侵削，役乎大国，父母兄弟离散，而作是诗也。”所说与诗意基本相符。无休止的劳役，连睡觉的时间都没有，使征人难免联想到死亡。他只希望能在死亡线上挣扎到回家乡。诗反映了当时劳役生活的痛苦和劳动人民对统治者征役无已的极度憎恨。\",\"fullText\":\"$22\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"诗的艺术手法极为巧妙。诗人在役地思家，但他不直说自己的望乡之情，却想象着父母兄长在家中想念他的情景。这样的表达法，反映出一种极迫切、极深厚、极苦涩、又极难排解的心情。方玉润《诗经原始》云：“人子行役，登高念亲，人情之常。若从正面直写己之所以念亲，纵千言万语，岂能道得尽？诗妙从对面设想，思亲所以念己之心，与临行勗己之言，则笔以曲而愈达，情以婉而愈深。千载之下读之犹足令羁旅人望白云而起思亲之念，况当日远离父母者乎？”他这一段分析，正点出其中三昧。这种手法，钱锺书先生称之为“分身以自省，推己以忖他；写心行则我思人乃想人必思我。”后世诗人用此意者非常普遍，如白居易《望驿台》：“两处春光同日尽，居人思客客思家。”韦庄《浣溪沙》：“夜夜相思更漏残，伤心明月凭阑干，想君思我锦衾寒。”龚自珍《己亥杂诗》：“一灯古店斋心坐，不是思亲梦里人。”遣词造境都越出越精，然其机抒则同《陟岵》无异，这就是风诗几乎篇篇有创意的可贵之处。\",\"fullText\":\"$23\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子！行役夙夜无已。上慎旃哉，犹来无止！”\",\"fullText\":\"$24\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-4:陟彼岵兮\",\"seg-002:1-4:瞻望父兮\",\"seg-003:1-2:父曰\",\"seg-004:1-5:嗟予子行役\",\"seg-005:1-4:夙夜无已\",\"seg-006:1-8:上慎旃哉犹来无止\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"陟，登上。见卷耳注。岵（hù），无草木的山。毛传：“山无草木曰岵。”唐语林施士丐曰：“山无草木曰岵。所以言‘陟彼岵兮’，言元可恃也。以岵之无草木，故以譬之。”\",\"fullText\":\"$25\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-001:1-1:陟\",\"seg-001:3-3:岵\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"父曰，这句以下均是诗人想象他父亲在家中说的话。下章“母曰”、“兄曰”等语皆同。\",\"fullText\":\"$26\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[\"seg-003:1-2:父曰\",\"seg-009:1-2:母曰\",\"seg-015:1-2:兄曰\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"已，停止。这句意为，服役日日夜夜没有休息的时间。按鲁诗无已作 eg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-12\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼岵兮，瞻望父兮。父曰：“嗟！予子行役，夙夜无已。上慎旃哉，犹来无止！”陟彼屺兮，瞻望母兮。母曰：“嗟！予季行役，夙夜无寐。上慎旃哉，犹来无弃！”陟彼冈兮，瞻望兄兮。兄曰：“嗟！予弟行役，夙夜必偕。上慎旃哉，犹来无死！”\",\"sourceLabel\":\"第 229-230 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"偕，一起。王肃：“偕，俱也。”朱熹《诗集传》：“言与其侪同作同止，不得自如也。”\",\"fullText\":\"$2d\",\"notes\":null,\"partOrder\":12,\"anchorIds\":[\"seg-017:4-4:偕\"],\"glossAnchorIds\":[\"anchor-12-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"孝子行役而思親也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"孝子行役而思親也。\",\"fullText\":\"孝子行役而思親也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《陟岵》三章，章六句。人子行役，登高念親，人情之常。若從正面直寫己之所以念親，縱千言萬語，豈能道得意盡？詩妙從對面設想，思親所以念己之心，與臨行勗己之言，則筆以曲而愈達，情以婉而愈深。千載下讀之，猶足令羇旅人望白雲而起思親之念，況當日遠離父母者乎？其用意尤重在「上慎旃哉」一語。親以是祝之子，子以是體夫親。其能以親心爲己心者，又不僅在思親之貌與親之情而已。而可不謂之爲賢乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《陟岵》三章，章六句。人子行役，登高念親，人情之常。若從正面直寫己之所以念親，縱千言萬語，豈能道得意盡？詩妙從對面設想，思親所以念己之心，與臨行勗己之言，則筆以曲而愈達，情以婉而愈深。千載下讀之，猶足令羇旅人望白雲而起思親之念，況當日遠離父母者乎？其用意尤重在「上慎旃哉」一語。親以是祝之子，子以是體夫親。其能以親心爲己心者，又不僅在思親之貌與親之情而已。而可不謂之爲賢乎？\",\"fullText\":\"右《陟岵》三章，章六句。人子行役，登高念親，人情之常。若從正面直寫己之所以念親，縱千言萬語，豈能道得意盡？詩妙從對面設想，思親所以念己之心，與臨行勗己之言，則筆以曲而愈達，情以婉而愈深。千載下讀之，猶足令羇旅人望白雲而起思親之念，況當日遠離父母者乎？其用意尤重在「上慎旃哉」一語。親以是祝之子，子以是體夫親。其能以親心爲己心者，又不僅在思親之貌與親之情而已。而可不謂之爲賢乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」\",\"fullText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/110-zhi-hu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"岵〔《爾雅》〕《釋山》：「多草木，岵。」上猶尚也。無止謂無止于彼而不來也。屺〔《爾雅》〕《釋山》：「無草木，峐。屺同。」無棄謂無棄我而不歸也。必偕謂必與同役者偕，無獨行也。無死較無止、無棄而加切耳。\",\"s
