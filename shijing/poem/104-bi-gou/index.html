erLabel":"全篇总说","targetText":"刺魯桓公不能防閑文姜也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"刺魯桓公不能防閑文姜也。","fullText":"刺魯桓公不能防閑文姜也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。","fullText":"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇 水\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"sourceLabel\":\"第 217-218 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。\",\"fullText\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝，破败。笱，竹制捕鱼笼。梁，鱼梁。鲂鳏，鳊鱼和鲤鱼一类大鱼。齐子，指文姜。归，指齐女归宁。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。鱮，似魴而头大。敝笱在梁，其鱼唯唯。齐子归止，其从如水。唯唯，鱼儿自由自在游动貌，也有不能制之意。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"sourceLabel\":\"第 217-218 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。\",\"fullText\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝，破败。笱，竹制捕鱼笼。梁，鱼梁。鲂鳏，鳊鱼和鲤鱼一类大鱼。齐子，指文姜。归，指齐女归宁。敝笱在梁，其鱼鲂鱮。齐子归止，其 01\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"sourceLabel\":\"第 217-218 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"fullText\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝，破败。笱，竹制捕鱼笼。梁，鱼梁。鲂鳏，鳊鱼和鲤鱼一类大鱼。齐子，指文姜。归，指齐女归宁。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。鱮，似魴而头大。敝笱在梁，其鱼唯唯。齐子归止，其从如水。唯唯，鱼儿自由自在游动貌，也有不能制之意。\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-009:1-4:敝笱在梁\",\"seg-010:1-4:其鱼唯唯\",\"seg-011:1-4:齐子归止\",\"seg-012:1-4:其从如水\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\",\"anchor-6-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"sourceLabel\":\"第 217-218 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"唯唯，鱼儿自由自在游动貌，也有不能制之意。\",\"fullText\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝，破败。笱，竹制捕鱼笼。梁，鱼梁。鲂鳏，鳊鱼和鲤鱼一类大鱼。齐子，指文姜。归，指齐女归宁。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。鱮，似魴而头大。敝笱在梁，其鱼唯唯。齐子归止，其从如水。唯唯，鱼儿自由自在游动貌，也有不能制之意。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-010:3-4:唯唯\"],\"glossAnchorIds\":[\"anchor-7-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺魯桓公不能防閑文姜也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺魯桓公不能防閑文姜也。\",\"fullText\":\"刺魯桓公不能防閑文姜也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。\",\"fullText\":\"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"敝壞也。\",\"fullText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」\",\"fullText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而 唯，言其出入之自如也。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-5\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。\",\"fullText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-6\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"fullText\":\"敝壞也。笱罟也。〔許氏謙曰〕《説文》：「笱，曲竹捕魚。」魴鰥大魚也。〔孔氏穎達曰〕《孔叢子》云：「衛人釣得鰥魚，其大盈車。」是則鰥爲大魚也。歸〔張子曰〕反歸于齊也。鱮〔陸氏璣曰〕鱮，似魴，厚而頭大，魚之不美者。故里語曰：「網魚得鱮，不如㗖茹。」〔陸氏佃曰〕鱮性旅行，故其字從與。亦謂之鰱也。唯唯〔陸氏德明曰〕唯唯，《韓詩》作遺遺，言不能制也。〔輔氏廣曰〕唯唯，言其出入之自如也。\",\"notes\":null, :\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"sourceLabel\":\"第 217-218 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。\",\"fullText\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝，破败。笱，竹制捕鱼笼。梁，鱼梁。鲂鳏，鳊鱼和鲤鱼一类大鱼。齐子，指文姜。归，指齐女归宁。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。鱮，似魴而头大。敝笱在梁，其鱼唯唯。齐子归止，其从如水。唯唯，鱼儿自由自在游动貌，也有不能制之意。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。敝笱在梁，其鱼唯唯。齐子归止，其从如水。\",\"sourceLabel\":\"第 217-218 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。\",\"fullText\":\"这是讽刺齐国文姜的诗。齐人看不惯文姜乱伦的丑行，便写了这首诗。诗中用“如云”“如雨”“如水”三个夸张性的明喻来比文姜侍从人员的众多盛大。敝笱在梁，其鱼鲂鳏。齐子归止，其从如云。敝，破败。笱，竹制捕鱼笼。梁，鱼梁。鲂鳏，鳊鱼和鲤鱼一类大鱼。齐子，指文姜。归，指齐女归宁。敝笱在梁，其鱼鲂鱮。齐子归止，其从如雨。鱮，似魴而头大。敝笱在梁，其鱼唯唯。齐子归止，其从如水。唯唯，鱼儿自由自在游动貌，也有不能制之意。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:敝笱在梁\",\"seg-002:1-4:其鱼鲂鳏\",\"seg-003:1-4:齐子归止\",\"seg-004:1-4:其从如云\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shiji ibutionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺魯桓公不能防閑文姜也。\",\"fullText\":\"刺魯桓公不能防閑文姜也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。\",\"fullText\":\"右《敝笱》三章，章四句。《小序》曰：「刺文姜也。」《大序》謂：「齊人惡魯桓公微弱，不能防閑文姜，使至淫亂，爲二國患。」朱子曰：「桓當作莊。」蓋以文姜如齊多在莊公世，故《集傳》以此詩爲刺莊公不能防閑其母。豈知不能防閑其母之罪小，不能防閑其妻之罪大。且桓公時，文姜已歸齊，致公薨于齊。詩人不於此時刺桓公，豈待其子而後刺乎？姚氏主《序》説而謂「歸」爲「于歸」，則又不可解。詩以敝笱不能制大魚比起，是明明謂魯桓不能制文姜，縱之歸齊而己復從之，以致自戕其生，爲天下笑。若謂「歸」爲「于歸」，則魚方入笱，而何見其爲不能制耶？故知此詩當作於公與夫人如齊之頃而未薨于車之先。曰「其從如雲」、「其從如雨」、「其從如水」，非歎僕從之盛，正以笑公從婦歸甯，故僕從加盛如此其極也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/104-bi-gou/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\
