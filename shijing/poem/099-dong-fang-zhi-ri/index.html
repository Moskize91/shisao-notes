aceText":"发","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-2"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/099-dong-fang-zhi-ri/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。","sourceLabel":"第 209-210 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。","fullText":"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。姝，美女。者子，这人，那个人。诗中是男子对女子的美称。这几句是说，美丽的姑娘，就在我的房室里，她踩着我的脚跟儿来与我相聚。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。闼，门内的小门。这几句是说，美丽的姑娘，来到我的门内，她踩着我的脚迹而离我远去。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/099-dong-fang-zhi-ri/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine" ":\"闼\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-009:1-4:在我闼兮\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"在我闼兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-010:1-4:履我发兮\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"履我发兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-010:3-3:发\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"发\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。\",\"sourceLabel\":\"第 209-210 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。\",\"fullText\":\"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。姝，美女。者子，这人，那个人。诗中是男子对女子的美称。这几句是说，美丽的姑娘，就在我的房室里，她踩着我的脚跟儿来与我相聚。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。闼，门内的小门。这几句是说，美丽的姑娘，来到我的门内，她踩着我的脚迹而离我远去。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。\",\"sourceLabel\":\"第 209-210 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。\",\"fullText\":\"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。姝，美女。者子，这人，那个人。诗中是男子对女子的美称。这几句是说，美丽的姑娘，就在我的房室里，她踩着我的脚跟儿来与我相聚。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。闼，门内的小门。这几句是说，美丽的姑娘，来到我的门内，她踩着我的脚迹而离我远去。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:1-1:履\",\"seg-005:3-3:即\",\"seg-008:3-3:闼\",\"seg-010:3-3:发\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3 ":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺荒淫也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺荒淫也。\",\"fullText\":\"刺荒淫也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《東方之日》二章，章五句。此詩刺淫，必有所指，非泛然也。故孔氏謂「刺哀公」，僞傳、説謂「刺莊公」，何玄子謂「刺襄公」。雖皆無據，而寢闥之内，一任彼姝朝來暮往，則終日昏昏、内作色荒也可知。士庶之家尚且不可，況宫闈乎？此詩之作，詎能無故？然言者雖不可考，而聞者正當以爲戒也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《東方之日》二章，章五句。此詩刺淫，必有所指，非泛然也。故孔氏謂「刺哀公」，僞傳、説謂「刺莊公」，何玄子謂「刺襄公」。雖皆無據，而寢闥之内，一任彼姝朝來暮往，則終日昏昏、内作色荒也可知。士庶之家尚且不可，況宫闈乎？此詩之作，詎能無故？然言者雖不可考，而聞者正當以爲戒也。\",\"fullText\":\"右《東方之日》二章，章五句。此詩刺淫，必有所指，非泛然也。故孔氏謂「刺哀公」，僞傳、説謂「刺莊公」，何玄子謂「刺襄公」。雖皆無據，而寢闥之内，一任彼姝朝來暮往，則終日昏昏、内作色荒也可知。士庶之家尚且不可，況宫闈乎？此詩之作，詎能無故？然言者雖不可考，而聞者正當以爲戒也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\" xi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-008:3-3:闼\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"闼\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-009:1-4:在我闼兮\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"在我闼兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-010:1-4:履我发兮\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"履我发兮\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-010:3-3:发\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"发\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。\",\"sourceLabel\":\"第 209-210 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。\",\"fullText\":\"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。姝，美女。者子，这人，那个人。诗中是男子对女子的美称。这几句是说，美丽的姑娘，就在我的房室里，她踩着我的脚跟儿来与我相聚。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。闼，门内的小门。这几句是说，美丽的姑娘，来到我的门内，她踩着我的脚迹而离我远去。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/099-dong-fang-zhi-ri/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。\",\"sourceLabel\":\"第 209-210 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。\",\"fullText\":\"这是诗人写一个女子追求他的诗。首章写女子在诗人的居室里幽会，第二章写女子来时天色已晚，离去时月已东升。方玉润诗经原始：“曰日，曰月，始而微明，继而将昏，犹曰子惠思我，褰裳涉溱洧之意。呜呼，女诱于男则吉，男悦于女则淫。非齐襄诸公子，孰能为此言？”这是封建卫道者的看法。闻一多风诗类钞：“闻高本汉说，此诗当和诗人写一个女子追求他的诗来理解。”这个理解较近事实。古代男女幽会，诗中多写女子来诗人家中者，如鄘风桑中、陈风东门之池皆是。诗中诗人先是写女子主动到他的家里来，后是写她离去的情况：起初日方出东方，继则月出东方，由朝至暮，可见往来之频，而幽会之久。在《诗经》时代，统治阶级男女的性爱生活比较自由，和后世封建礼法统治之下所谓男女授受不亲者不同。履，踩，踩着。即，借作“膝”，来临。履我即，踩着我的脚跟而来。闼，音挞，内门。发，行去。一说，发是脚迹之假借。履我发，踩着我的脚迹而去。东方之日兮，彼姝者子，在我室兮。在我室兮，履我即兮。姝，美女。者子，这人，那个人。诗中是男子对女子的美称。这几句是说，美丽的姑娘，就在我的房室里，她踩着我的脚跟儿来与我相聚。东方之月兮，彼姝者子，在我闼兮。在我闼兮，履我发兮。闼，门内的小门。这几句是说，美丽的姑娘，来到我的门内，她踩着我的脚迹而离我远去。\",\"notes\":null,\"par
