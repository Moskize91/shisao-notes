10,"surfaceText":"雪","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-10"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-011:1-4:心之憂矣","segmentId":"seg-011","segmentOrder":11,"surfaceText":"心之憂矣","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-8","fangyurun-yuanshi:0007-1:part-2"],"materialIds":["chengjunying-jiangjianyuan-zhuxi","fangyurun-yuanshi"]},{"id":"seg-012:1-4:於我歸説","segmentId":"seg-012","segmentOrder":12,"surfaceText":"於我歸説","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-8","fangyurun-yuanshi:0007-1:part-2"],"materialIds":["chengjunying-jiangjianyuan-zhuxi","fangyurun-yuanshi"]},{"id":"seg-012:4-4:説","segmentId":"seg-012","segmentOrder":12,"surfaceText":"説","charStart":4,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-10"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。","sourceLabel":"第 331-332 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给读者，是没有一定把握的，因为相同的景物可以引起不同的情感。即如这首诗，毛序的理解与我们的理解便明显不同。朱熹《诗集传》：“此诗盖以时人有玩细娱而忘远虑者，故以蜉蝣为比而刺之。”他将兴句解释为比，当然是错的，但他对这两句喻意的理解，则提供了第三种解释。前人有“诗无达诂”之说，在某种意义上也可以说是“兴无达诂”。钟嵘《诗品序》云：“文已尽而意有馀，兴也；……若专用比兴，患在意深，意深则词踬。”便是说兴意的难解。","fullText":"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给读者，是没有一定把握的，因为相同的景物可以引起不同的情感。即如这首诗，毛序的理解与我们的理解便明显不同。朱熹《诗集传》：“此诗盖以时人有玩细娱而忘远虑者，故以蜉蝣为比而刺之。”他将兴句解释为比，当然是错的，但他对这两句喻意的理解，则提供了第三种解释。前人有“诗无达诂”之说，在某种意义上也可以说是“兴无达诂”。钟嵘《诗品序》云：“文已尽而意有馀，兴也；……若专用比兴，患在意深，意深则词踬。”便是说兴意的难解。蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣，古作浮游，叠韵，小昆虫名。形似天牛而小，翅薄而透明，在空中飞舞，但朝生而暮死，生命极短促。楚楚，鲜明貌。这里是形容蜉蝣的羽翼。三家诗楚作憔，说文：“憔，会五采鲜貌。”这是本字，楚是假借字。于，即“与”。归处，指死去。与《葛生》篇“归于其居”“归于其室”同义。下章的“归息”“归说”也是此意。马瑞辰《通释》：“于之言与也，凡相于者，犹相与也，如孟子‘麒麟之于走兽’之类，于，即与也。忧哉！忧之于我归处，以言我将与蜉蝣同归也。”韵读：鱼部一一羽、楚、处。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。采采，犹萋萋，华丽貌。《尔雅·释训》：“萋萋众多，谓文采之众多也。”韵读：之部一一翼、服、息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。掘，穿。三家诗掘作掘。说文：“掘，突也。”突与穿义近。閲，通“穴”。宋玉《风赋》“空穴来风”，庄子作“空阅来风”。掘閲，穿穴。据陆玑《诗草木鸟兽虫鱼疏》，蜉蝣的幼虫在阴雨中穿穴而出地面，变为成虫。麻衣，指蜉蝣的羽翼。这是借代的手法。如雪，形容蜉蝣羽翼的鲜洁。韵读：祭部一一閲、雪、説。","notes":"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。","sourceLabel":"第 331-332 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。","fullText":"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣， 我歸説\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:4-4:説\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"説\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给读者，是没有一定把握的，因为相同的景物可以引起不同的情感。即如这首诗，毛序的理解与我们的理解便明显不同。朱熹《诗集传》：“此诗盖以时人有玩细娱而忘远虑者，故以蜉蝣为比而刺之。”他将兴句解释为比，当然是错的，但他对这两句喻意的理解，则提供了第三种解释。前人有“诗无达诂”之说，在某种意义上也可以说是“兴无达诂”。钟嵘《诗品序》云：“文已尽而意有馀，兴也；……若专用比兴，患在意深，意深则词踬。”便是说兴意的难解。\",\"fullText\":\"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给读者，是没有一定把握的，因为相同的景物可以引起不同的情感。即如这首诗，毛序的理解与我们的理解便明显不同。朱熹《诗集传》：“此诗盖以时人有玩细娱而忘远虑者，故以蜉蝣为比而刺之。”他将兴句解释为比，当然是错的，但他对这两句喻意的理解，则提供了第三种解释。前人有“诗无达诂”之说，在某种意义上也可以说是“兴无达诂”。钟嵘《诗品序》云：“文已尽而意有馀，兴也；……若专用比兴，患在意深，意深则词踬。”便是说兴意的难解。蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣，古作浮游，叠韵，小昆虫名。形似天牛而小，翅薄而透明，在空中飞舞，但朝生而暮死，生命极短促。楚楚，鲜明貌。这里是形容蜉蝣的羽翼。三家诗楚作憔，说文：“憔，会五采鲜貌。”这是本字，楚是假借字。于，即“与”。归处，指死去。与《葛生》篇“归于其居”“归于其室”同义。下章的“归息”“归说”也是此意。马瑞辰《通释》：“于之言与也，凡相于者，犹相与也，如孟子‘麒麟之于走兽’之类，于，即与也。忧哉！忧之于我归处，以言我将与蜉蝣同归也。”韵读：鱼部一一羽、楚、处。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。采采，犹萋萋，华丽貌。《尔雅·释训》：“萋萋众多，谓文采之众多也。”韵读：之部一一翼、服、息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。掘，穿。三家诗掘作掘。说文：“掘，突也。”突与穿义近。閲，通“穴”。宋玉《风赋》“空穴来风”，庄子作“空阅来风”。掘閲，穿穴。据陆玑《诗草木鸟兽虫鱼疏》，蜉蝣的幼虫在阴雨中穿穴而出地面，变为成虫。麻衣，指蜉蝣的羽翼。这是借代的手法。如雪，形容蜉蝣羽翼的鲜洁。韵读：祭部一一閲、雪、説。\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。\",\"fullText\":\"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给 n-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：祭部一一閲、雪、説。\",\"fullText\":\"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给读者，是没有一定把握的，因为相同的景物可以引起不同的情感。即如这首诗，毛序的理解与我们的理解便明显不同。朱熹《诗集传》：“此诗盖以时人有玩细娱而忘远虑者，故以蜉蝣为比而刺之。”他将兴句解释为比，当然是错的，但他对这两句喻意的理解，则提供了第三种解释。前人有“诗无达诂”之说，在某种意义上也可以说是“兴无达诂”。钟嵘《诗品序》云：“文已尽而意有馀，兴也；……若专用比兴，患在意深，意深则词踬。”便是说兴意的难解。蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣，古作浮游，叠韵，小昆虫名。形似天牛而小，翅薄而透明，在空中飞舞，但朝生而暮死，生命极短促。楚楚，鲜明貌。这里是形容蜉蝣的羽翼。三家诗楚作憔，说文：“憔，会五采鲜貌。”这是本字，楚是假借字。于，即“与”。归处，指死去。与《葛生》篇“归于其居”“归于其室”同义。下章的“归息”“归说”也是此意。马瑞辰《通释》：“于之言与也，凡相于者，犹相与也，如孟子‘麒麟之于走兽’之类，于，即与也。忧哉！忧之于我归处，以言我将与蜉蝣同归也。”韵读：鱼部一一羽、楚、处。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。采采，犹萋萋，华丽貌。《尔雅·释训》：“萋萋众多，谓文采之众多也。”韵读：之部一一翼、服、息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。掘，穿。三家诗掘作掘。说文：“掘，突也。”突与穿义近。閲，通“穴”。宋玉《风赋》“空穴来风”，庄子作“空阅来风”。掘閲，穿穴。据陆玑《诗草木鸟兽虫鱼疏》，蜉蝣的幼虫在阴雨中穿穴而出地面，变为成虫。麻衣，指蜉蝣的羽翼。这是借代的手法。如雪，形容蜉蝣羽翼的鲜洁。韵读：祭部一一閲、雪、説。\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":10,\"anchorIds\":[\"seg-009:4-4:閲\",\"seg-010:4-4:雪\",\"seg-012:4-4:説\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\",\"anchor-10-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蜉蝣㊟未詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"蜉蝣㊟未詳。\",\"fullText\":\"蜉蝣㊟未詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蜉蝣》三章，章四句。《序》謂「刺奢也」，《集傳》改爲「時人有玩細娱而忘遠慮者」，均於詩旨未當。蓋蜉蝣爲物，其細已甚，何奢之有？取以爲比，大不相類。天下刺奢之物甚多，詩人豈獨有取於掘土而出、朝生暮死之微蟲耶？即以爲「玩細娱而忘遠慮」，亦視乎其人之所關輕重爲何如耳。若國君，則所係匪輕，小民又何足爲重？但曰「時人」，詩豈必存？曹既無徵，難以臆測，闕之可也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《蜉蝣》三章，章四句。《序》謂「刺奢也」，《集傳》改爲「時人有玩細娱而忘遠慮者」，均於詩旨未當。蓋蜉蝣爲物，其細已甚，何奢之有？取以爲比，大不相類。天下刺奢之物甚多，詩人豈獨有取於掘土而出、朝生暮死之微蟲耶？即以爲「玩細娱而忘遠慮」，亦視乎其人之所關輕重爲何如耳。若國君，則所係匪輕，小民又何足爲重？但曰「時人」，詩豈必存？曹既無徵，難以臆測，闕之可也。\",\"fullText\":\"右《蜉蝣》三章，章四句。《序》謂「刺奢也」，《集傳》改爲「時人有玩細娱而忘遠慮者」，均於詩旨未當。蓋蜉蝣爲物，其細已甚，何奢之有？取以爲比，大不相類。天下刺奢之物甚多，詩人豈獨有取於掘土而出、朝生暮死之微蟲耶？即以爲「玩細娱而忘遠慮」，亦視乎其人之所關輕重爲何如耳。若國君，則所係匪輕，小民又何足爲重？但曰「時人」，詩豈必存？曹既無徵，難以臆測，闕之可也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋蜉蝣〔《集傳》〕蜉蝣，渠略也，似蛣蜣，身狹而長，有角，黄黑色，朝生暮死。〔陸氏璣曰〕蜉蝣，方土語也，通謂之渠略。似甲蟲，有角，大如指，長三四寸，甲下有翅能飛，夏月陰雨時地中出。楚楚，鮮明而整齊貌。采采，華飾也。掘閲〔朱氏鬱儀曰〕《管子》云：「掘閲得玉。」閲、穴，字通也。麻衣〔鄭氏康成曰〕深衣也。〔姚氏際恒曰〕古禮服、喪服，布皆是麻，未有木棉也。吉凶唯以升數爲别。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋蜉蝣〔《集傳》〕蜉蝣，渠略也，似蛣蜣，身狹而長，有角，黄黑色，朝生暮死。〔陸氏璣曰〕蜉蝣，方土語也，通謂之渠略。似甲蟲，有角，大如指，長三四寸，甲下有翅能飛，夏月陰雨時地中出。楚楚，鮮明而整齊貌。采采，華飾也。掘閲〔朱氏鬱儀曰〕《管子》云：「掘閲得玉。」閲、穴，字通也。麻衣〔鄭氏康成曰〕深衣也。〔姚氏際恒曰〕古禮服、喪服，布皆是麻，未有木棉也。吉凶唯以升數爲别。\",\"fullText\":\"集釋蜉蝣〔《集傳》〕蜉蝣，渠略也，似蛣蜣，身狹而長，有角，黄黑色，朝生暮死。〔陸氏璣曰〕蜉蝣，方土語也，通謂之渠略。似甲蟲，有角，大如指，長三四寸，甲下有翅能飛，夏月陰雨時地中出。楚楚，鮮明而整齊貌。采采，華飾也。掘閲〔朱氏鬱儀曰〕《管子》云：「掘閲得玉。」閲、穴，字通也。麻衣〔鄭氏康成曰〕深衣也。〔姚氏際恒曰〕古禮服、喪服，布皆是麻，未有木棉也。吉凶唯以升數爲别。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻羽七麌。楚六語。處同。通韻。翼十三職。服一屋，叶蒲北反。息職。閲九屑。雪、説並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻羽七麌。楚六語。處同。通韻。翼十三職。服一屋，叶蒲北反。息職。閲九屑。雪、説並同。本韻。\",\"fullText\":\"標韻羽七麌。楚六語。處同。通韻。翼十三職。服一屋，叶蒲北反。息職。閲九屑。雪、説並同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正文\",\"excerpt\":\"蜉蝣之羽，衣裳楚楚。\",\"fullText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:蜉蝣之羽\",\"seg-002:1-4:衣裳楚楚\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"seg 蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首叹息人生短促的诗。蜉蝣有“衣裳楚楚”“采采衣服”的华丽外表，但朝生而暮死。诗人用它比喻人生虽然可爱，其实是很短促的。毛序：“蜉蝣，刺奢也。昭公国小而迫，无法以自守，好奢而任小人，将无所依焉。”毛序是将“衣裳楚楚”“采采衣服”等解释为比喻曹昭公的奢侈。方玉润驳曰：“盖蜉蝣为物，其细已甚，何奢之有？取以为比，大不相类。天下刺奢之物甚多，诗人岂独有取于掘土而出、朝生暮死之微虫耶？”从方氏之说我们可以看出，毛序是将诗的兴意理解错了。蜉蝣的朝生暮死好似人们的“生年不满百”，都逃不出死亡的归宿，所以诗人感到忧伤。至于这是没落贵族的哀叹，还是知识分子的感慨，没有明确的史料依据，也难以臆断。《困学记闻》引李仲蒙对《诗经》兴法的解释云：“触物以起情谓之兴，物动情也。”这种解释是比较确切的。触物起情，或者说触景生情，这是作者的心理活动。这种心理活动的信息能否通过兴句准确地传达给读者，是没有一定把握的，因为相同的景物可以引起不同的情感。即如这首诗，毛序的理解与我们的理解便明显不同。朱熹《诗集传》：“此诗盖以时人有玩细娱而忘远虑者，故以蜉蝣为比而刺之。”他将兴句解释为比，当然是错的，但他对这两句喻意的理解，则提供了第三种解释。前人有“诗无达诂”之说，在某种意义上也可以说是“兴无达诂”。钟嵘《诗品序》云：“文已尽而意有馀，兴也；……若专用比兴，患在意深，意深则词踬。”便是说兴意的难解。\",\"fullText\":\"$22\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。\",\"fullText\":\"$23\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:蜉蝣之羽\",\"seg-002:1-4:衣裳楚楚\",\"seg-003:1-4:心之憂矣\",\"seg-004:1-4:於我歸處\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蜉蝣，古作浮游，叠韵，小昆虫名。形似天牛而小，翅薄而透明，在空中飞舞，但朝生而暮死，生命极短促。楚楚，鲜明貌。这里是形容蜉蝣的羽翼。三家诗楚作憔，说文：“憔，会五采鲜貌。”这是本字，楚是假借字。于，即“与”。归处，指死去。与《葛生》篇“归于其居”“归于其室”同义。下章的“归息”“归说”也是此意。马瑞辰《通释》：“于之言与也，凡相于者，犹相与也，如孟子‘麒麟之于走兽’之类，于，即与也。忧哉！忧之于我归处，以言我将与蜉蝣同归也。”\",\"fullText\":\"$24\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":3,\"anchorIds\":[\"seg-001:1-2:蜉蝣\",\"seg-002:3-4:楚楚\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：鱼部一一羽、楚、处。\",\"fullText\":\"$25\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":4,\"anchorIds\":[\"seg-001:4-4:羽\",\"seg-002:4-4:楚\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蜉蝣之翼，采采衣服。心之憂矣，於我歸息。\",\"fullText\":\"$26\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":5,\"anchorIds\":[\"seg-005:1-4:蜉蝣之翼\",\"seg-006:1-4:采采衣服\",\"seg-007:1-4:心之憂矣\",\"seg-008:1-4:於我歸息\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\",\"anchor-5-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"采采，犹萋萋，华丽貌。《尔雅·释训》：“萋萋众多，谓文采之众多也。”\",\"fullText\":\"$27\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":6,\"anchorIds\":[\"seg-006:1-2:采采\"],\"glossAnchorIds\":[\"anchor-6-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：之部一一翼、服、息。\",\"fullText\":\"$28\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":7,\"anchorIds\":[\"seg-005:4-4:翼\",\"seg-006:4-4:服\",\"seg-008:4-4:息\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"fullText\":\"$29\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":8,\"anchorIds\":[\"seg-009:1-4:蜉蝣掘閲\",\"seg-010:1-4:麻衣如雪\",\"seg-011:1-4:心之憂矣\",\"seg-012:1-4:於我歸説\"],\"glossAnchorIds\":[\"anchor-8-1\",\"anchor-8-2\",\"anchor-8-3\",\"anchor-8-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"掘，穿。三家诗掘作掘。说文：“掘，突也。”突与穿义近。閲，通“穴”。宋玉《风赋》“空穴来风”，庄子作“空阅来风”。掘閲，穿穴。据陆玑《诗草木鸟兽虫鱼疏》，蜉蝣的幼虫在阴雨中穿穴而出地面，变为成虫。麻衣，指蜉蝣的羽翼。这是借代的手法。如雪，形容蜉蝣羽翼的鲜洁。\",\"fullText\":\"$2a\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":9,\"anchorIds\":[\"seg-009:3-4:掘閲\",\"seg-010:1-2:麻衣\",\"seg-010:3-4:如雪\"],\"glossAnchorIds\":[\"anchor-9-1\",\"anchor-9-2\",\"anchor-9-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蜉蝣之羽，衣裳楚楚。心之憂矣，於我歸處。蜉蝣之翼，采采衣服。心之憂矣，於我歸息。蜉蝣掘閲，麻衣如雪。心之憂矣，於我歸説。\",\"sourceLabel\":\"第 331-332 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：祭部一一閲、雪、説。\",\"fullText\":\"$2b\",\"notes\":\"据 PDF 331-332 页文字层与页文互校整理；剔除了后续《候人》内容，并将“蜉蝣”“掘閲”“歸説”等字按原诗与释文校正。\",\"partOrder\":10,\"anchorIds\":[\"seg-009:4-4:閲\",\"seg-010:4-4:雪\",\"seg-012:4-4:説\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\",\"anchor-10-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蜉蝣㊟未詳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"蜉蝣㊟未詳。\",\"fullText\":\"蜉蝣㊟未詳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蜉蝣》三章，章四句。《序》謂「刺奢也」，《集傳》改爲「時人有玩細娱而忘遠慮者」，均於詩旨未當。蓋蜉蝣爲物，其細已甚，何奢之有？取以爲比，大不相類。天下刺奢之物甚多，詩人豈獨有取於掘土而出、朝生暮死之微蟲耶？即以爲「玩細娱而忘遠慮」，亦視乎其人之所關輕重爲何如耳。若國君，則所係匪輕，小民又何足爲重？但曰「時人」，詩豈必存？曹既無徵，難以臆測，闕之可也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《蜉蝣》三章，章四句。《序》謂「刺奢也」，《集傳》改爲「時人有玩細娱而忘遠慮者」，均於詩旨未當。蓋蜉蝣爲物，其細已甚，何奢之有？取以爲比，大不相類。天下刺奢之物甚多，詩人豈獨有取於掘土而出、朝生暮死之微蟲耶？即以爲「玩細娱而忘遠慮」，亦視乎其人之所關輕重爲何如耳。若國君，則所係匪輕，小民又何足爲重？但曰「時人」，詩豈必存？曹既無徵，難以臆測，闕之可也。\",\"fullText\":\"右《蜉蝣》三章，章四句。《序》謂「刺奢也」，《集傳》改爲「時人有玩細娱而忘遠慮者」，均於詩旨未當。蓋蜉蝣爲物，其細已甚，何奢之有？取以爲比，大不相類。天下刺奢之物甚多，詩人豈獨有取於掘土而出、朝生暮死之微蟲耶？即以爲「玩細娱而忘遠慮」，亦視乎其人之所關輕重爲何如耳。若國君，則所係匪輕，小民又何足爲重？但曰「時人」，詩豈必存？曹既無徵，難以臆測，闕之可也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋蜉蝣〔《集傳》〕蜉蝣，渠略也，似蛣蜣，身狹而長，有角，黄黑色，朝生暮死。〔陸氏璣曰〕蜉蝣，方土語也，通謂之渠略。似甲蟲，有角，大如指，長三四寸，甲下有翅能飛，夏月陰雨時地中出。楚楚，鮮明而整齊貌。采采，華飾也。掘閲〔朱氏鬱儀曰〕《管子》云：「掘閲得玉。」閲、穴，字通也。麻衣〔鄭氏康成曰〕深衣也。〔姚氏際恒曰〕古禮服、喪服，布皆是麻，未有木棉也。吉凶唯以升數爲别。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋蜉蝣〔《集傳》〕蜉蝣，渠略也，似蛣蜣，身狹而長，有角，黄黑色，朝生暮死。〔陸氏璣曰〕蜉蝣，方土語也，通謂之渠略。似甲蟲，有角，大如指，長三四寸，甲下有翅能飛，夏月陰雨時地中出。楚楚，鮮明而整齊貌。采采，華飾也。掘閲〔朱氏鬱儀曰〕《管子》云：「掘閲得玉。」閲、穴，字通也。麻衣〔鄭氏康成曰〕深衣也。〔姚氏際恒曰〕古禮服、喪服，布皆是麻，未有木棉也。吉凶唯以升數爲别。\",\"fullText\":\"集釋蜉蝣〔《集傳》〕蜉蝣，渠略也，似蛣蜣，身狹而長，有角，黄黑色，朝生暮死。〔陸氏璣曰〕蜉蝣，方土語也，通謂之渠略。似甲蟲，有角，大如指，長三四寸，甲下有翅能飛，夏月陰雨時地中出。楚楚，鮮明而整齊貌。采采，華飾也。掘閲〔朱氏鬱儀曰〕《管子》云：「掘閲得玉。」閲、穴，字通也。麻衣〔鄭氏康成曰〕深衣也。〔姚氏際恒曰〕古禮服、喪服，布皆是麻，未有木棉也。吉凶唯以升數爲别。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/150-fu-you/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻羽七麌。楚六語。處同。通韻。翼十三職。服一屋，叶蒲北反。息職。閲九屑。雪、説並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻羽七麌。楚六語。處同。通韻。翼十三職。服一屋，叶蒲北反。息職。閲九屑。雪、説並同。本韻。\",\"fullText\":\"標韻羽七麌。楚六語。處同。通韻。翼十三職。服一屋，叶蒲北反。息職。閲九屑。雪、説並同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":
