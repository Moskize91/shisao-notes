0001","glossId":"0001-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"山有扶苏，隰有荷华。不见子都，乃见狂且。山有乔松，隰有游龙。不见子充，乃见狡童。","sourceLabel":"第 186-187 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。","fullText":"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。山有乔松，隰有游龙。不见子充，乃见狡童。乔，桥的假借字。陆德明经典释文：“本亦作桥。王肃云：高也。”游，本义为施旗之流，说文段注：“旗之游如水之流，故得称流也。”引申为放纵。这里形容笼草枝叶舒展貌。龙，宠的假借字。又名红草、水红，今名狗尾巴花，生水旁，叶长大。子充，人名。王先谦诗三家义集疏：“子充，良人也。”这里用子充代表好人。狡童，狡猾的青年。方玉润诗经原始：“狡童，狡狯小儿也。”韵读：东部一一松、龙、充、童。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"山有扶苏，隰有荷华。不见子都，乃见狂且。山有乔松，隰有游龙。不见子充，乃见狡童。","sourceLabel":"第 186-187 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。","fullText":"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。山有乔松，隰有游龙。不见子充，乃见狡童。乔，桥的假借字。陆德明经典释文：“本亦作桥。王肃云：高也。”游，本义为施旗之流，说文段注：“旗之游如水之流，故得称流也。”引申为放纵。这里形容笼草枝叶舒展貌。龙，宠的假借字。又名红草、水红，今名狗尾巴花，生水旁，叶长大。子充，人名。王先谦诗三家义集疏：“子充，良人也。”这里用子充代表好人。狡童，狡猾的青年。方玉润诗经原始：“狡童，狡狯小儿也。”韵读：东部一一松、龙、充、童。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-4:山有扶苏","seg-002:1-4:隰有荷华","seg-003:1-4:不见子都","seg-004:1-4:乃见狂且"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publica 隰有游龍。不見子充，乃見狡童。","fullText":"山有扶蘇，隰有荷華。不見子都，乃見狂且。山有橋松，隰有游龍。不見子充，乃見狡童。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"刺世美非所美也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"刺世美非所美也。","fullText":"刺世美非所美也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。","fullText":"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。","fullText":"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"标韵","excerpt":"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。","fullText":"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"maruichen-tongshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/084-shan-you-fu-su/maruichen-tongshi/0001-1","materialId":"maruichen-tongshi","materialTitle":"毛詩傳箋通釋","contributorLine":"清 · 馬瑞辰","publicationYear":1989,"layer":"span","layerLabel":"诗句片段","targetText":" nnotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有扶苏，隰有荷华。不见子都，乃见狂且。山有乔松，隰有游龙。不见子充，乃见狡童。\",\"sourceLabel\":\"第 186-187 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。\",\"fullText\":\"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。山有乔松，隰有游龙。不见子充，乃见狡童。乔，桥的假借字。陆德明经典释文：“本亦作桥。王肃云：高也。”游，本义为施旗之流，说文段注：“旗之游如水之流，故得称流也。”引申为放纵。这里形容笼草枝叶舒展貌。龙，宠的假借字。又名红草、水红，今名狗尾巴花，生水旁，叶长大。子充，人名。王先谦诗三家义集疏：“子充，良人也。”这里用子充代表好人。狡童，狡猾的青年。方玉润诗经原始：“狡童，狡狯小儿也。”韵读：东部一一松、龙、充、童。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有扶苏，隰有荷华。不见子都，乃见狂且。山有乔松，隰有游龙。不见子充，乃见狡童。\",\"sourceLabel\":\"第 186-187 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。\",\"fullText\":\"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。山有乔松，隰有游龙。不见子充，乃见狡童。乔，桥的假借字。陆德明经典释文：“本亦作桥。王肃云：高也。”游，本义为施旗之流，说文段注：“旗之游如水之流，故得称流也。”引申为放纵。这里形容笼草枝叶舒展貌。龙，宠的假借字。又名红草、水红，今名狗尾巴花，生水旁，叶长大。子充，人名。王先谦诗三家义集疏：“子充，良人也。”这里用子充代表好人。狡童，狡猾的青年。方玉润诗经原始：“狡童，狡狯小儿也。”韵读：东部一一松、龙、充、童。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:山有扶苏\",\"seg-002:1-4:隰有荷华\",\"seg-003:1-4:不见子都\",\"seg-004:1-4:乃见狂且\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\ n-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有扶蘇，隰有荷華。不見子都，乃見狂且。山有橋松，隰有游龍。不見子充，乃見狡童。\",\"sourceLabel\":\"第 98 页\",\"attributionLabel\":\"陳奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"山有扶蘇，隰有荷華。不見子都，乃見狂且。山有橋松，隰有游龍。不見子充，乃見狡童。\",\"fullText\":\"山有扶蘇，隰有荷華。不見子都，乃見狂且。山有橋松，隰有游龍。不見子充，乃見狡童。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺世美非所美也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺世美非所美也。\",\"fullText\":\"刺世美非所美也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。\",\"fullText\":\"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。\",\"fullText\":\"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。\",\"fullText\":\"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有橋松\",\"sourceLabel\":\"第 212 页\",\"attributionLabel\":\"馬瑞辰\",\"sectionLabel\":\"釋文\",\"excerpt\":\"山有橋松，釋文：「橋，本作喬。」\",\"fullText\":\"山有橋松，釋文：「橋，本作喬。」\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:1-4:山有橋松\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-005\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"此蓋女子悔婚之詩。或女子期其所愛者不至，而轉遇所惡之人，因作此詩。\",\"sourceLabel\":\"第 101 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"此蓋女子悔婚之詩。或女子期其所愛者不至，而轉遇所惡之人，因作此詩。\",\"fullText\":\"此蓋女子悔婚之詩。或女子期其所愛者不至，而轉遇所惡之人，因作此詩。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\ entOrder\":7,\"surfaceText\":\"不见子充\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"wangli-yundu\"]},{\"id\":\"seg-007:3-4:子充\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"子充\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0007-1:part-2\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-007:4-4:充\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"充\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0007-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-008:1-4:乃见狡童\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"乃见狡童\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"wangli-yundu:0002-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"wangli-yundu\"]},{\"id\":\"seg-008:3-4:狡童\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"狡童\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0008-1:part-1\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-008:4-4:童\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"童\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0008-1:part-1\",\"quwanli-quanshi:0008-1:part-2\"],\"materialIds\":[\"quwanli-quanshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有扶苏，隰有荷华。不见子都，乃见狂且。山有乔松，隰有游龙。不见子充，乃见狡童。\",\"sourceLabel\":\"第 186-187 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。\",\"fullText\":\"这是写一位女子找不到如意郎君而发牢骚的诗，也有人说是女子对情人的俏骂。毛序：“刺忽也。所美非美然。”其附会与上篇同，所以姚际恒批评它“皆影响之辞”。但姚氏又说：“集传以序之不足服人也于是起而全叛之，以为淫诗，则更妄矣。”朱熹认为这是“淫女戏其所私者”的诗，本是颇通达的见解，而姚氏坚决反对说是“淫诗”，则反映了相当大一部分清代学者的治学偏见。对这种偏见，崔述《读风偶识》分析道：“至于同车、扶苏、狡童、褰裳、蔓草、溱洧之属，明明男女媒合之词，岂得复别为说以曲解之！若不问其词，不问其意，而但横一必无淫诗之念于胸中，其于说诗岂有当哉！”崔述的批评是非常中肯的。诗中的子都、子充都并非实有其人，而只是美男子、好人儿的代词。这种以特称代总名的借代修辞，比只用抽象词汇的表达法生动多了。山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两句是兴，诗人以山上大树和隰地荷花各得其所，反比自己得不到如意的对象。毛传：“言高下大小各得其宜也。”下章同。子都，古代著名的美男子。孟子告子：“至于子都，天下莫不知其姣也。”这里以子都代表标准的美男子。狂且（jū），疯狂愚蠢的人。马瑞辰通释：“且当为但字之省借……狂且，谓狂行拙钝之人。”毛传：“狂，狂人也。且，辞也。”闻一多风诗类钞释“且”为“者”，狂且即狂者。按以上三说均可通。韵读：鱼部一一苏、华（音乎）、都、且。山有乔松，隰有游龙。不见子充，乃见狡童。乔，桥的假借字。陆德明经典释文：“本亦作桥。王肃云：高也。”游，本义为施旗之流，说文段注：“旗之游如水之流，故得称流也。”引申为放纵。这里形容笼草枝叶舒展貌。龙，宠的假借字。又名红草、水红，今名狗尾巴花，生水旁，叶长大。子充，人名。王先谦诗三家义集疏：“子充，良人也。”这里用子充代表好人。狡童，狡猾的青年。方玉润诗经原始：“狡童，狡狯小儿也。”韵读：东部一一松、龙、充、童。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"山有扶苏，隰有荷华。不见子都，乃见狂且。山有乔松，隰有游龙。不见子充，乃见狡童。\",\"sourceLabel\":\"第 186-187 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"山有扶苏，隰有荷华。不见子都，乃见狂且。扶苏，亦作扶疏，大树枝叶茂盛分披貌。段玉裁说文解字注：“扶疏谓大木枝柯四布，疏通作疏，亦作苏。”隰，低洼的湿地。荷华，即荷花。按这两 [],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺世美非所美也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺世美非所美也。\",\"fullText\":\"刺世美非所美也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。\",\"fullText\":\"右《山有扶蘇》二章，章四句。《小序》謂「刺忽」，無據。《大序》謂「所美非美然」，庶幾近之。然不必定指忽也。夫天下妍媸莫辨，是非顛倒，以至覆家亡國，而自殺其身者，亦豈尠哉？詩人不過泛言流弊，舉以爲戒，故藉草木起興，以見山之高固有扶蘇，亦有橋松；隰之卑固有荷華，亦有游龍。大小互見，美惡雜陳。要在采之者辨之而已。子都、子充之美，與狡童、狂且，較其妍媸，宜若易辨也。然有時亦見狡童、狂且爲美而不見子都、子充之美者，則何以故？是非混則妍媸莫辨耳。有天下國家責者，尤當三復而細咏之。此亦目前至理，勿容穿鑿而附會者。《序》固謬執涉於附會，然猶未至如《集傳》直以爲「淫女戲其所私」者之猥褻不堪也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。\",\"fullText\":\"扶蘇《毛傳》謂小木，非也。蓋枝葉扶蘇乃茂木耳。子都〔季氏本曰〕子都，古之美男子，借以爲喻。狂醜惡人也。且語辭。橋松〔《集傳》〕上竦無枝曰橋，亦作喬。游龍〔張子曰〕龍是葒草，其枝幹樛屈，著土處便有根，如龍也。《本草》云：葒草，一名鴻䕵，如馬蓼而大，即水紅也。子充〔董氏逌曰〕子充，不見於書，疑亦以美著也。狡童狡獪小兒也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。\",\"fullText\":\"蘇七虞。華六麻，叶芳無反。都七虞。且六魚。叶韻。松二冬。龍同。充一東。童同。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/084-shan-you-fu-su/m
