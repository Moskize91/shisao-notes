{"id":"wangli-yundu","title":"詩經韻讀","contributorLine":"现代 · 王力","publicationYear":1980,"glossCount":2,"partCount":2},{"id":"quwanli-quanshi","title":"詩經詮釋","contributorLine":"现代 · 屈萬里","publicationYear":1983,"glossCount":9,"partCount":9},{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"maruichen-tongshi","title":"毛詩傳箋通釋","contributorLine":"清 · 馬瑞辰","publicationYear":1989,"glossCount":1,"partCount":1},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":6,"glossCount":18,"anchoredPartCount":1,"overviewPartCount":3},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","quwanli-quanshi:0001-1:part-1"]},"focusAnchors":[{"id":"seg-012:1-4:德音不忘","segmentId":"seg-012","segmentOrder":12,"surfaceText":"德音不忘","charStart":1,"charEnd":4,"entryIds":["maruichen-tongshi:0001-1:part-1"],"materialIds":["maruichen-tongshi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/083-you-nv-tong-che/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。","sourceLabel":"第 184-186 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首贵族男女的恋歌。诗人看中的那位姑娘不但容貌美丽，更难得的是品德好，内心美。这和关雎的君子追求窈窕淑女一样，兼取女子的品行和容貌两方面。与氓、谷风中的男子重色不重德、色衰则爱弛的坏作风不可同日而语。毛序：“刺忽也。郑人刺忽之不昏于齐。”认为是讽刺郑昭公忽拒绝齐侯想把女儿文姜嫁给他的要求，失去与大国联姻的机会，卒致孤立无援，被强臣所逐。此事虽见左传，但从诗中看不出同忽有什么联系。前人谓“孟姜”即齐文姜，齐侯的长女，但邶风桑中有“美孟姜矣”之句，显然不是指文姜，其实“孟姜”只不过是一种泛称，犹今人称美人为西子。又有人觉得文姜是个淫荡的女子，与诗中“德音不忘”的赞扬不符，于是解释道：“齐女未必实贤实长，假言其贤长以美之。”（孔颖达毛诗正义）种种曲说，总为囿于毛序的附会。\n孙矿批评诗经云：“状妇女总不外容饰二字，此诗艳丽则以同车翱翔等字点注得妙。”容饰是描写静态的美，而“同车翱翔”则是描写动态。把人的活动和人的形态作有机的结合，刻画一个朱颜婉雅、德音不忘的完整形象。其中尤以“翱翔”二字下得妙。姚际恒云：“以其下车而行，始闻其佩玉之声，故以‘将翱将翔’先之，善于摹神者。‘翱翔’字从羽……此则借以言美人，亦如羽族之翱翔也。神女赋‘婉若游龙，乘云翔’，洛神赋‘若将飞而未翔’，又‘翩若惊鸿’，又‘体迅飞凫’，又‘或翔神渚’，皆从此脱出。”他道出了这句诗的艺术效果及后人对这种手法的继承。\n有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。\n舜，鲁诗作蕣，是正字。木槿，落叶灌木，开淡紫或红色花。今名牵牛花（见王夫之诗经稗疏）。\n华，同“花”。\n闻一多风诗类钞：“蕣华赤色，‘颜如蕣华’，谓朱颜也。”\n将翱将翔，此处指两人下车出游。翱翔形容女子步履轻盈貌。\n琼琚，佩玉名。毛传：“琼，玉也。琚，佩玉名。”\n孟姜，犹言姜家大姑娘。孟是妇女排行的字。按孟姜不一定是齐姓姑娘的实称，泛言美人为孟姜。\n都，娴雅大方。都是婥（duō）的假借字。说文：“婥，富婉婥也貌。从女卓。”陈奂传疏：“婥合二字会意。富，张也。卓，大也。富婉婥，言容貌之美大也。”\n韵读：鱼部——车、华（音呼）、琚、都。阳部——翔、姜。\n有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\n行（háng），道路。\n英，毛传：“英犹花也。”\n将将，锵锵的假借字，鲁诗作锵锵，是俗字。走路时佩玉相击的声音，摹声词。说文：“锵，玉声也。”\n德音，好声誉。\n不忘，王引之经义述闻：“不忘，犹言德音不已。”朱熹诗集传：“德音不忘，言其实也。”\n韵读：阳部——行（音杭）、英（音央）、翔、将、姜、忘。","fullText":"这是一首贵族男女的恋歌。诗人看中的那位姑娘不但容貌美丽，更难得的是品德好，内心美。这和关雎的君子追求窈窕淑女一样，兼取女子的品行和容貌两方面。与氓、谷风中的男子重色不重德、色衰则爱弛的坏作风不可同日而语。毛序：“刺忽也。郑人刺忽之不昏于齐。”认为是讽刺郑昭公忽拒绝齐侯想把女儿文姜嫁给他的要求，失去与大国联姻的机会，卒致孤立无援，被强臣所逐。此事虽见左传，但从诗中看不出同忽有什么联系。前人谓“孟姜”即齐文姜，齐侯的长女，但邶风桑中有“美孟姜矣”之句，显然不是指文姜，其实“孟姜”只不过是一种泛称，犹今人称美人为西子。又有人觉得文姜是个淫荡的女子，与诗中“德音不忘”的赞扬不符，于是解释道：“齐女未必实贤实长，假言其贤长以美之。”（孔颖达毛诗正义）种种曲说，总为囿于毛序的附会。\n孙矿批评诗经云：“状妇女总不外容饰二字，此诗艳丽则以同车翱翔等字点注得妙。”容饰是描写静态的美，而“同车翱翔”则是描写动态。把人的活动和人的形态作有机的结合，刻画一个朱颜婉雅、德音不忘的完整形象。其中尤以“翱翔”二字下得妙。姚际恒云：“以其下车而行，始闻其佩玉之声，故以‘将翱将翔’先之，善于摹神者。‘翱翔’字从羽……此则借以言美人，亦如羽族之翱翔也。神女赋‘婉若游龙，乘云翔’，洛神赋‘若将飞而未翔’，又‘翩若惊鸿’，又‘体迅飞凫’，又‘或翔神渚’，皆从此脱出。”他道出了这句诗的艺术效果及后人对这种手法的继承。\n有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。\n舜，鲁诗作蕣，是正字。木槿，落叶灌木，开淡紫或红色花。今名牵牛花（见王夫之诗经稗疏）。\n华，同“花”。\n闻一多风诗类钞：“蕣华赤色，‘颜如蕣华’，谓朱颜也。”\n将翱将翔，此处指两人下车出游。翱翔形容女子步履轻盈貌。\n琼琚，佩玉名。毛传：“琼，玉也。琚，佩玉名。”\n孟姜，犹言姜家大姑娘。孟是妇女排行的字。按孟姜不一定是齐姓姑娘的实称，泛言美人为孟姜。\n都，娴雅大方。都是婥（duō）的假借字。说文：“婥，富婉婥也貌。从女卓。”陈奂传疏：“婥合二字会意。富，张也。卓，大也。富婉婥，言容貌之美大也。”\n韵读：鱼部——车、华（音呼）、琚、都。阳部——翔、姜。\n有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\n行（háng），道路。\n英，毛传：“英犹花也。”\n将将，锵锵的假借字，鲁诗作锵锵，是俗字。走路时佩玉相击的声音，摹声词。说文：“锵，玉声也。”\n德音，好声誉。\n不忘，王引之经义述闻：“不忘，犹言德音不已。”朱熹诗集传：“德音不忘，言其实也。”\n韵读：阳部——行（音杭）、英（音央）、翔、将、姜、忘。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/083-you-nv-tong-che/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。","sourceLabel":"第 95 页","attributionLabel":"陳奂","sectionLabel":"经文","excerpt":"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。","fullText":"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"諷鄭太子忽以昏齊也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"諷鄭太子忽以昏齊也。","fullText":"諷鄭太子忽以昏齊也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？","fullText":"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎 du:0002-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"德\",\"anchorIds\":[\"seg-012:1-4:德音不忘\"]},{\"index\":2,\"text\":\"音\",\"anchorIds\":[\"seg-012:1-4:德音不忘\"]},{\"index\":3,\"text\":\"不\",\"anchorIds\":[\"seg-012:1-4:德音不忘\"]},{\"index\":4,\"text\":\"忘\",\"anchorIds\":[\"seg-012:1-4:德音不忘\"]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":2,\"partCount\":2},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":9,\"partCount\":9},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"maruichen-tongshi\",\"title\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":18,\"anchoredPartCount\":1,\"overviewPartCount\":3},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-012:1-4:德音不忘\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"德音不忘\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\",\"sourceLabel\":\"第 184-186 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首贵族男女的恋歌。诗人看中的那位姑娘不但容貌美丽，更难得的是品德好，内心美。这和关雎的君子追求窈窕淑女一样，兼取女子的品行和容貌两方面。与氓、谷风中的男子重色不重德、色衰则爱弛的坏作风不可同日而语。毛序：“刺忽也。郑人刺忽之不昏于齐。”认为是讽刺郑昭公忽拒绝齐侯想把女儿文姜嫁给他的要求，失去与大国联姻的机会，卒致孤立无援，被强臣所逐。此事虽见左传，但从诗中看不出同忽有什么联系。前人谓“孟姜”即齐文姜，齐侯的长女，但邶风桑中有“美孟姜矣”之句，显然不是指文姜，其实“孟姜”只不过是一种泛称，犹今人称美人为西子。又有人觉得文姜是个淫荡的女子，与诗中“德音不忘”的赞扬不符，于是解释道：“齐女未必实贤实长，假言其贤长以美之。”（孔颖达毛诗正义）种种曲说，总为囿于毛序的附会。\\n孙矿批评诗经云：“状妇女总不外容饰二字，此诗艳丽则以同车翱翔等字点注得妙。”容饰是描写静态的美，而“同车翱翔”则是描写动态。把人的活动和人的形态作有机的结合，刻画一个朱颜婉雅、德音不忘的完整形象。其中尤以“翱翔”二字下得妙。姚际恒云：“以其下车而行，始闻其佩玉之声，故以‘将翱将翔’先之，善于摹神者。‘翱翔’字从羽……此则借以言美人，亦如羽族之翱翔也。神女赋‘婉若游龙，乘云翔’，洛神赋‘若将飞而未翔’，又‘翩若惊鸿’，又‘体迅飞凫’，又‘或翔神渚’，皆从此脱出。”他道出了这句诗的艺术效果及后人对这种手法的继承。\\n有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。\\n舜，鲁诗作蕣，是正字。木槿，落叶灌木，开淡紫或红色花。今名牵牛花（见王夫之诗经稗疏）。\\n华，同“花”。\\n闻一多风诗类钞：“蕣华赤色，‘颜如蕣华’，谓朱颜也。”\\n将翱将翔，此处指两人下车出游。翱翔形容女子步履轻盈貌。\\n琼琚，佩玉名。毛传：“琼，玉也。琚，佩玉名。”\\n孟姜，犹言姜家大姑娘。孟是妇女排行的字。按孟姜不一定是齐姓姑娘的实称，泛言美人为孟姜。\\n都，娴雅大方。都是婥（duō）的假借字。说文：“婥，富婉婥也貌。从女卓。”陈奂传疏：“婥合二字会意。富，张也。卓，大也。富婉婥，言容貌之美大也。”\\n韵读：鱼部——车、华（音呼）、琚、都。阳部——翔、姜。\\n有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\\n行（háng），道路。\\n英，毛传：“英犹花也。”\\n将将，锵锵的假借字，鲁诗作锵锵，是俗字。走路时佩玉相击的声音，摹声词。说文：“锵，玉声也。”\\n德音，好声誉。\\n不忘，王引之经义述闻：“不忘，犹言德音不已。”朱熹诗集传：“德音不忘，言其实也。”\\n韵读：阳部——行（音杭）、英（音央）、翔、将、姜、忘。\",\"fullText\":\"这是一首贵族男女的恋歌。诗人看中的那位姑娘不但容貌美丽，更难得的是品德好，内心美。这和关雎的君子追求窈窕淑女一样，兼取女子的品行和容貌两方面。与氓、谷风中的男子重色不重德、色衰则爱弛的坏作风不可同日而语。毛序：“刺忽也。郑人刺忽之不昏于齐。”认为是讽刺郑昭公忽拒绝齐侯想把女儿文姜嫁给他的要求，失去与大国联姻的机会，卒致孤立无援，被强臣所逐。此事虽见左传，但从诗中看不出同忽有什么联系。前人谓“孟姜”即齐文姜，齐侯的长女，但邶风桑中有“美孟姜矣”之句，显然不是指文姜，其实“孟姜”只不过是一种泛称，犹今人称美人为西子。又有人觉得文姜是个淫荡的女子，与诗中“德音不忘”的赞扬不符，于是解释道：“齐女未必实贤实长，假言其贤长以美之。”（孔颖达毛诗正义）种种曲说，总为囿于毛序的附会。\\n孙矿批评诗经云：“状妇女总不外容饰二字，此诗艳丽则以同车翱翔等字点注得妙。”容饰是描写静态的美，而“同车翱翔”则是描写动态。把人的活动和人的形态作有机的结合，刻画一个朱颜婉雅、德音不忘的完整形象。其中尤以“翱翔”二字下得妙。姚际恒云：“以其下车而行，始闻其佩玉之声，故以‘将翱将翔’先之，善于摹神者。‘翱翔’字从羽……此则借以言美人，亦如羽族之翱翔也。神女赋‘婉若游龙，乘云翔’，洛神赋‘若将飞而未翔’，又‘翩若惊鸿’，又‘体迅飞凫’，又‘或翔神渚’，皆从此脱出。”他道出了这句诗的艺术效果及后人对这种手法的继承。\\n有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。\\n舜，鲁诗作蕣，是正字。木槿，落叶灌木，开淡紫或红色花。今名牵牛花（见王夫之诗经稗疏）。\\n华，同“花”。\\n闻一多风诗类钞：“蕣华赤色，‘颜如蕣华’，谓朱颜也。”\\n将翱将翔，此处指两人下车出游。翱翔形容女子步履轻盈貌。\\n琼琚，佩玉名。毛传：“琼，玉也。琚，佩玉名。”\\n孟姜，犹言姜家大姑娘。孟是妇女排行的字。按孟姜不一定是齐姓姑娘的实称，泛言美人为孟姜。\\n都，娴雅大方。都是婥（duō）的假借字。说文：“婥，富婉婥也貌。从女卓。”陈奂传疏：“婥合二字会意。富，张也。卓，大也。富婉婥，言容貌之美大也。”\\n韵读：鱼部——车、华（音呼）、琚、都。阳部——翔、姜。\\n有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\\n行（háng），道路。\\n英，毛传：“英犹花也。”\\n将将，锵锵的假借字，鲁诗作锵锵，是俗字。走路时佩玉相击的声音，摹声词。说文：“锵，玉声也。”\\n德音，好声誉。\\n不忘，王引之经义述闻：“不忘，犹言德音不已。”朱熹诗集传：“德音不忘，言其实也。”\\n韵读：阳部——行（音杭）、英（音央）、翔、将、姜、忘。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。\",\"sourceLabel\":\"第 95 页\",\"attributionLabel\":\"陳奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。\",\"fullText\":\"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"諷鄭太子忽以昏齊也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"諷鄭太子忽以昏齊也。\",\"fullText\":\"諷鄭太子忽以昏齊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？\",\"fullText\":\"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」\",\"fullText\":\"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"車六魚。華六麻，叶芳無反。琚六魚。都七虞。叶韻。行七陽。英八庚。翔、將、姜、忘並七陽。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"車六魚。華六麻，叶芳無反。琚六魚。都七虞。叶韻。行七陽。英八庚。翔、將、姜、忘並七陽。通韻。\",\"fullText\":\"車六魚。華六麻，叶芳無反。琚六魚。都七虞。叶韻。行七陽。英八庚。翔、將、姜、忘並七陽。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\" em/083-you-nv-tong-che/#webpage\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/083-you-nv-tong-che/\",\"name\":\"有女同車 · 逐字注脚阅读\",\"description\":\"風 · 鄭風 · 汇聚 6 种资料、18 条注脚的《有女同車》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/083-you-nv-tong-che/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/083-you-nv-tong-che/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tc8f,"])</script><script>self.__next_f.push([1,"这是一首贵族男女的恋歌。诗人看中的那位姑娘不但容貌美丽，更难得的是品德好，内心美。这和关雎的君子追求窈窕淑女一样，兼取女子的品行和容貌两方面。与氓、谷风中的男子重色不重德、色衰则爱弛的坏作风不可同日而语。毛序：“刺忽也。郑人刺忽之不昏于齐。”认为是讽刺郑昭公忽拒绝齐侯想把女儿文姜嫁给他的要求，失去与大国联姻的机会，卒致孤立无援，被强臣所逐。此事虽见左传，但从诗中看不出同忽有什么联系。前人谓“孟姜”即齐文姜，齐侯的长女，但邶风桑中有“美孟姜矣”之句，显然不是指文姜，其实“孟姜”只不过是一种泛称，犹今人称美人为西子。又有人觉得文姜是个淫荡的女子，与诗中“德音不忘”的赞扬不符，于是解释道：“齐女未必实贤实长，假言其贤长以美之。”（孔颖达毛诗正义）种种曲说，总为囿于毛序的附会。\n孙矿批评诗经云：“状妇女总不外容饰二字，此诗艳丽则以同车翱翔等字点注得妙。”容饰是描写静态的美，而“同车翱翔”则是描写动态。把人的活动和人的形态作有机的结合，刻画一个朱颜婉雅、德音不忘的完整形象。其中尤以“翱翔”二字下得妙。姚际恒云：“以其下车而行，始闻其佩玉之声，故以‘将翱将翔’先之，善于摹神者。‘翱翔’字从羽……此则借以言美人，亦如羽族之翱翔也。神女赋‘婉若游龙，乘云翔’，洛神赋‘若将飞而未翔’，又‘翩若惊鸿’，又‘体迅飞凫’，又‘或翔神渚’，皆从此脱出。”他道出了这句诗的艺术效果及后人对这种手法的继承。\n有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。\n舜，鲁诗作蕣，是正字。木槿，落叶灌木，开淡紫或红色花。今名牵牛花（见王夫之诗经稗疏）。\n华，同“花”。\n闻一多风诗类钞：“蕣华赤色，‘颜如蕣华’，谓朱颜也。”\n将翱将翔，此处指两人下车出游。翱翔形容女子步履轻盈貌。\n琼琚，佩玉名。毛传：“琼，玉也。琚，佩玉名。”\n孟姜，犹言姜家大姑娘。孟是妇女排行的字。按孟姜不一定是齐姓姑娘的实称，泛言美人为孟姜。\n都，娴雅大方。都是婥（duō）的假借字。说文：“婥，富婉婥也貌。从女卓。”陈奂传疏：“婥合二字会意。富，张也。卓，大也。富婉婥，言容貌之美大也。”\n韵读：鱼部——车、华（音呼）、琚、都。阳部——翔、姜。\n有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\n行（háng），道路。\n英，毛传：“英犹花也。”\n将将，锵锵的假借字，鲁诗作锵锵，是俗字。走路时佩玉相击的声音，摹声词。说文：“锵，玉声也。”\n德音，好声誉。\n不忘，王引之经义述闻：“不忘，犹言德音不已。”朱熹诗集传：“德音不忘，言其实也。”\n韵读：阳部——行（音杭）、英（音央）、翔、将、姜、忘。"])</script><script>self.__next_f.push([1,"23:Tc8f,"])</script><script>self.__next_f.push([1,"这是一首贵族男女的恋歌。诗人看中的那位姑娘不但容貌美丽，更难得的是品德好，内心美。这和关雎的君子追求窈窕淑女一样，兼取女子的品行和容 i/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有女同车，颜如舜华。将翱将翔，佩玉琼琚。彼美孟姜，洵美且都。有女同行，颜如舜英。将翱将翔，佩玉将将。彼美孟姜，德音不忘。\",\"sourceLabel\":\"第 184-186 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"$22\",\"fullText\":\"$23\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。\",\"sourceLabel\":\"第 95 页\",\"attributionLabel\":\"陳奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。\",\"fullText\":\"有女同車，顏如舜華。將翺將翔，佩玉瓊琚。彼美孟姜，洵美且都。有女同行，顏如舜英。將翺將翔，佩玉將將。彼美孟姜，德音不忘。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"諷鄭太子忽以昏齊也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"諷鄭太子忽以昏齊也。\",\"fullText\":\"諷鄭太子忽以昏齊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？\",\"fullText\":\"右《有女同車》二章，章六句。《小序》謂「刺忽也」。衍之者曰：「忽不昏於齊，後以無大國之援而見逐，故國人刺之。」《辯説》以爲「忽之辭昏，未爲不正，至其失國，以勢孤援弱，亦未有可刺之罪也」，故《集傳》又疑爲淫奔之詩。夫曰「同車」則有御輪之禮，曰「佩玉」則有矩步之節，曰「孟姜」則本齊族之貴，淫奔而越國，有若是之威儀盛飾昭彰耳目乎？前人駁之固已甚詳。且曰「德音不忘」，是豈淫奔之謂？又不待辯而自明矣。然則此詩謂何？曰：諷忽以昏齊，非刺忽以不昏齊也。曰：有辨乎？曰：有。刺忽以昏於齊者，從事後論之也；諷忽以宜昏於齊者，事前勸之也。事後論忽，固是勢孤援弱，以至失國，似不昏於齊者，爲忽失計。迨後文姜淫亂，幾覆魯國，則不昏於齊者，又未嘗不爲忽幸。事前勸忽，則不過爲援助計。是彼美孟姜者，又安知其後之淫亂如是乎？故首章言其「美且都」，次章言其「德音不忘」，蓋欲諷忽以速娶之耳。後世李延年歌於漢武帝曰：「北方有佳人，絶世而獨立。一顧傾人城，再顧傾人國。豈不知傾城與傾國？佳人難再得。」亦是此意。然忽已辭昏而詩仍存者，一爲忽惜，一爲忽幸，而終以忽之辭昏爲有見也。而又何刺乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」\",\"fullText\":\"女同車或謂同車爲親迎，又謂侄娣之從嫁者，皆非。無論同車非親迎禮，忽已辭昏，又何從嫁之有？此當是初議昏時，齊必盛飾數女以炫忽。詩人即所見以咏之而已。舜〔陸氏璣曰〕舜，一名木槿，一名櫬，一名椴，齊、魯之間謂之王蒸。五月始華，故《月令》：仲夏，木槿榮。孟姜指文姜也。同車雖數女，而以文姜爲主，故特著之。都〔孔氏穎達曰〕都者，美好閑習之言。司馬相如《上林賦》云：「妖冶閑都。」\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/083-you-nv-tong-che/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"車六魚。華六麻，叶芳無反。琚六魚。都七虞。叶韻。行七陽。英八庚。翔、將、姜、忘並七陽。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"車六魚。華六麻，叶芳無反。琚六魚。都七虞。叶韻。行七陽。英八庚。翔、將、姜、忘並七陽。通韻。\",\"fullText\":\"車六魚。華六麻，叶芳無反。琚六魚。都七虞。叶韻。行七陽。英八庚。翔、將、姜、忘並七陽。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":
