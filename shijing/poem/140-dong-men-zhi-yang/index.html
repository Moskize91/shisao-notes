Text":"明星晳晳","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5","fangyurun-yuanshi:0007-1:part-2"],"materialIds":["chengjunying-jiangjianyuan-zhuxi","fangyurun-yuanshi"]},{"id":"seg-008:3-3:晳","segmentId":"seg-008","segmentOrder":8,"surfaceText":"晳","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-008:3-4:晳晳","segmentId":"seg-008","segmentOrder":8,"surfaceText":"晳晳","charStart":3,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/140-dong-men-zhi-yang/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"東門之楊，其葉牂牂。昏以為期，明星煌煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。","sourceLabel":"第 313-315 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。","fullText":"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。東門之楊，其葉牂牂。昏以為期，明星煌煌。牂牂，枝叶茂盛貌。齐诗作将将，当是将的假借字。昏，黄昏。期，约会。明星，指启明星。煌煌，明亮貌。韵读：阳部一一杨、牂、煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。肺肺，枝叶茂盛貌。按肺是芾的假借字。晳晳，犹煌煌也，此处借指星光。韵读：祭部一一肺、晳。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/140-dong-men-zhi-yang/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"東門之楊，其葉牂牂。昏以為期，明星煌煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。","sourceLabel":"第 313-315 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"東門之楊，其葉牂牂。昏以為期，明星煌煌。","fullText":"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。東門之楊，其葉牂牂。昏以為期，明星煌煌。牂牂，枝叶茂盛貌。齐诗作将将，当是将的假借字。昏，黄昏。期，约会。明星，指启明星。煌煌，明亮貌。韵读：阳部一一杨、牂、煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。肺肺，枝叶茂盛貌。按肺是芾的假借字。晳晳，犹煌煌也，此处借指星光。韵读：祭部一一肺、晳。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-4:東門之楊","seg-002:1-4:其葉牂牂","seg-003:1-4:昏以為期","seg-004:1-4:明星煌煌"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/140-dong-men-zhi-yang/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine" xi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"東門之楊，其葉牂牂。昏以為期，明星煌煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。\",\"sourceLabel\":\"第 313-315 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。\",\"fullText\":\"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。東門之楊，其葉牂牂。昏以為期，明星煌煌。牂牂，枝叶茂盛貌。齐诗作将将，当是将的假借字。昏，黄昏。期，约会。明星，指启明星。煌煌，明亮貌。韵读：阳部一一杨、牂、煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。肺肺，枝叶茂盛貌。按肺是芾的假借字。晳晳，犹煌煌也，此处借指星光。韵读：祭部一一肺、晳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/140-dong-men-zhi-yang/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"東門之楊，其葉牂牂。昏以為期，明星煌煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。\",\"sourceLabel\":\"第 313-315 页\",\"attri ntId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"晳晳\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/140-dong-men-zhi-yang/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"東門之楊，其葉牂牂。昏以為期，明星煌煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。\",\"sourceLabel\":\"第 313-315 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。\",\"fullText\":\"这是写男女约会久候不至的诗。毛序：“东门之杨，刺时也。昏姻失时，男女多违。亲迎，女犹有不至者也。”但诗中看不出爽约的是男子还是女子，何以见得一定是亲迎而女不至呢？朱熹对毛序略加改造地说：“此亦男女期会而有负约不至者，故因其所见以起兴也。”这样解释就比较圆通了。也有人认为这是“朋友之间负约不至”，“不必为男女期会”。所论当然也不能说错，不过我们看欧阳修《生查子》“去年元夜时，花市灯如昼。月上柳梢头，人约黄昏后。今年元夜时，月与灯依旧。不见去年人，泪湿春衫袖。”词中亦无一字涉及男女，但又有谁解释为朋友爽约，又有谁怀疑这写的不是男女恋情呢？《东门之杨》所表现的情调虽不及《生查子》那样明显，但还是能够体会得出的。解释为男女约会而久候不至并不至离题太远。此诗以写景为主，前二句写所约之地，后二句写所约之时，借景物烘托感情，表现出一种焦急不安的心理。启明星闪烁着，长夜将尽，可是约好黄昏来的情人却连影儿都不见。“明星煌煌”、“明星晳晳”二句正是很自然地映衬出这种感情。東門之楊，其葉牂牂。昏以為期，明星煌煌。牂牂，枝叶茂盛貌。齐诗作将将，当是将的假借字。昏，黄昏。期，约会。明星，指启明星。煌煌，明亮貌。韵读：阳部一一杨、牂、煌。東門之楊，其葉肺肺。昏以為期，明星晳晳。肺肺，枝叶茂盛貌。按肺是芾的假借字。晳晳，犹煌煌也，此处借指星光。韵读：祭部一一肺、晳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\
