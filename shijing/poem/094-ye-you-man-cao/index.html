Ids":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1"],"characters":[{"index":1,"text":"婉","anchorIds":[]},{"index":2,"text":"如","anchorIds":[]},{"index":3,"text":"清","anchorIds":[]},{"index":4,"text":"扬","anchorIds":[]}]},{"id":"seg-011","order":11,"text":"邂逅相遇","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","fangyurun-yuanshi:0003-1:part-1"],"characters":[{"index":1,"text":"邂","anchorIds":["seg-011:1-2:邂逅"]},{"index":2,"text":"逅","anchorIds":["seg-011:1-2:邂逅"]},{"index":3,"text":"相","anchorIds":[]},{"index":4,"text":"遇","anchorIds":[]}]},{"id":"seg-012","order":12,"text":"与子偕臧","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1"],"characters":[{"index":1,"text":"与","anchorIds":[]},{"index":2,"text":"子","anchorIds":[]},{"index":3,"text":"偕","anchorIds":[]},{"index":4,"text":"臧","anchorIds":[]}]}]},"materials":[{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":2,"glossCount":5,"anchoredPartCount":1,"overviewPartCount":4},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","fangyurun-yuanshi:0003-1:part-1","fangyurun-yuanshi:0004-1:part-1"]},"focusAnchors":[{"id":"seg-005:1-2:邂逅","segmentId":"seg-005","segmentOrder":5,"surfaceText":"邂逅","charStart":1,"charEnd":2,"entryIds":["fangyurun-yuanshi:0003-1:part-1"],"materialIds":["fangyurun-yuanshi"]},{"id":"seg-011:1-2:邂逅","segmentId":"seg-011","segmentOrder":11,"surfaceText":"邂逅","charStart":1,"charEnd":2,"entryIds":["fangyurun-yuanshi:0003-1:part-1"],"materialIds":["fangyurun-yuanshi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/094-ye-you-man-cao/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。","sourceLabel":"第 200-201 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首恋歌。毛传：“野有蔓草，思遇时也。君之泽不下流，民穷于兵革。男女失时，思不期而会焉。”郑笺：“蔓草而有露，谓仲春之月，草始生，霜为露也。周礼：仲春之月，令会男女之无夫家者。”毛、郑的话说出了诗的产生时间和背景。春秋时候战争频繁，人口稀少。统治者为了蕃育人口，规定超龄的男女还未结婚的，允许在仲春时候自由相会，自由同居。风诗中许多首诗都反映这一情况。欧阳修《诗本义》：“男女婚聚失时，邂逅相遇于田野间。”说得很确切。方玉润说这是朋友相期会的诗，王先谦说是思遇贤人的诗，但诗中“有美一人，清扬婉兮”的描写显然是针对一位美丽的女子，方、王之说均不合诗意。“野有蔓草，零露溥兮”两句是兼赋的兴句，它勾勒出一派春草青青、露水晶莹的良辰美景。紧接着“有美一人，清扬婉兮”两句，则使我们仿佛看见一位漂亮的姑娘正在秋波一转地微笑。四句诗俨然一幅春日丽人图，真可以说是诗中有画。野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。蔓，本义为葛属，此处是“曼”的假借字，蔓延。零，落下。溥（tuán），与团通。阮元校勘记：“溥本又作团。”文选李善注引诗作团。露多貌。毛传：“溥溥然盛多也。”按这二句是诗人叙述他们相会的时间和地点，用以起兴。朱熹诗集传：“男女相遇于田野草露之间，故赋其所在以起兴。”清扬，眉目清秀。见《君子偕老》注。按这一词汇在诗经中屡见，可能是当时的习语。婉，妩媚貌。毛传：“眉目之间婉然美也。”邂逅，本字作解逅，双声。碰巧相遇，不期而会。适，符合、适合，有“如愿以偿”之意。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。瀼（ráng），露浓貌。如，与“而”同。婉如即婉而。臧，善。偕臧，都满意。朱熹诗集传：“偕臧，言各得其所欲也。”","fullText":"这是一首恋歌。毛传：“野有蔓草，思遇时也。君之泽不下流，民穷于兵革。男女失时，思不期而会焉。”郑笺：“蔓草而有露，谓仲春之月，草始生，霜为露也。周礼：仲春之月，令会男女之无夫家者。”毛、郑的话说出了诗的产生时间和背景。春秋时候战争频繁，人口稀少。统治者为了蕃育人口，规定超龄的男女还未结婚的，允许在仲春时候自由相会，自由同居。风诗中许多首诗都反映这一情况。欧阳修《诗本义》：“男女婚聚失时，邂逅相遇于田野间。”说得很确切。方玉润说这是朋友相期会的诗，王先谦说是思遇贤人的诗，但诗中“有美一人，清扬婉兮”的描写显然是针对一位美丽的女子，方、王之说均不合诗意。“野有蔓草，零露溥兮”两句是兼赋的兴句，它勾勒出一派春草青青、露水晶莹的良辰美景。紧接着“有美一人，清扬婉兮”两句，则使我们仿佛看见一位漂亮的姑娘正在秋波一转地微笑。四句诗俨然一幅春日丽人图，真可以说是诗中有画。野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。蔓，本义为葛属，此处是“曼”的假借字，蔓延。零，落下。溥（tuán），与团通。阮元校勘记：“溥本又作团。”文选李善注引诗作团。露多貌。毛传：“溥溥然盛多也。”按这二句是诗人叙述他们相会的时间和地点，用以起兴。朱熹诗集传：“男女相遇于田野草露之间，故赋其所在以起兴。”清扬，眉目清秀。见《君子偕老》注。按这一词汇在诗经中屡见，可能是当时的习语。婉，妩媚貌。毛传：“眉目之间婉然美也。”邂逅，本字作解逅，双声。碰巧相遇，不期而会。适，符合、适合，有“如愿以偿”之意。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。瀼（ráng），露浓貌。如，与“而”同。婉如即婉而。臧，善。偕臧，都满意。朱熹诗集传：“偕臧，言各得其所欲也。”","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"朋友相期會也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"朋友相期會也。","fullText":"朋友相期會也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？","fullText":"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言 蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首恋歌。毛传：“野有蔓草，思遇时也。君之泽不下流，民穷于兵革。男女失时，思不期而会焉。”郑笺：“蔓草而有露，谓仲春之月，草始生，霜为露也。周礼：仲春之月，令会男女之无夫家者。”毛、郑的话说出了诗的产生时间和背景。春秋时候战争频繁，人口稀少。统治者为了蕃育人口，规定超龄的男女还未结婚的，允许在仲春时候自由相会，自由同居。风诗中许多首诗都反映这一情况。欧阳修《诗本义》：“男女婚聚失时，邂逅相遇于田野间。”说得很确切。方玉润说这是朋友相期会的诗，王先谦说是思遇贤人的诗，但诗中“有美一人，清扬婉兮”的描写显然是针对一位美丽的女子，方、王之说均不合诗意。“野有蔓草，零露溥兮”两句是兼赋的兴句，它勾勒出一派春草青青、露水晶莹的良辰美景。紧接着“有美一人，清扬婉兮”两句，则使我们仿佛看见一位漂亮的姑娘正在秋波一转地微笑。四句诗俨然一幅春日丽人图，真可以说是诗中有画。野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。蔓，本义为葛属，此处是“曼”的假借字，蔓延。零，落下。溥（tuán），与团通。阮元校勘记：“溥本又作团。”文选李善注引诗作团。露多貌。毛传：“溥溥然盛多也。”按这二句是诗人叙述他们相会的时间和地点，用以起兴。朱熹诗集传：“男女相遇于田野草露之间，故赋其所在以起兴。”清扬，眉目清秀。见《君子偕老》注。按这一词汇在诗经中屡见，可能是当时的习语。婉，妩媚貌。毛传：“眉目之间婉然美也。”邂逅，本字作解逅，双声。碰巧相遇，不期而会。适，符合、适合，有“如愿以偿”之意。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。瀼（ráng），露浓貌。如，与“而”同。婉如即婉而。臧，善。偕臧，都满意。朱熹诗集传：“偕臧，言各得其所欲也。”\",\"fullText\":\"这是一首恋歌。毛传：“野有蔓草，思遇时也。君之泽不下流，民穷于兵革。男女失时，思不期而会焉。”郑笺：“蔓草而有露，谓仲春之月，草始生，霜为露也。周礼：仲春之月，令会男女之无夫家者。”毛、郑的话说出了诗的产生时间和背景。春秋时候战争频繁，人口稀少。统治者为了蕃育人口，规定超龄的男女还未结婚的，允许在仲春时候自由相会，自由同居。风诗中许多首诗都反映这一情况。欧阳修《诗本义》：“男女婚聚失时，邂逅相遇于田野间。”说得很确切。方玉润说这是朋友相期会的诗，王先谦说是思遇贤人的诗，但诗中“有美一人，清扬婉兮”的描写显然是针对一位美丽的女子，方、王之说均不合诗意。“野有蔓草，零露溥兮”两句是兼赋的兴句，它勾勒出一派春草青青、露水晶莹的良辰美景。紧接着“有美一人，清扬婉兮”两句，则使我们仿佛看见一位漂亮的姑娘正在秋波一转地微笑。四句诗俨然一幅春日丽人图，真可以说是诗中有画。野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。蔓，本义为葛属，此处是“曼”的假借字，蔓延。零，落下。溥（tuán），与团通。阮元校勘记：“溥本又作团。”文选李善注引诗作团。露多貌。毛传：“溥溥然盛多也。”按这二句是诗人叙述他们相会的时间和地点，用以起兴。朱熹诗集传：“男女相遇于田野草露之间，故赋其所在以起兴。”清扬，眉目清秀。见《君子偕老》注。按这一词汇在诗经中屡见，可能是当时的习语。婉，妩媚貌。毛传：“眉目之间婉然美也。”邂逅，本字作解逅，双声。碰巧相遇，不期而会。适，符合、适合，有“如愿以偿”之意。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。瀼（ráng），露浓貌。如，与“而”同。婉如即婉而。臧，善。偕臧，都满意。朱熹诗集传：“偕臧，言各得其所欲也。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"朋友相期會也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"朋友相期會也。\",\"fullText\":\"朋友相期會也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？\",\"fullText\":\"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？\",\"notes\":null,\"partOrder\":1 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。\",\"sourceLabel\":\"第 200-201 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首恋歌。毛传：“野有蔓草，思遇时也。君之泽不下流，民穷于兵革。男女失时，思不期而会焉。”郑笺：“蔓草而有露，谓仲春之月，草始生，霜为露也。周礼：仲春之月，令会男女之无夫家者。”毛、郑的话说出了诗的产生时间和背景。春秋时候战争频繁，人口稀少。统治者为了蕃育人口，规定超龄的男女还未结婚的，允许在仲春时候自由相会，自由同居。风诗中许多首诗都反映这一情况。欧阳修《诗本义》：“男女婚聚失时，邂逅相遇于田野间。”说得很确切。方玉润说这是朋友相期会的诗，王先谦说是思遇贤人的诗，但诗中“有美一人，清扬婉兮”的描写显然是针对一位美丽的女子，方、王之说均不合诗意。“野有蔓草，零露溥兮”两句是兼赋的兴句，它勾勒出一派春草青青、露水晶莹的良辰美景。紧接着“有美一人，清扬婉兮”两句，则使我们仿佛看见一位漂亮的姑娘正在秋波一转地微笑。四句诗俨然一幅春日丽人图，真可以说是诗中有画。野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。蔓，本义为葛属，此处是“曼”的假借字，蔓延。零，落下。溥（tuán），与团通。阮元校勘记：“溥本又作团。”文选李善注引诗作团。露多貌。毛传：“溥溥然盛多也。”按这二句是诗人叙述他们相会的时间和地点，用以起兴。朱熹诗集传：“男女相遇于田野草露之间，故赋其所在以起兴。”清扬，眉目清秀。见《君子偕老》注。按这一词汇在诗经中屡见，可能是当时的习语。婉，妩媚貌。毛传：“眉目之间婉然美也。”邂逅，本字作解逅，双声。碰巧相遇，不期而会。适，符合、适合，有“如愿以偿”之意。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。瀼（ráng），露浓貌。如，与“而”同。婉如即婉而。臧，善。偕臧，都满意。朱熹诗集传：“偕臧，言各得其所欲也。”\",\"fullText\":\"这是一首恋歌。毛传：“野有蔓草，思遇时也。君之泽不下流，民穷于兵革。男女失时，思不期而会焉。”郑笺：“蔓草而有露，谓仲春之月，草始生，霜为露也。周礼：仲春之月，令会男女之无夫家者。”毛、郑的话说出了诗的产生时间和背景。春秋时候战争频繁，人口稀少。统治者为了蕃育人口，规定超龄的男女还未结婚的，允许在仲春时候自由相会，自由同居。风诗中许多首诗都反映这一情况。欧阳修《诗本义》：“男女婚聚失时，邂逅相遇于田野间。”说得很确切。方玉润说这是朋友相期会的诗，王先谦说是思遇贤人的诗，但诗中“有美一人，清扬婉兮”的描写显然是针对一位美丽的女子，方、王之说均不合诗意。“野有蔓草，零露溥兮”两句是兼赋的兴句，它勾勒出一派春草青青、露水晶莹的良辰美景。紧接着“有美一人，清扬婉兮”两句，则使我们仿佛看见一位漂亮的姑娘正在秋波一转地微笑。四句诗俨然一幅春日丽人图，真可以说是诗中有画。野有蔓草，零露溥兮。有美一人，清扬婉兮。邂逅相遇，适我愿兮。蔓，本义为葛属，此处是“曼”的假借字，蔓延。零，落下。溥（tuán），与团通。阮元校勘记：“溥本又作团。”文选李善注引诗作团。露多貌。毛传：“溥溥然盛多也。”按这二句是诗人叙述他们相会的时间和地点，用以起兴。朱熹诗集传：“男女相遇于田野草露之间，故赋其所在以起兴。”清扬，眉目清秀。见《君子偕老》注。按这一词汇在诗经中屡见，可能是当时的习语。婉，妩媚貌。毛传：“眉目之间婉然美也。”邂逅，本字作解逅，双声。碰巧相遇，不期而会。适，符合、适合，有“如愿以偿”之意。野有蔓草，零露瀼瀼。有美一人，婉如清扬。邂逅相遇，与子偕臧。瀼（ráng），露浓貌。如，与“而”同。婉如即婉而。臧，善。偕臧，都满意。朱熹诗集传：“偕臧，言各得其所欲也。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"朋友相期會也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"朋友相期會也。\",\"fullText\":\"朋友相期會也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？\",\"fullText\":\"右《野有蔓草》二章，章六句。《小序》曰「思遇時也」，庶幾得之。《大序》又衍爲「君之澤不下流，民窮於兵革，男女失時，思不期而會焉」，則明明附會説矣。迨至《集傳》則言「野田草露之間，男女邂逅，私相苟合以適己願」，愈解愈紛，愈不成語。然循文按義，男女邂逅固似苟合，而「與子偕臧」，又豈苟合者所能言哉？況其詩兩見於《左傳》：鄭享趙孟，而子太叔賦此，趙孟以爲受其惠；鄭餞韓起，而子齹又賦此，宣子以爲「孺子善哉，吾有望矣」。一見於《韓詩外傳》：孔子遭程木子於郯，傾蓋而語，顧子路束帛以贈，子路對曰：「士不中道相見。」孔子乃詠此詩以曉之。是皆取士君子邂逅相遇爲義。「有美」云者，猶《簡兮》之稱「彼美」、《干旄》之咏「彼姝」云爾。若如晦翁所言，縱不爲鄭卿地，獨不爲孔子地乎？是知此詩必爲朋友期會之詩無疑。士固有一見傾心，終身莫解，片言相投，生死不渝者，此類是也。又何必男女相逢始適願哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"邂逅不期而會也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋邂逅不期而會也。\",\"fullText\":\"集釋邂逅不期而會也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:1-2:邂逅\",\"seg-011:1-2:邂逅\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-005\",\"seg-011\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/094-ye-you-man-cao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻漙十四寒，叶上兖反。婉十三阮。願十四願，叶五遠反。叶韻。瀼七陽。揚、臧並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻漙十四寒，叶上兖反。婉十三阮。願十四願，叶五遠反。叶韻。瀼七陽。揚、臧並同。本韻。\",\"fullText\":\"標韻漙十四寒，叶上兖反。婉十三阮。願十四願，叶五遠反。叶韻。瀼七陽。揚、臧並同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title
