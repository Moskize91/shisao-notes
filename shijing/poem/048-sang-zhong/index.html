","sectionLabel":"序","excerpt":"衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。","fullText":"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。","notes":null,"partOrder":2,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"爰采唐矣，沬之鄉矣。云誰之思，美孟姜矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采麥矣，沬之北矣。云誰之思，美孟弋矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采葑矣，沬之東矣。云誰之思，美孟庸矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。","sourceLabel":"第 5-7 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。","fullText":"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。其释首章“爰采唐矣，沬之鄉矣，云誰之思，美孟姜矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，谓托采唐于沬鄉起兴，实写男子思慕孟姜而与之期会迎送。次章“爰采麥矣，沬之北矣，云誰之思，美孟弋矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，言更举沬北采麥，而所思由孟姜转为孟弋，见私奔之事非一端。末章“爰采葑矣，沬之東矣，云誰之思，美孟庸矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，又以沬東采葑与孟庸相期相送，层递成文，以见淫风流行而不可禁。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021"]},{"id":"chenhuan-chuanshu:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"爰采唐矣，沬之鄉矣。云誰之思，美孟姜矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采麥矣，沬之北矣。云誰之思，美孟弋矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采葑矣，沬之東矣。云誰之思，美孟庸矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。","sourceLabel":"第 5-7 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"其释首章“爰采唐矣，沬之鄉矣，云誰之思，美孟姜矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，谓托采唐于沬鄉起兴，实写男子思慕孟姜而与之期会迎送。","fullText":"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。其释首章“爰采唐矣，沬之鄉矣，云誰之思 -1:part-3\"],\"materialIds\":[\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 101-102 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"题解认为《桑中》是一首写男女相悦、幽期密约的诗，并不认同将其定为讽刺贵族淫乱。\",\"fullText\":\"题解认为《桑中》是一首写男女相悦、幽期密约的诗，并不认同将其定为讽刺贵族淫乱。程、蒋引崔述“有叹美而无规戒”与闻一多“桑虫，思会时也”等说，指出诗写采菜摘麦时对恋人的追念，以孟姜、孟弋、孟庸为泛指美人的代称。全诗以一问一答展开，又复唱“期我”“要我”“送我”之事，情意柔和而音节铿锵，后人称其为“无题诗”之祖。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 101-102 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"程、蒋引崔述“有叹美而无规戒”与闻一多“桑虫，思会时也”等说，指出诗写采菜摘麦时对恋人的追念，以孟姜、孟弋、孟庸为泛指美人的代称。\",\"fullText\":\"题解认为《桑中》是一首写男女相悦、幽期密约的诗，并不认同将其定为讽刺贵族淫乱。程、蒋引崔述“有叹美而无规戒”与闻一多“桑虫，思会时也”等说，指出诗写采菜摘麦时对恋人的追念，以孟姜、孟弋、孟庸为泛指美人的代称。全诗以一问一答展开，又复唱“期我”“要我”“送我”之事，情意柔和而音节铿锵，后人称其为“无题诗”之祖。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"题解\",\"sourceLabel\":\"第 101-102 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"全诗以一问一答展开，又复唱“期我”“要我”“送我”之事，情意柔和而音节铿锵，后人称其为“无题诗”之祖。\",\"fullText\":\"题解认为《桑中》是一首写男女相悦、幽期密约的诗，并不认同将其定为讽刺贵族淫乱。程、蒋引崔述“有叹美而无规戒”与闻一多“桑虫，思会时也”等说，指出诗写采菜摘麦时对恋人的追念，以孟姜、孟弋、孟庸为泛指美人的代称。全诗以一问一答展开，又复唱“期我”“要我”“送我”之事，情意柔和而音节铿锵，后人称其为“无题诗”之祖。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 102-103 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章“爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以问答体开篇。\",\"fullText\":\"首章“爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以问答体开篇。程、蒋释“爰”为“于焉”合音，意为“何处”，“唐”即女萝。又释“沬”为卫都朝歌，“孟姜”为贵族女子的泛称。末三句写与恋人在桑中期会、上宫相要、临别送至淇水之上，情致宛转。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:爰采唐矣\",\"seg-002:1-4:沬之乡矣\",\"seg-003:1-4:云谁之思\",\"seg-004:1-4:美孟姜矣\",\"seg-005:1-5:期我乎桑中\",\"seg-006:1-5:要我乎上宫\",\"seg-007:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLi el\":\"诗句片段\",\"targetText\":\"爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 102-103 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末三句写与恋人在桑中期会、上宫相要、临别送至淇水之上，情致宛转。\",\"fullText\":\"首章“爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以问答体开篇。程、蒋释“爰”为“于焉”合音，意为“何处”，“唐”即女萝。又释“沬”为卫都朝歌，“孟姜”为贵族女子的泛称。末三句写与恋人在桑中期会、上宫相要、临别送至淇水之上，情致宛转。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-005:4-5:桑中\",\"seg-006:4-5:上宫\",\"seg-007:5-6:之上\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 103 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”仍承问答复唱。\",\"fullText\":\"次章“爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”仍承问答复唱。程、蒋释“沬之北”为朝歌以北旧邶地，“弋”古亦作“姒”，借作贵族女子代称。“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”三句复沓，强化相思不忘。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:1-4:爰采麦矣\",\"seg-009:1-4:沬之北矣\",\"seg-010:1-4:云谁之思\",\"seg-011:1-4:美孟弋矣\",\"seg-012:1-5:期我乎桑中\",\"seg-013:1-5:要我乎上宫\",\"seg-014:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materi ,\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 103-104 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"三章“爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以采葑作兴。\",\"fullText\":\"三章“爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以采葑作兴。程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:1-4:爰采葑矣\",\"seg-016:1-4:沬之东矣\",\"seg-017:1-4:云谁之思\",\"seg-018:1-4:美孟庸矣\",\"seg-019:1-5:期我乎桑中\",\"seg-020:1-5:要我乎上宫\",\"seg-021:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 103-104 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。\",\"fullText\":\"三章“爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以采葑作兴。程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-015:3-3:葑\",\"seg-016:1-3:沬之东\",\"seg-018:3-3:庸\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 103-104 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"fullText\":\"三章“爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以采葑作兴。程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-019:1-5:期我乎桑中\",\"seg-020:1-5:要我乎上宫\",\"seg-021:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":\"第 5 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《桑中》，刺奔也。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":\"第 5 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣，沬之鄉矣。云誰之思，美孟姜矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采麥矣，沬之北矣。云誰之思，美孟弋矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采葑矣，沬之東矣。云誰之思，美孟庸矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。\",\"sourceLabel\":\"第 5-7 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。\",\"fullText\":\"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。其释首章“爰采唐矣，沬之鄉矣，云誰之思，美孟姜矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，谓托采唐于沬鄉起兴，实写男子思慕孟姜而与之期会迎送。次章“爰采麥矣，沬之北矣，云誰之思，美孟弋矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，言更举沬北采麥，而所思由孟姜转为孟弋，见私奔之事非一端。末章“爰采葑矣，沬之東矣，云誰之思，美孟庸矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，又以沬東采葑与孟庸相期相送，层递成文，以见淫风流行而不可禁。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣，沬之鄉矣。云誰之思，美孟姜矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采麥矣，沬之北矣。云誰之思，美孟弋矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采葑矣，沬之東矣。云誰之思，美孟庸矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。\",\"sourceLabel\":\"第 5-7 页\",\"attributionLa -009:1-4:沬之北矣\",\"seg-010:1-4:云誰之思\",\"seg-011:1-4:美孟弋矣\",\"seg-012:1-5:期我乎桑中\",\"seg-013:1-5:要我乎上宮\",\"seg-014:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\",\"anchor-3-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-4\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣，沬之鄉矣。云誰之思，美孟姜矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采麥矣，沬之北矣。云誰之思，美孟弋矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采葑矣，沬之東矣。云誰之思，美孟庸矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。\",\"sourceLabel\":\"第 5-7 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"末章“爰采葑矣，沬之東矣，云誰之思，美孟庸矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，又以沬東采葑与孟庸相期相送，层递成文，以见淫风流行而不可禁。\",\"fullText\":\"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。其释首章“爰采唐矣，沬之鄉矣，云誰之思，美孟姜矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，谓托采唐于沬鄉起兴，实写男子思慕孟姜而与之期会迎送。次章“爰采麥矣，沬之北矣，云誰之思，美孟弋矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，言更举沬北采麥，而所思由孟姜转为孟弋，见私奔之事非一端。末章“爰采葑矣，沬之東矣，云誰之思，美孟庸矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，又以沬東采葑与孟庸相期相送，层递成文，以见淫风流行而不可禁。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-015:1-4:爰采葑矣\",\"seg-016:1-4:沬之東矣\",\"seg-017:1-4:云誰之思\",\"seg-018:1-4:美孟庸矣\",\"seg-019:1-5:期我乎桑中\",\"seg-020:1-5:要我乎上宮\",\"seg-021:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\",\"anchor-4-4\",\"anchor-4-5\",\"anchor-4-6\",\"anchor-4-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-0 "序：《桑中》，刺奔也。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣沬之鄉矣云誰之思美孟姜矣期我乎桑中要我乎上宮送我乎淇之上矣\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：爰，於也。唐蒙，菜名。沬，衛邑。\",\"fullText\":\"傳：爰，於也。唐蒙，菜名。沬，衛邑。箋云：於何采唐，必沬之鄉，猶言欲為淫亂者，必之衛之都。惡衛為淫亂之主。傳：姜，姓也。言世族在位有是惡行。箋云：淫亂之人誰思乎？乃思美孟姜。孟姜，列國之長女，而思與淫亂。疾世族在位，有是惡行也。傳：桑中、上宮，所期之地。淇，水名也。箋云：此思孟姜之愛厚已也，與我期於桑中，而要見我於上宮，其送我則於淇水之上。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:爰\",\"seg-001:3-3:唐\",\"seg-002:1-1:沬\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/maoheng-zhushu-kr1 :沬\",\"seg-004:2-3:孟姜\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-4\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 102-103 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末三句写与恋人在桑中期会、上宫相要、临别送至淇水之上，情致宛转。\",\"fullText\":\"首章“爰采唐矣？沬之乡矣。云谁之思？美孟姜矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以问答体开篇。程、蒋释“爰”为“于焉”合音，意为“何处”，“唐”即女萝。又释“沬”为卫都朝歌，“孟姜”为贵族女子的泛称。末三句写与恋人在桑中期会、上宫相要、临别送至淇水之上，情致宛转。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-005:4-5:桑中\",\"seg-006:4-5:上宫\",\"seg-007:5-6:之上\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 103 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”仍承问答复唱。\",\"fullText\":\"次章“爰采麦矣？沬之北矣。云谁之思？美孟弋矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”仍承问答复唱。程、蒋释“沬之北”为朝歌以北旧邶地，“弋”古亦作“姒”，借作贵族女子代称。“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”三句复沓，强化相思不忘。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:1-4:爰采麦矣\",\"seg-009:1-4:沬之北矣\" ":\"程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。\",\"fullText\":\"三章“爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以采葑作兴。程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-015:3-3:葑\",\"seg-016:1-3:沬之东\",\"seg-018:3-3:庸\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣。\",\"sourceLabel\":\"第 103-104 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"fullText\":\"三章“爰采葑矣？沬之东矣。云谁之思？美孟庸矣。期我乎桑中，要我乎上宫，送我乎淇之上矣”以采葑作兴。程、蒋释“葑”为芜菁，“沬之东”指古鄘地，“庸”古亦作“鄘”，仍为姓氏代称。末仍复唱“期我乎桑中”“要我乎上宫”“送我乎淇之上矣”，与前两章层递回环。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-019:1-5:期我乎桑中\",\"seg-020:1-5:要我乎上宫\",\"seg-021:1-7:送我乎淇之上矣\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":\"第 5 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《桑中》，刺奔也。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":\"第 5 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣，沬之鄉矣。云誰之思，美孟姜矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采麥矣，沬之北矣。云誰之思，美孟弋矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。爰采葑矣，沬之東矣。云誰之思，美孟庸矣。期我乎桑中，要我乎上宮，送我乎淇之上矣。\",\"sourceLabel\":\"第 5-7 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。\",\"fullText\":\"陈奂疏《桑中》时，先据《序》“刺奔也……政散民流而不可止”指出卫国公室淫乱，遂使世族在位相窃妻妾。其释首章“爰采唐矣，沬之鄉矣，云誰之思，美孟姜矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，谓托采唐于沬鄉起兴，实写男子思慕孟姜而与之期会迎送。次章“爰采麥矣，沬之北矣，云誰之思，美孟弋矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，言更举沬北采麥，而所思由孟姜转为孟弋，见私奔之事非一端。末章“爰采葑矣，沬之東矣，云誰之思，美孟庸矣，期我乎桑中，要我乎上宮，送我乎淇之上矣”，又以沬東采葑与孟庸相期相送，层递成文，以见淫风流行而不可禁。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-0 \":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《桑中》，刺奔也。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"桑中刺奔也衛之公室淫亂男女相奔至於世族在位相竊妻妾期於幽遠政散民流而不可止\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"fullText\":\"序：《桑中》，刺奔也。衛之公室淫亂，男女相奔，至於世族在位，相竊妻妾，期於幽遠，政散民流而不可止。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/048-sang-zhong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"爰采唐矣沬之鄉矣云誰之思美孟姜矣期我乎桑中要我乎上宮送我乎淇之上矣\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：爰，於也。唐蒙，菜名。沬，衛邑。\",\"fullText\":\"傳：爰，於也。唐蒙，菜名。沬，衛邑。箋云：於何采唐，必沬之鄉，猶言欲為淫亂者，必之衛之都。惡衛為淫亂之主。傳：姜，姓也。言世
