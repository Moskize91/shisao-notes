entId":"seg-006","segmentOrder":6,"surfaceText":"乎","charStart":3,"charEnd":3,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-006:8-8:輿","segmentId":"seg-006","segmentOrder":6,"surfaceText":"輿","charStart":8,"charEnd":8,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/135-quan-yu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。","sourceLabel":"第 303-304 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”","fullText":"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於，同乌，叹词。夏屋，大屋。渠渠，高大貌。承，继承。權輿，始初。韵读：鱼部一一乎、渠、餘、乎、輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。簋，古代盛饭的食器。韵读：纸部一一簋；巧部一一飽；鱼部一一乎、輿。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/135-quan-yu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。","sourceLabel":"第 303-304 页","attributionLabel":"程俊英、蒋见元","sec ,\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-006:8-8:輿\",\"segmentId\":\"seg-006\",\"segmentOrder\":6,\"surfaceText\":\"輿\",\"charStart\":8,\"charEnd\":8,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。\",\"sourceLabel\":\"第 303-304 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”\",\"fullText\":\"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於，同乌，叹词。夏屋，大屋。渠渠，高大貌。承，继承。權輿，始初。韵读：鱼部一一乎、渠、餘、乎、輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。簋，古代盛饭的食器。韵读：纸部一一簋；巧部一一飽；鱼部一一乎、輿。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\ erpt\":\"韵读：纸部一一簋；巧部一一飽；鱼部一一乎、輿。\",\"fullText\":\"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於，同乌，叹词。夏屋，大屋。渠渠，高大貌。承，继承。權輿，始初。韵读：鱼部一一乎、渠、餘、乎、輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。簋，古代盛饭的食器。韵读：纸部一一簋；巧部一一飽；鱼部一一乎、輿。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-004:8-8:簋\",\"seg-005:6-6:飽\",\"seg-006:3-3:乎\",\"seg-006:8-8:輿\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\",\"anchor-7-3\",\"anchor-7-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"權輿㊟刺康公待賢禮殺也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"權輿㊟刺康公待賢禮殺也。\",\"fullText\":\"權輿㊟刺康公待賢禮殺也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？\",\"fullText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"fullText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋夏大也。渠渠深廣貌。案：夏屋，毛無明訓，鄭則以爲大具以食我。王肅以爲屋室之屋，而朱子從之，是。承繼也。權輿始也。〔胡氏一桂曰〕作量自權始，以準量由此而生，造車自輿始，以蓋軫由此而起。故謂始曰權輿。簋〔《集傳》〕簋，瓦器，容斗二升。方曰簠，圓曰簋。簠盛稻粱，簋盛黍稷。四簋，禮食之盛也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLab 0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-006:1-9:于嗟乎！不承權輿。\",\"segmentId\":\"seg-006\",\"segmentOrder\":6,\"surfaceText\":\"于嗟乎！不承權輿。\",\"charStart\":1,\"charEnd\":9,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-006:3-3:乎\",\"segmentId\":\"seg-006\",\"segmentOrder\":6,\"surfaceText\":\"乎\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-006:8-8:輿\",\"segmentId\":\"seg-006\",\"segmentOrder\":6,\"surfaceText\":\"輿\",\"charStart\":8,\"charEnd\":8,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。\",\"sourceLabel\":\"第 303-304 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”\",\"fullText\":\"这是一首没落贵族回想当年生活而自伤的诗。春秋时代私田渐多，各国纷纷实行按亩税田，领主没落，生活下降，这首诗正是当时社会变革的一种反映。毛序说“权舆，刺康公也。忘先君之旧臣与贤者有始而无终也”，虽多附会，但“有始而无终”一语确能领略诗中的情绪。方玉润评曰：“起似居食双题，下乃单承侧重食一面，局法变换不测，于此可悟文法化板为活之妙。”於我乎，夏屋渠渠。今也每食無餘。于嗟乎！不承權輿。於，同乌，叹词。夏屋，大屋。渠渠，高大貌。承，继承。權輿，始初。韵读：鱼部一一乎、渠、餘、乎、輿。於我乎，每食四簋。今也每食不飽。于嗟乎！不承權輿。簋，古代盛饭的食器。韵读：纸部一一簋；巧部一一飽；鱼部一一乎、輿。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg getText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？\",\"fullText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"fullText\":\"右《權輿》二章，章五句。賢者去就，只争禮貌間耳。而此詩所較，不過區區安居餔歠事，恐非賢者志也。然孟子不云乎：「孔子爲魯司寇，不用，從而祭，燔肉不至，不税冕而行。不知者以爲爲肉也，其知者以爲爲無禮也。」是詩之作，亦猶是哉。蓋賢者每欲微罪行，不欲爲苟去，恐彰君過耳。康公之失，當不止是。故賢者藉是乘幾而作也。不然，食至無餘，而且不飽，康公禮貌縱衰，何至此極耶？眉評起似居、食雙題，下乃單承，側重食一面，局法變换不測。於此可悟文法化板爲活之妙。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/135-quan-yu/f
