characters":[{"index":1,"text":"不","anchorIds":[]},{"index":2,"text":"如","anchorIds":[]},{"index":3,"text":"叔","anchorIds":[]},{"index":4,"text":"也","anchorIds":[]}]},{"id":"seg-015","order":15,"text":"洵美且武","entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","chenhuan-chuanshu:0001-1:part-1","maruichen-tongshi:0001-1:part-1","quwanli-quanshi:0003-1:part-1","wangli-yundu:0003-1:part-1"],"characters":[{"index":1,"text":"洵","anchorIds":[]},{"index":2,"text":"美","anchorIds":[]},{"index":3,"text":"且","anchorIds":["seg-015:3-4:且武"]},{"index":4,"text":"武","anchorIds":["seg-015:3-4:且武"]}]}]},"materials":[{"id":"chenhuan-chuanshu","title":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"glossCount":1,"partCount":1},{"id":"wangli-yundu","title":"詩經韻讀","contributorLine":"现代 · 王力","publicationYear":1980,"glossCount":3,"partCount":3},{"id":"quwanli-quanshi","title":"詩經詮釋","contributorLine":"现代 · 屈萬里","publicationYear":1983,"glossCount":5,"partCount":5},{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"maruichen-tongshi","title":"毛詩傳箋通釋","contributorLine":"清 · 馬瑞辰","publicationYear":1989,"glossCount":1,"partCount":1},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":6,"glossCount":15,"anchoredPartCount":1,"overviewPartCount":3},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","quwanli-quanshi:0001-1:part-1"]},"focusAnchors":[{"id":"seg-015:3-4:且武","segmentId":"seg-015","segmentOrder":15,"surfaceText":"且武","charStart":3,"charEnd":4,"entryIds":["maruichen-tongshi:0001-1:part-1"],"materialIds":["maruichen-tongshi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/077-shu-yu-tian/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。叔适野，巷无服马。岂无服马？不如叔也，洵美且武。","sourceLabel":"第 173-175 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首赞美猎人的诗。毛序：“刺庄公也。叔处于京，缮甲治兵，以出于田，国人说而归之。”将此诗具体指为描写郑庄公的弟弟太叔段，这是附会左传史事。从诗中的赞美甚至溢美之辞来看，毫无刺意。崔述读风偶识曰：“大抵毛诗专事附会。仲与叔皆男子之字。郑国之人不啻数万，其字仲与叔者不知几何也。乃称叔即以为共叔，称仲即以为祭仲，情势之合与否皆不复问。然则郑有共叔，他人即不得复字叔；郑有祭仲，他人即不得复字仲乎？”这段话驳斥得很痛快。诗经中常用伯、仲、叔、季的表字；特别是女子，多半用它称其情人或丈夫，这是当时的习俗。这首诗的作者，就可能是和“叔”住在同里的女子。朱熹说：“或疑此亦民间男女相悦之辞也。”他看出了诗中有爱悦之意，比毛序客观得多。\n这首诗的特点是修辞的夸张。“巷无居人”、“巷无饮酒”、“巷无服马”三句，在诗人看来，整个巷子里，除了叔，别人都是不足道的。王充论衡艺增说：“故誉人不增其美，则闻者不快其意。”诗人为了痛快地表达她对叔爱慕至深的感情，不自觉地用了“增其美”的修辞，留给读者强烈的印象。而且这种夸张朴实自然，并无刻意雕琢的痕迹。我们只要看接下去的几句诗：“岂无居人？不如叔也，洵美且仁。”便更觉得天籁流露，纯真无邪了。\n叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。\n于，往。\n田，打猎。春秋公羊传桓公四年何休注曰：“田者，搜狩之总名也。古者肉食，衣皮服。捕禽者故谓之田。”\n巷，古代聚居区中的道路。说文：“衖，里中道。”篆文作衖，即今之巷字。按王充论衡艺增：“易曰：‘丰其屋，蔀其家，窥其户，阒其无人也。’非其无人也，无贤人也。”这句“巷无居人”也是这个意思。胡承珙毛诗后笺：“犹云倾城出观，里巷为空耳。”他这样理解是错的。\n洵，确实。\n仁，厚道谦让。王先谦集疏引黄山云：“论语‘里仁为美’，仁只是敦让意。”\n韵读：真部——田（徒人反）、人、人、仁。\n叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。\n狩，打猎。毛传：“冬猎曰狩。”马瑞辰通释：“狩又为田猎之通称，于狩犹于田也。”\n巷无饮酒，意为巷里没有人称得上是能喝酒的了。论语乡党：“唯酒无量，不及乱。”可见古代对能够饮酒还是很看重的。\n韵读：幽部——狩、酒、酒、好（呼受反）。\n叔适野，巷无服马。岂无服马？不如叔也，洵美且武。\n适，往。\n野，郊外。\n服马，驾马。马瑞辰通释：“服者，辅之假借。易系辞‘服牛乘马’，说文引作‘辅牛乘马’。玉篇：‘辅犹服也。以鞍装马也。’”\n武，勇敢英武。王先谦集疏：“武者，谓有武容。”\n韵读：鱼部——野（音宇）、马（音姥mǔ）、马、武。","fullText":"这是一首赞美猎人的诗。毛序：“刺庄公也。叔处于京，缮甲治兵，以出于田，国人说而归之。”将此诗具体指为描写郑庄公的弟弟太叔段，这是附会左传史事。从诗中的赞美甚至溢美之辞来看，毫无刺意。崔述读风偶识曰：“大抵毛诗专事附会。仲与叔皆男子之字。郑国之人不啻数万，其字仲与叔者不知几何也。乃称叔即以为共叔，称仲即以为祭仲，情势之合与否皆不复问。然则郑有共叔，他人即不得复字叔；郑有祭仲，他人即不得复字仲乎？”这段话驳斥得很痛快。诗经中常用伯、仲、叔、季的表字；特别是女子，多半用它称其情人或丈夫，这是当时的习俗。这首诗的作者，就可能是和“叔”住在同里的女子。朱熹说：“或疑此亦民间男女相悦之辞也。”他看出了诗中有爱悦之意，比毛序客观得多。\n这首诗的特点是修辞的夸张。“巷无居人”、“巷无饮酒”、“巷无服马”三句，在诗人看来，整个巷子里，除了叔，别人都是不足道的。王充论衡艺增说：“故誉人不增其美，则闻者不快其意。”诗人为了痛快地表达她对叔爱慕至深的感情，不自觉地用了“增其美”的修辞，留给读者强烈的印象。而且这种夸张朴实自然，并无刻意雕琢的痕迹。我们只要看接下去的几句诗：“岂无居人？不如叔也，洵美且仁。”便更觉得天籁流露，纯真无邪了。\n叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。\n于，往。\n田，打猎。春秋公羊传桓公四年何休注曰：“田者，搜狩之总名也。古者肉食，衣皮服。捕禽者故谓之田。”\n巷，古代聚居区中的道路。说文：“衖，里中道。”篆文作衖，即今之巷字。按王充论衡艺增：“易曰：‘丰其屋，蔀其家，窥其户，阒其无人也。’非其无人也，无贤人也。”这句“巷无居人”也是这个意思。胡承珙毛诗后笺：“犹云倾城出观，里巷为空耳。”他这样理解是错的。\n洵，确实。\n仁，厚道谦让。王先谦集疏引黄山云：“论语‘里仁为美’，仁只是敦让意。”\n韵读：真部——田（徒人反）、人、人、仁。\n叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。\n狩，打猎。毛传：“冬猎曰狩。”马瑞辰通释：“狩又为田猎之通称，于狩犹于田也。”\n巷无饮酒，意为巷里没有人称得上是能喝酒的了。论语乡党：“唯酒无量，不及乱。”可见古代对能够饮酒还是很看重的。\n韵读：幽部——狩、酒、酒、好（呼受反）。\n叔适野，巷无服马。岂无服马？不如叔也，洵美且武。\n适，往。\n野，郊外。\n服马，驾马。马瑞辰通释：“服者，辅之假借。易系辞‘服牛乘马’，说文引作‘辅牛乘马’。玉篇：‘辅犹服也。以鞍装马也。’”\n武，勇敢英武。王先谦集疏：“武者，谓有武容。”\n韵读：鱼部——野（音宇）、马（音姥mǔ）、马、武。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/077-shu-yu-tian/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"叔于田，巷無居人。豈無居人？不如叔也，洵美且仁。叔于狩，巷無飲酒。豈無飲酒？不如叔也，洵美且好。叔適野，巷無服馬。豈無服馬？不如叔也，洵美且武。","sourceLabel":"第 81-82 页","attributionLabel":"陈奂","sectionLabel":"经文","excerpt":"叔于田，巷無居人。豈無居人？不如叔也，洵美且仁。叔于狩，巷無飲酒。豈無飲酒？不如叔也，洵美且好。叔適野，巷無服馬。豈無服馬？不如叔也，洵美且武。","fullText":"叔于田，巷無居人。豈無居人？不如叔也，洵美且仁。叔于狩，巷無飲酒。豈無飲酒？不如叔也，洵美且好。叔適野，巷無服馬。豈無服馬？不如叔也，洵美且武。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"刺莊公縱弟田獵自喜也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"刺莊公縱弟田獵自喜也。","fullText":"刺莊公縱弟田獵自喜也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。","fullText":"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之 首赞美猎人的诗。毛序：“刺庄公也。叔处于京，缮甲治兵，以出于田，国人说而归之。”将此诗具体指为描写郑庄公的弟弟太叔段，这是附会左传史事。从诗中的赞美甚至溢美之辞来看，毫无刺意。崔述读风偶识曰：“大抵毛诗专事附会。仲与叔皆男子之字。郑国之人不啻数万，其字仲与叔者不知几何也。乃称叔即以为共叔，称仲即以为祭仲，情势之合与否皆不复问。然则郑有共叔，他人即不得复字叔；郑有祭仲，他人即不得复字仲乎？”这段话驳斥得很痛快。诗经中常用伯、仲、叔、季的表字；特别是女子，多半用它称其情人或丈夫，这是当时的习俗。这首诗的作者，就可能是和“叔”住在同里的女子。朱熹说：“或疑此亦民间男女相悦之辞也。”他看出了诗中有爱悦之意，比毛序客观得多。\\n这首诗的特点是修辞的夸张。“巷无居人”、“巷无饮酒”、“巷无服马”三句，在诗人看来，整个巷子里，除了叔，别人都是不足道的。王充论衡艺增说：“故誉人不增其美，则闻者不快其意。”诗人为了痛快地表达她对叔爱慕至深的感情，不自觉地用了“增其美”的修辞，留给读者强烈的印象。而且这种夸张朴实自然，并无刻意雕琢的痕迹。我们只要看接下去的几句诗：“岂无居人？不如叔也，洵美且仁。”便更觉得天籁流露，纯真无邪了。\\n叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。\\n于，往。\\n田，打猎。春秋公羊传桓公四年何休注曰：“田者，搜狩之总名也。古者肉食，衣皮服。捕禽者故谓之田。”\\n巷，古代聚居区中的道路。说文：“衖，里中道。”篆文作衖，即今之巷字。按王充论衡艺增：“易曰：‘丰其屋，蔀其家，窥其户，阒其无人也。’非其无人也，无贤人也。”这句“巷无居人”也是这个意思。胡承珙毛诗后笺：“犹云倾城出观，里巷为空耳。”他这样理解是错的。\\n洵，确实。\\n仁，厚道谦让。王先谦集疏引黄山云：“论语‘里仁为美’，仁只是敦让意。”\\n韵读：真部——田（徒人反）、人、人、仁。\\n叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。\\n狩，打猎。毛传：“冬猎曰狩。”马瑞辰通释：“狩又为田猎之通称，于狩犹于田也。”\\n巷无饮酒，意为巷里没有人称得上是能喝酒的了。论语乡党：“唯酒无量，不及乱。”可见古代对能够饮酒还是很看重的。\\n韵读：幽部——狩、酒、酒、好（呼受反）。\\n叔适野，巷无服马。岂无服马？不如叔也，洵美且武。\\n适，往。\\n野，郊外。\\n服马，驾马。马瑞辰通释：“服者，辅之假借。易系辞‘服牛乘马’，说文引作‘辅牛乘马’。玉篇：‘辅犹服也。以鞍装马也。’”\\n武，勇敢英武。王先谦集疏：“武者，谓有武容。”\\n韵读：鱼部——野（音宇）、马（音姥mǔ）、马、武。\",\"fullText\":\"这是一首赞美猎人的诗。毛序：“刺庄公也。叔处于京，缮甲治兵，以出于田，国人说而归之。”将此诗具体指为描写郑庄公的弟弟太叔段，这是附会左传史事。从诗中的赞美甚至溢美之辞来看，毫无刺意。崔述读风偶识曰：“大抵毛诗专事附会。仲与叔皆男子之字。郑国之人不啻数万，其字仲与叔者不知几何也。乃称叔即以为共叔，称仲即以为祭仲，情势之合与否皆不复问。然则郑有共叔，他人即不得复字叔；郑有祭仲，他人即不得复字仲乎？”这段话驳斥得很痛快。诗经中常用伯、仲、叔、季的表字；特别是女子，多半用它称其情人或丈夫，这是当时的习俗。这首诗的作者，就可能是和“叔”住在同里的女子。朱熹说：“或疑此亦民间男女相悦之辞也。”他看出了诗中有爱悦之意，比毛序客观得多。\\n这首诗的特点是修辞的夸张。“巷无居人”、“巷无饮酒”、“巷无服马”三句，在诗人看来，整个巷子里，除了叔，别人都是不足道的。王充论衡艺增说：“故誉人不增其美，则闻者不快其意。”诗人为了痛快地表达她对叔爱慕至深的感情，不自觉地用了“增其美”的修辞，留给读者强烈的印象。而且这种夸张朴实自然，并无刻意雕琢的痕迹。我们只要看接下去的几句诗：“岂无居人？不如叔也，洵美且仁。”便更觉得天籁流露，纯真无邪了。\\n叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。\\n于，往。\\n田，打猎。春秋公羊传桓公四年何休注曰：“田者，搜狩之总名也。古者肉食，衣皮服。捕禽者故谓之田。”\\n巷，古代聚居区中的道路。说文：“衖，里中道。”篆文作衖，即今之巷字。按王充论衡艺增：“易曰：‘丰其屋，蔀其家，窥其户，阒其无人也。’非其无人也，无贤人也。”这句“巷无居人”也是这个意思。胡承珙毛诗后笺：“犹云倾城出观，里巷为空耳。”他这样理解是错的。\\n洵，确实。\\n仁，厚道谦让。王先谦集疏引黄山云：“论语‘里仁为美’，仁只是敦让意。”\\n韵读：真部——田（徒人反）、人、人、仁。\\n叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。\\n狩，打猎。毛传：“冬猎曰狩。”马瑞辰通释：“狩又为田猎之通称，于狩犹于田也。”\\n巷无饮酒，意为巷里没有人称得上是能喝酒的了。论语乡党：“唯酒无量，不及乱。”可见古代对能够饮酒还是很看重的。\\n韵读：幽部——狩、酒、酒、好（呼受反）。\\n叔适野，巷无服马。岂无服马？不如叔也，洵美且武。\\n适，往。\\n野，郊外。\\n服马，驾马。马瑞辰通释：“服者，辅之假借。易系辞‘服牛乘马’，说文引作‘辅牛乘马’。玉篇：‘辅犹服也。以鞍装马也。’”\\n武，勇敢英武。王先谦集疏：“武者，谓有武容。”\\n韵读：鱼部——野（音宇）、马（音姥mǔ）、马、武。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"叔于田，巷無居人。豈無居人？不如叔也，洵美且仁。叔于狩，巷無飲酒。豈無飲酒？不如叔也，洵美且好。叔適野，巷無服馬。豈無服馬？不如叔也，洵美且武。\",\"sourceLabel\":\"第 81-82 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"叔于田，巷無居人。豈無居人？不如叔也，洵美且仁。叔于狩，巷無飲酒。豈無飲酒？不如叔也，洵美且好。叔適野，巷無服馬。豈無服馬？不如叔也，洵美且武。\",\"fullText\":\"叔于田，巷無居人。豈無居人？不如叔也，洵美且仁。叔于狩，巷無飲酒。豈無飲酒？不如叔也，洵美且好。叔適野，巷無服馬。豈無服馬？不如叔也，洵美且武。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺莊公縱弟田獵自喜也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺莊公縱弟田獵自喜也。\",\"fullText\":\"刺莊公縱弟田獵自喜也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。\",\"fullText\":\"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之義，故服馬猶乘馬也。〕\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之義，故服馬猶乘馬也。〕\",\"fullText\":\"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之義，故服馬猶乘馬也。〕\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻田〔一先。〕人〔十一真。〕仁〔同。〕通韻。狩〔二十六宥。〕酒〔二十五有。〕好〔十九皓，叶許厚反。〕叶韻。野〔二十一馬，叶上與反。〕馬〔同上，叶滿補反。〕武〔七麌。〕叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻田〔一先。〕人〔十一真。〕仁〔同。〕通韻。狩〔二十六宥。〕酒〔二十五有。〕好〔十九皓，叶許厚反。〕叶韻。野〔二十一馬，叶上與反。〕馬〔同上，叶滿補反。〕武〔七麌。〕叶韻。\",\"fullText\":\"標韻田〔一先。〕人〔十一真。〕仁〔同。〕通韻。狩〔二十六宥。〕酒〔二十五有。〕好〔十九皓，叶許厚反。〕叶韻。野〔二十一馬，叶上與反。〕馬〔同上，叶滿補反。〕武〔七麌。〕叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"洵美且武\",\"sourceLabel\":\"第 367 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"且武\",\"fullText\":\"且武\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:3-4:且武\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-015\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"舊謂共叔段不義而得衆，國人愛之，而作是詩。\",\"sourceLabel\":\"第 93 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"舊謂共叔段不義而得衆，國人愛之，而作是詩。\",\"fullText\":\"舊謂共叔段不義而得衆，國人愛之，而作是詩。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"叔于田\",\"sourceLabel\":\"第 93 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"田，獵也。于田，猶言在獵。\",\"fullText\":\"田，獵也。于田，猶言在獵。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\"]},{\"id\":\"quwanli-quanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/quwanli-quanshi/0003-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"洵美且仁洵美且好洵美且武\",\"sourceLabel\":\"第 93 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"洵，信也，猶言誠然也。\",\"fullText\":\"洵，信也，猶言誠然也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-010\",\"seg-015\"]},{\"id\":\"quwanli-quanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/quwanli-quanshi/0004-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel ,"这是一首赞美猎人的诗。毛序：“刺庄公也。叔处于京，缮甲治兵，以出于田，国人说而归之。”将此诗具体指为描写郑庄公的弟弟太叔段，这是附会左传史事。从诗中的赞美甚至溢美之辞来看，毫无刺意。崔述读风偶识曰：“大抵毛诗专事附会。仲与叔皆男子之字。郑国之人不啻数万，其字仲与叔者不知几何也。乃称叔即以为共叔，称仲即以为祭仲，情势之合与否皆不复问。然则郑有共叔，他人即不得复字叔；郑有祭仲，他人即不得复字仲乎？”这段话驳斥得很痛快。诗经中常用伯、仲、叔、季的表字；特别是女子，多半用它称其情人或丈夫，这是当时的习俗。这首诗的作者，就可能是和“叔”住在同里的女子。朱熹说：“或疑此亦民间男女相悦之辞也。”他看出了诗中有爱悦之意，比毛序客观得多。\n这首诗的特点是修辞的夸张。“巷无居人”、“巷无饮酒”、“巷无服马”三句，在诗人看来，整个巷子里，除了叔，别人都是不足道的。王充论衡艺增说：“故誉人不增其美，则闻者不快其意。”诗人为了痛快地表达她对叔爱慕至深的感情，不自觉地用了“增其美”的修辞，留给读者强烈的印象。而且这种夸张朴实自然，并无刻意雕琢的痕迹。我们只要看接下去的几句诗：“岂无居人？不如叔也，洵美且仁。”便更觉得天籁流露，纯真无邪了。\n叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。\n于，往。\n田，打猎。春秋公羊传桓公四年何休注曰：“田者，搜狩之总名也。古者肉食，衣皮服。捕禽者故谓之田。”\n巷，古代聚居区中的道路。说文：“衖，里中道。”篆文作衖，即今之巷字。按王充论衡艺增：“易曰：‘丰其屋，蔀其家，窥其户，阒其无人也。’非其无人也，无贤人也。”这句“巷无居人”也是这个意思。胡承珙毛诗后笺：“犹云倾城出观，里巷为空耳。”他这样理解是错的。\n洵，确实。\n仁，厚道谦让。王先谦集疏引黄山云：“论语‘里仁为美’，仁只是敦让意。”\n韵读：真部——田（徒人反）、人、人、仁。\n叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。\n狩，打猎。毛传：“冬猎曰狩。”马瑞辰通释：“狩又为田猎之通称，于狩犹于田也。”\n巷无饮酒，意为巷里没有人称得上是能喝酒的了。论语乡党：“唯酒无量，不及乱。”可见古代对能够饮酒还是很看重的。\n韵读：幽部——狩、酒、酒、好（呼受反）。\n叔适野，巷无服马。岂无服马？不如叔也，洵美且武。\n适，往。\n野，郊外。\n服马，驾马。马瑞辰通释：“服者，辅之假借。易系辞‘服牛乘马’，说文引作‘辅牛乘马’。玉篇：‘辅犹服也。以鞍装马也。’”\n武，勇敢英武。王先谦集疏：“武者，谓有武容。”\n韵读：鱼部——野（音宇）、马（音姥mǔ）、马、武。"])</script><script>self.__next_f.push([1,"23:Tc5d,"])</script><script>self.__next_f.push([1,"这是一首赞美猎人的诗。毛序：“刺庄公也。叔处于京，缮甲治兵，以出于田，国人说而归之。”将此诗具体指为描写郑庄公的弟弟太叔段，这是附会左传史事。从诗中的赞美甚至溢美之辞来看，毫无刺意。崔述读风偶识曰：“大抵毛诗专事附会。仲与叔皆男子之字。郑国之人不啻数万，其字仲与叔者不知几何也。乃称叔即以为共叔，称仲即以为祭仲，情势之合与否皆不复问。然则郑有共叔，他人即不得复字叔；郑有祭仲，他人即不得复字仲乎？”这段话驳斥得很痛快。诗经中常用伯、仲、叔、季的表字；特别是女子，多半用它称其情人或丈夫，这是当时的习俗。这首诗的作者，就可能是和“叔”住在同里的女子。朱熹说：“或疑此亦民间男女相悦之辞也。”他看出了诗中有爱悦之意，比毛序客观得多。\n这首诗的特点是修辞的夸张。“巷无居人”、“巷无饮酒”、“巷无服马”三句，在诗人看来，整个巷子里，除了叔，别人都是不足道的。王充论衡艺增说：“故誉人不增其美，则闻者不快其意。”诗人为了痛快地表达她对叔爱慕至深的感情，不自觉地用了“增其美”的修辞，留给读者强烈的印象。而且这种夸张朴实自然，并无刻意雕琢的痕迹。我们只要看接下去的几句诗：“岂无居人？不如叔也，洵美且仁。”便更觉得天籁流露，纯真无邪了。\n叔于田，巷无居人。岂无居人？不如叔也，洵美且仁。\n于，往。\n田，打猎。春秋公羊传桓公四年何休注曰：“田者，搜狩之总名也。古者肉食，衣皮服。捕禽者故谓之田。”\n巷，古代聚居区中的道路。说文：“衖，里中道。”篆文作衖，即今之巷字。按王充论衡艺增：“易曰：‘丰其屋，蔀其家，窥其户，阒其无人也。’非其无人也，无贤人也。”这句“巷无居人”也是这个意思。胡承珙毛诗后笺：“犹云倾城出观，里巷为空耳。”他这样理解是错的。\n洵，确实。\n仁，厚道谦让。王先谦集疏引黄山云：“论语‘里仁为美’，仁只是敦让意。”\n韵读：真部——田（徒人反）、人、人、仁。\n叔于狩，巷无饮酒。岂无饮酒？不如叔也，洵美且好。\n狩 ine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺莊公縱弟田獵自喜也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺莊公縱弟田獵自喜也。\",\"fullText\":\"刺莊公縱弟田獵自喜也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。\",\"fullText\":\"右《叔于田》三章，章五句。《小序》以爲「刺莊公」，《集傳》及諸家皆謂無刺莊公意。其實此詩的刺莊公無疑。叔之恃寵而驕，多行不義，誰則使之？莊公實使之也。詩人不必明斥公非，但極力摹寫叔之游獵無度，則其平日之遠君子而狎伍小人也可知。即叔之驕縱無忌，實莊公故縱其\\t惡之意亦可見。不然，叔以國君介弟之親，京城大叔之貴，其所好者，不應在馳騁弋獵地也；其所交者，更不宜近飲酒服馬儔也。而何以日事田獵，至于巷無居人、飲酒，以及服馬之不足相勝乎？曰「美且仁」、「美且好」、「美且武」者，詩人故爲此誇大詞以動莊公，使其早爲之備，亦如公子吕所云「欲與大叔，臣請事之；若弗與，則請除之，無生民心」之意云耳，而謂此不義人真能得衆心歟？讀詩者慎勿泥其辭而昧其義焉可也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之義，故服馬猶乘馬也。〕\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之義，故服馬猶乘馬也。〕\",\"fullText\":\"田〔《白虎通義》曰〕四時之田總名爲田。爲田除害也。巷〔里塗也。〕狩〔冬獵曰狩。〔杜氏預曰〕狩，圍守也。冬物畢成，獲則取之，無所擇也。〕服〔乘也。〔孔氏穎達曰〕《易》稱「服牛乘馬」，俱是駕用之義，故服馬猶乘馬也。〕\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻田〔一先。〕人〔十一真。〕仁〔同。〕通韻。狩〔二十六宥。〕酒〔二十五有。〕好〔十九皓，叶許厚反。〕叶韻。野〔二十一馬，叶上與反。〕馬〔同上，叶滿補反。〕武〔七麌。〕叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻田〔一先。〕人〔十一真。〕仁〔同。〕通韻。狩〔二十六宥。〕酒〔二十五有。〕好〔十九皓，叶許厚反。〕叶韻。野〔二十一馬，叶上與反。〕馬〔同上，叶滿補反。〕武〔七麌。〕叶韻。\",\"fullText\":\"標韻田〔一先。〕人〔十一真。〕仁〔同。〕通韻。狩〔二十六宥。〕酒〔二十五有。〕好〔十九皓，叶許厚反。〕叶韻。野〔二十一馬，叶上與反。〕馬〔同上，叶滿補反。〕武〔七麌。〕叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/077-shu-yu-tian/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"洵美且武\",\"sourceLabel\":\"第 367 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"ex
