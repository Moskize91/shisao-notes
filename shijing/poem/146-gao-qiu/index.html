":"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。","sourceLabel":"第 324-325 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。","fullText":"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。","notes":"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。","sourceLabel":"第 324-325 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。","fullText":"这是 g-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/146-gao-qiu/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"羔裘㊟傷檜君貪冒，不知危在旦夕也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"羔裘㊟傷檜君貪冒，不知危在旦夕也。","fullText":"羔裘㊟傷檜君貪冒，不知危在旦夕也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/146-gao-qiu/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《羔裘》三章，章四句。《小序》云：「大夫以道去其君也。」《大序》以爲：「國小而迫，君不用道，好絜其衣服，逍遥游燕，而不能自强於政治，故作是詩。」《集傳》從之無異辭，惟不言大夫去耳。夫國君好絜衣服，過之小者也，何必去？即云國小而迫，正臣子相助爲理之秋，更不必去。此必國勢將危，其君不知，猶以寶貨爲奇，終日游宴，邊幅是脩，臣下憂之諫而不聽，夫然後去。去之而又不忍遽絶其君，乃形諸歌詠以見志也。案《國語》：鄭桓公爲周司徒，問於史伯，史伯對曰：「子、男之國，虢、鄶爲大。虢叔恃勢，鄶仲恃險，皆有驕侈怠慢之心，加之以貪冒。君若以周難之故，寄帑與賄，不敢不許。是驕而貪，必將背君。君以成周之衆，奉辭罰罪，無不克矣。」桓公從之，乃東寄帑與賄，虢、鄶受焉。其後，武公卒取二國地以爲鄭有。詩之作正其時也。曰「羔裘」，曰「狐裘」，而且曰「如膏」、「有曜」，非徒好絜，實貪侈耳。曰「逍遥」，曰「翺翔」，非惟游惰，又冒昧也。此與虞公受晉璧馬而不知其人之將襲己也，又何以異？然當是時，安知其臣不有宫之奇其人者犯顔而直諫，又安知其臣不有百里奚其人者潔身而遠去。玩味詩詞，「豈不爾思，中心是悼」，則百里奚輩也。唯其心戀戀故主，雖去國而猶不敢無憂國念，此詩之所以存耳。惜其世次微茫，姓氏無考，《序》又不能抉發隱衷，遂使忠臣智士一片苦心，隱而不彰。不惟説詩不精，論世亦欠其詳也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"正序","excerpt":"右《羔裘》三章，章四句。《小序》云：「大夫以道去其君也。」《大序》以爲：「國小而迫，君不用道，好絜其衣服，逍遥游燕，而不能自强於政治，故作是詩。」《集傳》從之無異辭，惟不言大夫去耳。夫國君好絜衣服，過之小者也，何必去？即云國小而迫，正臣子相助爲理之秋，更不必去。此必國勢將危，其君不知，猶以寶貨爲奇，終日游宴，邊幅是脩，臣下憂之諫而不聽，夫然後去。去之而又不忍遽絶其君，乃形諸歌詠以見志也。案《國語》：鄭桓公爲周司徒，問於史伯，史伯對曰：「子、男之國，虢、鄶爲大。虢叔恃勢，鄶仲恃險，皆有驕侈怠慢之心，加之以貪冒。君若以周難之故，寄帑與賄，不敢不許。是驕而貪，必將背君。君以成周之衆，奉辭罰罪，無不克矣。」桓公從之，乃東寄帑與賄，虢、鄶受焉。其後，武公卒取二國地以爲鄭有。詩之作正其時也。曰「羔裘」，曰「狐裘」，而且曰「如膏」、「有曜」，非徒好絜，實貪侈耳。曰「逍遥」，曰「翺翔」，非惟游惰，又冒昧也。此與虞公受晉璧馬而不知其人之將襲己也，又何以異？然當是時，安知其臣不有宫之奇其人者犯顔而直諫，又安知其 1,\"surfaceText\":\"豈不爾思\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:1-4:中心是悼\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"中心是悼\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:4-4:悼\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"悼\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。\",\"notes\":\"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光 传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。\",\"notes\":\"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。\",\"partOrder\":9,\"anchorIds\":[\"seg-009:4-4:膏\",\"seg-010:3-4:有曜\",\"seg-012:4-4:悼\"],\"glossAnchorIds\":[\"anchor-9-1\",\"anchor-9-2\",\"anchor-9-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：宵部一一膏、曜、悼。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。\",\"notes\":\"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。\",\"partOrder\":10,\"anchorIds\":[\"seg-009:4-4:膏\",\"seg-010:4-4:曜\",\"seg-012:4-4:悼\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\",\"anchor-10-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"羔裘㊟傷檜君貪冒，不知危在旦夕也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"羔裘㊟傷檜君貪冒，不知危在旦夕也。\",\"fullText\":\"羔裘㊟傷檜君貪冒，不知危在旦夕也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《羔裘》三章，章四句。《小序》云：「大夫以道去其君也。」《大序》以爲：「國小而迫，君不用道，好絜其衣服，逍遥游燕，而不能自强於政治，故作是詩。」《集傳》從之無異辭，惟不言大夫去耳。夫國君好絜衣服，過之小者也，何必去？即云國小而迫，正臣子相助爲理之秋，更不必去。此必國勢將危，其君不知，猶以寶貨爲奇，終日游宴，邊幅是脩，臣下憂之諫而不聽，夫然後去。去之而又不忍遽絶其君，乃形諸歌詠以見志也。案《國語》：鄭桓公爲周司徒，問於史伯，史伯對曰：「子、男之國，虢、鄶爲大。虢叔恃勢，鄶仲恃險，皆有驕侈怠慢之心，加之以貪冒。君若以周難之故，寄帑與賄，不敢不許。是驕而貪，必將背君。君以成周之衆，奉辭罰罪，無不克矣。」桓公從之，乃東寄帑與賄，虢、鄶受焉。其後，武公卒取二國地以爲鄭有。詩之作正其時也。曰「羔裘」，曰「狐裘」，而且曰「如膏」、「有曜」，非徒好絜，實貪侈耳。曰「逍遥」，曰「翺翔」，非惟游惰，又冒昧也。此與虞公受晉璧馬而不知其人之將襲己也，又何以異？然當是時，安知其臣不有宫之奇其人者犯顔而直諫，又安知其臣不有百里奚其人者潔身而遠去。玩味詩詞，「豈不爾思，中心是悼」，則百里奚輩也。唯其心戀戀故主，雖去國而猶不敢無憂國念，此詩之所以存耳。惜其世次微茫，姓氏無考，《序》又不能抉發隱衷，遂使忠臣智士一片苦心，隱而不彰。不惟説詩不精，論世亦欠其詳也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《羔裘》三章，章四 g-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-009:4-4:膏\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"膏\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-010:1-4:日出有曜\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"日出有曜\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-010:3-4:有曜\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"有曜\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-010:4-4:曜\",\"segmentId\":\"seg-010\",\"segmentOrder\":10,\"surfaceText\":\"曜\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-011:1-4:豈不爾思\",\"segmentId\":\"seg-011\",\"segmentOrder\":11,\"surfaceText\":\"豈不爾思\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:1-4:中心是悼\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"中心是悼\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\",\"fangyurun-yuanshi:0007-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"fangyurun-yuanshi\"]},{\"id\":\"seg-012:4-4:悼\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"悼\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-9\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。\",\"notes\":\"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\" licationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：宵部一一遥、朝、忉。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。\",\"notes\":\"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。\",\"partOrder\":4,\"anchorIds\":[\"seg-001:4-4:遥\",\"seg-002:4-4:朝\",\"seg-004:3-3:忉\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每章首二句通过鲜洁光润的羔裘、狐裘，逍遥翺翔的自在态度，将作者心目中的大夫描写得英俊潇洒。就是为了这样一个人，作者想念得忧伤不已。经前二句的铺垫，后二句就有了着落。羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘、狐裘，都是大夫的服装。平时穿羔裘，进朝穿狐裘。毛传：“羔裘以游燕，狐裘以适朝。”逍遥，任意游逛之意。陈奂《传疏》：“燕者，安也。传以游燕释逍遥，序云逍遥游燕，此四字同义。”王逸《楚辞章句》注：“逍遥，游戏也。”忉忉，心情忧劳貌。韵读：宵部一一遥、朝、忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。韵读：阳部一一翔、堂、傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。膏，油脂。有曜，即耀耀，形容日光。古代的皮袍，毛向外，太阳光照在上面，闪闪发亮，像涂了油一样。这两句是倒句。悼，哀痛。毛传：“悼，动也。”陈奂《传疏》：“动，古励字。”韵读：宵部一一膏、曜、悼。\",\"notes\":\"据 PDF 324-325 页文字层互校整理；篇题与诗句中的“羔裘”均以原诗字校正，不沿用文字层误作“羔袭”的假字。\",\"partOrder\":5,\"anchorIds\":[\"seg-005:1-4:羔裘翺翔\",\"seg-006:1-4:狐裘在堂\",\"seg-007:1-4:豈不爾思\",\"seg-008:1-4:我心憂傷\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\",\"anchor-5-3\",\"anchor-5-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"羔裘逍遥，狐裘以朝。豈不爾思？勞心忉忉。羔裘翺翔，狐裘在堂。豈不爾思？我心憂傷。羔裘如膏，日出有曜。豈不爾思？中心是悼。\",\"sourceLabel\":\"第 324-325 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"翺翔，与“逍遥”同意。按翺翔的本义为鸟的回飞，引申为人的邀游。堂，公堂，大夫朝见君主的地方。这首诗中“在堂”就是“在朝”的意思。\",\"fullText\":\"这是一首怀人的诗。作者很想念那位穿着羊皮袍、狐皮袍的大夫，但由于某种原因又无法达到目的，心中很忧伤，于是唱出了这首诗。毛序：“羔裘，大夫以道去其君也。国小而迫，君不用道，好洁其衣服，逍遥游燕，而不能自强于政治，故作是诗也。”语属附会，似不可从。闻一多认为《羔裘》是“女欲奔男之辞”，“中心是悼”即《王风·大车》“畏子不敢”之意。但《大车》明言“畏子不奔”，当然可据此确定诗的主题；此诗“中心是悼”只反映一种伤感的情怀，何以见其必有欲奔之心？闻说未免联想得太过分了一点。怀人之诗，多有即景起兴者，而此诗全用赋体。每 obal\",\"layerLabel\":\"全篇总说\",\"targetText\":\"羔裘㊟傷檜君貪冒，不知危在旦夕也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"羔裘㊟傷檜君貪冒，不知危在旦夕也。\",\"fullText\":\"羔裘㊟傷檜君貪冒，不知危在旦夕也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/146-gao-qiu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《羔裘》三章，章四句。《小序》云：「大夫以道去其君也。」《大序》以爲：「國小而迫，君不用道，好絜其衣服，逍遥游燕，而不能自强於政治，故作是詩。」《集傳》從之無異辭，惟不言大夫去耳。夫國君好絜衣服，過之小者也，何必去？即云國小而迫，正臣子相助爲理之秋，更不必去。此必國勢將危，其君不知，猶以寶貨爲奇，終日游宴，邊幅是脩，臣下憂之諫而不聽，夫然後去。去之而又不忍遽絶其君，乃形諸歌詠以見志也。案《國語》：鄭桓公爲周司徒，問於史伯，史伯對曰：「子、男之國，虢、鄶爲大。虢叔恃勢，鄶仲恃險，皆有驕侈怠慢之心，加之以貪冒。君若以周難之故，寄帑與賄，不敢不許。是驕而貪，必將背君。君以成周之衆，奉辭罰罪，無不克矣。」桓公從之，乃東寄帑與賄，虢、鄶受焉。其後，武公卒取二國地以爲鄭有。詩之作正其時也。曰「羔裘」，曰「狐裘」，而且曰「如膏」、「有曜」，非徒好絜，實貪侈耳。曰「逍遥」，曰「翺翔」，非惟游惰，又冒昧也。此與虞公受晉璧馬而不知其人之將襲己也，又何以異？然當是時，安知其臣不有宫之奇其人者犯顔而直諫，又安知其臣不有百里奚其人者潔身而遠去。玩味詩詞，「豈不爾思，中心是悼」，則百里奚輩也。唯其心戀戀故主，雖去國而猶不敢無憂國念，此詩之所以存耳。惜其世次微茫，姓氏無考，《序》又不能抉發隱衷，遂使忠臣智士一片苦心，隱而不彰。不惟説詩不精，論世亦欠其詳也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《羔裘》三章，章四句。《小序》云：「大夫以道去其君也。」《大序》以爲：「國小而迫，君不用道，好絜其衣服，逍遥游燕，而不能自强於政治，故作是詩。」《集傳》從之無異辭，惟不言大夫去耳。夫國君好絜衣服，過之小者也，何必去？即云國小而迫，正臣子相助爲理之秋，更不必去。此必國勢將危，其君不知，猶以寶貨爲奇，終日游宴，邊幅是脩，臣下憂之諫而不聽，夫然後去。去之而又不忍遽絶其君，乃形諸歌詠以見志也。案《國語》：鄭桓公爲周司徒，問於史伯，史伯對曰：「子、男之國，虢、鄶爲大。虢叔恃勢，鄶仲恃險，皆有驕侈怠慢之心，加之以貪冒。君若以周難之故，寄帑與賄，不敢不許。是驕而貪，必將背君。君以成周之衆，奉辭罰罪，無不克矣。」桓公從之，乃東寄帑與賄，虢、鄶受焉。其後，武公卒取二國地以爲鄭有。詩之作正其時也。曰「羔裘」，曰「狐裘」，而且曰「如膏」、「有曜」，非徒好絜，實貪侈耳。曰「逍遥」，曰「翺翔」，非惟游惰，又冒昧也。此與虞公受晉璧馬而不知其人之將襲己也，又何以異？然當是時，安知其臣不有宫之奇其人者犯顔而直諫，又安知其臣不有百里奚其人者潔身而遠去。玩味詩詞，「豈不爾思，中心是悼」，則百里奚輩也。唯其心戀戀故主，雖去國而猶不敢無憂國念，此詩之所以存耳。惜其世次微茫，姓氏無考，《序》又不能抉發隱衷，遂使忠臣智士一片苦心，隱而不彰。不惟説詩不精，論世亦欠其詳也。\",\"fullText\":\"右《羔裘》三章，章四句。《小序》云：「大夫以道去其君也。」《大序》以爲：「國小而迫，君不用道，好絜其衣服，逍遥游燕，而不能自强於政治，故作是詩。」《集傳》從之無異辭，惟不言大夫去耳。
