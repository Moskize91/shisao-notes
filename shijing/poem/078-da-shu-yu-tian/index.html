,\"sectionLabel\":\"疏\",\"excerpt\":\"謂篇中極稱叔段乘馬、暴虎、獻于公所與善射良御之盛，正所以見其恃勇得眾，\",\"fullText\":\"陳奐疏《大叔于田》，仍從《序》刺莊公縱弟之說，謂篇中極稱叔段乘馬、暴虎、獻于公所與善射良御之盛，正所以見其恃勇得眾，而莊公「將叔無狃，戒其傷女」之辭尤足致諷。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":2,\"anchorIds\":[\"seg-002:2-3:乘馬\",\"seg-007:3-4:暴虎\",\"seg-008:1-4:獻于公所\",\"seg-017:2-3:善射\",\"seg-018:2-3:良御\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\",\"seg-029\",\"seg-030\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/078-da-shu-yu-tian/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"叔于田，乘乘馬。執轡如組，兩驂如舞。叔在藪，火烈具舉。襢裼暴虎，獻于公所。將叔無狃，戒其傷女。叔于田，乘乘黃。兩服上襄，兩驂鴈行。叔在藪，火烈具揚。叔善射忌，又良御忌。抑磬控忌，抑縱送忌。叔于田，乘乘鴇。兩服齊首，兩驂如手。叔在藪，火烈具阜。叔馬慢忌，叔發罕忌。抑釋掤忌，抑鬯弓忌。\",\"sourceLabel\":\"第 83-85 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"而莊公「將叔無狃，戒其傷女」之辭尤足致諷。\",\"fullText\":\"陳奐疏《大叔于田》，仍從《序》刺莊公縱弟之說，謂篇中極稱叔段乘馬、暴虎、獻于公所與善射良御之盛，正所以見其恃勇得眾，而莊公「將叔無狃，戒其傷女」之辭尤足致諷。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":3,\"anchorIds\":[\"seg-009:1-4:將叔無狃\",\"seg-010:3-4:傷女\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\",\"seg-029\",\"seg-030\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/078-da-shu-yu-tian/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"叔于田，乘乘馬。執轡如組，兩驂如舞。叔在藪，火烈具舉。襢裼暴虎，獻于公所。將叔無狃，戒其傷女。叔于田，乘乘黃。兩服上襄，兩驂鴈行。叔在藪，火烈具揚。叔善射忌，又良御忌。抑磬控忌，抑縱送忌。叔于田，乘乘鴇。兩服齊首，兩驂如手。叔在藪，火烈具阜。叔馬慢忌，叔發罕忌。抑釋掤忌，抑鬯弓忌。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉潤論《大叔于田》與前篇同爲刺莊公縱弟游獵之作，但前篇虛寫，此篇實賦；\",\"fullText\":\"方玉潤論《大叔于田》與前篇同爲刺莊公縱弟游獵之作，但前篇虛寫，此篇實賦；「襢裼暴虎，獻于公所」與「將叔無狃，戒其傷女」最見叔段恃勇無君、莊公縱之蹈危。其集釋又釋「如舞」「藪」「襢裼」「乘黃」「鴈行」「磬控」「縱送」「鴇」「掤」「鬯」等語。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-3:叔于田\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\",\"seg-029\",\"seg-030\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/078-da-shu-yu-tian/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"叔于田，乘乘馬。執轡如組，兩驂如舞。叔在藪，火烈具舉。襢裼暴虎，獻于公所。將叔無狃，戒其傷女。叔于田，乘乘黃。兩服上襄，兩驂鴈行。叔在藪，火烈具揚。叔善射忌，又良御忌。抑磬控忌，抑縱送忌。叔于田，乘乘鴇。兩服齊首，兩驂如手。叔在藪，火烈具阜。叔馬慢忌，叔發罕忌。抑釋掤忌，抑鬯弓忌。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"「襢裼暴虎，獻于公所」與「將叔無狃，戒其傷女」最見叔段恃勇無君、莊公縱之蹈危。\",\"fullText\":\"方玉潤論《大叔于田》與前篇同爲刺莊公縱弟游獵之作，但前篇虛寫，此篇實賦；「襢裼暴虎，獻于公所」與「將叔無狃，戒其傷女」最見叔段恃勇無君、
