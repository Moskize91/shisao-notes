因，是怕家庭反对、舆论批评。从她叮嘱情人仲子的语句和仲子敢于逾墙攀树来相会，可以看出她是极爱仲子的。他们之间的感情虽然真挚，但却达不到结婚的目的，这种爱情和礼教的矛盾使她痛苦不安，不得不向情人叮嘱，请他不要再来。诗歌反映了当时婚姻不自由的社会现象。\n毛序：“将仲子，刺庄公也。不胜其母以害其弟，弟叔失道而公弗制，祭仲谏而公弗听，小不忍以致大乱焉。”三家诗无异议。这是根据左传隐公元年的记载而附会出来的，穿凿太甚，后人多不相信。朱熹引郑樵说：“此淫奔者之辞。”他虽然以卫道者的口吻斥责诗人为“淫奔者”，但毕竟明确指出这是男女情爱之诗，比毛序和三家诗前进了一大步。姚际恒说：“此虽属淫，然女子为此婉转之辞以谢男子，而以父母、诸兄及人言为可畏，大有廉耻，又岂得为淫者哉！”姚氏是反对朱熹之说的，但他虽然为诗中的姑娘脱去了“淫奔者”的帽子，却又给她戴上“大有廉耻”的枷锁，这种说法与朱熹在思想上是伯仲之间，谈不上什么进步。这是我们在分析前人诗学时应加以注意的。\n这首诗的特点是心理的描写。诗歌囿于篇幅，无法对人物的心理作很细腻的描绘。但是在诗人简炼的语句中，有时候也可以将自己心情表达得颇为尽致。此诗三章全为女子与情人讲话口气，首句“将仲子兮”，一声呼告，十分亲密，已透露那姑娘爱仲子的心情。后两句“无逾我里，无折我树杞”是要求仲子不要再来会面。然而这不是无情的拒绝，她心里还是爱仲子的，虽然回绝了仲子，却又恐怕他误解，所以急急乎解释道：“岂敢爱之，畏我父母。”解释了还嫌不足，她索性坦露了自己的心迹：“仲可怀也。”然而她又摄于家庭、舆论的压力，因为“父母之言”、“人之多言”，“亦可畏也”。至此，整个心事和盘托出，希冀求得情人的谅解。短短八句，一波三折，曲尽女子爱和畏的矛盾心理。姚际恒在“岂敢爱之”和“仲可怀也”二句下分别评以一个“岩”字，点出了诗人婉委曲折心理的微妙。\n将仲子兮！无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言，亦可畏也！\n将（qiāng），请求。\n仲子，男子的字。伯、仲、叔、季是兄弟、姊妹的排行，当时女子多以伯、仲、叔称所爱的男子。子，是对男子的美称。仲子犹言“老二”。\n逾，越、翻越。\n里，古代二十五家为里。孔疏：“地官遂人云：‘五家为邻，五邻为里。’是二十五家为里也。”凡里皆有墙，这里的“里”实指里墙。\n折，伤害折断。姚际恒诗经通论引季明德曰：“篇内言‘折’，谓因逾墙而压折，非采折之折。”\n杞，杞柳。\n怀，想念，惦记。\n韵读：之部——子、里、杞、之、母（满以反）。脂部——怀（音回）、畏。\n将仲子兮！无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言，亦可畏也！\n墙，院墙。这里指作者所居的院墙。\n桑，古代墙边种桑。孟子尽心：“五亩之宅，树墙下以桑。”\n韵读：阳部——墙、桑、兄（虚王反）。脂部——怀、畏。\n将仲子兮！无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言，亦可畏也！\n园，古代种树木和果树的场所。毛传：“园，所以树木也。”说文：“园，所以树果也。”徐常吉说：“由逾里而墙而园，仲之来也以渐而迫也。由父母而诸兄而众人，女之畏也以渐而远也。”（传说汇纂）徐氏指出了此诗层递的修辞。\n韵读：元部——园、檀、言。脂部——怀、畏。","fullText":"这是一首女子拒绝情人的诗。她拒绝情人的原因，是怕家庭反对、舆论批评。从她叮嘱情人仲子的语句和仲子敢于逾墙攀树来相会，可以看出她是极爱仲子的。他们之间的感情虽然真挚，但却达不到结婚的目的，这种爱情和礼教的矛盾使她痛苦不安，不得不向情人叮嘱，请他不要再来。诗歌反映了当时婚姻不自由的社会现象。\n毛序：“将仲子，刺庄公也。不胜其母以害其弟，弟叔失道而公弗制，祭仲谏而公弗听，小不忍以致大乱焉。”三家诗无异议。这是根据左传隐公元年的记载而附会出来的，穿凿太甚，后人多不相信。朱熹引郑樵说：“此淫奔者之辞。”他虽然以卫道者的口吻斥责诗人为“淫奔者”，但毕竟明确指出这是男女情爱之诗，比毛序和三家诗前进了一大步。姚际恒说：“此虽属淫，然女子为此婉转之辞以谢男子，而以父母、诸兄及人言为可畏，大有廉耻，又岂得为淫者哉！”姚氏是反对朱熹之说的，但他虽然为诗中的姑娘脱去了“淫奔者”的帽子，却又给她戴上“大有廉耻”的枷锁，这种说法与朱熹在思想上是伯仲之间，谈不上什么进步。这是我们在分析前人诗学时应加以注意的。\n这首诗的特点是心理的描写。诗歌囿于篇幅，无法对人物的心理作很细腻的描绘。但是在诗人简炼的语句中，有时候也可以将自己心情表达得颇为尽致。此诗三章全为女子与情人讲话口气，首句“将仲子兮”，一声呼告，十分亲密，已透露那姑娘爱仲子的心情。后两句“无逾我里，无折我树杞”是要求仲子不要再来会面。然而这不是无情的拒绝，她心里还是爱仲子的，虽然回绝了仲子， 1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":21,\"anchoredPartCount\":1,\"overviewPartCount\":3},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-023:1-4:人之多言\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"人之多言\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"将仲子兮，无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言，亦可畏也。将仲子兮，无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言，亦可畏也。将仲子兮，无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言，亦可畏也。\",\"sourceLabel\":\"第 171-173 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首女子拒绝情人的诗。她拒绝情人的原因，是怕家庭反对、舆论批评。从她叮嘱情人仲子的语句和仲子敢于逾墙攀树来相会，可以看出她是极爱仲子的。他们之间的感情虽然真挚，但却达不到结婚的目的，这种爱情和礼教的矛盾使她痛苦不安，不得不向情人叮嘱，请他不要再来。诗歌反映了当时婚姻不自由的社会现象。\\n毛序：“将仲子，刺庄公也。不胜其母以害其弟，弟叔失道而公弗制，祭仲谏而公弗听，小不忍以致大乱焉。”三家诗无异议。这是根据左传隐公元年的记载而附会出来的，穿凿太甚，后人多不相信。朱熹引郑樵说：“此淫奔者之辞。”他虽然以卫道者的口吻斥责诗人为“淫奔者”，但毕竟明确指出这是男女情爱之诗，比毛序和三家诗前进了一大步。姚际恒说：“此虽属淫，然女子为此婉转之辞以谢男子，而以父母、诸兄及人言为可畏，大有廉耻，又岂得为淫者哉！”姚氏是反对朱熹之说的，但他虽然为诗中的姑娘脱去了“淫奔者”的帽子，却又给她戴上“大有廉耻”的枷锁，这种说法与朱熹在思想上是伯仲之间，谈不上什么进步。这是我们在分析前人诗学时应加以注意的。\\n这首诗的特点是心理的描写。诗歌囿于篇幅，无法对人物的心理作很细腻的描绘。但是在诗人简炼的语句中，有时候也可以将自己心情表达得颇为尽致。此诗三章全为女子与情人讲话口气，首句“将仲子兮”，一声呼告，十分亲密，已透露那姑娘爱仲子的心情。后两句“无逾我里，无折我树杞”是要求仲子不要再来会面。然而这不是无情的拒绝，她心里还是爱仲子的，虽然回绝了仲子，却又恐怕他误解，所以急急乎解释道：“岂敢爱之，畏我父母。”解释了还嫌不足，她索性坦露了自己的心迹：“仲可怀也。”然而她又摄于家庭、舆论的压力，因为“父母之言”、“人之多言”，“亦可畏也”。至此，整个心事和盘托出，希冀求得情人的谅解。短短八句，一波三折，曲尽女子爱和畏的矛盾心理。姚际恒在“岂敢爱之”和“仲可怀也”二句下分别评以一个“岩”字，点出了诗人婉委曲折心理的微妙。\\n将仲子兮！无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言，亦可畏也！\\n将（qiāng），请求。\\n仲子，男子的字。伯、仲、叔、季是兄弟、姊妹的排行，当时女子多以伯、仲、叔称所爱的男子。子，是对男子的美称。仲子犹言“老二”。\\n逾，越、翻越。\\n里，古代二十五家为里。孔疏：“地官遂人云：‘五家为邻，五邻为里。’是二十五家为里也。”凡里皆有墙，这里的“里”实指里墙。\\n折，伤害折断。姚际恒诗经通论引季明德曰：“篇内言‘折’，谓因逾墙而压折，非采折之折。”\\n杞，杞柳。\\n怀，想念，惦记。\\n韵读：之部——子、里、杞、之、母（满以反）。脂部——怀（音回）、畏。\\n将仲子兮！无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言，亦可畏也！\\n墙，院墙。这里指作者所居的院墙。\\n桑，古代墙边种桑。孟子尽心：“五亩之宅，树墙下以桑。”\\n韵读：阳部——墙、桑、兄（虚王反）。脂部——怀、畏。\\n将仲子兮！无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言，亦可畏也！\\n园，古代种树木和果树的场所。毛传：“园，所以树木也。”说文：“园，所以树果也。”徐常吉说：“由逾里而墙而园，仲之来也以渐而迫也。由父母而诸兄而众人，女之畏也以渐而远也。”（传说汇纂）徐氏指出了此诗层递的修辞。\\n韵读：元部——园、檀、言。脂部——怀、畏。\",\"fullText\":\"这是一首女子拒绝情人的诗。她拒绝情人的原因，是怕家庭反对、舆论批评。从她叮嘱情人仲子的语句和仲子敢于逾墙攀树来相会，可以看出她是极爱仲子的。他们之间的感情虽然真挚，但却达不到结婚的目的，这种爱情和礼教的矛盾使她痛苦不安，不得不向情人叮嘱，请他不要再来。诗歌反映了当时婚姻不自由的社会现象。\\n毛序：“将仲子，刺庄公也。不胜其母以害其弟，弟叔失道而公弗制，祭仲谏而公弗听，小不忍以致大乱焉。”三家诗无异议。这是根据左传隐公元年的记载而附会出来的，穿凿太甚，后人多不相信。朱熹引郑樵说：“此淫奔者之辞。”他虽然以卫道者的口吻斥责诗人为“淫奔者”，但毕竟明确指出这是男女情爱之诗，比毛序和三家诗前进了一大步。姚际恒说：“此虽属淫，然女子为此婉转之辞以谢男子，而以父母、诸兄及人言为可畏，大有廉耻，又岂得为淫者哉！”姚氏是反对朱熹之说的，但他虽然为诗中的姑娘脱去了“淫奔者”的帽子，却又给她戴上“大有廉耻”的枷锁，这种说法与朱熹在思想上是伯仲之间，谈不上什么进步。这是我们在分析前人诗学时应加以注意的。\\n这首诗的特点是心理的描写。诗歌囿于篇幅，无法对人物的心理作很细腻的描绘。但是在诗人简炼的语句中，有时候也可以将自己心情表达得颇为尽致。此诗三章全为女子与情人讲话口气，首句“将仲子兮”，一声呼告，十分亲密，已透露那姑娘爱仲子的心情。后两句“无逾我里，无折我树杞”是要求仲子不要再来会面。然而这不是无情的拒绝，她心里还是爱仲子的，虽然回绝了仲子，却又恐怕他误解，所以急急乎解释道：“岂敢爱之，畏我父母。”解释了还嫌不足，她索性坦露了自己的心迹：“仲可怀也。”然而她又摄于家庭、舆论的压力，因为“父母之言”、“人之多言”，“亦可畏也”。至此，整个心事和盘托出，希冀求得情人的谅解。短短八句，一波三折，曲尽女子爱和畏的矛盾心理。姚际恒在“岂敢爱之”和“仲可怀也”二句下分别评以一个“岩”字，点出了诗人婉委曲折心理的微妙。\\n将仲子兮！无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言，亦可畏也！\\n将（qiāng），请求。\\n仲子，男子的字。伯、仲、叔、季是兄弟、姊妹的排行，当时女子多以伯、仲、叔称所爱的男子。子，是对男子的美称。仲子犹言“老二”。\\n逾，越、翻越。\\n里，古代二十五家为里。孔疏：“地官遂人云：‘五家为邻，五邻为里。’是二十五家为里也。”凡里皆有墙，这里的“里”实指里墙。\\n折，伤害折断。姚际恒诗经通论引季明德曰：“篇内言‘折’，谓因逾墙而压折，非采折之折。”\\n杞，杞柳。\\n怀，想念，惦记。\\n韵读：之部——子、里、杞、之、母（满以反）。脂部——怀（音回）、畏。\\n将仲子兮！无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言，亦可畏也！\\n墙，院墙。这里指作者所居的院墙。\\n桑，古代墙边种桑。孟子尽心：“五亩之宅，树墙下以桑。”\\n韵读：阳部——墙、桑、兄（虚王反）。脂部——怀、畏。\\n将仲子兮！无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言，亦可畏也！\\n园，古代种树木和果树的场所。毛传：“园，所以树木也。”说文：“园，所以树果也。”徐常吉说：“由逾里而墙而园，仲之来也以渐而迫也。由父母而诸兄而众人，女之畏也以渐而远也。”（传说汇纂）徐氏指出了此诗层递的修辞。\\n韵读：元部——园、檀、言。脂部——怀、畏。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。\",\"sourceLabel\":\"第 80-81 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。\",\"fullText\":\"將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"諷世以禮自持也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"諷世以禮自持也。\",\"fullText\":\"諷世以禮自持也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《將仲子》三章，章八句。《序》謂「刺莊公不勝其母，以害其弟，祭仲諫而弗聽」，特以詩中有「父母」、「兄弟」、「仲子」等字耳。《集傳》從鄭漁仲説，以爲無與莊公、叔段事，是矣。而又以爲淫奔詩，亦非。蓋女心既有所畏而不從，則不得謂之爲奔，亦不得謂之爲淫。姚氏知其然，仍不能斷。乃曰：「按，此詩言鄭事多不合，以爲淫詩則合。」是其識亦尚游移未定耳。此詩難保非采自民間閭巷，鄙夫婦相愛慕之辭。然其義有合於聖賢守身大道，故太史録之以爲涉世法。夫使人心無所畏，則富貴功名孰非可懷而可愛？惟能以理制其心，斯能以禮慎其守。故或非義之當前，心雖不能無所動，而惕以人言可畏，即父母、兄弟有所不敢欺，則慾念頓消而天理自在。是善於守身法也，而謂之爲惡也得乎？故《左傳》子展如晉賦此詩，而衛侯得歸。使其爲本國淫詩，豈尚舉以自賦而復見許於他國歟？此非淫詞斷可知已。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《將仲子》三章，章八句。《序》謂「刺莊公不勝其母，以害其弟，祭仲諫而弗聽」，特以詩中有「父母」、「兄弟」、「仲子」等字耳。《集傳》從鄭漁仲説，以爲無與莊公、叔段事，是矣。而又以爲淫奔詩，亦非。蓋女心既有所畏而不從，則不得謂之爲奔，亦不得謂之爲淫。姚氏知其然，仍不能斷。乃曰：「按，此詩言鄭事多不合，以爲淫詩則合。」是其識亦尚游移未定耳。此詩難保非采自民間閭巷，鄙夫婦相愛慕之辭。然其義有合於聖賢守身大道，故太史録之以爲涉世法。夫使人心無所畏，則富貴功名孰非可懷而可愛？惟能以理制其心，斯能以禮慎其守。故或非義之當前，心雖不能無所動，而惕以人言可畏，即父母、兄弟有所不敢欺，則慾念頓消而天理自在。是善於守身法也，而謂之爲惡也得乎？故《左傳》子展如晉賦此詩，而衛侯得歸。使其爲本國淫詩，豈尚舉以自賦而復見許於他國歟？此非淫詞斷可知已。\",\"fullText\":\"右《將仲子》三章，章八句。《序》謂「刺莊公不勝其母，以害其弟，祭仲諫而弗聽」，特以詩中有「父母」、「兄弟」、「仲子」等字耳。《集傳》從鄭漁仲説，以爲無與莊公、叔段事，是矣。而又以爲淫奔詩，亦非。蓋女心既有所畏而不從，則不得謂之爲奔，亦不得謂之爲淫。姚氏知其然，仍不能斷。乃曰：「按，此詩言鄭事多不合，以爲淫詩則合。」是其識亦尚游移未定耳。此詩難保非采自民間閭巷，鄙夫婦相愛慕之辭。然其義有合於聖賢守身大道，故太史録之以爲涉世法。夫使人心無所畏，則富貴功名孰非可懷而可愛？惟能以理制其心，斯能以禮慎其守。故或非義之當前，心雖不能無所動，而惕以人言可畏，即父母、兄弟有所不敢欺，則慾念頓消而天理自在。是善於守身法也，而謂之爲惡也得乎？故《左傳》子展如晉賦此詩，而衛侯得歸。使其爲本國淫詩，豈尚舉以自賦而復見許於他國歟？此非淫詞斷可知已。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\ g/poem/076-jiang-zhong-zi/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/076-jiang-zhong-zi/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Tfdb,"])</script><script>self.__next_f.push([1,"这是一首女子拒绝情人的诗。她拒绝情人的原因，是怕家庭反对、舆论批评。从她叮嘱情人仲子的语句和仲子敢于逾墙攀树来相会，可以看出她是极爱仲子的。他们之间的感情虽然真挚，但却达不到结婚的目的，这种爱情和礼教的矛盾使她痛苦不安，不得不向情人叮嘱，请他不要再来。诗歌反映了当时婚姻不自由的社会现象。\n毛序：“将仲子，刺庄公也。不胜其母以害其弟，弟叔失道而公弗制，祭仲谏而公弗听，小不忍以致大乱焉。”三家诗无异议。这是根据左传隐公元年的记载而附会出来的，穿凿太甚，后人多不相信。朱熹引郑樵说：“此淫奔者之辞。”他虽然以卫道者的口吻斥责诗人为“淫奔者”，但毕竟明确指出这是男女情爱之诗，比毛序和三家诗前进了一大步。姚际恒说：“此虽属淫，然女子为此婉转之辞以谢男子，而以父母、诸兄及人言为可畏，大有廉耻，又岂得为淫者哉！”姚氏是反对朱熹之说的，但他虽然为诗中的姑娘脱去了“淫奔者”的帽子，却又给她戴上“大有廉耻”的枷锁，这种说法与朱熹在思想上是伯仲之间，谈不上什么进步。这是我们在分析前人诗学时应加以注意的。\n这首诗的特点是心理的描写。诗歌囿于篇幅，无法对人物的心理作很细腻的描绘。但是在诗人简炼的语句中，有时候也可以将自己心情表达得颇为尽致。此诗三章全为女子与情人讲话口气，首句“将仲子兮”，一声呼告，十分亲密，已透露那姑娘爱仲子的心情。后两句“无逾我里，无折我树杞”是要求仲子不要再来会面。然而这不是无情的拒绝，她心里还是爱仲子的，虽然回绝了仲子，却又恐怕他误解，所以急急乎解释道：“岂敢爱之，畏我父母。”解释了还嫌不足，她索性坦露了自己的心迹：“仲可怀也。”然而她又摄于家庭、舆论的压力，因为“父母之言”、“人之多言”，“亦可畏也”。至此，整个心事和盘托出，希冀求得情人的谅解。短短八句，一波三折，曲尽女子爱和畏的矛盾心理。姚际恒在“岂敢爱之”和“仲可怀也”二句下分别评以一个“岩”字，点出了诗人婉委曲折心理的微妙。\n将仲子兮！无逾我里，无折我树杞。岂敢爱之？畏我父母。仲可怀也，父母之言，亦可畏也！\n将（qiāng），请求。\n仲子，男子的字。伯、仲、叔、季是兄弟、姊妹的排行，当时女子多以伯、仲、叔称所爱的男子。子，是对男子的美称。仲子犹言“老二”。\n逾，越、翻越。\n里，古代二十五家为里。孔疏：“地官遂人云：‘五家为邻，五邻为里。’是二十五家为里也。”凡里皆有墙，这里的“里”实指里墙。\n折，伤害折断。姚际恒诗经通论引季明德曰：“篇内言‘折’，谓因逾墙而压折，非采折之折。”\n杞，杞柳。\n怀，想念，惦记。\n韵读：之部——子、里、杞、之、母（满以反）。脂部——怀（音回）、畏。\n将仲子兮！无逾我墙，无折我树桑。岂敢爱之？畏我诸兄。仲可怀也，诸兄之言，亦可畏也！\n墙，院墙。这里指作者所居的院墙。\n桑，古代墙边种桑。孟子尽心：“五亩之宅，树墙下以桑。”\n韵读：阳部——墙、桑、兄（虚王反）。脂部——怀、畏。\n将仲子兮！无逾我园，无折我树檀。岂敢爱之？畏人之多言。仲可怀也，人之多言，亦可畏也！\n园，古代种树木和果树的场所。毛传：“园，所以树木也。”说文：“园，所以树果也。”徐常吉说：“由逾里而墙而园，仲之来也以渐而迫也。由父母而诸兄而众人，女之畏也以渐而远也。”（传说汇纂）徐氏指出了此诗层递的修辞。\n韵读：元部——园、檀、言。脂部——怀、畏。"])</script><script>self.__next_f.push([1,"23:Tfdb,"])</script><script>self.__next_f.push([1,"这是一首女子拒绝情人的诗。她拒绝情人的原因，是怕家庭反对、舆论批评。从她叮嘱情人仲子的语句和仲子敢于逾墙攀树来相会，可以看出她是极爱仲子的。他们之间的感情虽然真挚，但却达不到结婚的目的，这种爱情和礼教的矛盾使她痛苦不安，不得不向情人叮嘱，请他不要再来。诗歌反映了当时 -021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。\",\"sourceLabel\":\"第 80-81 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。\",\"fullText\":\"將仲子兮，無踰我里，無折我樹杞。豈敢愛之？畏我父母。仲可懷也，父母之言，亦可畏也。將仲子兮，無踰我牆，無折我樹桑。豈敢愛之？畏我諸兄。仲可懷也，諸兄之言，亦可畏也。將仲子兮，無踰我園，無折我樹檀。豈敢愛之？畏人之多言。仲可懷也，人之多言，亦可畏也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"諷世以禮自持也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"諷世以禮自持也。\",\"fullText\":\"諷世以禮自持也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《將仲子》三章，章八句。《序》謂「刺莊公不勝其母，以害其弟，祭仲諫而弗聽」，特以詩中有「父母」、「兄弟」、「仲子」等字耳。《集傳》從鄭漁仲説，以爲無與莊公、叔段事，是矣。而又以爲淫奔詩，亦非。蓋女心既有所畏而不從，則不得謂之爲奔，亦不得謂之爲淫。姚氏知其然，仍不能斷。乃曰：「按，此詩言鄭事多不合，以爲淫詩則合。」是其識亦尚游移未定耳。此詩難保非采自民間閭巷，鄙夫婦相愛慕之辭。然其義有合於聖賢守身大道，故太史録之以爲涉世法。夫使人心無所畏，則富貴功名孰非可懷而可愛？惟能以理制其心，斯能以禮慎其守。故或非義之當前，心雖不能無所動，而惕以人言可畏，即父母、兄弟有所不敢欺，則慾念頓消而天理自在。是善於守身法也，而謂之爲惡也得乎？故《左傳》子展如晉賦此詩，而衛侯得歸。使其爲本國淫詩，豈尚舉以自賦而復見許於他國歟？此非淫詞斷可知已。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《將仲子》三章，章八句。《序》謂「刺莊公不勝其母，以害其弟，祭仲諫而弗聽」，特以詩中有「父母」、「兄弟」、「仲子」等字耳。《集傳》從鄭漁仲説，以爲無與莊公、叔段事，是矣。而又以爲淫奔詩，亦非。蓋女心既有所畏而不從，則不得謂之爲奔，亦不得謂之爲淫。姚氏知其然，仍不能斷。乃曰：「按，此詩言鄭事多不合，以爲淫詩則合。」是其識亦尚游移未定耳。此詩難保非采自民間閭巷，鄙夫婦相愛慕之辭。然其義有合於聖賢守身大道，故太史録之以爲涉世法。夫使人心無所畏，則富貴功名孰非可懷而可愛？惟能以理制其心，斯能以禮慎其守。故或非義之當前，心雖不能無所動，而惕以人言可畏，即父母、兄弟有所不敢欺，則慾念頓消而天理自在。是善於守身法也，而謂之爲惡也得乎？故《左傳》子展如晉賦此詩，而衛侯得歸。使其爲本國淫詩，豈尚舉以自賦而復見許於他國歟？此非淫詞斷可知已。\",\"fullText\":\"右《將仲子》三章，章八句。《序》謂「刺莊公不勝其母，以害其弟，祭仲諫而弗聽」，特以詩中有「父母」、「兄弟」、「仲子」等字耳。《集傳》從鄭漁仲説，以爲無與莊公、叔段事，是矣。而又以爲淫奔詩，亦非。蓋女心既有所畏而不從，則不得謂之爲奔，亦不得謂之爲淫。姚氏知其然，仍不能斷。乃曰：「按，此詩言鄭事多不合，以爲淫詩則合。」是其識亦尚游移未定耳。此詩難保非采自民間閭巷，鄙夫婦相愛慕之辭。然其義有合於聖賢守身大道，故太史録之以爲涉世法。夫使人心無所畏，則富貴功名孰非可懷而可愛？惟能以理制其心，斯能以禮慎其守。故或非義之當前，心雖不能無所動，而惕以人言可畏，即父母、兄弟有所不敢欺，則慾念頓消而天理自在。是善於守身法也，而謂之爲惡也得乎？故《左傳》子展如晉賦此詩，而衛侯得歸。使其爲本國淫詩，豈尚舉以自賦而復見許於他國歟？此非淫詞斷可知已。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/076-jiang-zhong-zi/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"將請也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"將請也。\",\"fullText\":\"將請也。\",\"notes\
