"seg-003","segmentOrder":3,"surfaceText":"月","charStart":3,"charEnd":3,"entryIds":["wangli-yundu:0001-1:part-1"],"materialIds":["wangli-yundu"]},{"id":"seg-004:2-3:采蕭","segmentId":"seg-004","segmentOrder":4,"surfaceText":"采蕭","charStart":2,"charEnd":3,"entryIds":["quwanli-quanshi:0001-1:part-3"],"materialIds":["quwanli-quanshi"]},{"id":"seg-004:3-3:萧","segmentId":"seg-004","segmentOrder":4,"surfaceText":"萧","charStart":3,"charEnd":3,"entryIds":["wangli-yundu:0001-1:part-2"],"materialIds":["wangli-yundu"]},{"id":"seg-004:3-3:蕭","segmentId":"seg-004","segmentOrder":4,"surfaceText":"蕭","charStart":3,"charEnd":3,"entryIds":["quwanli-quanshi:0001-1:part-2"],"materialIds":["quwanli-quanshi"]},{"id":"seg-006:2-3:三秋","segmentId":"seg-006","segmentOrder":6,"surfaceText":"三秋","charStart":2,"charEnd":3,"entryIds":["quwanli-quanshi:0001-1:part-3","wangli-yundu:0001-1:part-3"],"materialIds":["quwanli-quanshi","wangli-yundu"]},{"id":"seg-006:3-3:秋","segmentId":"seg-006","segmentOrder":6,"surfaceText":"秋","charStart":3,"charEnd":3,"entryIds":["wangli-yundu:0001-1:part-2"],"materialIds":["wangli-yundu"]},{"id":"seg-007:2-3:采艾","segmentId":"seg-007","segmentOrder":7,"surfaceText":"采艾","charStart":2,"charEnd":3,"entryIds":["quwanli-quanshi:0001-1:part-3"],"materialIds":["quwanli-quanshi"]},{"id":"seg-007:3-3:艾","segmentId":"seg-007","segmentOrder":7,"surfaceText":"艾","charStart":3,"charEnd":3,"entryIds":["quwanli-quanshi:0001-1:part-2","wangli-yundu:0001-1:part-2"],"materialIds":["quwanli-quanshi","wangli-yundu"]},{"id":"seg-009:2-3:三岁","segmentId":"seg-009","segmentOrder":9,"surfaceText":"三岁","charStart":2,"charEnd":3,"entryIds":["wangli-yundu:0001-1:part-3"],"materialIds":["wangli-yundu"]},{"id":"seg-009:2-3:三歲","segmentId":"seg-009","segmentOrder":9,"surfaceText":"三歲","charStart":2,"charEnd":3,"entryIds":["maruichen-tongshi:0001-1:part-1","quwanli-quanshi:0001-1:part-3"],"materialIds":["maruichen-tongshi","quwanli-quanshi"]},{"id":"seg-009:3-3:岁","segmentId":"seg-009","segmentOrder":9,"surfaceText":"岁","charStart":3,"charEnd":3,"entryIds":["wangli-yundu:0001-1:part-2"],"materialIds":["wangli-yundu"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/072-cai-ge/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"彼采葛兮，一日不见，如三月兮。彼采萧兮，一日不见，如三秋兮。彼采艾兮，一日不见，如三岁兮。","sourceLabel":"第 164-165 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首思念情人的诗。这位情人可能是一位采集植物的姑娘，因为采葛织夏布，采萧供祭祀，采艾以疗疾，这些在当时都是女子的工作。毛序：“采葛，惧谗也。”毛公搞错了诗的主题，还错标诗的第一句为兴句。朱熹纠正毛序的错误，认为这是思念情人的诗，并将第一句改标为赋。但是他却又将这位被思念的情人说成是“淫奔者”，姚际恒斥之为“尤可恨”，实在有道理。\n此诗首章言一日不见如三月，次章言如三秋，末章言如三岁，层层递进，以见其思念之情，久而愈深。这里可注意的是“三秋”二字。作者不用“三春”、“三夏”、“三冬”，而偏用“三秋”，并非偶然。秋日萧瑟，草木摇落，登高望远，临流叹逝，易感别离之怀，最动故人之思。所以用“秋”字较之“春”、“夏”、“冬”更易引起读者形象的想象，以及发自内心的共鸣。前人谓杜甫善于炼字，往往用一字而神理俱出、景物逼肖。此诗用“秋”而不用他字，虽是出于作者直觉，妙手偶得，非刻意锻炼而成，但也有入神造微之妙。“一日不见，如隔三秋”二句，已成后世文人书信中常用的习语了。\n彼采葛兮，一日不见，如三月兮。\n葛，葛藤，其皮制成纤维可织夏布。见葛覃注。\n韵读：祭部——葛（音揭入声）、月。\n彼采萧兮，一日不见，如三秋兮。\n萧，蒿类，有香气，古人在祭祀时杂以脂膏将它点燃，类似后世的香烛。周礼甸师：“祭祀共萧茅。”杜子春注云：“萧，香蒿也。”\n三秋，三个秋季，共九个月。孔疏：“年月四时，时有三月。秋三，谓九月也。”和后代虞世南秋赋“对三秋之爽节”，专指秋季三个月的“三秋”；与王勃滕王阁序“时惟九月，序属三秋”专指秋季九月者不同。\n韵读：幽部——萧（音修）、秋。\n彼采艾兮，一日不见，如三岁兮。\n艾，亦蒿类，艾叶可供药用和针灸用，名医别录称为“医草”。朱熹诗集传：“艾，蒿属，干之可以灸，故采之。”按孟子离娄：“今之欲王者，犹七年之病，求三年之艾也。”赵注：“艾可以灸人病，干久益善，故以为喻。”毛传：“艾所以疗疾。”足见以艾叶针灸治病，其源甚早。\n韵读：祭部——艾（音刈）、岁。","fullText":"这是一首思念情人的诗。这位情人可能是一位采集植物的姑娘，因为采葛织夏布，采萧供祭祀，采艾以疗疾，这些在当时都是女子的工作。毛序：“采葛，惧谗也。”毛公搞错了诗的主题，还错标诗的第一句为兴句。朱熹纠正毛序的错误，认为这是思念情人的诗，并将第一句改标为赋。但是他却又将这位被思念的情人说成是“淫奔者”，姚际恒斥之为“尤可恨”，实在有道理。\n此诗首章言一日不见如三月，次章言如三秋，末章言如三岁，层层递进，以见其思念之情，久而愈深。这里可注意的是“三秋”二字。作者不用“三春”、“三夏”、“三冬”，而偏用“三秋”，并非偶然。秋日萧瑟，草木摇落，登高望远，临流叹逝，易感别离之怀，最动故人之思。所以用“秋”字较之“春”、“夏”、“冬”更易引起读者形象的想象，以及发自内心的共鸣。前人谓杜甫善于炼字，往往用一字而神理俱出、景物逼肖。此诗用“秋”而不用他字，虽是出于作者直觉，妙手偶得，非刻意锻炼而成，但也有入神造微之妙。“一日不见，如隔三秋”二句，已成后世文人书信中常用的习语了。\n彼采葛兮，一日不见，如三月兮。\n葛，葛藤，其皮制成纤维可织夏布。见葛覃注。\n韵读：祭部——葛（音揭入声）、月。\n彼采萧兮，一日不见，如三秋兮。\n萧， 全篇总说","targetText":"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？","fullText":"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"眉評雅韻欲流，遂成千秋佳語。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"眉评","excerpt":"眉評雅韻欲流，遂成千秋佳語。","fullText":"眉評雅韻欲流，遂成千秋佳語。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。","fullText":"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠， \",\"segmentOrder\":9,\"surfaceText\":\"岁\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮，一日不见，如三月兮。彼采萧兮，一日不见，如三秋兮。彼采艾兮，一日不见，如三岁兮。\",\"sourceLabel\":\"第 164-165 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首思念情人的诗。这位情人可能是一位采集植物的姑娘，因为采葛织夏布，采萧供祭祀，采艾以疗疾，这些在当时都是女子的工作。毛序：“采葛，惧谗也。”毛公搞错了诗的主题，还错标诗的第一句为兴句。朱熹纠正毛序的错误，认为这是思念情人的诗，并将第一句改标为赋。但是他却又将这位被思念的情人说成是“淫奔者”，姚际恒斥之为“尤可恨”，实在有道理。\\n此诗首章言一日不见如三月，次章言如三秋，末章言如三岁，层层递进，以见其思念之情，久而愈深。这里可注意的是“三秋”二字。作者不用“三春”、“三夏”、“三冬”，而偏用“三秋”，并非偶然。秋日萧瑟，草木摇落，登高望远，临流叹逝，易感别离之怀，最动故人之思。所以用“秋”字较之“春”、“夏”、“冬”更易引起读者形象的想象，以及发自内心的共鸣。前人谓杜甫善于炼字，往往用一字而神理俱出、景物逼肖。此诗用“秋”而不用他字，虽是出于作者直觉，妙手偶得，非刻意锻炼而成，但也有入神造微之妙。“一日不见，如隔三秋”二句，已成后世文人书信中常用的习语了。\\n彼采葛兮，一日不见，如三月兮。\\n葛，葛藤，其皮制成纤维可织夏布。见葛覃注。\\n韵读：祭部——葛（音揭入声）、月。\\n彼采萧兮，一日不见，如三秋兮。\\n萧，蒿类，有香气，古人在祭祀时杂以脂膏将它点燃，类似后世的香烛。周礼甸师：“祭祀共萧茅。”杜子春注云：“萧，香蒿也。”\\n三秋，三个秋季，共九个月。孔疏：“年月四时，时有三月。秋三，谓九月也。”和后代虞世南秋赋“对三秋之爽节”，专指秋季三个月的“三秋”；与王勃滕王阁序“时惟九月，序属三秋”专指秋季九月者不同。\\n韵读：幽部——萧（音修）、秋。\\n彼采艾兮，一日不见，如三岁兮。\\n艾，亦蒿类，艾叶可供药用和针灸用，名医别录称为“医草”。朱熹诗集传：“艾，蒿属，干之可以灸，故采之。”按孟子离娄：“今之欲王者，犹七年之病，求三年之艾也。”赵注：“艾可以灸人病，干久益善，故以为喻。”毛传：“艾所以疗疾。”足见以艾叶针灸治病，其源甚早。\\n韵读：祭部——艾（音刈）、岁。\",\"fullText\":\"这是一首思念情人的诗。这位情人可能是一位采集植物的姑娘，因为采葛织夏布，采萧供祭祀，采艾以疗疾，这些在当时都是女子的工作。毛序：“采葛，惧谗也。”毛公搞错了诗的主题，还错标诗的第一句为兴句。朱熹纠正毛序的错误，认为这是思念情人的诗，并将第一句改标为赋。但是他却又将这位被思念的情人说成是“淫奔者”，姚际恒斥之为“尤可恨”，实在有道理。\\n此诗首章言一日不见如三月，次章言如三秋，末章言如三岁，层层递进，以见其思念之情，久而愈深。这里可注意的是“三秋”二字。作者不用“三春”、“三夏”、“三冬”，而偏用“三秋”，并非偶然。秋日萧瑟，草木摇落，登高望远，临流叹逝，易感别离之怀，最动故人之思。所以用“秋”字较之“春”、“夏”、“冬”更易引起读者形象的想象，以及发自内心的共鸣。前人谓杜甫善于炼字，往往用一字而神理俱出、景物逼肖。此诗用“秋”而不用他字，虽是出于作者直觉，妙手偶得，非刻意锻炼而成，但也有入神造微之妙。“一日不见，如隔三秋”二句，已成后世文人书信中常用的习语了。\\n彼采葛兮，一日不见，如三月兮。\\n葛，葛藤，其皮制成纤维可织夏布。见葛覃注。\\n韵读：祭部——葛（音揭入声）、月。\\n彼采萧兮，一日不见，如三秋兮。\\n萧，蒿类，有香气，古人在祭祀时杂以脂膏将它点燃，类似后世的香烛。周礼甸师：“祭祀共萧茅。”杜子春注云：“萧，香蒿也。”\\n三秋，三个秋季，共九个月。孔疏：“年月四时，时有三月。秋三，谓九月也。”和后代虞世南秋赋“对三秋之爽节”，专指秋季三个月的“三秋”；与王勃滕王阁序“时惟九月，序属三秋”专指秋季九月者不同。\\n韵读：幽部——萧（音修）、秋。\\n彼采艾兮，一日不见，如三岁兮。\\n艾，亦蒿类，艾叶可供药用和针灸用，名医别录称为“医草”。朱熹诗集传：“艾，蒿属，干之可以灸，故采之。”按孟子离娄：“今之欲王者，犹七年之病，求三年之艾也。”赵注：“艾可以灸人病，干久益善，故以为喻。”毛传：“艾所以疗疾。”足见以艾叶针灸治病，其源甚早。\\n韵读：祭部——艾（音刈）、岁。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮，一日不見，如三月兮。彼采蕭兮，一日不見，如三秋兮。彼采艾兮，一日不見，如三歲兮。\",\"sourceLabel\":\"第 84 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"彼采葛兮，一日不見，如三月兮。彼采蕭兮，一日不見，如三秋兮。彼采艾兮，一日不見，如三歲兮。\",\"fullText\":\"彼采葛兮，一日不見，如三月兮。彼采蕭兮，一日不見，如三秋兮。彼采艾兮，一日不見，如三歲兮。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"采葛㊟懷友也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"采葛㊟懷友也。\",\"fullText\":\"采葛㊟懷友也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？\",\"fullText\":\"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評雅韻欲流，遂成千秋佳語。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評雅韻欲流，遂成千秋佳語。\",\"fullText\":\"眉評雅韻欲流，遂成千秋佳語。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。\",\"fullText\":\"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻葛七曷。月六月。轉韻。蕭二蕭。秋十一尤。叶韻。艾九泰。歲八霽。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻葛七曷。月六月。轉韻。蕭二蕭。秋十一尤。叶韻。艾九泰。歲八霽。通韻。\",\"fullText\":\"標韻葛七曷。月六月。轉韻。蕭二蕭。秋十一尤。叶韻。艾九泰。歲八霽。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"如三歲兮\",\"sourceLabel\":\"第 390 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"三歲\",\"fullText\":\"三歲\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:2-3:三歲\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-009\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮。一日不見，如三月兮。彼采蕭兮。一日不見，如三秋兮。彼采艾兮。一日不見，如三歲兮。\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释《采葛》为男女相思之诗，\",\"fullText\":\"屈万里释《采葛》为男女相思之诗，并据章下注释点出“蕭”为蒿类祭草，“艾”为可灸之蒿属。三章以采葛、采蕭、采艾递换，而“不見”之久则由“三月”推深至“三秋”“三歲”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮。一日不見，如三月兮。彼采蕭兮。一日不見，如三秋兮。彼采艾兮。一日不見，如三歲兮。\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"并据章下注释点出“蕭”为蒿类祭草，“艾”为可灸之蒿属。\",\"fullText\":\"屈万里释《采葛》为男女相思之诗，并据章下注释点出“蕭”为蒿类祭草，“艾”为可灸之蒿属。三章以采葛、采蕭、采艾递换，而“不見”之久则由“三月”推深至“三秋”“三歲”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-004:3-3:蕭\",\"seg-007:3-3:艾\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"quwanli-quanshi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮。一日不見，如三月兮。彼采蕭兮。一日不見，如三秋兮。彼采艾兮。一日不見，如三歲兮。\",\"sou 0001-1:part-1\",\"quwanli-quanshi:0001-1:part-3\"],\"materialIds\":[\"maruichen-tongshi\",\"quwanli-quanshi\"]},{\"id\":\"seg-009:3-3:岁\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"岁\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"wangli-yundu:0001-1:part-2\"],\"materialIds\":[\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮，一日不见，如三月兮。彼采萧兮，一日不见，如三秋兮。彼采艾兮，一日不见，如三岁兮。\",\"sourceLabel\":\"第 164-165 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首思念情人的诗。这位情人可能是一位采集植物的姑娘，因为采葛织夏布，采萧供祭祀，采艾以疗疾，这些在当时都是女子的工作。毛序：“采葛，惧谗也。”毛公搞错了诗的主题，还错标诗的第一句为兴句。朱熹纠正毛序的错误，认为这是思念情人的诗，并将第一句改标为赋。但是他却又将这位被思念的情人说成是“淫奔者”，姚际恒斥之为“尤可恨”，实在有道理。\\n此诗首章言一日不见如三月，次章言如三秋，末章言如三岁，层层递进，以见其思念之情，久而愈深。这里可注意的是“三秋”二字。作者不用“三春”、“三夏”、“三冬”，而偏用“三秋”，并非偶然。秋日萧瑟，草木摇落，登高望远，临流叹逝，易感别离之怀，最动故人之思。所以用“秋”字较之“春”、“夏”、“冬”更易引起读者形象的想象，以及发自内心的共鸣。前人谓杜甫善于炼字，往往用一字而神理俱出、景物逼肖。此诗用“秋”而不用他字，虽是出于作者直觉，妙手偶得，非刻意锻炼而成，但也有入神造微之妙。“一日不见，如隔三秋”二句，已成后世文人书信中常用的习语了。\\n彼采葛兮，一日不见，如三月兮。\\n葛，葛藤，其皮制成纤维可织夏布。见葛覃注。\\n韵读：祭部——葛（音揭入声）、月。\\n彼采萧兮，一日不见，如三秋兮。\\n萧，蒿类，有香气，古人在祭祀时杂以脂膏将它点燃，类似后世的香烛。周礼甸师：“祭祀共萧茅。”杜子春注云：“萧，香蒿也。”\\n三秋，三个秋季，共九个月。孔疏：“年月四时，时有三月。秋三，谓九月也。”和后代虞世南秋赋“对三秋之爽节”，专指秋季三个月的“三秋”；与王勃滕王阁序“时惟九月，序属三秋”专指秋季九月者不同。\\n韵读：幽部——萧（音修）、秋。\\n彼采艾兮，一日不见，如三岁兮。\\n艾，亦蒿类，艾叶可供药用和针灸用，名医别录称为“医草”。朱熹诗集传：“艾，蒿属，干之可以灸，故采之。”按孟子离娄：“今之欲王者，犹七年之病，求三年之艾也。”赵注：“艾可以灸人病，干久益善，故以为喻。”毛传：“艾所以疗疾。”足见以艾叶针灸治病，其源甚早。\\n韵读：祭部——艾（音刈）、岁。\",\"fullText\":\"这是一首思念情人的诗。这位情人可能是一位采集植物的姑娘，因为采葛织夏布，采萧供祭祀，采艾以疗疾，这些在当时都是女子的工作。毛序：“采葛，惧谗也。”毛公搞错了诗的主题，还错标诗的第一句为兴句。朱熹纠正毛序的错误，认为这是思念情人的诗，并将第一句改标为赋。但是他却又将这位被思念的情人说成是“淫奔者”，姚际恒斥之为“尤可恨”，实在有道理。\\n此诗首章言一日不见如三月，次章言如三秋，末章言如三岁，层层递进，以见其思念之情，久而愈深。这里可注意的是“三秋”二字。作者不用“三春”、“三夏”、“三冬”，而偏用“三秋”，并非偶然。秋日萧瑟，草木摇落，登高望远，临流叹逝，易感别离之怀，最动故人之思。所以用“秋”字较之“春”、“夏”、“冬”更易引起读者形象的想象，以及发自内心的共鸣。前人谓杜甫善于炼字，往往用一字而神理俱出、景物逼肖。此诗用“秋”而不用他字，虽是出于作者直觉，妙手偶得，非刻意锻炼而成，但也有入神造微之妙。“一日不见，如隔三秋”二句，已成后世文人书信中常用的习语了。\\n彼采葛兮，一日不见，如三月兮。\\n葛，葛藤，其皮制成纤维可织夏布。见葛覃注。\\n韵读：祭部——葛（音揭入声）、月。\\n彼采萧兮，一日不见，如三秋兮。\\n萧，蒿类，有香气，古人在祭祀时杂以脂膏将它点燃，类似后世的香烛。周礼甸师：“祭祀共萧茅。”杜子春注云：“萧，香蒿也。”\\n三秋，三个秋季，共九个月。孔疏：“年月四时，时有三月。秋三，谓九月也。”和后代虞世南秋赋“对三秋之爽节”，专指秋季三个月的“三秋”；与王勃滕王阁序“时惟九月，序属三秋”专指秋季九月者不同。\\n韵读：幽部——萧（音修）、秋。\\n彼采艾兮，一日不见，如三岁兮。\\n艾，亦蒿类，艾叶可供药用和针灸用，名医别录称为“医草”。朱熹诗集传：“艾，蒿属，干之可以灸，故采之。”按孟子离娄：“今之欲王者，犹七年之病，求三年之艾也。”赵注：“艾可以灸人病，干久益善，故以为喻。”毛传：“艾所以疗疾。”足见以艾叶针灸治病，其源甚早。\\n韵读：祭部——艾（音刈）、岁。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"彼采葛兮，一日不見，如三月兮。彼采蕭兮，一日不見，如三秋兮。彼采艾兮，一日不見，如三歲兮。\",\"sourceLabel\":\"第 84 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"彼采葛兮，一日不見，如三月兮。彼采蕭兮，一日不見，如三秋兮。彼采艾兮，一日不見，如三歲兮。\",\"fullText\":\"彼采葛兮，一日不見，如三月兮。彼采蕭兮，一日不見，如三秋兮。彼采艾兮，一日不見，如三歲兮。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"采葛㊟懷友也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"采葛㊟懷友也。\",\"fullText\":\"采葛㊟懷友也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？\",\"fullText\":\"右《采葛》三章，章三句。此詩明明千古懷友佳章，自《集傳》以爲「淫奔者」所託，遂使天下後世士夫君子，皆不敢有寄懷作也。不知此老何以好爲刻薄之言若是。至《小序》謂爲「懼讒」，尤不足與辯。夫良友情親，如同夫婦，一朝遠别，不勝相思。此正交情濃厚處，故有三月、三秋、三歲之感也。若泛泛相值，轉面頓忘，或市利相交，勢衰即去，豈尚能作此語？故是詩之在衰朝，亦世情之中流砥柱也。而可無存乎？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評雅韻欲流，遂成千秋佳語。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"眉評雅韻欲流，遂成千秋佳語。\",\"fullText\":\"眉評雅韻欲流，遂成千秋佳語。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。\",\"fullText\":\"集釋蕭荻也。〔孔氏穎達曰〕李巡曰：「荻，一名蕭。」陸璣云：「今人所謂荻蒿者是也。」《郊特牲》：「既奠，然後爇蕭合馨香。」是蕭所以供祭祀也。艾蒿屬。〔《爾雅》〕「艾，冰臺」注：艾蒿。〔姚氏際恒曰〕或云艾必三年方可治病，故言「三歲」，雖詩人之意未必如此，然亦巧合，大有思致。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"標韻葛七曷。月六月。轉韻。蕭二蕭。秋十一尤。叶韻。艾九泰。歲八霽。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"標韻葛七曷。月六月。轉韻。蕭二蕭。秋十一尤。叶韻。艾九泰。歲八霽。通韻。\",\"fullText\":\"標韻葛七曷。月六月。轉韻。蕭二蕭。秋十一尤。叶韻。艾九泰。歲八霽。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/072-cai-ge/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"如三歲兮\",\"sourceLabel\":\"第 390 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"按\",\"excerpt\":\"三歲\",\"fullText\":\"三歲\",\"notes\":null,\"partOrder\
