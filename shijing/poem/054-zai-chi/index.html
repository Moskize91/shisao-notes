\",\"segmentId\":\"seg-028\",\"segmentOrder\":28,\"surfaceText\":\"之\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"quwanli-quanshi:0001-1:part-1\",\"wangli-yundu:0001-1:part-4\"],\"materialIds\":[\"quwanli-quanshi\",\"wangli-yundu\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《载驰》题解\",\"sourceLabel\":\"第 115-116 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"程、蒋把《载驰》解释为许穆夫人回漕吊唁卫侯、并向许大夫表明救卫主张的诗，强调“控于大邦，谁因谁极”是全诗主旨。\",\"fullText\":\"程、蒋把《载驰》解释为许穆夫人回漕吊唁卫侯、并向许大夫表明救卫主张的诗，强调“控于大邦，谁因谁极”是全诗主旨。他们从《左传》与王先谦等说出发，主张夫人实已奔至漕邑，而非仅作设想；又据陈奂意见把全诗分为五章，并称其风格沉郁顿挫、层层逼进，最能见许穆夫人的爱国心与识见。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《载驰》题解\",\"sourceLabel\":\"第 115-116 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"他们从《左传》与王先谦等说出发，主张夫人实已奔至漕邑，而非仅作设想；又据陈奂意见把全诗分为五章，并称其风格沉郁顿挫、层层逼进，最能见许穆夫人的爱国心与识见。\",\"fullText\":\"程、蒋把《载驰》解释为许穆夫人回漕吊唁卫侯、并向许大夫表明救卫主张的诗，强调“控于大邦，谁因谁极”是全诗主旨。他们从《左传》与王先谦等说出发，主张夫人实已奔至漕邑，而非仅作设想；又据陈奂意见把全诗分为五章，并称其风格沉郁顿挫、层层逼进，最能见许穆夫人的爱国心与识见。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"载驰载驱，归唁卫侯。驱马悠悠，言至于漕。大夫跋涉，我心则忧。\",\"sourceLabel\":\"第 116-117 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释首章时，详解“载”为发语词兼可作连词，“驰”“驱”是快马加鞭；“唁”是吊人失国，“漕”为卫邑。\",\"fullText\":\"程、蒋释首章时，详解“载”为发语词兼可作连词，“驰”“驱”是快马加鞭；“唁”是吊人失国，“漕”为卫邑。又说“大夫跋涉”既可指追来劝阻许穆夫人的许臣，也可兼通卫大夫奔告亡国消息之义；首章因此奠定全诗忧卫、归唁而又受阻的情境。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:载\",\"seg-001:2-2:驰\",\"seg-001:4-4:驱\",\"seg-002:2-2:唁\",\"seg-004:4-4:漕\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"载驰载驱，归唁卫侯。驱马悠悠，言至于漕。大夫跋涉，我心则忧。\",\"sourceLabel\":\"第 116-117 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"又说“大夫跋涉”既可指追来劝阻许穆夫人的许臣，也可兼通卫大夫奔告亡国消息之义；首章因此奠定全诗忧卫、归唁而又受阻的情境。\",\"fullText\":\"程、蒋释首章时，详解“载”为发语词兼可作连词，“驰”“驱”是快马加鞭；“唁”是吊人失国，“漕”为卫邑。又说“大夫跋涉”既可指追来劝阻许穆夫人的许臣，也可兼通卫大夫奔告亡国消息之义；首章因此奠定全诗忧卫、归唁而又受阻的情境。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:1-4:大夫跋涉\",\"seg-006:4-4:忧\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"既不我嘉，不能旋反。视尔不臧，我思不远。既不我嘉，不能旋济。视尔不臧，我思不閟。\",\"sourceLabel\":\"第 117 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋指出二、三章连续责许人“不我嘉”“不臧”。其中“嘉”为赞同，“旋反”“旋济”皆言返还、渡济；\",\"fullText\":\"程、蒋指出二、三章连续责许人“不我嘉”“不臧”。其中“嘉”为赞同，“旋反”“旋济”皆言返还、渡济；“视”取比较义，“不臧”即不善；“思”解作计谋，“不远”谓并非迂远难行，“不閟”谓其谋并不闭塞。两章重沓写法，正见夫人虽被阻止而忧思不息。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-007:4-4:嘉\",\"seg-009:4-4:臧\",\"seg-008:3-4:旋反\",\"seg-012:3-4:旋济\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"既不我嘉，不能旋反。视尔不臧，我思不远。既不我嘉，不能旋济。视尔不臧，我思不閟。\",\"sourceLabel\":\"第 117 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"“视”取比较义，“不臧”即不善；“思”解作计谋，“不远”谓并非迂远难行，“不閟”谓其谋并不闭塞。\",\"fullText\":\"程、蒋指出二、三章连续责许人“不我嘉”“不臧”。其中“嘉”为赞同，“旋反”“旋济”皆言返还、渡济；“视”取比较义，“不臧”即不善；“思”解作计谋，“不远”谓并非迂远难行，“不閟”谓其谋并不闭塞。两章重沓写法，正见夫人虽被阻止而忧思不息。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-009:1-1:视\",\"seg-010:3-4:不远\",\"seg-014:3-4:不閟\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"既不我嘉，不能旋反。视尔不臧，我思不远。既不我嘉，不能旋济。视尔不臧，我思不閟。\",\"sourceLabel\":\"第 117 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"两章重沓写法，正见夫人虽被阻止而忧思不息。\",\"fullText\":\"程、蒋指出二、三章连续责许人“不我嘉”“不臧”。其中“嘉”为赞同，“旋反”“旋济”皆言返还、渡济；“视”取比较义，“不臧”即不善；“思”解作计谋，“不远”谓并非迂远难行，“不閟”谓其谋并不闭塞。两章重沓写法，正见夫人虽被阻止而忧思不息。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼阿丘，言采其蝱。女子善怀，亦各有行。许人尤之，众稚且狂。\",\"sourceLabel\":\"第 118 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“阿丘”为偏高山坡，“蝱”为可疗郁结的贝母；“女子善怀”即女子多能怀思，“亦各有行”谓各有道理。\",\"fullText\":\"程、蒋释“阿丘”为偏高山坡，“蝱”为可疗郁结的贝母；“女子善怀”即女子多能怀思，“亦各有行”谓各有道理。故“许人尤之，众稚且狂”是夫人反责许人：既不救卫，又拘泥常礼阻其归唁，只见众人幼稚狂妄，不知宗国败亡的非常之变。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:3-4:阿丘\",\"seg-016:4-4:蝱\",\"seg-017:3-4:善怀\",\"seg-018:4-4:行\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼阿丘，言采其蝱。女子善怀，亦各有行。许人尤之，众稚且狂。\",\"sourceLabel\":\"第 118 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"故“许人尤之，众稚且狂”是夫人反责许人：既不救卫，又拘泥常礼阻其归唁，只见众人幼稚狂妄，不知宗国败亡的非常之变。\",\"fullText\":\"程、蒋释“阿丘”为偏高山坡，“蝱”为可疗郁结的贝母；“女子善怀”即女子多能怀思，“亦各有行”谓各有道理。故“许人尤之，众稚且狂”是夫人反责许人：既不救卫，又拘泥常礼阻其归唁，只见众人幼稚狂妄，不知宗国败亡的非常之变。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-019:1-4:许人尤之\",\"seg-020:1-4:众稚且狂\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0005-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野，芃芃其麦。控于大邦，谁因谁极！大夫君子，无我有尤。百尔所思，不如我所之。\",\"sourceLabel\":\"第 118-119 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章中，程、蒋释“芃芃”为麦盛貌，谓夫人见祖国田野麦盛而丧乱无人收割，因而倍增哀痛；\",\"fullText\":\"末章中，程、蒋释“芃芃”为麦盛貌，谓夫人见祖国田野麦盛而丧乱无人收割，因而倍增哀痛；“控”即赴告大邦，“因”为所依，“极”为所至，核心仍在求齐等大国援卫。结末“大夫君子，无我有尤。百尔所思，不如我所之”则转为直接申责，断言许人百般谋议皆不如己见切中要害。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-022:1-2:芃芃\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0005-1:part-2\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0005-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野，芃芃其麦。控于大邦，谁因谁极！大夫君子，无我有尤。百尔所思，不如我所之。\",\"sourceLabel\":\"第 118-119 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"“控”即赴告大邦，“因”为所依，“极”为所至，核心仍在求齐等大国援卫。\",\"fullText\":\"末章中，程、蒋释“芃芃”为麦盛貌，谓夫人见祖国田野麦盛而丧乱无人收割，因而倍增哀痛；“控”即赴告大邦，“因”为所依，“极”为所至，核心仍在求齐等大国援卫。结末“大夫君子，无我有尤。百尔所思，不如我所之”则转为直接申责，断言许人百般谋议皆不如己见切中要害。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-023:1-1:控\",\"seg-024:2-2:因\",\"seg-024:4-4:极\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0005-1:part-3\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0005-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野，芃芃其麦。控于大邦，谁因谁极！大夫君子，无我有尤。百尔所思，不如我所之。\",\"sourceLabel\":\"第 118-119 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"结末“大夫君子，无我有尤。百尔所思，不如我所之”则转为直接申责，断言许人百般谋议皆不如己见切中要害。\",\"fullText\":\"末章中，程、蒋释“芃芃”为麦盛貌，谓夫人见祖国田野麦盛而丧乱无人收割，因而倍增哀痛；“控”即赴告大邦，“因”为所依，“极”为所至，核心仍在求齐等大国援卫。结末“大夫君子，无我有尤。百尔所思，不如我所之”则转为直接申责，断言许人百般谋议皆不如己见切中要害。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-025:1-4:大夫君子\",\"seg-026:4-4:尤\",\"seg-027:1-4:百尔所思\",\"seg-028:1-5:不如我所之\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0006-1:part-1\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0006-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《载驰》五章分章说明\",\"sourceLabel\":\"第 116 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章法\",\"excerpt\":\"程、蒋从陈奂说，把《载驰》定为五章，理由是《左传》赋诗称“载驰之四章”不举卒章，反证全诗尚有第五章。\",\"fullText\":\"程、蒋从陈奂说，把《载驰》定为五章，理由是《左传》赋诗称“载驰之四章”不举卒章，反证全诗尚有第五章。此分章也与他们对全诗情绪推进的理解相合：首章起势，二三章缠绵，四章直抒胸臆，末章斩钉截铁。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0006-1:part-2\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chengjunying-jiangjianyuan-zhuxi/0006-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《载驰》五章分章说明\",\"sourceLabel\":\"第 116 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章法\",\"excerpt\":\"此分章也与他们对全诗情绪推进的理解相合：首章起势，二三章缠绵，四章直抒胸臆，末章斩钉截铁。\",\"fullText\":\"程、蒋从陈奂说，把《载驰》定为五章，理由是《左传》赋诗称“载驰之四章”不举卒章，反证全诗尚有第五章。此分章也与他们对全诗情绪推进的理解相合：首章起势，二三章缠绵，四章直抒胸臆，末章斩钉截铁。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"載馳許穆夫人作也閔其宗國顛覆自傷不能救也\",\"sourceLabel\":\"第 18 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《載馳》，許穆夫人作也。\",\"fullText\":\"序：《載馳》，許穆夫人作也。閔其宗國顛覆，自傷不能救也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"載馳許穆夫人作也閔其宗國顛覆自傷不能救也\",\"sourceLabel\":\"第 18 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"閔其宗國顛覆，自傷不能救也。\",\"fullText\":\"序：《載馳》，許穆夫人作也。閔其宗國顛覆，自傷不能救也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅，歸唁衛侯。驅馬悠悠，言至于漕。大夫跋涉，我心則憂。既不我嘉，不能旋反。視爾不臧，我思不遠。既不我嘉，不能旋濟。視爾不臧，我思不閟。陟彼阿丘，言采其蝱。女子善懷，亦各有行。許人尤之，衆穉且狂。我行其野，芃芃其麥。控于大邦，誰因誰極。大夫君子，無我有尤。百爾所思，不如我所之。\",\"sourceLabel\":\"第 18-20 页\",\"attributionLabel\":\"陳奐\",\"sectionLabel\":null,\"excerpt\":\"陳奐通串《傳》《箋》說，仍以許穆夫人憫衛國顛覆、自傷不能救為全詩宗旨。\",\"fullText\":\"陳奐通串《傳》《箋》說，仍以許穆夫人憫衛國顛覆、自傷不能救為全詩宗旨。首章說夫人本欲馳驅歸衛，至漕而聞大夫跋涉來告，知義不得反，故心憂。次二章承“不我嘉”與“不能旋反、旋濟”申說被止而思衛不已。四章以采蝱、善懷、有行與“許人尤之”相發，見許人不知夫人憂國情切，反以為過。末章則歸結到欲赴告大邦、責許臣籌畫不如己之親往，與小序所言“自傷不能救”相應。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅，歸唁衛侯。驅馬悠悠，言至于漕。大夫跋涉，我心則憂。既不我嘉，不能旋反。視爾不臧，我思不遠。既不我嘉，不能旋濟。視爾不臧，我思不閟。陟彼阿丘，言采其蝱。女子善懷，亦各有行。許人尤之，衆穉且狂。我行其野，芃芃其麥。控于大邦，誰因誰極。大夫君子，無我有尤。百爾所思，不如我所之。\",\"sourceLabel\":\"第 18-20 页\",\"attributionLabel\":\"陳奐\",\"sectionLabel\":null,\"excerpt\":\"首章說夫人本欲馳驅歸衛，至漕而聞大夫跋涉來告，知義不得反，故心憂。次二章承“不我嘉”與“不能旋反、旋濟”申說被止而思衛不已。\",\"fullText\":\"陳奐通串《傳》《箋》說，仍以許穆夫人憫衛國顛覆、自傷不能救為全詩宗旨。首章說夫人本欲馳驅歸衛，至漕而聞大夫跋涉來告，知義不得反，故心憂。次二章承“不我嘉”與“不能旋反、旋濟”申說被止而思衛不已。四章以采蝱、善懷、有行與“許人尤之”相發，見許人不知夫人憂國情切，反以為過。末章則歸結到欲赴告大邦、責許臣籌畫不如己之親往，與小序所言“自傷不能救”相應。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅，歸唁衛侯。驅馬悠悠，言至于漕。大夫跋涉，我心則憂。既不我嘉，不能旋反。視爾不臧，我思不遠。既不我嘉，不能旋濟。視爾不臧，我思不閟。陟彼阿丘，言采其蝱。女子善懷，亦各有行。許人尤之，衆穉且狂。我行其野，芃芃其麥。控于大邦，誰因誰極。大夫君子，無我有尤。百爾所思，不如我所之。\",\"sourceLabel\":\"第 18-20 页\",\"attributionLabel\":\"陳奐\",\"sectionLabel\":null,\"excerpt\":\"四章以采蝱、善懷、有行與“許人尤之”相發，見許人不知夫人憂國情切，反以為過。末章則歸結到欲赴告大邦、責許臣籌畫不如己之親往，與小序所言“自傷不能救”相應。\",\"fullText\":\"陳奐通串《傳》《箋》說，仍以許穆夫人憫衛國顛覆、自傷不能救為全詩宗旨。首章說夫人本欲馳驅歸衛，至漕而聞大夫跋涉來告，知義不得反，故心憂。次二章承“不我嘉”與“不能旋反、旋濟”申說被止而思衛不已。四章以采蝱、善懷、有行與“許人尤之”相發，見許人不知夫人憂國情切，反以為過。末章則歸結到欲赴告大邦、責許臣籌畫不如己之親往，與小序所言“自傷不能救”相應。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"載馳㊟許穆夫人自傷其國不能救衛也\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注径定《載馳》为许穆夫人自伤其国不能救卫之作。\",\"fullText\":\"方玉润题注径定《載馳》为许穆夫人自伤其国不能救卫之作。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅，歸唁衛侯。驅馬悠悠，言至于漕。大夫跋涉，我心則憂。既不我嘉，不能旋反。視而不臧，我思不遠。既不我嘉，不能旋濟。視而不臧，我思不閟。陟彼阿丘，言采其蝱。女子善懷，亦各有行。許人尤之，衆稺且狂。我行其野，芃芃其麥。控于大邦，誰因誰極。大夫君子，無我有尤。百爾所思，不如我所之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总论\",\"excerpt\":\"方玉润力辨《載馳》非许穆夫人仓皇归卫、为许大夫所阻于道中之作，而主张此诗在卫破之后，夫人责许人不能救卫、又不能代为控告大邦，因而自伤。\",\"fullText\":\"方玉润力辨《載馳》非许穆夫人仓皇归卫、为许大夫所阻于道中之作，而主张此诗在卫破之后，夫人责许人不能救卫、又不能代为控告大邦，因而自伤。故他重释“跋涉大夫”为许国代归唁者，“控于大邦，誰因誰極”为全诗主旨，并盛称夫人识见与义愤皆胜许之君臣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-01 不得，故作是詩也。\",\"fullText\":\"序：《載馳》，許穆夫人作也。閔衛之亡，傷許之小，力不能救，思歸唁其兄，又義不得，故作是詩也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅歸唁衛侯驅馬悠悠言至於漕大夫跋涉我心則憂\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"毛传释“載”为辞，“唁”为吊失国，“悠悠”为远貌，“跋涉”分言草行与水行。\",\"fullText\":\"毛传释“載”为辞，“唁”为吊失国，“悠悠”为远貌，“跋涉”分言草行与水行。郑笺则说“載”犹“則”，并以“衛侯”指戴公，谓夫人本愿驱马疾至漕邑归唁，及卫大夫跋涉告难于许，故心以为忧。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:載\",\"seg-002:2-2:唁\",\"seg-003:3-4:悠悠\",\"seg-005:3-4:跋涉\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅歸唁衛侯驅馬悠悠言至於漕大夫跋涉我心則憂\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"郑笺则说“載”犹“則”，并以“衛侯”指戴公，谓夫人本愿驱马疾至漕邑归唁，及卫大夫跋涉告难于许，故心以为忧。\",\"fullText\":\"毛传释“載”为辞，“唁”为吊失国，“悠悠”为远貌，“跋涉”分言草行与水行。郑笺则说“載”犹“則”，并以“衛侯”指戴公，谓夫人本愿驱马疾至漕邑归唁，及卫大夫跋涉告难于许，故心以为忧。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-002:3-4:衛侯\",\"seg-004:4-4:漕\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"既不我嘉不能旋反視爾不臧我思不遠既不我嘉不能旋濟視爾不臧我思不閟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"毛传以“既不我嘉，不能旋反”为夫人之思不能止；又释“濟，止也”“閟，閉也”。\",\"fullText\":\"毛传以“既不我嘉，不能旋反”为夫人之思不能止；又释“濟，止也”“閟，閉也”。郑笺则详解“既”为尽、“嘉”“臧”为善，谓许人尽不善其归唁之意，又不施善道以救卫，故其思归之情终不能止息。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-007:1-4:既不我嘉\",\"seg-008:3-4:旋反\",\"seg-012:4-4:濟\",\"seg-014:4-4:閟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"既不我嘉不能旋反視爾不臧我思不遠既不我嘉不能旋濟視爾不臧我思不閟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"郑笺则详解“既”为尽、“嘉”“臧”为善，谓许人尽不善其归唁之意，又不施善道以救卫，故其思归之情终不能止息。\",\"fullText\":\"毛传以“既不我嘉，不能旋反”为夫人之思不能止；又释“濟，止也”“閟，閉也”。郑笺则详解“既”为尽、“嘉”“臧”为善，谓许人尽不善其归唁之意，又不施善道以救卫，故其思归之情终不能止息。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-007:4-4:嘉\",\"seg-009:4-4:臧\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼阿丘言采其蝱女子善懷亦各有行許人尤之眾穉且狂\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"毛传释“阿丘”为偏高之丘，“蝱”为贝母，“尤”为过，并以“眾穉且狂”指童穉狂进者取一概之义。\",\"fullText\":\"毛传释“阿丘”为偏高之丘，“蝱”为贝母，“尤”为过，并以“眾穉且狂”指童穉狂进者取一概之义。郑笺则借采蝱疗疾比妇人适异国而欲得力以安宗国，又释“善懷”为多思有道，认为许大夫过责夫人，是不知其情切至。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:3-4:阿丘\",\"seg-016:4-4:蝱\",\"seg-019:3-3:尤\",\"seg-020:2-4:穉且狂\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼阿丘言采其蝱女子善懷亦各有行許人尤之眾穉且狂\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"郑笺则借采蝱疗疾比妇人适异国而欲得力以安宗国，又释“善懷”为多思有道，认为许大夫过责夫人，是不知其情切至。\",\"fullText\":\"毛传释“阿丘”为偏高之丘，“蝱”为贝母，“尤”为过，并以“眾穉且狂”指童穉狂进者取一概之义。郑笺则借采蝱疗疾比妇人适异国而欲得力以安宗国，又释“善懷”为多思有道，认为许大夫过责夫人，是不知其情切至。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-017:3-4:善懷\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0005-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野芃芃其麥控于大邦誰因誰極大夫君子無我有尤百爾所思不如我所之\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"毛传释“芃芃”为方盛长貌，“控”为引，“極”为至；\",\"fullText\":\"毛传释“芃芃”为方盛长貌，“控”为引，“極”为至；郑笺则说夫人见卫野麦盛而未收，民将困苦，故欲询问卫侯将由谁援引大国以求救。又以“大夫君子”为许国贤者，末句见夫人自谓其忧思较许人百计更切更厚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-022:1-2:芃芃\",\"seg-023:1-1:控\",\"seg-024:4-4:極\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0005-1:part-2\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0005-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野芃芃其麥控于大邦誰因誰極大夫君子無我有尤百爾所思不如我所之\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"郑笺则说夫人见卫野麦盛而未收，民将困苦，故欲询问卫侯将由谁援引大国以求救。\",\"fullText\":\"毛传释“芃芃”为方盛长貌，“控”为引，“極”为至；郑笺则说夫人见卫野麦盛而未收，民将困苦，故欲询问卫侯将由谁援引大国以求救。又以“大夫君子”为许国贤者，末句见夫人自谓其忧思较许人百计更切更厚。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0005-1:part-3\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0005-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野芃芃其麥控于大邦誰因誰極大夫君子無我有尤百爾所思不如我所之\",\"sourceLabel\":null,\"attributionLabel\":\"毛传、郑笺\",\"sectionLabel\":null,\"excerpt\":\"又以“大夫君子”为许国贤者，末句见夫人自谓其忧思较许人百计更切更厚。\",\"fullText\":\"毛传释“芃芃”为方盛长貌，“控”为引，“極”为至；郑笺则说夫人见卫野麦盛而未收，民将困苦，故欲询问卫侯将由谁援引大国以求救。又以“大夫君子”为许国贤者，末句见夫人自谓其忧思较许人百计更切更厚。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-025:1-4:大夫君子\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0006-1:part-1\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0006-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"載馳五章一章六句二章章四句一章六句一章八句\",\"sourceLabel\":null,\"attributionLabel\":\"孔疏\",\"sectionLabel\":\"章句\",\"excerpt\":\"《毛詩正義》仍以《載馳》为五章：一章六句，二章三章四句，四章六句，卒章八句。\",\"fullText\":\"《毛詩正義》仍以《載馳》为五章：一章六句，二章三章四句，四章六句，卒章八句。孔疏又据《左传》叔孙豹、郑子家赋《載馳》之四章，辨明此诗实有五章，旧说不可轻合。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0006-1:part-2\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/maoheng-zhushu-kr1c0004/0006-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"載馳五章一章六句二章章四句一章六句一章八句\",\"sourceLabel\":null,\"attributionLabel\":\"孔疏\",\"sectionLabel\":\"章句\",\"excerpt\":\"孔疏又据《左传》叔孙豹、郑子家赋《載馳》之四章，辨明此诗实有五章，旧说不可轻合。\",\"fullText\":\"《毛詩正義》仍以《載馳》为五章：一章六句，二章三章四句，四章六句，卒章八句。孔疏又据《左传》叔孙豹、郑子家赋《載馳》之四章，辨明此诗实有五章，旧说不可轻合。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"載馳載驅，歸唁衛侯。驅馬悠悠，言至于漕。大夫跋涉，我心則憂。既不我嘉，不能旋反。視爾不臧，我思不遠。既不我嘉，不能旋濟。視爾不臧，我思不閟。陟彼阿丘，言采其蝱。女子善懷，亦各有行。許人尤之，衆稚且狂。我行其野，芃芃其麥。控于大邦，誰因誰極。大夫君子，無我有尤。百爾所思，不如我所之。\",\"sourceLabel\":\"第 65-66 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里据《诗序》以《載馳》为许穆夫人作，自伤不能救卫，并逐条释“唁”“漕”“跋涉”“嘉”“不臧”“閟”“蝱”“行”“尤”“稚”“芃芃”“控”“因”“極”“百爾”“之”等词。\",\"fullText\":\"屈万里据《诗序》以《載馳》为许穆夫人作，自伤不能救卫，并逐条释“唁”“漕”“跋涉”“嘉”“不臧”“閟”“蝱”“行”“尤”“稚”“芃芃”“控”“因”“極”“百爾”“之”等词。其中“控”引《韩诗》训为赴告，“因”从朱熹说为所依，“極”为至，整体仍指向夫人欲告大邦、而许人阻之的情境。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:2-2:唁\",\"seg-004:4-4:漕\",\"seg-005:3-4:跋涉\",\"seg-007:4-4:嘉\",\"seg-009:3-4:不臧\",\"seg-014:4-4:閟\",\"seg-016:4-4:蝱\",\"seg-018:4-4:行\",\"seg-019:3-3:尤\",\"seg-020:2-2:稚\",\"seg-022:1-2:芃芃\",\"seg-023:1-1:控\",\"seg-024:2-2:因\",\"seg-024:4-4:極\",\"seg-027:1-2:百爾\",\"seg-028:5-5:之\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\",\"anchor-1-8\",\"anchor-1-9\",\"anchor-1-10\",\"anchor-1-11\",\"anchor-1-12\",\"anchor-1-13\",\"anchor-1-14\",\"anchor-1-15\",\"anchor-1-16\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"載馳載驅，歸唁衛侯。驅馬悠悠，言至于漕。大夫跋涉，我心則憂。既不我嘉，不能旋反。視爾不臧，我思不遠。既不我嘉，不能旋濟。視爾不臧，我思不閟。陟彼阿丘，言采其蝱。女子善懷，亦各有行。許人尤之，衆稚且狂。我行其野，芃芃其麥。控于大邦，誰因誰極。大夫君子，無我有尤。百爾所思，不如我所之。\",\"sourceLabel\":\"第 65-66 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"其中“控”引《韩诗》训为赴告，“因”从朱熹说为所依，“極”为至，整体仍指向夫人欲告大邦、而许人阻之的情境。\",\"fullText\":\"屈万里据《诗序》以《載馳》为许穆夫人作，自伤不能救卫，并逐条释“唁”“漕”“跋涉”“嘉”“不臧”“閟”“蝱”“行”“尤”“稚”“芃芃”“控”“因”“極”“百爾”“之”等词。其中“控”引《韩诗》训为赴告，“因”从朱熹说为所依，“極”为至，整体仍指向夫人欲告大邦、而许人阻之的情境。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-023:1-1:控\",\"seg-024:2-2:因\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"wangli-yundu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"载驰载驱，归唁卫侯。驱马悠悠，言至于漕。大夫跋涉，我心则忧。既不我嘉，不能旋反。视尔不臧，我思不远。既不我嘉，不能旋济。视尔不臧，我思不閟。陟彼阿丘，言采其蝱。女子善怀，亦各有行。许人尤之，众稚且狂。我行其野，芃芃其麦。控于大邦，谁因谁极。大夫君子，无我有尤。百尔所思，不如我所之。\",\"sourceLabel\":\"第 168-169 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"王力在页内逐行注音并标韵部：首章“侯、忧”归“侯部”，“悠、漕”归“幽部”；\",\"fullText\":\"王力在页内逐行注音并标韵部：首章“侯、忧”归“侯部”，“悠、漕”归“幽部”；二、三章“反、远”归“元部”，“济、閟”归“脂部”；四章“蝱、行、狂”归“阳部”；末章“麦、极”归“之部”，“尤、思、之”再叶韵。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:4-4:侯\",\"seg-006:4-4:忧\",\"seg-003:3-3:悠\",\"seg-004:4-4:漕\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"w xi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅歸唁衛侯驅馬悠悠言至于漕大夫跋涉我心則憂\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。載、則也。吊失國曰唁。悠悠、遠而未至之貌。草行曰跋、水行曰涉。\",\"fullText\":\"賦也。載、則也。吊失國曰唁。悠悠、遠而未至之貌。草行曰跋、水行曰涉。○宣姜之女爲許穆公夫人。閔衛之亡、馳驅而歸、將以唁衛公於漕邑。未至、而許之大夫有奔走跋涉而來者。夫人知其必將以不可歸之義來告。故心以爲憂也。旣而終不果歸。乃作此詩、以自言其意爾。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:載\",\"seg-002:2-2:唁\",\"seg-003:3-4:悠悠\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"載馳載驅歸唁衛侯驅馬悠悠言至于漕大夫跋涉我心則憂\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○宣姜之女爲許穆公夫人。閔衛之亡、馳驅而歸、將以唁衛公於漕邑。未至、而許之大夫有奔走跋涉而來者。夫人知其必將以不可歸之義來告。故心以爲憂也。旣而終不果歸。乃作此詩、以自言其意爾。\",\"fullText\":\"賦也。載、則也。吊失國曰唁。悠悠、遠而未至之貌。草行曰跋、水行曰涉。○宣姜之女爲許穆公夫人。閔衛之亡、馳驅而歸、將以唁衛公於漕邑。未至、而許之大夫有奔走跋涉而來者。夫人知其必將以不可歸之義來告。故心以爲憂也。旣而終不果歸。乃作此詩、以自言其意爾。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-004:4-4:漕\",\"seg-005:1-2:大夫\",\"seg-006:4-4:憂\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"旣不我嘉不能旋反視爾不臧我思不遠旣不我嘉不能旋濟視爾不臧我思不閟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。嘉·臧、皆善也。遠、猶忘也。濟、渡也。自許歸衛、必有所渡之水也。閟、閉也、止也。言思之不止也。\",\"fullText\":\"賦也。嘉·臧、皆善也。遠、猶忘也。濟、渡也。自許歸衛、必有所渡之水也。閟、閉也、止也。言思之不止也。○言大夫旣至、而果不以我歸爲善、則我亦不能旋反、而濟以至於衛矣。雖視爾不以我爲善、然我之所思、終不能自已也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-007:4-4:嘉\",\"seg-009:4-4:臧\",\"seg-010:4-4:遠\",\"seg-012:4-4:濟\",\"seg-014:4-4:閟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0002-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"旣不我嘉不能旋反視爾不臧我思不遠旣不我嘉不能旋濟視爾不臧我思不閟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○言大夫旣至、而果不以我歸爲善、則我亦不能旋反、而濟以至於衛矣。雖視爾不以我爲善、然我之所思、終不能自已也。\",\"fullText\":\"賦也。嘉·臧、皆善也。遠、猶忘也。濟、渡也。自許歸衛、必有所渡之水也。閟、閉也、止也。言思之不止也。○言大夫旣至、而果不以我歸爲善、則我亦不能旋反、而濟以至於衛矣。雖視爾不以我爲善、然我之所思、終不能自已也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-008:3-4:旋反\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼阿丘言采其蝱女子善懷亦各有行許人尤之衆穉且狂\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。偏高曰、阿丘。蝱、貝母也。主療鬱結之疾。善懷、多憂思也。猶漢書云岸善崩也。行、道。尤、過也。\",\"fullText\":\"賦也。偏高曰、阿丘。蝱、貝母也。主療鬱結之疾。善懷、多憂思也。猶漢書云岸善崩也。行、道。尤、過也。○又言、以其旣不適衛、而思終不止也。故其在塗、或升高、以舒憂想之情、或采蝱、以療鬱結之疾。蓋女子所以善懷者、亦各有道、而許國之衆人以爲過。則亦少不更事、而狂妄之人爾。許人守禮。非穉且狂也。但以其不知己情之切至、而言若是爾。然而卒不敢違焉、則亦豈眞以爲穉且狂哉。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:3-4:阿丘\",\"seg-016:4-4:蝱\",\"seg-017:3-4:善懷\",\"seg-018:4-4:行\",\"seg-019:3-3:尤\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0003-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"陟彼阿丘言采其蝱女子善懷亦各有行許人尤之衆穉且狂\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○又言、以其旣不適衛、而思終不止也。故其在塗、或升高、以舒憂想之情、或采蝱、以療鬱結之疾。蓋女子所以善懷者、亦各有道、而許國之衆人以爲過。則亦少不更事、而狂妄之人爾。許人守禮。非穉且狂也。但以其不知己情之切至、而言若是爾。然而卒不敢違焉、則亦豈眞以爲穉且狂哉。\",\"fullText\":\"賦也。偏高曰、阿丘。蝱、貝母也。主療鬱結之疾。善懷、多憂思也。猶漢書云岸善崩也。行、道。尤、過也。○又言、以其旣不適衛、而思終不止也。故其在塗、或升高、以舒憂想之情、或采蝱、以療鬱結之疾。蓋女子所以善懷者、亦各有道、而許國之衆人以爲過。則亦少不更事、而狂妄之人爾。許人守禮。非穉且狂也。但以其不知己情之切至、而言若是爾。然而卒不敢違焉、則亦豈眞以爲穉且狂哉。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-020:2-4:穉且狂\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0004-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野芃芃其麥控于大邦誰因誰極大夫君子無我有尤百爾所思不如我所之\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。芃芃、麥盛長貌。控、持而告之也。因、如因魏莊子之因。極、至也。大夫、卽跋涉之大夫。君子、謂許國之衆人也。\",\"fullText\":\"賦也。芃芃、麥盛長貌。控、持而告之也。因、如因魏莊子之因。極、至也。大夫、卽跋涉之大夫。君子、謂許國之衆人也。○又言歸途在野、而涉芃芃之麥。又自傷許國之小、而力不能救。故思欲爲之控告于大邦。而又未知其將何所因、而何所至乎。大夫君子、無以我爲有過。雖爾所以處此百方、然不如使我得自盡其心之爲愈也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-022:1-2:芃芃\",\"seg-023:1-1:控\",\"seg-024:2-2:因\",\"seg-024:4-4:極\",\"seg-025:1-2:大夫\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0004-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"我行其野芃芃其麥控于大邦誰因誰極大夫君子無我有尤百爾所思不如我所之\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"○又言歸途在野、而涉芃芃之麥。又自傷許國之小、而力不能救。故思欲爲之控告于大邦。而又未知其將何所因、而何所至乎。大夫君子、無以我爲有過。雖爾所以處此百方、然不如使我得自盡其心之爲愈也。\",\"fullText\":\"賦也。芃芃、麥盛長貌。控、持而告之也。因、如因魏莊子之因。極、至也。大夫、卽跋涉之大夫。君子、謂許國之衆人也。○又言歸途在野、而涉芃芃之麥。又自傷許國之小、而力不能救。故思欲爲之控告于大邦。而又未知其將何所因、而何所至乎。大夫君子、無以我爲有過。雖爾所以處此百方、然不如使我得自盡其心之爲愈也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\",\"seg-025\",\"seg-026\",\"seg-027\",\"seg-028\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/054-zai-chi/zhuxi-shijichuan-kr1c0009/0005-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"載馳四章二章章六句二章章八句\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":\"总说\",\"excerpt\":\"載馳四章。二章章六句。二章章八句。事見春秋傳。舊說、此詩五章、一章六句、二章三章四句、四章六句、五章八句。蘇氏合二章三章以爲一章。按春秋傳、叔孫豹賦載馳之四章、而取其控于大邦、誰因誰極之意。與蘇說合。今從之。范氏曰、先王制禮、父母沒則不得歸寧者、義也。雖國滅君死、不得往赴焉、義重於亡故也。\",\"fullText\":\"載馳四章。二章章六句。二章章八句。事見春秋傳。舊說、此詩五章、一章六句、二章三章四句、四章六句、五章八句。蘇氏合二章三章以爲一章。按春秋傳、叔孫豹賦載馳之四章、而取其控于大邦、誰因誰極之意。與蘇說合。今從之。范氏曰、先王制禮、父母沒則不得歸寧者、義也。雖國滅君死、不得往赴焉、義重於亡故也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"載馳 · 逐字注脚阅读 | 诗骚集注\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"風 · 鄘風 · 汇聚 7 种资料、25 条注脚的《載馳》阅读页。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"3\",{\"name\":\"googlebot\",\"content\":\"index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1\"}],[\"$\",\"link\",\"4\",{\"rel\":\"canonical\",\"href\":\"https://shisao.taozeyu.com/shijing/poem/054-zai-chi/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"載馳 · 逐字注脚阅读\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"風 · 鄘風 · 汇聚 7 种资料、25 条注脚的《載馳》阅读页。\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:url\",\"content\":\"https://shisao.taozeyu.com/shijing/poem/054-zai-chi/\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"載馳 · 逐字注脚阅读\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"風 · 鄘風 · 汇聚 7 种资料、25 条注脚的《載馳》阅读页。\"}],[\"$\",\"link\",\"12\",{\"rel\":\"icon
