,\"targetText\":\"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。清人在消，驷介麃麃。二矛重乔，河上乎逍遥。清人在轴，驷介陶陶。左旋右抽，中军作好。\",\"sourceLabel\":\"第 178-179 页\",\"attributionLabel\":\"程俊英\",\"sectionLabel\":\"题解\",\"excerpt\":\"程俊英、蒋见元解《清人》为讽刺郑国将军高克的诗，\",\"fullText\":\"程俊英、蒋见元解《清人》为讽刺郑国将军高克的诗，谓三章先极写战马强壮、兵器精良，末句乃点出军中嬉戏无备，以反衬高克尸位素餐，而郑文公弃师之失亦寓其中。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:清人\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。清人在消，驷介麃麃。二矛重乔，河上乎逍遥。清人在轴，驷介陶陶。左旋右抽，中军作好。\",\"sourceLabel\":\"第 178-179 页\",\"attributionLabel\":\"程俊英\",\"sectionLabel\":\"题解\",\"excerpt\":\"谓三章先极写战马强壮、兵器精良，\",\"fullText\":\"程俊英、蒋见元解《清人》为讽刺郑国将军高克的诗，谓三章先极写战马强壮、兵器精良，末句乃点出军中嬉戏无备，以反衬高克尸位素餐，而郑文公弃师之失亦寓其中。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。清人在消，驷介麃麃。二矛重乔，河上乎逍遥。清人在轴，驷介陶陶。左旋右抽，中军作好。\",\"sourceLabel\":\"第 178-179 页\",\"attributionLabel\":\"程俊英\",\"sectionLabel\":\"题解\",\"excerpt\":\"末句乃点出军中嬉戏无备，以反衬高克尸位素餐，而郑文公弃师之失亦寓其中。\",\"fullText\":\"程俊英、蒋见元解《清人》为讽刺郑国将军高克的诗，谓三章先极写战马强壮、兵器精良，末句乃点出军中嬉戏无备，以反衬高克尸位素餐，而郑文公弃师之失亦寓其中。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，\",\"fullText\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，謂三章皆先盛寫清邑之師車馬兵器之備，而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:清人\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"謂三章皆先盛寫清邑之師車馬兵器之備，\",\"fullText\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，謂三章皆先盛寫清邑之師車馬兵器之備，而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"fullText\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，謂三章皆先盛寫清邑之師車馬兵器之備，而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":3,\"anchorIds\":[\"seg-004:4-5:翺翔\",\"seg-008:4-5:逍遥\",\"seg-011:1-4:左旋右抽\",\"seg-012:1-4:中軍作好\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉潤論《清人》本《左傳》高克棄師奔陳之事，認爲鄭文公惡高克而使之擁兵在外，實爲召亂之本；\",\"fullText\":\"方玉潤論《清人》本《左傳》高克棄師奔陳之事，認爲鄭文公惡高克而使之擁兵在外，實爲召亂之本；詩中反覆寫「翺翔」「逍遥」「左旋右抽，中軍作好」，正見其軍如同兒戲，故所以刺鄭文公而并及高克。其集釋又釋清、旁旁、重英、麃麃、重喬、陶陶等語。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:清人\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"se  · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，\",\"fullText\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，謂三章皆先盛寫清邑之師車馬兵器之備，而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:清人\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"謂三章皆先盛寫清邑之師車馬兵器之備，\",\"fullText\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，謂三章皆先盛寫清邑之師車馬兵器之備，而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"fullText\":\"陳奐疏《清人》，仍從《序》及《左傳》刺鄭文公棄師之說，謂三章皆先盛寫清邑之師車馬兵器之備，而以「翺翔」「逍遥」「左旋右抽，中軍作好」反見高克徒爲嬉游無備，故足致刺。\",\"notes\":\"依据页图保守整理。\",\"partOrder\":3,\"anchorIds\":[\"seg-004:4-5:翺翔\",\"seg-008:4-5:逍遥\",\"seg-011:1-4:左旋右抽\",\"seg-012:1-4:中軍作好\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉潤論《清人》本《左傳》高克棄師奔陳之事，認爲鄭文公惡高克而使之擁兵在外，實爲召亂之本；\",\"fullText\":\"方玉潤論《清人》本《左傳》高克棄師奔陳之事，認爲鄭文公惡高克而使之擁兵在外，實爲召亂之本；詩中反覆寫「翺翔」「逍遥」「左旋右抽，中軍作好」，正見其軍如同兒戲，故所以刺鄭文公而并及高克。其集釋又釋清、旁旁、重英、麃麃、重喬、陶陶等語。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:清人\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"詩中反覆寫「翺翔」「逍遥」「左旋右抽，中軍作好」，正見其軍如同兒戲，故所以刺鄭文公而并及高克。\",\"fullText\":\"方玉潤論《清人》本《左傳》高克棄師奔陳之事，認爲鄭文公惡高克而使之擁兵在外，實爲召亂之本；詩中反覆寫「翺翔」「逍遥」「左旋右抽，中軍作好」，正見其軍如同兒戲，故所以刺鄭文公而并及高克。其集釋又釋清、旁旁、重英、麃麃、重喬、陶陶等語。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-004:4-5:翺翔\",\"seg-008:4-5:逍遥\",\"seg-011:1-4:左旋右抽\",\"seg-012:1-4:中軍作好\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其集釋又釋清、旁旁、重英、麃麃、重喬、陶陶等語。\",\"fullText\":\"方玉潤論《清人》本《左傳》高克棄師奔陳之事，認爲鄭文公惡高克而使之擁兵在外，實爲召亂之本；詩中反覆寫「翺翔」「逍遥」「左旋右抽，中軍作好」，正見其軍如同兒戲，故所以刺鄭文公而并及高克。其集釋又釋清、旁旁、重英、麃麃、重喬、陶陶等語。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-1:清\",\"seg-002:3-4:旁旁\",\"seg-003:3-4:重英\",\"seg-006:3-4:麃麃\",\"seg-007:3-4:重喬\",\"seg-010:3-4:陶陶\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清
