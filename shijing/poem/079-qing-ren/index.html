dex":3,"text":"作","anchorIds":[]},{"index":4,"text":"好","anchorIds":[]}]}]},"materials":[{"id":"chenhuan-chuanshu","title":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"glossCount":1,"partCount":1},{"id":"wangli-yundu","title":"詩經韻讀","contributorLine":"现代 · 王力","publicationYear":1980,"glossCount":3,"partCount":3},{"id":"quwanli-quanshi","title":"詩經詮釋","contributorLine":"现代 · 屈萬里","publicationYear":1983,"glossCount":16,"partCount":16},{"id":"fangyurun-yuanshi","title":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"glossCount":4,"partCount":4},{"id":"chengjunying-jiangjianyuan-zhuxi","title":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"glossCount":1,"partCount":1}],"stats":{"materialCount":5,"glossCount":25,"anchoredPartCount":0,"overviewPartCount":1},"overview":{"prefaceEntryIds":[],"globalEntryIds":["quwanli-quanshi:0001-1:part-1"]},"focusAnchors":[],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/079-qing-ren/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。清人在消，驷介麃麃。二矛重乔，河上乎逍遥。清人在轴，驷介陶陶。左旋右抽，中军作好。","sourceLabel":"第 178-179 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首讽刺郑国将军高克的诗。春秋闵公二年：“冬，十有二月，狄入卫，郑弃其师。”左传：“郑人恶高克，使帅师次于河上，久而弗召，师溃而归，高克奔陈。郑人为之赋清人。”这便是诗的背景。左传所说赋清人的郑人，据毛序说是公子素。经后人考证，汉书古今人表有公孙素，和郑文公、高克列在上下的位置，当即是公子素。\n诗三章，每章都先极力渲染战马的强壮和武器的精良，末句则点出军中恬然嬉戏、闲散无备的状态。这是一种反衬的写法，形成明显的对比，那么末句不言刺而讽刺之意自见。姚际恒说：“诗人之意微婉如此。”其实这只是诗人的一种表现手法，讽刺的意味还是非常辛辣的。\n清人在彭，驷介旁旁。二矛重英，河上乎翱翔！\n清人，清邑的人，指高克及其军队。清在今河北清丰县西。郦道元水经注：“清池水出清阳亭西南平地，东北流经清阳亭，东南流即清人城也。诗所谓‘清人在彭’。”王先谦集疏：“据易林‘遣人直彭’，知彭亦清邑之人，故率其同邑之众，屯于卫邑彭地。”\n彭，黄河边卫国地名。毛传：“彭，卫之河上，经之郊也。”孔疏：“卫在沮北，河在卫南，恐狄渡河侵卫，故使高克将兵于河上御之。”\n驷介，披着铁甲的四匹马。郑笺：“驷，四马也。”介是甲的假借字。古代战争人与马都披铁甲，以防箭、矛等兵器的击刺。左传僖二十八年杜注：“驷介，四马被甲也。”\n旁旁，马强壮貌。三家诗作騯騯。说文：“騯騯，马盛也。”段玉裁注谓“盛也”当作“盛貌”。三家诗异文与毛诗义同。\n二矛，矛是古兵器，长二丈，末端有尖刃用以击刺。古代每辆战车上都树两支矛，一支用以攻敌，一支备用，故称“二矛”。\n英，饰，指矛柄上刻红色的花纹及染红的羽毛所作的装饰。重英，每支矛都加上两重英饰。\n翱翔，广雅：“翱翔，浮游也。”王念孙疏证：“翔，古读若羊，翱翔，双声字也。”这里形容兵士们驾着战车游逛。\n韵读：阳部——彭（音旁）、旁、英（音央）、翔。\n清人在消，驷介麃麃。二矛重乔，河上乎逍遥。\n消，黄河边郑国地名。\n麃麃（biāo），威武貌。陈奂传疏：“酌鸨：‘麃麃，武貌。’麃，骠声转义通。”\n乔，韩诗作鷮。乔是鷮的假借字，鷮是长尾野鸡。此处指将鷮羽挂在矛柄及矛头有刃处作为装饰（从范家相诗沈说）。\n逍遥，游玩。文选南都赋注引韩诗：“逍遥，游也。”\n韵读：宵部——消、麃、乔、遥。\n清人在轴，驷介陶陶。左旋右抽，中军作好。\n轴，黄河边郑国地名。按上章的消与这章的轴究在何处，已不可考。\n陶陶，是駣、韬的假借字。说文：“駣，马行貌。”\n左旋右抽，练习击刺貌，指身体向左边旋转，用右手抽出刀剑。三家诗抽作搯。说文：“搯者，拔兵刃以习击刺。诗曰：左旋右搯。”\n中军，古代军队分上、中、下三军，中军的将官为主帅，这里指高克（从闻一多说）。毛传释中军为军中，亦通。\n作好，毛传：“居军中为容好。”陈奂传疏：“容，仪容也。传释经‘作好’为‘为容好’，唯是讲习兵事而已，与上两章翱翔、逍遥同意。”这两句意为，高克转身抽刀，只是做做练武的姿态，并非真正抵御敌人。\n韵读：幽部——轴、陶（徒愁反）、抽、好（呼受反）。","fullText":"这是一首讽刺郑国将军高克的诗。春秋闵公二年：“冬，十有二月，狄入卫，郑弃其师。”左传：“郑人恶高克，使帅师次于河上，久而弗召，师溃而归，高克奔陈。郑人为之赋清人。”这便是诗的背景。左传所说赋清人的郑人，据毛序说是公子素。经后人考证，汉书古今人表有公孙素，和郑文公、高克列在上下的位置，当即是公子素。\n诗三章，每章都先极力渲染战马的强壮和武器的精良，末句则点出军中恬然嬉戏、闲散无备的状态。这是一种反衬的写法，形成明显的对比，那么末句不言刺而讽刺之意自见。姚际恒说：“诗人之意微婉如此。”其实这只是诗人的一种表现手法，讽刺的意味还是非常辛辣的。\n清人在彭，驷介旁旁。二矛重英，河上乎翱翔！\n清人，清邑的人，指高克及其军队。清在今河北清丰县西。郦道元水经注：“清池水出清阳亭西南平地，东北流经清阳亭，东南流即清人城也。诗所谓‘清人在彭’。”王先谦集疏：“据易林‘遣人直彭’，知彭亦清邑之人，故率其同邑之众，屯于卫邑彭地。”\n彭，黄河边卫国地名。毛传：“彭，卫之河上，经之郊也。”孔疏：“卫在沮北，河在卫南，恐狄渡河侵卫，故使高克将兵于河上御之。”\n驷介，披着铁甲的四匹马。郑笺：“驷，四马也。”介是甲的假借字。古代战争人与马都披铁甲，以防箭、矛等兵器的击刺。左传僖二十八年杜注：“驷介，四马被甲也。”\n旁旁，马强壮貌。三家诗作騯騯。说文：“騯騯，马盛也。”段玉裁注谓“盛也”当作“盛貌”。三家诗异文与毛诗义同。\n二矛，矛是古兵器，长二丈，末端有尖刃用以击刺。古代每辆战车上都树两支矛，一支用以攻敌，一支备用，故称“二矛”。\n英，饰，指矛柄上刻红色的花纹及染红的羽毛所作的装饰。重英，每支矛都加上两重英饰。\n翱翔，广雅：“翱翔，浮游也。”王念孙疏证：“翔，古读若羊，翱翔，双声字也。”这里形容兵士们驾着战车游逛。\n韵读：阳部——彭（音旁）、旁、英（音央）、翔。\n清人在消，驷介麃麃。二矛重乔，河上乎逍遥。\n消，黄河边郑国地名。\n麃麃（biāo），威武貌。陈奂传疏：“酌鸨：‘麃麃，武貌。’麃，骠声转义通。”\n乔，韩诗作鷮。乔是鷮的假借字，鷮是长尾野鸡。此处指将鷮羽挂在矛柄及矛头有刃处作为装饰（从范家相诗沈说）。\n逍遥，游玩。文选南都赋注引韩诗：“逍遥，游也。”\n韵读：宵部——消、麃、乔、遥。\n清人在轴，驷介陶陶。左旋右抽，中军作好。\n轴，黄河边郑国地名。按上章的消与这章的轴究在何处，已不可考。\n陶陶，是駣、韬的假借字。说文：“駣，马行貌。”\n左旋右抽，练习击刺貌，指身体向左边旋转，用右手抽出刀剑。三家诗抽作搯。说文：“搯者，拔兵刃以习击刺。诗曰：左旋右搯。”\n中军，古代军队分上、中、下三军，中军的将官为主帅，这里指高克（从闻一多说）。毛传释中军为军中，亦通。\n作好，毛传：“居军中为容好。”陈奂传疏：“容，仪容也。传释经‘作好’为‘为容好’，唯是讲习兵事而已，与上两章翱翔、逍遥同意。”这两句意为，高克转身抽刀，只是做做练武的姿态，并非真正抵御敌人。\n韵读：幽部——轴、陶（徒愁反）、抽、好（呼受反）。", 必不然也，若文公者則不能無所議焉。故刺之。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。","fullText":"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"集释","excerpt":"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。","fullText":"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLabel":"字词注","targetText":"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。 0001-1:part-1\",\"quwanli-quanshi:0015-1:part-1\",\"quwanli-quanshi:0016-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"中\",\"anchorIds\":[]},{\"index\":2,\"text\":\"軍\",\"anchorIds\":[]},{\"index\":3,\"text\":\"作\",\"anchorIds\":[]},{\"index\":4,\"text\":\"好\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":16,\"partCount\":16},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":5,\"glossCount\":25,\"anchoredPartCount\":0,\"overviewPartCount\":1},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。清人在消，驷介麃麃。二矛重乔，河上乎逍遥。清人在轴，驷介陶陶。左旋右抽，中军作好。\",\"sourceLabel\":\"第 178-179 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首讽刺郑国将军高克的诗。春秋闵公二年：“冬，十有二月，狄入卫，郑弃其师。”左传：“郑人恶高克，使帅师次于河上，久而弗召，师溃而归，高克奔陈。郑人为之赋清人。”这便是诗的背景。左传所说赋清人的郑人，据毛序说是公子素。经后人考证，汉书古今人表有公孙素，和郑文公、高克列在上下的位置，当即是公子素。\\n诗三章，每章都先极力渲染战马的强壮和武器的精良，末句则点出军中恬然嬉戏、闲散无备的状态。这是一种反衬的写法，形成明显的对比，那么末句不言刺而讽刺之意自见。姚际恒说：“诗人之意微婉如此。”其实这只是诗人的一种表现手法，讽刺的意味还是非常辛辣的。\\n清人在彭，驷介旁旁。二矛重英，河上乎翱翔！\\n清人，清邑的人，指高克及其军队。清在今河北清丰县西。郦道元水经注：“清池水出清阳亭西南平地，东北流经清阳亭，东南流即清人城也。诗所谓‘清人在彭’。”王先谦集疏：“据易林‘遣人直彭’，知彭亦清邑之人，故率其同邑之众，屯于卫邑彭地。”\\n彭，黄河边卫国地名。毛传：“彭，卫之河上，经之郊也。”孔疏：“卫在沮北，河在卫南，恐狄渡河侵卫，故使高克将兵于河上御之。”\\n驷介，披着铁甲的四匹马。郑笺：“驷，四马也。”介是甲的假借字。古代战争人与马都披铁甲，以防箭、矛等兵器的击刺。左传僖二十八年杜注：“驷介，四马被甲也。”\\n旁旁，马强壮貌。三家诗作騯騯。说文：“騯騯，马盛也。”段玉裁注谓“盛也”当作“盛貌”。三家诗异文与毛诗义同。\\n二矛，矛是古兵器，长二丈，末端有尖刃用以击刺。古代每辆战车上都树两支矛，一支用以攻敌，一支备用，故称“二矛”。\\n英，饰，指矛柄上刻红色的花纹及染红的羽毛所作的装饰。重英，每支矛都加上两重英饰。\\n翱翔，广雅：“翱翔，浮游也。”王念孙疏证：“翔，古读若羊，翱翔，双声字也。”这里形容兵士们驾着战车游逛。\\n韵读：阳部——彭（音旁）、旁、英（音央）、翔。\\n清人在消，驷介麃麃。二矛重乔，河上乎逍遥。\\n消，黄河边郑国地名。\\n麃麃（biāo），威武貌。陈奂传疏：“酌鸨：‘麃麃，武貌。’麃，骠声转义通。”\\n乔，韩诗作鷮。乔是鷮的假借字，鷮是长尾野鸡。此处指将鷮羽挂在矛柄及矛头有刃处作为装饰（从范家相诗沈说）。\\n逍遥，游玩。文选南都赋注引韩诗：“逍遥，游也。”\\n韵读：宵部——消、麃、乔、遥。\\n清人在轴，驷介陶陶。左旋右抽，中军作好。\\n轴，黄河边郑国地名。按上章的消与这章的轴究在何处，已不可考。\\n陶陶，是駣、韬的假借字。说文：“駣，马行貌。”\\n左旋右抽，练习击刺貌，指身体向左边旋转，用右手抽出刀剑。三家诗抽作搯。说文：“搯者，拔兵刃以习击刺。诗曰：左旋右搯。”\\n中军，古代军队分上、中、下三军，中军的将官为主帅，这里指高克（从闻一多说）。毛传释中军为军中，亦通。\\n作好，毛传：“居军中为容好。”陈奂传疏：“容，仪容也。传释经‘作好’为‘为容好’，唯是讲习兵事而已，与上两章翱翔、逍遥同意。”这两句意为，高克转身抽刀，只是做做练武的姿态，并非真正抵御敌人。\\n韵读：幽部——轴、陶（徒愁反）、抽、好（呼受反）。\",\"fullText\":\"这是一首讽刺郑国将军高克的诗。春秋闵公二年：“冬，十有二月，狄入卫，郑弃其师。”左传：“郑人恶高克，使帅师次于河上，久而弗召，师溃而归，高克奔陈。郑人为之赋清人。”这便是诗的背景。左传所说赋清人的郑人，据毛序说是公子素。经后人考证，汉书古今人表有公孙素，和郑文公、高克列在上下的位置，当即是公子素。\\n诗三章，每章都先极力渲染战马的强壮和武器的精良，末句则点出军中恬然嬉戏、闲散无备的状态。这是一种反衬的写法，形成明显的对比，那么末句不言刺而讽刺之意自见。姚际恒说：“诗人之意微婉如此。”其实这只是诗人的一种表现手法，讽刺的意味还是非常辛辣的。\\n清人在彭，驷介旁旁。二矛重英，河上乎翱翔！\\n清人，清邑的人，指高克及其军队。清在今河北清丰县西。郦道元水经注：“清池水出清阳亭西南平地，东北流经清阳亭，东南流即清人城也。诗所谓‘清人在彭’。”王先谦集疏：“据易林‘遣人直彭’，知彭亦清邑之人，故率其同邑之众，屯于卫邑彭地。”\\n彭，黄河边卫国地名。毛传：“彭，卫之河上，经之郊也。”孔疏：“卫在沮北，河在卫南，恐狄渡河侵卫，故使高克将兵于河上御之。”\\n驷介，披着铁甲的四匹马。郑笺：“驷，四马也。”介是甲的假借字。古代战争人与马都披铁甲，以防箭、矛等兵器的击刺。左传僖二十八年杜注：“驷介，四马被甲也。”\\n旁旁，马强壮貌。三家诗作騯騯。说文：“騯騯，马盛也。”段玉裁注谓“盛也”当作“盛貌”。三家诗异文与毛诗义同。\\n二矛，矛是古兵器，长二丈，末端有尖刃用以击刺。古代每辆战车上都树两支矛，一支用以攻敌，一支备用，故称“二矛”。\\n英，饰，指矛柄上刻红色的花纹及染红的羽毛所作的装饰。重英，每支矛都加上两重英饰。\\n翱翔，广雅：“翱翔，浮游也。”王念孙疏证：“翔，古读若羊，翱翔，双声字也。”这里形容兵士们驾着战车游逛。\\n韵读：阳部——彭（音旁）、旁、英（音央）、翔。\\n清人在消，驷介麃麃。二矛重乔，河上乎逍遥。\\n消，黄河边郑国地名。\\n麃麃（biāo），威武貌。陈奂传疏：“酌鸨：‘麃麃，武貌。’麃，骠声转义通。”\\n乔，韩诗作鷮。乔是鷮的假借字，鷮是长尾野鸡。此处指将鷮羽挂在矛柄及矛头有刃处作为装饰（从范家相诗沈说）。\\n逍遥，游玩。文选南都赋注引韩诗：“逍遥，游也。”\\n韵读：宵部——消、麃、乔、遥。\\n清人在轴，驷介陶陶。左旋右抽，中军作好。\\n轴，黄河边郑国地名。按上章的消与这章的轴究在何处，已不可考。\\n陶陶，是駣、韬的假借字。说文：“駣，马行貌。”\\n左旋右抽，练习击刺貌，指身体向左边旋转，用右手抽出刀剑。三家诗抽作搯。说文：“搯者，拔兵刃以习击刺。诗曰：左旋右搯。”\\n中军，古代军队分上、中、下三军，中军的将官为主帅，这里指高克（从闻一多说）。毛传释中军为军中，亦通。\\n作好，毛传：“居军中为容好。”陈奂传疏：“容，仪容也。传释经‘作好’为‘为容好’，唯是讲习兵事而已，与上两章翱翔、逍遥同意。”这两句意为，高克转身抽刀，只是做做练武的姿态，并非真正抵御敌人。\\n韵读：幽部——轴、陶（徒愁反）、抽、好（呼受反）。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"fullText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"刺鄭文公棄其師也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺鄭文公棄其師也。\",\"fullText\":\"刺鄭文公棄其師也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。\",\"fullText\":\"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。\",\"fullText\":\"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。陶四豪，叶徒侯反。抽十一尤，叶輟救反。好二十號。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。陶四豪，叶徒侯反。抽十一尤，叶輟救反。好二十號。叶韻。\",\"fullText\":\"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。陶四豪，叶徒侯反。抽十一尤，叶輟救反。好二十號。叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《春秋•閔公二年》：“冬，十有二月，狄入衛，鄭棄其師。”《左傳》：“鄭人惡高克，使帥師次於河上（以禦狄也），久而不召，師潰而歸。高克奔陳。鄭人爲之賦《清人》。”\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"《春秋•閔公二年》：“冬，十有二月，狄入衛，鄭棄其師。”《左傳》：“鄭人惡高克，使帥師次於河上（以禦狄也），久而不召，師潰而歸。高克奔陳。鄭人爲之賦《清人》。”\",\"fullText\":\"《春秋•閔公二年》：“冬，十有二月，狄入衛，鄭棄其師。”《左傳》：“鄭人惡高克，使帥師次於河上（以禦狄也），久而不召，師潰而歸。高克奔陳。鄭人爲之賦《清人》。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭清人在消清人在軸\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"清，鄭邑名，在今河南中牟縣西。清人，清邑之人，高克所帥者也。\",\"fullText\":\"清，鄭邑名，在今河南中牟縣西。清人，清邑之人，高克所帥者也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-005\",\"seg-009\"]},{\"id\":\"quwanli-quanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0003-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"彭，亦鄭邑名，後入衛爲彌子瑕之采邑。其地約當延津、滑二縣境，臨黄河。朱右曾說。\",\"fullText\":\"彭，亦鄭邑名，後入衛爲彌子瑕之采邑。其地約當延津、滑二縣境，臨黄河。朱右曾說。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\"]},{\"id\":\"quwanli-quanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0004-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介旁旁駟介麃麃駟介陶陶\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"駟，四馬；介，甲也。駟介，四馬皆被甲也。\",\"fullText\":\"駟，四馬；介，甲也。駟介，四馬皆被甲也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-002\",\"seg-006\",\"seg-010\"]},{\"id\":\"quwanli-quanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0005-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介旁旁\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"旁旁，即《小雅•北山》及《大雅•烝民》《韓奕》二篇之“彭彭”，盛貌。馬瑞辰說。\",\"fullText\":\"旁旁，即《小雅•北山》及《大雅•烝民》《韓奕》二篇之“彭彭”，盛貌。馬瑞辰說。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-002\"]},{\"id\":\"quwanli-quanshi:0006-1:part-1\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0006-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"二矛重英\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"二矛，酋矛有二也。舊謂酋矛及夷矛，非是。英，畫飾也。蓋刻矛柄而以朱畫之也。重英，謂一矛重飾；二矛重英，謂兩矛皆重其英飾也。或謂二矛長短不同，故其飾重累。非是。馬瑞辰有說。【酋矛長二丈，夷矛長三尋。】\",\"fullText\":\"二矛，酋矛有二也。舊謂酋矛及夷矛，非是。英，畫飾也。蓋刻矛柄而以朱畫之也。重英，謂一矛重飾；二矛重英，謂兩矛皆重其英飾也。或謂二矛長短不同，故其飾重累。非是。馬瑞辰有說。【酋矛長二丈，夷矛長三尋。】\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-003\"]},{\"id\":\"quwanli-quanshi:0007-1:part-1\",\"annotationId\":\"0007\",\"glossId\":\"0007-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0007-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"河上乎翺翔\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"翺翔，猶遨遊也。\",\"fullText\":\"翺翔，猶遨遊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-004\"]},{\"id\":\"quwanli-quanshi:0008-1:part-1\",\"annotationId\":\"0008\",\"glossId\":\"0008-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0008-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在消\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"消，亦河上地名。\",\"fullText\":\"消，亦河上地名。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\"]},{\"id\":\"quwanli-quanshi:0009-1:part-1\",\"annotationId\":\"0009\",\"glossId\":\"0009-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0009-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介麃麃\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"麃麃，武貌。\",\"fullText\":\"麃麃，武貌。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-006\"]},{\"id\":\"quwanli-quanshi:0010-1:part-1\",\"annotationId\":\"0010\",\"glossId\":\"0010-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0010-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"二矛重喬\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"喬，鷮之省（《韓詩》作鷮），雉之一種。矛柄近上及矛頭受刃處，皆懸毛羽，即以鷮羽爲之。上下重飾，故日重喬。馬瑞辰説。\",\"fullText\":\"喬，鷮之省（《韓詩》作鷮），雉之一種。矛柄近上及矛頭受刃處，皆懸毛羽，即以鷮羽爲之。上下重飾，故日重喬。馬瑞辰説。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\"]},{\"id\":\"quwanli-quanshi:0011-1:part-1\",\"annotationId\":\"0011\",\"glossId\":\"0011-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0011-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"河上乎逍遥\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"逍遥，優遊也。\",\"fullText\":\"逍遥，優遊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-008\"]},{\"id\":\"quwanli-quanshi:0012-1:part-1\",\"annotationId\":\"0012\",\"glossId\":\"0012-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0012-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在軸\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"軸，亦河上地名。\",\"fullText\":\"軸，亦河上地名。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\"]},{\"id\":\"quwanli-quanshi:0013-1:part-1\",\"annotationId\":\"0013\",\"glossId\":\"0013-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0013-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介陶陶\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"陶陶，和樂貌。義見《王風•君子陽陽》毛傳。\",\"fullText\":\"陶陶，和樂貌。義見《王風•君子陽陽》毛傳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-010\"]},{\"id\":\"quwanli-quanshi:0014-1:part-1\",\"annotationId\":\"0014\",\"glossId\":\"0014-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0014-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"左旋右抽\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"馬瑞辰云：“《說文》：‘旋，周旋，旗之指麾也。’古者將執旗鼓。⋯⋯左旋者，謂將左手執旗指麾以相周旋，教其坐作進退之節。•⋯非謂御者旋車也。抽，通作搯。《說文》：‘搯者，拔兵刃以習擊刺也。’引《詩》‘左旋右搯’。蓋本三家《詩》。言“拔兵刃’，則所該者廣，不得如傳云‘抽矢’已也。左旋、右抽，皆即將在軍中作容好之事耳。”\",\"fullText\":\"馬瑞辰云：“《說文》：‘旋，周旋，旗之指麾也。’古者將執旗鼓。⋯⋯左旋者，謂將左手執旗指麾以相周旋，教其坐作進退之節。•⋯非謂御者旋車也。抽，通作搯。《說文》：‘搯者，拔兵刃以習擊刺也。’引《詩》‘左旋右搯’。蓋本三家《詩》。言“拔兵刃’，則所該者廣，不得如傳云‘抽矢’已也。左旋、右抽，皆即將在軍中作容好之事耳。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-011\"]},{\"id\":\"quwanli-quanshi:0015-1:part-1\",\"annotationId\":\"0015\",\"glossId\":\"0015-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0015-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"中軍作好\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"中軍，軍中也。馬瑞辰說。\",\"fullText\":\"中軍，軍中也。馬瑞辰說。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-012\"]},{\"id\":\"quwanli-quanshi:0016-1:part-1\",\"annotationId\":\"0016\",\"glossId\":\"0016-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0016-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"中軍作好\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"好，讀去聲，義猶樂也。\",\"fullText\":\"好，讀去聲，義猶樂也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-012\"]},{\"id\":\"wangli-yundu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。\",\"sourceLabel\":\"第 185 页\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"清人在彭(beang 资料、25 条注脚的《清人》阅读页。\",\"inLanguage\":\"zh-Hans\",\"isPartOf\":{\"@id\":\"https://shisao.taozeyu.com/shijing/#website\"},\"breadcrumb\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/079-qing-ren/#breadcrumb\"},\"mainEntity\":{\"@id\":\"https://shisao.taozeyu.com/shijing/poem/079-qing-ren/#poem\"}}]}"])</script><script>self.__next_f.push([1,"1e:[\"$\",\"script\",null,{\"id\":\"__SHIJING_POEM_STRUCTURED_DATA__\",\"type\":\"application/ld+json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$20\"}}]\n22:Te7a,"])</script><script>self.__next_f.push([1,"这是一首讽刺郑国将军高克的诗。春秋闵公二年：“冬，十有二月，狄入卫，郑弃其师。”左传：“郑人恶高克，使帅师次于河上，久而弗召，师溃而归，高克奔陈。郑人为之赋清人。”这便是诗的背景。左传所说赋清人的郑人，据毛序说是公子素。经后人考证，汉书古今人表有公孙素，和郑文公、高克列在上下的位置，当即是公子素。\n诗三章，每章都先极力渲染战马的强壮和武器的精良，末句则点出军中恬然嬉戏、闲散无备的状态。这是一种反衬的写法，形成明显的对比，那么末句不言刺而讽刺之意自见。姚际恒说：“诗人之意微婉如此。”其实这只是诗人的一种表现手法，讽刺的意味还是非常辛辣的。\n清人在彭，驷介旁旁。二矛重英，河上乎翱翔！\n清人，清邑的人，指高克及其军队。清在今河北清丰县西。郦道元水经注：“清池水出清阳亭西南平地，东北流经清阳亭，东南流即清人城也。诗所谓‘清人在彭’。”王先谦集疏：“据易林‘遣人直彭’，知彭亦清邑之人，故率其同邑之众，屯于卫邑彭地。”\n彭，黄河边卫国地名。毛传：“彭，卫之河上，经之郊也。”孔疏：“卫在沮北，河在卫南，恐狄渡河侵卫，故使高克将兵于河上御之。”\n驷介，披着铁甲的四匹马。郑笺：“驷，四马也。”介是甲的假借字。古代战争人与马都披铁甲，以防箭、矛等兵器的击刺。左传僖二十八年杜注：“驷介，四马被甲也。”\n旁旁，马强壮貌。三家诗作騯騯。说文：“騯騯，马盛也。”段玉裁注谓“盛也”当作“盛貌”。三家诗异文与毛诗义同。\n二矛，矛是古兵器，长二丈，末端有尖刃用以击刺。古代每辆战车上都树两支矛，一支用以攻敌，一支备用，故称“二矛”。\n英，饰，指矛柄上刻红色的花纹及染红的羽毛所作的装饰。重英，每支矛都加上两重英饰。\n翱翔，广雅：“翱翔，浮游也。”王念孙疏证：“翔，古读若羊，翱翔，双声字也。”这里形容兵士们驾着战车游逛。\n韵读：阳部——彭（音旁）、旁、英（音央）、翔。\n清人在消，驷介麃麃。二矛重乔，河上乎逍遥。\n消，黄河边郑国地名。\n麃麃（biāo），威武貌。陈奂传疏：“酌鸨：‘麃麃，武貌。’麃，骠声转义通。”\n乔，韩诗作鷮。乔是鷮的假借字，鷮是长尾野鸡。此处指将鷮羽挂在矛柄及矛头有刃处作为装饰（从范家相诗沈说）。\n逍遥，游玩。文选南都赋注引韩诗：“逍遥，游也。”\n韵读：宵部——消、麃、乔、遥。\n清人在轴，驷介陶陶。左旋右抽，中军作好。\n轴，黄河边郑国地名。按上章的消与这章的轴究在何处，已不可考。\n陶陶，是駣、韬的假借字。说文：“駣，马行貌。”\n左旋右抽，练习击刺貌，指身体向左边旋转，用右手抽出刀剑。三家诗抽作搯。说文：“搯者，拔兵刃以习击刺。诗曰：左旋右搯。”\n中军，古代军队分上、中、下三军，中军的将官为主帅，这里指高克（从闻一多说）。毛传释中军为军中，亦通。\n作好，毛传：“居军中为容好。”陈奂传疏：“容，仪容也。传释经‘作好’为‘为容好’，唯是讲习兵事而已，与上两章翱翔、逍遥同意。”这两句意为，高克转身抽刀，只是做做练武的姿态，并非真正抵御敌人。\n韵读：幽部——轴、陶（徒愁反）、抽、好（呼受反）。"])</script><script>self.__next_f.push([1,"23:Te7a,"])</script><script>self.__next_f.push([1,"这是一首讽刺郑国将军高克的诗。春秋闵公二年：“冬，十有二月，狄入卫，郑弃其师。”左传：“郑人恶高克，使帅师次于河上，久而弗召，师溃而归，高克奔陈。郑人为之 :\"seg-011\",\"order\":11,\"text\":\"左旋右抽\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"quwanli-quanshi:0014-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"左\",\"anchorIds\":[]},{\"index\":2,\"text\":\"旋\",\"anchorIds\":[]},{\"index\":3,\"text\":\"右\",\"anchorIds\":[]},{\"index\":4,\"text\":\"抽\",\"anchorIds\":[]}]},{\"id\":\"seg-012\",\"order\":12,\"text\":\"中軍作好\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"chenhuan-chuanshu:0001-1:part-1\",\"quwanli-quanshi:0015-1:part-1\",\"quwanli-quanshi:0016-1:part-1\",\"wangli-yundu:0003-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"中\",\"anchorIds\":[]},{\"index\":2,\"text\":\"軍\",\"anchorIds\":[]},{\"index\":3,\"text\":\"作\",\"anchorIds\":[]},{\"index\":4,\"text\":\"好\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":16,\"partCount\":16},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":5,\"glossCount\":25,\"anchoredPartCount\":0,\"overviewPartCount\":1},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，驷介旁旁。二矛重英，河上乎翱翔。清人在消，驷介麃麃。二矛重乔，河上乎逍遥。清人在轴，驷介陶陶。左旋右抽，中军作好。\",\"sourceLabel\":\"第 178-179 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"$22\",\"fullText\":\"$23\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"sourceLabel\":\"第 87-89 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"fullText\":\"清人在彭，駟介旁旁。二矛重英，河上乎翺翔。清人在消，駟介麃麃。二矛重喬，河上乎逍遥。清人在軸，駟介陶陶。左旋右抽，中軍作好。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"刺鄭文公棄其師也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺鄭文公棄其師也。\",\"fullText\":\"刺鄭文公棄其師也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。\",\"fullText\":\"右《清人》三章，章四句。《序》本《左傳》，高克棄師奔陳，鄭人爲賦此詩。事有明文，固勿庸議。即彭、消、軸，或以爲地名，或以爲非地名，皆不可考。惟鄭文公惡高克而使之擁兵在外，此召亂之本也。幸而師散將逃，國得無恙。使其反戈相向，何以禦之？由斯以觀，高克亦無能輩耳，何以見惡於文公耶？詩曰「翺翔」，曰「逍遥」，曰「左旋右抽，中軍作好」，所謂霸上諸軍直同兒戲，即使作亂亦易制服。詩人固早有以知其必不然也，若文公者則不能無所議焉。故刺之。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。\",\"fullText\":\"清邑名。駟介四馬而被甲也。旁旁馳驅不息之貌。二矛酋矛、夷矛也。酋矛長二丈，夷矛長二丈四尺，並建於車上。英以朱羽爲矛飾，重疊而見。翺翔遊戲之貌。麃麃武貌。喬矛之上勾曰喬。陶陶樂貌。左旋右抽〔《集傳》〕左，謂御在將軍之左，執轡而御馬者也。旋，還車也。右，謂勇力之士在將軍之右，執兵以擊刺者也。抽，拔刃也。中軍〔《集傳》〕中軍，謂將在鼓下，居車之中，即高克也。好容好也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。陶四豪，叶徒侯反。抽十一尤，叶輟救反。好二十號。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。陶四豪，叶徒侯反。抽十一尤，叶輟救反。好二十號。叶韻。\",\"fullText\":\"彭七陽。旁同。英八庚。翔七陽。通韻。消二蕭。麃、喬、遥並同。本韻。軸一屋，叶音胄。陶四豪，叶徒侯反。抽十一尤，叶輟救反。好二十號。叶韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"《春秋•閔公二年》：“冬，十有二月，狄入衛，鄭棄其師。”《左傳》：“鄭人惡高克，使帥師次於河上（以禦狄也），久而不召，師潰而歸。高克奔陳。鄭人爲之賦《清人》。”\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"《春秋•閔公二年》：“冬，十有二月，狄入衛，鄭棄其師。”《左傳》：“鄭人惡高克，使帥師次於河上（以禦狄也），久而不召，師潰而歸。高克奔陳。鄭人爲之賦《清人》。”\",\"fullText\":\"《春秋•閔公二年》：“冬，十有二月，狄入衛，鄭棄其師。”《左傳》：“鄭人惡高克，使帥師次於河上（以禦狄也），久而不召，師潰而歸。高克奔陳。鄭人爲之賦《清人》。”\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭清人在消清人在軸\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"清，鄭邑名，在今河南中牟縣西。清人，清邑之人，高克所帥者也。\",\"fullText\":\"清，鄭邑名，在今河南中牟縣西。清人，清邑之人，高克所帥者也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-005\",\"seg-009\"]},{\"id\":\"quwanli-quanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0003-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在彭\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"彭，亦鄭邑名，後入衛爲彌子瑕之采邑。其地約當延津、滑二縣境，臨黄河。朱右曾說。\",\"fullText\":\"彭，亦鄭邑名，後入衛爲彌子瑕之采邑。其地約當延津、滑二縣境，臨黄河。朱右曾說。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\"]},{\"id\":\"quwanli-quanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0004-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介旁旁駟介麃麃駟介陶陶\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"駟，四馬；介，甲也。駟介，四馬皆被甲也。\",\"fullText\":\"駟，四馬；介，甲也。駟介，四馬皆被甲也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-002\",\"seg-006\",\"seg-010\"]},{\"id\":\"quwanli-quanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0005-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介旁旁\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"旁旁，即《小雅•北山》及《大雅•烝民》《韓奕》二篇之“彭彭”，盛貌。馬瑞辰說。\",\"fullText\":\"旁旁，即《小雅•北山》及《大雅•烝民》《韓奕》二篇之“彭彭”，盛貌。馬瑞辰說。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-002\"]},{\"id\":\"quwanli-quanshi:0006-1:part-1\",\"annotationId\":\"0006\",\"glossId\":\"0006-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0006-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"二矛重英\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"二矛，酋矛有二也。舊謂酋矛及夷矛，非是。英，畫飾也。蓋刻矛柄而以朱畫之也。重英，謂一矛重飾；二矛重英，謂兩矛皆重其英飾也。或謂二矛長短不同，故其飾重累。非是。馬瑞辰有說。【酋矛長二丈，夷矛長三尋。】\",\"fullText\":\"二矛，酋矛有二也。舊謂酋矛及夷矛，非是。英，畫飾也。蓋刻矛柄而以朱畫之也。重英，謂一矛重飾；二矛重英，謂兩矛皆重其英飾也。或謂二矛長短不同，故其飾重累。非是。馬瑞辰有說。【酋矛長二丈，夷矛長三尋。】\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-003\"]},{\"id\":\"quwanli-quanshi:0007-1:part-1\",\"annotationId\":\"0007\",\"glossId\":\"0007-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0007-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"河上乎翺翔\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"翺翔，猶遨遊也。\",\"fullText\":\"翺翔，猶遨遊也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-004\"]},{\"id\":\"quwanli-quanshi:0008-1:part-1\",\"annotationId\":\"0008\",\"glossId\":\"0008-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0008-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"清人在消\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"消，亦河上地名。\",\"fullText\":\"消，亦河上地名。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\"]},{\"id\":\"quwanli-quanshi:0009-1:part-1\",\"annotationId\":\"0009\",\"glossId\":\"0009-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0009-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"駟介麃麃\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"麃麃，武貌。\",\"fullText\":\"麃麃，武貌。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-006\"]},{\"id\":\"quwanli-quanshi:0010-1:part-1\",\"annotationId\":\"0010\",\"glossId\":\"0010-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0010-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"二矛重喬\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注釋\",\"excerpt\":\"喬，鷮之省（《韓詩》作鷮），雉之一種。矛柄近上及矛頭受刃處，皆懸毛羽，即以鷮羽爲之。上下重飾，故日重喬。馬瑞辰説。\",\"fullText\":\"喬，鷮之省（《韓詩》作鷮），雉之一種。矛柄近上及矛頭受刃處，皆懸毛羽，即以鷮羽爲之。上下重飾，故日重喬。馬瑞辰説。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\"]},{\"id\":\"quwanli-quanshi:0011-1:part-1\",\"annotationId\":\"0011\",\"glossId\":\"0011-1\",\"glossHref\":\"/shijing/gloss/079-qing-ren/quwanli-quanshi/0011-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"span\",\"layerLa
