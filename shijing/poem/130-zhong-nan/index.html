、方玉润之说，认为首章“其君也哉”与末章“寿考不忘”都含劝戒之意。两章都以终南山起兴，借山有嘉木喻君应以德副民望。终南何有？有条有梅。君子至止，锦衣狐袭。颜如渥丹，其君也哉！终南，山名，亦名南山。条，山楸。梅，旧注多作楠木，此处可视为佳木之称。锦衣狐袭，诸侯礼服。渥丹，涂以朱砂般红润。其君也哉，是设问而含期待。终南何有？有纪有堂。君子至止，黼衣绣裳。佩玉将将，寿考不忘。纪，杞柳。堂，棠梨。黼衣绣裳，贵族礼服。将将，佩玉相击之声。寿考不忘，是劝其终老不忘周天子之赐与民望。韵读：之部有、梅、止、袭、哉；阳部堂、裳、将、忘。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/130-zhong-nan/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"终南何有？有条有梅。君子至止，锦衣狐袭。颜如渥丹，其君也哉！终南何有？有纪有堂。君子至止，黼衣绣裳。佩玉将将，寿考不忘。","sourceLabel":"第 294-296 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"终南何有？有条有梅。君子至止，锦衣狐袭。颜如渥丹，其君也哉！","fullText":"这是一首周遗民含蓄劝戒秦君的诗。题解引严粲、方玉润之说，认为首章“其君也哉”与末章“寿考不忘”都含劝戒之意。两章都以终南山起兴，借山有嘉木喻君应以德副民望。终南何有？有条有梅。君子至止，锦衣狐袭。颜如渥丹，其君也哉！终南，山名，亦名南山。条，山楸。梅，旧注多作楠木，此处可视为佳木之称。锦衣狐袭，诸侯礼服。渥丹，涂以朱砂般红润。其君也哉，是设问而含期待。终南何有？有纪有堂。君子至止，黼衣绣裳。佩玉将将，寿考不忘。纪，杞柳。堂，棠梨。黼衣绣裳，贵族礼服。将将，佩玉相击之声。寿考不忘，是劝其终老不忘周天子之赐与民望。韵读：之部有、梅、止、袭、哉；阳部堂、裳、将、忘。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-4:终南何有","seg-002:1-4:有条有梅","seg-003:1-4:君子至止","seg-004:1-4:锦衣狐袭","seg-005:1-4:颜如渥丹","seg-006:1-4:其君也哉"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4","anchor-2-5","anchor-2-6"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/130-zhong-nan/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"s alId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"总评","excerpt":"总评认为此诗是周之耆旧初见秦君治西土而作，美中寓戒，既称其仪容，也劝其修德副民望。","fullText":"总评认为此诗是周之耆旧初见秦君治西土而作，美中寓戒，既称其仪容，也劝其修德副民望。","notes":"总评段落整理。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋終南山名。〔毛氏萇曰〕終南，周之名山中南也。〔孔氏穎達曰〕昭四年《左傳》曰：「荆山、中南，九州之險。」是此一名中南也。案：山在今郿、鄠諸境。以其幹屬天下之中，故曰中，勢踞鎬京之南，故曰南。合而言之曰中南也。條山楸也。材美可作車版。錦衣狐裘諸侯之服也。〔《玉藻》曰〕君衣狐白裘，錦衣以裼之。渥丹〔季氏本曰〕渥丹，猶《簡兮》所謂「渥赭」，言其有樂意而顔色赤澤也。紀〔《集傳》〕紀，山之廉角也。堂〔《集傳》〕堂，山之寬平處也。黻繡〔毛氏萇曰〕黑與青謂之黻，五色備謂之繡。將將佩玉聲。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"集释","excerpt":"集释说明终南山、条梅纪堂及衣饰佩玉等词义。","fullText":"集释说明终南山、条梅纪堂及衣饰佩玉等词义。","notes":"集释原文。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"標韻梅十灰。裘十一尤，叶莫悲反。丹十四寒。哉十灰。叶韻。堂七陽。裳、將、忘並同。本韻。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"韵读","excerpt":"标韵记录两章押韵字及其韵部。"," 忘，是劝其终老不忘周天子之赐与民望。韵读：之部有、梅、止、袭、哉；阳部堂、裳、将、忘。\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-001:4-4:有\",\"seg-002:4-4:梅\",\"seg-003:4-4:止\",\"seg-004:4-4:袭\",\"seg-006:4-4:哉\",\"seg-008:4-4:堂\",\"seg-010:4-4:裳\",\"seg-011:3-3:将\",\"seg-012:4-4:忘\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\",\"anchor-6-4\",\"anchor-6-5\",\"anchor-6-6\",\"anchor-6-7\",\"anchor-6-8\",\"anchor-6-9\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"終南何有？有條有梅。君子至止，錦衣狐裘。顔如渥丹，其君也哉？終南何有？有紀有堂。君子至止，黻衣繡裳。佩玉將將，壽考不忘。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。\",\"fullText\":\"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"总评认为此诗是周之耆旧初见秦君治西土而作，美中寓戒，既称其仪容，也劝其修德副民望。\",\"fullText\":\"总评认为此诗是周之耆旧初见秦君治西土而作，美中寓戒，既称其仪容，也劝其修德副民望。\",\"notes\":\"总评段落整理。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋終南山名。〔毛氏萇曰〕終南，周之名山中南也。〔孔氏穎達曰〕昭四年《左傳》曰：「荆山、中南，九州之險。」是此一名中南也。案：山在今郿、鄠諸境。以其幹屬天下之中，故曰中，勢踞鎬京之南，故曰南。合而言之曰中南也。條山楸也。材美可作車版。錦衣狐裘諸侯之服也。〔《玉藻》曰〕君衣狐白裘，錦衣以裼之。渥丹〔季氏本曰〕渥丹，猶《簡兮》所謂「渥赭」，言其有樂意而顔色赤澤也。紀〔《集傳》〕紀，山之廉角也。堂〔《集傳》〕堂，山之寬平處也。黻繡〔毛氏萇曰〕黑與青謂之黻，五色備謂之繡。將將佩玉聲。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"集释说明终南山、条梅纪堂及衣饰佩玉等词义。\",\"fullText\":\"集释说明终南山、条梅纪堂及衣饰佩玉等词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻梅十灰。裘十一尤，叶莫悲反。丹十四寒。哉十灰。叶韻。堂七陽。裳、將、忘並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录两章押韵字及其韵部。\",\"fullText\":\"标韵记录两章押韵字及其韵部。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}}"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"script\",null,{\"id\":\"__SHIJING_PAGE_DATA__\",\"type\":\"application/json\",\"data-page-kind\":\"poem-detail\",\"data-page-href\":\"/shijing/poem/130-zhong-nan\",\"data-page-data-href\":\"/__data/shijing/poem/130-zhong-nan/data.json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1d\"}}],\"$L1e\",\"$L1f\"]\n"])</script><script>self.__next_f.push([1,"21:I[631,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"356\",\"static/chunks/356-1cbf59d25a49fb83.js\",\"909\",\"static/chunks/909-9eb9e001d16de97f.js\",\"600\",\"static/chunks/app/shijing/poem/%5BpoemId%5D/page-aed9ab3190ba59dd.js\"],\"PoemReader\"]\n20:T78f,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"WebSite\",\"@id\":\"https://shisao.taozeyu.com/shijing/#website\",\"name\":\"诗骚集注\",\"url\":\"https://shisao.taozeyu.com/shijing/\",\"inLanguage\":\"zh-Hans\"},{\"@type\":\"BreadcrumbList\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/130-zhong-nan/#breadcrumb\",\"itemListElement\":[{\"@type\":\"ListItem\",\"position\":1,\"name\":\"诗经\",\"item\":\"https://shisao.taozeyu.com/shijing/\"},{\"@type\":\"ListItem\",\"position\":2,\"name\":\"風\",\"item\":\"https://shisao.taozeyu.com/shijing/#feng\"},{\"@type\":\"ListItem\",\"position\":3,\"name\":\"秦風\",\"item\":\"https://shisao.taozeyu.com/shijing/#qinfeng\"},{\"@type\":\"ListItem\",\"position\":4,\"name\":\"終南\",\"item\":\"https://shisao.taozeyu.com/shijing/poem/130-zhong-nan/\"}]},{\"@type\":\"CreativeWork\",\"@id\":\"https://shisao.taozeyu.com/shijing/poem/130-zhong-nan/#poem\",\"url\":\"https://shisao.taozeyu.com/shijing/poem/13 何有？有纪有堂。君子至止，黼衣绣裳。佩玉将将，寿考不忘。\",\"sourceLabel\":\"第 294-296 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：之部有、梅、止、袭、哉；阳部堂、裳、将、忘。\",\"fullText\":\"这是一首周遗民含蓄劝戒秦君的诗。题解引严粲、方玉润之说，认为首章“其君也哉”与末章“寿考不忘”都含劝戒之意。两章都以终南山起兴，借山有嘉木喻君应以德副民望。终南何有？有条有梅。君子至止，锦衣狐袭。颜如渥丹，其君也哉！终南，山名，亦名南山。条，山楸。梅，旧注多作楠木，此处可视为佳木之称。锦衣狐袭，诸侯礼服。渥丹，涂以朱砂般红润。其君也哉，是设问而含期待。终南何有？有纪有堂。君子至止，黼衣绣裳。佩玉将将，寿考不忘。纪，杞柳。堂，棠梨。黼衣绣裳，贵族礼服。将将，佩玉相击之声。寿考不忘，是劝其终老不忘周天子之赐与民望。韵读：之部有、梅、止、袭、哉；阳部堂、裳、将、忘。\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-001:4-4:有\",\"seg-002:4-4:梅\",\"seg-003:4-4:止\",\"seg-004:4-4:袭\",\"seg-006:4-4:哉\",\"seg-008:4-4:堂\",\"seg-010:4-4:裳\",\"seg-011:3-3:将\",\"seg-012:4-4:忘\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\",\"anchor-6-4\",\"anchor-6-5\",\"anchor-6-6\",\"anchor-6-7\",\"anchor-6-8\",\"anchor-6-9\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"終南何有？有條有梅。君子至止，錦衣狐裘。顔如渥丹，其君也哉？終南何有？有紀有堂。君子至止，黻衣繡裳。佩玉將將，壽考不忘。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。\",\"fullText\":\"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《終南》二章，章六句。《序》謂「戒襄公」。姚氏又以爲「有美無戒」。今玩詩辭首章末句，嚴氏粲云：「其者，將然之辭。哉者，疑而未定之意。」愚案：末章末句亦云「壽考不忘」，則是勸戒也無疑。此必周之耆舊，初見秦君撫有西土，皆膺天子命以治其民，而無如何，於是作此以頌禱之。曰：崇嶐者終南，其何有乎？條與梅耳。所以成此山之高也。君子至止，衣服之盛，容貌之美，固不待言。非將以君臨一邦乎？君此邦則必德此民，如山之有木而後成山之高，乃無負山之名耳。然終南形勢尊嚴宏厰，爲天下冠，君此者可以雄視六合，不獨號令一方也。君其脩德以副民望，百世毋忘周天子之賜也可。蓋美中寓戒，非專頌禱。不然，秦臣頌君，何至作疑而未定之辭，曰「其君也哉」？此必不然之事也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"总评认为此诗是周之耆旧初见秦君治西土而作，美中寓戒，既称其仪容，也劝其修德副民望。\",\"fullText\":\"总评认为此诗是周之耆旧初见秦君治西土而作，美中寓戒，既称其仪容，也劝其修德副民望。\",\"notes\":\"总评段落整理。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋終南山名。〔毛氏萇曰〕終南，周之名山中南也。〔孔氏穎達曰〕昭四年《左傳》曰：「荆山、中南，九州之險。」是此一名中南也。案：山在今郿、鄠諸境。以其幹屬天下之中，故曰中，勢踞鎬京之南，故曰南。合而言之曰中南也。條山楸也。材美可作車版。錦衣狐裘諸侯之服也。〔《玉藻》曰〕君衣狐白裘，錦衣以裼之。渥丹〔季氏本曰〕渥丹，猶《簡兮》所謂「渥赭」，言其有樂意而顔色赤澤也。紀〔《集傳》〕紀，山之廉角也。堂〔《集傳》〕堂，山之寬平處也。黻繡〔毛氏萇曰〕黑與青謂之黻，五色備謂之繡。將將佩玉聲。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"集释说明终南山、条梅纪堂及衣饰佩玉等词义。\",\"fullText\":\"集释说明终南山、条梅纪堂及衣饰佩玉等词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/130-zhong-nan/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻梅十灰。裘十一尤，叶莫悲反。丹十四寒。哉十灰。叶韻。堂七陽。裳、將、忘並同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录两章押韵字及其韵部。\",\"fullText\":\"标韵记录两章押韵字及其韵部。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"終南 · 逐字注脚阅读 | 诗骚集注\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"風 · 秦風 · 汇聚 2 种资料、5 条注脚的《終南》阅读页。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"3\",{\"name\":\"googlebot\",\"content\":\"index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1\"}],[\"$\",\"link\",\"4\",{\"rel\":\"canonical\",\"href\":\"https://shisao.taozeyu.com/shijing/poem/130-zhong-nan/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"終南 · 逐字注脚阅读\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"風 · 秦風 · 汇聚 2 种资料、5 条注脚的《終南》阅读页。\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:url\",\"content\":\"https://shisao.taozeyu.com/shijing/poem/130-zhong-nan/\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\"
