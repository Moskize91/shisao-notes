tationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟。","sourceLabel":"第 106-107 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"末二句言先植榛栗及椅桐梓漆等材木，以备后日伐作琴瑟，体现经营国家不务近功。","fullText":"首章“定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟”写营建楚丘宫室与预谋久远。程、蒋释“定”为营室星，“方中”为正中于南天，古人据此兴作；“揆之以日”指测日影以正东西南北。又释“楚宫”为庙宇，“楚室”为居室，二者互文并举。末二句言先植榛栗及椅桐梓漆等材木，以备后日伐作琴瑟，体现经营国家不务近功。","notes":null,"partOrder":4,"anchorIds":["seg-005:3-4:榛栗","seg-006:1-4:椅桐梓漆","seg-007:3-4:琴瑟"],"glossAnchorIds":["anchor-4-1","anchor-4-2","anchor-4-3"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0003-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉。终焉允臧。","sourceLabel":"第 107 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"次章“升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉。终焉允臧”写迁都前的审势定居。","fullText":"次章“升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉。终焉允臧”写迁都前的审势定居。程、蒋释“虚”为丘墟旧城，“楚”为楚丘，“堂”为其旁邑；“景山与京”兼指远近高下之地形。又释“降观于桑”为下察土地宜蚕宜居，“卜云其吉”为灼龟得吉。结句“终焉允臧”谓所谋终获善成，见卫文公建国之慎。","notes":null,"partOrder":1,"anchorIds":["seg-008:1-4:升彼虚矣","seg-009:1-4:以望楚矣","seg-010:1-4:望楚与堂","seg-011:1-4:景山与京","seg-012:1-4:降观于桑","seg-013:1-4:卜云其吉","seg-014:1-4:终焉允臧"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3","anchor-1-4","anchor-1-5","anchor-1-6","anchor-1-7"],"segmentIds":["seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part- ,"glossHref":"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千！","sourceLabel":"第 108 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。","fullText":"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。又释“匪直也人”为不但人民勤作，尤在君上秉心诚实深远；“騋牝三千”以良马繁多见国力充实。结句由人及政，归到卫国中兴之盛。","notes":null,"partOrder":1,"anchorIds":["seg-015:1-4:灵雨既零","seg-016:1-4:命彼倌人","seg-017:1-4:星言夙驾","seg-018:1-4:说于桑田","seg-019:1-4:匪直也人","seg-020:1-4:秉心塞渊","seg-021:1-4:騋牝三千"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3","anchor-1-4","anchor-1-5","anchor-1-6","anchor-1-7"],"segmentIds":["seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千！","sourceLabel":"第 108 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。","fullText":"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。又释“匪直也人”为不但人民勤作，尤在君上秉心诚实深远；“騋牝三千”以良马繁多见国力充实。结句由人及政，归到卫国中兴之盛。","notes":null,"partOrder":2,"anchorIds":["seg-015:1-2:灵雨","seg-016:3-4:倌人","seg-017:1-1:星","seg-017:3-4:夙驾","seg-018:3-4:桑田"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4","anchor-2-5"],"segmentIds":["seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021"]}, rLine":"清 · 陳奐","publicationYear":1847,"layer":"preface","layerLabel":"篇序","targetText":"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉","sourceLabel":"第 9 页","attributionLabel":"诗序","sectionLabel":"序","excerpt":"序：《定之方中》，美衛文公也。","fullText":"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/050-ding-zhi-fang-zhong/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"preface","layerLabel":"篇序","targetText":"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉","sourceLabel":"第 9 页","attributionLabel":"诗序","sectionLabel":"序","excerpt":"衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。","fullText":"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。","notes":null,"partOrder":2,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/050-ding-zhi-fang-zhong/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧。靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千。","sourceLabel":"第 9-12 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。","fullText":"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。次章“升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧”，言登虚望邑、审山川高下，复观土宜而后卜居，终获其善，见迁都之慎。末章“靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千”，则推称文公雨后夙驾、亲劝农桑，不独勤政于外，且其操心诚实深厚，故国富兵强，马畜滋盛，以成中兴之业。","notes":null,"partOrder":1,"anchorIds":[],"gl terialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟。\",\"sourceLabel\":\"第 106-107 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章“定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟”写营建楚丘宫室与预谋久远。\",\"fullText\":\"首章“定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟”写营建楚丘宫室与预谋久远。程、蒋释“定”为营室星，“方中”为正中于南天，古人据此兴作；“揆之以日”指测日影以正东西南北。又释“楚宫”为庙宇，“楚室”为居室，二者互文并举。末二句言先植榛栗及椅桐梓漆等材木，以备后日伐作琴瑟，体现经营国家不务近功。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-4:定之方中\",\"seg-002:1-4:作于楚宫\",\"seg-003:1-4:揆之以日\",\"seg-004:1-4:作于楚室\",\"seg-005:1-4:树之榛栗\",\"seg-006:1-4:椅桐梓漆\",\"seg-007:1-4:爰伐琴瑟\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟。\",\"sourceLabel\":\"第 106-107 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“定”为营室星，“方中”为正中于南天，古人据此兴作；“揆之以日”指测日影以正东西南北。\",\"fullText\":\"首章“定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟”写营建楚丘宫室与预谋久远。程、蒋释“定”为营室星，“方中”为正中于南天，古人据此兴作；“揆之以日”指测日影以正东西南北。又释“楚宫”为庙宇，“楚室”为居室，二者互文并举。末二句言先植榛栗及椅桐梓漆等材木，以备后日伐作琴瑟，体现经营国家不务近功。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-001:3-4:方中\",\"seg-003:1-1:揆\",\"seg-003:4-4:日\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"se 人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。\",\"fullText\":\"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。又释“匪直也人”为不但人民勤作，尤在君上秉心诚实深远；“騋牝三千”以良马繁多见国力充实。结句由人及政，归到卫国中兴之盛。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:1-4:灵雨既零\",\"seg-016:1-4:命彼倌人\",\"seg-017:1-4:星言夙驾\",\"seg-018:1-4:说于桑田\",\"seg-019:1-4:匪直也人\",\"seg-020:1-4:秉心塞渊\",\"seg-021:1-4:騋牝三千\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千！\",\"sourceLabel\":\"第 108 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。\",\"fullText\":\"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。又释“匪直也人”为不但人民勤作，尤在君上秉心诚实深远；“騋牝三千”以良马繁多见国力充实。结句由人及政，归到卫国中兴之盛。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-015:1-2:灵雨\",\"seg-016:3-4:倌人\",\"seg-017:1-1:星\",\"seg-017:3-4:夙驾\",\"seg-018:3-4:桑田\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-3\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jian onYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉\",\"sourceLabel\":\"第 9 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《定之方中》，美衛文公也。\",\"fullText\":\"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉\",\"sourceLabel\":\"第 9 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"fullText\":\"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧。靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千。\",\"sourceLabel\":\"第 9-12 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。\",\"fullText\":\"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。次章“升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧”，言登虚望邑、审山川高下，复观土宜而后卜居，终获其善，见迁都之慎。末章“靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千”，则推称文公雨后夙驾、亲劝农桑，不独勤政于外，且其操心诚实深厚，故国富兵强，马畜滋盛，以成中兴之业。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧。靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千。\",\"sourceLabel\":\"第 9-12 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。\",\"fullText\":\"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。次章“升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧”，言登虚望邑、审山川高下，复观土宜而后卜居，终获其善，见迁都之慎。末章“靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千”，则推称文公雨后夙驾、亲劝农桑，不独勤政于外，且其操心诚实深厚，故国富兵强，马畜滋盛，以成中兴之业。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:定之方中\",\"seg-002:1-4:作於楚宮\",\"seg-003:1-4:揆之以日\",\"seg-004:1-4:作於楚室\",\"seg-005:1-4:樹之榛栗\",\"seg-006:1-4:椅桐梓漆\",\"seg-007:1-4:爰伐琴瑟\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\",\"anchor-2-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id 耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"定之方中㊟美衛文公再造公室也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"认为《定之方中》旨在称美文公复兴卫国。\",\"fullText\":\"方玉润题注以“美衛文公再造公室”定篇，认为《定之方中》旨在称美文公复兴卫国。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。\",\"fullText\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。\",\"fullText\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"fullText\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"方玉润眉评云：首章总言建国规模，二章追叙卜筑之始，\",\"fullText\":\"方玉润眉评云：首章总言建国规模，二章追叙卜筑之始，三章终言勤劳致富；“秉心”一句为全诗主脑。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"三章终言勤劳致富；“秉心”一句为全诗主脑。\",\"fullText\":\"方玉润眉评云：首章总言建国规模，二章追叙卜筑之始，三章终言勤劳致富；“秉心”一句为全诗主脑。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中作于楚宫揆之以日椅桐梓漆爰伐琴瑟升彼虚矣望楚與堂景山與京降觀于桑靈雨既零命彼倌人星言夙駕説于桑田秉心塞淵騋牝三千\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释云：定为北方营室星，方中则昏中可营宫室；楚宫即楚丘之宫，揆为度日景以正东西南北。\",\"fullText\":\"方玉润集释云：定为北方营室星，方中则昏中可营宫室；楚宫即楚丘之宫，揆为度日景以正东西南北。椅桐梓漆皆建宫所用之木，爰犹“于”也。又释虚为漕虚故墟，堂为楚丘堂邑，景可训测景亦可作山名，京为高丘；桑疑兼地名与水名，降观当近察流泉。靈雨为应时瑞雨，倌人为主驾者，星言夙駕即戴星早驾，説为舍止。秉为操，塞为实，淵为深，故“秉心塞淵”谓谋虑笃实深远；騋牝则举国马牝牡并见其富强。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-002:3-4:楚宫\",\"seg-003:1-1:揆\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-020\",\"seg-021\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中作于楚宫揆之以日椅桐梓漆爰伐琴瑟升彼虚矣望楚與堂景山與京降觀于桑靈雨既零命彼倌人星言夙駕説于桑田秉心塞淵騋牝三千\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"椅桐梓漆皆建宫所用之木，爰犹“于”也。\",\"fullText\":\"方玉润集释云：定为北方营室星，方中则昏中可营宫室；楚宫即楚丘之宫，揆为度日景以正东西南北。椅桐梓漆皆建宫所用之木，爰犹“于”也。又释虚为漕虚故墟，堂为楚丘堂邑，景可训测景亦可作山名，京为高丘；桑疑兼地名与水名，降观当近察流泉。靈雨为应时瑞雨，倌人为主驾者，星言夙駕即戴星早驾，説为舍止。秉为操，塞为实，淵为深，故“秉心塞淵”谓谋虑笃实深远；騋牝则举国马牝牡并见其富强。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-006:1-2:椅桐\",\"seg-006:3-3:梓\",\"seg-006:4-4:漆\",\"seg-007:1-1:爰\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"se e\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《定之方中》，美衛文公也。\",\"fullText\":\"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"fullText\":\"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中作於楚宮揆之以日作於楚室樹之榛栗椅桐梓漆爰伐琴瑟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：定，營室也。方中，昏正四方。楚宮，楚丘之宮也。仲梁子曰：「初立楚宮也。」\",\"fullText\":\"傳：定，營室也。方中，昏正四方。楚宮，楚丘之宮也。仲梁子曰：「初立楚宮也。」箋云：楚宮，謂宗廟也。定星昏中而正，於是可以營制宮室，故謂之營室。定昏中而正，謂小雪時，其體與東壁連正四方。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-001:3-4:方中\",\"seg-002:3-4:楚宮\"] jing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虛矣以望楚矣望楚與堂景山與京降觀於桑卜云其吉終然允臧\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。\",\"fullText\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:3-3:虛\",\"seg-010:4-4:堂\",\"seg-011:1-2:景山\",\"seg-011:4-4:京\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虛矣以望楚矣望楚與堂景山與京降觀於桑卜云其吉終然允臧\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。\",\"fullText\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-012:1-4:降觀於桑\",\"seg-013:1-1:卜\",\"seg-014:3-3:允\",\"seg-014:4-4:臧\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虛矣以望楚矣望楚與堂景山與京降觀於桑卜云其吉終然允臧\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"fullText\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-008:3-3:虛\",\"seg-009:2-3:望楚\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"靈雨既零命彼倌人星言夙駕說於桑田匪直也人秉心塞淵騋牝三千\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：靈雨，善雨也。零，落也。倌人，主駕者。\",\"fullText\":\"傳：靈雨，善雨也。零，落也。倌人，主駕者。秉，操也。騋，馬七尺以上。騋牝，騋馬與牝馬也。箋云：靈，善也。星，雨止星見。夙，早也。文公於雨下，命主駕者：雨止，為我晨早駕，欲往為辭說於桑田，教民稼穡，務農急也。塞，充實也。淵，深也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:1-2:靈雨\",\"seg-015:4-4:零\",\"seg-016:3-4:倌人\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\ ibutorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中，作于楚宮。揆之以日，作于楚室。樹之榛栗。椅桐梓漆，爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀于桑。卜云其吉，終然允臧。靈雨既零，命彼倌人。星言夙駕，說于桑田。匪直也人，秉心塞淵，騋牝三千！\",\"sourceLabel\":\"第 60-61 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“定”为营室星，“方中”为初昏在天中；“作于”之“于”当读为“为”，并释“揆”为度日影以定四方。\",\"fullText\":\"屈万里释“定”为营室星，“方中”为初昏在天中；“作于”之“于”当读为“为”，并释“揆”为度日影以定四方。又释“椅、桐、梓、漆”皆可作琴瑟，“虛”为故城丘墟，“堂”为楚丘旁邑。末章释“靈”为善，“星”当作晴，“說”音税为舍息；并释“秉”为持，“騋牝三千”言马畜众盛。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-001:3-4:方中\",\"seg-002:1-2:作于\",\"seg-003:1-1:揆\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中，作于楚宮。揆之以日，作于楚室。樹之榛栗。椅桐梓漆，爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀于桑。卜云其吉，終然允臧。靈雨既零，命彼倌人。星言夙駕，說于桑田。匪直也人，秉心塞淵，騋牝三千！\",\"sourceLabel\":\"第 60-61 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"又释“椅、桐、梓、漆”皆可作琴瑟，“虛”为故城丘墟，“堂”为楚丘旁邑。\",\"fullText\":\"屈万里释“定”为营室星，“方中”为初昏在天中；“作于”之“于”当读为“为”，并释“揆”为度日影以定四方。又释“椅、桐、梓、漆”皆可作琴瑟，“虛”为故城丘墟，“堂”为楚丘旁邑。末章释“靈”为善，“星”当作晴，“說”音税为舍息；并释“秉”为持，“騋牝三千”言马畜众盛。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-006:1-1:椅\",\"seg-006:2-2:桐\",\"seg-006:3-3:梓\",\"seg-006:4-4:漆\",\"seg-007:3-4:琴瑟\",\"seg-008:3-3:虛\",\"seg-010:4-4:堂\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2- 01-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中作于楚宮揆之以日作于楚室樹之榛栗椅桐梓漆爰伐琴瑟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"賦也。定、北方之宿。營室星也。此星昏而正中。夏正十月也。於是時、可以營制宮室。故謂之營室。\",\"fullText\":\"賦也。定、北方之宿。營室星也。此星昏而正中。夏正十月也。於是時、可以營制宮室。故謂之營室。楚宮、楚丘之宮也。揆、度也。樹八尺之臬、而度其日之出入之景、以定東西。又叅日中之景、以正南北也。楚室、猶楚宮。互文以協韻耳。榛栗、二木。其實榛小栗大、皆可供籩實。椅、梓實桐皮。桐、梧桐也。梓、楸之疎理。白色而生子者。漆、木有液黏、黑可飾器物。四木皆琴瑟之材也。爰、於也。○衛爲狄所滅。文公徙居楚丘。營立宮室。國人悅之、而作是詩、以美之。蘇氏曰、種木者求用於十年之後、其不求近功、凡此類也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中作于楚宮揆之以日作于楚室樹之榛栗椅桐梓漆爰伐琴瑟\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"楚宮、楚丘之宮也。\",\"fullText\":\"賦也。定、北方之宿。營室星也。此星昏而正中。夏正十月也。於是時、可以營制宮室。故謂之營室。楚宮、楚丘之宮也。揆、度也。樹八尺之臬、而度其日之出入之景、以定東西。又叅日中之景、以正南北也。楚室、猶楚宮。互文以協韻耳。榛栗、二木。其實榛小栗大、皆可供籩實。椅、梓實桐皮。桐、梧桐也。梓、楸之疎理。白色而生子者。漆、木有液黏、黑可飾器物。四木皆琴瑟之材也。爰、於也。○衛爲狄所滅。文公徙居楚丘。營立宮室。國人悅之、而作是詩、以美之。蘇氏曰、種木者求用於十年之後、其不求近功、凡此類也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-002:3-4:楚宮\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing ,\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟。\",\"sourceLabel\":\"第 106-107 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末二句言先植榛栗及椅桐梓漆等材木，以备后日伐作琴瑟，体现经营国家不务近功。\",\"fullText\":\"首章“定之方中，作于楚宫。揆之以日，作于楚室。树之榛栗，椅桐梓漆。爰伐琴瑟”写营建楚丘宫室与预谋久远。程、蒋释“定”为营室星，“方中”为正中于南天，古人据此兴作；“揆之以日”指测日影以正东西南北。又释“楚宫”为庙宇，“楚室”为居室，二者互文并举。末二句言先植榛栗及椅桐梓漆等材木，以备后日伐作琴瑟，体现经营国家不务近功。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[\"seg-005:3-4:榛栗\",\"seg-006:1-4:椅桐梓漆\",\"seg-007:3-4:琴瑟\"],\"glossAnchorIds\":[\"anchor-4-1\",\"anchor-4-2\",\"anchor-4-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉。终焉允臧。\",\"sourceLabel\":\"第 107 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"次章“升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉。终焉允臧”写迁都前的审势定居。\",\"fullText\":\"次章“升彼虚矣，以望楚矣。望楚与堂，景山与京。降观于桑，卜云其吉。终焉允臧”写迁都前的审势定居。程、蒋释“虚”为丘墟旧城，“楚”为楚丘，“堂”为其旁邑；“景山与京”兼指远近高下之地形。又释“降观于桑”为下察土地宜蚕宜居，“卜云其吉”为灼龟得吉。结句“终焉允臧”谓所谋终获善成，见卫文公建国之慎。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:1-4:升彼虚矣\",\"seg-009:1-4:以望楚矣\",\"seg-010:1-4:望楚与堂\",\"seg-011:1-4:景山与京\",\"seg-012:1-4:降观于桑\",\"seg-013:1-4:卜云其吉\",\"seg-014:1-4:终焉允臧\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-d -013\",\"seg-014\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千！\",\"sourceLabel\":\"第 108 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。\",\"fullText\":\"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。又释“匪直也人”为不但人民勤作，尤在君上秉心诚实深远；“騋牝三千”以良马繁多见国力充实。结句由人及政，归到卫国中兴之盛。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-015:1-4:灵雨既零\",\"seg-016:1-4:命彼倌人\",\"seg-017:1-4:星言夙驾\",\"seg-018:1-4:说于桑田\",\"seg-019:1-4:匪直也人\",\"seg-020:1-4:秉心塞渊\",\"seg-021:1-4:騋牝三千\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\"],\"segmentIds\":[\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千！\",\"sourceLabel\":\"第 108 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。\",\"fullText\":\"末章“灵雨既零，命彼倌人。星言夙驾，说于桑田。匪直也人，秉心塞渊，騋牝三千”写卫文公勤于农政而致国富。程、蒋释“灵雨”为好雨，“倌人”为主驾者，“星言夙驾”为见星即早驾，“说于桑田”为止息桑田而务劝农桑。又释“匪直也人”为不但人民勤作，尤在君上秉心诚实深远；“騋牝三千”以良马繁多见国力充实。结句由人及政，归到卫国中兴之盛。\",\"n torLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧。靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千。\",\"sourceLabel\":\"第 9-12 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。\",\"fullText\":\"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。次章“升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧”，言登虚望邑、审山川高下，复观土宜而后卜居，终获其善，见迁都之慎。末章“靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千”，则推称文公雨后夙驾、亲劝农桑，不独勤政于外，且其操心诚实深厚，故国富兵强，马畜滋盛，以成中兴之业。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"chenhuan-chuanshu:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧。靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千。\",\"sourceLabel\":\"第 9-12 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。\",\"fullText\":\"陈奂疏《定之方中》时，先据《序》“美衛文公也……國家殷富焉”申明此篇本旨在美卫文公迁楚丘后营国有法、富庶可观。其释首章“定之方中，作於楚宮。揆之以日，作於楚室。樹之榛栗，椅桐梓漆。爰伐琴瑟”，以定星中天为营室之候，“揆日”见建宫度方之审，“樹木伐琴瑟”则见先务久远、为国经始。次章“升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀於桑，卜云其吉。終然允臧”，言登虚望邑、审山川高下，复观土宜而后卜居，终获其善，见迁都之慎。末章“靈雨旣零，命彼倌人。星言夙駕，說於桑田。匪直也人，秉心塞淵。騋牝三千”，则推称文公雨后夙驾、亲劝农桑，不独勤政于外，且其操心诚实深厚，故国富兵强，马畜滋盛，以成中兴之业。\",\"notes\":null,\"par :\"全篇总说\",\"targetText\":\"定之方中㊟美衛文公再造公室也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注以“美衛文公再造公室”定篇，\",\"fullText\":\"方玉润题注以“美衛文公再造公室”定篇，认为《定之方中》旨在称美文公复兴卫国。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"定之方中㊟美衛文公再造公室也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"认为《定之方中》旨在称美文公复兴卫国。\",\"fullText\":\"方玉润题注以“美衛文公再造公室”定篇，认为《定之方中》旨在称美文公复兴卫国。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。\",\"fullText\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。\",\"fullText\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"fullText\":\"方玉润右评据《序》《集传》与《春秋传》肯定此篇为美卫文公迁楚丘再造公室，并斥伪《传》以鲁僖公城楚丘实之为妄。其称文公流离后能损抑自励、与民同劳，故由“秉心塞淵”而能重天时、察地利、尽人力，终致戎马蠶桑并盛，成河北巨邦。末复感叹卫亡于宣姜而兴于其子，申明人君拨乱反正之要。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"方玉润眉评云：首章总言建国规模，二章追叙卜筑之始，\",\"fullText\":\"方玉润眉评云：首章总言建国规模，二章追叙卜筑之始，三章终言勤劳致富；“秉心”一句为全诗主脑。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"三章终言勤劳致富；“秉心”一句为全诗主脑。\",\"fullText\":\"方玉润眉评云：首章总言建国规模，二章追叙卜筑之始，三章终言勤劳致富；“秉心”一句为全诗主脑。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中作于楚宫揆之以日椅桐梓漆爰伐琴瑟升彼虚矣望楚與堂景山與京降觀于桑靈雨既零命彼倌人星言夙駕説于桑田秉心塞淵騋牝三千\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释云：定为北方营室星，方中则昏中可营宫室；楚宫即楚丘之宫，揆为度日景以正东西南北。\",\"fullText\":\"方玉润集释云：定为北方营室星，方中则昏中可营宫室；楚宫即楚丘之宫，揆为度日景以正东西南北。椅桐梓漆皆建宫所用之木，爰犹“于”也。又释虚为漕虚故墟，堂为楚丘堂邑，景可训测景亦可作山名，京为高丘；桑疑兼地名与水名，降观当近察流泉。靈雨为应时瑞雨，倌人为主驾者，星言夙駕即戴星早驾，説为舍止。秉为操，塞为实，淵为深，故“秉心塞淵”谓谋虑笃实深远；騋牝则举国马牝牡并见其富强。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-002:3-4:楚宫\",\"seg-003:1-1:揆\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-020\",\"seg-021\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中作于楚宫揆之以日椅桐梓漆爰伐琴瑟升彼虚矣望楚與堂景山與京降觀于桑靈雨既零命彼倌人星 \"标韵\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"三章“零”九青、“人”十一真、“田”一先与“淵、千”通韵。\",\"fullText\":\"方玉润标韵云：首章“中、宫”为一东本韵，“日、室、栗、漆、瑟”属四质。次章“虚”六鱼与“楚”六语叶，“堂、桑、臧”七阳并“京”八庚转韵。三章“零”九青、“人”十一真、“田”一先与“淵、千”通韵。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《定之方中》，美衛文公也。\",\"fullText\":\"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"定之方中美衛文公也衛為狄所滅東徙渡河野處漕邑齊桓公攘戎狄而封之文公徙居楚丘始建城市而營宮室得其時制百姓說之國家殷富焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"fullText\":\"序：《定之方中》，美衛文公也。衛為狄所滅，東徙渡河，野處漕邑。齊桓公攘戎狄而封之。文公徙居楚丘，始建城市而營宮室，得其時制，百姓說之，國家殷富焉。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中作於楚宮揆之以日作於楚室樹之榛栗椅桐梓漆爰伐琴瑟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：定，營室也。方中，昏正四方。楚宮，楚丘之宮也。仲梁子曰：「初立楚宮也。」\",\"fullText\":\"傳：定，營室也。方中，昏正四方。楚宮，楚丘之宮也。仲梁子曰：「初立楚宮也。」箋云：楚宮，謂宗廟也。定星昏中而正，於是可以營制宮室，故謂之營室。定昏中而正，謂小雪時，其體與東壁連正四方。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-001:3-4:方中\",\"seg-002:3-4:楚宮\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中作於楚宮揆之以日作於楚室樹之榛栗椅桐梓漆爰伐琴瑟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：楚宮，謂宗廟也。定星昏中而正，於是可以營制宮室，故謂之營室。\",\"fullText\":\"傳：定，營室也。方中，昏正四方。楚宮，楚丘之宮也。仲梁子曰：「初立楚宮也。」箋云：楚宮，謂宗廟也。定星昏中而正，於是可以營制宮室，故謂之營室。定昏中而正，謂小雪時，其體與東壁連正四方。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-002:3-4:楚宮\",\"seg-001:1-1:定\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"定之方中作於楚宮揆之以日作於楚室樹之榛栗椅桐梓漆爰伐琴瑟\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"定昏中而正，謂小雪時，其體與東壁連正四方。\",\"fullText\":\"傳：定，營室也。方中，昏正四方。楚宮，楚丘之宮也。仲梁子曰：「初立楚宮也。」箋云：楚宮，謂宗廟也。定星昏中而正，於是可以營制宮室，故謂之營室。定昏中而正，謂小雪時，其體與東壁連正四方。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-1:定\"],\"glossAnchorIds\":[\"anchor-3-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虛矣以望楚矣望楚與堂景山與京降觀於桑卜云其吉終然允臧\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。\",\"fullText\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:3-3:虛\",\"seg-010:4-4:堂\",\"seg-011:1-2:景山\",\"seg-011:4-4:京\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虛矣以望楚矣望楚與堂景山與京降觀於桑卜云其吉終然允臧\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。\",\"fullText\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-012:1-4:降觀於桑\",\"seg-013:1-1:卜\",\"seg-014:3-3:允\",\"seg-014:4-4:臧\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"升彼虛矣以望楚矣望楚與堂景山與京降觀於桑卜云其吉終然允臧\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"fullText\":\"傳：虛，漕虛也。楚丘有堂邑者。景山，大山。京，高丘也。降觀於桑，地勢宜蠶，可以居民。卜，龜曰卜。允，信。臧，善也。箋云：自河以東，夾於濟水，文公將徙，登漕之虛以望楚丘，觀其旁邑及其丘山，審其高下所依倚，乃後建國焉，慎之至也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-008:3-3:虛\",\"seg-009:2-3:望楚\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"靈雨既零命彼倌人星言夙駕說於桑田匪直也人秉心塞淵騋牝三千\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"傳：靈雨，善雨也。零，落也。倌人，主駕者。\",\"fullText\":\"傳：靈雨，善雨也。零，落也。倌人，主駕者。秉，操也。騋，馬七尺以上。騋牝，騋馬與牝馬也。箋云：靈，善也。星，雨止星見。夙，早也。文公於雨下，命主駕者：雨止，為我晨早駕，欲往為辭說於桑田，教民稼穡，務農急也。塞，充實也。淵，深也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\" r\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"定之方中\",\"sourceLabel\":\"第 60 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"谓《定之方中》为美卫文公迁楚丘、营宫室而国势复振之诗。\",\"fullText\":\"屈万里据《詩序》并引邓奎说，谓《定之方中》为美卫文公迁楚丘、营宫室而国势复振之诗。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中，作于楚宮。揆之以日，作于楚室。樹之榛栗。椅桐梓漆，爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀于桑。卜云其吉，終然允臧。靈雨既零，命彼倌人。星言夙駕，說于桑田。匪直也人，秉心塞淵，騋牝三千！\",\"sourceLabel\":\"第 60-61 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“定”为营室星，“方中”为初昏在天中；“作于”之“于”当读为“为”，并释“揆”为度日影以定四方。\",\"fullText\":\"屈万里释“定”为营室星，“方中”为初昏在天中；“作于”之“于”当读为“为”，并释“揆”为度日影以定四方。又释“椅、桐、梓、漆”皆可作琴瑟，“虛”为故城丘墟，“堂”为楚丘旁邑。末章释“靈”为善，“星”当作晴，“說”音税为舍息；并释“秉”为持，“騋牝三千”言马畜众盛。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-1:定\",\"seg-001:3-4:方中\",\"seg-002:1-2:作于\",\"seg-003:1-1:揆\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/050-ding-zhi-fang-zhong/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"定之方中，作于楚宮。揆之以日，作于楚室。樹之榛栗。椅桐梓漆，爰伐琴瑟。升彼虛矣，以望楚矣。望楚與堂，景山與京。降觀于桑。卜云其吉，終然允臧。靈雨既零，命彼倌人。星言夙
