rviewPartCount":4},"overview":{"prefaceEntryIds":[],"globalEntryIds":["fangyurun-yuanshi:0001-1:part-1","fangyurun-yuanshi:0002-1:part-1","fangyurun-yuanshi:0003-1:part-1","fangyurun-yuanshi:0004-1:part-1"]},"focusAnchors":[],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/089-dong-men-zhi-shan/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"东门之墠，茹藘在阪。其室则迩，其人甚远！东门之栗，有践家室。岂不尔思？子不我即。","sourceLabel":"第 193-194 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首男女相唱和的民间恋歌。毛序：“东门之墠，刺乱也。男女有不待礼而相奔者也。”郑笺：“此女欲奔男之辞。”朱熹诗集传：“门之旁有墠，墠之外有阪，阪之上有草，识其所与淫者之居也。室迩人远者，思之而未得见之辞也。”细玩诗句，全无淫奔之意，否则，何至有室迩人远之感？毛、郑、朱的分析都不够恰当。我们认为这位女子还是比较矜持的，正如王先谦集疏所说：“言我岂不思为尔室家，但子不来就我，以礼相近，则我无由得往耳。”他的分析比较正确。诗共两章，上章男唱，下章女唱，一倡一和，是民间对歌的一种形式。首章“其室则迩，其人甚远”两句，将相思而不得见的心情曲曲道出，委婉隽永。唐鱼玄机《隔汉江寄子安》诗：“烟里歌声隐隐，渡头月色沉沉，含情咫尺千里，况听家家远砧。”其意境便从此诗生发开去，而“室迩人远”久为后世文人表达咫尺天涯相思之苦的习语。所以孙鑛批评《诗经》指出：“两语工绝，后世情语皆本此。”东门之墠，茹藘在阪。其室则迩，其人甚远！墠（shàn），亦作坛，平坦的广场。毛传：“墠，除地町町者。”陈乔枞《韩诗遗说考》：“墠，言除地使之平坦。”按除地，指在郊外治地为场。町町，在形容地的平坦。茹藘，茜草。《尔雅》云：“茹藘，茅蒐。”阪（bǎn），土坡。按这二句点明他邻居情人的住处。室，指情人的家。迩，近。韵读：元部一一墠、阪、远。东门之栗，有践家室。岂不尔思？子不我即。践，善。有践，即践践。韩诗践作靖。王先谦集疏：“韩践作靖，云善也。……有靖家室犹今谚云好好人家也。”即，往就、接近。毛传：“即，就也。”陈奂传疏：“传为全诗通训。”按此句为倒文，即“子不即我”。韵读：脂部一一栗、室、即。","fullText":"这是一首男女相唱和的民间恋歌。毛序：“东门之墠，刺乱也。男女有不待礼而相奔者也。”郑笺：“此女欲奔男之辞。”朱熹诗集传：“门之旁有墠，墠之外有阪，阪之上有草，识其所与淫者之居也。室迩人远者，思之而未得见之辞也。”细玩诗句，全无淫奔之意，否则，何至有室迩人远之感？毛、郑、朱的分析都不够恰当。我们认为这位女子还是比较矜持的，正如王先谦集疏所说：“言我岂不思为尔室家，但子不来就我，以礼相近，则我无由得往耳。”他的分析比较正确。诗共两章，上章男唱，下章女唱，一倡一和，是民间对歌的一种形式。首章“其室则迩，其人甚远”两句，将相思而不得见的心情曲曲道出，委婉隽永。唐鱼玄机《隔汉江寄子安》诗：“烟里歌声隐隐，渡头月色沉沉，含情咫尺千里，况听家家远砧。”其意境便从此诗生发开去，而“室迩人远”久为后世文人表达咫尺天涯相思之苦的习语。所以孙鑛批评《诗经》指出：“两语工绝，后世情语皆本此。”东门之墠，茹藘在阪。其室则迩，其人甚远！墠（shàn），亦作坛，平坦的广场。毛传：“墠，除地町町者。”陈乔枞《韩诗遗说考》：“墠，言除地使之平坦。”按除地，指在郊外治地为场。町町，在形容地的平坦。茹藘，茜草。《尔雅》云：“茹藘，茅蒐。”阪（bǎn），土坡。按这二句点明他邻居情人的住处。室，指情人的家。迩，近。韵读：元部一一墠、阪、远。东门之栗，有践家室。 hi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"fangyurun-yuanshi:0004-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东门之墠，茹藘在阪。其室则迩，其人甚远！东门之栗，有践家室。岂不尔思？子不我即。\",\"sourceLabel\":\"第 193-194 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首男女相唱和的民间恋歌。毛序：“东门之墠，刺乱也。男女有不待礼而相奔者也。”郑笺：“此女欲奔男之辞。”朱熹诗集传：“门之旁有墠，墠之外有阪，阪之上有草，识其所与淫者之居也。室迩人远者，思之而未得见之辞也。”细玩诗句，全无淫奔之意，否则，何至有室迩人远之感？毛、郑、朱的分析都不够恰当。我们认为这位女子还是比较矜持的，正如王先谦集疏所说：“言我岂不思为尔室家，但子不来就我，以礼相近，则我无由得往耳。”他的分析比较正确。诗共两章，上章男唱，下章女唱，一倡一和，是民间对歌的一种形式。首章“其室则迩，其人甚远”两句，将相思而不得见的心情曲曲道出，委婉隽永。唐鱼玄机《隔汉江寄子安》诗：“烟里歌声隐隐，渡头月色沉沉，含情咫尺千里，况听家家远砧。”其意境便从此诗生发开去，而“室迩人远”久为后世文人表达咫尺天涯相思之苦的习语。所以孙鑛批评《诗经》指出：“两语工绝，后世情语皆本此。”东门之墠，茹藘在阪。其室则迩，其人甚远！墠（shàn），亦作坛，平坦的广场。毛传：“墠，除地町町者。”陈乔枞《韩诗遗说考》：“墠，言除地使之平坦。”按除地，指在郊外治地为场。町町，在形容地的平坦。茹藘，茜草。《尔雅》云：“茹藘，茅蒐。”阪（bǎn），土坡。按这二句点明他邻居情人的住处。室，指情人的家。迩，近。韵读：元部一一墠、阪、远。东门之栗，有践家室。岂不尔思？子不我即。践，善。有践，即践践。韩诗践作靖。王先谦集疏：“韩践作靖，云善也。……有靖家室犹今谚云好好人家也。”即，往就、接近。毛传：“即，就也。”陈奂传疏：“传为全诗通训。”按此句为倒文，即“子不即我”。韵读：脂部一一栗、室、即。\",\"fullText\":\"这是一首男女相唱和的民间恋歌。毛序：“东门之墠，刺乱也。男女有不待礼而相奔者也。”郑笺：“此女欲奔男之辞。”朱熹诗集传：“门之旁有墠，墠之外有阪，阪之上有草，识其所与淫者之居也。室迩人远者，思之而未得见之辞也。”细玩诗句，全无淫奔之意，否则，何至有室迩人远之感？毛、郑、朱的分析都不够恰当。我们认为这位女子还是比较矜持的，正如王先谦集疏所说：“言我岂不思为尔室家，但子不来就我，以礼相近，则我无由得往耳。”他的分析比较正确。诗共两章，上章男唱，下章女唱，一倡一和，是民间对歌的一种形式。首章“其室则迩，其人甚远”两句，将相思而不得见的心情曲曲道出，委婉隽永。唐鱼玄机《隔汉江寄子安》诗：“烟里歌声隐隐，渡头月色沉沉，含情咫尺千里，况听家家远砧。”其意境便从此诗生发开去，而“室迩人远”久为后世文人表达咫尺天涯相思之苦的习语。所以孙鑛批评《诗经》指出：“两语工绝，后世情语皆本此。”东门之墠，茹藘在阪。其室则迩，其人甚远！墠（shàn），亦作坛，平坦的广场。毛传：“墠，除地町町者。”陈乔枞《韩诗遗说考》：“墠，言除地使之平坦。”按除地，指在郊外治地为场。町町，在形容地的平坦。茹藘，茜草。《尔雅》云：“茹藘，茅蒐。”阪（bǎn），土坡。按这二句点明他邻居情人的住处。室，指情人的家。迩，近。韵读：元部一一墠、阪、远。东门之栗，有践家室。岂不尔思？子不我即。践，善。有践，即践践。韩诗践作靖。王先谦集疏：“韩践作靖，云善也。……有靖家室犹今谚云好好人家也。”即，往就、接近。毛传：“即，就也。”陈奂传疏：“传为全诗通训。”按此句为倒文，即“子不即我”。韵读：脂部一一栗、室、即。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"有所思而未得見也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"有所思而未得見也。\",\"fullText\":\"有所思而未得見也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《東門之墠》二章，章四句。此篇乍玩似淫詩，故自《序》、《傳》來，無不目爲淫矣。然有謂女奔男者，亦有謂男求女者。就首章而觀，曰室邇人遠者，男求女之詞也。就次章而論，曰「子不我即」者，女望男之心也。一詩中自爲贈答而均未謀面，則必非淫者自作可知。古詩人多託男女情以寫君臣朋友義。臣之望君，堂廉雖近，天威甚嚴，有不可以驟進者；君之責臣，則如唐玄宗云「卿自不仕，奈何誣我」，是君又未嘗不有望乎臣也。至朋友兩相思念，更不待言。詩中有懷想情而無男女字，又安知非朋友自相思念乎？且室邇人遠，頗有高人雅士跡邇市城、心出塵表氣象。故此詩雖不敢遽定爲朋友辭，亦不敢隨聲附和，指爲淫詩。故但曰「有所思而未得見」之辭云耳。然有所思而不得見，遂無求見之心，則雖謂之發情止義也可，而何淫之有哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《東門之墠》二章，章四句。此篇乍玩似淫詩，故自《序》、《傳》來，無不目爲淫矣。然有謂女奔男者，亦有謂男求女者。就首章而觀，曰室邇人遠者，男求女之詞也。就次章而論，曰「子不我即」者，女望男之心也。一詩中自爲贈答而均未謀面，則必非淫者自作可知。古詩人多託男女情以寫君臣朋友義。臣之望君，堂廉雖近，天威甚嚴，有不可以驟進者；君之責臣，則如唐玄宗云「卿自不仕，奈何誣我」，是君又未嘗不有望乎臣也。至朋友兩相思念，更不待言。詩中有懷想情而無男女字，又安知非朋友自相思念乎？且室邇人遠，頗有高人雅士跡邇市城、心出塵表氣象。故此詩雖不敢遽定爲朋友辭，亦不敢隨聲附和，指爲淫詩。故但曰「有所思而未得見」之辭云耳。然有所思而不得見，遂無求見之心，則雖謂之發情止義也可，而何淫之有哉？\",\"fullText\":\"右《東門之墠》二章，章四句。此篇乍玩似淫詩，故自《序》、《傳》來，無不目爲淫矣。然有謂女奔男者，亦有謂男求女者。就首章而觀，曰室邇人遠者，男求女之詞也。就次章而論，曰「子不我即」者，女望男之心也。一詩中自爲贈答而均未謀面，則必非淫者自作可知。古詩人多託男女情以寫君臣朋友義。臣之望君，堂廉雖近，天威甚嚴，有不可以驟進者；君之責臣，則如唐玄宗云「卿自不仕，奈何誣我」，是君又未嘗不有望乎臣也。至朋友兩相思念，更不待言。詩中有懷想情而無男女字，又安知非朋友自相思念乎？且室邇人遠，頗有高人雅士跡邇市城、心出塵表氣象。故此詩雖不敢遽定爲朋友辭，亦不敢隨聲附和，指爲淫詩。故但曰「有所思而未得見」之辭云耳。然有所思而不得見，遂無求見之心，則雖謂之發情止義也可，而何淫之有哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋墠〔《集傳》〕墠，除地町町者。〔梁氏益曰〕墠，除地去草也。封土爲壇，除地爲墠。町町，言有町畦也。茹藘〔陸氏璣曰〕茹藘，蒨草也。齊人謂之茜，今圃人或作畦種蒔。《貨殖傳》云：「巵茜千石，亦比千乘之家。」阪〔郭氏璞曰〕陂陀不平。踐行列貌。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋墠〔《集傳》〕墠，除地町町者。〔梁氏益曰〕墠，除地去草也。封土爲壇，除地爲墠。町町，言有町畦也。茹藘〔陸氏璣曰〕茹藘，蒨草也。齊人謂之茜，今圃人或作畦種蒔。《貨殖傳》云：「巵茜千石，亦比千乘之家。」阪〔郭氏璞曰〕陂陀不平。踐行列貌。\",\"fullText\":\"集釋墠〔《集傳》〕墠，除地町町者。〔梁氏益曰〕墠，除地去草也。封土爲壇，除地爲墠。町町，言有町畦也。茹藘〔陸氏璣曰〕茹藘，蒨草也。齊人謂之茜，今圃人或作畦種蒔。《貨殖傳》云：「巵茜千石，亦比千乘之家。」阪〔郭氏璞曰〕陂陀不平。踐行列貌。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻墠十六銑。阪十三阮。遠同。通韻。栗四質。室同。即十三職。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻墠十六銑。阪十三阮。遠同。通韻。栗四質。室同。即十三職。通韻。\",\"fullText\":\"標韻墠十六銑。阪十三阮。遠同。通韻。栗四質。室同。即十三職。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAn \"],\"characters\":[{\"index\":1,\"text\":\"其\",\"anchorIds\":[]},{\"index\":2,\"text\":\"室\",\"anchorIds\":[]},{\"index\":3,\"text\":\"则\",\"anchorIds\":[]},{\"index\":4,\"text\":\"迩\",\"anchorIds\":[]}]},{\"id\":\"seg-004\",\"order\":4,\"text\":\"其人甚远\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"其\",\"anchorIds\":[]},{\"index\":2,\"text\":\"人\",\"anchorIds\":[]},{\"index\":3,\"text\":\"甚\",\"anchorIds\":[]},{\"index\":4,\"text\":\"远\",\"anchorIds\":[]}]},{\"id\":\"seg-005\",\"order\":5,\"text\":\"东门之栗\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"东\",\"anchorIds\":[]},{\"index\":2,\"text\":\"门\",\"anchorIds\":[]},{\"index\":3,\"text\":\"之\",\"anchorIds\":[]},{\"index\":4,\"text\":\"栗\",\"anchorIds\":[]}]},{\"id\":\"seg-006\",\"order\":6,\"text\":\"有践家室\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"有\",\"anchorIds\":[]},{\"index\":2,\"text\":\"践\",\"anchorIds\":[]},{\"index\":3,\"text\":\"家\",\"anchorIds\":[]},{\"index\":4,\"text\":\"室\",\"anchorIds\":[]}]},{\"id\":\"seg-007\",\"order\":7,\"text\":\"岂不尔思\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"岂\",\"anchorIds\":[]},{\"index\":2,\"text\":\"不\",\"anchorIds\":[]},{\"index\":3,\"text\":\"尔\",\"anchorIds\":[]},{\"index\":4,\"text\":\"思\",\"anchorIds\":[]}]},{\"id\":\"seg-008\",\"order\":8,\"text\":\"子不我即\",\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\"],\"characters\":[{\"index\":1,\"text\":\"子\",\"anchorIds\":[]},{\"index\":2,\"text\":\"不\",\"anchorIds\":[]},{\"index\":3,\"text\":\"我\",\"anchorIds\":[]},{\"index\":4,\"text\":\"即\",\"anchorIds\":[]}]}]},\"materials\":[{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":2,\"glossCount\":5,\"anchoredPartCount\":0,\"overviewPartCount\":4},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"fangyurun-yuanshi:0003-1:part-1\",\"fangyurun-yuanshi:0004-1:part-1\"]},\"focusAnchors\":[],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"东门之墠，茹藘在阪。其室则迩，其人甚远！东门之栗，有践家室。岂不尔思？子不我即。\",\"sourceLabel\":\"第 193-194 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首男女相唱和的民间恋歌。毛序：“东门之墠，刺乱也。男女有不待礼而相奔者也。”郑笺：“此女欲奔男之辞。”朱熹诗集传：“门之旁有墠，墠之外有阪，阪之上有草，识其所与淫者之居也。室迩人远者，思之而未得见之辞也。”细玩诗句，全无淫奔之意，否则，何至有室迩人远之感？毛、郑、朱的分析都不够恰当。我们认为这位女子还是比较矜持的，正如王先谦集疏所说：“言我岂不思为尔室家，但子不来就我，以礼相近，则我无由得往耳。”他的分析比较正确。诗共两章，上章男唱，下章女唱，一倡一和，是民间对歌的一种形式。首章“其室则迩，其人甚远”两句，将相思而不得见的心情曲曲道出，委婉隽永。唐鱼玄机《隔汉江寄子安》诗：“烟里歌声隐隐，渡头月色沉沉，含情咫尺千里，况听家家远砧。”其意境便从此诗生发开去，而“室迩人远”久为后世文人表达咫尺天涯相思之苦的习语。所以孙鑛批评《诗经》指出：“两语工绝，后世情语皆本此。”东门之墠，茹藘在阪。其室则迩，其人甚远！墠（shàn），亦作坛，平坦的广场。毛传：“墠，除地町町者。”陈乔枞《韩诗遗说考》：“墠，言除地使之平坦。”按除地，指在郊外治地为场。町町，在形容地的平坦。茹藘，茜草。《尔雅》云：“茹藘，茅蒐。”阪（bǎn），土坡。按这二句点明他邻居情人的住处。室，指情人的家。迩，近。韵读：元部一一墠、阪、远。东门之栗，有践家室。岂不尔思？子不我即。践，善。有践，即践践。韩诗践作靖。王先谦集疏：“韩践作靖，云善也。……有靖家室犹今谚云好好人家也。”即，往就、接近。毛传：“即，就也。”陈奂传疏：“传为全诗通训。”按此句为倒文，即“子不即我”。韵读：脂部一一栗、室、即。\",\"fullText\":\"这是一首男女相唱和的民间恋歌。毛序：“东门之墠，刺乱也。男女有不待礼而相奔者也。”郑笺：“此女欲奔男之辞。”朱熹诗集传：“门之旁有墠，墠之外有阪，阪之上有草，识其所与淫者之居也。室迩人远者，思之而未得见之辞也。”细玩诗句，全无淫奔之意，否则，何至有室迩人远之感？毛、郑、朱的分析都不够恰当。我们认为这位女子还是比较矜持的，正如王先谦集疏所说：“言我岂不思为尔室家，但子不来就我，以礼相近，则我无由得往耳。”他的分析比较正确。诗共两章，上章男唱，下章女唱，一倡一和，是民间对歌的一种形式。首章“其室则迩，其人甚远”两句，将相思而不得见的心情曲曲道出，委婉隽永。唐鱼玄机《隔汉江寄子安》诗：“烟里歌声隐隐，渡头月色沉沉，含情咫尺千里，况听家家远砧。”其意境便从此诗生发开去，而“室迩人远”久为后世文人表达咫尺天涯相思之苦的习语。所以孙鑛批评《诗经》指出：“两语工绝，后世情语皆本此。”东门之墠，茹藘在阪。其室则迩，其人甚远！墠（shàn），亦作坛，平坦的广场。毛传：“墠，除地町町者。”陈乔枞《韩诗遗说考》：“墠，言除地使之平坦。”按除地，指在郊外治地为场。町町，在形容地的平坦。茹藘，茜草。《尔雅》云：“茹藘，茅蒐。”阪（bǎn），土坡。按这二句点明他邻居情人的住处。室，指情人的家。迩，近。韵读：元部一一墠、阪、远。东门之栗，有践家室。岂不尔思？子不我即。践，善。有践，即践践。韩诗践作靖。王先谦集疏：“韩践作靖，云善也。……有靖家室犹今谚云好好人家也。”即，往就、接近。毛传：“即，就也。”陈奂传疏：“传为全诗通训。”按此句为倒文，即“子不即我”。韵读：脂部一一栗、室、即。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"有所思而未得見也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"有所思而未得見也。\",\"fullText\":\"有所思而未得見也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《東門之墠》二章，章四句。此篇乍玩似淫詩，故自《序》、《傳》來，無不目爲淫矣。然有謂女奔男者，亦有謂男求女者。就首章而觀，曰室邇人遠者，男求女之詞也。就次章而論，曰「子不我即」者，女望男之心也。一詩中自爲贈答而均未謀面，則必非淫者自作可知。古詩人多託男女情以寫君臣朋友義。臣之望君，堂廉雖近，天威甚嚴，有不可以驟進者；君之責臣，則如唐玄宗云「卿自不仕，奈何誣我」，是君又未嘗不有望乎臣也。至朋友兩相思念，更不待言。詩中有懷想情而無男女字，又安知非朋友自相思念乎？且室邇人遠，頗有高人雅士跡邇市城、心出塵表氣象。故此詩雖不敢遽定爲朋友辭，亦不敢隨聲附和，指爲淫詩。故但曰「有所思而未得見」之辭云耳。然有所思而不得見，遂無求見之心，則雖謂之發情止義也可，而何淫之有哉？\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《東門之墠》二章，章四句。此篇乍玩似淫詩，故自《序》、《傳》來，無不目爲淫矣。然有謂女奔男者，亦有謂男求女者。就首章而觀，曰室邇人遠者，男求女之詞也。就次章而論，曰「子不我即」者，女望男之心也。一詩中自爲贈答而均未謀面，則必非淫者自作可知。古詩人多託男女情以寫君臣朋友義。臣之望君，堂廉雖近，天威甚嚴，有不可以驟進者；君之責臣，則如唐玄宗云「卿自不仕，奈何誣我」，是君又未嘗不有望乎臣也。至朋友兩相思念，更不待言。詩中有懷想情而無男女字，又安知非朋友自相思念乎？且室邇人遠，頗有高人雅士跡邇市城、心出塵表氣象。故此詩雖不敢遽定爲朋友辭，亦不敢隨聲附和，指爲淫詩。故但曰「有所思而未得見」之辭云耳。然有所思而不得見，遂無求見之心，則雖謂之發情止義也可，而何淫之有哉？\",\"fullText\":\"右《東門之墠》二章，章四句。此篇乍玩似淫詩，故自《序》、《傳》來，無不目爲淫矣。然有謂女奔男者，亦有謂男求女者。就首章而觀，曰室邇人遠者，男求女之詞也。就次章而論，曰「子不我即」者，女望男之心也。一詩中自爲贈答而均未謀面，則必非淫者自作可知。古詩人多託男女情以寫君臣朋友義。臣之望君，堂廉雖近，天威甚嚴，有不可以驟進者；君之責臣，則如唐玄宗云「卿自不仕，奈何誣我」，是君又未嘗不有望乎臣也。至朋友兩相思念，更不待言。詩中有懷想情而無男女字，又安知非朋友自相思念乎？且室邇人遠，頗有高人雅士跡邇市城、心出塵表氣象。故此詩雖不敢遽定爲朋友辭，亦不敢隨聲附和，指爲淫詩。故但曰「有所思而未得見」之辭云耳。然有所思而不得見，遂無求見之心，則雖謂之發情止義也可，而何淫之有哉？\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋墠〔《集傳》〕墠，除地町町者。〔梁氏益曰〕墠，除地去草也。封土爲壇，除地爲墠。町町，言有町畦也。茹藘〔陸氏璣曰〕茹藘，蒨草也。齊人謂之茜，今圃人或作畦種蒔。《貨殖傳》云：「巵茜千石，亦比千乘之家。」阪〔郭氏璞曰〕陂陀不平。踐行列貌。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋墠〔《集傳》〕墠，除地町町者。〔梁氏益曰〕墠，除地去草也。封土爲壇，除地爲墠。町町，言有町畦也。茹藘〔陸氏璣曰〕茹藘，蒨草也。齊人謂之茜，今圃人或作畦種蒔。《貨殖傳》云：「巵茜千石，亦比千乘之家。」阪〔郭氏璞曰〕陂陀不平。踐行列貌。\",\"fullText\":\"集釋墠〔《集傳》〕墠，除地町町者。〔梁氏益曰〕墠，除地去草也。封土爲壇，除地爲墠。町町，言有町畦也。茹藘〔陸氏璣曰〕茹藘，蒨草也。齊人謂之茜，今圃人或作畦種蒔。《貨殖傳》云：「巵茜千石，亦比千乘之家。」阪〔郭氏璞曰〕陂陀不平。踐行列貌。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/089-dong-men-zhi-shan/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻墠十六銑。阪十三阮。遠同。通韻。栗四質。室同。即十三職。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻墠十六銑。阪十三阮。遠同。通韻。栗四質。室同。即十三職。通韻。\",\"fullText\":\"標韻墠十六銑。阪十三阮。遠同。通韻。栗四質。室同。即十三職。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"東門之墠 · 逐字注脚阅读 | 诗骚集注\"}],[\"$\",\"meta\",\"1\",{\"name\":\"description\",\"content\":\"風 · 鄭風 · 汇聚 2 种资料、5 条注脚的《東門之墠》阅读页。\"}],[\"$\",\"meta\",\"2\",{\"name\":\"robots\",\"content\":\"index, follow\"}],[\"$\",\"meta\",\"3\",{\"name\":\"googlebot\",\"content\":\"index, follow, max-video-preview:-1, max-image-preview:large, max-snippet:-1\"}],[\"$\",\"link\",\"4\",{\"rel\":\"canonical\",\"href\":\"https://shisao.taozeyu.com/shijing/poem/089-dong-men-zhi-shan/\"}],[\"$\",\"meta\",\"5\",{\"property\":\"og:title\",\"content\":\"東門之墠 · 逐字注脚阅读\"}],[\"$\",\"meta\",\"6\",{\"property\":\"og:description\",\"content\":\"風 · 鄭風 · 汇聚 2 种资料、5 条注脚的《東門之墠》阅读页。\"}],[\"$\",\"meta\",\"7\",{\"property\":\"og:url\",\"content\":\"https://shisao.taozeyu.com/shijing/poem/089-dong-men-zhi-shan/\"}],[\"$\",\"meta\",\"8\",{\"property\":\"og:type\",\"content\":\"article\"}],[\"$\",\"meta\",\"9\",{\"name\":\"twitter:card\",\"content\":\"summary\"}],[\"$\",\"meta\",\"10\",{\"name\":\"twitter:title\",\"content\":\"東門之墠 · 逐字注脚阅读\"}],[\"$\",\"meta\",\"11\",{\"name\":\"twitter:description\",\"content\":\"風 · 鄭風 · 汇聚 2 种资料、5 条注脚的《東門之墠》阅读页。\"}],[\"$\",\"link\",\"12\",{\"rel\":\"icon\",\"href\":\"/favicon.svg\"}],[\"$\",\"$L22\",\"13\",{}]],\"error\":null,\"digest\":\"$undefined\"}\n"])</script><script>self.__next_
