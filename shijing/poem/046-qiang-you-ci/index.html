问自答，戛然煞住，是怎样的丑恶，丑恶到什么程度，一切都留给读者自己去想象，似直实曲，似露实隐。作诗者或因有所顾忌而辍笔，读诗者却由言外得意而骋思。","fullText":"这是一首揭露、讽刺卫国统治阶级淫乱无耻的诗。《左传》闵公二年:“初惠公之即位也少，齐人使昭伯烝于宣姜。不可，强之。生齐子、戴公、文公、宋桓夫人、许穆夫人。”《毛序》:“墙有茨，卫人刺其上也。公子顽通于君母，国人疾之而不可道也。”齐诗说:“墙茨之言，三世不安。”《易林》鲁诗说:“卫宣姜乱及三世，至戴公而后宁。”据这些记载，这首诗的讽刺对象可能就是卫宣姜。宣姜本被聘为卫宣公世子伋的妻子，后被卫宣公中途劫夺据为己有。宣公死后，他的庶长子公子顽（即顽顽）又与宣姜私通。这些乱伦的行为已经无复人理。方玉润说:“卫宫淫乱未必即止宣姜而宣姜为尤甚。……盖廉耻至是而尽丧，有诗人不忍道、不忍详、不忍读者。”分析得较中肯。此诗特点是讽刺尖锐而不直露，章末“所可道也？言之丑也”，自问自答，戛然煞住，是怎样的丑恶，丑恶到什么程度，一切都留给读者自己去想象，似直实曲，似露实隐。作诗者或因有所顾忌而辍笔，读诗者却由言外得意而骋思。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"墙有茨，不可扫也。中冓之言，不可道也。所可道也？言之丑也。","sourceLabel":"第 97 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”","fullText":"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。","notes":null,"partOrder":1,"anchorIds":["seg-001:3-3:茨","seg-002:3-3:扫"],"glossAnchorIds":["anchor-1-1","anchor-1-2"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"墙有茨，不可扫也。中冓之言，不可道也。所可道也？言之丑也。","sourceLabel":"第 97 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。","fullText":"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。","notes":null,"partOrder":2,"anchorIds":["seg-003:1-2:中冓","seg-004:3-3:道","seg-005:3-3:道","seg-006:3-3:丑"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3","anchor-2-4"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0003-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"墙有茨，不可襄也。中冓之言，不可详也。所可详也？言之长也。","sourceLabel":"第 97 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”","fullText":"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。","notes":null,"partOrder":1,"anchorIds":["seg-008:3-3:襄"],"glossAnchorIds":["anchor-1-1"],"segmentIds":["seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2","annotationId":"0003","glossId":"0003-1","glo d\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"所可讀也\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-4\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\"]},{\"id\":\"seg-017:3-3:读\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"读\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-018:1-4:言之辱也\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"言之辱也\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-4\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\"]},{\"id\":\"seg-018:3-3:辱\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"辱\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"maoheng-zhushu-kr1c0004:0004-1:part-4\",\"zhuxi-shijichuan-kr1c0009:0003-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"maoheng-zhushu-kr1c0004\",\"zhuxi-shijichuan-kr1c0009\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"题解\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首揭露、讽刺卫国统治阶级淫乱无耻的诗。《左传》闵公二年:“初惠公之即位也少，齐人使昭伯烝于宣姜。不可，强之。生齐子、戴公、文公、宋桓夫人、许穆夫人。”《毛序》:“墙有茨，卫人刺其上也。公子顽通于君母，国人疾之而不可道也。”齐诗说:“墙茨之言，三世不安。”《易林》鲁诗说:“卫宣姜乱及三世，至戴公而后宁。”据这些记载，这首诗的讽刺对象可能就是卫宣姜。宣姜本被聘为卫宣公世子伋的妻子，后被卫宣公中途劫夺据为己有。宣公死后，他的庶长子公子顽（即顽顽）又与宣姜私通。这些乱伦的行为已经无复人理。方玉润说:“卫宫淫乱未必即止宣姜而宣姜为尤甚。……盖廉耻至是而尽丧，有诗人不忍道、不忍详、不忍读者。”分析得较中肯。此诗特点是讽刺尖锐而不直露，章末“所可道也？言之丑也”，自问自答，戛然煞住，是怎样的丑恶，丑恶到什么程度，一切都留给读者自己去想象，似直实曲，似露实隐。作诗者或因有所顾忌而辍笔，读诗者却由言外得意而骋思。\",\"fullText\":\"这是一首揭露、讽刺卫国统治阶级淫乱无耻的诗。《左传》闵公二年:“初惠公之即位也少，齐人使昭伯烝于宣姜。不可，强之。生齐子、戴公、文公、宋桓夫人、许穆夫人。”《毛序》:“墙有茨，卫人刺其上也。公子顽通于君母，国人疾之而不可道也。”齐诗说:“墙茨之言，三世不安。”《易林》鲁诗说:“卫宣姜乱及三世，至戴公而后宁。”据这些记载，这首诗的讽刺对象可能就是卫宣姜。宣姜本被聘为卫宣公世子伋的妻子，后被卫宣公中途劫夺据为己有。宣公死后，他的庶长子公子顽（即顽顽）又与宣姜私通。这些乱伦的行为已经无复人理。方玉润说:“卫宫淫乱未必即止宣姜而宣姜为尤甚。……盖廉耻至是而尽丧，有诗人不忍道、不忍详、不忍读者。”分析得较中肯。此诗特点是讽刺尖锐而不直露，章末“所可道也？言之丑也”，自问自答，戛然煞住，是怎样的丑恶，丑恶到什么程度，一切都留给读者自己去想象，似直实曲，似露实隐。作诗者或因有所顾忌而辍笔，读诗者却由言外得意而骋思。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可扫也。中冓之言，不可道也。所可道也？言之丑也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”\",\"fullText\":\"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-3:茨\",\"seg-002:3-3:扫\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可扫也。中冓之言，不可道也。所可道也？言之丑也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。\",\"fullText\":\"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-2:中冓\",\"seg-004:3-3:道\",\"seg-005:3-3:道\",\"seg-006:3-3:丑\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可襄也。中冓之言，不可详也。所可详也？言之长也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”\",\"fullText\":\"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:3-3:襄\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可襄也。中冓之言，不可详也。所可详也？言之长也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。\",\"fullText\":\"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:3-3:详\",\"seg-011:3-3:详\",\"seg-012:3-3:长\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可束也。中冓之言，不可读也。所可读也？言之辱也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"束，打扫干净。王先谦《集疏》:“束是总集之义，总聚而去之，言其净尽也，较扫、襄义又进。”\",\"fullText\":\"束，打扫干净。王先谦《集疏》:“束是总集之义，总聚而去之，言其净尽也，较扫、襄义又进。”读，反复地说。毛传:“读，抽也。”郑笺:“抽犹出也。”胡承珙《后笺》云:“服虔《左传》注云:‘读，抽也，抽出吉凶也。’读与绎同，于义皆为抽绎而出之，此古训也。盖道者约言之，详者多言之，读者反复言之。诗意盖谓约言之尚不可，况多言之乎？况反复言之乎？三章自有次第。”韵读:侯部一一束、读、读、辱。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-014:3-3:束\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"se 02-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"sourceLabel\":\"第 2-3 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"fullText\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"牆有茨㊟刺衛宫淫亂無檢也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"牆有茨㊟刺衛宫淫亂無檢也。\",\"fullText\":\"牆有茨㊟刺衛宫淫亂無檢也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《牆有茨》三章，章六句。《大序》謂「公子頑通乎君母，國人刺之」。《集傳》謂「理或然也」。衛宫淫亂，未必即止宣姜，而宣姜爲尤甚。其始既失節於宣公，而有《静女》、《新臺》之誚；其繼又失身於公子頑，而爲《牆茨》、《偕老》之羞。其中冓之言，尚可道哉？蓋廉恥至是而盡喪，有詩人不忍道、不忍詳、不忍讀者，而聖人猶録之以著於經也，何哉？楊氏時曰：「自古淫亂之君，自以爲秘於閨門之中，世無得而知者，故自肆而不反。聖人所以著之於經，使後世爲惡者知雖閨中之言，亦無隱而不彰也。其爲訓戒深矣。」斯言不獨爲此發，凡淫亂之詩，均可作如是觀。後世漢、唐吕雉、武曌之類，皆宣姜後塵。聖人早有以見及於此，故録之以爲萬世戒。而不然者，風人所不道，而謂聖人取之耶？又一宣姜也，而非而刺之者，或在《邶》，或在《鄘》，《衛》詩中則無有，意者邶、鄘二國亡於衛，其人心不能無所憾，故多指其瑕而刺之。至衛本國人不敢非其大夫，況顯彰君惡哉？此二國雖亡，是非未泯，不能不存其名之一證也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《牆有茨》三章，章六句。《大序》謂「公子頑通乎君母，國人刺之」。《集傳》謂「理或然也」。衛宫淫亂，未必即止宣姜，而宣姜爲尤甚。其始既失節於宣公，而有《静女》、《新臺》之誚；其繼又失身於公子頑，而爲《牆茨》、《偕老》之羞。其中冓之言，尚可道哉？蓋廉恥至是而盡喪，有詩人不忍道、不忍詳、不忍讀者，而聖人猶録之以著於經也，何哉？楊氏時曰：「自古淫亂之君，自以爲秘於閨門之中，世無得而知者，故自肆而不反。聖人所以著之於經，使後世爲惡者知雖閨中之言，亦無隱而不彰也。其爲訓戒深矣。」斯言不獨爲此發，凡淫亂之詩，均可作如是觀。後世漢、唐吕雉、武曌之類，皆宣姜後塵。聖人早有以見及於此，故録之以爲萬世戒。而不然者，風人所不道，而謂聖人取之耶？又一宣姜也，而非而刺之者，或在《邶》，或在《鄘》，《衛》詩中則無有，意者邶、鄘二國亡於衛，其人心不能無所憾，故多指其瑕而刺之。至衛本國人不敢非其大夫，況顯彰君惡哉？此二國雖亡，是非未泯，不能不存其名之一證也。\",\"fullText\":\"右《牆有茨》三章，章六句。《大序》謂「公子頑通乎君母，國人刺之」。《集傳》謂「理或然也」。衛宫淫亂，未必即止宣姜，而宣姜爲尤甚。其始既失節於宣公，而有《静女》、《新臺》之誚；其繼又失身於公子頑，而爲《牆茨》、《偕老》之羞。其中冓之言，尚可道哉？蓋廉恥至是而盡喪，有詩人不忍道、不忍詳、不忍讀者，而聖人猶録之以著於經也，何哉？楊氏時曰：「自古淫亂之君，自以爲秘於閨門之中，世無得而知者，故自肆而不反。聖人所以著之於經，使後世爲惡者知雖閨中之言，亦無隱而不彰也。其爲訓戒深矣。」斯言不獨爲此發，凡淫亂之詩，均可作如是觀。後世漢、唐吕雉、武曌之類，皆宣姜後塵。聖人早有以見及於此，故録之以爲萬世戒。而不然者，風人所不道，而謂聖人取之耶？又一宣姜也，而非而刺之者，或在《邶》，或在《鄘》，《衛》詩中則無有，意者邶、鄘二國亡於衛，其人心不能無所憾，故多指其瑕而刺之。至衛本國人不敢非其大夫，況顯彰君惡哉？此二國雖亡，是非未泯，不能不存其名之一證也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋茨〔《説文》〕以茅蓋屋。〔《書》〕惟其塗塈茨。〔《周禮》〕茨牆則翦闔。中冓〔《説文》云〕交積材也。蓋謂室中結構深密之處。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋茨〔《説文》〕以茅蓋屋。〔《書》〕惟其塗塈茨。〔《周禮》〕茨牆則翦闔。中冓〔《説文》云〕交積材也。蓋謂室中結構深密之處。\",\"fullText\":\"集釋茨〔《説文》〕以茅蓋屋。〔《書》〕惟其塗塈茨。〔《周禮》〕茨牆則翦闔。中冓〔《説文》云〕交積材也。蓋謂室中結構深密之處。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAncho 〔頑，在傳作昭伯〔見閔二年〕。〕\",\"fullText\":\"《詩序》：“《牆有茨》，衛人刺其上也。公子頑通乎君母，國人疾之，而不可道也。”箋云：“宣公卒，惠公幼，其庶兄頑烝於惠公之母，生子五人：齊子、戴公、文公、宋桓夫人、許穆夫人。”〔頑，在傳作昭伯〔見閔二年〕。〕\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"sourceLabel\":\"第 56 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“茨”为蒺藜，并录姚际恒以“茨”为覆牆之说；又释“中冓”为室中。\",\"fullText\":\"屈万里释“茨”为蒺藜，并录姚际恒以“茨”为覆牆之说；又释“中冓”为室中。次章释“襄”为除。末章释“讀”即“說”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-3:茨\",\"seg-003:1-2:中冓\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"sourceLabel\":\"第 56 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"次章释“襄”为除。末章释“讀”即“說”。\",\"fullText\":\"屈万里释“茨”为蒺藜，并录姚际恒以“茨”为覆牆之说；又释“中冓”为室中。次章释“襄”为除。末章释“讀”即“說”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-008:3-3:襄\",\"seg-016:3-3:讀\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"se \",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"辱\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"maoheng-zhushu-kr1c0004:0004-1:part-4\",\"zhuxi-shijichuan-kr1c0009:0003-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\",\"maoheng-zhushu-kr1c0004\",\"zhuxi-shijichuan-kr1c0009\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"题解\",\"sourceLabel\":\"第 96 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首揭露、讽刺卫国统治阶级淫乱无耻的诗。《左传》闵公二年:“初惠公之即位也少，齐人使昭伯烝于宣姜。不可，强之。生齐子、戴公、文公、宋桓夫人、许穆夫人。”《毛序》:“墙有茨，卫人刺其上也。公子顽通于君母，国人疾之而不可道也。”齐诗说:“墙茨之言，三世不安。”《易林》鲁诗说:“卫宣姜乱及三世，至戴公而后宁。”据这些记载，这首诗的讽刺对象可能就是卫宣姜。宣姜本被聘为卫宣公世子伋的妻子，后被卫宣公中途劫夺据为己有。宣公死后，他的庶长子公子顽（即顽顽）又与宣姜私通。这些乱伦的行为已经无复人理。方玉润说:“卫宫淫乱未必即止宣姜而宣姜为尤甚。……盖廉耻至是而尽丧，有诗人不忍道、不忍详、不忍读者。”分析得较中肯。此诗特点是讽刺尖锐而不直露，章末“所可道也？言之丑也”，自问自答，戛然煞住，是怎样的丑恶，丑恶到什么程度，一切都留给读者自己去想象，似直实曲，似露实隐。作诗者或因有所顾忌而辍笔，读诗者却由言外得意而骋思。\",\"fullText\":\"这是一首揭露、讽刺卫国统治阶级淫乱无耻的诗。《左传》闵公二年:“初惠公之即位也少，齐人使昭伯烝于宣姜。不可，强之。生齐子、戴公、文公、宋桓夫人、许穆夫人。”《毛序》:“墙有茨，卫人刺其上也。公子顽通于君母，国人疾之而不可道也。”齐诗说:“墙茨之言，三世不安。”《易林》鲁诗说:“卫宣姜乱及三世，至戴公而后宁。”据这些记载，这首诗的讽刺对象可能就是卫宣姜。宣姜本被聘为卫宣公世子伋的妻子，后被卫宣公中途劫夺据为己有。宣公死后，他的庶长子公子顽（即顽顽）又与宣姜私通。这些乱伦的行为已经无复人理。方玉润说:“卫宫淫乱未必即止宣姜而宣姜为尤甚。……盖廉耻至是而尽丧，有诗人不忍道、不忍详、不忍读者。”分析得较中肯。此诗特点是讽刺尖锐而不直露，章末“所可道也？言之丑也”，自问自答，戛然煞住，是怎样的丑恶，丑恶到什么程度，一切都留给读者自己去想象，似直实曲，似露实隐。作诗者或因有所顾忌而辍笔，读诗者却由言外得意而骋思。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可扫也。中冓之言，不可道也。所可道也？言之丑也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”\",\"fullText\":\"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:3-3:茨\",\"seg-002:3-3:扫\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可扫也。中冓之言，不可道也。所可道也？言之丑也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。\",\"fullText\":\"茨（cí），蒺藜。齐、韩诗作芓，茨是芓的假借字。《说文》:“芓，草盖屋。”陈启源《毛诗稽古编》:“芓兼有二种，子有三角刺八者，杜蒺藜也。子大如眉际，状如羊肾者，白蒺藜也。壮蒺藜布地蔓生，或生墙上，有小黄花，诗墙有茨指此。”扫，扫除。墙上种茨，是为了防闲内外。诗人以墙茨不可扫起兴，有内丑不可外扬之意。马瑞辰释:“左氏传云:‘人之有墙，以蔽恶也。’诗以墙茨起兴，盖取蔽恶之义。以墙茨之不可扫所以冒其墙，兴内丑之不可外扬，将以隐其恶也。”中冓（gòu），宫闱，宫廷内部。陈奂《传疏》:“中冓与墙对称，墙为宫墙，则中冓当为宫中之空。”王先谦《集疏》引韩诗，训“中冓”为“中夜”，亦通。道，说。所，尚（从闻一多以读类说）。最后二句是自问自答之词，下一章同。韵读:幽部一一扫（音叟）、道（徒叟反）、道、丑。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-2:中冓\",\"seg-004:3-3:道\",\"seg-005:3-3:道\",\"seg-006:3-3:丑\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可襄也。中冓之言，不可详也。所可详也？言之长也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”\",\"fullText\":\"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-008:3-3:襄\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可襄也。中冓之言，不可详也。所可详也？言之长也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。\",\"fullText\":\"襄，除去。按襄字本义为“解衣而耕”（见《说文》），引申为除去。山井鼎《毛诗考文》:“诗足利木，古本并作攘。”攘是襄的假借字，故出毛释文云:“攘，本或作攘。”详，细说。朱熹《集传》:“详，详言之也。”韩诗作扬，是宣扬之意，亦通。韵读:阳部一一襄、详、详、长。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:3-3:详\",\"seg-011:3-3:详\",\"seg-012:3-3:长\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可束也。中冓之言，不可读也。所可读也？言之辱也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"束，打扫干净。王先谦《集疏》:“束是总集之义，总聚而去之，言其净尽也，较扫、襄义又进。”\",\"fullText\":\"束，打扫干净。王先谦《集疏》:“束是总集之义，总聚而去之，言其净尽也，较扫、襄义又进。”读，反复地说。毛传:“读，抽也。”郑笺:“抽犹出也。”胡承珙《后笺》云:“服虔《左传》注云:‘读，抽也，抽出吉凶也。’读与绎同，于义皆为抽绎而出之，此古训也。盖道者约言之，详者多言之，读者反复言之。诗意盖谓约言之尚不可，况多言之乎？况反复言之乎？三章自有次第。”韵读:侯部一一束、读、读、辱。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-014:3-3:束\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"墙有茨，不可束也。中冓之言，不可读也。所可读也？言之辱也。\",\"sourceLabel\":\"第 97 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"读，反复地说。毛传:“读，抽也。”郑笺:“抽犹出也。”胡承珙《后笺》云:“服虔《左传》注云:‘读，抽也，抽出吉凶也。’读与绎同，于义皆为抽绎而出之，此古训也。盖道者约言之，详者多言之，读者反复言之。诗意盖谓约言之尚不可，况多言之乎？况反复言之乎？三章自有次第。”韵读:侯部一一束、读、读、辱。\",\"fullText\":\"束，打扫干净。王先谦《集疏》:“束是总集之义，总聚而去之，言其净尽也，较扫、襄义又进。”读，反复地说。毛传:“读，抽也。”郑笺:“抽犹出也。”胡承珙《后笺》云:“服虔《左传》注云:‘读，抽也，抽出吉凶也。’读与绎同，于义皆为抽绎而出之，此古训也。盖道者约言之，详者多言之，读者反复言之。诗意盖谓约言之尚不可，况多言之乎？况反复言之乎？三章自有次第。”韵读:侯部一一束、读、读、辱。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-016:3-3:读\",\"seg-017:3-3:读\",\"seg-018:3-3:辱\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"牆有茨衛人刺上也公子頑通乎君母國人疾之而不可道也\",\"sourceLabel\":\"第 2 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"牆有茨衛人刺上也公子頑通乎君母國人疾之而不可道也\",\"fullText\":\"牆有茨衛人刺上也公子頑通乎君母國人疾之而不可道也\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"sourceLabel\":\"第 2-3 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"fullText\":\"牆有茨，不可埽也。中冓之言，不可道也。所可道也，言之醜也。牆有茨，不可襄也。中冓之言，不可詳也。所可詳也，言之長也。牆有茨，不可束也。中冓之言，不可讀也。所可讀也，言之辱也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"牆有茨㊟刺衛宫淫亂無檢也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"牆有茨㊟刺衛宫淫亂無檢也。\",\"fullText\":\"牆有茨㊟刺衛宫淫亂無檢也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/046-qiang-you-ci/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《牆有茨》三章，章六句。《大序》謂「公子頑通乎君母，國人刺之」。《集傳》謂「理或然也」。衛宫淫亂，未必即止宣姜，而宣姜爲尤甚。其始既失節於宣公，而有《静女》、《新臺》之誚；其繼又失身於公子頑，而爲《牆茨》、《偕老》之羞。其中冓之言，尚可道哉？蓋廉恥至是而盡喪，有詩人不忍道、不忍詳、不忍讀者，而聖人猶録之以著於經也，何哉？楊氏時曰：「自古淫亂之君，自以爲秘於閨門之中，世無得而知者，故自肆而不反。聖人所以著之於經，使後世爲惡者知雖閨中之言，亦無隱而不彰也。其爲訓戒深矣。」斯言不獨爲此發，凡淫亂之詩，均可作如是觀。後世漢、唐吕雉、武曌之類，皆宣姜後塵。聖人早有以見及於此，故録之以爲萬世戒。而不然者，風人所不道，而謂聖人取之耶？又一宣姜也，而非而刺之者，或在《邶》，或在《鄘》，《衛》詩中則無有，意者邶、鄘二國亡於衛，其人心不能無所憾，故多指其瑕而刺之。至衛本國人不敢非其大夫，況顯彰君惡哉？此二國雖亡，是非未泯，不能不存其名之一證也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《牆有茨》三章，章六句。《大序》謂「公子頑通乎君母，國人刺之」。《集傳》謂「理或然也」。衛宫淫亂，未必即止宣姜，而宣姜爲尤甚。其始既失節於宣公，而有《静女》、《新臺》之誚；其繼又失身於公子頑，而爲《牆茨》、《偕老》之羞。其中冓之言，尚可道哉？蓋廉恥至是而盡喪，有詩人不忍道、不忍詳、不忍讀者，而聖人猶録之以著於經也，何哉？楊氏時曰：「自古淫亂之君，自以爲秘於閨門之中，世無得而知者，故自肆而不反。聖人所以著之於經，使後世爲惡者知雖閨中之言，亦無隱而不彰也。其爲訓戒深矣。」斯言不獨爲此發，凡淫亂之詩，均可作如是觀。後世漢、唐吕雉、武曌之類，皆宣姜後塵。聖人早有以見及於此，故録之以爲萬世戒。而不然者，風人所不道，而謂聖人取之耶？又一宣姜也，而非而刺之者，或在《邶》，或在《鄘》，《衛》詩中則無有，意者邶、鄘二國亡於衛，
