i:0001-1:part-7","chengjunying-jiangjianyuan-zhuxi:0001-1:part-8"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/129-jian-jia/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。","sourceLabel":"第 292-294 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首情意飘逸而求之不得的诗。题解梳理毛序、朱熹、方玉润等说，认为最可从诗中难与人言的思慕情致来理解。三章写深秋清晨河边不同时间的景象，借蒹葭白露起兴，写寻求“伊人”而终不可即。","fullText":"这是一首情意飘逸而求之不得的诗。题解梳理毛序、朱熹、方玉润等说，认为最可从诗中难与人言的思慕情致来理解。三章写深秋清晨河边不同时间的景象，借蒹葭白露起兴，写寻求“伊人”而终不可即。蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭，初生芦苇。苍苍，淡青色。白露为霜，言深秋露重。伊人，是人。方，旁，一方即一旁。溯洄，逆流向上，也可指沿岸逆流而行。道阻且长，言道路险阻而远。溯游，顺流向下。宛，好像。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。凄凄，湿润貌。晞，干。湄，水与草交接之处。跻，登高。坻，水中小沙洲。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。采采，众多貌。已，止，指露未全干。涘，水边。右，曲折迂回。沚，水中小沙滩。韵读：阳部苍、霜、方、长、央；脂部凄、晞、湄、跻、坻；之部采、已、涘、右、沚。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/129-jian-jia/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从 部凄、晞、湄、跻、坻；之部采、已、涘、右、沚。","notes":null,"partOrder":8,"anchorIds":["seg-001:3-3:苍","seg-002:4-4:霜","seg-004:4-4:方","seg-006:4-4:长","seg-008:5-5:央","seg-009:3-3:凄","seg-010:4-4:晞","seg-012:4-4:湄","seg-014:4-4:跻","seg-016:5-5:坻","seg-017:3-3:采","seg-018:4-4:已","seg-020:4-4:涘","seg-022:4-4:右","seg-024:5-5:沚"],"glossAnchorIds":["anchor-8-1","anchor-8-2","anchor-8-3","anchor-8-4","anchor-8-5","anchor-8-6","anchor-8-7","anchor-8-8","anchor-8-9","anchor-8-10","anchor-8-11","anchor-8-12","anchor-8-13","anchor-8-14","anchor-8-15"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"蒹葭蒼蒼，白露爲霜。所謂伊人，在水一方。遡洄從之，道阻且長。遡游從之，宛在水中央。蒹葭淒淒，白露未晞。所謂伊人，在水之湄。遡洄從之，道阻且躋。遡游從之，宛在水中坻。蒹葭采采，白露未已。所謂伊人，在水之涘。遡洄從之，道阻且右。遡游從之，宛在水中沚。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"题注","excerpt":"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。","fullText":"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。","notes":"题注段落原文。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。眉評三章只一意，特换韻耳。其實首章已成絶唱。古人作詩多一意化爲三疊，所謂一唱三歎，佳者多有餘音。此則興盡首章，不可不知也。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"总评","excerpt":"总评将此诗解释为招隐之作，眉评则强调三章同旨而首章已成绝唱。","fullText":"总评将此诗解释为招隐之作，眉评则强调三章同旨而首章已成绝唱。","notes":"将眉评合入总评段。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"集釋蒹〔《集傳》〕蒹，似雈而細，高數尺，又謂之薕。〔陸氏佃曰〕今人以爲簾箔，因以得名。葭蘆也。〔陸氏佃曰〕孔氏云：「初生爲葭，長大爲蘆，成則爲葦。」遡洄逆流而上也。遡游順流而下也。晞乾也。湄水草之交也。躋升也。采采盛而可采也。右言其迂迴也。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"集释","excerpt":"集释说明蒹葭、水边地貌与遡洄遡游等词义。","fullText":"集释说明蒹葭、水边地貌与遡洄遡游等词义。","notes":"集释原文。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0004-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"標韻蒼七陽。霜、方、長、央並同。本韻。淒八齊。晞五微。湄四支。坻四支。通韻。采十賄。已四紙。涘同。右二十五有，叶羽軌反。沚四紙。叶韻。","sourceLabel":null,"attributionLabel":"詩經原始_方玉润_李先耕点校_上下","sectionLabel":"韵读","excerpt":"标韵记录三章押韵字及其韵部。","fullText":"标韵记录三章押韵字及其韵部。","notes":"韵读原文。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]}]}}}</script><script id="__SHIJING_POEM_STRUCTURED_DATA__" type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","@id":"https://shisao.taozeyu.com/shijing/#website","name":"诗骚集注","url":"https://shisao.taozeyu.com/shijing/","inLanguage":"zh-Hans"},{"@type":"BreadcrumbList","@id":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/#breadcrumb","itemListElement":[{"@type":"ListItem","position":1,"name":"诗经","item":"https://shisao.taozeyu.com/shijing/"},{"@type":"ListItem","position":2,"name":"風","item":"https://shisao.taozeyu.com/shijing/#feng"},{"@type":"ListItem","position":3,"name":"秦風","item":"https://shisao.taozeyu.com/shijing/#qinfeng"},{"@type":"ListItem","position":4,"name":"蒹葭","item":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/"}]},{"@type":"CreativeWork","@id":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/#poem","url":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/","name":"蒹葭","description":"風 · 秦風 · 汇聚 2 种资料、5 条注脚的《蒹葭》阅读页。","text":"蒹葭苍苍\n白露为霜\n所谓伊人\n在水一方\n溯洄从之\n道阻且长\n溯游从之\n宛在水中央\n蒹葭凄凄\n白露未晞\n所谓伊人\n在水之湄\n溯洄从之\n道阻且跻\n溯游从之\n宛在水中坻\n蒹葭采采\n白露未已\n所谓伊人\n在水之涘\n溯洄从之\n道阻且右\n溯游从之\n宛在水中沚","inLanguage":"zh-Hans","genre":"诗歌","isPartOf":{"@id":"https://shisao.taozeyu.com/shijing/#website"},"about":[{"@type":"Thing","name":"诗经"},{"@type":"Thing","name":"風"},{"@type":"Thing","name":"秦風"}]},{"@type":"WebPage","@id":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/#webpage","url":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/","name":"蒹葭 · 逐字注脚阅读","description":"風 · 秦風 · 汇聚 2 种资料、5 条注脚的《蒹葭》阅读页。","inLanguage":"zh-Hans","isPartOf":{"@id":"https://shisao.taozeyu.com/shijing/#website"},"breadcrumb":{"@id":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/#breadcrumb"},"mainEntity":{"@id":"https://shisao.taozeyu.com/shijing/poem/129-jian-jia/#poem"}}]}</script><div class="min-h-screen bg-paper text-ink"><header class="sticky top-0 z-40 border-b border-[color:color \",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。\",\"sourceLabel\":\"第 292-294 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首情意飘逸而求之不得的诗。题解梳理毛序、朱熹、方玉润等说，认为最可从诗中难与人言的思慕情致来理解。三章写深秋清晨河边不同时间的景象，借蒹葭白露起兴，写寻求“伊人”而终不可即。\",\"fullText\":\"这是一首情意飘逸而求之不得的诗。题解梳理毛序、朱熹、方玉润等说，认为最可从诗中难与人言的思慕情致来理解。三章写深秋清晨河边不同时间的景象，借蒹葭白露起兴，写寻求“伊人”而终不可即。蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭，初生芦苇。苍苍，淡青色。白露为霜，言深秋露重。伊人，是人。方，旁，一方即一旁。溯洄，逆流向上，也可指沿岸逆流而行。道阻且长，言道路险阻而远。溯游，顺流向下。宛，好像。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。凄凄，湿润貌。晞，干。湄，水与草交接之处。跻，登高。坻，水中小沙洲。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。采采，众多貌。已，止，指露未全干。涘，水边。右，曲折迂回。沚，水中小沙滩。韵读：阳部苍、霜、方、长、央；脂部凄、晞、湄、跻、坻；之部采、已、涘、右、沚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。\",\"sourceLabel\":\"第 292-294 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。\",\"f xt\":\"蒹葭蒼蒼，白露爲霜。所謂伊人，在水一方。遡洄從之，道阻且長。遡游從之，宛在水中央。蒹葭淒淒，白露未晞。所謂伊人，在水之湄。遡洄從之，道阻且躋。遡游從之，宛在水中坻。蒹葭采采，白露未已。所謂伊人，在水之涘。遡洄從之，道阻且右。遡游從之，宛在水中沚。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。\",\"fullText\":\"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。眉評三章只一意，特换韻耳。其實首章已成絶唱。古人作詩多一意化爲三疊，所謂一唱三歎，佳者多有餘音。此則興盡首章，不可不知也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"总评将此诗解释为招隐之作，眉评则强调三章同旨而首章已成绝唱。\",\"fullText\":\"总评将此诗解释为招隐之作，眉评则强调三章同旨而首章已成绝唱。\",\"notes\":\"将眉评合入总评段。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋蒹〔《集傳》〕蒹，似雈而細，高數尺，又謂之薕。〔陸氏佃曰〕今人以爲簾箔，因以得名。葭蘆也。〔陸氏佃曰〕孔氏云：「初生爲葭，長大爲蘆，成則爲葦。」遡洄逆流而上也。遡游順流而下也。晞乾也。湄水草之交也。躋升也。采采盛而可采也。右言其迂迴也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"集释说明蒹葭、水边地貌与遡洄遡游等词义。\",\"fullText\":\"集释说明蒹葭、水边地貌与遡洄遡游等词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻蒼七陽。霜、方、長、央並同。本韻。淒八齊。晞五微。湄四支。坻四支。通韻。采十賄。已四紙。涘同。右二十五有，叶羽軌反。沚四紙。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录三章押韵字及其韵部。\",\"fullText\":\"标韵记录三章押韵字及其韵部。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}}"])</script><script>self.__next_f.push([1,"13:[[\"$\",\"script\",null,{\"id\":\"__SHIJING_PAGE_DATA__\",\"type\":\"application/json\",\"data-page-kind\":\"poem-detail\",\"data-page-href\":\"/shijing/poem/129-jian-jia\",\"data-page-data-href\":\"/__data/shijing/poem/129-jian-jia/data.json\",\"dangerouslySetInnerHTML\":{\"__html\":\"$1d\"}}],\"$L1e\",\"$L1f\"]\n"])</script><script>self.__next_f.push([1,"21:I[631,[\"619\",\"static/chunks/619-ba102abea3e3d0e4.js\",\"356\",\"static/chunks/356-1cbf59d25a49fb83.js\",\"909\",\"static/chunks/909-9eb9e001d16de97f.js\",\"600\",\"static/chunks/app/shijing/poem/%5BpoemId%5D/page-aed9ab3190ba59dd.js\"],\"PoemReader\"]\n20:T838,"])</script><script>self.__next_f.push([1,"{\"@context\":\"https://schema.org\",\"@graph\":[{\"@type\":\"WebSite\",\"@id\":\"ht xt\":\"沚\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-8\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。\",\"sourceLabel\":\"第 292-294 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首情意飘逸而求之不得的诗。题解梳理毛序、朱熹、方玉润等说，认为最可从诗中难与人言的思慕情致来理解。三章写深秋清晨河边不同时间的景象，借蒹葭白露起兴，写寻求“伊人”而终不可即。\",\"fullText\":\"这是一首情意飘逸而求之不得的诗。题解梳理毛序、朱熹、方玉润等说，认为最可从诗中难与人言的思慕情致来理解。三章写深秋清晨河边不同时间的景象，借蒹葭白露起兴，写寻求“伊人”而终不可即。蒹葭苍苍，白露为霜。所谓伊人，在水一方。溯洄从之，道阻且长。溯游从之，宛在水中央。蒹葭，初生芦苇。苍苍，淡青色。白露为霜，言深秋露重。伊人，是人。方，旁，一方即一旁。溯洄，逆流向上，也可指沿岸逆流而行。道阻且长，言道路险阻而远。溯游，顺流向下。宛，好像。蒹葭凄凄，白露未晞。所谓伊人，在水之湄。溯洄从之，道阻且跻。溯游从之，宛在水中坻。凄凄，湿润貌。晞，干。湄，水与草交接之处。跻，登高。坻，水中小沙洲。蒹葭采采，白露未已。所谓伊人，在水之涘。溯洄从之，道阻且右。溯游从之，宛在水中沚。采采，众多貌。已，止，指露未全干。涘，水边。右，曲折迂回。沚，水中小沙滩。韵读：阳部苍、霜、方、长、央；脂部凄、晞、湄、跻、坻；之部采、已、涘、右、沚。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"mate eg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"蒹葭蒼蒼，白露爲霜。所謂伊人，在水一方。遡洄從之，道阻且長。遡游從之，宛在水中央。蒹葭淒淒，白露未晞。所謂伊人，在水之湄。遡洄從之，道阻且躋。遡游從之，宛在水中坻。蒹葭采采，白露未已。所謂伊人，在水之涘。遡洄從之，道阻且右。遡游從之，宛在水中沚。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"题注\",\"excerpt\":\"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。\",\"fullText\":\"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。\",\"notes\":\"题注段落原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《蒹葭》三章，章八句。此詩在《秦風》中，氣味絶不相類。以好戰樂鬥之邦，忽遇高超遠舉之作，可謂鶴立鷄群，翛然自異者矣。然意必有所指，非泛然者。《序》謂「刺襄公，未能用周禮」。吕氏祖謙遂謂「伊人猶此理」。鑿之又鑿，可爲噴飯。蓋秦處周地，不能用周禮。周之賢臣遺老，隱處水濱不肯出仕。詩人惜之，託爲招隱，作此見志。一爲賢惜，一爲世望。曰「伊人」、曰「從之」、曰「宛在」，玩其詞，雖若可望不可即，味其意，實求之而不遠，思之而即至者。特無心以求之，則其人倜乎遠矣。《序》本有指，辭不能達，故致紛紛議起也。眉評三章只一意，特换韻耳。其實首章已成絶唱。古人作詩多一意化爲三疊，所謂一唱三歎，佳者多有餘音。此則興盡首章，不可不知也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"总评\",\"excerpt\":\"总评将此诗解释为招隐之作，眉评则强调三章同旨而首章已成绝唱。\",\"fullText\":\"总评将此诗解释为招隐之作，眉评则强调三章同旨而首章已成绝唱。\",\"notes\":\"将眉评合入总评段。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋蒹〔《集傳》〕蒹，似雈而細，高數尺，又謂之薕。〔陸氏佃曰〕今人以爲簾箔，因以得名。葭蘆也。〔陸氏佃曰〕孔氏云：「初生爲葭，長大爲蘆，成則爲葦。」遡洄逆流而上也。遡游順流而下也。晞乾也。湄水草之交也。躋升也。采采盛而可采也。右言其迂迴也。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"集释\",\"excerpt\":\"集释说明蒹葭、水边地貌与遡洄遡游等词义。\",\"fullText\":\"集释说明蒹葭、水边地貌与遡洄遡游等词义。\",\"notes\":\"集释原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/129-jian-jia/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻蒼七陽。霜、方、長、央並同。本韻。淒八齊。晞五微。湄四支。坻四支。通韻。采十賄。已四紙。涘同。右二十五有，叶羽軌反。沚四紙。叶韻。\",\"sourceLabel\":null,\"attributionLabel\":\"詩經原始_方玉润_李先耕点校_上下\",\"sectionLabel\":\"韵读\",\"excerpt\":\"标韵记录三章押韵字及其韵部。\",\"fullText\":\"标韵记录三章押韵字及其韵部。\",\"notes\":\"韵读原文。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]}]}}]\n"])</script><script>self.__next_f.push([1,"19:[[\"$\",\"meta\",\"0\",{\"charSet\":\"utf-8\"}],[\"$\",\"meta\",\"1\",{\"name\":\"viewport\",\"content\":\"width=device-width, initial-scale=1\"}]]\n15:null\n"])</script><script>self.__next_f.push([1,"22:I[622,[],\"IconMark\"]\n"])</script><script>self.__next_f.push([1,"17:{\"metadata\":[[\"$\",\"title\",\"0\",{\"children\":\"蒹葭 ·
