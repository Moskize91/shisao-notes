tryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-7"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-009:1-7:尚之以琼英乎而","segmentId":"seg-009","segmentOrder":9,"surfaceText":"尚之以琼英乎而","charStart":1,"charEnd":7,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-6"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-009:4-5:琼英","segmentId":"seg-009","segmentOrder":9,"surfaceText":"琼英","charStart":4,"charEnd":5,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-3"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/098-zhu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。","sourceLabel":"第 207-208 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。","fullText":"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟，等待。著，音义同“宁”，大门和屏风之间的地方。尔雅释宫：“门屏之间谓之宁。”现在北京旧四合院的房子，院中多有屏风。门屏之间即古代的著。乎而，语尾助词。这句意为，新娘在房内看见来亲迎的夫婿已经进了大门，在院内屏风间等着她。充耳，古代男子的一种冠饰。从冠两旁垂下，悬在耳边。将充耳系在冠上的杂色丝线称“瑱”，丝线垂到耳边打成一个结像绵球称“纩”，纩下垂着玉称“瑱”。素，白色。尚，加。段玉裁说文解字注：“尚，上也，皆积累加高之义。”琼华，与下章琼莹、琼英都是描写玉瑱。华，光华。莹，晶莹。说文：“莹，玉色也。”英，瑛之假借。说文：“瑛，玉光也。”姚际恒诗经通论：“琼，赤玉，贵者用之。华、莹、英取协韵，以赞其玉之色泽也。”这种解释最得诗旨。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。庭，中庭，地方比著更进了一层。青，指青色的纩。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。堂，堂上。黄，指黄色的纩。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/098-zhu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。","sourceLabel":"第 207-208 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。","fullText":"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟，等待。著，音义同“宁”，大门和屏风之间的地方。尔雅释宫：“门屏之间谓之宁。”现在北京旧四合院的房子，院中多有屏风。门屏之间即古代的著。乎而，语尾助词。这句意为，新娘在房内看见来亲迎的夫婿已经进了大门，在院内屏风间等着她。充耳，古代男子的一种冠饰。从冠两旁垂下，悬在耳边。将充耳系在冠上的杂色丝线称“瑱”，丝线垂到耳边打成一个结像绵球称“纩”，纩下垂着玉称“瑱”。素，白色。尚，加。段玉裁说文解字注：“尚，上也，皆积累加高之义。”琼华，与下章琼莹、琼英都是描写玉瑱。华，光华。莹，晶莹。说文：“莹，玉色也。”英，瑛之假借。说文：“瑛，玉光也。”姚际恒诗经通论：“琼，赤玉，贵者用之。华、莹、英取协韵，以赞其玉之色泽也。”这种解释最得诗旨。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。庭，中庭，地方比著更进了一层。青，指青色的纩。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。堂，堂上。黄，指黄色的纩。","notes":null,"partOrder":2,"anchorIds":["seg-001:1-6:俟我于著乎而","seg-002:1-6:充耳以素乎而","seg-003:1-7:尚之以琼华乎而"],"glossAnchorIds":["anchor-2-1","anchor-2-2","anchor-2-3"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3","annotationId":"0001","glo ing-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-007:1-6:俟我于堂乎而\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"俟我于堂乎而\",\"charStart\":1,\"charEnd\":6,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-007:4-4:堂\",\"segmentId\":\"seg-007\",\"segmentOrder\":7,\"surfaceText\":\"堂\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-008:1-6:充耳以黄乎而\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"充耳以黄乎而\",\"charStart\":1,\"charEnd\":6,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-008:4-4:黄\",\"segmentId\":\"seg-008\",\"segmentOrder\":8,\"surfaceText\":\"黄\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-009:1-7:尚之以琼英乎而\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"尚之以琼英乎而\",\"charStart\":1,\"charEnd\":7,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-009:4-5:琼英\",\"segmentId\":\"seg-009\",\"segmentOrder\":9,\"surfaceText\":\"琼英\",\"charStart\":4,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/098-zhu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。\",\"sourceLabel\":\"第 207-208 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。\",\"fullText\":\"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟，等待。著，音义同“宁”，大门和屏风之间的地方。尔雅释宫：“门屏之间谓之宁。”现在北京旧四合院的房子，院中多有屏风。门屏之间即古代的著。乎而，语尾助词。这句意为，新娘在房内看见来亲迎的夫婿已经进了大门，在院内屏风间等着她。充耳，古代男子的一种冠饰。从冠两旁垂下，悬在耳边。将充耳系在冠上的杂色丝线称“瑱”，丝线垂到耳边打成一个结像绵球称“纩”，纩下垂着玉称“瑱”。素，白色。尚，加。段玉裁说文解字注：“尚，上也，皆积累加高之义。”琼华，与下章琼莹、琼英都是描写玉瑱。华，光华。莹，晶莹。说文：“莹，玉色也。”英，瑛之假借。说文：“瑛，玉光也。”姚际恒诗经通论：“琼，赤玉，贵者用之。华、莹、英取协韵，以赞其玉之色泽也。”这种解释最得诗旨。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。庭，中庭，地方比著更进了一层。青，指青色的纩。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。堂，堂上。黄，指黄色的纩。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/098-zhu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。\",\"sourceLabel\":\"第 207-208 页\",\"attributionLabel\":\"程俊英、 [\"seg-007:1-6:俟我于堂乎而\",\"seg-008:1-6:充耳以黄乎而\",\"seg-009:1-7:尚之以琼英乎而\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-7\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/098-zhu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。\",\"sourceLabel\":\"第 207-208 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"堂，堂上。黄，指黄色的纩。\",\"fullText\":\"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟，等待。著，音义同“宁”，大门和屏风之间的地方。尔雅释宫：“门屏之间谓之宁。”现在北京旧四合院的房子，院中多有屏风。门屏之间即古代的著。乎而，语尾助词。这句意为，新娘在房内看见来亲迎的夫婿已经进了大门，在院内屏风间等着她。充耳，古代男子的一种冠饰。从冠两旁垂下，悬在耳边。将充耳系在冠上的杂色丝线称“瑱”，丝线垂到耳边打成一个结像绵球称“纩”，纩下垂着玉称“瑱”。素，白色。尚，加。段玉裁说文解字注：“尚，上也，皆积累加高之义。”琼华，与下章琼莹、琼英都是描写玉瑱。华，光华。莹，晶莹。说文：“莹，玉色也。”英，瑛之假借。说文：“瑛，玉光也。”姚际恒诗经通论：“琼，赤玉，贵者用之。华、莹、英取协韵，以赞其玉之色泽也。”这种解释最得诗旨。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。庭，中庭，地方比著更进了一层。青，指青色的纩。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。堂，堂上。黄，指黄色的纩。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-007:4-4:堂\",\"seg-008:4-4:黄\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺不親迎也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺不親迎也。\",\"fullText\":\"刺不親迎也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《著》三章，章三句。《序》謂「刺時」。夫親迎即是昏禮，禮重親迎，所以正夫婦、别嫌疑。齊俗不親迎，故《序》以爲刺，然詩詞明明寫親迎之事，自與《序》不合。毛氏特以變風無美詞耳。其實此詩正是一位女子寫其夫婿來親迎時之喜悦之情。每章只易三字，而情景步步深入：自著而庭而堂，新郎容止服飾，漸次逼近，於是新婦滿心歡喜，情不自禁，哼成此篇。其詞一唱三歎，舒徐婉轉，曲盡新嫁娘既喜且羞之情態，真妙品也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《著》三章，章三句。《序》謂「刺時」。夫親迎即是昏禮，禮重親迎，所以正夫婦、别嫌疑。齊俗不親迎，故《序》以爲刺，然詩詞明明寫親迎之事，自與《序》不合。毛氏特以變風無美詞耳。其實此詩正是一位女子寫其夫婿來親迎時之喜悦之情。每章只易三字，而情景步步深入：自著而庭而堂，新郎容止服飾，漸次逼近，於是新婦滿心歡喜，情不自禁，哼成此篇。其詞一唱三歎，舒徐婉轉，曲盡新嫁娘既喜且羞之情態，真妙品也。\",\"fullText\":\"右《著》三章，章三句。《序》謂「刺時」。夫親迎即是昏禮，禮重親迎，所以正夫婦、别嫌疑。齊俗不親迎，故《序》以爲刺，然詩詞明明寫親迎之事，自與《序》不合。毛氏特以變風無美詞耳。其實此詩正是一位女子寫其夫婿來親迎時之喜悦之情。每章只易三字，而情景步步深入：自著而庭而堂，新郎容止服飾，漸次逼近，於是新婦滿心歡喜，情不自禁，哼成此篇。其詞一唱三歎，舒徐婉轉，曲盡新嫁娘既喜且羞之情態，真妙品也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"著門屏之間也。充耳冠飾也。尚加也。瓊華美石之有光華者。庭中庭也。青青色也。瓊瑩玉色也。堂堂上也。黄黄色也。瓊英玉之精華也。\",\"sourceL rEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/098-zhu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。\",\"sourceLabel\":\"第 207-208 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。\",\"fullText\":\"这是一位女子写她的夫婿来亲迎的诗。毛序：“著，刺时也。时不亲迎也。”这首诗通体无刺意，毛序显然是以美诗为刺。这是“变风必为刺诗”的成见在作祟。撇开这点谬误不谈，毛序指出诗的内容是亲迎还是正确的。余冠英《诗经选》：“中庭是她和新郎第一次相见的地方。充耳以素，尚之以琼华，是新郎给她的第一个印象。”这几句话，将诗意讲得更明白。陈子展《诗经直解》认为也可能是“贵族女子出嫁，女伴相随歌唱之词，有如后世新妇伴娘之歌词赞颂然”。这种推测亦颇有情致。全诗三章，每章只易三个字，反映的也只是一种情绪，即少女出嫁前的喜悦。新郎容光焕发，冠饰华丽，诚心诚意地等在堂前接她。她感到心满意足，于是情不自禁地哼出这首诗来。每句均以“乎而”二虚词收尾，音节舒迟宽缓，虽然含蓄曲折，却自然入妙。俟我于著乎而，充耳以素乎而，尚之以琼华乎而。俟，等待。著，音义同“宁”，大门和屏风之间的地方。尔雅释宫：“门屏之间谓之宁。”现在北京旧四合院的房子，院中多有屏风。门屏之间即古代的著。乎而，语尾助词。这句意为，新娘在房内看见来亲迎的夫婿已经进了大门，在院内屏风间等着她。充耳，古代男子的一种冠饰。从冠两旁垂下，悬在耳边。将充耳系在冠上的杂色丝线称“瑱”，丝线垂到耳边打成一个结像绵球称“纩”，纩下垂着玉称“瑱”。素，白色。尚，加。段玉裁说文解字注：“尚，上也，皆积累加高之义。”琼华，与下章琼莹、琼英都是描写玉瑱。华，光华。莹，晶莹。说文：“莹，玉色也。”英，瑛之假借。说文：“瑛，玉光也。”姚际恒诗经通论：“琼，赤玉，贵者用之。华、莹、英取协韵，以赞其玉之色泽也。”这种解释最得诗旨。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。庭，中庭，地方比著更进了一层。青，指青色的纩。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。堂，堂上。黄，指黄色的纩。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\" 之假借。说文：“瑛，玉光也。”姚际恒诗经通论：“琼，赤玉，贵者用之。华、莹、英取协韵，以赞其玉之色泽也。”这种解释最得诗旨。俟我于庭乎而，充耳以青乎而，尚之以琼莹乎而。庭，中庭，地方比著更进了一层。青，指青色的纩。俟我于堂乎而，充耳以黄乎而，尚之以琼英乎而。堂，堂上。黄，指黄色的纩。\",\"notes\":null,\"partOrder\":7,\"anchorIds\":[\"seg-007:4-4:堂\",\"seg-008:4-4:黄\"],\"glossAnchorIds\":[\"anchor-7-1\",\"anchor-7-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺不親迎也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺不親迎也。\",\"fullText\":\"刺不親迎也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《著》三章，章三句。《序》謂「刺時」。夫親迎即是昏禮，禮重親迎，所以正夫婦、别嫌疑。齊俗不親迎，故《序》以爲刺，然詩詞明明寫親迎之事，自與《序》不合。毛氏特以變風無美詞耳。其實此詩正是一位女子寫其夫婿來親迎時之喜悦之情。每章只易三字，而情景步步深入：自著而庭而堂，新郎容止服飾，漸次逼近，於是新婦滿心歡喜，情不自禁，哼成此篇。其詞一唱三歎，舒徐婉轉，曲盡新嫁娘既喜且羞之情態，真妙品也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《著》三章，章三句。《序》謂「刺時」。夫親迎即是昏禮，禮重親迎，所以正夫婦、别嫌疑。齊俗不親迎，故《序》以爲刺，然詩詞明明寫親迎之事，自與《序》不合。毛氏特以變風無美詞耳。其實此詩正是一位女子寫其夫婿來親迎時之喜悦之情。每章只易三字，而情景步步深入：自著而庭而堂，新郎容止服飾，漸次逼近，於是新婦滿心歡喜，情不自禁，哼成此篇。其詞一唱三歎，舒徐婉轉，曲盡新嫁娘既喜且羞之情態，真妙品也。\",\"fullText\":\"右《著》三章，章三句。《序》謂「刺時」。夫親迎即是昏禮，禮重親迎，所以正夫婦、别嫌疑。齊俗不親迎，故《序》以爲刺，然詩詞明明寫親迎之事，自與《序》不合。毛氏特以變風無美詞耳。其實此詩正是一位女子寫其夫婿來親迎時之喜悦之情。每章只易三字，而情景步步深入：自著而庭而堂，新郎容止服飾，漸次逼近，於是新婦滿心歡喜，情不自禁，哼成此篇。其詞一唱三歎，舒徐婉轉，曲盡新嫁娘既喜且羞之情態，真妙品也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"著門屏之間也。充耳冠飾也。尚加也。瓊華美石之有光華者。庭中庭也。青青色也。瓊瑩玉色也。堂堂上也。黄黄色也。瓊英玉之精華也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"著門屏之間也。\",\"fullText\":\"著門屏之間也。充耳冠飾也。尚加也。瓊華美石之有光華者。庭中庭也。青青色也。瓊瑩玉色也。堂堂上也。黄黄色也。瓊英玉之精華也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"著門屏之間也。充耳冠飾也。尚加也。瓊華美石之有光華者。庭中庭也。青青色也。瓊瑩玉色也。堂堂上也。黄黄色也。瓊英玉之精華也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"充耳冠飾也。\",\"fullText\":\"著門屏之間也。充耳冠飾也。尚加也。瓊華美石之有光華者。庭中庭也。青青色也。瓊瑩玉色也。堂堂上也。黄黄色也。瓊英玉之精華也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-3\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/098-zhu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"著門屏之間也。充耳冠飾也。尚加也。瓊華美石之有光華者。庭中庭也。青青色也。瓊瑩玉色也。堂堂上也。黄黄色也。瓊英玉之精華也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"尚加也。\",\"fullText\":\"著門屏之間也。充耳冠
