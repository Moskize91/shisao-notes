前两章前两句是兴，通过对风紧雪盛的描述，来渲染悲惨气氛，写得凛凛有寒意。二是音节的变化。各章前四句辞尚宽缓，至末二句忽作促音，更加深了这种紧张感。三是形象的语言，“其虚其邪，既亟只且”，自问自答，通过人的紧张情绪，将这种迫不及待的气氛，淋漓尽致地表现出来。至末章以赤狐、黑乌不祥的动物象征暴虐的统治者，尤为形象。","fullText":"这是人民不堪卫国虐政招呼朋友共同逃亡的诗。毛序：“刺虐也。卫国并为威虐，百姓不亲，莫不相携持而去焉。”这段话还合诗意。方玉润诗经原始：“此篇不知其为卫作乎？抑为邶言乎？若以诗编邶风内，则当为邶言为是。”邶亡于卫在什么时候，史不可考。据方的说法，这首诗是反映邶亡前统治阶级的暴虐腐败、社会混乱和人民纷纷逃亡的情况，可备一说。朱熹言此诗“气象愁惨”。读这首诗，确实使人感到一种紧张恐惧的气氛，这种气氛，主要通过三方面来表现。一是景物的描写。诗前两章前两句是兴，通过对风紧雪盛的描述，来渲染悲惨气氛，写得凛凛有寒意。二是音节的变化。各章前四句辞尚宽缓，至末二句忽作促音，更加深了这种紧张感。三是形象的语言，“其虚其邪，既亟只且”，自问自答，通过人的紧张情绪，将这种迫不及待的气氛，淋漓尽致地表现出来。至末章以赤狐、黑乌不祥的动物象征暴虐的统治者，尤为形象。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0002-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"北风其凉，雨雪其雱。惠而好我，携手同行。其虚其邪？既亟只且！","sourceLabel":"第 87-88 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"雨雪，下雪。雨在这里作动词用。雱（páng），雪盛貌。毛传：“雱，盛貌。”按雱是滂的籀文。说文：“滂，沛也。”段注：“籀文从雨，众多如雨意也。毛云盛，与许云沛正合。”其雱，即雱雱。上句“其凉”，即凉凉。诗人以凉风喻虐政，以雨雪喻社会纷乱。惠而，即惠然，顺从、赞成之意。马瑞辰通释：“终风诗‘惠然肯来’，传：‘惠，顺也。’此诗惠而，犹惠然也。惠亦当为顺，惠然，谓顺貌也。”行（háng），道路。郑笺：“与我相携持同道而去，疾时政也。”其，语助词。虚，舒的假借字。邪，鲁、齐诗作徐，邪是徐的假借字。虚邪，叠韵，即舒徐，缓慢而犹豫不决貌。亟，同急。既亟，事已紧急。只且（jū），语尾助词，其作用与“也哉”相同。王先谦集疏：“诗人见其同行者从容安雅之状如此，又速之曰‘既亟只且’，犹言事已急矣，尚不速行而为此徐徐之态乎？”韵读：阳部一一凉、雱、行（音杭）。鱼部一一虚、邪（音徐）、且。","fullText":"雨雪，下雪。雨在这里作动词用。雱（páng），雪盛貌。毛传：“雱，盛貌。”按雱是滂的籀文。说文：“滂，沛也。”段注：“籀文从雨，众多如雨意也。毛云盛，与许云沛正合。”其雱，即雱雱。上句“其凉”，即凉凉。诗人以凉风喻虐政，以雨雪喻社会纷乱。惠而，即惠然，顺从、赞成之意。马瑞辰通释：“终风诗‘惠然肯来’，传：‘惠，顺也。’此诗惠而，犹惠然也。惠亦当为顺，惠然，谓顺貌也。”行（háng），道路。郑笺：“与我相携持同道而去，疾时政也。”其，语助词。虚，舒的假借字。邪，鲁、齐诗作徐，邪是徐的假借字。虚邪，叠韵，即舒徐，缓慢而犹豫不决貌。亟，同急。既亟，事已紧急。只且（jū），语尾助词，其作用与“也哉”相同。王先谦集疏：“诗人见其同行者从容安雅之状如此，又速之曰‘既亟只且’，犹言事已急矣，尚不速行而为此徐徐之态乎？”韵读：阳部一一凉、雱、行（音杭）。鱼部一一虚、邪（音徐）、且。","notes":null,"partOrder":1,"anchorIds":["seg-002:1-1:雨","seg-002:4-4:雱","seg-001:4-4:凉","seg-003:1-1:惠","seg-004:4-4:行","seg-005:2-2:虚","seg-005:4-4:邪","seg-006:2-2:亟","seg-006:3-4:只且"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3","anchor-1-4","anchor-1-5","anchor-1-6","anchor-1-7","anchor-1-8","anchor-1-9"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0003-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"北风其喈，雨雪其霏。惠而好我，携手同归。其虚其邪？既亟只且！","sourceLabel":"第 88 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"王事，有关周王朝的差事。朱熹诗集传：“王事，王命使为之事也。”适，投掷。按适（通）是“掷”字的省借。说文：“掷，搔也。一曰投也。”适我，犹云都扔给我。政事，卫国国内的政事。郑笺训政事为赋税之事。一，皆、完全。埠（pí），使。按埠是俾的假借字。说文：“俾，益也。”段注：“俾与埠、裨、僻，音义皆同。今俾行而埠、裨皆废矣。经传之俾皆训使也，无异解，盖即益义之引申。”这句意为国内的政事都使加在我身上。室人，家人。交，更迭，轮流。滴（zhé），责备。毛传：“滴，责也。”韵读：支部一一适、益、滴（音摘入声）。歌部一一为、何。","fullText":"王事，有关周王朝的差事。朱熹诗集传：“王事，王命使为之事也。”适，投掷。按适（通）是“掷”字的省借。说文：“掷，搔也。一曰投也。”适我，犹云都扔给我。政事，卫国国内的政事。郑笺训政事为赋税之事。一，皆、完全。埠（pí），使。按埠是俾的假借字。说文：“俾，益也。”段注：“俾与埠、裨、僻，音义皆同。今俾行而埠、裨皆废矣。经传之俾皆训使也，无异解，盖即益义之引申。”这句意为国内的政事都使加在我身上。室人，家人。交，更迭，轮流。滴（zhé），责备。毛传：“滴，责也。”韵读：支部一一适、益、滴（音摘入声）。歌部一一为、何。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1","annotationId":"0004","glossId":"0004-1","glossHref":"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0004-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"莫赤匪狐，莫黑匪乌。惠而好我，携手同车。其虚其邪？既亟只且！","sourceLabel":"第 88 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"章解","excerpt":"莫，无。匪，非。莫匪即无非，应连用。乌，乌鸦。这二句意为，所见执政者，无非都是赤狐乌鸦之类，毫无例外。按狐是妖兽（见说文），乌啼不祥（唐韩愈有“鸦啼岂是凶”之句），这是古代民间的传说。诗人以赤狐、黑乌象征妖异不祥的统治者。孔疏：“狐色皆赤，乌色皆黑，以喻卫之君臣皆恶也。”同车，朱熹诗集传：“同车，则贵者亦去矣。”当时人民无权坐车，所以朱熹认为这句是指贵族。韵读：鱼部一一狐、乌、车、虚、邪、且。","fullText":"莫，无。匪，非。莫匪即无非，应连用。乌，乌鸦。这二句意为，所见执政者，无非都是赤狐乌鸦之类，毫无例外。按狐是妖兽（见说文），乌啼不祥（唐韩愈有“鸦啼岂是凶”之句），这是古代民间的传说。诗人以赤狐、黑乌象征妖异不祥的统治者。孔疏：“狐色皆赤，乌色皆黑，以喻卫之君臣皆恶也。”同车，朱熹诗集传：“同车，则贵者亦去矣。”当时人民无权坐车，所以朱熹认为这句是指贵族。韵读：鱼部一一狐、乌、车、虚、邪、且。","notes":null,"partOrder":1,"anchorIds":["seg-013:1-1:莫","seg-013:3-3:匪","seg-014:4-4:乌","seg-013:4-4:狐","seg-016:3-4:同车"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3","anchor-1-4","anchor-1-5"],"segmentIds":["seg-013","seg-014","seg-015","seg-016","seg-017","seg-018"]},{"id":"chenhuan-chuanshu:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/041-bei-feng/chenhuan-chuanshu/0001-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"preface","layerLabel":"篇序","targetText":"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉","sourceLabel":"第 74 页","attributionLabel":"诗序","sectionLabel":"序","excerpt":"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉","fullText":"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"chenhuan-chuanshu:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/041-bei-feng/chenhuan-chuanshu/0002-1","materialId":"chenhuan-chuanshu","materialTitle":"詩毛氏傳疏","contributorLine":"清 · 陳奐","publicationYear":1847,"layer":"span","layerLabel":"诗句片段","targetText":"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。","sourceLabel":"第 74-75 页","attributionLabel":"陈奂","sectionLabel":"疏","excerpt":"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。","fullText":"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","s -zhushu-kr1c0004/0001-1","materialId":"maoheng-zhushu-kr1c0004","materialTitle":"毛詩注疏","contributorLine":"漢唐 · 毛亨、鄭氏、孔穎達","publicationYear":653,"layer":"preface","layerLabel":"篇序","targetText":"北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉","sourceLabel":null,"attributionLabel":"诗序","sectionLabel":"序","excerpt":"序：《北風》，刺虐也。","fullText":"序：《北風》，刺虐也。衛國並為威虐，百姓不親，莫不相攜持而去焉。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"maoheng-zhushu-kr1c0004:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0001-1","materialId":"maoheng-zhushu-kr1c0004","materialTitle":"毛詩注疏","contributorLine":"漢唐 · 毛亨、鄭氏、孔穎達","publicationYear":653,"layer":"preface","layerLabel":"篇序","targetText":"北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉","sourceLabel":null,"attributionLabel":"诗序","sectionLabel":"序","excerpt":"衛國並為威虐，百姓不親，莫不相攜持而去焉。","fullText":"序：《北風》，刺虐也。衛國並為威虐，百姓不親，莫不相攜持而去焉。","notes":null,"partOrder":2,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"maoheng-zhushu-kr1c0004:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1","materialId":"maoheng-zhushu-kr1c0004","materialTitle":"毛詩注疏","contributorLine":"漢唐 · 毛亨、鄭氏、孔穎達","publicationYear":653,"layer":"span","layerLabel":"诗句片段","targetText":"北風其涼雨雪其雱惠而好我攜手同行其虛其邪既亟只且","sourceLabel":null,"attributionLabel":"毛传","sectionLabel":null,"excerpt":"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。","fullText":"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。","notes":null,"partOrder":1,"anchorIds":["seg-001:1-2:北風","seg-001:4-4:涼","seg-002:4-4:雱"],"glossAnchorIds":["anchor-1-1","anchor-1-2","anchor-1-3"],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006"]},{"id":"maoheng-zhushu-kr1c0004:0002-1:part-2","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c00 r1c0004\"]},{\"id\":\"seg-016:3-4:同车\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"同车\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-016:3-4:同車\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"同車\",\"charStart\":3,\"charEnd\":4,\"entryIds\":[\"zhuxi-shijichuan-kr1c0009:0003-1:part-3\"],\"materialIds\":[\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-016:4-4:車\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"車\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-2\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\"]},{\"id\":\"seg-017:4-4:邪\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"邪\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0002-1:part-5\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-018:3-3:只\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"只\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"quwanli-quanshi:0002-1:part-5\"],\"materialIds\":[\"quwanli-quanshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"题解\",\"sourceLabel\":\"第 87-88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是人民不堪卫国虐政招呼朋友共同逃亡的诗。毛序：“刺虐也。卫国并为威虐，百姓不亲，莫不相携持而去焉。”这段话还合诗意。方玉润诗经原始：“此篇不知其为卫作乎？抑为邶言乎？若以诗编邶风内，则当为邶言为是。”邶亡于卫在什么时候，史不可考。据方的说法，这首诗是反映邶亡前统治阶级的暴虐腐败、社会混乱和人民纷纷逃亡的情况，可备一说。朱熹言此诗“气象愁惨”。读这首诗，确实使人感到一种紧张恐惧的气氛，这种气氛，主要通过三方面来表现。一是景物的描写。诗前两章前两句是兴，通过对风紧雪盛的描述，来渲染悲惨气氛，写得凛凛有寒意。二是音节的变化。各章前四句辞尚宽缓，至末二句忽作促音，更加深了这种紧张感。三是形象的语言，“其虚其邪，既亟只且”，自问自答，通过人的紧张情绪，将这种迫不及待的气氛，淋漓尽致地表现出来。至末章以赤狐、黑乌不祥的动物象征暴虐的统治者，尤为形象。\",\"fullText\":\"这是人民不堪卫国虐政招呼朋友共同逃亡的诗。毛序：“刺虐也。卫国并为威虐，百姓不亲，莫不相携持而去焉。”这段话还合诗意。方玉润诗经原始：“此篇不知其为卫作乎？抑为邶言乎？若以诗编邶风内，则当为邶言为是。”邶亡于卫在什么时候，史不可考。据方的说法，这首诗是反映邶亡前统治阶级的暴虐腐败、社会混乱和人民纷纷逃亡的情况，可备一说。朱熹言此诗“气象愁惨”。读这首诗，确实使人感到一种紧张恐惧的气氛，这种气氛，主要通过三方面来表现。一是景物的描写。诗前两章前两句是兴，通过对风紧雪盛的描述，来渲染悲惨气氛，写得凛凛有寒意。二是音节的变化。各章前四句辞尚宽缓，至末二句忽作促音，更加深了这种紧张感。三是形象的语言，“其虚其邪，既亟只且”，自问自答，通过人的紧张情绪，将这种迫不及待的气氛，淋漓尽致地表现出来。至末章以赤狐、黑乌不祥的动物象征暴虐的统治者，尤为形象。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其凉，雨雪其雱。惠而好我，携手同行。其虚其邪？既亟只且！\",\"sourceLabel\":\"第 87-88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"雨雪，下雪。雨在这里作动词用。雱（páng），雪盛貌。毛传：“雱，盛貌。”按雱是滂的籀文。说文：“滂，沛也。”段注：“籀文从雨，众多如雨意也。毛云盛，与许云沛正合。”其雱，即雱雱。上句“其凉”，即凉凉。诗人以凉风喻虐政，以雨雪喻社会纷乱。惠而，即惠然，顺从、赞成之意。马瑞辰通释：“终风诗‘惠然肯来’，传：‘惠，顺也。’此诗惠而，犹惠然也。惠亦当为顺，惠然，谓顺貌也。”行（háng），道路。郑笺：“与我相携持同道而去，疾时政也。”其，语助词。虚，舒的假借字。邪，鲁、齐诗作徐，邪是徐的假借字。虚邪，叠韵，即舒徐，缓慢而犹豫不决貌。亟，同急。既亟，事已紧急。只且（jū），语尾助词，其作用与“也哉”相同。王先谦集疏：“诗人见其同行者从容安雅之状如此，又速之曰‘既亟只且’，犹言事已急矣，尚不速行而为此徐徐之态乎？”韵读：阳部一一凉、雱、行（音杭）。鱼部一一虚、邪（音徐）、且。\",\"fullText\":\"雨雪，下雪。雨在这里作动词用。雱（páng），雪盛貌。毛传：“雱，盛貌。”按雱是滂的籀文。说文：“滂，沛也。”段注：“籀文从雨，众多如雨意也。毛云盛，与许云沛正合。”其雱，即雱雱。上句“其凉”，即凉凉。诗人以凉风喻虐政，以雨雪喻社会纷乱。惠而，即惠然，顺从、赞成之意。马瑞辰通释：“终风诗‘惠然肯来’，传：‘惠，顺也。’此诗惠而，犹惠然也。惠亦当为顺，惠然，谓顺貌也。”行（háng），道路。郑笺：“与我相携持同道而去，疾时政也。”其，语助词。虚，舒的假借字。邪，鲁、齐诗作徐，邪是徐的假借字。虚邪，叠韵，即舒徐，缓慢而犹豫不决貌。亟，同急。既亟，事已紧急。只且（jū），语尾助词，其作用与“也哉”相同。王先谦集疏：“诗人见其同行者从容安雅之状如此，又速之曰‘既亟只且’，犹言事已急矣，尚不速行而为此徐徐之态乎？”韵读：阳部一一凉、雱、行（音杭）。鱼部一一虚、邪（音徐）、且。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:1-1:雨\",\"seg-002:4-4:雱\",\"seg-001:4-4:凉\",\"seg-003:1-1:惠\",\"seg-004:4-4:行\",\"seg-005:2-2:虚\",\"seg-005:4-4:邪\",\"seg-006:2-2:亟\",\"seg-006:3-4:只且\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\",\"anchor-1-8\",\"anchor-1-9\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其喈，雨雪其霏。惠而好我，携手同归。其虚其邪？既亟只且！\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"王事，有关周王朝的差事。朱熹诗集传：“王事，王命使为之事也。”适，投掷。按适（通）是“掷”字的省借。说文：“掷，搔也。一曰投也。”适我，犹云都扔给我。政事，卫国国内的政事。郑笺训政事为赋税之事。一，皆、完全。埠（pí），使。按埠是俾的假借字。说文：“俾，益也。”段注：“俾与埠、裨、僻，音义皆同。今俾行而埠、裨皆废矣。经传之俾皆训使也，无异解，盖即益义之引申。”这句意为国内的政事都使加在我身上。室人，家人。交，更迭，轮流。滴（zhé），责备。毛传：“滴，责也。”韵读：支部一一适、益、滴（音摘入声）。歌部一一为、何。\",\"fullText\":\"王事，有关周王朝的差事。朱熹诗集传：“王事，王命使为之事也。”适，投掷。按适（通）是“掷”字的省借。说文：“掷，搔也。一曰投也。”适我，犹云都扔给我。政事，卫国国内的政事。郑笺训政事为赋税之事。一，皆、完全。埠（pí），使。按埠是俾的假借字。说文：“俾，益也。”段注：“俾与埠、裨、僻，音义皆同。今俾行而埠、裨皆废矣。经传之俾皆训使也，无异解，盖即益义之引申。”这句意为国内的政事都使加在我身上。室人，家人。交，更迭，轮流。滴（zhé），责备。毛传：“滴，责也。”韵读：支部一一适、益、滴（音摘入声）。歌部一一为、何。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐，莫黑匪乌。惠而好我，携手同车。其虚其邪？既亟只且！\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"莫，无。匪，非。莫匪即无非，应连用。乌，乌鸦。这二句意为，所见执政者，无非都是赤狐乌鸦之类，毫无例外。按狐是妖兽（见说文），乌啼不祥（唐韩愈有“鸦啼岂是凶”之句），这是古代民间的传说。诗人以赤狐、黑乌象征妖异不祥的统治者。孔疏：“狐色皆赤，乌色皆黑，以喻卫之君臣皆恶也。”同车，朱熹诗集传：“同车，则贵者亦去矣。”当时人民无权坐车，所以朱熹认为这句是指贵族。韵读：鱼部一一狐、乌、车、虚、邪、且。\",\"fullText\":\"莫，无。匪，非。莫匪即无非，应连用。乌，乌鸦。这二句意为，所见执政者，无非都是赤狐乌鸦之类，毫无例外。按狐是妖兽（见说文），乌啼不祥（唐韩愈有“鸦啼岂是凶”之句），这是古代民间的传说。诗人以赤狐、黑乌象征妖异不祥的统治者。孔疏：“狐色皆赤，乌色皆黑，以喻卫之君臣皆恶也。”同车，朱熹诗集传：“同车，则贵者亦去矣。”当时人民无权坐车，所以朱熹认为这句是指贵族。韵读：鱼部一一狐、乌、车、虚、邪、且。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-013:1-1:莫\",\"seg-013:3-3:匪\",\"seg-014:4-4:乌\",\"seg-013:4-4:狐\",\"seg-016:3-4:同车\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉\",\"sourceLabel\":\"第 74 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉\",\"fullText\":\"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。\",\"sourceLabel\":\"第 74-75 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。\",\"fullText\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"北風㊟賢者見幾而作也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"賢者見幾而作也。\",\"fullText\":\"賢者見幾而作也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《北風》三章，章六句。姚氏際恒云：「此篇自是賢者見幾之作，不必説及百姓。」是。蓋見幾唯賢者乃早，百姓豈能及也。愚觀詩詞，始則氣象愁慘，繼則怪異頻興，率皆不祥兆，所謂國家將亡，必有妖孽時也。赤狐、黑烏，當時或有其怪，或聞是謡，皆不可知。總之敗亡兆耳。故賢者相率而去其國也。但不知其爲衛作乎？抑爲邶言乎？若以詩編《邶風》内，則當爲邶言爲是，與首篇《柏舟》憂讒憫亂之作相應。蓋彼知其將亂而不忍去，此則見其將亡而必速去。一明哲以保身，一忠貞而受禍。雖曰時位不同，亦各行其志焉已矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《北風》三章，章六句。姚氏際恒云：「此篇自是賢者見幾之作，不必説及百姓。」是。蓋見幾唯賢者乃早，百姓豈能及也。愚觀詩詞，始則氣象愁慘，繼則怪異頻興，率皆不祥兆，所謂國家將亡，必有妖孽時也。赤狐、黑烏，當時或有其怪，或聞是謡，皆不可知。總之敗亡兆耳。故賢者相率而去其國也。但不知其爲衛作乎？抑爲邶言乎？若以詩編《邶風》内，則當爲邶言爲是，與首篇《柏舟》憂讒憫亂之作相應。蓋彼知其將亂而不忍去，此則見其將亡而必速去。一明哲以保身，一忠貞而受禍。雖曰時位不同，亦各行其志焉已矣。\",\"fullText\":\"右《北風》三章，章六句。姚氏際恒云：「此篇自是賢者見幾之作，不必説及百姓。」是。蓋見幾唯賢者乃早，百姓豈能及也。愚觀詩詞，始則氣象愁慘，繼則怪異頻興，率皆不祥兆，所謂國家將亡，必有妖孽時也。赤狐、黑烏，當時或有其怪，或聞是謡，皆不可知。總之敗亡兆耳。故賢者相率而去其國也。但不知其爲衛作乎？抑爲邶言乎？若以詩編《邶風》内，則當爲邶言爲是，與首篇《柏舟》憂讒憫亂之作相應。蓋彼知其將亂而不忍去，此則見其將亡而必速去。一明哲以保身，一忠貞而受禍。雖曰時位不同，亦各行其志焉已矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評〔一章〕氣象愁慘。〔二章〕妖孽頻興，造語奇闢，似古童謡。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"〔一章〕氣象愁慘。〔二章〕妖孽頻興，造語奇闢，似古童謡。\",\"fullText\":\"〔一章〕氣象愁慘。〔二章〕妖孽頻興，造語奇闢，似古童謡。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋雱雪盛貌。惠愛也。虚寬貌。邪〔陸氏德明曰〕《爾雅》作徐。亟急也。只且〔歐陽氏脩曰〕「其虚其邪，既亟只且」者，言無暇寬徐，當亟去也。喈疾聲也。狐獸名。〔陸氏佃曰〕舊説以狐有媚珠，善變化，其爲物妖淫，故詩以刺惡。烏〔陸氏佃曰〕烏，一名鴉，其名自呼，體全黑。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"雱雪盛貌。惠愛也。虚寬貌。邪〔陸氏德明曰〕《爾雅》作徐。亟急也。只且〔歐陽氏脩曰〕「其虚其邪，既亟只且」者，言無暇寬徐，當亟去也。喈疾聲也。狐獸名。〔陸氏佃曰〕舊説以狐有媚珠，善變化，其爲物妖淫，故詩以刺惡。烏〔陸氏佃曰〕烏，一名鴉，其名自呼，體全黑。\",\"fullText\":\"雱雪盛貌。惠愛也。虚寬貌。邪〔陸氏德明曰〕《爾雅》作徐。亟急也。只且〔歐陽氏脩曰〕「其虚其邪，既亟只且」者，言無暇寬徐，當亟去也。喈疾聲也。狐獸名。〔陸氏佃曰〕舊説以狐有媚珠，善變化，其爲物妖淫，故詩以刺惡。烏〔陸氏佃曰〕烏，一名鴉，其名自呼，體全黑。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻涼七陽。雱、行並同。本韻。邪音徐，六魚。且同。本韻。喈九佳。霏五微。歸同。通韻。狐七虞。烏同。車六魚。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"涼七陽。雱、行並同。本韻。邪音徐，六魚。且同。本韻。喈九佳。霏五微。歸同。通韻。狐七虞。烏同。車六魚。通韻。\",\"fullText\":\"涼七陽。雱、行並同。本韻。邪音徐，六魚。且同。本韻。喈九佳。霏五微。歸同。通韻。狐七虞。烏同。車六魚。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《北風》，刺虐也。\",\"fullText\":\"序：《北風》，刺虐也。衛國並為威虐，百姓不親，莫不相攜持而去焉。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛國並為威虐，百姓不親，莫不相攜持而去焉。\",\"fullText\":\"序：《北風》，刺虐也。衛國並為威虐，百姓不親，莫不相攜持而去焉。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其涼雨雪其雱惠而好我攜手同行其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。\",\"fullText\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:北風\",\"seg-001:4-4:涼\",\"seg-002:4-4:雱\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其涼雨雪其雱惠而好我攜手同行其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。\",\"fullText\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-1:惠\",\"seg-003:3-4:好我\",\"seg-004:4-4:行\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contr anchorIds\":[\"seg-010:4-4:歸\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐莫黑匪烏惠而好我攜手同車其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"狐赤烏黑，莫能別也。箋云：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。\",\"fullText\":\"狐赤烏黑，莫能別也。箋云：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。攜手就車。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-013:2-2:赤\",\"seg-013:4-4:狐\",\"seg-014:2-2:黑\",\"seg-014:4-4:烏\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐莫黑匪烏惠而好我攜手同車其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"攜手就車。\",\"fullText\":\"狐赤烏黑，莫能別也。箋云：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。攜手就車。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-016:1-2:攜手\",\"seg-016:4-4:車\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"此蓋詩人傷國政不綱，而偕其友好避亂之作。\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"此蓋詩人傷國政不綱，而偕其友好避亂之作。\",\"fullText\":\"此蓋詩人傷國政不綱，而偕其友好避亂之作。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"雨雪其雱惠而好我其虛其邪既亟只且北風其喈雨雪其霏莫赤匪狐莫黑匪烏其虛其邪既亟只且\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；\",\"fullText\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹言慢了吧、慢了吧，是欲速之辞；“亟”为急，“只且”为语词，犹“耳矣”。次章又释“喈”为“諧”之假借，谓水寒，“霏”为雨雪盛貌。至“莫赤匪狐，莫黑匪烏”，他说狐色黄赤、乌色黑，由“天下老鸦一般黑”转出对执政者的讽刺，并记“邪”汉石经作“耶”、“只”汉石经作“旨”的异文。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:4-4:雱\",\"seg-003:1-1:惠\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-002\",\"seg-003\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-013\",\"seg-014\",\"seg-017\",\"seg-018\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"雨雪其雱惠而好我其虛其邪既亟只且北風其喈雨雪其霏莫赤匪狐莫黑匪烏其虛其邪既亟只且\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹言慢了吧、慢了吧，是欲速之辞；“亟”为急，“只且”为语词，犹“耳矣”。\",\"fullText\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹 ），既亟只且（tzia）！（鱼部）\",\"fullText\":\"北风其凉（liang），雨雪其雱（phang）。惠而好我，携手同行（heang）。（阳部）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"notes\":\"据页图转写，保留句末拟音与韵部。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"wangli-yundu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/wangli-yundu/0002-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其喈，雨雪其霏。惠而好我，携手同归。其虚其邪，既亟只且！\",\"sourceLabel\":\"第 160 页局部\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"北风其喈（kei），雨雪其霏（phiuəi）。惠而好我，携手同归（kiuəi）。（脂微合韵）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"fullText\":\"北风其喈（kei），雨雪其霏（phiuəi）。惠而好我，携手同归（kiuəi）。（脂微合韵）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"notes\":\"据页图转写，保留句末拟音与韵部。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"wangli-yundu:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/wangli-yundu/0003-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐，莫黑匪乌。惠而好我，携手同车。其虚其邪，既亟只且！\",\"sourceLabel\":\"第 161 页局部\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"莫赤匪狐（hua），莫黑匪乌（a）。惠而好我，携手同车（kia）。其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"fullText\":\"莫赤匪狐（hua），莫黑匪乌（a）。惠而好我，携手同车（kia）。其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"notes\":\"据页图转写，保留句末拟音与韵部。页图前三句仅见注音未另标部名。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss aterialIds\":[\"zhuxi-shijichuan-kr1c0009\"]},{\"id\":\"seg-016:4-4:車\",\"segmentId\":\"seg-016\",\"segmentOrder\":16,\"surfaceText\":\"車\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"maoheng-zhushu-kr1c0004:0004-1:part-2\"],\"materialIds\":[\"maoheng-zhushu-kr1c0004\"]},{\"id\":\"seg-017:4-4:邪\",\"segmentId\":\"seg-017\",\"segmentOrder\":17,\"surfaceText\":\"邪\",\"charStart\":4,\"charEnd\":4,\"entryIds\":[\"quwanli-quanshi:0002-1:part-5\"],\"materialIds\":[\"quwanli-quanshi\"]},{\"id\":\"seg-018:3-3:只\",\"segmentId\":\"seg-018\",\"segmentOrder\":18,\"surfaceText\":\"只\",\"charStart\":3,\"charEnd\":3,\"entryIds\":[\"quwanli-quanshi:0002-1:part-5\"],\"materialIds\":[\"quwanli-quanshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"题解\",\"sourceLabel\":\"第 87-88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是人民不堪卫国虐政招呼朋友共同逃亡的诗。毛序：“刺虐也。卫国并为威虐，百姓不亲，莫不相携持而去焉。”这段话还合诗意。方玉润诗经原始：“此篇不知其为卫作乎？抑为邶言乎？若以诗编邶风内，则当为邶言为是。”邶亡于卫在什么时候，史不可考。据方的说法，这首诗是反映邶亡前统治阶级的暴虐腐败、社会混乱和人民纷纷逃亡的情况，可备一说。朱熹言此诗“气象愁惨”。读这首诗，确实使人感到一种紧张恐惧的气氛，这种气氛，主要通过三方面来表现。一是景物的描写。诗前两章前两句是兴，通过对风紧雪盛的描述，来渲染悲惨气氛，写得凛凛有寒意。二是音节的变化。各章前四句辞尚宽缓，至末二句忽作促音，更加深了这种紧张感。三是形象的语言，“其虚其邪，既亟只且”，自问自答，通过人的紧张情绪，将这种迫不及待的气氛，淋漓尽致地表现出来。至末章以赤狐、黑乌不祥的动物象征暴虐的统治者，尤为形象。\",\"fullText\":\"这是人民不堪卫国虐政招呼朋友共同逃亡的诗。毛序：“刺虐也。卫国并为威虐，百姓不亲，莫不相携持而去焉。”这段话还合诗意。方玉润诗经原始：“此篇不知其为卫作乎？抑为邶言乎？若以诗编邶风内，则当为邶言为是。”邶亡于卫在什么时候，史不可考。据方的说法，这首诗是反映邶亡前统治阶级的暴虐腐败、社会混乱和人民纷纷逃亡的情况，可备一说。朱熹言此诗“气象愁惨”。读这首诗，确实使人感到一种紧张恐惧的气氛，这种气氛，主要通过三方面来表现。一是景物的描写。诗前两章前两句是兴，通过对风紧雪盛的描述，来渲染悲惨气氛，写得凛凛有寒意。二是音节的变化。各章前四句辞尚宽缓，至末二句忽作促音，更加深了这种紧张感。三是形象的语言，“其虚其邪，既亟只且”，自问自答，通过人的紧张情绪，将这种迫不及待的气氛，淋漓尽致地表现出来。至末章以赤狐、黑乌不祥的动物象征暴虐的统治者，尤为形象。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其凉，雨雪其雱。惠而好我，携手同行。其虚其邪？既亟只且！\",\"sourceLabel\":\"第 87-88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"雨雪，下雪。雨在这里作动词用。雱（páng），雪盛貌。毛传：“雱，盛貌。”按雱是滂的籀文。说文：“滂，沛也。”段注：“籀文从雨，众多如雨意也。毛云盛，与许云沛正合。”其雱，即雱雱。上句“其凉”，即凉凉。诗人以凉风喻虐政，以雨雪喻社会纷乱。惠而，即惠然，顺从、赞成之意。马瑞辰通释：“终风诗‘惠然肯来’，传：‘惠，顺也。’此诗惠而，犹惠然也。惠亦当为顺，惠然，谓顺貌也。”行（háng），道路。郑笺：“与我相携持同道而去，疾时政也。”其，语助词。虚，舒的假借字。邪，鲁、齐诗作徐，邪是徐的假借字。虚邪，叠韵，即舒徐，缓慢而犹豫不决貌。亟，同急。既亟，事已紧急。只且（jū），语尾助词，其作用与“也哉”相同。王先谦集疏：“诗人见其同行者从容安雅之状如此，又速之曰‘既亟只且’，犹言事已急矣，尚不速行而为此徐徐之态乎？”韵读：阳部一一凉、雱、行（音杭）。鱼部一一虚、邪（音徐）、且。\",\"fullText\":\"雨雪，下雪。雨在这里作动词用。雱（páng），雪盛貌。毛传：“雱，盛貌。”按雱是滂的籀文。说文：“滂，沛也。”段注：“籀文从雨，众多如雨意也。毛云盛，与许云沛正合。”其雱，即雱雱。上句“其凉”，即凉凉。诗人以凉风喻虐政，以雨雪喻社会纷乱。惠而，即惠然，顺从、赞成之意。马瑞辰通释：“终风诗‘惠然肯来’，传：‘惠，顺也。’此诗惠而，犹惠然也。惠亦当为顺，惠然，谓顺貌也。”行（háng），道路。郑笺：“与我相携持同道而去，疾时政也。”其，语助词。虚，舒的假借字。邪，鲁、齐诗作徐，邪是徐的假借字。虚邪，叠韵，即舒徐，缓慢而犹豫不决貌。亟，同急。既亟，事已紧急。只且（jū），语尾助词，其作用与“也哉”相同。王先谦集疏：“诗人见其同行者从容安雅之状如此，又速之曰‘既亟只且’，犹言事已急矣，尚不速行而为此徐徐之态乎？”韵读：阳部一一凉、雱、行（音杭）。鱼部一一虚、邪（音徐）、且。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:1-1:雨\",\"seg-002:4-4:雱\",\"seg-001:4-4:凉\",\"seg-003:1-1:惠\",\"seg-004:4-4:行\",\"seg-005:2-2:虚\",\"seg-005:4-4:邪\",\"seg-006:2-2:亟\",\"seg-006:3-4:只且\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\",\"anchor-1-8\",\"anchor-1-9\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其喈，雨雪其霏。惠而好我，携手同归。其虚其邪？既亟只且！\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"王事，有关周王朝的差事。朱熹诗集传：“王事，王命使为之事也。”适，投掷。按适（通）是“掷”字的省借。说文：“掷，搔也。一曰投也。”适我，犹云都扔给我。政事，卫国国内的政事。郑笺训政事为赋税之事。一，皆、完全。埠（pí），使。按埠是俾的假借字。说文：“俾，益也。”段注：“俾与埠、裨、僻，音义皆同。今俾行而埠、裨皆废矣。经传之俾皆训使也，无异解，盖即益义之引申。”这句意为国内的政事都使加在我身上。室人，家人。交，更迭，轮流。滴（zhé），责备。毛传：“滴，责也。”韵读：支部一一适、益、滴（音摘入声）。歌部一一为、何。\",\"fullText\":\"王事，有关周王朝的差事。朱熹诗集传：“王事，王命使为之事也。”适，投掷。按适（通）是“掷”字的省借。说文：“掷，搔也。一曰投也。”适我，犹云都扔给我。政事，卫国国内的政事。郑笺训政事为赋税之事。一，皆、完全。埠（pí），使。按埠是俾的假借字。说文：“俾，益也。”段注：“俾与埠、裨、僻，音义皆同。今俾行而埠、裨皆废矣。经传之俾皆训使也，无异解，盖即益义之引申。”这句意为国内的政事都使加在我身上。室人，家人。交，更迭，轮流。滴（zhé），责备。毛传：“滴，责也。”韵读：支部一一适、益、滴（音摘入声）。歌部一一为、何。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐，莫黑匪乌。惠而好我，携手同车。其虚其邪？既亟只且！\",\"sourceLabel\":\"第 88 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"莫，无。匪，非。莫匪即无非，应连用。乌，乌鸦。这二句意为，所见执政者，无非都是赤狐乌鸦之类，毫无例外。按狐是妖兽（见说文），乌啼不祥（唐韩愈有“鸦啼岂是凶”之句），这是古代民间的传说。诗人以赤狐、黑乌象征妖异不祥的统治者。孔疏：“狐色皆赤，乌色皆黑，以喻卫之君臣皆恶也。”同车，朱熹诗集传：“同车，则贵者亦去矣。”当时人民无权坐车，所以朱熹认为这句是指贵族。韵读：鱼部一一狐、乌、车、虚、邪、且。\",\"fullText\":\"莫，无。匪，非。莫匪即无非，应连用。乌，乌鸦。这二句意为，所见执政者，无非都是赤狐乌鸦之类，毫无例外。按狐是妖兽（见说文），乌啼不祥（唐韩愈有“鸦啼岂是凶”之句），这是古代民间的传说。诗人以赤狐、黑乌象征妖异不祥的统治者。孔疏：“狐色皆赤，乌色皆黑，以喻卫之君臣皆恶也。”同车，朱熹诗集传：“同车，则贵者亦去矣。”当时人民无权坐车，所以朱熹认为这句是指贵族。韵读：鱼部一一狐、乌、车、虚、邪、且。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-013:1-1:莫\",\"seg-013:3-3:匪\",\"seg-014:4-4:乌\",\"seg-013:4-4:狐\",\"seg-016:3-4:同车\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉\",\"sourceLabel\":\"第 74 页\",\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉\",\"fullText\":\"北風刺虐也衛國並爲威虐百姓不親莫不相攜持而去焉\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chenhuan-chuanshu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/chenhuan-chuanshu/0002-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。\",\"sourceLabel\":\"第 74-75 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。\",\"fullText\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，既亟只且。北風其喈，雨雪其霏。惠而好我，攜手同歸。其虛其邪，既亟只且。莫赤匪狐，莫黑匪烏。惠而好我，攜手同車。其虛其邪，既亟只且。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"北風㊟賢者見幾而作也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"賢者見幾而作也。\",\"fullText\":\"賢者見幾而作也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《北風》三章，章六句。姚氏際恒云：「此篇自是賢者見幾之作，不必説及百姓。」是。蓋見幾唯賢者乃早，百姓豈能及也。愚觀詩詞，始則氣象愁慘，繼則怪異頻興，率皆不祥兆，所謂國家將亡，必有妖孽時也。赤狐、黑烏，當時或有其怪，或聞是謡，皆不可知。總之敗亡兆耳。故賢者相率而去其國也。但不知其爲衛作乎？抑爲邶言乎？若以詩編《邶風》内，則當爲邶言爲是，與首篇《柏舟》憂讒憫亂之作相應。蓋彼知其將亂而不忍去，此則見其將亡而必速去。一明哲以保身，一忠貞而受禍。雖曰時位不同，亦各行其志焉已矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《北風》三章，章六句。姚氏際恒云：「此篇自是賢者見幾之作，不必説及百姓。」是。蓋見幾唯賢者乃早，百姓豈能及也。愚觀詩詞，始則氣象愁慘，繼則怪異頻興，率皆不祥兆，所謂國家將亡，必有妖孽時也。赤狐、黑烏，當時或有其怪，或聞是謡，皆不可知。總之敗亡兆耳。故賢者相率而去其國也。但不知其爲衛作乎？抑爲邶言乎？若以詩編《邶風》内，則當爲邶言爲是，與首篇《柏舟》憂讒憫亂之作相應。蓋彼知其將亂而不忍去，此則見其將亡而必速去。一明哲以保身，一忠貞而受禍。雖曰時位不同，亦各行其志焉已矣。\",\"fullText\":\"右《北風》三章，章六句。姚氏際恒云：「此篇自是賢者見幾之作，不必説及百姓。」是。蓋見幾唯賢者乃早，百姓豈能及也。愚觀詩詞，始則氣象愁慘，繼則怪異頻興，率皆不祥兆，所謂國家將亡，必有妖孽時也。赤狐、黑烏，當時或有其怪，或聞是謡，皆不可知。總之敗亡兆耳。故賢者相率而去其國也。但不知其爲衛作乎？抑爲邶言乎？若以詩編《邶風》内，則當爲邶言爲是，與首篇《柏舟》憂讒憫亂之作相應。蓋彼知其將亂而不忍去，此則見其將亡而必速去。一明哲以保身，一忠貞而受禍。雖曰時位不同，亦各行其志焉已矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"眉評〔一章〕氣象愁慘。〔二章〕妖孽頻興，造語奇闢，似古童謡。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉评\",\"excerpt\":\"〔一章〕氣象愁慘。〔二章〕妖孽頻興，造語奇闢，似古童謡。\",\"fullText\":\"〔一章〕氣象愁慘。〔二章〕妖孽頻興，造語奇闢，似古童謡。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋雱雪盛貌。惠愛也。虚寬貌。邪〔陸氏德明曰〕《爾雅》作徐。亟急也。只且〔歐陽氏脩曰〕「其虚其邪，既亟只且」者，言無暇寬徐，當亟去也。喈疾聲也。狐獸名。〔陸氏佃曰〕舊説以狐有媚珠，善變化，其爲物妖淫，故詩以刺惡。烏〔陸氏佃曰〕烏，一名鴉，其名自呼，體全黑。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"雱雪盛貌。惠愛也。虚寬貌。邪〔陸氏德明曰〕《爾雅》作徐。亟急也。只且〔歐陽氏脩曰〕「其虚其邪，既亟只且」者，言無暇寬徐，當亟去也。喈疾聲也。狐獸名。〔陸氏佃曰〕舊説以狐有媚珠，善變化，其爲物妖淫，故詩以刺惡。烏〔陸氏佃曰〕烏，一名鴉，其名自呼，體全黑。\",\"fullText\":\"雱雪盛貌。惠愛也。虚寬貌。邪〔陸氏德明曰〕《爾雅》作徐。亟急也。只且〔歐陽氏脩曰〕「其虚其邪，既亟只且」者，言無暇寬徐，當亟去也。喈疾聲也。狐獸名。〔陸氏佃曰〕舊説以狐有媚珠，善變化，其爲物妖淫，故詩以刺惡。烏〔陸氏佃曰〕烏，一名鴉，其名自呼，體全黑。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻涼七陽。雱、行並同。本韻。邪音徐，六魚。且同。本韻。喈九佳。霏五微。歸同。通韻。狐七虞。烏同。車六魚。通韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"标韵\",\"excerpt\":\"涼七陽。雱、行並同。本韻。邪音徐，六魚。且同。本韻。喈九佳。霏五微。歸同。通韻。狐七虞。烏同。車六魚。通韻。\",\"fullText\":\"涼七陽。雱、行並同。本韻。邪音徐，六魚。且同。本韻。喈九佳。霏五微。歸同。通韻。狐七虞。烏同。車六魚。通韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《北風》，刺虐也。\",\"fullText\":\"序：《北風》，刺虐也。衛國並為威虐，百姓不親，莫不相攜持而去焉。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"北風刺虐也衛國並為威虐百姓不親莫不相攜持而去焉\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"衛國並為威虐，百姓不親，莫不相攜持而去焉。\",\"fullText\":\"序：《北風》，刺虐也。衛國並為威虐，百姓不親，莫不相攜持而去焉。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其涼雨雪其雱惠而好我攜手同行其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。\",\"fullText\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:北風\",\"seg-001:4-4:涼\",\"seg-002:4-4:雱\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其涼雨雪其雱惠而好我攜手同行其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。\",\"fullText\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-1:惠\",\"seg-003:3-4:好我\",\"seg-004:4-4:行\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其涼雨雪其雱惠而好我攜手同行其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。\",\"fullText\":\"興也。北風，寒涼之風。雱，盛貌。箋云：寒涼之風，病害萬物。興者，喻君政教酷暴，使民散亂。惠，愛。行，道也。箋云：性仁愛而又好我者，與我相攜持同道而去。疾時政也。虛，虛也。亟，急也。箋云：邪讀如徐。言今在位之人，其故威儀虛徐寬仁者，今皆以為急刻之行矣，所以當去，以此也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-005:2-2:虛\",\"seg-005:4-4:邪\",\"seg-006:2-2:亟\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其喈雨雪其霏惠而好我攜手同歸其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"喈，疾貌。霏，甚貌。\",\"fullText\":\"喈，疾貌。霏，甚貌。歸有德也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-007:4-4:喈\",\"seg-008:4-4:霏\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其喈雨雪其霏惠而好我攜手同歸其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"歸有德也。\",\"fullText\":\"喈，疾貌。霏，甚貌。歸有德也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-010:4-4:歸\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐莫黑匪烏惠而好我攜手同車其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"狐赤烏黑，莫能別也。箋云：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。\",\"fullText\":\"狐赤烏黑，莫能別也。箋云：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。攜手就車。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-013:2-2:赤\",\"seg-013:4-4:狐\",\"seg-014:2-2:黑\",\"seg-014:4-4:烏\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐莫黑匪烏惠而好我攜手同車其虛其邪既亟只且\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"攜手就車。\",\"fullText\":\"狐赤烏黑，莫能別也。箋云：赤則狐也，黑則烏也，猶今君臣相承，為惡如一。攜手就車。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-016:1-2:攜手\",\"seg-016:4-4:車\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\"],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"此蓋詩人傷國政不綱，而偕其友好避亂之作。\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"此蓋詩人傷國政不綱，而偕其友好避亂之作。\",\"fullText\":\"此蓋詩人傷國政不綱，而偕其友好避亂之作。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"雨雪其雱惠而好我其虛其邪既亟只且北風其喈雨雪其霏莫赤匪狐莫黑匪烏其虛其邪既亟只且\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；\",\"fullText\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹言慢了吧、慢了吧，是欲速之辞；“亟”为急，“只且”为语词，犹“耳矣”。次章又释“喈”为“諧”之假借，谓水寒，“霏”为雨雪盛貌。至“莫赤匪狐，莫黑匪烏”，他说狐色黄赤、乌色黑，由“天下老鸦一般黑”转出对执政者的讽刺，并记“邪”汉石经作“耶”、“只”汉石经作“旨”的异文。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-002:4-4:雱\",\"seg-003:1-1:惠\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-002\",\"seg-003\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-013\",\"seg-014\",\"seg-017\",\"seg-018\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"雨雪其雱惠而好我其虛其邪既亟只且北風其喈雨雪其霏莫赤匪狐莫黑匪烏其虛其邪既亟只且\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹言慢了吧、慢了吧，是欲速之辞；“亟”为急，“只且”为语词，犹“耳矣”。\",\"fullText\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹言慢了吧、慢了吧，是欲速之辞；“亟”为急，“只且”为语词，犹“耳矣”。次章又释“喈”为“諧”之假借，谓水寒，“霏”为雨雪盛貌。至“莫赤匪狐，莫黑匪烏”，他说狐色黄赤、乌色黑，由“天下老鸦一般黑”转出对执政者的讽刺，并记“邪”汉石经作“耶”、“只”汉石经作“旨”的异文。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-005:2-2:虛\",\"seg-005:4-4:邪\",\"seg-005:1-4:其虛其邪\",\"seg-006:2-2:亟\",\"seg-006:3-4:只且\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\"],\"segmentIds\":[\"seg-002\",\"seg-003\",\"seg-005\",\"seg-006\",\"seg-007\ 008\",\"seg-013\",\"seg-014\",\"seg-017\",\"seg-018\"]},{\"id\":\"quwanli-quanshi:0002-1:part-5\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"雨雪其雱惠而好我其虛其邪既亟只且北風其喈雨雪其霏莫赤匪狐莫黑匪烏其虛其邪既亟只且\",\"sourceLabel\":\"第 50 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"并记“邪”汉石经作“耶”、“只”汉石经作“旨”的异文。\",\"fullText\":\"屈万里释“雱”为雨雪盛貌，“惠”为爱；又据马瑞辰说，以“虛”“邪”为“舒”“徐”的同音假借，谓“其虛其邪”犹言慢了吧、慢了吧，是欲速之辞；“亟”为急，“只且”为语词，犹“耳矣”。次章又释“喈”为“諧”之假借，谓水寒，“霏”为雨雪盛貌。至“莫赤匪狐，莫黑匪烏”，他说狐色黄赤、乌色黑，由“天下老鸦一般黑”转出对执政者的讽刺，并记“邪”汉石经作“耶”、“只”汉石经作“旨”的异文。\",\"notes\":null,\"partOrder\":5,\"anchorIds\":[\"seg-017:4-4:邪\",\"seg-018:3-3:只\"],\"glossAnchorIds\":[\"anchor-5-1\",\"anchor-5-2\"],\"segmentIds\":[\"seg-002\",\"seg-003\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-013\",\"seg-014\",\"seg-017\",\"seg-018\"]},{\"id\":\"wangli-yundu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/wangli-yundu/0001-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其凉，雨雪其雱。惠而好我，携手同行。其虚其邪，既亟只且！\",\"sourceLabel\":\"第 160 页局部\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"北风其凉（liang），雨雪其雱（phang）。惠而好我，携手同行（heang）。（阳部）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"fullText\":\"北风其凉（liang），雨雪其雱（phang）。惠而好我，携手同行（heang）。（阳部）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"notes\":\"据页图转写，保留句末拟音与韵部。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\"]},{\"id\":\"wangli-yundu:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/wangli-yundu/0002-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北风其喈，雨雪其霏。惠而好我，携手同归。其虚其邪，既亟只且！\",\"sourceLabel\":\"第 160 页局部\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"北风其喈（kei），雨雪其霏（phiuəi）。惠而好我，携手同归（kiuəi）。（脂微合韵）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"fullText\":\"北风其喈（kei），雨雪其霏（phiuəi）。惠而好我，携手同归（kiuəi）。（脂微合韵）其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"notes\":\"据页图转写，保留句末拟音与韵部。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"wangli-yundu:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/wangli-yundu/0003-1\",\"materialId\":\"wangli-yundu\",\"materialTitle\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"莫赤匪狐，莫黑匪乌。惠而好我，携手同车。其虚其邪，既亟只且！\",\"sourceLabel\":\"第 161 页局部\",\"attributionLabel\":\"王力\",\"sectionLabel\":\"韵读\",\"excerpt\":\"莫赤匪狐（hua），莫黑匪乌（a）。惠而好我，携手同车（kia）。其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"fullText\":\"莫赤匪狐（hua），莫黑匪乌（a）。惠而好我，携手同车（kia）。其虚其邪（zya），既亟只且（tzia）！（鱼部）\",\"notes\":\"据页图转写，保留句末拟音与韵部。页图前三句仅见注音未另标部名。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\"]},{\"id\":\"zhuxi-shijichuan-kr1c0009:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/041-bei-feng/zhuxi-shijichuan-kr1c0009/0001-1\",\"materialId\":\"zhuxi-shijichuan-kr1c0009\",\"materialTitle\":\"詩集傳\",\"contributorLine\":\"宋 · 朱熹\",\"publicationYear\":1186,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"北風其凉，雨雪其雱。惠而好我，攜手同行。其虛其邪，旣亟只且。\",\"sourceLabel\":null,\"attributionLabel\":\"朱熹\",\"sectionLabel\":null,\"excerpt\":\"比也。\",\"fullText\":\"比也。朱熹释“北風”为寒凉之风，“凉”为寒气，“雱”为雪盛之貌；又以“惠”为爱、“行”为去、“虛”为宽、“邪”读为“徐”、“亟”为急，“只且”为语
