"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-020:1-4:子曰何其","segmentId":"seg-020","segmentOrder":20,"surfaceText":"子曰何其","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-021:1-4:心之忧矣","segmentId":"seg-021","segmentOrder":21,"surfaceText":"心之忧矣","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-022:1-4:其谁知之","segmentId":"seg-022","segmentOrder":22,"surfaceText":"其谁知之","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-023:1-4:其谁知之","segmentId":"seg-023","segmentOrder":23,"surfaceText":"其谁知之","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]},{"id":"seg-024:1-4:盖亦勿思","segmentId":"seg-024","segmentOrder":24,"surfaceText":"盖亦勿思","charStart":1,"charEnd":4,"entryIds":["chengjunying-jiangjianyuan-zhuxi:0001-1:part-5"],"materialIds":["chengjunying-jiangjianyuan-zhuxi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！","sourceLabel":"第 227-228 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”","fullText":"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016","seg-017","seg-018","seg-019","seg-020","seg-021","seg-022","seg-023","seg-024"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！","sourceLabel":"第 227-228 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！","fullText":"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不 園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。","fullText":"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/109-yuan-you-tao/fangyu xt\":\"其谁知之\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:盖亦勿思\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"盖亦勿思\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-3:园有桃\",\"seg-002:1-4:其实之殽\",\"seg-003:1-4:心之忧矣\",\"seg-004:1-4:我歌且谣\",\"seg-005:1-4:不知我者\",\"seg-006:1-5:谓我士也骄\",\"seg-007:1-4:彼人是哉\",\"seg-008:1-4:子曰何其\",\"seg-009:1-4:心之忧矣\",\"seg-010:1-4:其谁知之\",\"seg-011:1-4:其谁知之\",\"seg-012:1-4:盖亦勿思\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\",\"anchor-2-7\",\"anchor-2-8\",\"anchor-2-9\",\"anchor-2-10\",\"anchor-2-11\",\"anchor-2-12\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-002:2-2:实\",\"seg-002:4-4:殽\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集 。这里指违反常道。\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-013:3-3:棘\",\"seg-016:3-4:行国\",\"seg-018:5-6:罔极\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"賢者憂國政日非也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"賢者憂國政日非也。\",\"fullText\":\"賢者憂國政日非也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。\",\"fullText\":\"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉評\",\"excerpt\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」\",\"fullText\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉評\",\"excerpt\":\"〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"fullText\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"殽食也。其語辭。〔張氏彩曰〕何其，猶《檀弓》言「何居」，蓋述譏己者反問之詞，言不喻其志也。棘〔《集傳》〕棘，棗之短者。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sect hengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-020:1-4:子曰何其\",\"segmentId\":\"seg-020\",\"segmentOrder\":20,\"surfaceText\":\"子曰何其\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-021:1-4:心之忧矣\",\"segmentId\":\"seg-021\",\"segmentOrder\":21,\"surfaceText\":\"心之忧矣\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-022:1-4:其谁知之\",\"segmentId\":\"seg-022\",\"segmentOrder\":22,\"surfaceText\":\"其谁知之\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-023:1-4:其谁知之\",\"segmentId\":\"seg-023\",\"segmentOrder\":23,\"surfaceText\":\"其谁知之\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-024:1-4:盖亦勿思\",\"segmentId\":\"seg-024\",\"segmentOrder\":24,\"surfaceText\":\"盖亦勿思\",\"charStart\":1,\"charEnd\":4,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-5\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-3:园有桃\",\"seg-002:1-4:其实之殽\",\"seg-003:1-4:心之忧矣\",\"seg-004:1-4:我歌且谣\",\"seg-005:1-4:不知我者\",\"seg-006:1-5:谓我士也骄\",\"seg-007:1-4:彼人是哉\",\"seg-008:1-4:子曰何其\",\"seg-009:1-4:心之忧矣\",\"seg-010:1-4:其谁知之\",\"seg-011:1-4:其谁知之\",\"seg-012:1-4:盖亦勿思\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\",\"anchor-2-5\",\"anchor-2-6\",\"anchor-2-7\",\"anchor-2-8\",\"anchor-2-9\",\"anchor-2-10\",\"anchor-2-11\",\"anchor-2-12\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\" 2\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-6\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！\",\"sourceLabel\":\"第 227-228 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"fullText\":\"这是一首没落贵族忧贫畏讥的诗。人家称他为“士”，可能是一位知识分子。他没落了，穷得没有饭吃，只好摘园中的桃枣充饥。春秋时候，魏国实行勤俭政策，这对士的生活来说，不免也受到影响，因而引起了他的感伤，便歌唱起来。他讥刺时政，不满现实。别人指责他骄傲反常，自以为是。他觉得无人能理解自己，精神上异常痛苦，只能用丢开一切、什么都不想的办法来寻找解脱。诗反映了当时魏国“士”的经济地位和思想情况。此诗与王风黍离、兔爰同一格调，都是所谓“悲愁之词”。诗以园桃兴起，急接“心之忧矣”一句，点明主题。然后句句围绕“忧”字，慷慨悲凉，大有“世人皆醉，而我独醒”之慨。诗中全无描状摹态、模山范水之笔，但胸臆的抒发一波三折，深沉而又痛切，所以姚际恒评曰：“诗如行文，极纵横排宕之致。”园有桃，其实之殽。心之忧矣，我歌且谣。不知我者，谓我士也骄。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！实，桃实，桃子。之，食。朱熹诗集传：“殽，食也。”这二句意为，园里有桃树，我吃了它的果实。歌、谣，有乐调配唱的叫作歌，无乐调配唱的叫作谣。这里的歌谣是泛称歌唱，并无配乐与否的区别。士，古代下级官僚或知识分子的通称。彼人，指执政者。是，正确。子，你，指那位士。其，语助词。何其，什么缘故。按这四句的意思各家注释各不相同，今从林义光诗经通解说，林氏曰：“不知我者之言也，言彼在位者所行良是，而子讥之，果何故乎？”盖，“盍”的假借字，是“何不”的合音。亦，语助词。这两句意为，我心中的忧愁无人了解，何不丢开了不去想它。园有棘，其实之食。心之忧矣，聊以行国。不知我者，谓我士也罔极。彼人是哉，子曰何其！心之忧矣，其谁知之？其谁知之，盖亦勿思！棘，酸枣树。行国，行游国中。朱熹诗集传：“聊，且略之辞。歌谣之不足，则出游于国中而写忧也。”罔极，无常。这里指违反常道。\",\"notes\":null,\"partOrder\":6,\"anchorIds\":[\"seg-013:3-3:棘\",\"seg-016:3-4:行国\",\"seg-018:5-6:罔极\"],\"glossAnchorIds\":[\"anchor-6-1\",\"anchor-6-2\",\"anchor-6-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\",\"seg-017\",\"seg-018\",\"seg-019\",\"seg-020\",\"seg-021\",\"seg-022\",\"seg-023\",\"seg-024\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"賢者憂國政日非也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"賢者憂國政日非也。\",\"fullText\":\"賢者憂國政日非也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。\",\"fullText\":\"右《園有桃》二章，章十二句。魏之失不在儉，而在嗇與褊，且不在卿大夫之儉，而在國君之褊與急。觀前二詩可見。夫士夫之能勤且儉，俗之美者也。雖周家王業始基，不過如是。而何以煩賢者之切切慮哉？豈知爲國貴遠圖，不貴小利。内能節儉，外務宏施，乃可以收人心而立國本。禹之菲飲食而致孝乎鬼神，惡衣服而致美乎黻冕，卑宫室而盡力乎溝洫，乃所以爲儉之善。故聖人歎爲無間然也。竊意魏君非儉乃嗇耳。舉國不知，以爲美德，從而和之，相率以吝，計較瑣屑，務簡省而不適宜，謀小利而不中節。以至人心日刻，而國勢愈孱，尚不自知其失。故賢者憂之，發爲歌詠，亦望當國者有以矯其失而正之耳。〇「園有桃」，或以爲興，或以爲比，或以爲賦。朱子亦不能定，以爲詩固有一章而三義者。其實主興者居多，而語氣終未得。程子曰：「『園有桃』，亦用其實以爲殽，興國有民雖寡，能用則治，今不能用，故心憂之。」姚氏際恒云：「桃、棘，果實之賤者。園有之，猶可以爲食，興國之無人也，故直接以『心之憂矣』云云。」均就詩論詩，未嘗即當日情事而一思之耳。至《集傳》謂「園必有桃，則其實之殽矣。心之憂，則我歌且謡矣」，尤含囫滑過，毫無意義。愚謂詩人之意若曰：園必有桃而後可以爲殽，國必有民而後可以爲治。今務爲刻嗇，剥削及民，民且避碩鼠而遠適樂國，君雖有土，誰與興利？旁觀深以爲憂，而當局乃以爲過。此詩之所以作也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"眉評\",\"excerpt\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」\",\"fullText\":\"〔一章〕姚氏際恒曰：「詩如行文，極縱横排宕之致。」〔二章〕此詩與《黍離》、《兔爰》，如出一手，所謂悲愁之詞易工也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/109-yuan-you-tao/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",
