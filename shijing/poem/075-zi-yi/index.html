t\":\"认为此诗以复沓句式写出亲密明白如话的语气。\",\"fullText\":\"程俊英解《缁衣》为赠衣诗，作者可能是卿大夫妻或贵族妇女，不取美郑武公、庄公之说。她并依次训“缁”为黑色衣，“敝”为坏，“宜”为适合合身，“造”与“作”相同，“席”为大，认为此诗以复沓句式写出亲密明白如话的语气。\",\"notes\":null,\"partOrder\":4,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 78-79 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"陈奂疏《緇衣》，仍申《序》“美武公”之旨，\",\"fullText\":\"陈奂疏《緇衣》，仍申《序》“美武公”之旨，视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。其并就“緇衣”“適子之館”“授子之粲”等语疏通礼意，认为此诗所咏是君臣嘉好，不作艳情解。\",\"notes\":\"依据页图 /private/tmp/075-chen2/p88.png、p89.png 保守摘录。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 78-79 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。\",\"fullText\":\"陈奂疏《緇衣》，仍申《序》“美武公”之旨，视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。其并就“緇衣”“適子之館”“授子之粲”等语疏通礼意，认为此诗所咏是君臣嘉好，不作艳情解。 诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：\",\"fullText\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:緇衣\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。\",\"fullText\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"fullText\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-2:緇衣\",\"seg-003:4-4:館\",\"seg-004:6-6:粲\",\"seg-009:4-4:蓆\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 365-366 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"通释\",\"excerpt\":\"马瑞辰释《緇衣》，以《序》“美武公”立篇，谓郑武公父子并为周司徒而国人宜之，故作此诗以美其德。\",\"fullText\":\"马瑞辰释《緇衣》，以《序》“美武公”立篇，谓郑武公父子并为周司徒而国人宜之，故作此诗以美其德。又随文申说“緇衣”为卿士退朝治事时所服之衣，“改爲”“適子之館”“授子之粲”皆见礼贤周至，不作男女相悦之辞。\",\"notes\":\"依据页图 /private/tmp/075-maruichen-body/p397.png、p398.png 保守摘录。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maruichen-tongshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 365-366 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"通释\",\"excerpt\":\"又随文申说“緇衣”为卿士退朝治事时所服之衣，\",\"fullText\":\"马瑞辰释《緇衣》，以《序》“美武公”立 陈奂疏《緇衣》，仍申《序》“美武公”之旨，\",\"fullText\":\"陈奂疏《緇衣》，仍申《序》“美武公”之旨，视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。其并就“緇衣”“適子之館”“授子之粲”等语疏通礼意，认为此诗所咏是君臣嘉好，不作艳情解。\",\"notes\":\"依据页图 /private/tmp/075-chen2/p88.png、p89.png 保守摘录。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 78-79 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。\",\"fullText\":\"陈奂疏《緇衣》，仍申《序》“美武公”之旨，视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。其并就“緇衣”“適子之館”“授子之粲”等语疏通礼意，认为此诗所咏是君臣嘉好，不作艳情解。\",\"notes\":\"依据页图 /private/tmp/075-chen2/p88.png、p89.png 保守摘录。\",\"partOrder\":2,\"anchorIds\":[\"seg-002:4-5:改爲\",\"seg-003:1-4:適子之館\",\"seg-004:3-6:授子之粲\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 78-79 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"疏\",\"excerpt\":\"其并就“緇衣”“適子之館”“授子之粲”等语疏通礼意，认为此诗所咏是君臣嘉好，不作艳情解。\",\"fullText\":\"陈奂疏《緇衣》，仍申《序》“美武公”之旨，视篇中“改爲”“適子之館”“授子之粲”为郑武公好贤而折节下士之实事。其并就“緇衣”“適子之館”“授子之粲”等语疏通礼意，认为此诗所咏是君臣嘉好，不作艳情解。\",\"notes\":\"依据页图 /private/tmp/075-chen2/p88.png、p89.png 保守摘录。\",\"partOrder\":3,\"anchorIds\":[\"seg-001:1-2:緇衣\",\"seg-003:1-4:適子之館\",\"seg-004:3-6:授子之粲\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：\",\"fullText\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:緇衣\"],\"glossAnchorIds\":[\"anchor-1-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。\",\"fullText\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"fullText\":\"方玉润论《緇衣》，认为以改衣、适馆、授粲诸语属之国人不通，而应据季氏后说，释为美郑武公好贤之诗：武公不仅能为贤者改衣授食，更能折节下交，屡适宾馆，所以国人歌其好贤无倦。其集释又训“緇衣”为士冠礼所见之服，“館”为舍，“粲”为餐，“蓆”为大。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-001:1-2:緇衣\",\"seg-003:4-4:館\",\"seg-004:6-6:粲\",\"seg-009:4-4:蓆\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maruichen-tongshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 365-366 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"通释\",\"excerpt\":\"马瑞辰释《緇衣》，以《序》“美武公”立篇，谓郑武公父子并为周司徒而国人宜之，故作此诗以美其德。\",\"fullText\":\"马瑞辰释《緇衣》，以《序》“美武公”立篇，谓郑武公父子并为周司徒而国人宜之，故作此诗以美其德。又随文申说“緇衣”为卿士退朝治事时所服之衣，“改爲”“適子之館”“授子之粲”皆见礼贤周至，不作男女相悦之辞。\",\"notes\":\"依据页图 /private/tmp/075-maruichen-body/p397.png、p398.png 保守摘录。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maruichen-tongshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 365-366 页\",\"attributionLabel\":\"马瑞辰\",\"sectionLabel\":\"通释\",\"excerpt\":\"又随文申说“緇衣”为卿士退朝治事时所服之衣，\",\"fullText\":\"马瑞辰释《緇衣》，以《序》“美武公”立篇，谓郑武公父子并为周司徒而国人宜之，故作此诗以美其德。又随文申说“緇衣”为卿士退朝治事时所服之衣，“改爲”“適子之館”“授子之粲”皆见礼贤周至，不作男女相悦之辞。\",\"notes\":\"依据页图 /private/tmp/075-maruichen-body/p397.png、p398.png 保守摘录。\",\"partOrder\":2,\"anchorIds\":[\"seg-001:1-2:緇衣\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maruichen-tongshi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/maruichen-tongshi/0001-1\",\"materialId\":\"maruichen-tongshi\",\"materialTitle\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 365-366 页\",\"attributionLabel\":\"马瑞辰\",\"sectio
