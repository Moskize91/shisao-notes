:0001-1:part-1"],"materialIds":["maruichen-tongshi"]}],"entries":[{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/075-zi-yi/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"缁衣之宜兮，敝予又改为兮。适子之馆兮，还予授子之粲兮。缁衣之好兮，敝予又改造兮。适子之馆兮，还予授子之粲兮。缁衣之席兮，敝予又改作兮。适子之馆兮，还予授子之粲兮。","sourceLabel":"第 170-171 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首赠衣的诗。古代制衣多为妇女的工作，缁衣则是当时卿大夫私朝穿的衣服，诗中改衣、授粲，又似较亲密的家人口吻，所以我们揣测这位作者可能是一个贵族妇女，也可能就是这位穿缁衣者的妻妾。毛诗和三家诗都说这是赞美郑武公的诗，因为他父子都做过周卿士的官。但这种说法无非是根据左传“郑武公、庄公为平王卿士”一语而附会其说，并不可信。朱熹、姚际恒、方玉润虽对旧说有怀疑，但也跳不出武公的范围。今细味诗意，参酌闻一多风诗类钞说，定为赠衣诗。\n诗经句式，基本上是四言的，但也有一言到八言的不等。此诗有“敝”、“还”的一言句，有“缁衣之宜兮”的五言句，有“予授子之粲兮”的六言句，是句式变化较多的一首。一章之中三易句式，恐怕是当时诗歌口语化的一种痕迹。其效果，将作者与“子”之间的密切关系和亲密气氛表达得很充分，使读者感到明白如话、音节悠扬的美。\n缁衣之宜兮，敝，予又改为兮。适子之馆兮，还，予授子之粲兮。\n缁（zī）衣，黑色的衣。古代卿大夫官吏到官署（古称私朝，即第三句的“馆”）所穿的衣服。孔疏：“卿士旦朝于王，服皮弁，不服缁衣。退适治事之馆，释皮弁而服（缁衣），以听其所朝之政也。”\n宜，合适、合身。\n敝，俗作弊，破旧。说文：“敝，帗也。一曰败衣。”段注：“帗者，一幅巾也。引申为凡败之称。”\n为，制作。\n适，往。毛传：“适，之也。”尔雅释诂：“之，往也。”\n馆，官舍，相当于现代的办公室。郑笺：“卿士所之之馆，在天子之宫。”孔疏：“谓天子宫内卿士，各立曹司，有庐舍以治事也。”\n还，音义同“旋”，归来。\n授，给予。\n粲，本义为洁白的精米，引申为鲜明，指新衣。小雅大东：“粲粲衣服”，毛传：“粲，鲜盛貌。”闻一多风诗类钞：“粲，新也，谓新衣。”按毛传训粲为“餐”，为假借字，训食。与上文意不相连贯。\n韵读：歌部——宜（音俄）、为（音讹）。元部——馆、粲。\n缁衣之好兮，敝，予又改造兮。适子之馆兮，还，予授子之粲兮。\n好，美好。\n造，与上章的“为”、下章的“作”同义，因协韵而易字。\n韵读：幽部——好（呼受反）、造（徂授反）。元部——馆、粲。\n缁衣之席兮，敝，予又改作兮。适子之馆兮，还，予授子之粲兮。\n席，通硕，宽大。毛传：“席，大也。”陈奂传疏：“席，大。与一章‘宜’、二章‘好’，不同义也。”\n韵读：鱼部——席（音徐入声）、作（音租入声）。元部——馆、粲。","fullText":"这是一首赠衣的诗。古代制衣多为妇女的工作，缁衣则是当时卿大夫私朝穿的衣服，诗中改衣、授粲，又似较亲密的家人口吻，所以我们揣测这位作者可能是一个贵族妇女，也可能就是这位穿缁衣者的妻妾。毛诗和三家诗都说这是赞美郑武公的诗，因为他父子都做过周卿士的官。但这种说法无非是根据左传“郑武公、庄公为平王卿士”一语而附会其说，并不可信。朱熹、姚际恒、方玉润虽对旧说有怀疑，但也跳不出武公的范围。今细味诗意，参酌闻一多风诗类钞说，定为赠衣诗。\n诗经句式，基本上是四言的，但也有一言到八言的不等。此诗有“敝”、“还”的一言句，有“缁衣之宜兮”的五言句，有“予授子之粲兮”的六言句，是句式变化较多的一首。一章之中三易句式，恐怕是当时诗歌口语化的一种痕迹。其效果，将作者与“子”之间的密切关系和亲密气氛表达得很充分，使读者感到明白如话、音节悠扬的美。\n缁衣之宜兮，敝，予又改为兮。适子之馆兮，还，予授子之粲兮。\n缁（zī）衣， ctionLabel":"题注","excerpt":"緇衣㊟美鄭武公好賢也。","fullText":"緇衣㊟美鄭武公好賢也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。","fullText":"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0003-1:part-1","annotationId":"0003","glossId":"0003-1","glossHref":"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0003-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"term","layerLa t\":4},{\"id\":\"maruichen-tongshi\",\"title\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":18,\"anchoredPartCount\":1,\"overviewPartCount\":3},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-004:3-6:授子之粲\",\"segmentId\":\"seg-004\",\"segmentOrder\":4,\"surfaceText\":\"授子之粲\",\"charStart\":3,\"charEnd\":6,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"缁衣之宜兮，敝予又改为兮。适子之馆兮，还予授子之粲兮。缁衣之好兮，敝予又改造兮。适子之馆兮，还予授子之粲兮。缁衣之席兮，敝予又改作兮。适子之馆兮，还予授子之粲兮。\",\"sourceLabel\":\"第 170-171 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首赠衣的诗。古代制衣多为妇女的工作，缁衣则是当时卿大夫私朝穿的衣服，诗中改衣、授粲，又似较亲密的家人口吻，所以我们揣测这位作者可能是一个贵族妇女，也可能就是这位穿缁衣者的妻妾。毛诗和三家诗都说这是赞美郑武公的诗，因为他父子都做过周卿士的官。但这种说法无非是根据左传“郑武公、庄公为平王卿士”一语而附会其说，并不可信。朱熹、姚际恒、方玉润虽对旧说有怀疑，但也跳不出武公的范围。今细味诗意，参酌闻一多风诗类钞说，定为赠衣诗。\\n诗经句式，基本上是四言的，但也有一言到八言的不等。此诗有“敝”、“还”的一言句，有“缁衣之宜兮”的五言句，有“予授子之粲兮”的六言句，是句式变化较多的一首。一章之中三易句式，恐怕是当时诗歌口语化的一种痕迹。其效果，将作者与“子”之间的密切关系和亲密气氛表达得很充分，使读者感到明白如话、音节悠扬的美。\\n缁衣之宜兮，敝，予又改为兮。适子之馆兮，还，予授子之粲兮。\\n缁（zī）衣，黑色的衣。古代卿大夫官吏到官署（古称私朝，即第三句的“馆”）所穿的衣服。孔疏：“卿士旦朝于王，服皮弁，不服缁衣。退适治事之馆，释皮弁而服（缁衣），以听其所朝之政也。”\\n宜，合适、合身。\\n敝，俗作弊，破旧。说文：“敝，帗也。一曰败衣。”段注：“帗者，一幅巾也。引申为凡败之称。”\\n为，制作。\\n适，往。毛传：“适，之也。”尔雅释诂：“之，往也。”\\n馆，官舍，相当于现代的办公室。郑笺：“卿士所之之馆，在天子之宫。”孔疏：“谓天子宫内卿士，各立曹司，有庐舍以治事也。”\\n还，音义同“旋”，归来。\\n授，给予。\\n粲，本义为洁白的精米，引申为鲜明，指新衣。小雅大东：“粲粲衣服”，毛传：“粲，鲜盛貌。”闻一多风诗类钞：“粲，新也，谓新衣。”按毛传训粲为“餐”，为假借字，训食。与上文意不相连贯。\\n韵读：歌部——宜（音俄）、为（音讹）。元部——馆、粲。\\n缁衣之好兮，敝，予又改造兮。适子之馆兮，还，予授子之粲兮。\\n好，美好。\\n造，与上章的“为”、下章的“作”同义，因协韵而易字。\\n韵读：幽部——好（呼受反）、造（徂授反）。元部——馆、粲。\\n缁衣之席兮，敝，予又改作兮。适子之馆兮，还，予授子之粲兮。\\n席，通硕，宽大。毛传：“席，大也。”陈奂传疏：“席，大。与一章‘宜’、二章‘好’，不同义也。”\\n韵读：鱼部——席（音徐入声）、作（音租入声）。元部——馆、粲。\",\"fullText\":\"这是一首赠衣的诗。古代制衣多为妇女的工作，缁衣则是当时卿大夫私朝穿的衣服，诗中改衣、授粲，又似较亲密的家人口吻，所以我们揣测这位作者可能是一个贵族妇女，也可能就是这位穿缁衣者的妻妾。毛诗和三家诗都说这是赞美郑武公的诗，因为他父子都做过周卿士的官。但这种说法无非是根据左传“郑武公、庄公为平王卿士”一语而附会其说，并不可信。朱熹、姚际恒、方玉润虽对旧说有怀疑，但也跳不出武公的范围。今细味诗意，参酌闻一多风诗类钞说，定为赠衣诗。\\n诗经句式，基本上是四言的，但也有一言到八言的不等。此诗有“敝”、“还”的一言句，有“缁衣之宜兮”的五言句，有“予授子之粲兮”的六言句，是句式变化较多的一首。一章之中三易句式，恐怕是当时诗歌口语化的一种痕迹。其效果，将作者与“子”之间的密切关系和亲密气氛表达得很充分，使读者感到明白如话、音节悠扬的美。\\n缁衣之宜兮，敝，予又改为兮。适子之馆兮，还，予授子之粲兮。\\n缁（zī）衣，黑色的衣。古代卿大夫官吏到官署（古称私朝，即第三句的“馆”）所穿的衣服。孔疏：“卿士旦朝于王，服皮弁，不服缁衣。退适治事之馆，释皮弁而服（缁衣），以听其所朝之政也。”\\n宜，合适、合身。\\n敝，俗作弊，破旧。说文：“敝，帗也。一曰败衣。”段注：“帗者，一幅巾也。引申为凡败之称。”\\n为，制作。\\n适，往。毛传：“适，之也。”尔雅释诂：“之，往也。”\\n馆，官舍，相当于现代的办公室。郑笺：“卿士所之之馆，在天子之宫。”孔疏：“谓天子宫内卿士，各立曹司，有庐舍以治事也。”\\n还，音义同“旋”，归来。\\n授，给予。\\n粲，本义为洁白的精米，引申为鲜明，指新衣。小雅大东：“粲粲衣服”，毛传：“粲，鲜盛貌。”闻一多风诗类钞：“粲，新也，谓新衣。”按毛传训粲为“餐”，为假借字，训食。与上文意不相连贯。\\n韵读：歌部——宜（音俄）、为（音讹）。元部——馆、粲。\\n缁衣之好兮，敝，予又改造兮。适子之馆兮，还，予授子之粲兮。\\n好，美好。\\n造，与上章的“为”、下章的“作”同义，因协韵而易字。\\n韵读：幽部——好（呼受反）、造（徂授反）。元部——馆、粲。\\n缁衣之席兮，敝，予又改作兮。适子之馆兮，还，予授子之粲兮。\\n席，通硕，宽大。毛传：“席，大也。”陈奂传疏：“席，大。与一章‘宜’、二章‘好’，不同义也。”\\n韵读：鱼部——席（音徐入声）、作（音租入声）。元部——馆、粲。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 78-79 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"fullText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"緇衣㊟美鄭武公好賢也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"緇衣㊟美鄭武公好賢也。\",\"fullText\":\"緇衣㊟美鄭武公好賢也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。\",\"fullText\":\"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋緇黑色。〔《周禮·考工記》〕「三入爲纁，五入爲緅，七入爲緇」注：「染纁者三入而成，又再染以黑則爲緅，又復再染以黑乃成緇。」緇衣〔孔氏穎達曰〕緇衣，即《士冠禮》所云「玄服，「玄服」，阮刻本《儀禮》、阮刻本《毛詩正義》（以下簡稱《毛詩正義》）均作「玄冠」。朝服，緇帶，素韠」是也。卿士旦朝於王，服皮弁，不服緇衣。退適治事之館，釋皮弁而服，以聽其所朝之政也。館舍也。粲餐也。蓆大也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"集釋緇黑色。〔《周禮·考工記》〕「三入爲纁，五入爲緅，七入爲緇」注：「染纁者三入而成，又再染以黑則爲緅，又復再染以黑乃成緇。」緇衣〔孔氏穎達曰〕緇衣，即《士冠禮》所云「玄服，「玄服」，阮刻本《儀禮》、阮刻本《毛詩正義》（以下簡稱《毛詩正義》）均作「玄冠」。朝服，緇帶，素韠」是也。卿士旦朝於王，服皮弁，不服緇衣。退適治事之館，釋皮弁而服，以聽其所朝之政也。館舍也。粲餐也。蓆大也。\",\"fullText\":\"集釋緇黑色。〔《周禮·考工記》〕「三入爲纁，五入爲緅，七入爲緇」注：「染纁者三入而成，又再染以黑則爲緅，又復再染以黑乃成緇。」緇衣〔孔氏穎達曰〕緇衣，即《士冠禮》所云「玄服，「玄服」，阮刻本《儀禮》、阮刻本《毛詩正義》（以下簡稱《毛詩正義》）均作「玄冠」。朝服，緇帶，素韠」是也。卿士旦朝於王，服皮弁，不服緇衣。退適治事之館，釋皮弁而服，以聽其所朝之政也。館舍也。粲餐也。蓆大也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004- ls\":[{\"id\":\"chenhuan-chuanshu\",\"title\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"glossCount\":1,\"partCount\":1},{\"id\":\"wangli-yundu\",\"title\":\"詩經韻讀\",\"contributorLine\":\"现代 · 王力\",\"publicationYear\":1980,\"glossCount\":3,\"partCount\":3},{\"id\":\"quwanli-quanshi\",\"title\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"glossCount\":8,\"partCount\":8},{\"id\":\"fangyurun-yuanshi\",\"title\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"glossCount\":4,\"partCount\":4},{\"id\":\"maruichen-tongshi\",\"title\":\"毛詩傳箋通釋\",\"contributorLine\":\"清 · 馬瑞辰\",\"publicationYear\":1989,\"glossCount\":1,\"partCount\":1},{\"id\":\"chengjunying-jiangjianyuan-zhuxi\",\"title\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"glossCount\":1,\"partCount\":1}],\"stats\":{\"materialCount\":6,\"glossCount\":18,\"anchoredPartCount\":1,\"overviewPartCount\":3},\"overview\":{\"prefaceEntryIds\":[],\"globalEntryIds\":[\"fangyurun-yuanshi:0001-1:part-1\",\"fangyurun-yuanshi:0002-1:part-1\",\"quwanli-quanshi:0001-1:part-1\"]},\"focusAnchors\":[{\"id\":\"seg-004:3-6:授子之粲\",\"segmentId\":\"seg-004\",\"segmentOrder\":4,\"surfaceText\":\"授子之粲\",\"charStart\":3,\"charEnd\":6,\"entryIds\":[\"maruichen-tongshi:0001-1:part-1\"],\"materialIds\":[\"maruichen-tongshi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"缁衣之宜兮，敝予又改为兮。适子之馆兮，还予授子之粲兮。缁衣之好兮，敝予又改造兮。适子之馆兮，还予授子之粲兮。缁衣之席兮，敝予又改作兮。适子之馆兮，还予授子之粲兮。\",\"sourceLabel\":\"第 170-171 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首赠衣的诗。古代制衣多为妇女的工作，缁衣则是当时卿大夫私朝穿的衣服，诗中改衣、授粲，又似较亲密的家人口吻，所以我们揣测这位作者可能是一个贵族妇女，也可能就是这位穿缁衣者的妻妾。毛诗和三家诗都说这是赞美郑武公的诗，因为他父子都做过周卿士的官。但这种说法无非是根据左传“郑武公、庄公为平王卿士”一语而附会其说，并不可信。朱熹、姚际恒、方玉润虽对旧说有怀疑，但也跳不出武公的范围。今细味诗意，参酌闻一多风诗类钞说，定为赠衣诗。\\n诗经句式，基本上是四言的，但也有一言到八言的不等。此诗有“敝”、“还”的一言句，有“缁衣之宜兮”的五言句，有“予授子之粲兮”的六言句，是句式变化较多的一首。一章之中三易句式，恐怕是当时诗歌口语化的一种痕迹。其效果，将作者与“子”之间的密切关系和亲密气氛表达得很充分，使读者感到明白如话、音节悠扬的美。\\n缁衣之宜兮，敝，予又改为兮。适子之馆兮，还，予授子之粲兮。\\n缁（zī）衣，黑色的衣。古代卿大夫官吏到官署（古称私朝，即第三句的“馆”）所穿的衣服。孔疏：“卿士旦朝于王，服皮弁，不服缁衣。退适治事之馆，释皮弁而服（缁衣），以听其所朝之政也。”\\n宜，合适、合身。\\n敝，俗作弊，破旧。说文：“敝，帗也。一曰败衣。”段注：“帗者，一幅巾也。引申为凡败之称。”\\n为，制作。\\n适，往。毛传：“适，之也。”尔雅释诂：“之，往也。”\\n馆，官舍，相当于现代的办公室。郑笺：“卿士所之之馆，在天子之宫。”孔疏：“谓天子宫内卿士，各立曹司，有庐舍以治事也。”\\n还，音义同“旋”，归来。\\n授，给予。\\n粲，本义为洁白的精米，引申为鲜明，指新衣。小雅大东：“粲粲衣服”，毛传：“粲，鲜盛貌。”闻一多风诗类钞：“粲，新也，谓新衣。”按毛传训粲为“餐”，为假借字，训食。与上文意不相连贯。\\n韵读：歌部——宜（音俄）、为（音讹）。元部——馆、粲。\\n缁衣之好兮，敝，予又改造兮。适子之馆兮，还，予授子之粲兮。\\n好，美好。\\n造，与上章的“为”、下章的“作”同义，因协韵而易字。\\n韵读：幽部——好（呼受反）、造（徂授反）。元部——馆、粲。\\n缁衣之席兮，敝，予又改作兮。适子之馆兮，还，予授子之粲兮。\\n席，通硕，宽大。毛传：“席，大也。”陈奂传疏：“席，大。与一章‘宜’、二章‘好’，不同义也。”\\n韵读：鱼部——席（音徐入声）、作（音租入声）。元部——馆、粲。\",\"fullText\":\"这是一首赠衣的诗。古代制衣多为妇女的工作，缁衣则是当时卿大夫私朝穿的衣服，诗中改衣、授粲，又似较亲密的家人口吻，所以我们揣测这位作者可能是一个贵族妇女，也可能就是这位穿缁衣者的妻妾。毛诗和三家诗都说这是赞美郑武公的诗，因为他父子都做过周卿士的官。但这种说法无非是根据左传“郑武公、庄公为平王卿士”一语而附会其说，并不可信。朱熹、姚际恒、方玉润虽对旧说有怀疑，但也跳不出武公的范围。今细味诗意，参酌闻一多风诗类钞说，定为赠衣诗。\\n诗经句式，基本上是四言的，但也有一言到八言的不等。此诗有“敝”、“还”的一言句，有“缁衣之宜兮”的五言句，有“予授子之粲兮”的六言句，是句式变化较多的一首。一章之中三易句式，恐怕是当时诗歌口语化的一种痕迹。其效果，将作者与“子”之间的密切关系和亲密气氛表达得很充分，使读者感到明白如话、音节悠扬的美。\\n缁衣之宜兮，敝，予又改为兮。适子之馆兮，还，予授子之粲兮。\\n缁（zī）衣，黑色的衣。古代卿大夫官吏到官署（古称私朝，即第三句的“馆”）所穿的衣服。孔疏：“卿士旦朝于王，服皮弁，不服缁衣。退适治事之馆，释皮弁而服（缁衣），以听其所朝之政也。”\\n宜，合适、合身。\\n敝，俗作弊，破旧。说文：“敝，帗也。一曰败衣。”段注：“帗者，一幅巾也。引申为凡败之称。”\\n为，制作。\\n适，往。毛传：“适，之也。”尔雅释诂：“之，往也。”\\n馆，官舍，相当于现代的办公室。郑笺：“卿士所之之馆，在天子之宫。”孔疏：“谓天子宫内卿士，各立曹司，有庐舍以治事也。”\\n还，音义同“旋”，归来。\\n授，给予。\\n粲，本义为洁白的精米，引申为鲜明，指新衣。小雅大东：“粲粲衣服”，毛传：“粲，鲜盛貌。”闻一多风诗类钞：“粲，新也，谓新衣。”按毛传训粲为“餐”，为假借字，训食。与上文意不相连贯。\\n韵读：歌部——宜（音俄）、为（音讹）。元部——馆、粲。\\n缁衣之好兮，敝，予又改造兮。适子之馆兮，还，予授子之粲兮。\\n好，美好。\\n造，与上章的“为”、下章的“作”同义，因协韵而易字。\\n韵读：幽部——好（呼受反）、造（徂授反）。元部——馆、粲。\\n缁衣之席兮，敝，予又改作兮。适子之馆兮，还，予授子之粲兮。\\n席，通硕，宽大。毛传：“席，大也。”陈奂传疏：“席，大。与一章‘宜’、二章‘好’，不同义也。”\\n韵读：鱼部——席（音徐入声）、作（音租入声）。元部——馆、粲。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chenhuan-chuanshu:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/chenhuan-chuanshu/0001-1\",\"materialId\":\"chenhuan-chuanshu\",\"materialTitle\":\"詩毛氏傳疏\",\"contributorLine\":\"清 · 陳奐\",\"publicationYear\":1847,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"sourceLabel\":\"第 78-79 页\",\"attributionLabel\":\"陈奂\",\"sectionLabel\":\"经文\",\"excerpt\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"fullText\":\"緇衣之宜兮，敝予又改爲兮。適子之館兮，還予授子之粲兮。緇衣之好兮，敝予又改造兮。適子之館兮，還予授子之粲兮。緇衣之蓆兮，敝予又改作兮。適子之館兮，還予授子之粲兮。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"緇衣㊟美鄭武公好賢也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"緇衣㊟美鄭武公好賢也。\",\"fullText\":\"緇衣㊟美鄭武公好賢也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。\",\"fullText\":\"右《緇衣》三章，章四句。《序》、《傳》皆謂「國人美武公」，《集傳》、《詩緝》悉從之，無異説。惟季氏本以爲「美武公好賢之詩」，姚氏謂爲後説勝前賢，不然改衣、適館、授粲，此豈臣下施於君上哉？無論鄭人不宜爲此言，即周人亦不當出此詞。其説是矣。愚謂改衣、授粲非在上者之所難，特難於「適子之館」而不憚煩焉耳。夫使龍飛鳳翥之士日來吾前，而吾但爲之改衣、授粲，而不適其館，隆以禮貌之謂何？是徒以衣食餌國士，而國士且望望然去，尚得謂之好賢哉？武公則於改衣、授粲外，而又能折節下交，屢適賓館，居則虚衷以前席，出則憑軾而過門。羅賢以禮不以貌，親賢以道尤以心。賢所以樂爲用而共成輔國宏猷。國人好之，形諸歌咏，寫其好賢無倦之心，殆將與握髮吐哺後先相映，爲萬世美談。此《緇衣》之詩所由作也。即謂之美武公也，亦奚不可？惟不宜以改衣、適館、授粲屬之國人耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/075-zi-yi/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"集釋緇黑色。〔《周禮·考工記》〕「三入爲纁，五入爲緅，七入爲緇」注：「染纁者三入而成，又再染以黑則爲緅，又復再染以黑乃成緇。」緇衣〔孔氏穎達曰〕緇衣，即《士冠禮》所云「玄服，「玄服」，阮刻本《儀禮》、阮刻本《毛詩正義》（以下簡稱《毛詩正義》）均作「玄冠」。朝服，緇帶，素韠」是也。卿士旦朝於王，服皮弁，不服緇衣。退適治事之館，釋皮弁而服，以聽其所朝之政也。館舍也。粲餐也。蓆大也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",
