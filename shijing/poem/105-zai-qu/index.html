eg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012","seg-013","seg-014","seg-015","seg-016"]},{"id":"fangyurun-yuanshi:0001-1:part-1","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0001-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"刺文姜如齊無忌也。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"题注","excerpt":"刺文姜如齊無忌也。","fullText":"刺文姜如齊無忌也。","notes":null,"partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":[]},{"id":"fangyurun-yuanshi:0002-1:part-1","annotationId":"0002","glossId":"0002-1","glossHref":"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0002-1","materialId":"fangyurun-yuanshi","materialTitle":"诗经原始(上下)","contributorLine":"清 · 方玉润、李先耕","publicationYear":1986,"layer":"global","layerLabel":"全篇总说","targetText":"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。","sourceLabel":null,"attributionLabel":"方玉润","sectionLabel":"总评","excerpt":"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。","fullText":"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜 1-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。\",\"sourceLabel\":\"第 218-220 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首写齐女嫁鲁的诗。诗中叠字很多，可能与配合乐曲有关，也把哀姜故意拖拖拉拉的神态活画出来了。\",\"fullText\":\"这是一首写齐女嫁鲁的诗。诗中叠字很多，可能与配合乐曲有关，也把哀姜故意拖拖拉拉的神态活画出来了。载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。薄薄，车轮转动声。簟，竹席。茀，车帘。朱鞹，染红兽皮制的车盖。鲁道有荡，指鲁道平坦。齐子发夕，写哀姜迟迟不入鲁境。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。四骊，四匹黑马。济济，整齐貌。濔濔，柔软貌。岂弟，安舒徐缓。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。汤汤，水势盛大貌。彭彭，行人众多貌。翱翔，游逛不进鲁国。滔滔，水流盛貌。儦儦，来回行走貌。游敖，即邀游。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。\",\"sourceLabel\":\"第 218-220 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。\",\"fullText\":\"这是一首写齐女嫁鲁的诗。诗中叠字很多，可能与配合乐曲有关，也把哀姜故意拖拖拉拉的神态活画出来了。载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。薄薄，车轮转动声。簟，竹席。茀，车帘。朱鞹，染红兽皮制的车盖。鲁道有荡，指鲁道平坦。齐子发夕，写哀姜迟迟不入鲁境。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。四骊，四匹黑马。济济，整齐貌。濔濔，柔软貌。岂弟，安舒徐缓。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。汤汤，水势盛大貌。彭彭，行人众多貌。翱翔，游逛不进鲁国。滔滔，水流盛貌。儦儦，来回行走貌。游敖，即邀游。\",\"notes\":null,\"par anchorIds\":[\"seg-009:3-4:汤汤\",\"seg-010:3-4:彭彭\",\"seg-012:3-4:翱翔\",\"seg-013:3-4:滔滔\",\"seg-014:3-4:儦儦\",\"seg-016:3-4:游敖\"],\"glossAnchorIds\":[\"anchor-8-1\",\"anchor-8-2\",\"anchor-8-3\",\"anchor-8-4\",\"anchor-8-5\",\"anchor-8-6\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺文姜如齊無忌也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺文姜如齊無忌也。\",\"fullText\":\"刺文姜如齊無忌也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。\",\"fullText\":\"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"薄薄疾驅聲。簟方文席也。茀車後户也。〔孔氏穎達曰〕簟字從竹，用竹爲席，其文必方。車之蔽曰茀。朱鞹〔《爾雅》〕輿革前謂之鞎，後謂之茀。竹前謂之禦，後謂之蔽。郭璞注：鞎以韋靶車軾，茀以韋靶後户，禦以簟衣軾，蔽以簟衣後户。〔陳氏祥道曰〕鞎與茀，皆草爲之。《詩》所謂「朱鞹」是也。禦與蔽，皆竹爲之。《詩》所謂「簟茀」是也。驪馬黑色也。濟濟美貌。〔毛氏萇曰〕四驪，言物色盛也。〔孔氏穎達曰〕《夏官·校人》云：「凡軍事，物馬而頒之。」注云：「物馬齊其力。」言「四」言「驪」，道其物色俱盛也。濔濔柔貌。〔毛氏萇曰〕垂轡，轡之垂者。濔濔，衆也。豈弟樂易也。〔嚴氏粲曰〕樂易，安舒恬然無慙恥之色。汶水名。〔曹氏粹中曰〕汶水有二。許氏以爲出琅邪朱虚縣東泰山，東至安丘入潍。桑欽以爲出泰山萊蕪縣，西南入濟。説者主欽義，以爲在齊南魯北。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"薄薄疾驅聲。\",\"fullText\":\"薄薄疾驅聲。簟方文席也。茀車後户也。〔孔氏穎達曰〕簟字從竹，用竹爲席，其文必方。車之蔽曰茀。朱鞹〔《爾雅》〕輿革前謂之鞎，後謂之茀。竹前謂之禦，後謂之蔽。郭璞注：鞎以韋靶車軾，茀以韋靶後户，禦以簟衣軾，蔽以簟衣後户。〔陳氏祥道曰〕鞎與茀，皆草爲之。《詩》所謂「朱鞹」是也。禦與蔽，皆竹爲之。《詩》所謂「簟茀」是也。驪馬黑色也。濟濟美貌。〔毛氏萇曰〕四驪，言物色盛也。〔孔氏穎達曰〕《夏官·校人》云：「凡軍事，物馬而頒之。」注云：「物馬齊其力。」言「四」言「驪」，道其物色俱盛也。濔濔柔貌。〔毛氏萇曰〕垂轡，轡之垂者。濔濔，衆也。豈弟樂易也。〔嚴氏粲曰〕樂易，安舒恬然無慙恥之色。汶水名。〔曹氏粹中曰〕汶水有二。許氏以爲出琅邪朱虚縣東泰山，東至安丘入潍。桑欽以爲出泰山萊蕪縣，西南入濟。説者主欽義，以爲在齊南魯北。\",\"notes\":null,\"partOrder\":1,\"anchor \",\"targetText\":\"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。\",\"sourceLabel\":\"第 218-220 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首写齐女嫁鲁的诗。诗中叠字很多，可能与配合乐曲有关，也把哀姜故意拖拖拉拉的神态活画出来了。\",\"fullText\":\"这是一首写齐女嫁鲁的诗。诗中叠字很多，可能与配合乐曲有关，也把哀姜故意拖拖拉拉的神态活画出来了。载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。薄薄，车轮转动声。簟，竹席。茀，车帘。朱鞹，染红兽皮制的车盖。鲁道有荡，指鲁道平坦。齐子发夕，写哀姜迟迟不入鲁境。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。四骊，四匹黑马。济济，整齐貌。濔濔，柔软貌。岂弟，安舒徐缓。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。汤汤，水势盛大貌。彭彭，行人众多貌。翱翔，游逛不进鲁国。滔滔，水流盛貌。儦儦，来回行走貌。游敖，即邀游。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。\",\"sourceLabel\":\"第 218-220 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。\",\"fullText\":\"这是一首写齐女嫁鲁的诗。诗中叠字很多，可能与配合乐曲有关，也把哀姜故意拖拖拉拉的神态活画出来了。载驱薄薄，簟茀朱鞹。鲁道有荡，齐子发夕。薄薄，车轮转动声。簟，竹席。茀，车帘。朱鞹，染红兽皮制的车盖。鲁道有荡，指鲁道平坦。齐子发夕，写哀姜迟迟不入鲁境。四骊济济，垂辔濔濔。鲁道有荡，齐子岂弟。四骊，四匹黑马。济济，整齐貌。濔濔，柔软貌。岂弟，安舒徐缓。汶水汤汤，行人彭彭。鲁道有荡，齐子翱翔。汶水滔滔，行人儦儦。鲁道有荡，齐子游敖。汤汤，水势盛大貌。彭彭，行人众多貌。翱翔，游逛不进鲁国。滔滔，水流盛貌。儦儦，来回行走貌。游敖，即邀游。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:载驱薄薄\",\"seg-002:1-4:簟茀朱鞹\",\"seg-003:1-4:鲁道有荡\",\"seg-004:1-4:齐子发夕\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"s g-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\",\"seg-013\",\"seg-014\",\"seg-015\",\"seg-016\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"刺文姜如齊無忌也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"刺文姜如齊無忌也。\",\"fullText\":\"刺文姜如齊無忌也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。\",\"fullText\":\"右《載驅》四章，章四句。此詩以專刺文姜爲主，不必牽涉襄公，而襄公之惡自不可掩。夫人之疾驅夕發以如齊者，果誰爲乎？爲襄公也。夫人爲襄公而如齊，則刺夫人即以刺襄公，又何必如舊説「公盛車服，與文姜播淫於萬民」而後謂之刺乎？且《碩人》云「翟茀以朝」，是婦人之車亦可言茀，不必以前二章上二句屬襄公也。案《春秋》魯莊公二年，「夫人姜氏會齊侯于禚」，四年，「夫人姜氏享齊侯于祝丘」，五年，「夫人姜氏如齊師」，七年，「夫人姜氏會齊侯于防」，又「會齊侯于穀」。蓋至是，而夫人之如齊肆無忌憚矣。詩曰「發夕」、曰「豈弟」、曰「翺翔」、曰「遊敖」，正其時也。上章在桓公之世，其歸甯也，不避言僕從之衆「如雲」、「如雨」、「如水」而已。此詩在莊公之年，其會兄也，竟至樂而忘返，遂翺翔遠遊，宣淫於通道大都，不顧行人訕笑，豈尚知人間有羞恥事哉？至今汶水上有文姜臺，與衛之新臺可以並臭千古。雖濯盡汶、濮二水滔滔流浪，亦難洗厥羞矣。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"薄薄疾驅聲。簟方文席也。茀車後户也。〔孔氏穎達曰〕簟字從竹，用竹爲席，其文必方。車之蔽曰茀。朱鞹〔《爾雅》〕輿革前謂之鞎，後謂之茀。竹前謂之禦，後謂之蔽。郭璞注：鞎以韋靶車軾，茀以韋靶後户，禦以簟衣軾，蔽以簟衣後户。〔陳氏祥道曰〕鞎與茀，皆草爲之。《詩》所謂「朱鞹」是也。禦與蔽，皆竹爲之。《詩》所謂「簟茀」是也。驪馬黑色也。濟濟美貌。〔毛氏萇曰〕四驪，言物色盛也。〔孔氏穎達曰〕《夏官·校人》云：「凡軍事，物馬而頒之。」注云：「物馬齊其力。」言「四」言「驪」，道其物色俱盛也。濔濔柔貌。〔毛氏萇曰〕垂轡，轡之垂者。濔濔，衆也。豈弟樂易也。〔嚴氏粲曰〕樂易，安舒恬然無慙恥之色。汶水名。〔曹氏粹中曰〕汶水有二。許氏以爲出琅邪朱虚縣東泰山，東至安丘入潍。桑欽以爲出泰山萊蕪縣，西南入濟。説者主欽義，以爲在齊南魯北。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"薄薄疾驅聲。\",\"fullText\":\"薄薄疾驅聲。簟方文席也。茀車後户也。〔孔氏穎達曰〕簟字從竹，用竹爲席，其文必方。車之蔽曰茀。朱鞹〔《爾雅》〕輿革前謂之鞎，後謂之茀。竹前謂之禦，後謂之蔽。郭璞注：鞎以韋靶車軾，茀以韋靶後户，禦以簟衣軾，蔽以簟衣後户。〔陳氏祥道曰〕鞎與茀，皆草爲之。《詩》所謂「朱鞹」是也。禦與蔽，皆竹爲之。《詩》所謂「簟茀」是也。驪馬黑色也。濟濟美貌。〔毛氏萇曰〕四驪，言物色盛也。〔孔氏穎達曰〕《夏官·校人》云：「凡軍事，物馬而頒之。」注云：「物馬齊其力。」言「四」言「驪」，道其物色俱盛也。濔濔柔貌。〔毛氏萇曰〕垂轡，轡之垂者。濔濔，衆也。豈弟樂易也。〔嚴氏粲曰〕樂易，安舒恬然無慙恥之色。汶水名。〔曹氏粹中曰〕汶水有二。許氏以爲出琅邪朱虚縣東泰山，東至安丘入潍。桑欽以爲出泰山萊蕪縣，西南入濟。説者主欽義，以爲在齊南魯北。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/105-zai-qu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经
