unying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。","sourceLabel":"第 327-328 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。","fullText":"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。韵读：支部一一枝、知。隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！無家，与下章的“無室”，都是没有妻儿拖累之意。钱锺书《管锥编》：“室家之累，于身最切，举是以概忧生之嗟耳。”韵读：鱼部一一華、家。隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。","notes":"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。","partOrder":1,"anchorIds":[],"glossAnchorIds":[],"segmentIds":["seg-001","seg-002","seg-003","seg-004","seg-005","seg-006","seg-007","seg-008","seg-009","seg-010","seg-011","seg-012"]},{"id":"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2","annotationId":"0001","glossId":"0001-1","glossHref":"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1","materialId":"chengjunying-jiangjianyuan-zhuxi","materialTitle":"詩經注析","contributorLine":"现代 · 程俊英、蔣見元","publicationYear":1991,"layer":"span","layerLabel":"诗句片段","targetText":"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。","sourceLabel":"第 327-328 页","attributionLabel":"程俊英、蒋见元","sectionLabel":"题解","excerpt":"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！","fullText":"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。韵读：支部一一枝、知。隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！無家，与下章的“無室”，都是没有妻儿拖累之意。钱锺书《管锥编》：“室家之累，于身最切，举是以概忧生之嗟耳。”韵读：鱼部一一華、家。隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。","notes":"据 nyuan-zhuxi:0001-1:part-6\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]},{\"id\":\"seg-012:5-5:室\",\"segmentId\":\"seg-012\",\"segmentOrder\":12,\"surfaceText\":\"室\",\"charStart\":5,\"charEnd\":5,\"entryIds\":[\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\"],\"materialIds\":[\"chengjunying-jiangjianyuan-zhuxi\"]}],\"entries\":[{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。\",\"fullText\":\"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。韵读：支部一一枝、知。隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！無家，与下章的“無室”，都是没有妻儿拖累之意。钱锺书《管锥编》：“室家之累，于身最切，举是以概忧生之嗟耳。”韵读：鱼部一一華、家。隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！\",\"fullText\":\"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。韵读：支部一一枝、知。隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！無家，与下章的“無室”，都是没有妻儿拖累之意。钱锺书《管锥编》：“室家之累，于身最切，举是以概忧生之嗟耳。”韵读：鱼部一一華、家。隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:隰有萇楚\",\"seg-002:1-4:猗儺其枝\",\"seg-003:1-4:夭之沃沃\",\"seg-004:1-5:樂子之無知\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。\",\"fullText\":\"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。韵读：支部一一枝、知。隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！無家，与下章的“無室”，都是没有妻儿拖累之意。钱锺书《管锥编》：“室家之累，于身最切，举是以概忧生之嗟耳。”韵读：鱼部一一華、家。隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":3,\"anchorIds\":[\"seg-001:3-4:萇楚\",\"seg-002:1-2:猗儺\",\"seg-003:1-1:夭\",\"seg-003:3-4:沃沃\",\"seg-004:1-1:樂\",\"seg-004:2-2:子\",\"seg-004:4-5:無知\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\",\"anchor-3-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\ 沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":9,\"anchorIds\":[\"seg-010:4-4:實\",\"seg-010:1-2:猗儺\"],\"glossAnchorIds\":[\"anchor-9-1\",\"anchor-9-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-10\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：脂部一一實、室。\",\"fullText\":\"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。韵读：支部一一枝、知。隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！無家，与下章的“無室”，都是没有妻儿拖累之意。钱锺书《管锥编》：“室家之累，于身最切，举是以概忧生之嗟耳。”韵读：鱼部一一華、家。隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。實，果实。胡承珙《后笺》：“华实皆附于枝，枝既柔娜，则华实亦必从风而靡，虽概称猗儺不妨。”韵读：脂部一一實、室。\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":10,\"anchorIds\":[\"seg-010:4-4:實\",\"seg-012:5-5:室\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"隰有萇楚㊟傷亂離也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"隰有萇楚㊟傷亂離也。\",\"fullText\":\"隰有萇楚㊟傷亂離也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《隰有萇楚》三章，章四句。此遭亂詩也。《小序》之誤，不必深辯。即《集傳》以爲「政煩賦重，民不堪其苦」者，亦未爲得。以賦重不必怨及室家也。此必檜破民逃，自公族子姓以及小民之有室有家者，莫不扶老擕幼、挈妻抱子，相與號泣路歧，故有家不如無家之好，有知不如無知之安也。而公族子姓之爲室家累者，則尤甚合。觀前二篇，當是爲公室發者居多，如杜老之《哀王孫》、《哀江頭》等篇，舉其重而輕者自見耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《隰有萇楚》三章，章四句。此遭亂詩也。《小序》之誤，不必深辯。即《集傳》以爲「政煩賦重，民不堪其苦」者，亦未爲得。以賦重不必怨及室家也。此必檜破民逃，自公族子姓以及小民之有室有家者，莫不扶老擕幼、挈妻抱子，相與號泣路歧，故有家不如無家之好，有知不如無知之安也。而公族子姓之爲室家累者，則尤甚合。觀前二篇，當是爲公室發者居多，如杜老之《哀王孫》、《哀江頭》等篇，舉其重而輕者自見耳。\",\"fullText\":\"右《隰有萇楚》三章，章四句。此遭亂詩也。《小序》之誤，不必深辯。即《集傳》以爲「政煩賦重，民不堪其苦」者，亦未爲得。以賦重不必怨及室家也。此必檜破民逃，自公族子姓以及小民之有室有家者，莫不扶老擕幼、挈妻抱子，相與號泣路歧，故有家不如無家之好，有知不如無知之安也。而公族子姓之爲室家累者，則尤甚合。觀前二篇，當是爲公室發者居多，如杜老之《哀王孫》、《哀江頭》等篇，舉其重而輕者自見耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋萇楚〔《集傳》〕萇楚，銚弋，今羊桃也。子如小麥，亦似桃。〔陸氏璣曰〕葉長而狹，華紫赤色，其枝莖弱，引蔓於草上也。猗儺柔順也。夭少好貌。〔吕氏祖謙曰〕夭，如「厥草惟夭」之夭。沃沃光澤貌。子指萇楚也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋萇楚〔《集傳》〕萇楚，銚弋，今羊桃也。子如小麥，亦似桃。〔陸氏璣曰〕葉長而狹，華紫赤色，其枝莖弱，引蔓於草上也。猗儺柔順也。夭少好貌。〔吕氏祖謙曰〕夭，如「厥草惟夭」之夭。沃沃光澤貌。子指萇楚也。\",\"fullText\":\"集釋萇楚〔《集傳》〕萇楚，銚弋，今羊桃也。子如小麥，亦似桃。〔陸氏璣曰〕葉長而狹，華紫赤色，其枝莖弱，引蔓於草上也。猗儺柔順也。夭少好貌。〔吕氏祖謙曰〕夭，如「厥草惟夭」之夭。沃沃光澤貌。子指萇楚也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻枝四支。知同。本韻。華六麻。家同。本韻。實四質。室同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻枝四支。知同。本韻。華六麻。家同。本韻。實四質。室同。本韻。\",\"fullText\":\"標韻枝四支。知同。本韻。華六麻。家同。本韻。實四質。室同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId\":\"0005-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0005-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原 ":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"这是一首没落贵族悲观厌世的诗。桧国在东周初年被郑国所灭，此诗大约是桧将亡时的作品。方玉润《诗经原始》：“此必桧破民逃，自公族子姓以及小民之有室有家者，莫不扶老携幼，挈妻抱子，相与号泣路歧，故有家不如无家之好，有知不如无知之安也。而公族子姓之为室家累者则尤甚。”郭沫若《中国古代社会研究》：“这种极端的厌世思想在当时非贵族不能有，所以这诗也是破落贵族的大作。自己这样有知识挂虑，倒不如无知的草木！自己这样有妻儿牵连，倒不如无家无室的草木！做人的羡慕起草木的自由来，这怀疑厌世的程度真有点样子了。”方氏分析了诗的社会背景，郭氏分析了诗的内容和作者的身份，均合诗旨。而毛序云：“隰有苌楚，疾恙也。国人疾其君之淫恙而思无情欲者也。”这实在有点牛头不对马嘴了。照《隰有萇楚》所反映的这种情调，对后代的诗文影响很大。钱锺书先生《管锥编》举出许多例子，如元结《系乐府寿翁兴》：“借问多寿翁，何方自修育？唯云顺自然，忘情学草木。”姜夔《长亭怨》：“树若有情时，不会得青青如许。”杜甫《哀江头》：“人生有情泪沾臆，江水江花岂终极。”鲍溶《秋思》之三：“我忧长于生，安得及草木。”韦庄《台城》：“无情最是台城柳，依旧烟笼十里堤。”戴敦元《钱春》：“春与莺花都作达，人如木石定长生。”这种忧生之嗟延续了几千年，在诗歌的意境中别具一种低徊暗淡的美。但是“天若有情天亦老，人间正道是沧桑”，人生总应该是前进的。欣赏《诗经》三百篇时，我们还是不要受这首诗感染的好。\",\"fullText\":\"$22\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！\",\"fullText\":\"$23\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":2,\"anchorIds\":[\"seg-001:1-4:隰有萇楚\",\"seg-002:1-4:猗儺其枝\",\"seg-003:1-4:夭之沃沃\",\"seg-004:1-5:樂子之無知\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-3\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"萇楚，即羊桃、猕猴桃。攀援藤本植物，果实可食。猗儺，双声，音义同“婀娜”，鲁诗作“阿挪”，一语之转，柔美貌。夭，少好、嫩美。按夭的本义是屈。说文：“夭，屈也。从大，象形。”这是象植物萌芽初生、尚未挺直之形，引申为植物少壮之貌，如《周南·桃夭》“桃之夭夭”。之，语气词，作用同“兮”。沃沃，少嫩漂亮貌。毛传：“沃沃，壮佼也。”孔疏：“言其少壮而佼好也。”樂，欢喜。此处作动词用，含有“羡慕”之意。子，指萇楚。無知，没有知觉、没有感情。毛序云：“思无情欲者也。”解“知”为“情欲”；郑笺申之，解“知”为“妃匹”之“匹”，都是拘执于二、三章的“無室”“無家”而言，不可从。这句大意是忧患太深，反而羡慕草木的无知无觉。\",\"fullText\":\"$24\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":3,\"anchorIds\":[\"seg-001:3-4:萇楚\",\"seg-002:1-2:猗儺\",\"seg-003:1-1:夭\",\"seg-003:3-4:沃沃\",\"seg-004:1-1:樂\",\"seg-004:2-2:子\",\"seg-004:4-5:無知\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\",\"anchor-3-4\",\"anchor-3-5\",\"anchor-3-6\",\"anchor-3-7\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0001-1:part-4\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/chengjunying-jiangjianyuan-zhuxi/0001-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"spa 现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"隰有萇楚，猗儺其枝。夭之沃沃，樂子之無知！隰有萇楚，猗儺其華。夭之沃沃，樂子之無家！隰有萇楚，猗儺其實。夭之沃沃，樂子之無室。\",\"sourceLabel\":\"第 327-328 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"题解\",\"excerpt\":\"韵读：脂部一一實、室。\",\"fullText\":\"$2b\",\"notes\":\"据 PDF 327-328 页文字层与上下文互校整理；剔除了下一首《匪風》的串页内容，并将“隰”“萇”“猗儺”等字按原诗校正。\",\"partOrder\":10,\"anchorIds\":[\"seg-010:4-4:實\",\"seg-012:5-5:室\"],\"glossAnchorIds\":[\"anchor-10-1\",\"anchor-10-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"隰有萇楚㊟傷亂離也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"隰有萇楚㊟傷亂離也。\",\"fullText\":\"隰有萇楚㊟傷亂離也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"右《隰有萇楚》三章，章四句。此遭亂詩也。《小序》之誤，不必深辯。即《集傳》以爲「政煩賦重，民不堪其苦」者，亦未爲得。以賦重不必怨及室家也。此必檜破民逃，自公族子姓以及小民之有室有家者，莫不扶老擕幼、挈妻抱子，相與號泣路歧，故有家不如無家之好，有知不如無知之安也。而公族子姓之爲室家累者，則尤甚合。觀前二篇，當是爲公室發者居多，如杜老之《哀王孫》、《哀江頭》等篇，舉其重而輕者自見耳。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"正序\",\"excerpt\":\"右《隰有萇楚》三章，章四句。此遭亂詩也。《小序》之誤，不必深辯。即《集傳》以爲「政煩賦重，民不堪其苦」者，亦未爲得。以賦重不必怨及室家也。此必檜破民逃，自公族子姓以及小民之有室有家者，莫不扶老擕幼、挈妻抱子，相與號泣路歧，故有家不如無家之好，有知不如無知之安也。而公族子姓之爲室家累者，則尤甚合。觀前二篇，當是爲公室發者居多，如杜老之《哀王孫》、《哀江頭》等篇，舉其重而輕者自見耳。\",\"fullText\":\"右《隰有萇楚》三章，章四句。此遭亂詩也。《小序》之誤，不必深辯。即《集傳》以爲「政煩賦重，民不堪其苦」者，亦未爲得。以賦重不必怨及室家也。此必檜破民逃，自公族子姓以及小民之有室有家者，莫不扶老擕幼、挈妻抱子，相與號泣路歧，故有家不如無家之好，有知不如無知之安也。而公族子姓之爲室家累者，則尤甚合。觀前二篇，當是爲公室發者居多，如杜老之《哀王孫》、《哀江頭》等篇，舉其重而輕者自見耳。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0003-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"集釋萇楚〔《集傳》〕萇楚，銚弋，今羊桃也。子如小麥，亦似桃。〔陸氏璣曰〕葉長而狹，華紫赤色，其枝莖弱，引蔓於草上也。猗儺柔順也。夭少好貌。〔吕氏祖謙曰〕夭，如「厥草惟夭」之夭。沃沃光澤貌。子指萇楚也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集釋\",\"excerpt\":\"集釋萇楚〔《集傳》〕萇楚，銚弋，今羊桃也。子如小麥，亦似桃。〔陸氏璣曰〕葉長而狹，華紫赤色，其枝莖弱，引蔓於草上也。猗儺柔順也。夭少好貌。〔吕氏祖謙曰〕夭，如「厥草惟夭」之夭。沃沃光澤貌。子指萇楚也。\",\"fullText\":\"集釋萇楚〔《集傳》〕萇楚，銚弋，今羊桃也。子如小麥，亦似桃。〔陸氏璣曰〕葉長而狹，華紫赤色，其枝莖弱，引蔓於草上也。猗儺柔順也。夭少好貌。〔吕氏祖謙曰〕夭，如「厥草惟夭」之夭。沃沃光澤貌。子指萇楚也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/148-xi-you-chang-chu/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"標韻枝四支。知同。本韻。華六麻。家同。本韻。實四質。室同。本韻。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"標韻\",\"excerpt\":\"標韻枝四支。知同。本韻。華六麻。家同。本韻。實四質。室同。本韻。\",\"fullText\":\"標韻枝四支。知同。本韻。華六麻。家同。本韻。實四質。室同。本韻。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0005-1:part-1\",\"annotationId\":\"0005\",\"glossId
