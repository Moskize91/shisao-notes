刺。程、蒋释“洒”为高峻貌，“浼浼”为水势平缓貌，“不殄”为不断绝；意谓所求的和美婚配已不可得，而丑恶现实持续不去。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:4-4:洒\",\"seg-006:3-4:浼浼\",\"seg-008:3-4:不殄\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/chengjunying-jiangjianyuan-zhuxi/0003-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新台有洒，河水浼浼。燕婉之求，籧篨不殄！\",\"sourceLabel\":\"第 92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"意谓所求的和美婚配已不可得，而丑恶现实持续不去。\",\"fullText\":\"次章承上强化讽刺。程、蒋释“洒”为高峻貌，“浼浼”为水势平缓貌，“不殄”为不断绝；意谓所求的和美婚配已不可得，而丑恶现实持续不去。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鱼网之设，鸿则离之。燕婉之求，得此戚施。\",\"sourceLabel\":\"第 92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章以“鱼网得鸿”为喻收束全篇。程、蒋释“离”为附着、获得，“戚施”为丑恶之人，\",\"fullText\":\"末章以“鱼网得鸿”为喻收束全篇。程、蒋释“离”为附着、获得，“戚施”为丑恶之人，指出此章以“所得非所求”直刺宣公强夺婚姻、败坏人伦。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-2:鱼网\",\"seg-010:1-1:鸿\",\"seg-010:3-3:离\",\"seg-012:3-4:戚施\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鱼网之设，鸿则离之。燕婉之求，得此戚施。\",\"sourceLabel\":\"第 92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"指出此章以“所得非所求”直刺宣公强夺婚姻、败坏人伦。\",\"fullText\":\"末章以“鱼网得鸿”为喻收束全篇。程、蒋释“离”为附着、获得，“戚施”为丑恶之人，指出此章以“所得非所求”直刺宣公强夺婚姻、败坏人伦。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"新臺㊟刺齊女之從衛宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注直断《新臺》为“刺齊女之從衛宣公”，\",\"fullText\":\"方玉润题注直断《新臺》为“刺齊女之從衛宣公”，将批判对象同时指向宣公强纳与齐女失节。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"新臺㊟刺齊女之從衛宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"将批判对象同时指向宣公强纳与齐女失节。\",\"fullText\":\"方玉润题注直断《新臺》为“刺齊女之從衛宣公”，将批判对象同时指向宣公强纳与齐女失节。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评先据《小序》《大序》确认卫宣公纳媳事本无可疑，并质疑《集传》“于诗未有考”之说。\",\"fullText\":\"方玉润总评先据《小序》《大序》确认卫宣公纳媳事本无可疑，并质疑《集传》“于诗未有考”之说。其进一步改判本篇主刺宣姜：谓《静女》主刺宣公而带及夫人，《新臺》则主刺夫人而并丑宣公；宣姜本为伋妻，至新臺而为伋母，既失廉耻又将顺其恶，虽非本意亦难辞咎。故诗人以“臺”与“河”直指其地，以“鱼网鸿离”写所得非所求，极言其逆理亂倫之羞，认为此诗恶之已甚，故“直刺无隐”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其进一步改判本篇主刺宣姜：谓《静女》主刺宣公而带及夫人，《新臺》则主刺夫人而并丑宣公；宣姜本为伋妻，至新臺而为伋母，既失廉耻又将顺其恶，虽非本意亦难辞咎。\",\"fullText\":\"方玉润总评先据《小序》《大序》确认卫宣公纳媳事本无可疑，并质疑《集传》“于诗未有考”之说。其进一步改判本篇主刺宣姜：谓《静女》主刺宣公而带及夫人，《新臺》则主刺夫人而并丑宣公；宣姜本为伋妻，至新臺而为伋母，既失廉耻又将顺其恶，虽非本意亦难辞咎。故诗人以“臺”与“河”直指其地，以“鱼网鸿离”写所得非所求，极言其逆理亂倫之羞，认为此诗恶之已甚，故“直刺无隐”。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"se rceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"方玉润集释依次训“新臺”“泚”“瀰瀰”“燕”“婉”“籧篨”“鮮”“洒”“浼浼”“殄”“鴻”“離”“戚施”：\",\"fullText\":\"方玉润集释依次训“新臺”“泚”“瀰瀰”“燕”“婉”“籧篨”“鮮”“洒”“浼浼”“殄”“鴻”“離”“戚施”：以“新臺”引《爾雅》“四方而高曰臺”，又释“泚”为水中臺影鲜明之貌，“瀰瀰”为盛；并释“燕”为安、“婉”为顺，“籧篨”为拥肿不能俯之醜疾，“鮮”为善；“洒”为高峻，“浼浼”为平，“殄”引郑康成作“腆”；又释“鴻”为雁之大者，“離”为丽，并引《晉語》“籧篨不可使俯，戚施不可使仰”以明戚施为醜疾。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:1-2:新臺\",\"seg-001:4-4:泚\",\"seg-002:3-4:瀰瀰\",\"seg-003:1-1:燕\",\"seg-003:2-2:婉\",\"seg-004:1-2:籧篨\",\"seg-004:4-4:鮮\",\"seg-005:4-4:洒\",\"seg-006:3-4:浼浼\",\"seg-008:4-4:殄\",\"seg-010:1-1:鴻\",\"seg-010:3-3:離\",\"seg-012:3-4:戚施\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\",\"anchor-1-6\",\"anchor-1-7\",\"anchor-1-8\",\"anchor-1-9\",\"anchor-1-10\",\"anchor-1-11\",\"anchor-1-12\",\"anchor-1-13\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-008\",\"seg-010\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0004-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"新臺有泚河水瀰瀰燕婉之求籧篨不鮮新臺有洒河水浼浼籧篨不殄鴻則離之得此戚施\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"集释\",\"excerpt\":\"以“新臺”引《爾雅》“四方而高曰臺”，又释“泚”为水中臺影鲜明之貌，“瀰瀰”为盛；\",\"fullText\":\"方玉润集释依次训“新臺”“泚”“瀰瀰”“燕”“婉”“籧篨”“鮮”“洒”“浼浼”“殄”“鴻”“離”“戚施”：以“新臺”引《爾雅》“四方而高曰臺”，又释“泚”为水中臺影鲜明之貌，“瀰瀰”为盛；并释“燕”为安、“婉”为顺，“籧篨”为拥肿不能俯之醜疾，“鮮”为善；“洒”为高峻，“浼浼”为平，“殄”引郑康成作“腆”；又释“鴻”为雁之大者，“離”为丽，并引《晉語》“籧篨不可使俯，戚施不可使仰”以明戚施为醜疾。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-001:1-2:新臺\",\"seg-001:4-4:泚\",\"seg-002:3-4:瀰瀰\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-008\",\" ",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"序：《新臺》，刺衛宣公也。\",\"fullText\":\"序：《新臺》，刺衛宣公也。納伋之妻，作新臺於河上而要之。國人惡之，而作是詩也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0001-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"preface\",\"layerLabel\":\"篇序\",\"targetText\":\"新臺刺衛宣公也納伋之妻作新臺於河上而要之國人惡之而作是詩也\",\"sourceLabel\":null,\"attributionLabel\":\"诗序\",\"sectionLabel\":\"序\",\"excerpt\":\"納伋之妻，作新臺於河上而要之。國人惡之，而作是詩也。\",\"fullText\":\"序：《新臺》，刺衛宣公也。納伋之妻，作新臺於河上而要之。國人惡之，而作是詩也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有泚河水彌彌燕婉之求籧篨不鮮\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。\",\"fullText\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。燕，安。婉，順也。籧篨，不能俯者。箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:4-4:泚\",\"seg-002:3-4:彌彌\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有泚河水彌彌燕婉之求籧篨不鮮\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"燕，安。婉，順也。籧篨，不能俯者。\",\"fullText\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。燕，安。婉，順也。籧篨，不能俯者。箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-1:燕\",\"seg-003:2-2:婉\",\"seg-004:1-2:籧篨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有泚河水彌彌燕婉之求籧篨不鮮\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"fullText\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。燕，安。婉，順也。籧篨，不能俯者。箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-004:4-4:鮮\",\"seg-003:1-2:燕婉\",\"seg-004:1-2:籧篨\"],\"glossAnchorIds\":[\"anchor-3-1\",\"anchor-3-2\",\"anchor-3-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-1\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有灑河水浼浼燕婉之求籧篨不殄\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"灑，高峻也。浼浼，平地也。\",\"fullText\":\"灑，高峻也。浼浼，平地也。殄，絕也。箋云：殄當作腆。腆，善也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-005:4-4:灑\",\"seg-006:3-4:浼浼\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0003-1:part-2\",\"annotationId\":\"0003\",\"glossId\":\"0003-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0003-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有灑河水浼浼燕婉之求籧篨不殄\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"殄，絕也。箋云：殄當作腆。腆，善也。\",\"fullText\":\"灑，高峻也。浼浼，平地也。殄，絕也。箋云：殄當作腆。腆，善也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-008:4-4:殄\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-1\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"魚網之設鴻則離之燕婉之求得此戚施\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"言所得非所求也。箋云：設魚網者宜得魚，鴻乃鳥也，反離焉。猶齊女以禮來求世子，而得宣公。\",\"fullText\":\"言所得非所求也。箋云：設魚網者宜得魚，鴻乃鳥也，反離焉。猶齊女以禮來求世子，而得宣公。戚施，不能仰者。箋云：戚施面柔，下人以色，故不能仰也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-2:魚網\",\"seg-010:1-1:鴻\",\"seg-010:3-3:離\",\"seg-011:4-4:求\",\"seg-012:1-1:得\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\",\"anchor-1-5\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0004-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"魚網之設鴻則離之燕婉之求得此戚施\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"戚施，不能仰者。箋云：戚施面柔，下人以色，故不能仰也。\",\"fullText\":\"言所得非所求也。箋云：設魚網者宜得魚，鴻乃鳥也，反離焉。猶齊女以禮來求世子，而得宣公。戚施，不能仰者。箋云：戚施面柔，下人以色，故不能仰也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-012:3-4:戚施\"],\"glossAnchorIds\":[\"anchor-2-1\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"新臺\",\"sourceLabel\":\"第 52 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"屈万里于《新臺》首条注释据《詩序》述其事，以卫宣公夺取伋妻为背景，\",\"fullText\":\"屈万里于《新臺》首条注释据《詩序》述其事，以卫宣公夺取伋妻为背景，定此篇为讽刺宣公乱伦强夺之作。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/quwanli-quanshi/0001-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"新臺\",\"sourceLabel\":\"第 52 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"总说\",\"excerpt\":\"定此篇为讽刺宣公乱伦强夺之作。\",\"fullText\":\"屈万里于《新臺》首条注释据《詩序》述其事，以卫宣公夺取伋妻为背景，定此篇为讽刺宣公乱伦强夺之作。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"quwanli-quanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"新臺有泚，河水瀰瀰。燕婉之求，籧篨不鮮。新臺有洒，河水浼浼。燕婉之求，籧篨不殄。魚網之設，鴻則離之。燕婉之求，得此戚施。\",\"sourceLabel\":\"第 52 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"屈万里释“泚”为鮮明貌（《說文》作玼），“瀰瀰”为水滿。\",\"fullText\":\"屈万里释“泚”为鮮明貌（《說文》作玼），“瀰瀰”为水滿。又释“燕婉”为美色，“籧篨”为不能俯之醜疾，并以“不鮮”言其丑而不早死。次章释“洒”为高峻，“浼浼”见《韓詩》作浘浘，“不殄”犹不死。末章释“離”为罹，“戚施”为不能仰之醜疾，归结此诗为“求美偶而反得丑夫”的讽刺。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:4-4:泚\",\"seg-002:3-4:瀰瀰\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/quwanli-quanshi/0002-1\",\"materialId\":\"quwanli-quanshi\",\"materialTitle\":\"詩經詮釋\",\"contributorLine\":\"现代 · 屈萬里\",\"publicationYear\":1983,\"layer\":\"term\",\"layerLabel\":\"字词注\",\"targetText\":\"新臺有泚，河水瀰瀰。燕婉之求，籧篨不鮮。新臺有洒，河水浼浼。燕婉之求，籧篨不殄。魚網之設，鴻則離之。燕婉之求，得此戚施。\",\"sourceLabel\":\"第 52 页\",\"attributionLabel\":\"屈万里\",\"sectionLabel\":\"注释\",\"excerpt\":\"又释“燕婉”为美色，“籧篨”为不能俯之醜疾，并以“不鮮”言其丑而不早死。\",\"fullText\":\"屈万里释“泚”为鮮明貌（《說文》作玼），“瀰瀰”为水滿。又释“燕婉”为美色，“籧篨”为不能俯之醜疾，并以“不鮮”言其丑而不早死。次章释“洒”为高峻，“浼浼”见《韓詩》作浘浘，“不殄”犹不死。末章释“離”为罹，“戚施”为不能仰之醜疾，归结此诗为“求美偶而反得丑夫”的讽刺。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-2:燕婉\",\"seg-004:1-2:籧篨\",\"seg-004:3-4:不鮮\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\",\"seg-005\",\"seg-006\",\"seg-007\",\"seg-008\",\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"quwanli-quanshi:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/quw 锋芒。\",\"fullText\":\"题解将《新台》定为人民讽刺卫宣公劫夺儿媳的诗，并据《左传》《史记》相关记载解释其历史背景。程、蒋强调诗中通过“燕婉之求”与“得此戚施”的强烈反差，揭露乱伦与强夺造成的理想破灭，具有鲜明的讽刺锋芒。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新台有泚，河水瀰瀰。燕婉之求，籧篨不鲜！\",\"sourceLabel\":\"第 91-92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"首章先写景寓刺。程、蒋释“泚”为鲜明，“瀰瀰”为水盛；\",\"fullText\":\"首章先写景寓刺。程、蒋释“泚”为鲜明，“瀰瀰”为水盛；并释“燕婉”为安和美好配偶之意，“籧篨”为丑恶者，指出“燕婉之求，籧篨不鲜”正写齐女求佳偶而反遭宣公劫夺的强烈反差。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:4-4:泚\",\"seg-002:3-4:瀰瀰\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/chengjunying-jiangjianyuan-zhuxi/0002-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新台有泚，河水瀰瀰。燕婉之求，籧篨不鲜！\",\"sourceLabel\":\"第 91-92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"并释“燕婉”为安和美好配偶之意，“籧篨”为丑恶者，指出“燕婉之求，籧篨不鲜”正写齐女求佳偶而反遭宣公劫夺的强烈反差。\",\"fullText\":\"首章先写景寓刺。程、蒋释“泚”为鲜明，“瀰瀰”为水盛；并释“燕婉”为安和美好配偶之意，“籧篨”为丑恶者，指出“燕婉之求，籧篨不鲜”正写齐女求佳偶而反遭宣公劫夺的强烈反差。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-2:燕婉\",\"seg-004:1-2:籧篨\",\"seg-003:1-4:燕婉之求\",\"seg-004:1-4:籧篨不鲜\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\",\"anchor-2-4\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-0 :\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鱼网之设，鸿则离之。燕婉之求，得此戚施。\",\"sourceLabel\":\"第 92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"末章以“鱼网得鸿”为喻收束全篇。程、蒋释“离”为附着、获得，“戚施”为丑恶之人，\",\"fullText\":\"末章以“鱼网得鸿”为喻收束全篇。程、蒋释“离”为附着、获得，“戚施”为丑恶之人，指出此章以“所得非所求”直刺宣公强夺婚姻、败坏人伦。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-009:1-2:鱼网\",\"seg-010:1-1:鸿\",\"seg-010:3-3:离\",\"seg-012:3-4:戚施\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\",\"anchor-1-3\",\"anchor-1-4\"],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"chengjunying-jiangjianyuan-zhuxi:0004-1:part-2\",\"annotationId\":\"0004\",\"glossId\":\"0004-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/chengjunying-jiangjianyuan-zhuxi/0004-1\",\"materialId\":\"chengjunying-jiangjianyuan-zhuxi\",\"materialTitle\":\"詩經注析\",\"contributorLine\":\"现代 · 程俊英、蔣見元\",\"publicationYear\":1991,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"鱼网之设，鸿则离之。燕婉之求，得此戚施。\",\"sourceLabel\":\"第 92 页\",\"attributionLabel\":\"程俊英、蒋见元\",\"sectionLabel\":\"章解\",\"excerpt\":\"指出此章以“所得非所求”直刺宣公强夺婚姻、败坏人伦。\",\"fullText\":\"末章以“鱼网得鸿”为喻收束全篇。程、蒋释“离”为附着、获得，“戚施”为丑恶之人，指出此章以“所得非所求”直刺宣公强夺婚姻、败坏人伦。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[\"seg-009\",\"seg-010\",\"seg-011\",\"seg-012\"]},{\"id\":\"fangyurun-yuanshi:0001-1:part-1\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"新臺㊟刺齊女之從衛宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"方玉润题注直断《新臺》为“刺齊女之從衛宣公”，\",\"fullText\":\"方玉润题注直断《新臺》为“刺齊女之從衛宣公”，将批判对象同时指向宣公强纳与齐女失节。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0001-1:part-2\",\"annotationId\":\"0001\",\"glossId\":\"0001-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0001-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"新臺㊟刺齊女之從衛宣公也。\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"题注\",\"excerpt\":\"将批判对象同时指向宣公强纳与齐女失节。\",\"fullText\":\"方玉润题注直断《新臺》为“刺齊女之從衛宣公”，将批判对象同时指向宣公强纳与齐女失节。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-1\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"方玉润总评先据《小序》《大序》确认卫宣公纳媳事本无可疑，并质疑《集传》“于诗未有考”之说。\",\"fullText\":\"方玉润总评先据《小序》《大序》确认卫宣公纳媳事本无可疑，并质疑《集传》“于诗未有考”之说。其进一步改判本篇主刺宣姜：谓《静女》主刺宣公而带及夫人，《新臺》则主刺夫人而并丑宣公；宣姜本为伋妻，至新臺而为伋母，既失廉耻又将顺其恶，虽非本意亦难辞咎。故诗人以“臺”与“河”直指其地，以“鱼网鸿离”写所得非所求，极言其逆理亂倫之羞，认为此诗恶之已甚，故“直刺无隐”。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[],\"glossAnchorIds\":[],\"segmentIds\":[]},{\"id\":\"fangyurun-yuanshi:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/fangyurun-yuanshi/0002-1\",\"materialId\":\"fangyurun-yuanshi\",\"materialTitle\":\"诗经原始(上下)\",\"contributorLine\":\"清 · 方玉润、李先耕\",\"publicationYear\":1986,\"layer\":\"global\",\"layerLabel\":\"全篇总说\",\"targetText\":\"总评\",\"sourceLabel\":null,\"attributionLabel\":\"方玉润\",\"sectionLabel\":\"总评\",\"excerpt\":\"其进一步改判本篇主刺宣姜：谓《静女》主刺宣公而带及夫人，《新臺》则主刺夫人而并丑宣公；宣姜本为伋妻，至新臺而为伋母，既失廉耻又将顺其恶，虽非本意亦难辞咎。\",\"fullText\":\"方玉润总评先据《小序》《大序》确认卫宣公纳媳事本无可疑，并质疑《集传》“于诗未有考”之说。其进一步改判本篇主刺宣姜：谓《静女》主刺宣公而带及夫人，《新臺》则主刺夫人而并 汙穢，反於河上而為淫昏之行。\",\"fullText\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。燕，安。婉，順也。籧篨，不能俯者。箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"notes\":null,\"partOrder\":1,\"anchorIds\":[\"seg-001:4-4:泚\",\"seg-002:3-4:彌彌\"],\"glossAnchorIds\":[\"anchor-1-1\",\"anchor-1-2\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-2\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有泚河水彌彌燕婉之求籧篨不鮮\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"燕，安。婉，順也。籧篨，不能俯者。\",\"fullText\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。燕，安。婉，順也。籧篨，不能俯者。箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"notes\":null,\"partOrder\":2,\"anchorIds\":[\"seg-003:1-1:燕\",\"seg-003:2-2:婉\",\"seg-004:1-2:籧篨\"],\"glossAnchorIds\":[\"anchor-2-1\",\"anchor-2-2\",\"anchor-2-3\"],\"segmentIds\":[\"seg-001\",\"seg-002\",\"seg-003\",\"seg-004\"]},{\"id\":\"maoheng-zhushu-kr1c0004:0002-1:part-3\",\"annotationId\":\"0002\",\"glossId\":\"0002-1\",\"glossHref\":\"/shijing/gloss/043-xin-tai/maoheng-zhushu-kr1c0004/0002-1\",\"materialId\":\"maoheng-zhushu-kr1c0004\",\"materialTitle\":\"毛詩注疏\",\"contributorLine\":\"漢唐 · 毛亨、鄭氏、孔穎達\",\"publicationYear\":653,\"layer\":\"span\",\"layerLabel\":\"诗句片段\",\"targetText\":\"新臺有泚河水彌彌燕婉之求籧篨不鮮\",\"sourceLabel\":null,\"attributionLabel\":\"毛传\",\"sectionLabel\":null,\"excerpt\":\"箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"fullText\":\"泚，鮮明貌。彌彌，盛貌。水所以絜汙穢，反於河上而為淫昏之行。燕，安。婉，順也。籧篨，不能俯者。箋云：鮮，善也。伋之妻，齊女，來嫁於衛。其心本求燕婉之人，謂伋也，反得籧篨不善，謂宣公也。籧篨口柔，常觀人顏色而為之辭，故不能俯也。\",\"notes\":null,\"partOrder\":3,\"anchorIds\":[\"seg-004:4-4:鮮\",\"seg-003:1-2:燕婉\",\"seg-004:1-2:籧篨\"],\"glossAnchorIds\":
